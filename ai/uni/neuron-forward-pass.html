<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="调整输入、权重和偏置，计算神经元加权和及 sigmoid 输出。"><title>神经元前向计算器 · 大学人工智能</title><link rel="stylesheet" href="../../assets/css/subject-learning.css"></head>
<body data-subject="ai" data-stage="uni"><a class="skip-link" href="#main-content">跳到主要内容</a><div class="shell">
  <nav class="topbar breadcrumbs" aria-label="面包屑"><a href="../../index.html">首页</a><span aria-hidden="true">›</span><a href="../index.html">人工智能</a><span aria-hidden="true">›</span><a href="index.html">大学</a><span aria-hidden="true">›</span><span aria-current="page">神经元前向计算器</span></nav>
  <main id="main-content"><header class="hero"><p class="eyebrow">大学 · 神经网络基础</p><h1>🧠 神经元前向计算器</h1><p>神经元将输入按权重缩放、加上偏置，再通过激活函数得到输出。调整参数并逐步复核公式。</p></header>
    <section class="panel learning-layout"><div class="visual"><h2>单个神经元</h2>
      <svg id="neuron-diagram" class="neuron-svg" viewBox="0 0 500 270" role="img" aria-labelledby="neuron-title neuron-description"><title id="neuron-title">双输入单输出神经元示意图</title><desc id="neuron-description">两个输入分别乘以权重后汇入神经元，加上偏置并通过 sigmoid 激活，得到一个输出。</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#59667a"/></marker></defs><line x1="96" y1="74" x2="315" y2="125" stroke="#59667a" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="96" y1="195" x2="315" y2="145" stroke="#59667a" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="382" y1="135" x2="452" y2="135" stroke="#59667a" stroke-width="2" marker-end="url(#arrowhead)"/><circle cx="68" cy="70" r="28" fill="#e6e9fa" stroke="#454190" stroke-width="2"/><circle cx="68" cy="200" r="28" fill="#e6e9fa" stroke="#454190" stroke-width="2"/><circle cx="350" cy="135" r="36" fill="#e8f4e9" stroke="#247143" stroke-width="2"/><text id="diagram-x1" x="68" y="76" text-anchor="middle" font-size="16" fill="#20273a">x₁=1.0</text><text id="diagram-x2" x="68" y="206" text-anchor="middle" font-size="16" fill="#20273a">x₂=0.5</text><text id="diagram-w1" x="202" y="80" text-anchor="middle" font-size="15" fill="#20273a">w₁=0.8</text><text id="diagram-w2" x="202" y="194" text-anchor="middle" font-size="15" fill="#20273a">w₂=-0.4</text><text x="350" y="140" text-anchor="middle" font-size="15" fill="#20273a">Σ + b</text><text x="419" y="116" text-anchor="middle" font-size="12" fill="#20273a">sigmoid</text><text id="diagram-y" x="478" y="141" text-anchor="middle" font-size="15" fill="#20273a">y</text></svg>
      <div class="metric-row"><div class="metric"><span>加权和 z</span><strong id="z-output">—</strong></div><div class="metric"><span>sigmoid 输出</span><strong id="activation-output">—</strong></div></div>
    </div><div class="controls"><div class="control"><label for="input-x1">输入 x₁：<output id="value-x1" for="input-x1">1.0</output></label><input id="input-x1" type="range" min="0" max="1" step="0.1" value="1"></div>
      <div class="control"><label for="weight-w1">权重 w₁：<output id="value-w1" for="weight-w1">0.8</output></label><input id="weight-w1" type="range" min="-2" max="2" step="0.1" value="0.8"></div>
      <div class="control"><label for="input-x2">输入 x₂：<output id="value-x2" for="input-x2">0.5</output></label><input id="input-x2" type="range" min="0" max="1" step="0.1" value="0.5"></div>
      <div class="control"><label for="weight-w2">权重 w₂：<output id="value-w2" for="weight-w2">-0.4</output></label><input id="weight-w2" type="range" min="-2" max="2" step="0.1" value="-0.4"></div>
      <div class="control"><label for="bias-b">偏置 b：<output id="value-b" for="bias-b">0.2</output></label><input id="bias-b" type="range" min="-2" max="2" step="0.1" value="0.2"></div>
      <div class="button-row"><button type="button" id="calculate-button">计算神经元输出</button><button type="button" id="reset-button" class="secondary">恢复示例参数</button></div>
      <p id="neuron-feedback" class="status" role="status" aria-live="polite" aria-atomic="true">调整参数后，执行计算查看输出。</p>
      <p id="progress-status" class="note" role="status" aria-live="polite">学习进度保存在当前浏览器。</p>
    </div></section>
    <section class="panel"><h2>计算过程</h2><p id="weighted-sum" class="math-output">z = w₁x₁ + w₂x₂ + b</p><p id="activation-formula" class="math-output">σ(z) = 1 / (1 + e⁻ᶻ)</p><p class="note">sigmoid 把任意实数映射到 0 与 1 之间。这里演示单个神经元的一次前向计算，不等于完整的神经网络训练。</p></section>
  </main><footer class="footer-nav"><a href="index.html">← 返回大学人工智能</a></footer></div>
<script src="../../assets/js/subject-progress.js"></script><script>
(() => {
  const subject = 'ai', stage = 'uni', slug = 'neuron-forward-pass';
  const controls = {
    x1: document.getElementById('input-x1'), w1: document.getElementById('weight-w1'),
    x2: document.getElementById('input-x2'), w2: document.getElementById('weight-w2'), b: document.getElementById('bias-b')
  };
  const outputs = Object.fromEntries(Object.entries(controls).map(([key]) => [key, document.getElementById(`value-${key}`)]));
  const feedback = document.getElementById('neuron-feedback');
  const progressStatus = document.getElementById('progress-status');
  const fixed = {x1: 1, w1: 0.8, x2: 0.5, w2: -0.4, b: 0.2};
  function parameters() { return Object.fromEntries(Object.entries(controls).map(([key, input]) => [key, Number(input.value)])); }
  function format(value) { return Number(value).toFixed(1); }
  function updateDiagram() {
    const values = parameters();
    for (const [key, value] of Object.entries(values)) outputs[key].value = format(value);
    document.getElementById('diagram-x1').textContent = `x₁=${format(values.x1)}`;
    document.getElementById('diagram-x2').textContent = `x₂=${format(values.x2)}`;
    document.getElementById('diagram-w1').textContent = `w₁=${format(values.w1)}`;
    document.getElementById('diagram-w2').textContent = `w₂=${format(values.w2)}`;
  }
  function clearOutput() {
    document.getElementById('z-output').textContent = '—';
    document.getElementById('activation-output').textContent = '—';
    document.getElementById('weighted-sum').textContent = 'z = w₁x₁ + w₂x₂ + b';
    document.getElementById('activation-formula').textContent = 'σ(z) = 1 / (1 + e⁻ᶻ)';
  }
  Object.values(controls).forEach(input => input.addEventListener('input', () => {
    updateDiagram(); clearOutput(); feedback.className = 'status'; feedback.textContent = '参数已改变；请重新计算神经元输出。';
  }));
  document.getElementById('calculate-button').addEventListener('click', () => {
    const {x1, w1, x2, w2, b} = parameters();
    const z = w1 * x1 + w2 * x2 + b;
    const activation = 1 / (1 + Math.exp(-z));
    document.getElementById('z-output').textContent = z.toFixed(2);
    document.getElementById('activation-output').textContent = activation.toFixed(4);
    document.getElementById('weighted-sum').textContent = `z = (${format(w1)} × ${format(x1)}) + (${format(w2)} × ${format(x2)}) + (${format(b)}) = ${z.toFixed(2)}`;
    document.getElementById('activation-formula').textContent = `σ(${z.toFixed(2)}) = 1 / (1 + e^(-(${z.toFixed(2)}))) = ${activation.toFixed(4)}`;
    feedback.className = 'status success'; feedback.textContent = '计算完成。加权和经过 sigmoid 后得到当前输出。';
    progressStatus.textContent = SubjectProgress.markComplete(subject, stage, slug)
      ? '本机已记录这个主题完成。' : '计算已完成；本机存储不可用，进度未能保存。';
  });
  document.getElementById('reset-button').addEventListener('click', () => {
    Object.entries(controls).forEach(([key, input]) => { input.value = String(fixed[key]); });
    updateDiagram(); clearOutput(); feedback.className = 'status'; feedback.textContent = '示例参数已恢复。执行计算查看结果。';
  });
  const prior = SubjectProgress.read(subject, stage);
  if (prior === null) progressStatus.textContent = '本机进度暂不可用；你仍可完成计算。';
  else if (prior[slug]) progressStatus.textContent = '本机已记录这个主题完成。';
  updateDiagram();
})();
</script></body></html>
