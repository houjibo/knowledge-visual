<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="初中人工智能：检查虚构训练样例中的冲突标签，观察复核和数据取舍如何改变简单分类预测。">
  <title>初中人工智能 · 知识可视化学习站</title>
  <link rel="stylesheet" href="../../assets/css/subject-learning.css">
</head>
<body data-subject="ai" data-stage="middle">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="shell">
    <nav class="topbar breadcrumbs" aria-label="面包屑">
      <a href="../../index.html">首页</a><span aria-hidden="true">›</span>
      <a href="../index.html">人工智能</a><span aria-hidden="true">›</span>
      <span aria-current="page">初中</span>
    </nav>
    <main id="main-content">
      <header class="hero">
        <p class="eyebrow">初中 · 数据与标签</p>
        <h1>数据标签侦察实验室</h1>
        <p>先找出相同特征下互相矛盾的标签，再决定如何处理，观察简单分类规则的预测会不会变化。</p>
      </header>
      <p class="status" id="stage-progress" role="status" aria-live="polite">正在读取本机学习进度…</p>
      <section class="cards" aria-label="初中人工智能主题">
        <a class="card topic-card" href="data-label-quality.html" data-topic-slug="data-label-quality">
          <span class="stage-label">互动主题</span>
          <strong>数据标签侦察实验室</strong>
          <p>检查冲突标签，比较沿用、更正或暂不纳入时的样例计数与预测。</p>
          <span class="card-state" data-completion></span>
        </a>
      </section>
      <section class="panel">
        <h2>你将练习什么？</h2>
        <ul>
          <li>分清样例里的特征和标签。</li>
          <li>发现相同线索下标签冲突时，简单规则会缺少确定答案。</li>
          <li>了解数据复核和取舍会改变后续预测。</li>
        </ul>
      </section>
    </main>
    <footer class="footer-nav"><a href="../index.html">← 返回人工智能</a></footer>
  </div>
  <script src="../../assets/js/subject-progress.js"></script>
  <script>
    const subject = 'ai', stage = 'middle', topics = ['data-label-quality'];
    function renderProgress() {
      const progress = SubjectProgress.read(subject, stage);
      const summary = document.getElementById('stage-progress');
      if (progress === null) {
        summary.textContent = '本机进度暂不可用；主题仍可正常学习。';
        return;
      }
      const completed = topics.filter(slug => progress[slug]).length;
      summary.textContent = completed ? `本机已记录完成 ${completed}/${topics.length} 个主题。` : `已完成 0/${topics.length} 个主题`;
      document.querySelectorAll('[data-topic-slug]').forEach(card => {
        card.querySelector('[data-completion]').textContent = progress[card.dataset.topicSlug] ? '✓ 已完成' : '';
      });
    }
    renderProgress();
    window.addEventListener('kv-progress-changed', renderProgress);
  </script>
</body>
</html>
