<html lang="zh-CN">
<head>

<body data-subject="computer" data-stage="uni">

  <div class="shell">
    <nav class="topbar breadcrumbs" aria-label="面包屑"><a href="../../index.html">首页</a><span aria-hidden="true">›</span><a href="../index.html">计算机</a><span aria-hidden="true">›</span><span aria-current="page">大学</span></nav>
    <main id="main-content">
      <header class="hero"><p class="eyebrow">大学 · 数据结构</p><h1>栈与队列：相同到达，不同取出</h1><p>同一批物件分别进入两种容器。观察取出位置怎样改变下一件，再用预测检验自己的理解。</p></header>
      <p class="status" id="stage-progress" role="status" aria-live="polite">正在读取本机学习进度…</p>
      <section class="cards" aria-label="大学计算机主题">
        <a class="card topic-card" href="stack-queue.html" data-topic-slug="stack-queue"><span class="stage-label">互动主题 · 数据结构</span><strong>栈与队列对照实验室</strong><p>同时加入 A–F 物件，预测栈顶与队首的取出结果，并比较中途加入后的变化。</p><span class="card-state" data-completion></span></a>
      </section>
      <section class="panel"><h2>你将练习什么？</h2><ul><li>解释栈的后进先出与队列的先进先出。</li><li>在同一组加入操作后预测两侧下一件。</li><li>在取出与再次加入交错时追踪两侧剩余状态。</li></ul></section>
    </main>
    <footer class="footer-nav"><a href="../index.html">← 返回计算机</a>　·　<a href="../high/index.html">复习高中查找策略</a></footer>

  <script src="../../assets/js/subject-progress.js"></script>
  <script>
    (function () {
      function renderProgress() {
        const value = SubjectProgress.read('computer', 'uni');
        const badge = document.querySelector('[data-completion]');
        if (value === null) {
          document.getElementById('stage-progress').textContent = '本机进度暂不可用；主题仍可正常学习。';
          badge.textContent = '';
          return;
        }
        const done = value['stack-queue'] === true;
        document.getElementById('stage-progress').textContent = done ? '本机已记录完成 1/1 个主题。' : '已完成 0/1 个主题';
        badge.textContent = done ? '✓ 已完成' : '';
      }
      renderProgress();
      window.addEventListener('pageshow', renderProgress);
      window.addEventListener('kv-progress-changed', renderProgress);
      window.addEventListener('storage', renderProgress);
    })();
  </script>
