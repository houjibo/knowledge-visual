  <script src="../../assets/js/subject-progress.js"></script>
  <script>
    (function () {
      const subject = 'computer', stage = 'high', slug = 'search-strategies';
      function renderProgress() {
        const progress = SubjectProgress.read(subject, stage);
        const summary = document.getElementById('stage-progress');
        const badge = document.querySelector('[data-completion]');
        if (progress === null) { summary.textContent = '本机进度暂不可用；主题仍可正常学习。'; badge.textContent = ''; return; }
        const complete = progress[slug] === true;
        summary.textContent = complete ? '本机已记录完成 1/1 个主题。' : '已完成 0/1 个主题';
        badge.textContent = complete ? '✓ 已完成' : '';
      }
      renderProgress();
      window.addEventListener('kv-progress-changed', renderProgress);
      window.addEventListener('storage', renderProgress);
    })();
  </script>
