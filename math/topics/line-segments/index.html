<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识线段</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .nav-bar {
      display: flex; align-items: center; padding: 12px 16px;
      background: white; border-radius: 16px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      text-decoration: none; color: #4A90D9; font-size: 16px; font-weight: 600;
    }
    .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; color: #1D1D1F; }

    /* 通用 */
    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* === 模式1: 认识 === */
    .learn-card {
      background: white; border-radius: 20px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
      border-left: 4px solid #4A90D9; text-align: left;
    }
    .learn-title { font-size: 20px; font-weight: 700; color: #4A90D9; margin-bottom: 16px; text-align: center; }
    .learn-text { font-size: 17px; line-height: 2; color: #1D1D1F; }
    .learn-text .hl { color: #4A90D9; font-weight: 700; }
    .feature-box { display: flex; justify-content: center; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
    .feature-item { background: #E3F2FD; border-radius: 16px; padding: 16px 20px; min-width: 130px; text-align: center; }
    .feature-item .icon { font-size: 32px; margin-bottom: 8px; }
    .feature-item .name { font-size: 16px; font-weight: 700; color: #1565C0; }
    .feature-item .desc { font-size: 13px; color: #6E6E73; margin-top: 4px; }
    .compare-row { display: flex; justify-content: center; gap: 24px; margin: 24px 0; flex-wrap: wrap; }
    .compare-item { display: flex; flex-direction: column; align-items: center; background: #F8F8FA; border-radius: 16px; padding: 20px 24px; }
    .compare-item svg { width: 120px; height: 40px; margin-bottom: 12px; }
    .compare-item .label { font-size: 14px; font-weight: 600; color: #6E6E73; }
    .compare-item .answer { font-size: 15px; font-weight: 700; margin-top: 4px; }
    .answer-yes { color: #2E7D32; }
    .answer-no { color: #C62828; }

    /* === 模式2: 判断 === */
    .judge-area { text-align: center; padding: 16px; }
    .judge-card {
      background: white; border-radius: 20px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
    }
    .judge-svg { margin: 20px auto; display: block; }
    .judge-btns { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
    .judge-btn {
      padding: 16px 40px; border: none; border-radius: 20px;
      font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .judge-btn:active { transform: scale(0.95); }
    .judge-btn.yes { background: #E8F5E9; color: #2E7D32; border: 3px solid #A5D6A7; }
    .judge-btn.no { background: #FFEBEE; color: #C62828; border: 3px solid #EF9A9A; }
    .judge-btn.selected-correct { background: #34C759; color: white; border-color: #34C759; }
    .judge-btn.selected-wrong { background: #FF3B30; color: white; border-color: #FF3B30; }
    .judge-btn.disabled { pointer-events: none; opacity: 0.5; }
    .judge-feedback { font-size: 20px; font-weight: 700; min-height: 32px; margin: 12px 0; }
    .judge-feedback.correct { color: #2E7D32; }
    .judge-feedback.wrong { color: #C62828; }

    /* === 模式3: 数线段 === */
    .count-area { text-align: center; padding: 16px; }
    .count-card {
      background: white; border-radius: 20px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
    }
    .count-svg-wrap { margin: 20px auto; display: flex; justify-content: center; }
    .count-svg-wrap svg { border: 2px solid #E5E5EA; border-radius: 12px; background: #FAFAFA; }
    .count-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; max-width: 320px; margin-left: auto; margin-right: auto; }
    .count-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: #F8F8FA;
      border-radius: 16px; cursor: pointer; transition: all 0.2s ease;
      font-size: 22px; font-weight: 700; color: #1D1D1F;
    }
    .count-opt:active { transform: scale(0.95); }
    .count-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #2E7D32; }
    .count-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #C62828; }
    .count-opt.disabled { pointer-events: none; opacity: 0.5; }
    .count-feedback { font-size: 20px; font-weight: 700; min-height: 32px; margin: 12px 0; }
    .count-feedback.correct { color: #2E7D32; }
    .count-feedback.wrong { color: #C62828; }

    /* === 模式4: 量线段 === */
    .measure-area { text-align: center; padding: 16px; }
    .measure-card {
      background: white; border-radius: 20px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
    }
    .measure-ruler { margin: 20px auto; display: block; }
    .measure-input-group { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0; }
    .measure-input {
      width: 80px; height: 56px; border: 3px solid #E5E5EA;
      border-radius: 12px; font-size: 24px; font-weight: 700;
      text-align: center; outline: none; transition: border-color 0.2s;
      -webkit-appearance: none; -moz-appearance: textfield;
    }
    .measure-input:focus { border-color: #4A90D9; }
    .measure-unit { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .measure-submit {
      padding: 14px 32px; border: none; border-radius: 16px;
      background: #4A90D9; color: white; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease; margin: 12px 0;
    }
    .measure-submit:active { transform: scale(0.95); }
    .measure-feedback { font-size: 18px; font-weight: 700; margin: 16px 0; min-height: 28px; }
    .measure-feedback.correct { color: #2E7D32; }
    .measure-feedback.wrong { color: #C62828; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <div class="nav-title">📏 认识线段</div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 认识</button>
      <button class="mode-tab" data-mode="judge">✅ 判断</button>
      <button class="mode-tab" data-mode="count">🔢 数线段</button>
      <button class="mode-tab" data-mode="measure">📐 量线段</button>
    </div>

    <!-- 模式1: 认识线段 -->
    <div class="mode-content active" data-mode="learn">
      <div class="learn-card">
        <div class="learn-title">什么是线段？</div>
        <div class="learn-text">
          线段是<span class="hl">直直的</span>线，有<span class="hl">两个端点</span>，可以<span class="hl">量出长度</span>。
        </div>
      </div>

      <div class="feature-box">
        <div class="feature-item">
          <div class="icon">📏</div>
          <div class="name">直直的</div>
          <div class="desc">不能弯曲</div>
        </div>
        <div class="feature-item">
          <div class="icon">⚫</div>
          <div class="name">两个端点</div>
          <div class="desc">一头一尾</div>
        </div>
        <div class="feature-item">
          <div class="icon">📐</div>
          <div class="name">可测量</div>
          <div class="desc">有具体长度</div>
        </div>
      </div>

      <div class="learn-card">
        <div class="learn-title">判断：哪些是线段？</div>
        <div class="compare-row">
          <div class="compare-item">
            <svg viewBox="0 0 120 40">
              <line x1="10" y1="20" x2="110" y2="20" stroke="#4A90D9" stroke-width="3"/>
              <circle cx="10" cy="20" r="5" fill="#FF9500"/>
              <circle cx="110" cy="20" r="5" fill="#FF9500"/>
            </svg>
            <div class="label">直直的，有端点</div>
            <div class="answer answer-yes">✅ 是线段</div>
          </div>
          <div class="compare-item">
            <svg viewBox="0 0 120 40">
              <path d="M 10 20 Q 60 5 110 20" stroke="#9CA3AF" stroke-width="3" fill="none"/>
            </svg>
            <div class="label">弯弯的</div>
            <div class="answer answer-no">❌ 不是线段</div>
          </div>
        </div>
        <div class="compare-row">
          <div class="compare-item">
            <svg viewBox="0 0 120 40">
              <line x1="10" y1="20" x2="110" y2="20" stroke="#9CA3AF" stroke-width="3"/>
              <circle cx="110" cy="20" r="5" fill="#FF9500"/>
            </svg>
            <div class="label">只有一个端点</div>
            <div class="answer answer-no">❌ 不是线段</div>
          </div>
          <div class="compare-item">
            <svg viewBox="0 0 120 40">
              <line x1="20" y1="20" x2="100" y2="20" stroke="#4A90D9" stroke-width="3"/>
              <circle cx="20" cy="20" r="5" fill="#FF9500"/>
              <circle cx="100" cy="20" r="5" fill="#FF9500"/>
            </svg>
            <div class="label">直的，两个端点</div>
            <div class="answer answer-yes">✅ 是线段</div>
          </div>
        </div>
      </div>

      <div class="learn-card">
        <div class="learn-title">🏠 生活中的线段</div>
        <div class="learn-text">
          🖊️ 铅笔的边缘<br>
          📏 尺子的边<br>
          🪟 窗户的框<br>
          🪑 桌子的边<br>
          📱 手机的边框
        </div>
      </div>
    </div>

    <!-- 模式2: 判断线段 -->
    <div class="mode-content" data-mode="judge">
      <div class="judge-area">
        <div class="score-display">
          <span class="score-stars">⭐</span>
          <span id="judge-score">0</span> / <span id="judge-total">0</span>
        </div>
        <div class="judge-card">
          <div style="font-size:18px;font-weight:700;color:#1D1D1F;margin-bottom:8px;" id="judge-q">下面哪些是线段？</div>
          <svg class="judge-svg" id="judge-svg" width="240" height="80" viewBox="0 0 240 80"></svg>
          <div class="judge-btns">
            <button class="judge-btn yes" id="judge-yes">✅ 是线段</button>
            <button class="judge-btn no" id="judge-no">❌ 不是</button>
          </div>
          <div class="judge-feedback" id="judge-feedback"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 数线段 -->
    <div class="mode-content" data-mode="count">
      <div class="count-area">
        <div class="score-display">
          <span class="score-stars">⭐</span>
          <span id="count-score">0</span> / <span id="count-total">0</span>
        </div>
        <div class="count-card">
          <div style="font-size:18px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">数一数，图中有几条线段？</div>
          <div class="count-svg-wrap" id="count-svg-wrap"></div>
          <div class="count-options" id="count-options"></div>
          <div class="count-feedback" id="count-feedback"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 量线段 -->
    <div class="mode-content" data-mode="measure">
      <div class="measure-area">
        <div class="score-display">
          <span class="score-stars">⭐</span>
          <span id="measure-score">0</span> / <span id="measure-total">0</span>
        </div>
        <div class="measure-card">
          <div style="font-size:18px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">用尺子量一量，线段有多长？</div>
          <svg class="measure-ruler" id="measure-ruler" width="300" height="100" viewBox="0 0 300 100"></svg>
          <div class="measure-input-group">
            <input type="number" class="measure-input" id="measure-input" placeholder="?" min="1" max="15">
            <span class="measure-unit">厘米</span>
          </div>
          <button class="measure-submit" id="measure-submit">提交答案</button>
          <div class="measure-feedback" id="measure-feedback"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.mode-content').forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
        document.querySelector('.mode-content[data-mode="' + this.dataset.mode + '"]').classList.add('active');
      });
    });

    // === 模式2: 判断线段 ===
    var judgeScore = 0, judgeTotal = 0;
    var judgeShapes = [
      { svg: '<line x1="20" y1="40" x2="220" y2="40" stroke="#4A90D9" stroke-width="3"/><circle cx="20" cy="40" r="6" fill="#FF9500"/><circle cx="220" cy="40" r="6" fill="#FF9500"/>', isLine: true, desc: '直直的，两个端点' },
      { svg: '<path d="M 20 40 Q 120 10 220 40" stroke="#9CA3AF" stroke-width="3" fill="none"/>', isLine: false, desc: '弯弯的，不是线段' },
      { svg: '<line x1="20" y1="40" x2="220" y2="40" stroke="#9CA3AF" stroke-width="3"/><circle cx="220" cy="40" r="6" fill="#FF9500"/>', isLine: false, desc: '只有一个端点' },
      { svg: '<line x1="40" y1="40" x2="200" y2="40" stroke="#4A90D9" stroke-width="3"/><circle cx="40" cy="40" r="6" fill="#FF9500"/><circle cx="200" cy="40" r="6" fill="#FF9500"/>', isLine: true, desc: '直直的，两个端点' },
      { svg: '<circle cx="120" cy="40" r="30" stroke="#9CA3AF" stroke-width="3" fill="none"/>', isLine: false, desc: '圆形，不是线段' },
      { svg: '<line x1="20" y1="20" x2="220" y2="60" stroke="#4A90D9" stroke-width="3"/><circle cx="20" cy="20" r="6" fill="#FF9500"/><circle cx="220" cy="60" r="6" fill="#FF9500"/>', isLine: true, desc: '斜的也是线段' },
      { svg: '<line x1="20" y1="40" x2="120" y2="40" stroke="#4A90D9" stroke-width="3"/><line x1="120" y1="40" x2="220" y2="40" stroke="#4A90D9" stroke-width="3"/><circle cx="20" cy="40" r="6" fill="#FF9500"/><circle cx="120" cy="40" r="6" fill="#FF9500"/><circle cx="220" cy="40" r="6" fill="#FF9500"/>', isLine: false, desc: '这是两条线段' },
      { svg: '<line x1="60" y1="40" x2="180" y2="40" stroke="#4A90D9" stroke-width="3"/><circle cx="60" cy="40" r="6" fill="#FF9500"/><circle cx="180" cy="40" r="6" fill="#FF9500"/>', isLine: true, desc: '短一些也是线段' }
    ];
    var currentJudge = null;

    function nextJudge() {
      currentJudge = judgeShapes[Math.floor(Math.random() * judgeShapes.length)];
      document.getElementById('judge-svg').innerHTML = currentJudge.svg;
      document.getElementById('judge-feedback').textContent = '';
      document.getElementById('judge-feedback').className = 'judge-feedback';
      document.getElementById('judge-yes').className = 'judge-btn yes';
      document.getElementById('judge-no').className = 'judge-btn no';
    }

    function handleJudge(answer) {
      if (!currentJudge) return;
      var correct = (answer === currentJudge.isLine);
      judgeTotal++;
      if (correct) judgeScore++;
      document.getElementById('judge-score').textContent = judgeScore;
      document.getElementById('judge-total').textContent = judgeTotal;

      var fb = document.getElementById('judge-feedback');
      if (correct) {
        fb.textContent = '✅ 正确！' + currentJudge.desc;
        fb.className = 'judge-feedback correct';
        if (answer) {
          document.getElementById('judge-yes').className = 'judge-btn yes selected-correct';
        } else {
          document.getElementById('judge-no').className = 'judge-btn no selected-correct';
        }
      } else {
        fb.textContent = '❌ 不对哦，' + currentJudge.desc;
        fb.className = 'judge-feedback wrong';
        if (answer) {
          document.getElementById('judge-yes').className = 'judge-btn yes selected-wrong';
        } else {
          document.getElementById('judge-no').className = 'judge-btn no selected-wrong';
        }
      }
      document.getElementById('judge-yes').className += ' disabled';
      document.getElementById('judge-no').className += ' disabled';
      setTimeout(nextJudge, 1500);
    }

    document.getElementById('judge-yes').addEventListener('click', function() { handleJudge(true); });
    document.getElementById('judge-no').addEventListener('click', function() { handleJudge(false); });
    nextJudge();

    // === 模式3: 数线段 ===
    var countScore = 0, countTotal = 0;
    var countPuzzles = [
      { points: 2, answer: 1 },
      { points: 3, answer: 3 },
      { points: 4, answer: 6 },
      { points: 5, answer: 10 }
    ];
    var currentCount = null;

    function genCountPuzzle() {
      var p = countPuzzles[Math.floor(Math.random() * countPuzzles.length)];
      currentCount = p;
      var n = p.points;
      var svgW = 280, svgH = 80;
      var gap = svgW / (n + 1);
      var svg = '<svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '">';
      // draw all line segments between consecutive points
      for (var i = 0; i < n; i++) {
        var x1 = gap * (i + 1);
        var x2 = gap * (i + 2);
        svg += '<line x1="' + x1 + '" y1="40" x2="' + x2 + '" y2="40" stroke="#4A90D9" stroke-width="3"/>';
      }
      for (var i = 0; i < n; i++) {
        var cx = gap * (i + 1);
        svg += '<circle cx="' + cx + '" cy="40" r="7" fill="#FF9500"/>';
      }
      svg += '</svg>';
      document.getElementById('count-svg-wrap').innerHTML = svg;

      // generate options
      var ans = p.answer;
      var opts = [ans];
      while (opts.length < 4) {
        var v = ans + Math.floor(Math.random() * 7) - 3;
        if (v > 0 && opts.indexOf(v) === -1) opts.push(v);
      }
      // shuffle
      opts.sort(function() { return Math.random() - 0.5; });

      var html = '';
      for (var i = 0; i < opts.length; i++) {
        html += '<button class="count-opt" data-val="' + opts[i] + '">' + opts[i] + ' 条</button>';
      }
      document.getElementById('count-options').innerHTML = html;
      document.getElementById('count-feedback').textContent = '';
      document.getElementById('count-feedback').className = 'count-feedback';

      // bind
      var btns = document.querySelectorAll('.count-opt');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', handleCount);
      }
    }

    function handleCount() {
      if (!currentCount) return;
      var val = parseInt(this.dataset.val);
      var correct = (val === currentCount.answer);
      countTotal++;
      if (correct) countScore++;
      document.getElementById('count-score').textContent = countScore;
      document.getElementById('count-total').textContent = countTotal;

      var fb = document.getElementById('count-feedback');
      if (correct) {
        this.className = 'count-opt correct';
        fb.textContent = '✅ 正确！一共有 ' + currentCount.answer + ' 条线段';
        fb.className = 'count-feedback correct';
      } else {
        this.className = 'count-opt wrong';
        fb.textContent = '❌ 不对哦，正确答案是 ' + currentCount.answer + ' 条';
        fb.className = 'count-feedback wrong';
        // highlight correct
        var allBtns = document.querySelectorAll('.count-opt');
        for (var i = 0; i < allBtns.length; i++) {
          if (parseInt(allBtns[i].dataset.val) === currentCount.answer) {
            allBtns[i].className = 'count-opt correct';
          }
        }
      }
      var allBtns = document.querySelectorAll('.count-opt');
      for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].className += ' disabled';
      }
      setTimeout(genCountPuzzle, 1500);
    }

    genCountPuzzle();

    // === 模式4: 量线段 ===
    var measureScore = 0, measureTotal = 0;
    var currentMeasure = 0;

    function genMeasure() {
      currentMeasure = Math.floor(Math.random() * 10) + 2; // 2-11 cm
      var svg = document.getElementById('measure-ruler');
      var svgHTML = '';
      var startX = 30;
      var endX = startX + currentMeasure * 22;
      // line
      svgHTML += '<line x1="' + startX + '" y1="50" x2="' + endX + '" y2="50" stroke="#4A90D9" stroke-width="3"/>';
      svgHTML += '<circle cx="' + startX + '" cy="50" r="5" fill="#FF9500"/>';
      svgHTML += '<circle cx="' + endX + '" cy="50" r="5" fill="#FF9500"/>';
      // ruler ticks
      for (var i = 0; i <= 12; i++) {
        var x = startX + i * 22;
        var h = (i % 5 === 0) ? 20 : 12;
        svgHTML += '<line x1="' + x + '" y1="60" x2="' + x + '" y2="' + (60 + h) + '" stroke="#9CA3AF" stroke-width="1.5"/>';
        if (i % 1 === 0 && i <= 12) {
          svgHTML += '<text x="' + x + '" y="92" text-anchor="middle" font-size="11" fill="#6E6E73">' + i + '</text>';
        }
      }
      // "0" label
      svgHTML += '<text x="' + startX + '" y="44" text-anchor="middle" font-size="12" fill="#4A90D9" font-weight="700">0</text>';
      svg.innerHTML = svgHTML;

      document.getElementById('measure-input').value = '';
      document.getElementById('measure-feedback').textContent = '';
      document.getElementById('measure-feedback').className = 'measure-feedback';
      document.getElementById('measure-input').focus();
    }

    document.getElementById('measure-submit').addEventListener('click', function() {
      var val = parseInt(document.getElementById('measure-input').value);
      if (isNaN(val)) return;
      var correct = (val === currentMeasure);
      measureTotal++;
      if (correct) measureScore++;
      document.getElementById('measure-score').textContent = measureScore;
      document.getElementById('measure-total').textContent = measureTotal;

      var fb = document.getElementById('measure-feedback');
      if (correct) {
        fb.textContent = '✅ 正确！线段长 ' + currentMeasure + ' 厘米';
        fb.className = 'measure-feedback correct';
      } else {
        fb.textContent = '❌ 不对哦，线段长 ' + currentMeasure + ' 厘米';
        fb.className = 'measure-feedback wrong';
      }
      setTimeout(genMeasure, 1500);
    });

    document.getElementById('measure-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('measure-submit').click();
      }
    });

    genMeasure();
  </script>
</body>
</html>
