<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识线段</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 认识线段 */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .learn-svg { width: 100%; max-width: 320px; margin: 16px auto; display: block; }
    .learn-title { font-size: 20px; font-weight: 700; color: #4A90D9; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.6; }
    .learn-feature {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
    }
    .feature-tag {
      padding: 8px 16px; border-radius: 12px; font-size: 15px; font-weight: 600;
      background: rgba(74,144,217,0.1); color: #4A90D9;
    }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #4A90D9; color: white; box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* 模式2: 找线段 */
    .find-area { text-align: center; padding: 24px 16px; }
    .find-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .find-svg-wrap {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .find-svg-wrap svg { width: 100%; display: block; }
    .find-svg-wrap svg line, .find-svg-wrap svg path { cursor: pointer; }
    .find-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .find-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9; min-width: 60px;
    }
    .find-opt:active { transform: scale(0.95); }
    .find-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .find-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .find-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .find-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式3: 量一量 */
    .measure-area { text-align: center; padding: 24px 16px; }
    .measure-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .measure-svg-wrap {
      background: white; border-radius: 20px; padding: 24px 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .measure-svg-wrap svg { width: 100%; display: block; }
    .measure-input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .measure-input {
      width: 80px; padding: 12px; border: 3px solid #E5E5EA; border-radius: 12px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s ease;
    }
    .measure-input:focus { border-color: #4A90D9; }
    .measure-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .measure-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .measure-unit { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .measure-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .measure-btn:active { transform: scale(0.95); }
    .measure-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .measure-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式4: 比长短 */
    .compare-area { text-align: center; padding: 24px 16px; }
    .compare-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .compare-svg-wrap {
      background: white; border-radius: 20px; padding: 24px 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .compare-svg-wrap svg { width: 100%; display: block; }
    .compare-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .compare-opt {
      padding: 14px 28px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 22px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9; min-width: 80px;
    }
    .compare-opt:active { transform: scale(0.95); }
    .compare-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .compare-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .compare-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .compare-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 通用 */
    .streak-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 700; background: #FFF3E0; color: #FF9500;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">认识线段</span>
    </nav>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="learn">📖 认识</button>
      <button class="mode-tab" data-mode="find">🔍 找线段</button>
      <button class="mode-tab" data-mode="measure">📏 量一量</button>
      <button class="mode-tab" data-mode="compare">⚖️ 比长短</button>
    </div>

    <!-- 模式1: 认识线段 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card" id="learnCard">
          <svg class="learn-svg" id="learnSvg" viewBox="0 0 320 120"></svg>
          <div class="learn-title" id="learnTitle"></div>
          <div class="learn-desc" id="learnDesc"></div>
          <div class="learn-feature" id="learnFeatures"></div>
        </div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="btnLearnPrev">← 上一个</button>
          <button class="learn-btn primary" id="btnLearnNext">下一个 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 找线段 -->
    <div class="mode-content" id="mode-find">
      <div class="find-area">
        <div class="find-problem" id="findProblem"></div>
        <div class="find-svg-wrap" id="findSvgWrap"></div>
        <div class="find-options" id="findOptions"></div>
        <div class="find-feedback" id="findFeedback"></div>
        <div class="find-score">
          <span>✅ <span id="findCorrect">0</span></span>
          <span>❌ <span id="findWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="findStreak">0</span></span>
        </div>
        <button class="measure-btn" id="btnFindNext">下一题 →</button>
      </div>
    </div>

    <!-- 模式3: 量一量 -->
    <div class="mode-content" id="mode-measure">
      <div class="measure-area">
        <div class="measure-problem" id="measureProblem"></div>
        <div class="measure-svg-wrap" id="measureSvgWrap"></div>
        <div class="measure-input-row">
          <input type="number" class="measure-input" id="measureInput" placeholder="?" min="1" max="20">
          <span class="measure-unit">厘米</span>
        </div>
        <div class="measure-feedback" id="measureFeedback"></div>
        <div class="measure-score">
          <span>✅ <span id="measureCorrect">0</span></span>
          <span>❌ <span id="measureWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="measureStreak">0</span></span>
        </div>
        <button class="measure-btn" id="btnMeasureCheck">✅ 确认</button>
        <button class="measure-btn" id="btnMeasureNext" style="background:#E5E5EA;color:#1D1D1F;box-shadow:none;">下一题 →</button>
      </div>
    </div>

    <!-- 模式4: 比长短 -->
    <div class="mode-content" id="mode-compare">
      <div class="compare-area">
        <div class="compare-problem" id="compareProblem"></div>
        <div class="compare-svg-wrap" id="compareSvgWrap"></div>
        <div class="compare-options" id="compareOptions"></div>
        <div class="compare-feedback" id="compareFeedback"></div>
        <div class="compare-score">
          <span>✅ <span id="compareCorrect">0</span></span>
          <span>❌ <span id="compareWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="compareStreak">0</span></span>
        </div>
        <button class="measure-btn" id="btnCompareNext">下一题 →</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 认识线段 ===
    (() => {
      const lessons = [
        {
          title: '什么是线段？',
          desc: '线段是直的，有两个端点，可以量出长度。',
          features: ['直的', '两个端点', '可以测量'],
          draw: (svg) => {
            svg.innerHTML = `
              <line x1="40" y1="60" x2="280" y2="60" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
              <circle cx="40" cy="60" r="8" fill="#FF9500"/>
              <circle cx="280" cy="60" r="8" fill="#FF9500"/>
              <text x="40" y="95" text-anchor="middle" font-size="14" fill="#FF9500" font-weight="700">端点</text>
              <text x="280" y="95" text-anchor="middle" font-size="14" fill="#FF9500" font-weight="700">端点</text>
            `;
          }
        },
        {
          title: '线段是直的',
          desc: '线段不能是弯的！只有直直的才是线段。',
          features: ['直的 ✓', '弯的 ✗'],
          draw: (svg) => {
            svg.innerHTML = `
              <line x1="40" y1="35" x2="280" y2="35" stroke="#34C759" stroke-width="4" stroke-linecap="round"/>
              <circle cx="40" cy="35" r="6" fill="#34C759"/>
              <circle cx="280" cy="35" r="6" fill="#34C759"/>
              <text x="300" y="40" font-size="14" fill="#34C759" font-weight="700">✓</text>
              <path d="M40 85 Q100 55 160 85 Q220 115 280 85" stroke="#FF3B30" stroke-width="4" fill="none" stroke-linecap="round"/>
              <text x="300" y="90" font-size="14" fill="#FF3B30" font-weight="700">✗</text>
            `;
          }
        },
        {
          title: '线段有两个端点',
          desc: '线段的两头各有一个端点，就像小棍的两头。',
          features: ['起点', '终点', '两端固定'],
          draw: (svg) => {
            svg.innerHTML = `
              <line x1="60" y1="60" x2="260" y2="60" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
              <circle cx="60" cy="60" r="10" fill="#FF9500" opacity="0.3"/>
              <circle cx="60" cy="60" r="6" fill="#FF9500"/>
              <circle cx="260" cy="60" r="10" fill="#FF9500" opacity="0.3"/>
              <circle cx="260" cy="60" r="6" fill="#FF9500"/>
              <text x="60" y="100" text-anchor="middle" font-size="14" fill="#FF9500" font-weight="700">起点</text>
              <text x="260" y="100" text-anchor="middle" font-size="14" fill="#FF9500" font-weight="700">终点</text>
              <!-- 箭头指向 -->
              <line x1="60" y1="85" x2="60" y2="70" stroke="#FF9500" stroke-width="2"/>
              <line x1="260" y1="85" x2="260" y2="70" stroke="#FF9500" stroke-width="2"/>
            `;
          }
        },
        {
          title: '线段有长有短',
          desc: '不同的线段长度不一样，可以用尺子量出几厘米。',
          features: ['可以比较', '可以测量'],
          draw: (svg) => {
            svg.innerHTML = `
              <line x1="40" y1="30" x2="280" y2="30" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
              <circle cx="40" cy="30" r="5" fill="#FF9500"/>
              <circle cx="280" cy="30" r="5" fill="#FF9500"/>
              <text x="160" y="22" text-anchor="middle" font-size="13" fill="#6E6E73">长线段</text>
              <line x1="40" y1="70" x2="180" y2="70" stroke="#7B1FA2" stroke-width="4" stroke-linecap="round"/>
              <circle cx="40" cy="70" r="5" fill="#FF9500"/>
              <circle cx="180" cy="70" r="5" fill="#FF9500"/>
              <text x="110" y="62" text-anchor="middle" font-size="13" fill="#6E6E73">短线段</text>
              <!-- 尺子刻度 -->
              <line x1="40" y1="100" x2="280" y2="100" stroke="#E5E5EA" stroke-width="1"/>
              ${Array.from({length:13}, (_, i) => `<line x1="${40+i*20}" y1="96" x2="${40+i*20}" y2="104" stroke="#E5E5EA" stroke-width="1.5"/><text x="${40+i*20}" y="116" text-anchor="middle" font-size="10" fill="#9CA3AF">${i}</text>`).join('')}
            `;
          }
        },
        {
          title: '生活中的线段',
          desc: '书本的边、桌子的边、铅笔的长度……都是线段！',
          features: ['书本边', '桌子边', '铅笔'],
          draw: (svg) => {
            svg.innerHTML = `
              <!-- 书本 -->
              <rect x="20" y="15" width="80" height="55" rx="4" fill="#E3F2FD" stroke="#4A90D9" stroke-width="2"/>
              <line x1="20" y1="15" x2="100" y2="15" stroke="#FF9500" stroke-width="3"/>
              <text x="60" y="90" text-anchor="middle" font-size="12" fill="#6E6E73">📖 书本的边</text>
              <!-- 铅笔 -->
              <rect x="130" y="35" width="80" height="12" rx="2" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
              <polygon points="210,35 220,41 210,47" fill="#FFD54F" stroke="#FF9500" stroke-width="1"/>
              <text x="170" y="90" text-anchor="middle" font-size="12" fill="#6E6E73">✏️ 铅笔</text>
              <!-- 桌子 -->
              <rect x="240" y="25" width="60" height="6" rx="2" fill="#8D6E63"/>
              <rect x="245" y="31" width="4" height="30" fill="#8D6E63"/>
              <rect x="291" y="31" width="4" height="30" fill="#8D6E63"/>
              <line x1="240" y1="25" x2="300" y2="25" stroke="#FF9500" stroke-width="3"/>
              <text x="270" y="90" text-anchor="middle" font-size="12" fill="#6E6E73">🪑 桌子边</text>
            `;
          }
        }
      ];
      let idx = 0;
      function showLesson() {
        const l = lessons[idx];
        const svg = document.getElementById('learnSvg');
        l.draw(svg);
        document.getElementById('learnTitle').textContent = l.title;
        document.getElementById('learnDesc').textContent = l.desc;
        const fc = document.getElementById('learnFeatures');
        fc.innerHTML = '';
        l.features.forEach(f => {
          const tag = document.createElement('span');
          tag.className = 'feature-tag';
          tag.textContent = f;
          fc.appendChild(tag);
        });
        document.getElementById('btnLearnPrev').disabled = idx === 0;
        document.getElementById('btnLearnNext').textContent = idx === lessons.length - 1 ? '🎉 学完了' : '下一个 →';
      }
      document.getElementById('btnLearnPrev').addEventListener('click', () => {
        if (idx > 0) { idx--; Sound.play('click'); showLesson(); }
      });
      document.getElementById('btnLearnNext').addEventListener('click', () => {
        if (idx < lessons.length - 1) { idx++; Sound.play('click'); showLesson(); }
        else { celebrate(); showToast('🎉 你认识了线段！去试试其他模式吧'); }
      });
      showLesson();
    })();

    // === 模式2: 找线段 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0, answer = 0;
      function newFind() {
        // 生成图形：几条线，问哪几条是线段
        const wrap = document.getElementById('findSvgWrap');
        const count = Random.int(3, 5);
        const items = [];
        const colors = ['#4A90D9', '#7B1FA2', '#FF9500', '#34C759', '#FF3B30'];
        for (let i = 0; i < count; i++) {
          const isLine = Math.random() < 0.5;
          const y = 25 + i * 35;
          const x1 = 40, x2 = 280;
          if (isLine) {
            items.push({ type: 'line', idx: i, y });
          } else {
            // 曲线 or 射线 (用曲线表示非线段)
            const curveType = Math.random() < 0.5 ? 'curve' : 'ray';
            items.push({ type: curveType, idx: i, y });
          }
        }
        // 确保至少有1条线段和1条非线段
        if (!items.some(it => it.type === 'line')) items[0].type = 'line';
        if (!items.some(it => it.type !== 'line')) items[items.length - 1].type = 'curve';

        let svg = '<svg viewBox="0 0 320 ' + (count * 35 + 10) + '">';
        items.forEach((it, i) => {
          const y = 25 + i * 35;
          const c = colors[i % colors.length];
          if (it.type === 'line') {
            svg += `<line x1="40" y1="${y}" x2="280" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round" data-idx="${i}"/>`;
            svg += `<circle cx="40" cy="${y}" r="4" fill="${c}"/>`;
            svg += `<circle cx="280" cy="${y}" r="4" fill="${c}"/>`;
          } else if (it.type === 'curve') {
            const cy1 = y - 15, cy2 = y + 15;
            svg += `<path d="M40 ${y} Q120 ${cy1} 160 ${y} Q200 ${cy2} 280 ${y}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" data-idx="${i}"/>`;
          } else {
            // 射线：只有一个端点
            svg += `<line x1="40" y1="${y}" x2="280" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,4" data-idx="${i}"/>`;
            svg += `<circle cx="40" cy="${y}" r="4" fill="${c}"/>`;
            // 箭头表示无限延伸
            svg += `<polygon points="280,${y} 270,${y-5} 270,${y+5}" fill="${c}"/>`;
          }
          svg += `<text x="20" y="${y+5}" text-anchor="middle" font-size="14" fill="${c}" font-weight="700">${i+1}</text>`;
        });
        svg += '</svg>';
        wrap.innerHTML = svg;

        // 问哪几条是线段
        const lineItems = items.filter(it => it.type === 'line');
        answer = lineItems.map(it => it.idx);
        const correctStr = lineItems.map(it => it.idx + 1).join('、');
        document.getElementById('findProblem').textContent = '下面哪些是线段？（点击编号）';

        const opts = document.getElementById('findOptions');
        opts.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const btn = document.createElement('button');
          btn.className = 'find-opt';
          btn.textContent = i + 1;
          btn.dataset.idx = i;
          btn.dataset.selected = 'false';
          btn.addEventListener('click', () => {
            const sel = btn.dataset.selected === 'true';
            btn.dataset.selected = sel ? 'false' : 'true';
            btn.style.background = sel ? 'white' : 'rgba(74,144,217,0.15)';
            Sound.play('click');
          });
          opts.appendChild(btn);
        }
        document.getElementById('findFeedback').textContent = '';
        document.getElementById('findFeedback').style.color = '';

        // 确认按钮
        const checkBtn = document.createElement('button');
        checkBtn.className = 'measure-btn';
        checkBtn.textContent = '✅ 确认';
        checkBtn.id = 'btnFindCheck';
        checkBtn.addEventListener('click', () => {
          const selected = [];
          opts.querySelectorAll('.find-opt').forEach(b => {
            if (b.dataset.selected === 'true') selected.push(parseInt(b.dataset.idx));
          });
          const isCorrect = selected.length === answer.length && selected.every(s => answer.includes(s));
          if (isCorrect) {
            correct++; streak++;
            document.getElementById('findCorrect').textContent = correct;
            document.getElementById('findStreak').textContent = streak;
            document.getElementById('findFeedback').textContent = '🎉 答对了！线段是直的，有两个端点';
            document.getElementById('findFeedback').style.color = '#34C759';
            Sound.play('correct');
            celebrate();
            // 高亮正确选项
            opts.querySelectorAll('.find-opt').forEach(b => {
              const idx = parseInt(b.dataset.idx);
              if (answer.includes(idx)) b.classList.add('correct');
            });
            setTimeout(newFind, 1500);
          } else {
            wrong++; streak = 0;
            document.getElementById('findWrong').textContent = wrong;
            document.getElementById('findStreak').textContent = streak;
            document.getElementById('findFeedback').textContent = `❌ 不对哦，线段应该是第 ${correctStr} 个`;
            document.getElementById('findFeedback').style.color = '#FF3B30';
            Sound.play('wrong');
            opts.querySelectorAll('.find-opt').forEach(b => {
              const idx = parseInt(b.dataset.idx);
              if (answer.includes(idx)) b.classList.add('correct');
              else if (b.dataset.selected === 'true') b.classList.add('wrong');
            });
          }
        });
        // 移除旧的确认按钮
        const oldCheck = document.getElementById('btnFindCheck');
        if (oldCheck) oldCheck.remove();
        document.getElementById('btnFindNext').parentNode.insertBefore(checkBtn, document.getElementById('btnFindNext'));
      }

      document.getElementById('btnFindNext').addEventListener('click', () => { Sound.play('click'); newFind(); });
      newFind();
    })();

    // === 模式3: 量一量 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0, answer = 0;
      function newMeasure() {
        answer = Random.int(2, 12);
        const pxPerCm = 20;
        const startX = 40;
        const endX = startX + answer * pxPerCm;
        const wrap = document.getElementById('measureSvgWrap');
        // 画线段和尺子
        let svg = `<svg viewBox="0 0 320 80">`;
        // 线段
        svg += `<line x1="${startX}" y1="30" x2="${endX}" y2="30" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>`;
        svg += `<circle cx="${startX}" cy="30" r="5" fill="#FF9500"/>`;
        svg += `<circle cx="${endX}" cy="30" r="5" fill="#FF9500"/>`;
        // 尺子刻度
        const totalCm = answer + 2;
        for (let i = 0; i <= totalCm; i++) {
          const x = startX + i * pxPerCm;
          const h = i % 5 === 0 ? 12 : 8;
          svg += `<line x1="${x}" y1="48" x2="${x}" y2="${48+h}" stroke="#9CA3AF" stroke-width="1.5"/>`;
          svg += `<text x="${x}" y="${68}" text-anchor="middle" font-size="11" fill="#9CA3AF">${i}</text>`;
        }
        svg += `<line x1="${startX}" y1="48" x2="${startX + totalCm * pxPerCm}" y2="48" stroke="#E5E5EA" stroke-width="1"/>`;
        svg += `</svg>`;
        wrap.innerHTML = svg;

        document.getElementById('measureProblem').textContent = '这条线段有多长？（看尺子读数）';
        document.getElementById('measureInput').value = '';
        document.getElementById('measureInput').className = 'measure-input';
        document.getElementById('measureFeedback').textContent = '';
        document.getElementById('measureFeedback').style.color = '';
      }

      function checkMeasure() {
        const val = parseInt(document.getElementById('measureInput').value);
        if (val === answer) {
          correct++; streak++;
          document.getElementById('measureCorrect').textContent = correct;
          document.getElementById('measureStreak').textContent = streak;
          document.getElementById('measureInput').className = 'measure-input correct';
          document.getElementById('measureFeedback').textContent = `🎉 对了！这条线段长 ${answer} 厘米`;
          document.getElementById('measureFeedback').style.color = '#34C759';
          Sound.play('correct');
          celebrate();
          setTimeout(newMeasure, 1500);
        } else {
          wrong++; streak = 0;
          document.getElementById('measureWrong').textContent = wrong;
          document.getElementById('measureStreak').textContent = streak;
          document.getElementById('measureInput').className = 'measure-input wrong';
          document.getElementById('measureFeedback').textContent = `❌ 再数数看，从0开始数到另一个端点`;
          document.getElementById('measureFeedback').style.color = '#FF3B30';
          Sound.play('wrong');
          Animator.shake(document.getElementById('measureInput'));
        }
      }

      document.getElementById('btnMeasureCheck').addEventListener('click', checkMeasure);
      document.getElementById('measureInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkMeasure(); });
      document.getElementById('btnMeasureNext').addEventListener('click', () => { Sound.play('click'); newMeasure(); });
      newMeasure();
    })();

    // === 模式4: 比长短 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0, answer = '';
      function newCompare() {
        const lenA = Random.int(2, 10);
        let lenB = Random.int(2, 10);
        while (lenB === lenA) lenB = Random.int(2, 10);
        const pxPerCm = 20;
        const startX = 40;

        const wrap = document.getElementById('compareSvgWrap');
        let svg = `<svg viewBox="0 0 320 90">`;
        // 线段A
        svg += `<line x1="${startX}" y1="25" x2="${startX + lenA * pxPerCm}" y2="25" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>`;
        svg += `<circle cx="${startX}" cy="25" r="4" fill="#FF9500"/>`;
        svg += `<circle cx="${startX + lenA * pxPerCm}" cy="25" r="4" fill="#FF9500"/>`;
        svg += `<text x="20" y="30" text-anchor="middle" font-size="15" fill="#4A90D9" font-weight="700">A</text>`;
        // 线段B
        svg += `<line x1="${startX}" y1="65" x2="${startX + lenB * pxPerCm}" y2="65" stroke="#7B1FA2" stroke-width="4" stroke-linecap="round"/>`;
        svg += `<circle cx="${startX}" cy="65" r="4" fill="#FF9500"/>`;
        svg += `<circle cx="${startX + lenB * pxPerCm}" cy="65" r="4" fill="#FF9500"/>`;
        svg += `<text x="20" y="70" text-anchor="middle" font-size="15" fill="#7B1FA2" font-weight="700">B</text>`;
        svg += `</svg>`;
        wrap.innerHTML = svg;

        answer = lenA > lenB ? 'A > B' : 'A < B';
        const questionType = Random.pick(['哪个更长', '哪个更短', '比一比']);
        if (questionType === '哪个更长') {
          document.getElementById('compareProblem').textContent = '哪条线段更长？';
          answer = lenA > lenB ? 'A' : 'B';
        } else if (questionType === '哪个更短') {
          document.getElementById('compareProblem').textContent = '哪条线段更短？';
          answer = lenA < lenB ? 'A' : 'B';
        } else {
          document.getElementById('compareProblem').textContent = '比较两条线段的长短';
          answer = lenA > lenB ? 'A > B' : 'A < B';
        }

        const opts = document.getElementById('compareOptions');
        opts.innerHTML = '';
        let choices;
        if (questionType === '比一比') {
          choices = ['A > B', 'A < B', 'A = B'];
        } else {
          choices = ['A', 'B', '一样长'];
        }
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'compare-opt';
          btn.textContent = c;
          btn.addEventListener('click', () => {
            if (c === answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('compareCorrect').textContent = correct;
              document.getElementById('compareStreak').textContent = streak;
              document.getElementById('compareFeedback').textContent = '🎉 答对了！';
              document.getElementById('compareFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              setTimeout(newCompare, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('compareWrong').textContent = wrong;
              document.getElementById('compareStreak').textContent = streak;
              document.getElementById('compareFeedback').textContent = `❌ 再比比看，从左端对齐开始比`;
              document.getElementById('compareFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          opts.appendChild(btn);
        });
        document.getElementById('compareFeedback').textContent = '';
        document.getElementById('compareFeedback').style.color = '';
      }

      document.getElementById('btnCompareNext').addEventListener('click', () => { Sound.play('click'); newCompare(); });
      newCompare();
    })();
  </script>
</body>
</html>
