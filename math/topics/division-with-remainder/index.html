<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>有余数的除法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 分一分 */
    .divide-area { text-align: center; padding: 24px 16px; }
    .divide-problem { font-size: 22px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .divide-visual { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; min-height: 100px; }
    .divide-group {
      background: rgba(74,144,217,0.08); border-radius: 16px; padding: 12px;
      min-width: 80px; text-align: center; border: 2px dashed #4A90D9;
    }
    .divide-group .group-label { font-size: 14px; color: #4A90D9; font-weight: 600; margin-bottom: 6px; }
    .divide-group .group-items { font-size: 28px; line-height: 1.4; }
    .remainder-box {
      background: rgba(255,149,0,0.1); border-radius: 16px; padding: 12px 16px;
      margin: 16px auto; max-width: 300px; border: 2px solid #FF9500;
    }
    .remainder-box .remainder-label { font-size: 14px; color: #FF9500; font-weight: 600; }
    .remainder-box .remainder-items { font-size: 28px; margin-top: 4px; }
    .divide-equation { font-size: 24px; font-weight: 700; color: #4A90D9; margin: 16px 0; }
    .divide-equation .remainder-part { color: #FF9500; }
    .divide-controls { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .divide-btn {
      padding: 14px 24px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .divide-btn:active { transform: scale(0.95); }
    .divide-btn.primary { background: #4A90D9; color: white; box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
    .divide-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* 模式2: 算一算 */
    .quiz-area { text-align: center; padding: 24px 16px; }
    .quiz-problem { font-size: 28px; font-weight: 700; margin: 16px 0; color: #1D1D1F; }
    .quiz-input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .quiz-input {
      width: 70px; padding: 12px; border: 3px solid #E5E5EA; border-radius: 12px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s ease;
    }
    .quiz-input:focus { border-color: #4A90D9; }
    .quiz-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .quiz-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .quiz-symbol { font-size: 24px; font-weight: 700; color: #6E6E73; }
    .quiz-feedback { font-size: 20px; font-weight: 600; margin: 12px 0; min-height: 32px; }
    .quiz-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }
    .quiz-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .quiz-btn:active { transform: scale(0.95); }

    /* 模式3: 选择题 */
    .choice-area { text-align: center; padding: 24px 16px; }
    .choice-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; line-height: 1.6; }
    .choice-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px auto; max-width: 400px; }
    .choice-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white; border-radius: 16px;
      font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      color: #4A90D9;
    }
    .choice-opt:active { transform: scale(0.95); }
    .choice-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .choice-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .choice-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .choice-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }

    /* 模式4: 应用题 */
    .app-area { text-align: center; padding: 24px 16px; }
    .app-story { font-size: 18px; line-height: 1.8; margin: 16px 0; color: #1D1D1F; text-align: left; background: #F8F8FA; border-radius: 16px; padding: 20px; }
    .app-story .app-emoji { font-size: 32px; display: block; text-align: center; margin-bottom: 12px; }
    .app-question { font-size: 20px; font-weight: 700; color: #4A90D9; margin: 16px 0; }
    .app-input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .app-input {
      width: 70px; padding: 12px; border: 3px solid #E5E5EA; border-radius: 12px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s ease;
    }
    .app-input:focus { border-color: #4A90D9; }
    .app-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .app-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .app-unit { font-size: 18px; font-weight: 600; color: #6E6E73; }
    .app-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .app-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }
    .app-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .app-btn:active { transform: scale(0.95); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">➗ 有余数的除法</span>
      <div style="width:56px"></div>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="explore">🍎 分一分</button>
      <button class="mode-tab" data-mode="calc">✏️ 算一算</button>
      <button class="mode-tab" data-mode="choice">🎯 选一选</button>
      <button class="mode-tab" data-mode="app">📖 应用题</button>
    </div>

    <!-- 模式1: 分一分（可视化探索） -->
    <div class="mode-content active" id="mode-explore">
      <div class="divide-area">
        <div class="divide-problem" id="divideProblem"></div>
        <div class="divide-visual" id="divideVisual"></div>
        <div class="remainder-box" id="remainderBox" style="display:none;">
          <div class="remainder-label">剩余（余数）</div>
          <div class="remainder-items" id="remainderItems"></div>
        </div>
        <div class="divide-equation" id="divideEquation"></div>
        <div class="divide-controls">
          <button class="divide-btn primary" id="newDivideBtn">换一题</button>
          <button class="divide-btn secondary" id="showAnswerBtn">看答案</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 算一算（填空计算） -->
    <div class="mode-content" id="mode-calc">
      <div class="quiz-area">
        <div class="quiz-problem" id="calcProblem"></div>
        <div class="quiz-input-row">
          <span class="quiz-symbol">商 =</span>
          <input type="number" class="quiz-input" id="calcQuotient" placeholder="?">
          <span class="quiz-symbol">余数 =</span>
          <input type="number" class="quiz-input" id="calcRemainder" placeholder="?">
        </div>
        <div class="quiz-feedback" id="calcFeedback"></div>
        <div class="quiz-score">
          <span>✅ <span id="calcCorrect">0</span></span>
          <span>❌ <span id="calcWrong">0</span></span>
        </div>
        <button class="quiz-btn" id="calcCheckBtn">检查答案</button>
        <button class="quiz-btn" id="calcNextBtn" style="background:#E5E5EA;color:#1D1D1F;box-shadow:none;">下一题</button>
      </div>
    </div>

    <!-- 模式3: 选一选（选择题） -->
    <div class="mode-content" id="mode-choice">
      <div class="choice-area">
        <div class="choice-problem" id="choiceProblem"></div>
        <div class="choice-options" id="choiceOptions"></div>
        <div class="choice-feedback" id="choiceFeedback"></div>
        <div class="choice-score">
          <span>✅ <span id="choiceCorrect">0</span></span>
          <span>❌ <span id="choiceWrong">0</span></span>
        </div>
      </div>
    </div>

    <!-- 模式4: 应用题 -->
    <div class="mode-content" id="mode-app">
      <div class="app-area">
        <div class="app-story" id="appStory"></div>
        <div class="app-question" id="appQuestion"></div>
        <div class="app-input-row" id="appInputRow"></div>
        <div class="app-feedback" id="appFeedback"></div>
        <div class="app-score">
          <span>✅ <span id="appCorrect">0</span></span>
          <span>❌ <span id="appWrong">0</span></span>
        </div>
        <button class="app-btn" id="appCheckBtn">检查答案</button>
        <button class="app-btn" id="appNextBtn" style="background:#E5E5EA;color:#1D1D1F;box-shadow:none;">下一题</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
      });
    });

    // === 返回按钮 ===
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');

    // === 工具函数 ===
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

    // === 模式1: 分一分 ===
    const fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🥝', '🍌', '🫐'];
    let divideAnswer = {};

    function newDivideProblem() {
      const divisor = randInt(2, 6);
      const quotient = randInt(1, 5);
      const remainder = randInt(1, divisor - 1);
      const dividend = divisor * quotient + remainder;
      const fruit = fruits[randInt(0, fruits.length - 1)];

      divideAnswer = { dividend, divisor, quotient, remainder, fruit };

      document.getElementById('divideProblem').textContent = `把 ${dividend} 个${fruit}平均分成 ${divisor} 份，每份几个？还剩几个？`;
      document.getElementById('divideVisual').innerHTML = '';
      document.getElementById('remainderBox').style.display = 'none';
      document.getElementById('divideEquation').innerHTML = '';
    }

    function showDivideAnswer() {
      const { dividend, divisor, quotient, remainder, fruit } = divideAnswer;
      const visual = document.getElementById('divideVisual');
      let html = '';
      for (let i = 0; i < divisor; i++) {
        html += `<div class="divide-group"><div class="group-label">第${i + 1}份</div><div class="group-items">${fruit.repeat(quotient)}</div></div>`;
      }
      visual.innerHTML = html;

      if (remainder > 0) {
        document.getElementById('remainderBox').style.display = 'block';
        document.getElementById('remainderItems').textContent = fruit.repeat(remainder);
      }

      document.getElementById('divideEquation').innerHTML = `${dividend} ÷ ${divisor} = ${quotient} …… <span class="remainder-part">${remainder}</span>`;
    }

    document.getElementById('newDivideBtn').addEventListener('click', newDivideProblem);
    document.getElementById('showAnswerBtn').addEventListener('click', showDivideAnswer);
    newDivideProblem();

    // === 模式2: 算一算 ===
    let calcAnswer = {};
    let calcCorrectCount = 0, calcWrongCount = 0;

    function newCalcProblem() {
      const divisor = randInt(2, 9);
      const quotient = randInt(1, 9);
      const remainder = randInt(0, divisor - 1);
      const dividend = divisor * quotient + remainder;

      calcAnswer = { dividend, divisor, quotient, remainder };
      document.getElementById('calcProblem').textContent = `${dividend} ÷ ${divisor} = ？…… ？`;
      document.getElementById('calcQuotient').value = '';
      document.getElementById('calcRemainder').value = '';
      document.getElementById('calcQuotient').className = 'quiz-input';
      document.getElementById('calcRemainder').className = 'quiz-input';
      document.getElementById('calcFeedback').textContent = '';
    }

    document.getElementById('calcCheckBtn').addEventListener('click', () => {
      const q = parseInt(document.getElementById('calcQuotient').value);
      const r = parseInt(document.getElementById('calcRemainder').value);
      if (isNaN(q) || isNaN(r)) {
        document.getElementById('calcFeedback').textContent = '⚠️ 请填写完整答案';
        return;
      }
      const correct = q === calcAnswer.quotient && r === calcAnswer.remainder;
      document.getElementById('calcQuotient').classList.add(correct ? 'correct' : 'wrong');
      document.getElementById('calcRemainder').classList.add(correct ? 'correct' : 'wrong');
      if (correct) {
        document.getElementById('calcFeedback').textContent = '✅ 完全正确！';
        document.getElementById('calcFeedback').style.color = '#34C759';
        calcCorrectCount++;
        document.getElementById('calcCorrect').textContent = calcCorrectCount;
        setTimeout(newCalcProblem, 1500);
      } else {
        document.getElementById('calcFeedback').textContent = `❌ 正确答案：${calcAnswer.quotient}……${calcAnswer.remainder}`;
        document.getElementById('calcFeedback').style.color = '#FF3B30';
        calcWrongCount++;
        document.getElementById('calcWrong').textContent = calcWrongCount;
      }
    });

    document.getElementById('calcNextBtn').addEventListener('click', newCalcProblem);
    newCalcProblem();

    // === 模式3: 选一选 ===
    let choiceAnswer = '';
    let choiceCorrectCount = 0, choiceWrongCount = 0;

    function newChoiceProblem() {
      const types = ['findRemainder', 'findDividend', 'findDivisor', 'findQuotient'];
      const type = types[randInt(0, types.length - 1)];

      let problem, options, answer;

      if (type === 'findRemainder') {
        const divisor = randInt(2, 7);
        const quotient = randInt(2, 8);
        const remainder = randInt(1, divisor - 1);
        const dividend = divisor * quotient + remainder;
        problem = `${dividend} ÷ ${divisor} = ${quotient} …… ?`;
        answer = String(remainder);
        const opts = new Set([String(remainder)]);
        while (opts.size < 4) opts.add(String(randInt(0, divisor)));
        options = shuffle([...opts]);
      } else if (type === 'findDividend') {
        const divisor = randInt(2, 6);
        const quotient = randInt(2, 7);
        const remainder = randInt(1, divisor - 1);
        const dividend = divisor * quotient + remainder;
        problem = `? ÷ ${divisor} = ${quotient} …… ${remainder}`;
        answer = String(dividend);
        const opts = new Set([String(dividend)]);
        while (opts.size < 4) opts.add(String(dividend + randInt(-3, 3)));
        options = shuffle([...opts]);
      } else if (type === 'findDivisor') {
        const divisor = randInt(3, 8);
        const quotient = randInt(2, 6);
        const remainder = randInt(1, divisor - 1);
        const dividend = divisor * quotient + remainder;
        problem = `${dividend} ÷ ? = ${quotient} …… ${remainder}`;
        answer = String(divisor);
        const opts = new Set([String(divisor)]);
        while (opts.size < 4) {
          const d = randInt(2, 9);
          if (d !== divisor) opts.add(String(d));
        }
        options = shuffle([...opts]);
      } else {
        const divisor = randInt(2, 7);
        const quotient = randInt(2, 8);
        const remainder = randInt(0, divisor - 1);
        const dividend = divisor * quotient + remainder;
        problem = `${dividend} ÷ ${divisor} = ? …… ${remainder}`;
        answer = String(quotient);
        const opts = new Set([String(quotient)]);
        while (opts.size < 4) opts.add(String(randInt(1, 10)));
        options = shuffle([...opts]);
      }

      choiceAnswer = answer;
      document.getElementById('choiceProblem').textContent = problem;
      const optionsEl = document.getElementById('choiceOptions');
      optionsEl.innerHTML = '';
      document.getElementById('choiceFeedback').textContent = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleChoiceSelect(btn, opt));
        optionsEl.appendChild(btn);
      });
    }

    function handleChoiceSelect(btn, selected) {
      const allBtns = document.querySelectorAll('.choice-opt');
      allBtns.forEach(b => b.style.pointerEvents = 'none');
      if (selected === choiceAnswer) {
        btn.classList.add('correct');
        document.getElementById('choiceFeedback').textContent = '✅ 答对了！';
        document.getElementById('choiceFeedback').style.color = '#34C759';
        choiceCorrectCount++;
        document.getElementById('choiceCorrect').textContent = choiceCorrectCount;
        setTimeout(newChoiceProblem, 1500);
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => { if (b.textContent === choiceAnswer) b.classList.add('correct'); });
        document.getElementById('choiceFeedback').textContent = `❌ 正确答案是 ${choiceAnswer}`;
        document.getElementById('choiceFeedback').style.color = '#FF3B30';
        choiceWrongCount++;
        document.getElementById('choiceWrong').textContent = choiceWrongCount;
        setTimeout(newChoiceProblem, 2500);
      }
    }

    newChoiceProblem();

    // === 模式4: 应用题 ===
    const appTemplates = [
      { emoji: '🍪', item: '饼干', unit: '块' },
      { emoji: '✏️', item: '铅笔', unit: '支' },
      { emoji: '📚', item: '书', unit: '本' },
      { emoji: '🧁', item: '蛋糕', unit: '个' },
      { emoji: '⚽', item: '皮球', unit: '个' },
      { emoji: '🎈', item: '气球', unit: '个' },
      { emoji: '🍬', item: '糖果', unit: '颗' },
      { emoji: '🖍️', item: '蜡笔', unit: '支' }
    ];
    let appAnswer = {};
    let appCorrectCount = 0, appWrongCount = 0;

    function newAppProblem() {
      const template = appTemplates[randInt(0, appTemplates.length - 1)];
      const divisor = randInt(2, 6);
      const quotient = randInt(2, 7);
      const remainder = randInt(1, divisor - 1);
      const dividend = divisor * quotient + remainder;
      const people = divisor;
      const askType = randInt(0, 1);

      let story, question, inputCount;
      if (askType === 0) {
        story = `<span class="app-emoji">${template.emoji}</span>老师有 <b>${dividend}${template.unit}${template.item}</b>，要平均分给 <b>${people}个</b>小朋友。`;
        question = `每个小朋友分到几${template.unit}？还剩几${template.unit}？`;
        inputCount = 2;
        appAnswer = { quotient, remainder };
      } else {
        story = `<span class="app-emoji">${template.emoji}</span>${dividend}${template.unit}${template.item}，每袋装${divisor}${template.unit}，可以装满几袋？还剩几${template.unit}？`;
        question = `装满几袋？剩几${template.unit}？`;
        inputCount = 2;
        appAnswer = { quotient, remainder };
      }

      document.getElementById('appStory').innerHTML = story;
      document.getElementById('appQuestion').textContent = question;

      const inputRow = document.getElementById('appInputRow');
      inputRow.innerHTML = '';
      if (inputCount === 2) {
        inputRow.innerHTML = `
          <span class="app-unit">商=</span>
          <input type="number" class="app-input" id="appInput1" placeholder="?">
          <span class="app-unit">余数=</span>
          <input type="number" class="app-input" id="appInput2" placeholder="?">
        `;
      }

      document.getElementById('appFeedback').textContent = '';
      document.getElementById('appInput1')?.classList.remove('correct', 'wrong');
      document.getElementById('appInput2')?.classList.remove('correct', 'wrong');
    }

    document.getElementById('appCheckBtn').addEventListener('click', () => {
      const v1 = parseInt(document.getElementById('appInput1')?.value);
      const v2 = parseInt(document.getElementById('appInput2')?.value);
      if (isNaN(v1) || isNaN(v2)) {
        document.getElementById('appFeedback').textContent = '⚠️ 请填写完整答案';
        return;
      }
      const correct = v1 === appAnswer.quotient && v2 === appAnswer.remainder;
      const input1 = document.getElementById('appInput1');
      const input2 = document.getElementById('appInput2');
      if (correct) {
        input1?.classList.add('correct');
        input2?.classList.add('correct');
        document.getElementById('appFeedback').textContent = '✅ 完全正确！';
        document.getElementById('appFeedback').style.color = '#34C759';
        appCorrectCount++;
        document.getElementById('appCorrect').textContent = appCorrectCount;
        setTimeout(newAppProblem, 1500);
      } else {
        input1?.classList.add('wrong');
        input2?.classList.add('wrong');
        document.getElementById('appFeedback').textContent = `❌ 正确答案：${appAnswer.quotient}……${appAnswer.remainder}`;
        document.getElementById('appFeedback').style.color = '#FF3B30';
        appWrongCount++;
        document.getElementById('appWrong').textContent = appWrongCount;
      }
    });

    document.getElementById('appNextBtn').addEventListener('click', newAppProblem);
    newAppProblem();
  </script>
</body>
</html>
