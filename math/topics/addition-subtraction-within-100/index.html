<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>100以内加减法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E91E63; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }

    /* === 模式1: 方块演示 === */
    .blocks-area { text-align: center; padding: 20px 16px; }
    .blocks-problem { font-size: 40px; font-weight: 700; color: #E91E63; margin: 12px 0; }
    .blocks-container {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin: 16px 0; flex-wrap: wrap;
    }
    .blocks-group {
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
      padding: 10px; background: rgba(233,30,99,0.05); border-radius: 16px;
      min-width: 50px; max-width: 200px;
    }
    .block-unit {
      width: 24px; height: 24px; border-radius: 5px; display: flex;
      align-items: center; justify-content: center; font-size: 14px;
      animation: popIn 0.2s ease both;
    }
    .block-unit.a-color { background: rgba(233,30,99,0.2); border: 2px solid #E91E63; }
    .block-unit.b-color { background: rgba(255,152,0,0.2); border: 2px solid #FF9800; }
    .block-ten-bar {
      width: 32px; height: 100px; border-radius: 6px;
      background: linear-gradient(180deg, rgba(76,175,80,0.3) 0%, rgba(76,175,80,0.15) 100%);
      border: 2px solid #4CAF50; display: flex; flex-direction: column;
      align-items: center; justify-content: space-around; padding: 2px;
      font-size: 10px; color: #4CAF50; font-weight: 700;
    }
    .blocks-op { font-size: 40px; font-weight: 700; color: #6E6E73; }
    .blocks-result { font-size: 44px; font-weight: 800; color: #4CAF50; }
    .blocks-nav { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .blocks-nav-btn {
      padding: 12px 24px; border: 2px solid #E91E63; background: white;
      border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      color: #E91E63; transition: all 0.2s ease;
    }
    .blocks-nav-btn:active { transform: scale(0.95); }
    .blocks-nav-btn.primary { background: #E91E63; color: white; }
    .blocks-explain {
      font-size: 15px; color: #6E6E73; line-height: 1.8; margin: 12px 0;
      padding: 14px; background: #FFF8E1; border-radius: 12px; text-align: left;
    }
    .blocks-explain .hl { color: #E91E63; font-weight: 700; }
    .blocks-explain .hl-green { color: #4CAF50; font-weight: 700; }
    .blocks-explain .hl-orange { color: #FF9800; font-weight: 700; }

    /* === 模式2: 竖式计算 === */
    .vertical-area { text-align: center; padding: 20px 16px; }
    .vertical-problem-label { font-size: 18px; font-weight: 600; color: #6E6E73; margin-bottom: 12px; }
    .vertical-box {
      display: inline-block; background: #FFF; border: 3px solid #E0E0E0;
      border-radius: 16px; padding: 20px 28px; margin: 12px 0;
      font-family: 'Courier New', monospace;
    }
    .vertical-row {
      display: flex; align-items: center; justify-content: flex-end; gap: 0;
      font-size: 36px; font-weight: 700;
    }
    .v-digit {
      width: 44px; height: 52px; display: flex; align-items: center;
      justify-content: center; border-bottom: 3px solid #333;
    }
    .v-digit.carry { border-bottom-color: transparent; font-size: 16px; color: #FF9800; height: 28px; }
    .v-digit.op-cell { border-bottom-color: transparent; font-size: 28px; color: #E91E63; }
    .v-digit.result-cell { border-bottom-color: #E91E63; color: #E91E63; }
    .v-digit.result-filled { border-bottom-color: #4CAF50; color: #4CAF50; }
    .vertical-input-row {
      display: flex; justify-content: center; gap: 8px; margin: 16px 0; align-items: center;
    }
    .v-input {
      width: 52px; height: 56px; border: 3px solid #BDBDBD; border-radius: 12px;
      font-size: 28px; font-weight: 700; text-align: center; color: #E91E63;
      outline: none; transition: border-color 0.2s;
    }
    .v-input:focus { border-color: #E91E63; }
    .v-input.correct { border-color: #4CAF50; background: rgba(76,175,80,0.1); }
    .v-input.wrong { border-color: #F44336; background: rgba(244,67,54,0.1); }
    .v-label { font-size: 14px; color: #999; margin-top: 4px; }
    .vertical-numpad {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
      max-width: 300px; margin: 12px auto;
    }
    .vn-btn {
      height: 48px; border: 2px solid #BDBDBD; background: #FAFAFA;
      border-radius: 10px; font-size: 20px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .vn-btn:active { transform: scale(0.9); }
    .vn-btn.accent { background: #E91E63; color: white; border-color: #E91E63; }
    .vn-btn.del { border-color: #F44336; color: #F44336; }
    .v-score { display: flex; justify-content: center; gap: 16px; margin: 8px 0; font-size: 15px; }
    .v-hint { font-size: 15px; color: #999; margin: 8px 0; }

    /* === 模式3: 比大小 === */
    .compare-area { text-align: center; padding: 20px 16px; }
    .compare-numbers {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin: 20px 0; flex-wrap: wrap;
    }
    .num-display {
      font-size: 44px; font-weight: 800; padding: 12px 20px;
      background: #FCE4EC; border-radius: 16px; min-width: 90px;
    }
    .compare-q { font-size: 44px; color: #BDBDBD; }
    .compare-options { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .compare-btn {
      width: 72px; height: 72px; border: 3px solid #BDBDBD; background: #FAFAFA;
      border-radius: 18px; font-size: 32px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .compare-btn:active { transform: scale(0.9); }
    .compare-btn.correct { border-color: #4CAF50; background: rgba(76,175,80,0.15); color: #4CAF50; }
    .compare-btn.wrong { border-color: #F44336; background: rgba(244,67,54,0.1); color: #F44336; }
    .compare-visual { margin: 16px auto; max-width: 320px; }
    .cmp-bar-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .cmp-bar-label { font-size: 16px; font-weight: 700; color: #E91E63; width: 50px; text-align: right; }
    .cmp-bar-track { flex: 1; height: 24px; background: #E0E0E0; border-radius: 12px; overflow: hidden; }
    .cmp-bar-fill { height: 100%; border-radius: 12px; transition: width 0.5s ease; }
    .cmp-bar-fill.a { background: linear-gradient(90deg, #E91E63, #F48FB1); }
    .cmp-bar-fill.b { background: linear-gradient(90deg, #FF9800, #FFCC80); }
    .compare-score { display: flex; justify-content: center; gap: 16px; margin: 8px 0; font-size: 15px; }

    /* === 模式4: 限时挑战 === */
    .challenge-score { display: flex; justify-content: center; gap: 16px; margin: 12px 0; font-size: 15px; }
    .timer-bar { height: 8px; background: #E0E0E0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #FF9800, #F44336); border-radius: 4px; transition: width 0.1s linear; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #E91E63; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block; box-shadow: 0 4px 12px rgba(233,30,99,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .challenge-problem { font-size: 36px; font-weight: 800; color: #1D1D1F; margin: 16px 0; }
    .challenge-options { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }
    .challenge-opt {
      padding: 16px 24px; border: 3px solid #BDBDBD; background: #FAFAFA;
      border-radius: 16px; font-size: 24px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease; min-width: 80px; text-align: center;
    }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #4CAF50; background: rgba(76,175,80,0.15); color: #4CAF50; }
    .challenge-opt.wrong { border-color: #F44336; background: rgba(244,67,54,0.1); color: #F44336; }
    .challenge-toolbar { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
    .toolbar-btn {
      padding: 8px 16px; border: 2px solid #BDBDBD; background: white;
      border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .toolbar-btn:active { transform: scale(0.95); }
    .toolbar-btn.danger { border-color: #F44336; color: #F44336; }
    .history-panel { display: none; }
    .history-panel.show { display: block; animation: fadeInUp 0.3s ease; }
    .challenge-history { max-height: 200px; overflow-y: auto; margin: 8px 0; padding: 8px; background: #F8F9FE; border-radius: 12px; }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; border-radius: 8px; margin: 4px 0; font-size: 14px; font-weight: 600;
    }
    .history-item.correct { background: rgba(76,175,80,0.1); color: #4CAF50; }
    .history-item.wrong { background: rgba(244,67,54,0.1); color: #F44336; }
    .history-item.timeout { background: rgba(255,152,0,0.15); color: #FF9800; }
    .history-item .problem { color: #6E6E73; }

    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeInUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" onclick="location.href='../../index.html'" aria-label="返回">←</button>
      <span class="nav-title">🧮 100以内加减法</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display">
      <span>连续答对</span><span id="streak" style="color:#FF9800">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="blocks">🧱 方块演示</button>
      <button class="mode-tab" data-mode="vertical">📝 竖式计算</button>
      <button class="mode-tab" data-mode="compare">⚖️ 比大小</button>
      <button class="mode-tab" data-mode="challenge">⏱️ 限时挑战</button>
    </div>

    <!-- 模式1: 方块演示 -->
    <div class="mode-content active" id="mode-blocks">
      <div class="card">
        <p class="page-subtitle">用方块看看怎么加、怎么减</p>
        <div class="blocks-area">
          <div class="blocks-problem" id="blk-problem"></div>
          <div class="blocks-container" id="blk-container"></div>
          <div class="blocks-result" id="blk-result"></div>
          <div class="blocks-explain" id="blk-explain"></div>
          <div class="blocks-nav">
            <button class="blocks-nav-btn" id="blk-prev">⬅️ 上一步</button>
            <button class="blocks-nav-btn primary" id="blk-next">下一步 ➡️</button>
            <button class="blocks-nav-btn" id="blk-new">🔄 换一题</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 竖式计算 -->
    <div class="mode-content" id="mode-vertical">
      <div class="card">
        <p class="page-subtitle">列竖式，逐位计算</p>
        <div class="vertical-area">
          <div class="v-score">
            <span>答对 <b id="v-correct" style="color:#4CAF50">0</b></span>
            <span>答错 <b id="v-wrong" style="color:#F44336">0</b></span>
          </div>
          <div class="vertical-problem-label" id="v-label"></div>
          <div class="vertical-box" id="v-box"></div>
          <div class="vertical-input-row" id="v-input-row"></div>
          <div class="v-hint" id="v-hint"></div>
          <div class="vertical-numpad" id="v-numpad"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 比大小 -->
    <div class="mode-content" id="mode-compare">
      <div class="card">
        <p class="page-subtitle">算一算，比一比，谁大谁小？</p>
        <div class="compare-area">
          <div class="compare-score">
            <span>答对 <b id="cmp-correct" style="color:#4CAF50">0</b></span>
            <span>答错 <b id="cmp-wrong" style="color:#F44336">0</b></span>
          </div>
          <div class="compare-numbers" id="cmp-numbers"></div>
          <div class="compare-visual" id="cmp-visual"></div>
          <div class="compare-options" id="cmp-options">
            <button class="compare-btn" data-val=">">＞</button>
            <button class="compare-btn" data-val="<">＜</button>
            <button class="compare-btn" data-val="=">＝</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <p class="page-subtitle">60秒限时挑战，看你能答对几题！</p>
        <div class="challenge-score">
          <span>答对 <b id="ch-correct" style="color:#4CAF50">0</b></span>
          <span>答错 <b id="ch-wrong" style="color:#F44336">0</b></span>
          <span>超时 <b id="ch-timeout" style="color:#FF9800">0</b></span>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="ch-timer" style="width:100%"></div></div>
        <div id="ch-wrapper">
          <button class="challenge-start-btn" id="ch-start">🚀 开始挑战</button>
          <div class="challenge-running">
            <div class="challenge-toolbar" id="ch-toolbar" style="display:none">
              <button class="toolbar-btn" id="btn-history">📋 记录</button>
              <button class="toolbar-btn danger" id="btn-clear">🗑️ 清空</button>
            </div>
            <div class="history-panel" id="ch-history-panel">
              <div style="display:flex;justify-content:space-between;align-items:center;padding:8px">
                <span style="font-size:16px;font-weight:700;color:#E91E63">📋 答题记录</span>
                <button class="toolbar-btn" id="btn-close-history">关闭</button>
              </div>
              <div class="challenge-history" id="ch-history"></div>
            </div>
            <div class="challenge-problem" id="ch-problem"></div>
            <div class="challenge-options" id="ch-options"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    // ========== 全局状态 ==========
    let streak = 0;
    let activeMode = 'blocks';

    const $ = (s, p) => (p || document).querySelector(s);
    const $$ = (s, p) => [...(p || document).querySelectorAll(s)];

    function updateStreak(correct) {
      if (correct) { streak++; } else { streak = 0; }
      $('#streak').textContent = streak;
      const stars = streak >= 10 ? '🌟🌟🌟' : streak >= 5 ? '⭐⭐' : streak >= 1 ? '⭐' : '';
      $('#stars-display').textContent = stars;
      if (streak > 0 && streak % 5 === 0) celebrate();
    }

    // ========== 模式切换 ==========
    $$('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        $$('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        $$('.mode-content').forEach(c => c.classList.remove('active'));
        const mode = tab.dataset.mode;
        $(`#mode-${mode}`).classList.add('active');
        activeMode = mode;
        if (mode === 'vertical') initVertical();
        if (mode === 'compare') initCompare();
      });
    });

    // ========== 工具函数 ==========
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

    function genAddProblem() {
      const a = randInt(1, 80);
      const b = randInt(1, 99 - a);
      return { a, b, op: '+', answer: a + b };
    }
    function genSubProblem() {
      const a = randInt(10, 99);
      const b = randInt(1, a);
      return { a, b, op: '−', answer: a - b };
    }
    function genProblem() {
      return Math.random() < 0.5 ? genAddProblem() : genSubProblem();
    }

    // ========== 模式1: 方块演示 ==========
    let blkState = { problem: null, step: 0, maxSteps: 3 };

    function newBlockProblem() {
      blkState.problem = genProblem();
      blkState.step = 0;
      renderBlockStep();
    }

    function renderBlockStep() {
      const p = blkState.problem;
      const step = blkState.step;
      $('#blk-problem').textContent = `${p.a} ${p.op} ${p.b} = ？`;
      const container = $('#blk-container');
      const explain = $('#blk-explain');
      container.innerHTML = '';
      $('#blk-result').textContent = '';

      if (p.op === '+') {
        renderAddBlocks(p, step, container, explain);
      } else {
        renderSubBlocks(p, step, container, explain);
      }
    }

    function makeBlocks(num, colorClass) {
      const frag = document.createDocumentFragment();
      const tens = Math.floor(num / 10);
      const ones = num % 10;
      for (let i = 0; i < tens; i++) {
        const bar = document.createElement('div');
        bar.className = 'block-ten-bar';
        bar.innerHTML = '<span>10</span>';
        bar.style.animationDelay = `${i * 0.05}s`;
        frag.appendChild(bar);
      }
      if (ones > 0) {
        const group = document.createElement('div');
        group.className = 'blocks-group';
        for (let j = 0; j < ones; j++) {
          const b = document.createElement('div');
          b.className = `block-unit ${colorClass}`;
          b.textContent = '1';
          b.style.animationDelay = `${(tens + j) * 0.03}s`;
          group.appendChild(b);
        }
        frag.appendChild(group);
      }
      return frag;
    }

    function renderAddBlocks(p, step, container, explain) {
      const { a, b } = p;
      if (step === 0) {
        // 展示两个数
        container.appendChild(makeBlocks(a, 'a-color'));
        const op = document.createElement('div');
        op.className = 'blocks-op'; op.textContent = '+';
        container.appendChild(op);
        container.appendChild(makeBlocks(b, 'b-color'));
        explain.innerHTML = `<span class="hl">${a}</span> 加上 <span class="hl-orange">${b}</span>，我们把方块合在一起看看！`;
      } else if (step === 1) {
        // 合并个位
        const onesA = a % 10, onesB = b % 10;
        const tensA = Math.floor(a / 10), tensB = Math.floor(b / 10);
        const onesSum = onesA + onesB;
        const carry = onesSum >= 10 ? 1 : 0;
        const newOnes = onesSum % 10;
        const totalTens = tensA + tensB + carry;

        // 十位
        for (let i = 0; i < tensA + tensB; i++) {
          const bar = document.createElement('div');
          bar.className = 'block-ten-bar';
          bar.innerHTML = '<span>10</span>';
          container.appendChild(bar);
        }
        // 个位合成
        const g = document.createElement('div');
        g.className = 'blocks-group';
        g.style.background = 'rgba(76,175,80,0.08)';
        g.style.border = '2px dashed #4CAF50';
        for (let j = 0; j < onesSum; j++) {
          const bl = document.createElement('div');
          bl.className = 'block-unit';
          bl.style.background = 'rgba(76,175,80,0.2)';
          bl.style.border = '2px solid #4CAF50';
          bl.textContent = '1';
          bl.style.animationDelay = `${j * 0.03}s`;
          g.appendChild(bl);
        }
        container.appendChild(g);

        if (carry) {
          explain.innerHTML = `个位合起来有 <span class="hl-green">${onesSum}</span> 个！满10个可以捆成 <span class="hl-green">1个十</span>，还剩 <span class="hl-green">${newOnes}</span> 个一。`;
        } else {
          explain.innerHTML = `个位合起来有 <span class="hl-green">${onesSum}</span> 个，不到10，不用进位。十位有 <span class="hl">${tensA + tensB}</span> 个十。`;
        }
      } else if (step === 2) {
        // 显示结果
        const ans = p.answer;
        container.appendChild(makeBlocks(ans, 'a-color'));
        $('#blk-result').textContent = `= ${ans}`;
        const tensA = Math.floor(a / 10), tensB = Math.floor(b / 10);
        const onesSum = (a % 10) + (b % 10);
        const carry = onesSum >= 10;
        let txt = `${a} + ${b} = <span class="hl-green">${ans}</span>。`;
        if (carry) {
          txt += `<br>个位 ${(a%10)}+${(b%10)}=${onesSum}，满十进一！十位 ${tensA}+${tensB}+1=${Math.floor(ans/10)}。`;
        } else {
          txt += `<br>个位 ${(a%10)}+${(b%10)}=${onesSum}，十位 ${tensA}+${tensB}=${Math.floor(ans/10)}。`;
        }
        explain.innerHTML = txt;
        updateStreak(true);
      }
    }

    function renderSubBlocks(p, step, container, explain) {
      const { a, b } = p;
      if (step === 0) {
        container.appendChild(makeBlocks(a, 'a-color'));
        const op = document.createElement('div');
        op.className = 'blocks-op'; op.textContent = '−';
        container.appendChild(op);
        container.appendChild(makeBlocks(b, 'b-color'));
        explain.innerHTML = `从 <span class="hl">${a}</span> 里面去掉 <span class="hl-orange">${b}</span>，看看还剩多少！`;
      } else if (step === 1) {
        const onesA = a % 10, onesB = b % 10;
        const needBorrow = onesA < onesB;
        container.appendChild(makeBlocks(a, 'a-color'));
        if (needBorrow) {
          explain.innerHTML = `个位 ${onesA} 不够减 ${onesB}，需要从十位 <span class="hl-orange">借1当10</span>，变成 <span class="hl-green">${onesA + 10}</span> 个一！`;
        } else {
          explain.innerHTML = `个位 ${onesA} 减 ${onesB} 够减，直接算！十位也直接减。`;
        }
      } else if (step === 2) {
        const ans = p.answer;
        container.appendChild(makeBlocks(ans, 'a-color'));
        $('#blk-result').textContent = `= ${ans}`;
        const onesA = a % 10, onesB = b % 10;
        const tensA = Math.floor(a / 10), tensB = Math.floor(b / 10);
        const needBorrow = onesA < onesB;
        let txt = `${a} − ${b} = <span class="hl-green">${ans}</span>。`;
        if (needBorrow) {
          txt += `<br>个位不够减，借1当10：${onesA}+10−${onesB}=${ans%10}，十位 ${tensA}−1−${tensB}=${Math.floor(ans/10)}。`;
        } else {
          txt += `<br>个位 ${onesA}−${onesB}=${ans%10}，十位 ${tensA}−${tensB}=${Math.floor(ans/10)}。`;
        }
        explain.innerHTML = txt;
        updateStreak(true);
      }
    }

    $('#blk-next').addEventListener('click', () => {
      if (blkState.step < blkState.maxSteps - 1) {
        blkState.step++;
        renderBlockStep();
      }
    });
    $('#blk-prev').addEventListener('click', () => {
      if (blkState.step > 0) {
        blkState.step--;
        renderBlockStep();
      }
    });
    $('#blk-new').addEventListener('click', () => {
      $('#blk-result').textContent = '';
      newBlockProblem();
    });
    newBlockProblem();

    // ========== 模式2: 竖式计算 ==========
    let vState = { problem: null, digits: [], currentIdx: 0, correctCount: 0, wrongCount: 0, activeInput: null };

    function initVertical() {
      vState.correctCount = 0;
      vState.wrongCount = 0;
      $('#v-correct').textContent = '0';
      $('#v-wrong').textContent = '0';
      buildNumpad();
      newVerticalProblem();
    }

    function newVerticalProblem() {
      vState.problem = genProblem();
      const p = vState.problem;
      const ans = p.answer;
      const ansStr = String(ans);

      // 确定需要填的位数
      vState.digits = [];
      vState.currentIdx = 0;

      // 显示竖式
      const aStr = String(p.a).padStart(2, ' ');
      const bStr = String(p.b).padStart(2, ' ');

      $('#v-label').textContent = `列竖式计算 ${p.a} ${p.op} ${p.b}`;

      const box = $('#v-box');
      const hasCarry = p.op === '+' && (p.a % 10) + (p.b % 10) >= 10;
      const hasBorrow = p.op === '−' && (p.a % 10) < (p.b % 10);

      let html = '';
      // 进位/借位行
      if (hasCarry) {
        html += `<div class="vertical-row"><div class="v-digit carry"></div><div class="v-digit carry" style="color:#FF9800;font-size:18px">1</div><div class="v-digit carry"></div></div>`;
      } else if (hasBorrow) {
        html += `<div class="vertical-row"><div class="v-digit carry"></div><div class="v-digit carry"></div><div class="v-digit carry"></div></div>`;
      } else {
        html += `<div class="vertical-row"><div class="v-digit carry"></div><div class="v-digit carry"></div><div class="v-digit carry"></div></div>`;
      }
      // 第一个数
      html += `<div class="vertical-row">`;
      if (p.a < 10) html += `<div class="v-digit"></div>`;
      for (const ch of String(p.a)) html += `<div class="v-digit">${ch}</div>`;
      html += `</div>`;
      // 运算符 + 第二个数
      html += `<div class="vertical-row">`;
      html += `<div class="v-digit op-cell">${p.op}</div>`;
      if (p.b < 10) html += `<div class="v-digit"></div>`;
      for (const ch of String(p.b)) html += `<div class="v-digit">${ch}</div>`;
      html += `</div>`;
      // 分隔线
      html += `<div class="vertical-row" style="border-bottom:3px solid #333;margin-bottom:4px"></div>`;
      box.innerHTML = html;

      // 输入行
      const inputRow = $('#v-input-row');
      inputRow.innerHTML = '';
      const ansDigits = ansStr.split('').map(Number);
      vState.digits = ansDigits;
      vState.currentIdx = 0;

      for (let i = 0; i < ansDigits.length; i++) {
        const inp = document.createElement('input');
        inp.className = 'v-input';
        inp.type = 'text';
        inp.inputMode = 'none';
        inp.maxLength = 1;
        inp.dataset.idx = i;
        inp.readOnly = true;
        inp.addEventListener('focus', () => { vState.activeInput = i; });
        inputRow.appendChild(inp);
        if (i < ansDigits.length - 1) {
          const lbl = document.createElement('div');
          lbl.className = 'v-label';
          lbl.style.width = '52px';
          lbl.style.textAlign = 'center';
          lbl.textContent = i === 0 && ansDigits.length > 1 ? '十位' : '个位';
          inputRow.appendChild(lbl);
        }
      }
      // 第一位标签
      const firstLbl = document.createElement('div');
      firstLbl.className = 'v-label';
      firstLbl.style.width = '52px';
      firstLbl.style.textAlign = 'center';
      firstLbl.textContent = ansDigits.length > 1 ? '百位' : '个位';
      inputRow.insertBefore(firstLbl, inputRow.firstChild);

      // 自动聚焦第一个
      setTimeout(() => {
        vState.activeInput = 0;
        const firstInp = inputRow.querySelector('.v-input');
        if (firstInp) firstInp.style.borderColor = '#E91E63';
      }, 100);

      $('#v-hint').textContent = '点击下方数字键填入答案（从高位到低位）';
    }

    function buildNumpad() {
      const pad = $('#v-numpad');
      pad.innerHTML = '';
      for (let i = 0; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'vn-btn';
        btn.textContent = i;
        btn.dataset.num = i;
        btn.addEventListener('click', () => handleVNum(i));
        pad.appendChild(btn);
      }
      const delBtn = document.createElement('button');
      delBtn.className = 'vn-btn del';
      delBtn.textContent = '⌫';
      delBtn.addEventListener('click', () => handleVDel());
      pad.appendChild(delBtn);
    }

    function handleVNum(n) {
      const inputs = $$('#v-input-row .v-input');
      if (vState.activeInput === null || vState.activeInput >= inputs.length) return;
      const inp = inputs[vState.activeIdx !== undefined ? vState.activeInput : 0];
      if (!inp) return;
      inp.value = n;
      const expected = vState.digits[vState.activeInput];
      if (n === expected) {
        inp.classList.add('correct');
        inp.classList.remove('wrong');
        vState.activeInput++;
        if (vState.activeInput < inputs.length) {
          inputs[vState.activeInput].style.borderColor = '#E91E63';
        } else {
          // 全部填完
          vState.correctCount++;
          $('#v-correct').textContent = vState.correctCount;
          updateStreak(true);
          showToast('✅ 答对啦！', 'success');
          setTimeout(newVerticalProblem, 1500);
        }
      } else {
        inp.classList.add('wrong');
        inp.classList.remove('correct');
        vState.wrongCount++;
        $('#v-wrong').textContent = vState.wrongCount;
        updateStreak(false);
        showToast(`❌ 再想想哦`, 'error');
        setTimeout(() => { inp.value = ''; inp.classList.remove('wrong'); }, 800);
      }
    }

    function handleVDel() {
      const inputs = $$('#v-input-row .v-input');
      if (vState.activeInput > 0) {
        vState.activeInput--;
        const inp = inputs[vState.activeInput];
        inp.value = '';
        inp.classList.remove('correct', 'wrong');
        inputs.forEach((el, i) => {
          el.style.borderColor = i === vState.activeInput ? '#E91E63' : '#BDBDBD';
        });
      }
    }

    // ========== 模式3: 比大小 ==========
    let cmpState = { a: 0, b: 0, answer: '', correctCount: 0, wrongCount: 0 };

    function initCompare() {
      cmpState.correctCount = 0;
      cmpState.wrongCount = 0;
      $('#cmp-correct').textContent = '0';
      $('#cmp-wrong').textContent = '0';
      newCompareProblem();
    }

    function newCompareProblem() {
      // 生成两个算式
      const p1 = genProblem();
      const p2 = genProblem();
      const expr1 = `${p1.a} ${p1.op} ${p1.b}`;
      const expr2 = `${p2.a} ${p2.op} ${p2.b}`;
      const val1 = p1.answer;
      const val2 = p2.answer;
      cmpState.a = val1;
      cmpState.b = val2;
      cmpState.answer = val1 > val2 ? '>' : val1 < val2 ? '<' : '=';

      const nums = $('#cmp-numbers');
      nums.innerHTML = `
        <div class="num-display">${expr1}<br><span style="font-size:20px;color:#999">= ${val1}</span></div>
        <div class="compare-q">○</div>
        <div class="num-display">${expr2}<br><span style="font-size:20px;color:#999">= ${val2}</span></div>
      `;

      // 柱状图
      const maxVal = Math.max(val1, val2, 1);
      $('#cmp-visual').innerHTML = `
        <div class="cmp-bar-row">
          <div class="cmp-bar-label">${val1}</div>
          <div class="cmp-bar-track"><div class="cmp-bar-fill a" style="width:${(val1/maxVal)*100}%"></div></div>
        </div>
        <div class="cmp-bar-row">
          <div class="cmp-bar-label">${val2}</div>
          <div class="cmp-bar-track"><div class="cmp-bar-fill b" style="width:${(val2/maxVal)*100}%"></div></div>
        </div>
      `;

      // 重置按钮
      $$('#cmp-options .compare-btn').forEach(btn => {
        btn.classList.remove('correct', 'wrong');
      });
    }

    $$('#cmp-options .compare-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        if (val === cmpState.answer) {
          btn.classList.add('correct');
          cmpState.correctCount++;
          $('#cmp-correct').textContent = cmpState.correctCount;
          updateStreak(true);
          showToast('✅ 答对啦！', 'success');
          setTimeout(newCompareProblem, 1500);
        } else {
          btn.classList.add('wrong');
          cmpState.wrongCount++;
          $('#cmp-wrong').textContent = cmpState.wrongCount;
          updateStreak(false);
          showToast(`❌ ${cmpState.a} ${cmpState.answer} ${cmpState.b}`, 'error');
          setTimeout(() => btn.classList.remove('wrong'), 800);
        }
      });
    });

    initCompare();

    // ========== 模式4: 限时挑战 ==========
    let chState = {
      running: false, timer: null, timeLeft: 60, totalTime: 60,
      correct: 0, wrong: 0, timeout: 0, currentProblem: null,
      history: [], problemTimer: null, problemTimeLeft: 0, problemTimeMax: 10
    };

    function startChallenge() {
      chState.running = true;
      chState.timeLeft = chState.totalTime;
      chState.correct = 0;
      chState.wrong = 0;
      chState.timeout = 0;
      chState.history = [];
      $('#ch-correct').textContent = '0';
      $('#ch-wrong').textContent = '0';
      $('#ch-timeout').textContent = '0';
      $('#ch-wrapper').classList.add('challenge-active');
      $('#ch-toolbar').style.display = 'flex';
      $('#ch-history-panel').classList.remove('show');
      updateTimerBar();
      nextChallengeProblem();
      chState.timer = setInterval(() => {
        chState.timeLeft--;
        updateTimerBar();
        if (chState.timeLeft <= 0) endChallenge();
      }, 1000);
    }

    function updateTimerBar() {
      const pct = (chState.timeLeft / chState.totalTime) * 100;
      $('#ch-timer').style.width = pct + '%';
    }

    function endChallenge() {
      clearInterval(chState.timer);
      clearTimeout(chState.problemTimer);
      chState.running = false;
      $('#ch-wrapper').classList.remove('challenge-active');
      const msg = `⏱️ 时间到！答对 ${chState.correct} 题，答错 ${chState.wrong} 题`;
      showToast(msg, 'success', 3000);
    }

    function nextChallengeProblem() {
      if (!chState.running) return;
      chState.currentProblem = genProblem();
      const p = chState.currentProblem;
      $('#ch-problem').textContent = `${p.a} ${p.op} ${p.b} = ？`;

      // 生成选项
      const opts = new Set([p.answer]);
      while (opts.size < 4) {
        let fake = p.answer + randInt(-10, 10);
        if (fake < 0) fake = Math.abs(fake);
        if (fake > 199) fake = 199;
        if (fake !== p.answer) opts.add(fake);
      }
      const shuffled = [...opts].sort(() => Math.random() - 0.5);
      const optDiv = $('#ch-options');
      optDiv.innerHTML = '';
      shuffled.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'challenge-opt';
        btn.textContent = val;
        btn.addEventListener('click', () => handleChallengeAnswer(val, btn));
        optDiv.appendChild(btn);
      });

      // 单题计时
      chState.problemTimeLeft = chState.problemTimeMax;
      clearInterval(chState.problemTimer);
      chState.problemTimer = setInterval(() => {
        chState.problemTimeLeft--;
        if (chState.problemTimeLeft <= 0) {
          clearInterval(chState.problemTimer);
          chState.timeout++;
          $('#ch-timeout').textContent = chState.timeout;
          addHistory('timeout', `${p.a} ${p.op} ${p.b}`, p.answer);
          updateStreak(false);
          setTimeout(nextChallengeProblem, 500);
        }
      }, 1000);
    }

    function handleChallengeAnswer(val, btn) {
      if (!chState.running) return;
      clearInterval(chState.problemTimer);
      const p = chState.currentProblem;
      if (val === p.answer) {
        btn.classList.add('correct');
        chState.correct++;
        $('#ch-correct').textContent = chState.correct;
        updateStreak(true);
        addHistory('correct', `${p.a} ${p.op} ${p.b} = ${p.answer}`);
      } else {
        btn.classList.add('wrong');
        chState.wrong++;
        $('#ch-wrong').textContent = chState.wrong;
        updateStreak(false);
        addHistory('wrong', `${p.a} ${p.op} ${p.b}`, p.answer);
        // 高亮正确答案
        $$('#ch-options .challenge-opt').forEach(b => {
          if (parseInt(b.textContent) === p.answer) b.classList.add('correct');
        });
      }
      $$('#ch-options .challenge-opt').forEach(b => b.style.pointerEvents = 'none');
      setTimeout(nextChallengeProblem, 1500);
    }

    function addHistory(type, text, answer) {
      chState.history.unshift({ type, text, answer });
      renderHistory();
    }

    function renderHistory() {
      const div = $('#ch-history');
      div.innerHTML = chState.history.map(h => {
        const cls = h.type;
        let right = '';
        if (h.type === 'wrong' || h.type === 'timeout') right = ` → ${h.answer}`;
        return `<div class="history-item ${cls}"><span class="problem">${h.text}</span><span>${h.type === 'correct' ? '✅' : h.type === 'wrong' ? '❌' : '⏰'}${right}</span></div>`;
      }).join('');
    }

    $('#ch-start').addEventListener('click', startChallenge);
    $('#btn-history').addEventListener('click', () => {
      $('#ch-history-panel').classList.toggle('show');
    });
    $('#btn-close-history').addEventListener('click', () => {
      $('#ch-history-panel').classList.remove('show');
    });
    $('#btn-clear').addEventListener('click', () => {
      chState.history = [];
      renderHistory();
      showToast('记录已清空');
    });

  })();
  </script>
</body>
</html>
