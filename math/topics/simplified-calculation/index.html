<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>简便计算</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #FF9500; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* nav */
    .nav-bar {
      display: flex; align-items: center; padding: 12px 16px; margin-bottom: 8px;
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      text-decoration: none; color: #FF9500; font-weight: 600; font-size: 15px;
    }
    .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; color: #1D1D1F; }

    /* === 模式1: 凑十法 === */
    .make-ten-area { text-align: center; padding: 24px 16px; }
    .make-ten-problem {
      font-size: 32px; font-weight: 800; color: #1D1D1F; margin: 20px 0;
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .make-ten-hint {
      font-size: 16px; color: #6E6E73; margin: 12px 0;
      background: rgba(255,149,0,0.08); padding: 12px 16px; border-radius: 12px;
    }
    .make-ten-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 16px;
    }
    .make-ten-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .make-ten-opt:active { transform: scale(0.95); }
    .make-ten-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .make-ten-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .make-ten-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .make-ten-score {
      display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px;
    }
    .streak-badge { color: #FF9500; font-weight: 700; }

    /* === 模式2: 凑整法 === */
    .round-area { text-align: center; padding: 24px 16px; }
    .round-problem {
      font-size: 28px; font-weight: 800; color: #1D1D1F; margin: 20px 0;
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .round-strategy {
      font-size: 15px; color: #6E6E73; margin: 12px 0;
      background: rgba(255,149,0,0.08); padding: 12px 16px; border-radius: 12px;
      text-align: left; line-height: 1.6;
    }
    .round-strategy .highlight { color: #FF9500; font-weight: 700; }
    .round-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 16px;
    }
    .round-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .round-opt:active { transform: scale(0.95); }
    .round-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .round-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .round-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .round-score {
      display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px;
    }

    /* === 模式3: 拆分法 === */
    .split-area { text-align: center; padding: 24px 16px; }
    .split-problem {
      font-size: 28px; font-weight: 800; color: #1D1D1F; margin: 20px 0;
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .split-visual {
      display: flex; justify-content: center; align-items: center; gap: 12px;
      margin: 20px 0; flex-wrap: wrap;
    }
    .split-box {
      background: white; border-radius: 12px; padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-width: 80px;
      border-left: 4px solid #FF9500;
    }
    .split-box .num { font-size: 24px; font-weight: 700; color: #FF9500; }
    .split-box .label { font-size: 12px; color: #6E6E73; margin-top: 4px; }
    .split-op { font-size: 32px; font-weight: 700; color: #6E6E73; }
    .split-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 16px;
    }
    .split-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .split-opt:active { transform: scale(0.95); }
    .split-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .split-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .split-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .split-score {
      display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px;
    }

    /* === 模式4: 挑战模式 === */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #FF9500; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block; box-shadow: 0 4px 12px rgba(255,149,0,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .challenge-problem {
      font-size: 28px; font-weight: 800; color: #1D1D1F; margin: 16px 0;
      background: white; padding: 16px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .challenge-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 16px auto; padding: 0 16px;
    }
    .challenge-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .challenge-opt:active { transform: scale(0.95); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .timer-bar { height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 16px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30); border-radius: 4px; transition: width 0.1s linear; }
    .challenge-score {
      display: flex; justify-content: center; gap: 24px; margin: 16px 0; font-size: 18px;
    }
    .challenge-history { max-height: 200px; overflow-y: auto; margin: 12px 0; padding: 8px; background: #F8F9FE; border-radius: 12px; }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; border-radius: 8px; margin: 4px 0; font-size: 14px; font-weight: 600;
    }
    .history-item.correct { background: rgba(52,199,89,0.1); color: #34C759; }
    .history-item.wrong { background: rgba(255,59,48,0.1); color: #FF3B30; }
    .history-item .problem { color: #6E6E73; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">简便计算</span>
    </nav>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="make-ten">🔟 凑十法</button>
      <button class="mode-tab" data-mode="round">💯 凑整法</button>
      <button class="mode-tab" data-mode="split">✂️ 拆分法</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 凑十法 -->
    <div class="mode-content active" id="mode-make-ten">
      <div class="card">
        <p class="page-subtitle">先凑成10，再加剩下的</p>
        <div class="make-ten-area">
          <div class="make-ten-problem" id="makeTenProblem"></div>
          <div class="make-ten-hint" id="makeTenHint"></div>
          <div class="make-ten-options" id="makeTenOptions"></div>
          <div class="make-ten-feedback" id="makeTenFeedback"></div>
          <div class="make-ten-score">
            <span>✅ <span id="makeTenCorrect">0</span></span>
            <span>❌ <span id="makeTenWrong">0</span></span>
            <span class="streak-badge">🔥 <span id="makeTenStreak">0</span></span>
          </div>
          <button class="btn btn-primary btn-large" id="btnMakeTenNext">下一题 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 凑整法 -->
    <div class="mode-content" id="mode-round">
      <div class="card">
        <p class="page-subtitle">把数凑成整十、整百，再调整</p>
        <div class="round-area">
          <div class="round-problem" id="roundProblem"></div>
          <div class="round-strategy" id="roundStrategy"></div>
          <div class="round-options" id="roundOptions"></div>
          <div class="round-feedback" id="roundFeedback"></div>
          <div class="round-score">
            <span>✅ <span id="roundCorrect">0</span></span>
            <span>❌ <span id="roundWrong">0</span></span>
            <span class="streak-badge">🔥 <span id="roundStreak">0</span></span>
          </div>
          <button class="btn btn-primary btn-large" id="btnRoundNext">下一题 →</button>
        </div>
      </div>
    </div>

    <!-- 模式3: 拆分法 -->
    <div class="mode-content" id="mode-split">
      <div class="card">
        <p class="page-subtitle">把大数拆成小数，分步计算</p>
        <div class="split-area">
          <div class="split-problem" id="splitProblem"></div>
          <div class="split-visual" id="splitVisual"></div>
          <div class="split-options" id="splitOptions"></div>
          <div class="split-feedback" id="splitFeedback"></div>
          <div class="split-score">
            <span>✅ <span id="splitCorrect">0</span></span>
            <span>❌ <span id="splitWrong">0</span></span>
            <span class="streak-badge">🔥 <span id="splitStreak">0</span></span>
          </div>
          <button class="btn btn-primary btn-large" id="btnSplitNext">下一题 →</button>
        </div>
      </div>
    </div>

    <!-- 模式4: 挑战模式 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <p class="page-subtitle">60秒挑战，看你能答对多少题！</p>
        <div class="challenge-area" id="challengeArea">
          <button class="challenge-start-btn" id="btnChallengeStart">🚀 开始挑战</button>
          <div class="challenge-running">
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="challenge-problem" id="challengeProblem"></div>
            <div class="challenge-options" id="challengeOptions"></div>
            <div class="challenge-feedback" id="challengeFeedback"></div>
            <div class="challenge-score">
              <span>⏱️ <span id="challengeTime">60</span>s</span>
              <span>✅ <span id="challengeCorrect">0</span></span>
              <span>❌ <span id="challengeWrong">0</span></span>
            </div>
            <div class="challenge-history" id="challengeHistory"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 凑十法 ===
    (function() {
      let correct = 0, wrong = 0, streak = 0;
      let answer = 0;

      function newMakeTen() {
        const a = Random.int(2, 9);
        const b = Random.int(11, 19);
        answer = a + b;
        const need = 10 - a;
        const split = b - need;

        document.getElementById('makeTenProblem').textContent = `${a} + ${b} = ?`;
        document.getElementById('makeTenHint').innerHTML = 
          `💡 把 ${b} 拆成 <span style="color:#FF9500;font-weight:700">${need}</span> 和 <span style="color:#FF9500;font-weight:700">${split}</span>，先算 ${a} + ${need} = 10，再算 10 + ${split} = ?`;

        const opts = document.getElementById('makeTenOptions');
        opts.innerHTML = '';
        const choices = Random.shuffle([answer, answer + 1, answer - 1, answer + 2]);
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'make-ten-opt';
          btn.textContent = c;
          btn.addEventListener('click', () => {
            if (c === answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('makeTenCorrect').textContent = correct;
              document.getElementById('makeTenStreak').textContent = streak;
              document.getElementById('makeTenFeedback').textContent = '🎉 答对了！';
              document.getElementById('makeTenFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              setTimeout(newMakeTen, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('makeTenWrong').textContent = wrong;
              document.getElementById('makeTenStreak').textContent = streak;
              document.getElementById('makeTenFeedback').textContent = `❌ 再想想，先凑成10哦`;
              document.getElementById('makeTenFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          opts.appendChild(btn);
        });
        document.getElementById('makeTenFeedback').textContent = '';
        document.getElementById('makeTenFeedback').style.color = '';
      }

      document.getElementById('btnMakeTenNext').addEventListener('click', () => { Sound.play('click'); newMakeTen(); });
      newMakeTen();
    })();

    // === 模式2: 凑整法 ===
    (function() {
      let correct = 0, wrong = 0, streak = 0;
      let answer = 0;

      function newRound() {
        const type = Random.pick(['add', 'subtract']);
        let a, b, strategy, hint;

        if (type === 'add') {
          a = Random.int(20, 80);
          b = Random.pick([9, 19, 29, 39, 49]);
          answer = a + b;
          const round = Math.ceil(b / 10) * 10;
          const adjust = round - b;
          strategy = `💡 把 ${b} 看成 <span class="highlight">${round}</span>，先算 ${a} + ${round} = ${a + round}，再减去多加的 ${adjust}`;
          hint = `${a} + ${b} → ${a} + ${round} - ${adjust}`;
        } else {
          a = Random.int(50, 100);
          b = Random.pick([9, 19, 29, 39]);
          answer = a - b;
          const round = Math.floor(b / 10) * 10;
          const adjust = b - round;
          strategy = `💡 把 ${b} 看成 <span class="highlight">${round}</span>，先算 ${a} - ${round} = ${a - round}，再减去少减的 ${adjust}`;
          hint = `${a} - ${b} → ${a} - ${round} - ${adjust}`;
        }

        document.getElementById('roundProblem').textContent = `${a} ${type === 'add' ? '+' : '-'} ${b} = ?`;
        document.getElementById('roundStrategy').innerHTML = strategy;

        const opts = document.getElementById('roundOptions');
        opts.innerHTML = '';
        const choices = Random.shuffle([answer, answer + 1, answer - 1, answer + 10]);
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'round-opt';
          btn.textContent = c;
          btn.addEventListener('click', () => {
            if (c === answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('roundCorrect').textContent = correct;
              document.getElementById('roundStreak').textContent = streak;
              document.getElementById('roundFeedback').textContent = '🎉 答对了！';
              document.getElementById('roundFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              setTimeout(newRound, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('roundWrong').textContent = wrong;
              document.getElementById('roundStreak').textContent = streak;
              document.getElementById('roundFeedback').textContent = `❌ 再试试，注意凑整后的调整`;
              document.getElementById('roundFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          opts.appendChild(btn);
        });
        document.getElementById('roundFeedback').textContent = '';
        document.getElementById('roundFeedback').style.color = '';
      }

      document.getElementById('btnRoundNext').addEventListener('click', () => { Sound.play('click'); newRound(); });
      newRound();
    })();

    // === 模式3: 拆分法 ===
    (function() {
      let correct = 0, wrong = 0, streak = 0;
      let answer = 0;

      function newSplit() {
        const type = Random.pick(['add', 'multiply']);
        let a, b, splitA, splitB, visual;

        if (type === 'add') {
          a = Random.int(30, 70);
          b = Random.int(20, 50);
          answer = a + b;
          splitA = Math.floor(a / 10) * 10;
          splitB = a - splitA;
          visual = `
            <div class="split-box"><div class="num">${splitA}</div><div class="label">${a}的十位</div></div>
            <div class="split-op">+</div>
            <div class="split-box"><div class="num">${splitB}</div><div class="label">${a}的个位</div></div>
            <div class="split-op">+</div>
            <div class="split-box"><div class="num">${b}</div><div class="label">加数</div></div>
          `;
        } else {
          a = Random.int(12, 19);
          b = Random.int(3, 9);
          answer = a * b;
          splitA = 10;
          splitB = a - 10;
          visual = `
            <div class="split-box"><div class="num">${splitA}×${b}</div><div class="label">${splitA * b}</div></div>
            <div class="split-op">+</div>
            <div class="split-box"><div class="num">${splitB}×${b}</div><div class="label">${splitB * b}</div></div>
            <div class="split-op">=</div>
            <div class="split-box"><div class="num">${answer}</div><div class="label">结果</div></div>
          `;
        }

        document.getElementById('splitProblem').textContent = type === 'add' ? `${a} + ${b} = ?` : `${a} × ${b} = ?`;
        document.getElementById('splitVisual').innerHTML = visual;

        const opts = document.getElementById('splitOptions');
        opts.innerHTML = '';
        const choices = Random.shuffle([answer, answer + 1, answer - 1, answer + b]);
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'split-opt';
          btn.textContent = c;
          btn.addEventListener('click', () => {
            if (c === answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('splitCorrect').textContent = correct;
              document.getElementById('splitStreak').textContent = streak;
              document.getElementById('splitFeedback').textContent = '🎉 答对了！';
              document.getElementById('splitFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              setTimeout(newSplit, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('splitWrong').textContent = wrong;
              document.getElementById('splitStreak').textContent = streak;
              document.getElementById('splitFeedback').textContent = `❌ 再看看拆分的方法`;
              document.getElementById('splitFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          opts.appendChild(btn);
        });
        document.getElementById('splitFeedback').textContent = '';
        document.getElementById('splitFeedback').style.color = '';
      }

      document.getElementById('btnSplitNext').addEventListener('click', () => { Sound.play('click'); newSplit(); });
      newSplit();
    })();

    // === 模式4: 挑战模式 ===
    (function() {
      let running = false;
      let timeLeft = 60;
      let correct = 0, wrong = 0;
      let timerInterval = null;
      let history = [];

      function startChallenge() {
        running = true;
        timeLeft = 60;
        correct = 0;
        wrong = 0;
        history = [];
        document.getElementById('challengeArea').classList.add('challenge-active');
        document.getElementById('challengeCorrect').textContent = '0';
        document.getElementById('challengeWrong').textContent = '0';
        document.getElementById('challengeHistory').innerHTML = '';
        document.getElementById('challengeFeedback').textContent = '';
        updateTimer();
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 0) {
            endChallenge();
          }
        }, 1000);
        newChallenge();
      }

      function updateTimer() {
        document.getElementById('challengeTime').textContent = timeLeft;
        const pct = (timeLeft / 60) * 100;
        document.getElementById('timerFill').style.width = pct + '%';
      }

      function endChallenge() {
        running = false;
        clearInterval(timerInterval);
        document.getElementById('challengeArea').classList.remove('challenge-active');
        showToast(`⏱️ 时间到！答对 ${correct} 题，答错 ${wrong} 题`, 'success', 3000);
      }

      function newChallenge() {
        if (!running) return;
        const type = Random.pick(['make-ten', 'round', 'split']);
        let a, b, answer, problem;

        if (type === 'make-ten') {
          a = Random.int(2, 9);
          b = Random.int(11, 19);
          answer = a + b;
          problem = `${a} + ${b}`;
        } else if (type === 'round') {
          a = Random.int(20, 80);
          b = Random.pick([9, 19, 29, 39]);
          const op = Random.pick(['+', '-']);
          if (op === '+') {
            answer = a + b;
            problem = `${a} + ${b}`;
          } else {
            a = Random.int(50, 100);
            answer = a - b;
            problem = `${a} - ${b}`;
          }
        } else {
          a = Random.int(12, 19);
          b = Random.int(3, 9);
          answer = a * b;
          problem = `${a} × ${b}`;
        }

        document.getElementById('challengeProblem').textContent = problem + ' = ?';

        const opts = document.getElementById('challengeOptions');
        opts.innerHTML = '';
        const choices = Random.shuffle([answer, answer + 1, answer - 1, answer + 2]);
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'challenge-opt';
          btn.textContent = c;
          btn.addEventListener('click', () => {
            if (!running) return;
            if (c === answer) {
              btn.classList.add('correct');
              correct++;
              document.getElementById('challengeCorrect').textContent = correct;
              document.getElementById('challengeFeedback').textContent = '🎉 正确！';
              document.getElementById('challengeFeedback').style.color = '#34C759';
              Sound.play('correct');
              history.unshift({ problem, correct: true });
              addHistoryItem(problem, true);
              setTimeout(newChallenge, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++;
              document.getElementById('challengeWrong').textContent = wrong;
              document.getElementById('challengeFeedback').textContent = `❌ 正确答案是 ${answer}`;
              document.getElementById('challengeFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              history.unshift({ problem, correct: false });
              addHistoryItem(problem, false);
              setTimeout(newChallenge, 1500);
            }
          });
          opts.appendChild(btn);
        });
        document.getElementById('challengeFeedback').textContent = '';
      }

      function addHistoryItem(problem, isCorrect) {
        const div = document.createElement('div');
        div.className = 'history-item ' + (isCorrect ? 'correct' : 'wrong');
        div.innerHTML = `<span class="problem">${problem}</span><span>${isCorrect ? '✅' : '❌'}</span>`;
        const container = document.getElementById('challengeHistory');
        container.insertBefore(div, container.firstChild);
        if (container.children.length > 10) {
          container.removeChild(container.lastChild);
        }
      }

      document.getElementById('btnChallengeStart').addEventListener('click', () => { Sound.play('click'); startChallenge(); });
    })();
  </script>
</body>
</html>
