<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>万以内数的认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs {
      display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .mode-tab {
      flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA;
      border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* === 认识模式 === */
    .place-chart {
      display: flex; justify-content: center; gap: 6px; margin: 20px 0;
      flex-wrap: nowrap;
    }
    .place-col {
      display: flex; flex-direction: column; align-items: center; width: 64px;
    }
    .place-label {
      font-size: 13px; font-weight: 700; color: #6E6E73; margin-bottom: 8px;
      text-align: center;
    }
    .place-box {
      width: 56px; height: 56px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 28px;
      font-weight: 700; color: white; transition: all 0.3s ease;
    }
    .place-box.thousands { background: #FF6B6B; }
    .place-box.hundreds { background: #FFA940; }
    .place-box.tens { background: #4A90D9; }
    .place-box.ones { background: #34C759; }
    .place-value-display {
      font-size: 14px; color: #6E6E73; margin-top: 6px; font-weight: 600;
    }

    .num-show {
      text-align: center; font-size: 48px; font-weight: 800; color: #1D1D1F;
      margin: 16px 0; letter-spacing: 4px;
    }
    .num-read {
      text-align: center; font-size: 20px; color: #4A90D9; font-weight: 600;
      margin: 8px 0 16px;
    }
    .num-controls {
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
      margin: 16px 0;
    }
    .num-btn {
      min-width: 56px; min-height: 56px; border: none; border-radius: 14px;
      font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.2s;
      background: #4A90D9; color: white;
    }
    .num-btn:active { transform: scale(0.9); }
    .num-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    .bead-bar {
      display: flex; align-items: flex-end; justify-content: center; gap: 16px;
      margin: 20px 0; padding: 16px; background: white; border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .bead-col {
      display: flex; flex-direction: column-reverse; align-items: center; gap: 4px;
    }
    .bead-rod {
      width: 6px; background: #D1D5DB; border-radius: 3px; min-height: 120px;
      display: flex; flex-direction: column-reverse; align-items: center;
      position: relative; overflow: hidden;
    }
    .bead {
      width: 24px; height: 18px; border-radius: 50%; flex-shrink: 0;
      animation: beadPop 0.2s ease both;
    }
    .bead.b-th { background: #FF6B6B; }
    .bead.b-hu { background: #FFA940; }
    .bead.b-te { background: #4A90D9; }
    .bead.b-on { background: #34C759; }
    .bead-label {
      font-size: 12px; font-weight: 700; color: #6E6E73; margin-top: 6px;
    }

    .tip-box {
      background: #FFF9E6; border-left: 4px solid #FF9500; padding: 14px 16px;
      border-radius: 0 12px 12px 0; margin: 16px 0; font-size: 15px;
      line-height: 1.6; color: #1D1D1F;
    }

    /* === 拨珠模式 === */
    .abacus-area { text-align: center; padding: 16px 0; }
    .abacus-target {
      font-size: 22px; font-weight: 700; color: #1D1D1F; margin: 12px 0;
    }
    .abacus-target span { color: #FF6B6B; font-size: 28px; }
    .abacus-frame {
      background: #FFF8F0; border: 3px solid #D2B48C; border-radius: 16px;
      padding: 20px 12px; margin: 16px auto; max-width: 340px;
    }
    .abacus-row {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 8px;
    }
    .abacus-place-label {
      font-size: 12px; font-weight: 700; color: #6E6E73; text-align: center;
      width: 64px;
    }
    .abacus-bead-slot {
      width: 48px; height: 48px; border: 2px dashed #D1D5DB; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; cursor: pointer; transition: all 0.15s;
      background: white;
    }
    .abacus-bead-slot:active { transform: scale(0.9); }
    .abacus-bead-slot.filled-th { background: #FFE0E0; border-color: #FF6B6B; color: #FF6B6B; }
    .abacus-bead-slot.filled-hu { background: #FFF0DB; border-color: #FFA940; color: #FFA940; }
    .abacus-bead-slot.filled-te { background: #DBE9F8; border-color: #4A90D9; color: #4A90D9; }
    .abacus-bead-slot.filled-on { background: #DBF8E0; border-color: #34C759; color: #34C759; }
    .abacus-controls {
      display: flex; justify-content: center; gap: 12px; margin-top: 16px;
    }
    .abacus-result {
      font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px;
    }

    /* === 比大小模式 === */
    .compare-area { text-align: center; padding: 16px 0; }
    .compare-numbers {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 24px 0; flex-wrap: nowrap;
    }
    .compare-num-box {
      background: white; border: 3px solid #E5E5EA; border-radius: 16px;
      padding: 16px 20px; min-width: 100px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .compare-num-box .big-num {
      font-size: 32px; font-weight: 800; color: #1D1D1F;
    }
    .compare-num-box .small-label {
      font-size: 12px; color: #6E6E73; margin-top: 4px;
    }
    .compare-symbol-area {
      display: flex; flex-direction: column; gap: 8px;
    }
    .compare-symbol-btn {
      width: 56px; height: 56px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; color: #1D1D1F;
    }
    .compare-symbol-btn:active { transform: scale(0.9); }
    .compare-symbol-btn.correct {
      border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759;
    }
    .compare-symbol-btn.wrong {
      border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30;
    }
    .compare-hint {
      font-size: 15px; color: #6E6E73; margin: 12px 0; line-height: 1.5;
    }
    .compare-score {
      display: flex; justify-content: center; gap: 20px; margin: 12px 0;
      font-size: 16px; font-weight: 600;
    }
    .compare-feedback {
      font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px;
    }

    /* === 挑战模式 === */
    .challenge-area { text-align: center; padding: 16px 0; }
    .ch-progress {
      display: flex; justify-content: center; gap: 16px; margin: 12px 0;
      font-size: 16px; font-weight: 600;
    }
    .ch-question {
      font-size: 20px; font-weight: 700; color: #1D1D1F; margin: 16px 0;
      line-height: 1.5; padding: 0 16px;
    }
    .ch-highlight {
      font-size: 36px; color: #4A90D9; display: block; margin: 8px 0;
    }
    .ch-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 16px auto; padding: 0 16px;
    }
    .ch-opt {
      padding: 18px 12px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 20px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; text-align: center;
    }
    .ch-opt:active { transform: scale(0.92); }
    .ch-opt.correct {
      border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759;
    }
    .ch-opt.wrong {
      border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30;
    }
    .ch-feedback {
      font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px;
    }
    .ch-stars { font-size: 28px; margin: 12px 0; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes beadPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <a href="../../index.html" class="nav-back">←</a>
    <span class="nav-title">🔢 万以内数的认识</span>
    <span class="nav-sub">二年级</span>
  </nav>

  <div class="page-container">
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="explore">🔢 认识</button>
      <button class="mode-tab" data-mode="abacus">🧮 拨珠</button>
      <button class="mode-tab" data-mode="compare">⚖️ 比大小</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- ===== 认识模式 ===== -->
    <div class="mode-content active" id="mode-explore">
      <div class="num-show" id="numDisplay">0</div>
      <div class="num-read" id="numRead">零</div>

      <div class="place-chart" id="placeChart">
        <div class="place-col">
          <div class="place-label">千位</div>
          <div class="place-box thousands" id="boxTh">0</div>
          <div class="place-value-display" id="valTh">= 0</div>
        </div>
        <div class="place-col">
          <div class="place-label">百位</div>
          <div class="place-box hundreds" id="boxHu">0</div>
          <div class="place-value-display" id="valHu">= 0</div>
        </div>
        <div class="place-col">
          <div class="place-label">十位</div>
          <div class="place-box tens" id="boxTe">0</div>
          <div class="place-value-display" id="valTe">= 0</div>
        </div>
        <div class="place-col">
          <div class="place-label">个位</div>
          <div class="place-box ones" id="boxOn">0</div>
          <div class="place-value-display" id="valOn">= 0</div>
        </div>
      </div>

      <div class="bead-bar" id="beadBar"></div>

      <div class="num-controls">
        <button class="num-btn secondary" onclick="changeExplore(-1000)">-1000</button>
        <button class="num-btn secondary" onclick="changeExplore(-100)">-100</button>
        <button class="num-btn secondary" onclick="changeExplore(-10)">-10</button>
        <button class="num-btn secondary" onclick="changeExplore(-1)">-1</button>
        <button class="num-btn" onclick="changeExplore(1)">+1</button>
        <button class="num-btn" onclick="changeExplore(10)">+10</button>
        <button class="num-btn" onclick="changeExplore(100)">+100</button>
        <button class="num-btn" onclick="changeExplore(1000)">+1000</button>
      </div>
      <div class="num-controls">
        <button class="num-btn secondary" onclick="setRandomExplore()">🎲 随机</button>
      </div>

      <div class="tip-box">
        💡 <strong>数位顺序：</strong>从右边起，第一位是个位，第二位是十位，第三位是百位，第四位是千位。<br>
        10个一是十，10个十是一百，10个一百是一千，10个一千是一万！
      </div>
    </div>

    <!-- ===== 拨珠模式 ===== -->
    <div class="mode-content" id="mode-abacus">
      <div class="abacus-area">
        <div class="abacus-target">请拨出：<span id="abTarget">0</span></div>

        <div class="abacus-frame">
          <div class="abacus-row">
            <div class="abacus-place-label">千位</div>
            <div class="abacus-place-label">百位</div>
            <div class="abacus-place-label">十位</div>
            <div class="abacus-place-label">个位</div>
          </div>
          <div class="abacus-row" id="abSlots">
            <div class="abacus-bead-slot" data-place="th" onclick="abTap('th')">0</div>
            <div class="abacus-bead-slot" data-place="hu" onclick="abTap('hu')">0</div>
            <div class="abacus-bead-slot" data-place="te" onclick="abTap('te')">0</div>
            <div class="abacus-bead-slot" data-place="on" onclick="abTap('on')">0</div>
          </div>
        </div>

        <div class="abacus-result" id="abResult"></div>

        <div class="abacus-controls">
          <button class="num-btn" onclick="abCheck()">✅ 确认</button>
          <button class="num-btn secondary" onclick="abReset()">🔄 重置</button>
          <button class="num-btn secondary" onclick="abNewTarget()">🎲 换一题</button>
        </div>

        <div class="compare-score" style="margin-top:16px;">
          <span>✅ 正确：<strong id="abCorrect">0</strong></span>
          <span>📝 共做：<strong id="abTotal">0</strong></span>
        </div>
      </div>
    </div>

    <!-- ===== 比大小模式 ===== -->
    <div class="mode-content" id="mode-compare">
      <div class="compare-area">
        <div class="compare-score">
          <span>✅ 正确：<strong id="cmpCorrect">0</strong></span>
          <span>📝 第 <strong id="cmpRound">1</strong> 题</span>
        </div>

        <div class="compare-numbers">
          <div class="compare-num-box">
            <div class="big-num" id="cmpA">0</div>
            <div class="small-label">A</div>
          </div>
          <div class="compare-symbol-area">
            <button class="compare-symbol-btn" onclick="pickCmp('>')">&gt;</button>
            <button class="compare-symbol-btn" onclick="pickCmp('=')">=</button>
            <button class="compare-symbol-btn" onclick="pickCmp('<')">&lt;</button>
          </div>
          <div class="compare-num-box">
            <div class="big-num" id="cmpB">0</div>
            <div class="small-label">B</div>
          </div>
        </div>

        <div class="compare-feedback" id="cmpFeedback"></div>
        <div class="compare-hint" id="cmpHint">
          💡 先比位数，位数多的数大；位数相同就从最高位比起，哪位大哪个数就大。
        </div>
      </div>
    </div>

    <!-- ===== 挑战模式 ===== -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <div class="ch-progress">
          <span>⭐ <strong id="chScore">0</strong> / <strong id="chTotal">0</strong></span>
        </div>
        <div class="ch-stars" id="chStars"></div>
        <div class="ch-question" id="chQuestion"></div>
        <div class="ch-options" id="chOptions"></div>
        <div class="ch-feedback" id="chFeedback"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        if (tab.dataset.mode === 'abacus') abNewTarget();
        if (tab.dataset.mode === 'compare') newCmpRound();
        if (tab.dataset.mode === 'challenge') initChallenge();
      });
    });

    // === 中文读数 ===
    const CN = ['零','一','二','三','四','五','六','七','八','九'];
    function toChinese(n) {
      if (n === 0) return '零';
      let s = '';
      const th = Math.floor(n / 1000);
      const hu = Math.floor((n % 1000) / 100);
      const te = Math.floor((n % 100) / 10);
      const on = n % 10;
      if (th > 0) s += CN[th] + '千';
      if (hu > 0) { s += CN[hu] + '百'; }
      else if (th > 0 && (te > 0 || on > 0)) s += '零';
      if (te > 0) { s += CN[te] + '十'; }
      else if (hu > 0 && on > 0) s += '零';
      if (on > 0) s += CN[on];
      return s;
    }

    // === 认识模式 ===
    let exploreNum = 0;

    function updateExplore() {
      const n = exploreNum;
      const th = Math.floor(n / 1000);
      const hu = Math.floor((n % 1000) / 100);
      const te = Math.floor((n % 100) / 10);
      const on = n % 10;

      document.getElementById('numDisplay').textContent = n.toLocaleString();
      document.getElementById('numRead').textContent = toChinese(n);

      document.getElementById('boxTh').textContent = th;
      document.getElementById('boxHu').textContent = hu;
      document.getElementById('boxTe').textContent = te;
      document.getElementById('boxOn').textContent = on;

      document.getElementById('valTh').textContent = '= ' + (th * 1000);
      document.getElementById('valHu').textContent = '= ' + (hu * 100);
      document.getElementById('valTe').textContent = '= ' + (te * 10);
      document.getElementById('valOn').textContent = '= ' + on;

      renderBeads(th, hu, te, on);
    }

    function renderBeads(th, hu, te, on) {
      const bar = document.getElementById('beadBar');
      bar.innerHTML = '';
      const data = [
        { count: th, cls: 'b-th', label: '千' },
        { count: hu, cls: 'b-hu', label: '百' },
        { count: te, cls: 'b-te', label: '十' },
        { count: on, cls: 'b-on', label: '个' }
      ];
      data.forEach(d => {
        const col = document.createElement('div');
        col.className = 'bead-col';
        const rod = document.createElement('div');
        rod.className = 'bead-rod';
        rod.style.minHeight = Math.max(40, d.count * 22) + 'px';
        for (let i = 0; i < d.count; i++) {
          const b = document.createElement('div');
          b.className = 'bead ' + d.cls;
          b.style.animationDelay = (i * 0.05) + 's';
          rod.appendChild(b);
        }
        const lbl = document.createElement('div');
        lbl.className = 'bead-label';
        lbl.textContent = d.label;
        col.appendChild(rod);
        col.appendChild(lbl);
        bar.appendChild(col);
      });
    }

    function changeExplore(delta) {
      exploreNum = Math.max(0, Math.min(9999, exploreNum + delta));
      updateExplore();
    }

    function setRandomExplore() {
      exploreNum = Random.int(0, 9999);
      updateExplore();
    }

    updateExplore();

    // === 拨珠模式 ===
    let abState = { th: 0, hu: 0, te: 0, on: 0 };
    let abTarget = 0;
    let abCorrectCount = 0;
    let abTotalCount = 0;
    let abLocked = false;

    function abNewTarget() {
      abTarget = Random.int(1, 9999);
      document.getElementById('abTarget').textContent = abTarget.toLocaleString();
      abReset();
    }

    function abTap(place) {
      if (abLocked) return;
      abState[place] = (abState[place] + 1) % 10;
      const slot = document.querySelector(`.abacus-bead-slot[data-place="${place}"]`);
      slot.textContent = abState[place];
      const cls = { th: 'filled-th', hu: 'filled-hu', te: 'filled-te', on: 'filled-on' };
      slot.className = 'abacus-bead-slot' + (abState[place] > 0 ? ' ' + cls[place] : '');
      const val = abState.th * 1000 + abState.hu * 100 + abState.te * 10 + abState.on;
      document.getElementById('abResult').textContent = '当前：' + val.toLocaleString();
      document.getElementById('abResult').style.color = '#1D1D1F';
    }

    function abCheck() {
      if (abLocked) return;
      abLocked = true;
      abTotalCount++;
      const val = abState.th * 1000 + abState.hu * 100 + abState.te * 10 + abState.on;
      if (val === abTarget) {
        abCorrectCount++;
        document.getElementById('abResult').textContent = '✅ 正确！' + val.toLocaleString() + ' = ' + abTarget.toLocaleString();
        document.getElementById('abResult').style.color = '#34C759';
        celebrate();
        setTimeout(() => { abNewTarget(); }, 1500);
      } else {
        document.getElementById('abResult').textContent = '❌ 不对哦，你拨的是 ' + val.toLocaleString() + '，目标是 ' + abTarget.toLocaleString();
        document.getElementById('abResult').style.color = '#FF3B30';
        setTimeout(() => { abLocked = false; }, 1500);
      }
      document.getElementById('abCorrect').textContent = abCorrectCount;
      document.getElementById('abTotal').textContent = abTotalCount;
    }

    function abReset() {
      abState = { th: 0, hu: 0, te: 0, on: 0 };
      abLocked = false;
      ['th','hu','te','on'].forEach(p => {
        const slot = document.querySelector(`.abacus-bead-slot[data-place="${p}"]`);
        slot.textContent = '0';
        slot.className = 'abacus-bead-slot';
      });
      document.getElementById('abResult').textContent = '';
    }

    // === 比大小模式 ===
    let cmpCorrectCount = 0;
    let cmpRoundNum = 1;
    let cmpLocked = false;
    let cmpAnswer = '';

    function newCmpRound() {
      cmpLocked = false;
      let a, b;
      // Generate numbers of similar magnitude for meaningful comparison
      const magnitude = Random.pick([
        [1, 9], [10, 99], [100, 999], [1000, 9999]
      ]);
      a = Random.int(magnitude[0], magnitude[1]);
      // Sometimes same, sometimes different magnitude
      if (Math.random() < 0.15) {
        b = a; // equal case
      } else {
        b = Random.int(magnitude[0], magnitude[1]);
      }
      document.getElementById('cmpA').textContent = a.toLocaleString();
      document.getElementById('cmpB').textContent = b.toLocaleString();
      cmpAnswer = a > b ? '>' : (a < b ? '<' : '=');
      document.getElementById('cmpFeedback').textContent = '';
      document.querySelectorAll('.compare-symbol-btn').forEach(btn => {
        btn.className = 'compare-symbol-btn';
      });
      document.getElementById('cmpRound').textContent = cmpRoundNum;
    }

    function pickCmp(sym) {
      if (cmpLocked) return;
      cmpLocked = true;
      const btns = document.querySelectorAll('.compare-symbol-btn');
      btns.forEach(btn => {
        if (btn.textContent.replace(/&/g,'').trim() === sym || btn.textContent === sym) {
          // find the right button
        }
      });
      // Match button by text content
      btns.forEach(btn => {
        const btnSym = btn.textContent.trim();
        if (btnSym === sym) {
          btn.classList.add(sym === cmpAnswer ? 'correct' : 'wrong');
        }
        if (btnSym === cmpAnswer) {
          btn.classList.add('correct');
        }
      });

      if (sym === cmpAnswer) {
        cmpCorrectCount++;
        document.getElementById('cmpFeedback').textContent = '✅ 正确！';
        document.getElementById('cmpFeedback').style.color = '#34C759';
        celebrate();
      } else {
        document.getElementById('cmpFeedback').textContent = '❌ 不对哦，正确答案是 ' + cmpAnswer;
        document.getElementById('cmpFeedback').style.color = '#FF3B30';
      }
      document.getElementById('cmpCorrect').textContent = cmpCorrectCount;
      cmpRoundNum++;
      setTimeout(() => newCmpRound(), 1500);
    }

    // === 挑战模式 ===
    let chIdx = 0, chScore = 0, chLocked = false;
    let chQuestions = [];

    function generateChallenge() {
      const qs = [];
      const generators = [
        // 数位判断
        () => {
          const n = Random.int(100, 9999);
          const places = ['个位','十位','百位','千位'];
          const digits = [n%10, Math.floor(n/10)%10, Math.floor(n/100)%10, Math.floor(n/1000)%10];
          const askPlace = Random.int(0, 3);
          const realDigits = digits.slice(0, askPlace + 1);
          if (digits[askPlace] === 0 && askPlace === 3) return generators[0](); // skip leading zero
          const opts = new Set([digits[askPlace]]);
          while (opts.size < 4) opts.add(Random.int(0, 9));
          return {
            q: `<span class="ch-highlight">${n.toLocaleString()}</span>${places[askPlace]}上的数字是？`,
            opts: Random.shuffle([...opts]),
            ans: digits[askPlace]
          };
        },
        // 数的组成
        () => {
          const th = Random.int(1, 9), hu = Random.int(0, 9), te = Random.int(0, 9), on = Random.int(0, 9);
          const n = th * 1000 + hu * 100 + te * 10 + on;
          const correct = `${th}个千 + ${hu}个百 + ${te}个十 + ${on}个一`;
          const opts = new Set([correct]);
          while (opts.size < 4) {
            const a = Random.int(0,9), b = Random.int(0,9), c = Random.int(0,9), d = Random.int(0,9);
            opts.add(`${a}个千 + ${b}个百 + ${c}个十 + ${d}个一`);
          }
          return {
            q: `<span class="ch-highlight">${n.toLocaleString()}</span>是由什么组成的？`,
            opts: Random.shuffle([...opts]),
            ans: correct
          };
        },
        // 读数
        () => {
          const n = Random.int(100, 9999);
          const correct = toChinese(n);
          const opts = new Set([correct]);
          while (opts.size < 4) {
            const m = Random.int(100, 9999);
            opts.add(toChinese(m));
          }
          return {
            q: `<span class="ch-highlight">${n.toLocaleString()}</span>读作什么？`,
            opts: Random.shuffle([...opts]),
            ans: correct
          };
        },
        // 写数
        () => {
          const n = Random.int(100, 9999);
          const cn = toChinese(n);
          const opts = new Set([n.toLocaleString()]);
          while (opts.size < 4) {
            const m = Random.int(100, 9999);
            opts.add(m.toLocaleString());
          }
          return {
            q: `<span class="ch-highlight">${cn}</span>写作什么？`,
            opts: Random.shuffle([...opts]),
            ans: n.toLocaleString()
          };
        },
        // 相邻数
        () => {
          const n = Random.int(100, 9998);
          const type = Random.pick(['前', '后']);
          const ans = type === '前' ? n - 1 : n + 1;
          const opts = new Set([ans]);
          while (opts.size < 4) opts.add(Random.int(Math.max(1, n - 5), n + 5));
          return {
            q: `<span class="ch-highlight">${n.toLocaleString()}</span>${type}面的一个数是多少？`,
            opts: Random.shuffle([...opts]),
            ans: ans
          };
        },
        // 比大小
        () => {
          const mag = Random.pick([[100,999],[1000,9999]]);
          const a = Random.int(mag[0], mag[1]);
          let b = Random.int(mag[0], mag[1]);
          const opts = new Set();
          if (a > b) opts.add('>').add('<').add('=');
          else if (a < b) opts.add('<').add('>').add('=');
          else opts.add('=').add('<').add('>');
          while (opts.size < 4) opts.add(Random.pick(['>','<','=']));
          return {
            q: `<span class="ch-highlight">${a.toLocaleString()} ○ ${b.toLocaleString()}</span>○ 里填什么？`,
            opts: Random.shuffle([...opts]),
            ans: a > b ? '>' : (a < b ? '<' : '=')
          };
        }
      ];

      for (let i = 0; i < 10; i++) {
        qs.push(Random.pick(generators)());
      }
      return qs;
    }

    function initChallenge() {
      chQuestions = generateChallenge();
      chIdx = 0; chScore = 0; chLocked = false;
      document.getElementById('chScore').textContent = '0';
      document.getElementById('chTotal').textContent = '0';
      document.getElementById('chStars').textContent = '';
      document.getElementById('chFeedback').textContent = '';
      loadChallenge();
    }

    function loadChallenge() {
      if (chIdx >= chQuestions.length) {
        document.getElementById('chQuestion').textContent = '🎉 挑战完成！';
        document.getElementById('chOptions').innerHTML = '';
        document.getElementById('chFeedback').textContent = `得分 ${chScore} / ${chQuestions.length}`;
        document.getElementById('chStars').textContent = '⭐'.repeat(Math.max(1, Math.ceil(chScore / 2)));
        if (chScore >= 8) celebrate();
        return;
      }
      const q = chQuestions[chIdx];
      document.getElementById('chQuestion').innerHTML = q.q;
      document.getElementById('chFeedback').textContent = '';
      const optDiv = document.getElementById('chOptions');
      optDiv.innerHTML = '';
      q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ch-opt';
        btn.textContent = opt;
        btn.onclick = () => pickCh(opt);
        optDiv.appendChild(btn);
      });
      chLocked = false;
    }

    function pickCh(picked) {
      if (chLocked) return;
      chLocked = true;
      const q = chQuestions[chIdx];
      const ok = String(picked) === String(q.ans);
      const btns = document.querySelectorAll('#chOptions .ch-opt');
      btns.forEach(btn => {
        if (btn.textContent === String(q.ans)) btn.classList.add('correct');
        if (btn.textContent === String(picked) && !ok) btn.classList.add('wrong');
      });
      if (ok) {
        chScore++;
        document.getElementById('chFeedback').textContent = '✅ 正确！';
        document.getElementById('chFeedback').style.color = '#34C759';
      } else {
        document.getElementById('chFeedback').textContent = '❌ 不对哦';
        document.getElementById('chFeedback').style.color = '#FF3B30';
      }
      document.getElementById('chScore').textContent = chScore;
      document.getElementById('chTotal').textContent = chIdx + 1;
      chIdx++;
      setTimeout(() => loadChallenge(), 1500);
    }

    // 初始化
    newCmpRound();
  </script>
