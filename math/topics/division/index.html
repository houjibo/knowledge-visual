<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>除法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 平均分模式 */
    .share-area { text-align: center; padding: 24px 16px; }
    .share-problem { font-size: 28px; font-weight: 700; color: #4A90D9; margin: 16px 0; }
    .share-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 80px; padding: 16px; margin: 16px 0; }
    .share-item { font-size: 36px; animation: popIn 0.3s ease both; }
    .share-groups { display: flex; justify-content: center; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
    .share-group { min-width: 80px; min-height: 60px; border: 3px dashed #4A90D9; border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; transition: all 0.3s ease; }
    .share-group.highlight { border-color: #34C759; background: rgba(52,199,89,0.08); }
    .share-group-item { font-size: 24px; }
    .share-result { font-size: 32px; font-weight: 800; color: #34C759; margin: 16px 0; }
    .share-options { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .share-opt { min-width: 56px; height: 56px; border: 3px solid #E5E5EA; background: white; border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .share-opt:active { transform: scale(0.92); }
    .share-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); }
    .share-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }

    /* 包含除模式 */
    .contain-area { text-align: center; padding: 24px 16px; }
    .contain-problem { font-size: 26px; font-weight: 700; color: #4A90D9; margin: 16px 0; }
    .contain-total { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 16px; margin: 12px 0; min-height: 60px; }
    .contain-item { font-size: 28px; }
    .contain-group-visual { display: flex; gap: 4px; margin: 8px 0; justify-content: center; flex-wrap: wrap; }
    .contain-grouped { padding: 4px 8px; background: rgba(74,144,217,0.1); border-radius: 8px; }
    .contain-answer { font-size: 36px; font-weight: 800; color: #FF9500; margin: 16px 0; }
    .contain-input { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .contain-input-field { width: 80px; height: 56px; border: 3px solid #E5E5EA; border-radius: 12px; font-size: 28px; font-weight: 700; text-align: center; outline: none; }
    .contain-input-field:focus { border-color: #4A90D9; }
    .contain-btn { min-width: 80px; height: 56px; border: none; background: #4A90D9; color: white; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .contain-btn:active { transform: scale(0.95); }

    /* 竖式除法模式 */
    .long-area { text-align: center; padding: 24px 16px; }
    .long-problem { font-size: 32px; font-weight: 700; color: #1D1D1F; margin: 16px 0; }
    .long-division { display: inline-block; margin: 20px auto; font-size: 32px; font-weight: 700; }
    .long-dividend { display: inline-block; padding: 8px 16px; border-bottom: 3px solid #1D1D1F; position: relative; }
    .long-divisor { position: absolute; left: -36px; top: 50%; transform: translateY(-50%); }
    .long-quotient { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); color: #4A90D9; }
    .long-inputs { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .long-input { width: 64px; height: 56px; border: 3px solid #E5E5EA; border-radius: 12px; font-size: 24px; font-weight: 700; text-align: center; outline: none; }
    .long-input:focus { border-color: #4A90D9; }
    .long-check-btn { height: 56px; padding: 0 24px; border: none; background: #4A90D9; color: white; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; }
    .long-check-btn:active { transform: scale(0.95); }
    .long-feedback { font-size: 20px; font-weight: 600; margin: 16px 0; padding: 12px; border-radius: 12px; }
    .long-feedback.correct { background: rgba(52,199,89,0.15); color: #34C759; }
    .long-feedback.wrong { background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 余数模式 */
    .remainder-area { text-align: center; padding: 24px 16px; }
    .remainder-problem { font-size: 26px; font-weight: 700; color: #4A90D9; margin: 16px 0; }
    .remainder-visual { display: flex; justify-content: center; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
    .remainder-group { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border: 3px solid #4A90D9; border-radius: 16px; min-width: 70px; justify-content: center; background: rgba(74,144,217,0.05); }
    .remainder-leftover { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border: 3px dashed #FF9500; border-radius: 16px; justify-content: center; background: rgba(255,149,0,0.08); }
    .remainder-item { font-size: 28px; }
    .remainder-result { font-size: 24px; font-weight: 700; color: #1D1D1F; margin: 16px 0; }
    .remainder-result .rem { color: #FF9500; }
    .remainder-inputs { display: flex; justify-content: center; gap: 12px; margin-top: 16px; align-items: center; }
    .remainder-inputs span { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .remainder-input { width: 64px; height: 56px; border: 3px solid #E5E5EA; border-radius: 12px; font-size: 24px; font-weight: 700; text-align: center; outline: none; }
    .remainder-input:focus { border-color: #4A90D9; }
    .remainder-btn { height: 56px; padding: 0 20px; border: none; background: #4A90D9; color: white; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; }
    .remainder-btn:active { transform: scale(0.95); }

    /* 挑战模式 */
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }
    .timer-bar { height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30); border-radius: 4px; transition: width 0.1s linear; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">✂️ 除法</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="share">🍎 平均分</button>
      <button class="mode-tab" data-mode="contain">📦 包含除</button>
      <button class="mode-tab" data-mode="long">📝 竖式</button>
      <button class="mode-tab" data-mode="remainder">✂️ 有余数</button>
      <button class="mode-tab" data-mode="challenge">⏱️ 挑战</button>
    </div>

    <!-- 平均分模式 -->
    <div class="mode-content active" id="mode-share">
      <div class="share-area">
        <div style="font-size:14px;color:#6E6E73;margin-bottom:8px;">把这些平均分给小朋友们，每人得到几个？</div>
        <div class="share-problem" id="share-problem"></div>
        <div class="share-items" id="share-items"></div>
        <div class="share-groups" id="share-groups"></div>
        <div class="share-result" id="share-result"></div>
        <div class="share-options" id="share-options"></div>
        <button id="share-next" style="display:none;margin-top:16px;padding:12px 28px;border:none;background:#34C759;color:white;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;">下一题 →</button>
      </div>
    </div>

    <!-- 包含除模式 -->
    <div class="mode-content" id="mode-contain">
      <div class="contain-area">
        <div style="font-size:14px;color:#6E6E73;margin-bottom:8px;">总共这些，每份放几个，可以放几份？</div>
        <div class="contain-problem" id="contain-problem"></div>
        <div class="contain-total" id="contain-total"></div>
        <div id="contain-visual"></div>
        <div class="contain-input">
          <input class="contain-input-field" id="contain-answer" type="number" placeholder="?">
          <button class="contain-btn" id="contain-check">检查</button>
        </div>
        <div id="contain-feedback" style="font-size:20px;font-weight:600;margin-top:16px;"></div>
        <button id="contain-next" style="display:none;margin-top:12px;padding:12px 28px;border:none;background:#34C759;color:white;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;">下一题 →</button>
      </div>
    </div>

    <!-- 竖式除法模式 -->
    <div class="mode-content" id="mode-long">
      <div class="long-area">
        <div style="font-size:14px;color:#6E6E73;margin-bottom:8px;">用竖式计算，填入商</div>
        <div class="long-problem" id="long-problem"></div>
        <div style="font-size:80px;margin:24px 0;">
          <span id="long-dividend-display" style="position:relative;">
            <span class="long-dividend"><span id="long-dividend-val"></span></span>
          </span>
        </div>
        <div style="font-size:20px;font-weight:600;color:#6E6E73;margin-bottom:8px;">商 =</div>
        <div class="long-inputs">
          <input class="long-input" id="long-quotient-input" type="number" placeholder="?">
          <button class="long-check-btn" id="long-check-btn">检查</button>
        </div>
        <div class="long-feedback" id="long-feedback" style="display:none;"></div>
        <button id="long-next" style="display:none;margin-top:12px;padding:12px 28px;border:none;background:#34C759;color:white;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;">下一题 →</button>
      </div>
    </div>

    <!-- 有余数模式 -->
    <div class="mode-content" id="mode-remainder">
      <div class="remainder-area">
        <div style="font-size:14px;color:#6E6E73;margin-bottom:8px;">平均分，看看剩下多少？</div>
        <div class="remainder-problem" id="remainder-problem"></div>
        <div class="remainder-visual" id="remainder-visual"></div>
        <div class="remainder-inputs">
          <span>商 =</span>
          <input class="remainder-input" id="rem-quotient" type="number" placeholder="?">
          <span>余</span>
          <input class="remainder-input" id="rem-remainder" type="number" placeholder="?">
          <button class="remainder-btn" id="rem-check">检查</button>
        </div>
        <div class="remainder-result" id="rem-feedback" style="display:none;"></div>
        <button id="rem-next" style="display:none;margin-top:12px;padding:12px 28px;border:none;background:#34C759;color:white;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;">下一题 →</button>
      </div>
    </div>

    <!-- 挑战模式 -->
    <div class="mode-content" id="mode-challenge">
      <div style="text-align:center;padding:20px 16px;">
        <div class="challenge-score">
          <span>⏱️ <span id="ch-time">60</span>s</span>
          <span>✅ <span id="ch-correct">0</span></span>
          <span>❌ <span id="ch-wrong">0</span></span>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="ch-timer-fill" style="width:100%"></div></div>
        <div id="ch-problem" style="font-size:48px;font-weight:800;color:#4A90D9;margin:24px 0;"></div>
        <div id="ch-options" style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;"></div>
        <div id="ch-feedback" style="font-size:24px;font-weight:700;margin:16px 0;"></div>
        <button id="ch-start" style="padding:16px 40px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:20px;font-size:20px;font-weight:700;cursor:pointer;">开始挑战 ⏱️</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    // === 全局状态 ===
    let streak = 0;
    const EMOJIS = ['🍎','🍊','🍋','🍇','🍓','🌸','⭐','🐟','🎈','🍬'];
    const Random = { int:(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick:arr=>arr[Random.int(0,arr.length-1)], shuffle:arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Random.int(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;} };

    function updateStars() {
      const s = Math.min(Math.floor(streak/3), 5);
      document.getElementById('stars-display').textContent = '⭐'.repeat(s);
    }

    // === 返回按钮 ===
    document.querySelector('.nav-back').addEventListener('click', () => { window.location.href = '../../index.html'; });

    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mode-' + btn.dataset.mode).classList.add('active');
      });
    });

    // === 1. 平均分模式 ===
    let shareTotal, shareDivisor, shareEmoji;
    function genShare() {
      shareDivisor = Random.int(2, 9);
      const shareQuotient = Random.int(1, 9);
      shareTotal = shareDivisor * shareQuotient;
      shareEmoji = Random.pick(EMOJIS);
      document.getElementById('share-problem').textContent = `把 ${shareTotal} 个${shareEmoji} 平均分给 ${shareDivisor} 个小朋友`;
      const itemsEl = document.getElementById('share-items');
      itemsEl.innerHTML = '';
      for (let i = 0; i < shareTotal; i++) {
        const span = document.createElement('span');
        span.className = 'share-item';
        span.textContent = shareEmoji;
        span.style.animationDelay = `${i * 0.05}s`;
        itemsEl.appendChild(span);
      }
      document.getElementById('share-result').textContent = '';
      document.getElementById('share-groups').innerHTML = '';
      const optionsEl = document.getElementById('share-options');
      optionsEl.innerHTML = '';
      const correct = shareTotal / shareDivisor;
      let opts = [correct];
      while (opts.length < 4) {
        let v = Random.int(1, Math.min(shareTotal, 10));
        if (!opts.includes(v)) opts.push(v);
      }
      Random.shuffle(opts).forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'share-opt';
        btn.textContent = v;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.share-opt').forEach(b => { b.disabled = true; });
          if (v === correct) {
            btn.classList.add('correct');
            streak++;
            // 动画展示分组
            const groupsEl = document.getElementById('share-groups');
            groupsEl.innerHTML = '';
            for (let g = 0; g < shareDivisor; g++) {
              const grp = document.createElement('div');
              grp.className = 'share-group';
              for (let i = 0; i < correct; i++) {
                const item = document.createElement('span');
                item.className = 'share-group-item';
                item.textContent = shareEmoji;
                item.style.animationDelay = `${(g * correct + i) * 0.08}s`;
                grp.appendChild(item);
              }
              groupsEl.appendChild(grp);
              setTimeout(() => grp.classList.add('highlight'), (g * correct + 1) * 80);
            }
            document.getElementById('share-result').textContent = `${shareTotal} ÷ ${shareDivisor} = ${correct} ✅`;
            showToast('太棒了！', 'success');
            setTimeout(genShare, 1500);
          } else {
            btn.classList.add('wrong');
            streak = Math.max(0, streak - 1);
            document.getElementById('share-result').textContent = '再想想 💭';
            showToast('不对哦，再试试', 'error');
            setTimeout(() => {
              document.querySelectorAll('.share-opt').forEach(b => { b.disabled = false; btn.classList.remove('wrong'); });
            }, 1000);
          }
          updateStars();
          document.getElementById('streak').textContent = streak;
        });
        optionsEl.appendChild(btn);
      });
      document.getElementById('share-next').style.display = 'none';
    }
    document.getElementById('share-next').addEventListener('click', genShare);
    genShare();

    // === 2. 包含除模式 ===
    let containTotal, containPerGroup, containEmoji2;
    function genContain() {
      containPerGroup = Random.int(2, 9);
      const containQuotient = Random.int(1, 9);
      containTotal = containPerGroup * containQuotient;
      containEmoji2 = Random.pick(EMOJIS);
      const answer = containTotal / containPerGroup;
      document.getElementById('contain-problem').textContent = `${containTotal} 个${containEmoji2}，每 ${containPerGroup} 个一份，可以分几份？`;
      const totalEl = document.getElementById('contain-total');
      totalEl.innerHTML = '';
      for (let i = 0; i < containTotal; i++) {
        const span = document.createElement('span');
        span.className = 'contain-item';
        span.textContent = containEmoji2;
        totalEl.appendChild(span);
      }
      document.getElementById('contain-visual').innerHTML = '';
      document.getElementById('contain-answer').value = '';
      document.getElementById('contain-feedback').textContent = '';
      document.getElementById('contain-next').style.display = 'none';
    }
    document.getElementById('contain-check').addEventListener('click', () => {
      const answer = containTotal / containPerGroup;
      const val = parseInt(document.getElementById('contain-answer').value);
      const fb = document.getElementById('contain-feedback');
      if (val === answer) {
        streak++;
        fb.textContent = `${containTotal} ÷ ${containPerGroup} = ${answer} 份 ✅`;
        fb.style.color = '#34C759';
        // 展示分组
        const visEl = document.getElementById('contain-visual');
        visEl.innerHTML = '';
        for (let g = 0; g < answer; g++) {
          const row = document.createElement('div');
          row.className = 'contain-group-visual';
          for (let i = 0; i < containPerGroup; i++) {
            const s = document.createElement('span');
            s.className = 'contain-grouped';
            s.textContent = containEmoji2;
            row.appendChild(s);
          }
          visEl.appendChild(row);
        }
        showToast('太棒了！', 'success');
        setTimeout(genContain, 1500);
      } else {
        streak = Math.max(0, streak - 1);
        fb.textContent = val < answer ? '分少了，再想想 💭' : '分多了，再想想 💭';
        fb.style.color = '#FF3B30';
        showToast('不对哦', 'error');
      }
      updateStars();
      document.getElementById('streak').textContent = streak;
      document.getElementById('contain-next').style.display = 'inline-block';
    });
    document.getElementById('contain-next').addEventListener('click', genContain);
    genContain();

    // === 3. 竖式除法模式 ===
    let longDividend, longDivisor;
    function genLong() {
      longDivisor = Random.int(2, 9);
      const longQuotient = Random.int(1, 12);
      longDividend = longDivisor * longQuotient;
      document.getElementById('long-problem').textContent = `${longDividend} ÷ ${longDivisor} = ?`;
      document.getElementById('long-dividend-val').textContent = longDividend;
      document.getElementById('long-quotient-input').value = '';
      document.getElementById('long-feedback').style.display = 'none';
      document.getElementById('long-next').style.display = 'none';
    }
    document.getElementById('long-check-btn').addEventListener('click', () => {
      const answer = longDividend / longDivisor;
      const val = parseInt(document.getElementById('long-quotient-input').value);
      const fb = document.getElementById('long-feedback');
      fb.style.display = 'block';
      if (val === answer) {
        streak++;
        fb.className = 'long-feedback correct';
        fb.textContent = `${longDividend} ÷ ${longDivisor} = ${answer} ✅ 答对了！`;
        showToast('真棒！', 'success');
        setTimeout(genLong, 1500);
      } else {
        streak = Math.max(0, streak - 1);
        fb.className = 'long-feedback wrong';
        fb.textContent = `${longDividend} ÷ ${longDivisor} = ${answer}，商是 ${answer}`;
        showToast('不对哦', 'error');
      }
      updateStars();
      document.getElementById('streak').textContent = streak;
      document.getElementById('long-next').style.display = 'inline-block';
    });
    document.getElementById('long-next').addEventListener('click', genLong);
    genLong();

    // === 4. 有余数模式 ===
    let remDividend, remDivisor2;
    function genRemainder() {
      remDivisor2 = Random.int(2, 9);
      const remQuotient = Random.int(1, 9);
      const remR = Random.int(1, remDivisor2 - 1);
      remDividend = remQuotient * remDivisor2 + remR;
      const q = Math.floor(remDividend / remDivisor2);
      const r = remDividend % remDivisor2;
      const remEmoji = Random.pick(EMOJIS);
      document.getElementById('remainder-problem').textContent = `${remDividend} 个${remEmoji}，平均分成 ${remDivisor2} 份，每份几个？还剩几个？`;
      const visEl = document.getElementById('remainder-visual');
      visEl.innerHTML = '';
      for (let g = 0; g < remDivisor2; g++) {
        const grp = document.createElement('div');
        grp.className = 'remainder-group';
        for (let i = 0; i < q; i++) {
          const s = document.createElement('span');
          s.className = 'remainder-item';
          s.textContent = remEmoji;
          grp.appendChild(s);
        }
        visEl.appendChild(grp);
      }
      if (r > 0) {
        const leftEl = document.createElement('div');
        leftEl.className = 'remainder-leftover';
        for (let i = 0; i < r; i++) {
          const s = document.createElement('span');
          s.className = 'remainder-item';
          s.textContent = remEmoji;
          leftEl.appendChild(s);
        }
        visEl.appendChild(leftEl);
      }
      document.getElementById('rem-quotient').value = '';
      document.getElementById('rem-remainder').value = '';
      document.getElementById('rem-feedback').style.display = 'none';
      document.getElementById('rem-next').style.display = 'none';
    }
    document.getElementById('rem-check').addEventListener('click', () => {
      const q = Math.floor(remDividend / remDivisor2);
      const r = remDividend % remDivisor2;
      const qVal = parseInt(document.getElementById('rem-quotient').value) || 0;
      const rVal = parseInt(document.getElementById('rem-remainder').value) || 0;
      const fb = document.getElementById('rem-feedback');
      fb.style.display = 'block';
      if (qVal === q && rVal === r) {
        streak++;
        fb.className = 'remainder-result';
        fb.innerHTML = `${remDividend} ÷ ${remDivisor2} = ${q} …… 余 <span class="rem">${r}</span> ✅`;
        showToast('完美！', 'success');
        setTimeout(genRemainder, 1500);
      } else {
        streak = Math.max(0, streak - 1);
        fb.className = 'remainder-result';
        fb.innerHTML = `${remDividend} ÷ ${remDivisor2} = ${q} …… 余 <span class="rem">${r}</span>`;
        showToast('不对哦', 'error');
      }
      updateStars();
      document.getElementById('streak').textContent = streak;
      document.getElementById('rem-next').style.display = 'inline-block';
    });
    document.getElementById('rem-next').addEventListener('click', genRemainder);
    genRemainder();

    // === 5. 挑战模式 ===
    let chTimer, chTimeLeft = 60, chCorrect = 0, chWrong = 0, chActive = false;
    let chQ, chA, chCorrectAnswer;
    function genChallengeQ() {
      const types = Random.pick(['divide', 'missing', 'missing2']);
      if (types === 'divide') {
        chA = Random.int(2, 9);
        const chQuotient = Random.int(1, 12);
        chQ = chA * chQuotient;
        chCorrectAnswer = chQ / chA;
        document.getElementById('ch-problem').textContent = `${chQ} ÷ ${chA} = ?`;
      } else if (types === 'missing') {
        const divisors = [2,3,4,5,6,7,8,9];
        chA = Random.pick(divisors);
        chCorrectAnswer = Random.int(1, 9);
        chQ = chA * chCorrectAnswer;
        document.getElementById('ch-problem').textContent = `${chQ} ÷ ? = ${chCorrectAnswer}`;
      } else {
        const divisors = [2,3,4,5,6,7,8,9];
        chA = Random.pick(divisors);
        chCorrectAnswer = Random.int(1, 9);
        chQ = chA * chCorrectAnswer;
        document.getElementById('ch-problem').textContent = `? × ${chA} = ${chQ}`;
      }
      const optsEl = document.getElementById('ch-options');
      optsEl.innerHTML = '';
      let opts = [chCorrectAnswer];
      while (opts.length < 4) {
        let v = Random.int(1, Math.max(chQ, 10));
        if (!opts.includes(v)) opts.push(v);
      }
      Random.shuffle(opts).forEach(v => {
        const btn = document.createElement('button');
        btn.style.cssText = 'min-width:72px;height:72px;border:3px solid #E5E5EA;background:white;border-radius:16px;font-size:28px;font-weight:700;cursor:pointer;';
        btn.textContent = v;
        btn.addEventListener('click', () => {
          if (!chActive) return;
          document.getElementById('ch-options').querySelectorAll('button').forEach(b => b.disabled = true);
          const fb = document.getElementById('ch-feedback');
          if (v === chCorrectAnswer) {
            chCorrect++;
            btn.style.borderColor = '#34C759';
            btn.style.background = 'rgba(52,199,89,0.15)';
            fb.textContent = '✅ 对！';
            fb.style.color = '#34C759';
          } else {
            chWrong++;
            btn.style.borderColor = '#FF3B30';
            btn.style.background = 'rgba(255,59,48,0.1)';
            fb.textContent = `❌ 答案是 ${chCorrectAnswer}`;
            fb.style.color = '#FF3B30';
          }
          document.getElementById('ch-correct').textContent = chCorrect;
          document.getElementById('ch-wrong').textContent = chWrong;
          setTimeout(() => {
            fb.textContent = '';
            genChallengeQ();
          }, 800);
        });
        optsEl.appendChild(btn);
      });
    }
    document.getElementById('ch-start').addEventListener('click', () => {
      chActive = true;
      chTimeLeft = 60;
      chCorrect = 0;
      chWrong = 0;
      document.getElementById('ch-correct').textContent = 0;
      document.getElementById('ch-wrong').textContent = 0;
      document.getElementById('ch-start').style.display = 'none';
      genChallengeQ();
      chTimer = setInterval(() => {
        chTimeLeft--;
        document.getElementById('ch-time').textContent = chTimeLeft;
        document.getElementById('ch-timer-fill').style.width = (chTimeLeft/60*100)+'%';
        if (chTimeLeft <= 0) {
          clearInterval(chTimer);
          chActive = false;
          document.getElementById('ch-problem').textContent = '⏱️ 时间到！';
          document.getElementById('ch-options').innerHTML = '';
          document.getElementById('ch-feedback').textContent = `答对 ${chCorrect} 题，答错 ${chWrong} 题`;
          document.getElementById('ch-feedback').style.color = '#4A90D9';
          document.getElementById('ch-start').style.display = 'inline-block';
          document.getElementById('ch-start').textContent = '再来一次 ⏱️';
        }
      }, 1000);
    });
  </script>
</body>
