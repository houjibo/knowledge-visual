<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>分数的初步认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 切披萨模式 */
    .pizza-area { text-align: center; padding: 24px 16px; }
    .pizza-svg { width: 240px; height: 240px; margin: 16px auto; cursor: pointer; }
    .pizza-slice { transition: fill 0.3s ease; cursor: pointer; }
    .pizza-slice.active { fill: #FF9500; }
    .pizza-slice:hover { fill: #FFB340; }
    .fraction-display { font-size: 48px; font-weight: 800; color: #4A90D9; margin: 16px 0; }
    .fraction-display .num { color: #FF9500; }
    .fraction-display .den { color: #4A90D9; }
    .pizza-controls { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
    .pizza-btn { min-width: 56px; min-height: 56px; border: 2px solid #9CA3AF; background: #F8F8FA; border-radius: 12px; font-size: 20px; cursor: pointer; transition: all 0.2s ease; }
    .pizza-btn:active { transform: scale(0.9); }
    .pizza-btn.active { border-color: #FF9500; background: #FF9500; color: white; }

    /* 分数条模式 */
    .bar-area { text-align: center; padding: 24px 16px; }
    .fraction-bar-wrap { position: relative; margin: 4px 0 12px; }
    .fraction-bar { height: 40px; border-radius: 8px; overflow: hidden; display: flex; position: relative; background: #E5E5EA; }
    .fraction-bar .bar-fill { height: 100%; transition: width 0.4s ease; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: white; }
    .fraction-bar .bar-ref {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 2px dashed #C0C4CC; border-radius: 8px; pointer-events: none;
    }
    .fraction-bar .bar-remainder {
      height: 100%; background: repeating-linear-gradient(
        -45deg, transparent, transparent 4px, rgba(0,0,0,0.04) 4px, rgba(0,0,0,0.04) 8px
      ); border-radius: 0 8px 8px 0;
    }
    .bar-label { font-size: 20px; font-weight: 600; margin: 4px 0; }
    .bar-compare { display: flex; gap: 16px; align-items: center; justify-content: center; margin: 16px 0; }
    .bar-compare .bar-wrap { flex: 1; max-width: 200px; }
    .bar-compare-sign { font-size: 48px; font-weight: 700; color: #FF9500; }

    /* 涂色模式 */
    .color-area { text-align: center; padding: 24px 16px; }
    .color-grid { display: grid; gap: 4px; max-width: 300px; margin: 16px auto; }
    .color-cell {
      aspect-ratio: 1; border: 3px solid #9CA3AF; border-radius: 8px;
      cursor: pointer; transition: all 0.2s ease; background: #F5F5F7;
    }
    .color-cell:active { transform: scale(0.95); }
    .color-cell.colored { background: #4A90D9; border-color: #2C6FB5; }
    .color-instruction { font-size: 22px; font-weight: 600; margin: 16px 0; }
    .color-progress { font-size: 18px; color: #6E6E73; margin: 12px 0; }

    /* 分数比较模式 */
    .compare-area { text-align: center; padding: 24px 16px; }
    .compare-fractions { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 24px 0; }
    .frac-display { font-size: 48px; font-weight: 800; color: #4A90D9; }
    .frac-display .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
    .frac-display .frac .num { border-bottom: 3px solid #4A90D9; padding: 0 8px 4px; }
    .frac-display .frac .den { padding: 4px 8px 0; }
    .compare-sign { font-size: 36px; color: #6E6E73; }
    .compare-options { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
    .compare-btn { width: 64px; height: 64px; border: 3px solid #9CA3AF; background: #F8F8FA; border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .compare-btn:active { transform: scale(0.9); }
    .compare-btn.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .compare-btn.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }

    /* 挑战模式 */
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }
    .timer-bar { height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30); border-radius: 4px; transition: width 0.1s linear; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #4A90D9; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .challenge-toolbar { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
    .toolbar-btn {
      padding: 8px 16px; border: 2px solid #9CA3AF; background: white;
      border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .toolbar-btn:active { transform: scale(0.95); }
    .toolbar-btn.danger { border-color: #FF3B30; color: #FF3B30; }
    .challenge-opt {
      padding: 20px; border: 3px solid #9CA3AF; background: #F8F8FA;
      border-radius: 16px; font-size: 24px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      margin: 4px;
    }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-history { max-height: 200px; overflow-y: auto; margin: 12px 0; padding: 8px; background: #F8F9FE; border-radius: 12px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-radius: 8px; margin: 4px 0; font-size: 14px; font-weight: 600; }
    .history-item.correct { background: rgba(52,199,89,0.1); color: #34C759; }
    .history-item.wrong { background: rgba(255,59,48,0.1); color: #FF3B30; }
    .history-item.timeout { background: rgba(255,149,0,0.15); color: #FF9500; }
    .history-item .problem { color: #6E6E73; }
    .history-panel { display: none; }
    .history-panel.show { display: block; animation: fadeInUp 0.3s ease; }
    .history-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .history-tab {
      flex: 1; padding: 6px 8px; border: 2px solid #9CA3AF; background: white;
      border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      text-align: center; transition: all 0.2s ease;
    }
    .history-tab.active { border-color: #4A90D9; background: #4A90D9; color: white; }
    .history-tab .count { display: inline-block; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 0 6px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">🍕 分数的初步认识</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="pizza">🍕 切披萨</button>
      <button class="mode-tab" data-mode="bar">📊 分数条</button>
      <button class="mode-tab" data-mode="color">🎨 涂色</button>
      <button class="mode-tab" data-mode="compare">⚖️ 比大小</button>
    </div>

    <!-- 模式1: 切披萨 -->
    <div class="mode-content active" id="mode-pizza">
      <div class="card">
        <p class="page-subtitle">点击选择要几块，看看是几分之几</p>
        <div class="pizza-area">
          <svg class="pizza-svg" id="pizza-svg" viewBox="0 0 200 200"></svg>
          <div class="fraction-display" id="pizza-fraction"></div>
          <div class="pizza-controls" id="pizza-controls"></div>
          <p style="font-size:14px;color:#6E6E73;margin-top:8px" id="pizza-explain"></p>
        </div>
      </div>
    </div>

    <!-- 模式2: 分数条 -->
    <div class="mode-content" id="mode-bar">
      <div class="card">
        <p class="page-subtitle">看看不同分数的条形图，虚线框表示"1"</p>
        <div class="bar-area" id="bar-area"></div>
      </div>
    </div>

    <!-- 模式3: 涂色 -->
    <div class="mode-content" id="mode-color">
      <div class="card">
        <div class="color-area">
          <div class="color-instruction" id="color-instruction"></div>
          <div class="color-progress" id="color-progress"></div>
          <div class="color-grid" id="color-grid"></div>
          <div class="action-bar"><button class="btn btn-warning" id="btn-new-color">🔄 换一个</button></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 分数比较挑战 -->
    <div class="mode-content" id="mode-compare">
      <div class="card">
        <div class="compare-area">
          <div class="challenge-score">
            <span>答对 <b id="ch-correct" style="color:#34C759">0</b></span>
            <span>答错 <b id="ch-wrong" style="color:#FF3B30">0</b></span>
            <span>超时 <b id="ch-timeout" style="color:#FF9500">0</b></span>
          </div>
          <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
          <div class="challenge-toolbar" id="challenge-toolbar" style="display:none">
            <button class="toolbar-btn" id="btn-history">📋 查看记录</button>
            <button class="toolbar-btn danger" id="btn-clear-history">🗑️ 清空记录</button>
          </div>
          <div class="history-panel" id="history-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px">
              <span style="font-size:16px;font-weight:700;color:#4A90D9">📋 答题记录</span>
              <button class="toolbar-btn" id="btn-close-history" style="padding:4px 12px">关闭</button>
            </div>
            <div class="history-tabs">
              <div class="history-tab active" data-type="all">📋 全部</div>
              <div class="history-tab" data-type="correct">✅ 正确</div>
              <div class="history-tab" data-type="wrong">❌ 答错</div>
              <div class="history-tab" data-type="timeout">⏰ 超时</div>
            </div>
            <div class="challenge-history" id="history-list"></div>
          </div>
          <button class="challenge-start-btn" id="btn-start-challenge">🏆 开始挑战！</button>
          <div class="challenge-running">
            <div id="compare-bars"></div>
            <div class="compare-fractions" id="compare-fracs"></div>
            <div class="compare-options" id="compare-opts">
              <button class="challenge-opt" data-ans="lt">&lt;</button>
              <button class="challenge-opt" data-ans="eq">=</button>
              <button class="challenge-opt" data-ans="gt">&gt;</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！分数小达人！`);
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 切披萨 ===
    (() => {
      let parts = 4, active = 0;
      function drawPizza() {
        const svg = document.getElementById('pizza-svg');
        svg.innerHTML = '';
        const cx = 100, cy = 100, r = 90;
        for (let i = 0; i < parts; i++) {
          const a1 = (Math.PI * 2 * i) / parts - Math.PI / 2;
          const a2 = (Math.PI * 2 * (i + 1)) / parts - Math.PI / 2;
          const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
          const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
          const large = parts <= 2 ? 0 : (Math.PI * 2 / parts > Math.PI ? 1 : 0);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z`);
          path.setAttribute('class', 'pizza-slice' + (i < active ? ' active' : ''));
          path.setAttribute('fill', i < active ? '#FF9500' : '#FFE4B5');
          path.setAttribute('stroke', '#D4A574');
          path.setAttribute('stroke-width', '2');
          ((idx) => path.addEventListener('click', () => { active = idx + 1; updatePizza(); Sound.play('click'); }))(i);
          svg.appendChild(path);
        }
      }
      function updatePizza() {
        drawPizza();
        document.getElementById('pizza-fraction').innerHTML = `<span class="num">${active}</span> / <span class="den">${parts}</span>`;
        document.getElementById('pizza-explain').textContent = `把一个披萨平均分成 ${parts} 份，取了 ${active} 份，就是 ${active}/${parts}`;
      }
      const ctrl = document.getElementById('pizza-controls');
      [2,3,4,6,8].forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'pizza-btn' + (n === parts ? ' active' : '');
        btn.textContent = `分${n}份`;
        btn.addEventListener('click', () => { parts = n; active = Math.min(active, n); updatePizza(); Sound.play('click'); });
        ctrl.appendChild(btn);
      });
      updatePizza();
    })();

    // === 模式2: 分数条（带"1"参考框） ===
    (() => {
      const area = document.getElementById('bar-area');
      const colors = ['#4A90D9','#34C759','#FF9500','#AF52DE','#FF2D55'];
      const fracs = [];
      for (let i = 0; i < 8; i++) { const d = Random.pick([2,3,4,5,6,8,10]); let n = Random.int(1, d-1); fracs.push([n, d]); }
      fracs.forEach(([n, d], idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'fraction-bar-wrap';
        const label = document.createElement('div');
        label.className = 'bar-label';
        label.textContent = `${n}/${d}`;
        wrap.appendChild(label);
        const bar = document.createElement('div');
        bar.className = 'fraction-bar';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = ((n / d) * 100) + '%';
        fill.style.background = colors[idx % colors.length];
        fill.textContent = `${n}/${d}`;
        bar.appendChild(fill);
        if (n < d) {
          const remainder = document.createElement('div');
          remainder.className = 'bar-remainder';
          remainder.style.width = ((d - n) / d * 100) + '%';
          bar.appendChild(remainder);
        }
        const ref = document.createElement('div');
        ref.className = 'bar-ref';
        bar.appendChild(ref);
        wrap.appendChild(bar);
        area.appendChild(wrap);
        Animator.popIn(fill, idx * 80);
      });
      const comp = document.createElement('div');
      comp.className = 'bar-compare';
      comp.style.marginTop = '24px';
      comp.innerHTML = `
        <div class="bar-wrap">
          <div class="bar-label">1/2</div>
          <div class="fraction-bar">
            <div class="bar-fill" style="width:50%;background:#4A90D9">1/2</div>
            <div class="bar-remainder" style="width:50%"></div>
            <div class="bar-ref"></div>
          </div>
        </div>
        <div class="bar-compare-sign">vs</div>
        <div class="bar-wrap">
          <div class="bar-label">1/4</div>
          <div class="fraction-bar">
            <div class="bar-fill" style="width:25%;background:#FF9500">1/4</div>
            <div class="bar-remainder" style="width:75%"></div>
            <div class="bar-ref"></div>
          </div>
        </div>
      `;
      area.appendChild(comp);
    })();

    // === 模式3: 涂色 ===
    (() => {
      let targetN, targetD, colored, colorTimer = null;
      function newColor() {
        colorTimer && clearTimeout(colorTimer);
        colorTimer = null;
        const denoms = [2,3,4,6,8];
        targetD = Random.pick(denoms);
        targetN = Random.int(1, targetD - 1);
        colored = 0;
        document.getElementById('color-instruction').innerHTML = `请涂出 <span style="color:#FF9500;font-size:28px">${targetN}/${targetD}</span> 的部分`;
        document.getElementById('color-progress').textContent = `已涂 ${colored} / ${targetN}`;
        const grid = document.getElementById('color-grid');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${targetD > 4 ? 4 : targetD}, 1fr)`;
        for (let i = 0; i < targetD; i++) {
          const cell = document.createElement('div');
          cell.className = 'color-cell';
          cell.addEventListener('click', () => {
            if (cell.classList.contains('colored')) {
              cell.classList.remove('colored'); colored--;
            } else {
              cell.classList.add('colored'); colored++;
            }
            document.getElementById('color-progress').textContent = `已涂 ${colored} / ${targetN}`;
            Sound.play('click');
            if (colored === targetN) {
              streak++; Sound.play('correct'); celebrate(grid);
              updateStreak(); showToast(`🎉 涂对了 ${targetN}/${targetD}！`);
              colorTimer = setTimeout(newColor, 1500);
            }
          });
          grid.appendChild(cell);
          Animator.popIn(cell, i * 40);
        }
      }
      document.getElementById('btn-new-color').addEventListener('click', newColor);
      newColor();
    })();

    // === 模式4: 分数比较挑战（与二年级一致的设计） ===
    (() => {
      let n1 = 1, n2 = 2, d = 4, correct = 0, wrong = 0, timeoutCount = 0;
      let timer = null, timeLeft = 100, running = false;
      let history = [];
      let colorTimer = null;

      function saveHistory() {
        try { localStorage.setItem('fraction-challenge-history', JSON.stringify(history)); } catch(e) {}
      }
      function loadHistory() {
        try { const h = localStorage.getItem('fraction-challenge-history'); return h ? JSON.parse(h) : []; } catch(e) { return []; }
      }
      history = loadHistory();

      function renderHistory(filter = 'all') {
        const list = document.getElementById('history-list');
        if (history.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:24px;color:#9E9EA7">暂无答题记录</div>';
          return;
        }
        let filtered = history;
        if (filter === 'correct') filtered = history.filter(h => h.correct === true);
        else if (filter === 'wrong') filtered = history.filter(h => h.correct === false && h.timedOut !== true);
        else if (filter === 'timeout') filtered = history.filter(h => h.timedOut === true);
        if (filtered.length === 0) {
          list.innerHTML = `<div style="text-align:center;padding:24px;color:#9E9EA7">暂无${filter === 'correct' ? '正确' : filter === 'wrong' ? '答错' : '超时'}记录</div>`;
          return;
        }
        const recent = filtered.slice(-20).reverse();
        list.innerHTML = recent.map(h => {
          if (h.timedOut) {
            return `<div class="history-item timeout"><span class="problem">${h.problem}</span><span>⏰ 超时</span></div>`;
          } else if (h.correct) {
            return `<div class="history-item correct"><span class="problem">${h.problem}</span><span>✅ 正确</span></div>`;
          } else {
            return `<div class="history-item wrong"><span class="problem">${h.problem}</span><span>❌ 答错（答案：${h.answer}）</span></div>`;
          }
        }).join('');
      }

      function renderHistoryCounts() {
        const cc = history.filter(h => h.correct === true).length;
        const wc = history.filter(h => h.correct === false && h.timedOut !== true).length;
        const tc = history.filter(h => h.timedOut === true).length;
        document.querySelectorAll('.history-tab').forEach(tab => {
          tab.classList.remove('active');
          const type = tab.dataset.type;
          if (type === 'correct') tab.innerHTML = `✅ 正确 <span class="count">${cc}</span>`;
          else if (type === 'wrong') tab.innerHTML = `❌ 答错 <span class="count">${wc}</span>`;
          else if (type === 'timeout') tab.innerHTML = `⏰ 超时 <span class="count">${tc}</span>`;
          else tab.innerHTML = `📋 全部 <span class="count">${history.length}</span>`;
        });
      }

      function newCompare() {
        colorTimer && clearTimeout(colorTimer);
        colorTimer = null;
        d = Random.pick([2,3,4,6,8]);
        n1 = Random.int(1, d - 1);
        do { n2 = Random.int(1, d - 1); } while (n2 === n1);
        const colors = ['#4A90D9','#FF9500'];
        const answer = n1 < n2 ? 'lt' : (n1 > n2 ? 'gt' : 'eq');
        document.getElementById('compare-fracs').innerHTML = `
          <div class="frac-display"><div class="frac"><span class="num">${n1}</span><span class="den">${d}</span></div></div>
          <span class="compare-sign">?</span>
          <div class="frac-display"><div class="frac"><span class="num">${n2}</span><span class="den">${d}</span></div></div>
        `;
        const bars = document.getElementById('compare-bars');
        bars.innerHTML = `
          <div class="bar-compare">
            <div class="bar-wrap">
              <div class="bar-label">${n1}/${d}</div>
              <div class="fraction-bar">
                <div class="bar-fill" style="width:${(n1/d)*100}%;background:${colors[0]}">${n1}/${d}</div>
                ${n1 < d ? `<div class="bar-remainder" style="width:${((d-n1)/d)*100}%"></div>` : ''}
                <div class="bar-ref"></div>
              </div>
            </div>
            <div class="bar-wrap">
              <div class="bar-label">${n2}/${d}</div>
              <div class="fraction-bar">
                <div class="bar-fill" style="width:${(n2/d)*100}%;background:${colors[1]}">${n2}/${d}</div>
                ${n2 < d ? `<div class="bar-remainder" style="width:${((d-n2)/d)*100}%"></div>` : ''}
                <div class="bar-ref"></div>
              </div>
            </div>
          </div>
        `;
        document.querySelectorAll('.compare-btn').forEach(b => b.classList.remove('correct', 'wrong'));
        timeLeft = 100;
        document.getElementById('timer-fill').style.width = '100%';
      }

      function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
          timeLeft -= 1;
          document.getElementById('timer-fill').style.width = timeLeft + '%';
          if (timeLeft <= 0) {
            clearInterval(timer); timer = null;
            timeoutCount++; streak = 0;
            const answer = n1 < n2 ? '<' : (n1 > n2 ? '>' : '=');
            const record = { problem: `${n1}/${d} ○ ${n2}/${d}`, answer, correct: false, timedOut: true, time: Date.now() };
            history.push(record); saveHistory();
            Sound.play('wrong'); updateStreak();
            document.getElementById('ch-timeout').textContent = timeoutCount;
            showToast(`⏰ 时间到！答案是 ${answer}`);
            colorTimer = setTimeout(newCompare, 1500);
          }
        }, 100);
      }

      function stopTimer() { clearInterval(timer); timer = null; }

      // 开始挑战
      document.getElementById('btn-start-challenge').addEventListener('click', () => {
        stopTimer(); correct = 0; wrong = 0; timeoutCount = 0;
        document.getElementById('ch-correct').textContent = 0;
        document.getElementById('ch-wrong').textContent = 0;
        document.getElementById('ch-timeout').textContent = 0;
        document.querySelector('.compare-area').classList.add('challenge-active');
        document.getElementById('challenge-toolbar').style.display = 'flex';
        document.getElementById('history-panel').classList.remove('show');
        running = true; newCompare(); startTimer(); Sound.play('click');
      });

      // 查看记录
      document.getElementById('btn-history').addEventListener('click', () => {
        const panel = document.getElementById('history-panel');
        const isShowing = panel.classList.contains('show');
        panel.classList.toggle('show');
        if (!isShowing) { renderHistoryCounts(); renderHistory('all'); }
        Sound.play('click');
      });
      document.getElementById('btn-close-history').addEventListener('click', () => {
        document.getElementById('history-panel').classList.remove('show');
        Sound.play('click');
      });
      document.querySelectorAll('.history-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderHistory(tab.dataset.type);
          Sound.play('click');
        });
      });
      document.getElementById('btn-clear-history').addEventListener('click', () => {
        history = []; saveHistory();
        showToast('📋 答题记录已清空');
        renderHistoryCounts(); renderHistory('all');
        Sound.play('click');
      });

      // 点击选项
      document.querySelectorAll('.compare-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          colorTimer && clearTimeout(colorTimer);
          colorTimer = null;
          const ans = btn.dataset.ans;
          const correctAns = n1 < n2 ? 'lt' : (n1 > n2 ? 'gt' : 'eq');
          const answerStr = correctAns === 'lt' ? '<' : (correctAns === 'gt' ? '>' : '=');
          const ok = ans === correctAns;
          const record = { problem: `${n1}/${d} ○ ${n2}/${d}`, answer: answerStr, correct: ok, timedOut: false, time: Date.now() };
          history.push(record); saveHistory();
          if (ok) {
            btn.classList.add('correct'); correct++; streak++;
            Sound.play('correct'); celebrate(); updateStreak();
            document.getElementById('ch-correct').textContent = correct;
            colorTimer = setTimeout(newCompare, 1000);
          } else {
            btn.classList.add('wrong'); Animator.shake(btn);
            wrong++; streak = 0; Sound.play('wrong'); updateStreak();
            document.getElementById('ch-wrong').textContent = wrong;
            showToast(`答案是 ${answerStr}`);
            colorTimer = setTimeout(newCompare, 1500);
          }
        });
      });

      // 切 tab
      const origTabs = document.querySelectorAll('.mode-tab');
      origTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const isChallenge = tab.dataset.mode === 'compare';
          if (!isChallenge && running) {
            stopTimer(); running = false;
            document.querySelector('.compare-area').classList.remove('challenge-active');
          } else if (isChallenge && !running && correct + wrong + timeoutCount > 0) {
            running = true;
            document.querySelector('.compare-area').classList.add('challenge-active');
            document.getElementById('challenge-toolbar').style.display = 'flex';
            startTimer();
            showToast('⏱️ 计时恢复！继续挑战');
          }
        });
      });

      // 初始非挑战模式（只显示题目+按钮，不计时）
      newCompare();
    })();
  </script>
</body>
</html>
