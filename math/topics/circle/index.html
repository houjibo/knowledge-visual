<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>圆的认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #AF52DE; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }
    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }

    .circle-canvas { display: block; margin: 16px auto; background: white; border-radius: 16px; max-width: 100%; }
    .circle-formula { font-size: 22px; font-weight: 700; margin: 16px 0; color: #AF52DE; text-align: center; }
    .circle-slider-wrap { display: flex; align-items: center; gap: 16px; justify-content: center; margin: 16px 0; }
    .circle-slider { width: 200px; accent-color: #AF52DE; }
    .circle-info { text-align: center; font-size: 18px; color: #6E6E73; margin: 8px 0; }
    .circle-info strong { color: #AF52DE; }

    .action-bar { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
    .btn { padding: 10px 24px; border: none; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn-primary { background: #AF52DE; color: white; }
    .btn-large { padding: 14px 32px; font-size: 18px; }
    .btn:active { transform: scale(0.95); }

    .page-subtitle { text-align: center; color: #6E6E73; font-size: 16px; margin: 8px 16px 16px; }
    .card { background: white; border-radius: 20px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 8px; }
    .page-container { max-width: 480px; margin: 0 auto; padding: 8px; }
    .nav-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: white; border-radius: 16px; margin-bottom: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .nav-btn { width: 36px; height: 36px; border: none; background: #F2F2F7; border-radius: 10px; font-size: 18px; cursor: pointer; }
    .nav-title { font-size: 18px; font-weight: 700; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* 挑战 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-problem { font-size: 26px; font-weight: 700; color: #AF52DE; margin: 24px 0; line-height: 1.5; }
    .challenge-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 400px; margin: 24px auto; padding: 0 16px; }
    .challenge-opt { padding: 20px; border: 3px solid #E5E5EA; background: white; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 认识圆 */
    .circle-terms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 16px; padding: 0 16px; }
    .circle-term { padding: 12px; background: rgba(175,82,222,0.08); border-radius: 12px; text-align: center; }
    .circle-term .icon { font-size: 24px; }
    .circle-term .name { font-weight: 700; color: #AF52DE; margin: 4px 0; }
    .circle-term .desc { font-size: 14px; color: #6E6E73; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">⭕ 圆</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display">
      <span>连续答对</span><span id="streak" style="color:#AF52DE">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="basics">⭕ 认识圆</button>
      <button class="mode-tab" data-mode="circumference">📏 周长</button>
      <button class="mode-tab" data-mode="area">📐 面积</button>
      <button class="mode-tab" data-mode="explore">🔍 探索π</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 认识圆 -->
    <div class="mode-content active" id="mode-basics">
      <div class="card">
        <p class="page-subtitle">到定点距离等于定长的所有点组成的图形</p>
        <canvas class="circle-canvas" id="basics-canvas" width="320" height="320"></canvas>
        <div class="circle-terms">
          <div class="circle-term"><div class="icon">📍</div><div class="name">圆心 O</div><div class="desc">圆的中心点</div></div>
          <div class="circle-term"><div class="icon">📏</div><div class="name">半径 r</div><div class="desc">圆心到圆周的距离</div></div>
          <div class="circle-term"><div class="icon">↔️</div><div class="name">直径 d</div><div class="desc">通过圆心的弦，d = 2r</div></div>
          <div class="circle-term"><div class="icon">🔄</div><div class="name">对称性</div><div class="desc">无数条对称轴</div></div>
        </div>
        <div class="circle-slider-wrap">
          <span>半径：</span>
          <input type="range" class="circle-slider" id="r-slider" min="1" max="10" value="3" step="1">
          <span id="r-val" style="font-size:20px;font-weight:700;color:#AF52DE">3</span>
        </div>
      </div>
    </div>

    <!-- 模式2: 周长 -->
    <div class="mode-content" id="mode-circumference">
      <div class="card">
        <p class="page-subtitle">圆的周长 C = 2πr = πd</p>
        <canvas class="circle-canvas" id="circ-canvas" width="320" height="280"></canvas>
        <div class="circle-slider-wrap">
          <span>半径：</span>
          <input type="range" class="circle-slider" id="c-slider" min="1" max="8" value="3" step="1">
          <span id="c-val" style="font-size:20px;font-weight:700;color:#AF52DE">3</span>
        </div>
        <div class="circle-formula" id="circ-formula"></div>
        <div class="circle-info" id="circ-info"></div>
      </div>
    </div>

    <!-- 模式3: 面积 -->
    <div class="mode-content" id="mode-area">
      <div class="card">
        <p class="page-subtitle">圆的面积 S = πr²</p>
        <canvas class="circle-canvas" id="area-canvas" width="320" height="280"></canvas>
        <div class="circle-slider-wrap">
          <span>半径：</span>
          <input type="range" class="circle-slider" id="a-slider" min="1" max="8" value="3" step="1">
          <span id="a-val" style="font-size:20px;font-weight:700;color:#AF52DE">3</span>
        </div>
        <div class="circle-formula" id="area-formula"></div>
        <div class="circle-info" id="area-info"></div>
      </div>
    </div>

    <!-- 模式4: 探索π -->
    <div class="mode-content" id="mode-explore">
      <div class="card">
        <p class="page-subtitle">拖动滑块，看看 C/d 的比值是多少</p>
        <canvas class="circle-canvas" id="pi-canvas" width="320" height="200"></canvas>
        <div class="circle-slider-wrap">
          <span>直径：</span>
          <input type="range" class="circle-slider" id="pi-slider" min="1" max="10" value="3" step="1">
          <span id="pi-d-val" style="font-size:20px;font-weight:700;color:#AF52DE">3</span>
        </div>
        <div id="pi-table" style="margin:16px auto;max-width:320px"></div>
        <div style="text-align:center;font-size:18px;color:#6E6E73;margin:12px 0">
          无论圆多大，<strong style="color:#AF52DE">周长÷直径 ≈ 3.14159...</strong> 这就是 π！
        </div>
      </div>
    </div>

    <!-- 模式5: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-problem" id="challenge-problem"></div>
          <div class="challenge-options" id="challenge-options"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！圆的小专家！`);
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    const PI = Math.PI;
    function drawCircle(ctx, cx, cy, r, strokeColor, fillColor, lineWidth) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
      if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lineWidth || 2; ctx.stroke(); }
    }

    // === 模式1: 认识圆 ===
    (() => {
      const canvas = document.getElementById('basics-canvas');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('r-slider');
      function draw() {
        const r = parseInt(slider.value);
        document.getElementById('r-val').textContent = r;
        const scale = 24; // px per unit
        const pr = r * scale;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 圆
        drawCircle(ctx, cx, cy, pr, null, 'rgba(175,82,222,0.1)', 0);
        drawCircle(ctx, cx, cy, pr, '#AF52DE', null, 3);
        // 圆心
        ctx.fillStyle = '#AF52DE'; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#AF52DE'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('O', cx + 10, cy - 10);
        // 半径
        ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 3; ctx.setLineDash([5, 3]);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + pr, cy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#FF9500'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`r = ${r}`, cx + pr / 2, cy - 12);
        // 直径
        ctx.strokeStyle = '#4A90D9'; ctx.lineWidth = 3; ctx.setLineDash([5, 3]);
        ctx.beginPath(); ctx.moveTo(cx - pr, cy); ctx.lineTo(cx + pr, cy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#4A90D9'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`d = 2r = ${r * 2}`, cx, cy + 24);
        // 弦
        ctx.strokeStyle = '#34C759'; ctx.lineWidth = 2;
        const angle = Math.PI / 3;
        const x1 = cx + pr * Math.cos(angle), y1 = cy + pr * Math.sin(angle);
        const x2 = cx + pr * Math.cos(-angle), y2 = cy + pr * Math.sin(-angle);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.fillStyle = '#34C759'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('弦', x1 - 4, (y1 + y2) / 2 + 4);
      }
      slider.addEventListener('input', draw);
      draw();
    })();

    // === 模式2: 周长 ===
    (() => {
      const canvas = document.getElementById('circ-canvas');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('c-slider');
      function draw() {
        const r = parseInt(slider.value);
        document.getElementById('c-val').textContent = r;
        const scale = 28, pr = r * scale;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawCircle(ctx, cx, cy, pr, null, 'rgba(175,82,222,0.08)', 0);
        // 周长线（滚动展开）
        drawCircle(ctx, cx, cy, pr, '#AF52DE', null, 3);
        // 周长 = 直线展开
        const circ = 2 * PI * r;
        const lineWidth = Math.min(circ * scale, canvas.width - 40);
        const lineY = cy + pr + 30;
        ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx - lineWidth / 2, lineY); ctx.lineTo(cx + lineWidth / 2, lineY); ctx.stroke();
        ctx.fillStyle = '#FF9500'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`周长 = ${circ.toFixed(2)}`, cx, lineY + 20);
        // 公式
        document.getElementById('circ-formula').innerHTML = `
          C = 2 × π × r = 2 × 3.14159 × ${r} = <span style="color:#FF9500">${circ.toFixed(2)}</span>
        `;
        document.getElementById('circ-info').innerHTML = `
          直径 d = ${r * 2}，C = πd = 3.14159 × ${r * 2} = <span style="color:#FF9500;font-weight:700">${circ.toFixed(2)}</span>
        `;
      }
      slider.addEventListener('input', draw);
      draw();
    })();

    // === 模式3: 面积 ===
    (() => {
      const canvas = document.getElementById('area-canvas');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('a-slider');
      function draw() {
        const r = parseInt(slider.value);
        document.getElementById('a-val').textContent = r;
        const scale = 28, pr = r * scale;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 填充圆
        drawCircle(ctx, cx, cy, pr, null, 'rgba(175,82,222,0.2)', 0);
        // 扇形分割
        const sectors = Math.max(8, r * 4);
        for (let i = 0; i < sectors; i++) {
          const startAngle = (i / sectors) * Math.PI * 2;
          const endAngle = ((i + 1) / sectors) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, pr, startAngle, endAngle); ctx.closePath();
          ctx.fillStyle = i % 2 === 0 ? 'rgba(175,82,222,0.15)' : 'rgba(175,82,222,0.3)';
          ctx.fill();
        }
        drawCircle(ctx, cx, cy, pr, '#AF52DE', null, 2);
        // 面积正方形对比
        const sq = r * r;
        const sqSize = sq * scale;
        const sqX = cx - sqSize / 2, sqY = cy - sqSize / 2;
        ctx.strokeStyle = 'rgba(255,149,0,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
        ctx.strokeRect(sqX, sqY, sqSize, sqSize); ctx.setLineDash([]);

        const area = PI * r * r;
        document.getElementById('area-formula').innerHTML = `
          S = π × r² = 3.14159 × ${r}² = 3.14159 × ${r * r} = <span style="color:#AF52DE">${area.toFixed(2)}</span>
        `;
        document.getElementById('area-info').innerHTML = `
          半径 ${r}，面积 ≈ <span style="color:#AF52DE;font-weight:700">${area.toFixed(2)}</span><br>
          <span style="font-size:14px">圆面积约是 r² 正方形的 ${PI.toFixed(2)} 倍</span>
        `;
      }
      slider.addEventListener('input', draw);
      draw();
    })();

    // === 模式4: 探索π ===
    (() => {
      const canvas = document.getElementById('pi-canvas');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('pi-slider');
      function draw() {
        const d = parseInt(slider.value);
        document.getElementById('pi-d-val').textContent = d;
        const r = d / 2;
        const scale = 24, pr = r * scale;
        const cx = 80, cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawCircle(ctx, cx, cy, pr, null, 'rgba(175,82,222,0.15)', 0);
        drawCircle(ctx, cx, cy, pr, '#AF52DE', null, 3);
        // 直径
        ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx - pr, cy); ctx.lineTo(cx + pr, cy); ctx.stroke();
        ctx.fillStyle = '#FF9500'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`d = ${d}`, cx, cy + 18);

        const circ = PI * d;
        const ratio = circ / d;
        // 周长展开
        const lineLen = Math.min(circ * scale, canvas.width - 100);
        const lineX = 180, lineY = cy;
        ctx.strokeStyle = '#34C759'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(lineX, lineY); ctx.lineTo(lineX + lineLen, lineY); ctx.stroke();
        ctx.fillStyle = '#34C759'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(`C ≈ ${circ.toFixed(2)}`, lineX, lineY - 10);

        document.getElementById('pi-table').innerHTML = `
          <div class="tax-row"><span>直径 d</span><span>${d}</span></div>
          <div class="tax-row"><span>周长 C</span><span>${circ.toFixed(4)}</span></div>
          <div class="tax-row" style="font-weight:700;color:#AF52DE"><span>C ÷ d</span><span>${ratio.toFixed(6)}</span></div>
        `;
      }
      slider.addEventListener('input', draw);
      draw();
    })();

    // === 模式5: 挑战 ===
    (() => {
      function newChallenge() {
        const type = Random.int(1, 5);
        let question, answer, options, hint;
        const r = Random.int(1, 15);
        if (type === 1) {
          // 已知半径求周长
          question = `半径 r = ${r}，圆的周长 = ?（π取3.14）`;
          answer = (2 * 3.14 * r).toFixed(2);
          options = [answer, (2 * 3.14 * (r + 1)).toFixed(2), (3.14 * r).toFixed(2), (2 * 3 * r).toFixed(2)];
          hint = `💡 C = 2πr = 2 × 3.14 × ${r}`;
        } else if (type === 2) {
          // 已知直径求面积
          question = `直径 d = ${r * 2}，圆的面积 = ?（π取3.14）`;
          answer = (3.14 * r * r).toFixed(2);
          options = [answer, (3.14 * (r + 1) * (r + 1)).toFixed(2), (3.14 * r).toFixed(2), (2 * 3.14 * r).toFixed(2)];
          hint = `💡 r = ${r}，S = πr² = 3.14 × ${r}² = 3.14 × ${r * r}`;
        } else if (type === 3) {
          // 已知周长求半径
          const c = 2 * 3.14 * r;
          question = `圆的周长 = ${c.toFixed(2)}，半径 = ?（π取3.14）`;
          answer = r.toString();
          options = [r.toString(), (r + 1).toString(), (r - 1 > 0 ? r - 1 : r + 2).toString(), (r * 2).toString()];
          hint = `💡 r = C ÷ (2π) = ${c.toFixed(2)} ÷ 6.28 = ${r}`;
        } else if (type === 4) {
          // 半圆周长
          question = `半径 r = ${r}，半圆的周长 = ?（π取3.14）`;
          const half = 3.14 * r + 2 * r;
          answer = half.toFixed(2);
          options = [half.toFixed(2), (3.14 * r).toFixed(2), (3.14 * r * 2).toFixed(2), (3.14 * r + r).toFixed(2)];
          hint = `💡 半圆周长 = πr + 2r = 3.14×${r} + ${2 * r} = ${half.toFixed(2)}`;
        } else {
          // 圆环面积
          const R = r + Random.int(1, 3);
          const ring = 3.14 * (R * R - r * r);
          question = `外圆半径 ${R}，内圆半径 ${r}，圆环面积 = ?（π取3.14）`;
          answer = ring.toFixed(2);
          options = [ring.toFixed(2), (3.14 * R * R).toFixed(2), (3.14 * r * r).toFixed(2), (3.14 * (R + r)).toFixed(2)];
          hint = `💡 S = π(R² - r²) = 3.14 × (${R}² - ${r}²) = 3.14 × ${R * R - r * r}`;
        }
        options = [...new Set(options)];
        while (options.length < 4) {
          const fake = (parseFloat(answer) + Random.int(-5, 5)).toFixed(2);
          if (!options.includes(fake)) options.push(fake);
        }
        options = Random.shuffle(options).slice(0, 4);
        if (!options.includes(answer)) options[0] = answer;
        document.getElementById('challenge-problem').innerHTML = `<div style="font-size:14px;color:#6E6E73;margin-bottom:8px">${hint}</div>${question}`;
        const container = document.getElementById('challenge-options');
        container.innerHTML = '';
        Random.shuffle(options).forEach(val => {
          const btn = document.createElement('div');
          btn.className = 'challenge-opt'; btn.textContent = val;
          btn.addEventListener('click', () => {
            if (val === answer) {
              btn.classList.add('correct'); streak++;
              Sound.play('correct'); celebrate(); updateStreak();
              setTimeout(newChallenge, 800);
            } else {
              btn.classList.add('wrong'); Animator.shake(btn);
              streak = 0; Sound.play('wrong'); updateStreak();
              showToast(`答案是 ${answer}`);
              setTimeout(newChallenge, 1500);
            }
          });
          container.appendChild(btn);
        });
      }
      newChallenge();
    })();
  </script>
</body>
</html>
