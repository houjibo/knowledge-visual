<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>正反比例</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #FF6B35; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* === 模式1: 学习探索 === */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .learn-title { font-size: 22px; font-weight: 700; color: #FF6B35; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.8; text-align: left; }
    .learn-desc .hl { color: #FF6B35; font-weight: 700; }
    .learn-desc .hl-blue { color: #4A90D9; font-weight: 700; }
    .learn-example {
      background: #FFF3E0; border-radius: 12px; padding: 16px;
      margin: 16px 0; text-align: left; font-size: 15px; line-height: 1.8;
    }
    .learn-example .ex-title { font-weight: 700; color: #E65100; margin-bottom: 8px; }
    .learn-table {
      width: 100%; border-collapse: collapse; margin: 12px 0;
      font-size: 16px; text-align: center;
    }
    .learn-table th { background: #FF6B35; color: white; padding: 10px; }
    .learn-table td { padding: 10px; border: 1px solid #E0E0E0; }
    .learn-table tr:nth-child(even) { background: #FFF8F0; }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #FF6B35; color: white; box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* === 模式2: 判断练习 === */
    .judge-area { text-align: center; padding: 24px 16px; }
    .judge-problem {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
      font-size: 18px; color: #1D1D1F; line-height: 1.8;
    }
    .judge-problem .problem-icon { font-size: 48px; margin-bottom: 12px; }
    .judge-problem .problem-text { margin: 12px 0; }
    .judge-options { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
    .judge-opt {
      padding: 16px 32px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 120px;
    }
    .judge-opt:active { transform: scale(0.95); }
    .judge-opt.opt-direct { color: #4A90D9; }
    .judge-opt.opt-inverse { color: #9C27B0; }
    .judge-opt.opt-neither { color: #6E6E73; }
    .judge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); }
    .judge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .judge-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .judge-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* === 模式3: 表格填空 === */
    .table-area { text-align: center; padding: 24px 16px; }
    .table-problem-label { font-size: 18px; font-weight: 600; color: #6E6E73; margin-bottom: 12px; }
    .table-container {
      background: white; border-radius: 20px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .fill-table { width: 100%; border-collapse: collapse; font-size: 18px; }
    .fill-table th { background: #FF6B35; color: white; padding: 12px; }
    .fill-table td {
      padding: 12px; border: 2px solid #E0E0E0; text-align: center;
      font-weight: 600; color: #1D1D1F;
    }
    .fill-table td.empty {
      background: #FFF8F0;
    }
    .fill-input {
      width: 60px; height: 40px; border: 2px solid #FF6B35; border-radius: 8px;
      text-align: center; font-size: 18px; font-weight: 700; color: #FF6B35;
      outline: none;
    }
    .fill-input:focus { border-color: #E65100; box-shadow: 0 0 0 3px rgba(255,107,53,0.2); }
    .table-check-btn {
      margin: 16px 8px; padding: 14px 28px; border: none; background: #FF6B35;
      color: white; border-radius: 14px; font-size: 18px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .table-check-btn:active { transform: scale(0.95); }
    .table-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .table-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* === 模式4: 限时挑战 === */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-start {
      background: white; border-radius: 20px; padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .challenge-start .start-icon { font-size: 64px; margin-bottom: 16px; }
    .challenge-start .start-desc { font-size: 16px; color: #6E6E73; margin: 12px 0; line-height: 1.6; }
    .start-btn {
      padding: 16px 40px; border: none; background: #FF6B35; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin-top: 16px; transition: all 0.2s ease;
    }
    .start-btn:active { transform: scale(0.95); }
    .challenge-active { display: none; }
    .challenge-active.active { display: block; }
    .timer-bar {
      height: 8px; background: #E5E5EA; border-radius: 4px; margin: 16px 0; overflow: hidden;
    }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #FF6B35, #FF3B30); transition: width 1s linear; }
    .ch-question { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; min-height: 60px; }
    .ch-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .ch-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; text-align: center;
    }
    .ch-opt:active { transform: scale(0.95); }
    .ch-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .ch-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .ch-stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; font-size: 18px; font-weight: 600; }
    .ch-correct { color: #34C759; }
    .ch-wrong { color: #FF3B30; }

    /* 通用 */
    .streak-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 700; background: #FFF3E0; color: #FF9500;
    }
    .next-btn {
      padding: 14px 28px; border: none; background: #FF6B35; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(255,107,53,0.3);
    }
    .next-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">正反比例</span>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 学习</button>
      <button class="mode-tab" data-mode="judge">🎯 判断</button>
      <button class="mode-tab" data-mode="table">📊 填表</button>
      <button class="mode-tab" data-mode="challenge">⚡ 挑战</button>
    </div>

    <!-- 模式1: 学习探索 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card" id="learn-card">
          <!-- 动态填充 -->
        </div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="learn-prev">← 上一个</button>
          <button class="learn-btn primary" id="learn-next">下一个 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 判断练习 -->
    <div class="mode-content" id="mode-judge">
      <div class="judge-area">
        <div class="judge-score">
          <span>✅ <span id="judge-correct">0</span></span>
          <span>❌ <span id="judge-wrong">0</span></span>
          <span class="streak-badge">🔥 <span id="judge-streak">0</span></span>
        </div>
        <div class="judge-problem" id="judge-problem">
          <div class="problem-icon">🤔</div>
          <div class="problem-text" id="judge-text">点击开始练习</div>
        </div>
        <div class="judge-options" id="judge-options">
          <button class="judge-opt opt-direct" data-answer="direct">正比例</button>
          <button class="judge-opt opt-inverse" data-answer="inverse">反比例</button>
          <button class="judge-opt opt-neither" data-answer="neither">不成比例</button>
        </div>
        <div class="judge-feedback" id="judge-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 表格填空 -->
    <div class="mode-content" id="mode-table">
      <div class="table-area">
        <div class="table-score">
          <span>✅ <span id="table-correct">0</span></span>
          <span>❌ <span id="table-wrong">0</span></span>
        </div>
        <div class="table-problem-label" id="table-label">正比例关系，填出空格中的数</div>
        <div class="table-container" id="table-container">
          <!-- 动态填充 -->
        </div>
        <button class="table-check-btn" id="table-check">检查答案</button>
        <button class="table-check-btn" id="table-next" style="display:none;background:#6E6E73;">下一题 →</button>
        <div class="table-feedback" id="table-feedback"></div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <div class="challenge-start" id="ch-start">
          <div class="start-icon">⚡</div>
          <div class="learn-title">限时挑战</div>
          <div class="start-desc">60秒内答对尽可能多的题目！<br>混合判断、计算、应用题</div>
          <button class="start-btn" id="btn-start-challenge">开始挑战</button>
        </div>
        <div class="challenge-active" id="ch-active">
          <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
          <div class="ch-stats">
            <span class="ch-correct">✅ <span id="ch-correct">0</span></span>
            <span class="ch-wrong">❌ <span id="ch-wrong">0</span></span>
          </div>
          <div class="ch-question" id="ch-question"></div>
          <div class="ch-options" id="ch-options"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    /* ===== 模式切换 ===== */
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var mode = this.dataset.mode;
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('mode-' + mode).classList.add('active');
      });
    });

    /* ===== 工具函数 ===== */
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function updateStreak(correct, prefix) {
      var el = document.getElementById(prefix + '-streak');
      if (!el) return;
      if (correct) {
        var cur = parseInt(el.textContent) || 0;
        el.textContent = cur + 1;
      } else {
        el.textContent = '0';
      }
    }

    /* ===== 模式1: 学习探索 ===== */
    var learnCards = [
      {
        title: '什么是正比例？',
        desc: '两种相关联的量，如果它们的<span class="hl">比值（商）一定</span>，这两种量就叫做成正比例的量。',
        example: {
          title: '📝 例子：购买苹果',
          content: '单价一定时，买的数量越多，总价越高。<br><br>' +
            '<table class="learn-table"><tr><th>数量(千克)</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>' +
            '<tr><th>总价(元)</th><td>8</td><td>16</td><td>24</td><td>32</td></tr></table>' +
            '总价 ÷ 数量 = <span class="hl">8（单价，一定）</span><br>所以总价和数量成<span class="hl">正比例</span>。'
        }
      },
      {
        title: '正比例的特点',
        desc: '• 两种量<span class="hl">同时扩大或缩小</span><br>• 比值（商）<span class="hl">保持不变</span><br>• 图像是一条<span class="hl-blue">过原点的直线</span>',
        example: {
          title: '🔍 判断方法',
          content: '如果 y ÷ x = k（一定），<br>那么 y 和 x 成<span class="hl">正比例</span>。<br><br>' +
            '例如：路程 ÷ 时间 = 速度（一定）<br>→ 路程和时间成<span class="hl">正比例</span>'
        }
      },
      {
        title: '什么是反比例？',
        desc: '两种相关联的量，如果它们的<span class="hl">乘积一定</span>，这两种量就叫做成反比例的量。',
        example: {
          title: '📝 例子：分糖果',
          content: '糖果总数一定时，每人分得越多，分的人数越少。<br><br>' +
            '<table class="learn-table"><tr><th>每人(颗)</th><td>2</td><td>4</td><td>5</td><td>10</td></tr>' +
            '<tr><th>人数</th><td>20</td><td>10</td><td>8</td><td>4</td></tr></table>' +
            '每人 × 人数 = <span class="hl">40（总数，一定）</span><br>所以每人颗数和人数成<span class="hl">反比例</span>。'
        }
      },
      {
        title: '反比例的特点',
        desc: '• 一种量扩大，另一种量<span class="hl">缩小</span><br>• 乘积<span class="hl">保持不变</span><br>• 图像是一条<span class="hl-blue">曲线</span>',
        example: {
          title: '🔍 判断方法',
          content: '如果 y × x = k（一定），<br>那么 y 和 x 成<span class="hl">反比例</span>。<br><br>' +
            '例如：长 × 宽 = 面积（一定）<br>→ 长和宽成<span class="hl">反比例</span>'
        }
      },
      {
        title: '不成比例的情况',
        desc: '不是所有相关联的量都成比例。<br>如果比值和乘积都<span class="hl">不固定</span>，就不成比例。',
        example: {
          title: '⚠️ 易错点',
          content: '• 年龄和身高：相关联，但<span class="hl">不成比例</span><br>' +
            '• 正方形的边长和面积：不成比例<br>（面积 ÷ 边长 = 边长，不固定）<br><br>' +
            '✅ 关键：看比值或乘积是否<span class="hl">一定</span>！'
        }
      }
    ];
    var learnIdx = 0;

    function renderLearnCard() {
      var card = learnCards[learnIdx];
      var html = '<div class="learn-title">' + card.title + '</div>' +
        '<div class="learn-desc">' + card.desc + '</div>' +
        '<div class="learn-example"><div class="ex-title">' + card.example.title + '</div>' +
        '<div>' + card.example.content + '</div></div>';
      document.getElementById('learn-card').innerHTML = html;
    }

    document.getElementById('learn-prev').addEventListener('click', function() {
      learnIdx = (learnIdx - 1 + learnCards.length) % learnCards.length;
      renderLearnCard();
    });
    document.getElementById('learn-next').addEventListener('click', function() {
      learnIdx = (learnIdx + 1) % learnCards.length;
      renderLearnCard();
    });
    renderLearnCard();

    /* ===== 模式2: 判断练习 ===== */
    var judgeCorrect = 0, judgeWrong = 0;
    var curJudge = null;
    var judgeLocked = false;

    var judgeProblems = [
      { text: '速度一定，路程和时间', answer: 'direct', explain: '路程÷时间=速度（一定），成正比例' },
      { text: '总价一定，单价和数量', answer: 'inverse', explain: '单价×数量=总价（一定），成反比例' },
      { text: '正方形的边长和周长', answer: 'direct', explain: '周长÷边长=4（一定），成正比例' },
      { text: '长方形的面积一定，长和宽', answer: 'inverse', explain: '长×宽=面积（一定），成反比例' },
      { text: '一个人的年龄和身高', answer: 'neither', explain: '比值和乘积都不固定，不成比例' },
      { text: '圆的周长和直径', answer: 'direct', explain: '周长÷直径=π（一定），成正比例' },
      { text: '工作总量一定，工作效率和工作时间', answer: 'inverse', explain: '效率×时间=总量（一定），成反比例' },
      { text: '比例尺一定，图上距离和实际距离', answer: 'direct', explain: '图上÷实际=比例尺（一定），成正比例' },
      { text: '正方形的边长和面积', answer: 'neither', explain: '面积÷边长=边长（不固定），不成比例' },
      { text: '买同一种书，总价和数量', answer: 'direct', explain: '总价÷数量=单价（一定），成正比例' },
      { text: '路程一定，速度和时间', answer: 'inverse', explain: '速度×时间=路程（一定），成反比例' },
      { text: '总页数一定，已看页数和未看页数', answer: 'neither', explain: '和一定，不是比值或乘积一定' },
      { text: '平行四边形面积一定，底和高', answer: 'inverse', explain: '底×高=面积（一定），成反比例' },
      { text: '每千克苹果的价钱一定，买的数量和总价', answer: 'direct', explain: '总价÷数量=单价（一定），成正比例' },
      { text: '修一条路，已修的和未修的', answer: 'neither', explain: '和一定，不成比例' }
    ];

    function nextJudge() {
      curJudge = judgeProblems[randInt(0, judgeProblems.length - 1)];
      document.getElementById('judge-text').textContent = curJudge.text;
      document.getElementById('judge-feedback').textContent = '';
      document.getElementById('judge-feedback').style.color = '';
      judgeLocked = false;
      var opts = document.querySelectorAll('.judge-opt');
      opts.forEach(function(o) { o.classList.remove('correct', 'wrong'); });
    }

    document.querySelectorAll('.judge-opt').forEach(function(opt) {
      opt.addEventListener('click', function() {
        if (judgeLocked) return;
        judgeLocked = true;
        var answer = this.dataset.answer;
        var isCorrect = answer === curJudge.answer;
        if (isCorrect) {
          this.classList.add('correct');
          document.getElementById('judge-feedback').textContent = '✅ 正确！' + curJudge.explain;
          document.getElementById('judge-feedback').style.color = '#34C759';
          judgeCorrect++;
          document.getElementById('judge-correct').textContent = judgeCorrect;
          updateStreak(true, 'judge');
        } else {
          this.classList.add('wrong');
          document.getElementById('judge-feedback').textContent = '❌ 错了，' + curJudge.explain;
          document.getElementById('judge-feedback').style.color = '#FF3B30';
          judgeWrong++;
          document.getElementById('judge-wrong').textContent = judgeWrong;
          updateStreak(false, 'judge');
          // 高亮正确答案
          document.querySelectorAll('.judge-opt').forEach(function(o) {
            if (o.dataset.answer === curJudge.answer) o.classList.add('correct');
          });
        }
        setTimeout(nextJudge, 1500);
      });
    });
    nextJudge();

    /* ===== 模式3: 表格填空 ===== */
    var tableCorrect = 0, tableWrong = 0;
    var curTable = null;
    var tableAnswered = false;

    function genTable() {
      var isDirect = Math.random() > 0.5;
      var k = randInt(2, 10);
      var xs = [];
      var ys = [];
      var emptyIdx = randInt(0, 3);

      if (isDirect) {
        // y = k * x
        for (var i = 0; i < 4; i++) {
          var x = randInt(1, 5) * (i + 1);
          xs.push(x);
          ys.push(k * x);
        }
      } else {
        // x * y = k * 12 (取12的倍数方便整除)
        var product = k * 12;
        var factors = [];
        for (var f = 1; f <= product; f++) {
          if (product % f === 0) factors.push(f);
        }
        factors = shuffle(factors).slice(0, 4).sort(function(a, b) { return a - b; });
        xs = factors;
        ys = factors.map(function(f) { return product / f; });
      }

      return {
        isDirect: isDirect,
        xs: xs,
        ys: ys,
        emptyIdx: emptyIdx,
        answer: isDirect ? ys[emptyIdx] : xs[emptyIdx]
      };
    }

    function renderTable() {
      curTable = genTable();
      tableAnswered = false;
      document.getElementById('table-label').textContent =
        (curTable.isDirect ? '正比例' : '反比例') + '关系，填出空格中的数';

      var html = '<table class="fill-table"><tr><th></th>';
      for (var i = 0; i < 4; i++) {
        html += '<th>' + (curTable.isDirect ? 'x' : 'a') + '</th>';
      }
      html += '</tr><tr><td><b>' + (curTable.isDirect ? 'y' : 'b') + '</b></td>';
      for (var i = 0; i < 4; i++) {
        if (i === curTable.emptyIdx) {
          html += '<td class="empty"><input type="number" class="fill-input" id="fill-input"></td>';
        } else {
          html += '<td>' + (curTable.isDirect ? curTable.ys[i] : curTable.xs[i]) + '</td>';
        }
      }
      html += '</tr>';
      // 显示已知量行
      html += '<tr><td></td>';
      for (var i = 0; i < 4; i++) {
        html += '<td style="font-size:14px;color:#6E6E73;">' +
          (curTable.isDirect ? curTable.xs[i] : curTable.ys[i]) + '</td>';
      }
      html += '</tr></table>';

      document.getElementById('table-container').innerHTML = html;
      document.getElementById('table-feedback').textContent = '';
      document.getElementById('table-check').style.display = '';
      document.getElementById('table-next').style.display = 'none';
      document.getElementById('fill-input').focus();
    }

    document.getElementById('table-check').addEventListener('click', function() {
      if (tableAnswered) return;
      tableAnswered = true;
      var input = document.getElementById('fill-input');
      var userAns = parseInt(input.value);
      var fb = document.getElementById('table-feedback');

      if (userAns === curTable.answer) {
        fb.textContent = '✅ 正确！';
        fb.style.color = '#34C759';
        input.style.borderColor = '#34C759';
        input.style.color = '#34C759';
        tableCorrect++;
        document.getElementById('table-correct').textContent = tableCorrect;
      } else {
        fb.textContent = '❌ 答案是 ' + curTable.answer;
        fb.style.color = '#FF3B30';
        input.style.borderColor = '#FF3B30';
        input.style.color = '#FF3B30';
        input.value = curTable.answer;
        tableWrong++;
        document.getElementById('table-wrong').textContent = tableWrong;
      }
      this.style.display = 'none';
      document.getElementById('table-next').style.display = '';
    });

    document.getElementById('table-next').addEventListener('click', renderTable);
    renderTable();

    /* ===== 模式4: 限时挑战 ===== */
    var chTimer = null;
    var chTimeLeft = 0;
    var chCorrectCount = 0;
    var chWrongCount = 0;
    var chRunning = false;
    var CH_TIME = 60;

    function genChallenge() {
      var type = randInt(0, 4);
      var q, ans, opts;

      switch (type) {
        case 0: // 判断正比例
          var p = judgeProblems[randInt(0, judgeProblems.length - 1)];
          q = '「' + p.text + '」成什么比例？';
          ans = p.answer === 'direct' ? '正比例' : (p.answer === 'inverse' ? '反比例' : '不成比例');
          opts = shuffle(['正比例', '反比例', '不成比例', '无法判断']);
          break;
        case 1: // 正比例计算
          var k1 = randInt(2, 8);
          var x1 = randInt(2, 6);
          var y1 = k1 * x1;
          var x2 = randInt(2, 8);
          q = 'x和y成正比例，x=' + x1 + '时y=' + y1 + '，x=' + x2 + '时y=?';
          ans = k1 * x2;
          opts = [ans, ans + randInt(1, 5), ans - randInt(1, 3), ans * 2];
          opts = shuffle(opts);
          break;
        case 2: // 反比例计算
          var prod = randInt(2, 6) * randInt(2, 6);
          var a1 = randInt(2, 6);
          var b1 = prod / a1;
          if (b1 !== Math.floor(b1)) { a1 = prod / 2; b1 = 2; }
          var a2 = randInt(2, 8);
          while (prod % a2 !== 0) a2++;
          q = 'a和b成反比例，a=' + a1 + '时b=' + b1 + '，a=' + a2 + '时b=?';
          ans = prod / a2;
          opts = [ans, ans + 2, ans - 1, ans + 4];
          opts = shuffle(opts);
          break;
        case 3: // 概念题
          var concepts = [
            { q: '正比例关系中，两种量的（）一定', ans: '比值', opts: ['比值', '乘积', '和', '差'] },
            { q: '反比例关系中，两种量的（）一定', ans: '乘积', opts: ['比值', '乘积', '和', '差'] },
            { q: '正比例的图像是', ans: '过原点的直线', opts: ['过原点的直线', '曲线', '平行线', '折线'] },
            { q: '反比例的图像是', ans: '曲线', opts: ['直线', '曲线', '折线', '点'] }
          ];
          var c = concepts[randInt(0, concepts.length - 1)];
          q = c.q;
          ans = c.ans;
          opts = shuffle(c.opts);
          break;
        default: // 应用题
          var apps = [
            { q: '一辆车2小时行120千米，同样速度5小时行？千米', ans: 300, opts: [300, 240, 360, 200] },
            { q: '8人分48颗糖，同样分法12人分？颗', ans: 72, opts: [72, 64, 96, 48] },
            { q: '铺地用方砖，边长2分米需100块，改边长4分米需？块', ans: 25, opts: [25, 50, 75, 100] }
          ];
          var app = apps[randInt(0, apps.length - 1)];
          q = app.q;
          ans = app.ans;
          opts = shuffle(app.opts);
          break;
      }

      return { question: q, answer: ans, options: opts };
    }

    function startChallenge() {
      chCorrectCount = 0;
      chWrongCount = 0;
      chRunning = true;
      chTimeLeft = CH_TIME;
      document.getElementById('ch-correct').textContent = 0;
      document.getElementById('ch-wrong').textContent = 0;
      document.getElementById('ch-start').style.display = 'none';
      document.getElementById('ch-active').classList.add('active');
      nextChallenge();

      if (chTimer) clearInterval(chTimer);
      chTimer = setInterval(function() {
        chTimeLeft--;
        var pct = (chTimeLeft / CH_TIME) * 100;
        document.getElementById('timer-fill').style.width = pct + '%';
        if (chTimeLeft <= 0) {
          clearInterval(chTimer);
          chRunning = false;
          document.getElementById('ch-question').textContent =
            '⏰ 时间到！答对 ' + chCorrectCount + ' 题';
          document.getElementById('ch-options').innerHTML =
            '<button class="ch-opt" id="ch-restart" style="grid-column:span 2">🔄 再来一次</button>';
          document.getElementById('ch-restart').addEventListener('click', function() {
            document.getElementById('ch-active').classList.remove('active');
            document.getElementById('ch-start').style.display = '';
            document.getElementById('timer-fill').style.width = '100%';
          });
        }
      }, 1000);
    }

    var curCh = null;
    function nextChallenge() {
      curCh = genChallenge();
      document.getElementById('ch-question').textContent = curCh.question;
      var optsEl = document.getElementById('ch-options');
      optsEl.innerHTML = '';
      curCh.options.forEach(function(opt) {
        var btn = document.createElement('button');
        btn.className = 'ch-opt';
        btn.textContent = opt;
        btn.addEventListener('click', function() {
          if (!chRunning) return;
          var isCorrect = String(opt) === String(curCh.answer);
          if (isCorrect) {
            btn.classList.add('correct');
            chCorrectCount++;
            document.getElementById('ch-correct').textContent = chCorrectCount;
          } else {
            btn.classList.add('wrong');
            chWrongCount++;
            document.getElementById('ch-wrong').textContent = chWrongCount;
            // 高亮正确答案
            var btns = optsEl.querySelectorAll('.ch-opt');
            btns.forEach(function(b) {
              if (String(b.textContent) === String(curCh.answer)) b.classList.add('correct');
            });
          }
          var btns = optsEl.querySelectorAll('.ch-opt');
          btns.forEach(function(b) { b.style.pointerEvents = 'none'; });
          setTimeout(function() { if (chRunning) nextChallenge(); }, 1500);
        });
        optsEl.appendChild(btn);
      });
    }

    document.getElementById('btn-start-challenge').addEventListener('click', startChallenge);

  })();
  </script>
