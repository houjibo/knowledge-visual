<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>乘法的初步认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E53935; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }

    /* 模式1: 认识乘法 */
    .learn-area { text-align: center; padding: 20px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 420px;
    }
    .learn-emoji { font-size: 48px; margin: 12px 0; letter-spacing: 4px; }
    .learn-title { font-size: 22px; font-weight: 700; color: #E53935; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.7; text-align: left; }
    .learn-highlight {
      background: #FFF3E0; border-radius: 12px; padding: 16px; margin: 16px 0;
      border-left: 4px solid #FF9800; text-align: left;
    }
    .learn-highlight .formula { font-size: 24px; font-weight: 800; color: #E53935; }
    .learn-highlight .words { font-size: 16px; color: #E65100; margin-top: 4px; }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #E53935; color: white; }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }
    .learn-page { font-size: 14px; color: #6E6E73; text-align: center; margin-top: 8px; }

    /* 模式2: 看图列式 */
    .picture-area { text-align: center; padding: 20px 16px; }
    .pic-visual {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 420px;
    }
    .pic-question { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 12px 0; }
    .pic-groups {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
    }
    .pic-group {
      background: #FFF8E1; border-radius: 14px; padding: 12px 16px;
      border: 2px dashed #FFB74D; min-width: 70px; text-align: center;
    }
    .pic-group .items { font-size: 28px; letter-spacing: 2px; }
    .pic-group .label { font-size: 13px; color: #6E6E73; margin-top: 4px; }
    .pic-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .pic-opt {
      padding: 14px 20px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F; min-width: 120px;
    }
    .pic-opt:active { transform: scale(0.9); }
    .pic-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .pic-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .pic-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }

    /* 模式3: 加法转乘法 */
    .convert-area { text-align: center; padding: 20px 16px; }
    .convert-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 420px;
    }
    .convert-addition {
      font-size: 32px; font-weight: 800; color: #1D1D1F; margin: 16px 0;
      letter-spacing: 2px;
    }
    .convert-arrow-icon { font-size: 36px; color: #E53935; margin: 8px 0; }
    .convert-hint { font-size: 15px; color: #6E6E73; margin: 8px 0; }
    .convert-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .convert-opt {
      padding: 14px 20px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .convert-opt:active { transform: scale(0.9); }
    .convert-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .convert-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .convert-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }

    /* 模式4: 看乘法写加法 */
    .reverse-area { text-align: center; padding: 20px 16px; }
    .reverse-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 420px;
    }
    .reverse-multiply {
      font-size: 36px; font-weight: 800; color: #E53935; margin: 16px 0;
    }
    .reverse-hint { font-size: 15px; color: #6E6E73; margin: 8px 0; }
    .reverse-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .reverse-opt {
      padding: 14px 18px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F; text-align: left; line-height: 1.5;
    }
    .reverse-opt:active { transform: scale(0.9); }
    .reverse-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .reverse-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .reverse-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }

    /* 通用 */
    .next-btn {
      display: block; margin: 12px auto; padding: 12px 28px; border: none;
      background: #E53935; color: white; border-radius: 12px; font-size: 17px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回" onclick="location.href='../../index.html'">←</button>
      <span class="nav-title">✖️ 乘法的初步认识</span>
      <div style="width:56px"></div>
    </nav>

    <div class="score-display">
      <span>⭐ 连续答对: <strong id="streak">0</strong></span>
      <span>🏆 最高: <strong id="best">0</strong></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 认识乘法</button>
      <button class="mode-tab" data-mode="picture">🖼️ 看图列式</button>
      <button class="mode-tab" data-mode="convert">➕ 加法转乘法</button>
      <button class="mode-tab" data-mode="reverse">✖️ 乘法写加法</button>
    </div>

    <!-- 模式1: 认识乘法 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="section-title">📖 什么是乘法？</div>
        <div class="section-desc">乘法就是求几个相同加数的和的简便运算</div>
        <div class="learn-card" id="learn-card">
          <!-- JS 动态填充 -->
        </div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="learn-prev">← 上一页</button>
          <button class="learn-btn primary" id="learn-next">下一页 →</button>
        </div>
        <div class="learn-page" id="learn-page"></div>
      </div>
    </div>

    <!-- 模式2: 看图列式 -->
    <div class="mode-content" id="mode-picture">
      <div class="picture-area">
        <div class="section-title">🖼️ 看图列乘法算式</div>
        <div class="section-desc">看看有几组，每组几个</div>
        <div class="score-bar">
          <span>✅ <span id="pic-correct">0</span></span>
          <span>❌ <span id="pic-wrong">0</span></span>
        </div>
        <div class="pic-visual" id="pic-visual">
          <div class="pic-question" id="pic-question"></div>
          <div class="pic-groups" id="pic-groups"></div>
        </div>
        <div class="pic-options" id="pic-options"></div>
        <div class="pic-feedback" id="pic-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 加法转乘法 -->
    <div class="mode-content" id="mode-convert">
      <div class="convert-area">
        <div class="section-title">➕ 把加法改成乘法</div>
        <div class="section-desc">相同的加数相加，可以写成乘法</div>
        <div class="score-bar">
          <span>✅ <span id="conv-correct">0</span></span>
          <span>❌ <span id="conv-wrong">0</span></span>
        </div>
        <div class="convert-card">
          <div class="convert-addition" id="conv-addition"></div>
          <div class="convert-arrow-icon">⬇️</div>
          <div class="convert-hint" id="conv-hint"></div>
          <div class="convert-options" id="conv-options"></div>
          <div class="convert-feedback" id="conv-feedback"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 看乘法写加法 -->
    <div class="mode-content" id="mode-reverse">
      <div class="reverse-area">
        <div class="section-title">✖️ 乘法展开成加法</div>
        <div class="section-desc">乘法算式可以写成几个相同加数相加</div>
        <div class="score-bar">
          <span>✅ <span id="rev-correct">0</span></span>
          <span>❌ <span id="rev-wrong">0</span></span>
        </div>
        <div class="reverse-card">
          <div class="reverse-multiply" id="rev-multiply"></div>
          <div class="reverse-hint" id="rev-hint"></div>
          <div class="reverse-options" id="rev-options"></div>
          <div class="reverse-feedback" id="rev-feedback"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== 模式切换 ==========
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('mode-' + this.dataset.mode).classList.add('active');
      });
    });

    // ========== 连续答对 ==========
    let streak = 0, best = 0;
    function updateStreak(correct) {
      if (correct) { streak++; if (streak > best) best = streak; }
      else { streak = 0; }
      document.getElementById('streak').textContent = streak;
      document.getElementById('best').textContent = best;
    }

    // ========== 模式1: 认识乘法（翻页学习） ==========
    const learnPages = [
      {
        title: '🤔 相同加数相加',
        emoji: '🍎🍎🍎 🍎🍎🍎',
        desc: '看看这些苹果：有 <b>2 盘</b>，每盘 <b>3 个</b>。<br><br>用加法算：<br><b>3 + 3 = 6</b><br><br>这是 <b>2 个 3</b> 相加。',
        highlight: null
      },
      {
        title: '✨ 乘法来啦！',
        emoji: '🍎🍎🍎 🍎🍎🍎',
        desc: '求 <b>几个相同加数的和</b>，可以用乘法！<br><br>2 个 3 相加 → <b>2 × 3 = 6</b><br>读作：<b>二乘三等于六</b>',
        highlight: { formula: '2 × 3 = 6', words: '读作：二乘三等于六' }
      },
      {
        title: '📝 认识乘号',
        emoji: '✖️',
        desc: '乘号 <b>×</b> 表示"几个相同的数相加"。<br><br>在算式 <b>2 × 3 = 6</b> 中：<br>• <b>2</b> 是相同加数的个数（有几份）<br>• <b>3</b> 是相同的加数（每份几个）<br>• <b>6</b> 是积（一共多少）',
        highlight: { formula: '个数 × 每份 = 一共', words: '份数 × 每份数 = 总数' }
      },
      {
        title: '🔄 加法和乘法互换',
        emoji: '🍊🍊 🍊🍊 🍊🍊 🍊🍊',
        desc: '同样的意思，加法和乘法可以互相转换：<br><br><b>加法：</b>2 + 2 + 2 + 2 = 8<br><b>乘法：</b>4 × 2 = 8<br><br>4 个 2 相加，用乘法更简便！',
        highlight: { formula: '4 × 2 = 8', words: '比 2+2+2+2 简便多啦！' }
      },
      {
        title: '🎯 什么时候用乘法？',
        emoji: '🎁',
        desc: '当你看到这样的关键词，就用乘法：<br><br>• "每份一样多"<br>• "几个几"<br>• "每排几个，有几排"<br>• "每组几个，有几组"<br><br>记住：乘法就是 <b>求几个相同加数的和</b> 的简便运算！',
        highlight: { formula: '几个几 → 乘法', words: '相同加数 × 个数 = 和' }
      },
      {
        title: '🌟 你学会啦！',
        emoji: '🎉',
        desc: '恭喜你认识了乘法！<br><br>去试试其他模式吧：<br><br>🖼️ <b>看图列式</b> — 看图写乘法算式<br>➕ <b>加法转乘法</b> — 把加法改成乘法<br>✖️ <b>乘法写加法</b> — 把乘法展开成加法',
        highlight: null
      }
    ];
    let learnPage = 0;

    function showLearnPage(idx) {
      const page = learnPages[idx];
      const card = document.getElementById('learn-card');
      let html = `<div class="learn-emoji">${page.emoji}</div>`;
      html += `<div class="learn-title">${page.title}</div>`;
      html += `<div class="learn-desc">${page.desc}</div>`;
      if (page.highlight) {
        html += `<div class="learn-highlight">
          <div class="formula">${page.highlight.formula}</div>
          <div class="words">${page.highlight.words}</div>
        </div>`;
      }
      card.innerHTML = html;
      document.getElementById('learn-page').textContent = `${idx + 1} / ${learnPages.length}`;
      document.getElementById('learn-prev').disabled = idx === 0;
      document.getElementById('learn-next').textContent = idx === learnPages.length - 1 ? '🎉 完成' : '下一页 →';
    }

    document.getElementById('learn-prev').addEventListener('click', function() {
      if (learnPage > 0) { learnPage--; showLearnPage(learnPage); }
    });
    document.getElementById('learn-next').addEventListener('click', function() {
      if (learnPage < learnPages.length - 1) { learnPage++; showLearnPage(learnPage); }
    });
    showLearnPage(0);

    // ========== 模式2: 看图列式 ==========
    let picCorrect = 0, picWrong = 0;
    let currentPicAnswer = '';

    function nextPic() {
      const groups = Math.floor(Math.random() * 4) + 2; // 2-5 组
      const perGroup = Math.floor(Math.random() * 5) + 1; // 1-5 个/组
      const total = groups * perGroup;
      currentPicAnswer = `${groups} × ${perGroup} = ${total}`;

      const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '⭐', '🌸'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      document.getElementById('pic-question').textContent = `有 ${groups} 组，每组 ${perGroup} 个，一共多少个？`;

      const groupsContainer = document.getElementById('pic-groups');
      groupsContainer.innerHTML = '';
      for (let i = 0; i < groups; i++) {
        const group = document.createElement('div');
        group.className = 'pic-group';
        group.innerHTML = `<div class="items">${emoji.repeat(perGroup)}</div><div class="label">第${i+1}组</div>`;
        groupsContainer.appendChild(group);
      }

      // 生成选项
      const options = new Set([currentPicAnswer]);
      // 干扰项
      const wrongs = [
        `${perGroup} × ${groups} = ${total}`,  // 交换
        `${groups} + ${perGroup} = ${groups + perGroup}`,  // 加法
        `${groups} × ${perGroup} = ${total + Math.floor(Math.random()*3)+1}`,  // 错误积
        `${groups + 1} × ${perGroup} = ${(groups+1)*perGroup}`,  // 组数错
      ];
      wrongs.forEach(w => { if (w !== currentPicAnswer && options.size < 4) options.add(w); });
      while (options.size < 4) {
        const fakeG = groups + Math.floor(Math.random()*3) - 1;
        const fakeP = perGroup + Math.floor(Math.random()*3) - 1;
        if (fakeG > 0 && fakeP > 0) {
          const w = `${fakeG} × ${fakeP} = ${fakeG*fakeP}`;
          if (w !== currentPicAnswer) options.add(w);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('pic-options');
      optionsContainer.innerHTML = '';
      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'pic-opt';
        btn.textContent = opt;
        btn.dataset.value = opt;
        optionsContainer.appendChild(btn);
      });

      document.getElementById('pic-feedback').textContent = '';
      document.querySelectorAll('.pic-opt').forEach(o => {
        o.classList.remove('correct', 'wrong');
        o.disabled = false;
      });
    }

    document.getElementById('pic-options').addEventListener('click', function(e) {
      if (e.target.classList.contains('pic-opt')) {
        const value = e.target.dataset.value;
        const isCorrect = value === currentPicAnswer;

        document.querySelectorAll('.pic-opt').forEach(o => o.disabled = true);

        if (isCorrect) {
          e.target.classList.add('correct');
          document.getElementById('pic-feedback').textContent = '✅ 答对了！';
          document.getElementById('pic-feedback').style.color = '#34C759';
          picCorrect++;
        } else {
          e.target.classList.add('wrong');
          document.getElementById('pic-feedback').textContent = `❌ 正确答案是 ${currentPicAnswer}`;
          document.getElementById('pic-feedback').style.color = '#FF3B30';
          picWrong++;
          // 高亮正确选项
          document.querySelectorAll('.pic-opt').forEach(o => {
            if (o.dataset.value === currentPicAnswer) o.classList.add('correct');
          });
        }

        updateStreak(isCorrect);
        document.getElementById('pic-correct').textContent = picCorrect;
        document.getElementById('pic-wrong').textContent = picWrong;

        setTimeout(nextPic, 1500);
      }
    });

    // ========== 模式3: 加法转乘法 ==========
    let convCorrect = 0, convWrong = 0;
    let currentConvAnswer = '';

    function nextConv() {
      const addend = Math.floor(Math.random() * 6) + 1; // 1-6
      const count = Math.floor(Math.random() * 5) + 2; // 2-6 个
      const total = addend * count;

      const addition = Array(count).fill(addend).join(' + ');
      currentConvAnswer = `${count} × ${addend} = ${total}`;

      document.getElementById('conv-addition').textContent = addition + ' = ?';
      document.getElementById('conv-hint').textContent = `${count} 个 ${addend} 相加`;

      // 生成选项
      const options = new Set([currentConvAnswer]);
      const wrongs = [
        `${addend} × ${count} = ${total}`,
        `${count} + ${addend} = ${count + addend}`,
        `${count} × ${addend} = ${total + 1}`,
        `${count - 1} × ${addend} = ${(count-1)*addend}`,
        `${count} × ${addend + 1} = ${count*(addend+1)}`,
      ];
      wrongs.forEach(w => { if (w !== currentConvAnswer && options.size < 4) options.add(w); });
      while (options.size < 4) {
        const fa = addend + Math.floor(Math.random()*3) - 1;
        const fc = count + Math.floor(Math.random()*3) - 1;
        if (fa > 0 && fc > 1) {
          const w = `${fc} × ${fa} = ${fc*fa}`;
          if (w !== currentConvAnswer) options.add(w);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('conv-options');
      optionsContainer.innerHTML = '';
      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'convert-opt';
        btn.textContent = opt;
        btn.dataset.value = opt;
        optionsContainer.appendChild(btn);
      });

      document.getElementById('conv-feedback').textContent = '';
      document.querySelectorAll('.convert-opt').forEach(o => {
        o.classList.remove('correct', 'wrong');
        o.disabled = false;
      });
    }

    document.getElementById('conv-options').addEventListener('click', function(e) {
      if (e.target.classList.contains('convert-opt')) {
        const value = e.target.dataset.value;
        const isCorrect = value === currentConvAnswer;

        document.querySelectorAll('.convert-opt').forEach(o => o.disabled = true);

        if (isCorrect) {
          e.target.classList.add('correct');
          document.getElementById('conv-feedback').textContent = '✅ 答对了！乘法更简便！';
          document.getElementById('conv-feedback').style.color = '#34C759';
          convCorrect++;
        } else {
          e.target.classList.add('wrong');
          document.getElementById('conv-feedback').textContent = `❌ 正确答案是 ${currentConvAnswer}`;
          document.getElementById('conv-feedback').style.color = '#FF3B30';
          convWrong++;
          document.querySelectorAll('.convert-opt').forEach(o => {
            if (o.dataset.value === currentConvAnswer) o.classList.add('correct');
          });
        }

        updateStreak(isCorrect);
        document.getElementById('conv-correct').textContent = convCorrect;
        document.getElementById('conv-wrong').textContent = convWrong;

        setTimeout(nextConv, 1500);
      }
    });

    // ========== 模式4: 看乘法写加法 ==========
    let revCorrect = 0, revWrong = 0;
    let currentRevAnswer = '';

    function nextRev() {
      const a = Math.floor(Math.random() * 6) + 1; // 1-6
      const b = Math.floor(Math.random() * 5) + 2; // 2-6
      const total = a * b;

      const multiplyStr = `${b} × ${a} = ${total}`;
      const additionStr = Array(b).fill(a).join(' + ') + ` = ${total}`;
      currentRevAnswer = additionStr;

      document.getElementById('rev-multiply').textContent = multiplyStr;
      document.getElementById('rev-hint').textContent = `把乘法展开成加法：${b} 个 ${a} 相加`;

      // 生成选项
      const options = new Set([additionStr]);
      const wrongs = [
        Array(a).fill(b).join(' + ') + ` = ${total}`,  // 交换
        Array(b).fill(a).join(' + ') + ` = ${total + 1}`,  // 错误和
        Array(b - 1).fill(a).join(' + ') + ` = ${(b-1)*a}`,  // 少一个
        Array(b + 1).fill(a).join(' + ') + ` = ${(b+1)*a}`,  // 多一个
        Array(b).fill(a + 1).join(' + ') + ` = ${b*(a+1)}`,  // 加数错
      ];
      wrongs.forEach(w => { if (w !== additionStr && options.size < 4) options.add(w); });
      while (options.size < 4) {
        const fa = a + Math.floor(Math.random()*3) - 1;
        const fb = b + Math.floor(Math.random()*3) - 1;
        if (fa > 0 && fb > 1) {
          const w = Array(fb).fill(fa).join(' + ') + ` = ${fb*fa}`;
          if (w !== additionStr) options.add(w);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('rev-options');
      optionsContainer.innerHTML = '';
      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'reverse-opt';
        btn.textContent = opt;
        btn.dataset.value = opt;
        optionsContainer.appendChild(btn);
      });

      document.getElementById('rev-feedback').textContent = '';
      document.querySelectorAll('.reverse-opt').forEach(o => {
        o.classList.remove('correct', 'wrong');
        o.disabled = false;
      });
    }

    document.getElementById('rev-options').addEventListener('click', function(e) {
      if (e.target.classList.contains('reverse-opt')) {
        const value = e.target.dataset.value;
        const isCorrect = value === currentRevAnswer;

        document.querySelectorAll('.reverse-opt').forEach(o => o.disabled = true);

        if (isCorrect) {
          e.target.classList.add('correct');
          document.getElementById('rev-feedback').textContent = '✅ 答对了！';
          document.getElementById('rev-feedback').style.color = '#34C759';
          revCorrect++;
        } else {
          e.target.classList.add('wrong');
          document.getElementById('rev-feedback').textContent = `❌ 正确答案是 ${currentRevAnswer}`;
          document.getElementById('rev-feedback').style.color = '#FF3B30';
          revWrong++;
          document.querySelectorAll('.reverse-opt').forEach(o => {
            if (o.dataset.value === currentRevAnswer) o.classList.add('correct');
          });
        }

        updateStreak(isCorrect);
        document.getElementById('rev-correct').textContent = revCorrect;
        document.getElementById('rev-wrong').textContent = revWrong;

        setTimeout(nextRev, 1500);
      }
    });

    // 初始化
    nextPic();
    nextConv();
    nextRev();
  </script>
</body>
</html>
