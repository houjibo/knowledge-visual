<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>位置与顺序</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #1565C0; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 认识位置 */
    .scene-area { text-align: center; padding: 16px; }
    .scene-box {
      position: relative; width: 300px; height: 300px; margin: 16px auto;
      background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 100%);
      border-radius: 20px; border: 3px solid #90CAF9; overflow: hidden;
    }
    .scene-item {
      position: absolute; font-size: 40px; transition: all 0.3s ease;
      cursor: pointer; user-select: none;
    }
    .scene-item:active { transform: scale(1.2); }
    .scene-label {
      position: absolute; font-size: 12px; font-weight: 600; color: #1565C0;
      background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
    }
    .scene-question {
      font-size: 20px; font-weight: 700; color: #1565C0; margin: 16px 0;
      background: white; display: inline-block; padding: 12px 24px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .scene-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0;
    }
    .scene-opt {
      padding: 14px 24px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .scene-opt:active { transform: scale(0.9); }
    .scene-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .scene-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式2: 排队问题 */
    .queue-area { text-align: center; padding: 16px; }
    .queue-box {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 20px auto; padding: 16px; background: white; border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow-x: auto;
      -webkit-overflow-scrolling: touch; min-height: 100px;
    }
    .queue-person {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex-shrink: 0; cursor: pointer; transition: all 0.2s ease;
    }
    .queue-person:active { transform: scale(0.9); }
    .queue-person .emoji { font-size: 40px; }
    .queue-person .label {
      font-size: 12px; font-weight: 600; color: #6E6E73;
      background: #F0F0F0; padding: 2px 8px; border-radius: 8px;
    }
    .queue-person.highlight .label {
      background: #1565C0; color: white;
    }
    .queue-person.selected { transform: scale(1.15); }
    .queue-person.selected .emoji { filter: drop-shadow(0 2px 4px rgba(21,101,192,0.4)); }
    .queue-arrow { font-size: 24px; color: #1565C0; flex-shrink: 0; }
    .queue-question {
      font-size: 20px; font-weight: 700; color: #1565C0; margin: 16px 0;
      background: white; display: inline-block; padding: 12px 24px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .queue-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0;
    }
    .queue-opt {
      width: 56px; height: 56px; border: 3px solid #E0E0E0; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .queue-opt:active { transform: scale(0.9); }
    .queue-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .queue-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式3: 涂色/摆放 */
    .place-area { text-align: center; padding: 16px; }
    .place-grid {
      display: grid; gap: 4px; margin: 16px auto;
      max-width: 280px; background: #E0E0E0; padding: 4px; border-radius: 16px;
    }
    .place-cell {
      aspect-ratio: 1; background: white; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; cursor: pointer; transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .place-cell:active { transform: scale(0.9); }
    .place-cell.target { border-color: #1565C0; background: #E3F2FD; }
    .place-cell.placed { background: #BBDEFB; }
    .place-cell.correct-place { background: rgba(52,199,89,0.2); border-color: #34C759; }
    .place-cell.wrong-place { background: rgba(255,59,48,0.15); border-color: #FF3B30; }
    .place-instruction {
      font-size: 18px; font-weight: 600; color: #1565C0; margin: 12px 0;
      background: white; display: inline-block; padding: 10px 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .place-palette {
      display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap;
    }
    .palette-item {
      width: 56px; height: 56px; border: 3px solid #E0E0E0; background: white;
      border-radius: 14px; font-size: 28px; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .palette-item:active { transform: scale(0.9); }
    .palette-item.selected { border-color: #1565C0; background: #E3F2FD; transform: scale(1.1); }

    /* 模式4: 挑战模式 */
    .challenge-area { text-align: center; padding: 16px; }
    .timer-bar {
      height: 12px; background: #E5E5EA; border-radius: 6px; margin: 12px 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%; background: linear-gradient(90deg, #34C759, #1565C0);
      border-radius: 6px; transition: width 1s linear;
    }
    .timer-fill.warning { background: linear-gradient(90deg, #FF9500, #FF3B30); }
    .timer-text { font-size: 18px; font-weight: 700; color: #1565C0; }
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; font-weight: 600; }
    .ch-scene {
      position: relative; width: 260px; height: 200px; margin: 12px auto;
      background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 100%);
      border-radius: 16px; border: 3px solid #90CAF9; overflow: hidden;
    }
    .ch-item { position: absolute; font-size: 36px; }
    .ch-question { font-size: 18px; font-weight: 700; color: #1565C0; margin: 12px 0; }
    .ch-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0;
    }
    .ch-opt {
      padding: 12px 20px; border: 3px solid #E0E0E0; background: white;
      border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .ch-opt:active { transform: scale(0.9); }
    .ch-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .ch-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    .next-btn {
      display: block; margin: 16px auto; padding: 14px 32px; border: none;
      background: #1565C0; color: white; border-radius: 12px; font-size: 18px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">📍 位置与顺序</span>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="scene">🏠 看场景</button>

      <button class="mode-tab" data-mode="place">🎨 摆一摆</button>

    <div class="mode-content active" data-mode="scene">

    <!-- 模式2: 排队问题 -->
    <div class="mode-content" data-mode="queue">
      <div class="section-title">🧑‍🤝‍🧑 排队问题</div>
      <div class="section-desc">小朋友们排排队，回答关于顺序的问题</div>
      <div class="score-bar">

        <span>📝 第 <span id="queue-num">1</span> 题</span>
      </div>
      <div class="queue-area">
        <div class="queue-box" id="queue-box"></div>
        <div class="queue-question" id="queue-question">准备好了吗？</div>
        <div class="queue-options" id="queue-options"></div>
        <div class="result-text" id="queue-result"></div>
      </div>
    </div>

    <!-- 模式3: 摆一摆 -->
    <div class="mode-content" data-mode="place">
      <div class="section-title">🎨 摆一摆</div>
      <div class="section-desc">按照指令，把物品放到正确的位置</div>
      <div class="score-bar">
        <span>⭐ 得分：<span id="place-score">0</span></span>
        <span>📝 第 <span id="place-num">1</span> 题</span>
      </div>
      <div class="place-area">
        <div class="place-instruction" id="place-instruction">把苹果放到格子里</div>
        <div class="place-grid" id="place-grid"></div>
        <div class="place-palette" id="place-palette"></div>
        <div class="result-text" id="place-result"></div>
      </div>
    </div>

    <!-- 模式4: 挑战模式 -->
    <div class="mode-content" data-mode="challenge">
      <div class="section-title">🏆 限时挑战</div>
      <div class="section-desc">60秒内尽可能多答对！</div>
      <div class="challenge-area">
        <div class="timer-bar"><div class="timer-fill" id="ch-timer-fill"></div></div>
        <div class="timer-text">⏱️ <span id="ch-timer">60</span>秒</div>
        <div class="challenge-score">
          <span>✅ <span id="ch-correct">0</span></span>
          <span>❌ <span id="ch-wrong">0</span></span>
        </div>
        <div class="ch-scene" id="ch-scene"></div>
        <div class="ch-question" id="ch-question">点击开始！</div>
        <div class="ch-options" id="ch-options">
          <button class="ch-opt" id="ch-start-btn" style="padding:14px 32px;font-size:20px;">🚀 开始挑战</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // ===== 模式切换 =====
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const mode = tab.dataset.mode;
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`.mode-content[data-mode="${mode}"]`).classList.add('active');
      });
    });

    // ===== 工具函数 =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // ===== 动物/物品素材 =====
    const ANIMALS = ['🐱', '🐶', '🐰', '🐻', '🐼', '🦊', '🐸', '🐵', '🐷', '🐮', '🐔', '🐦'];
    const FRUITS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🥝', '🍌', '🍉'];
    const PEOPLE = ['👦', '👧', '👨', '👩', '👴', '👵', '🧒', '👶'];

    // ===== 模式1: 看场景 =====
    let sceneScore = 0, sceneNum = 1;

    const POSITION_WORDS = ['上', '下', '前', '后', '左', '右'];

    function generateScene() {
      const box = document.getElementById('scene-box');
      box.innerHTML = '';
      document.getElementById('scene-result').textContent = '';
      document.getElementById('scene-num').textContent = sceneNum;

      // Place 3-4 items in the scene
      const count = randInt(3, 4);
      const items = shuffle(ANIMALS).slice(0, count);
      const positions = [];

      // Define grid positions: top-left, top-right, bottom-left, bottom-right, center
      const slots = [
        { x: 30, y: 20, label: '左上' },
        { x: 200, y: 20, label: '右上' },
        { x: 30, y: 200, label: '左下' },
        { x: 200, y: 200, label: '右下' },
        { x: 115, y: 110, label: '中间' },
        { x: 30, y: 110, label: '左中' },
        { x: 200, y: 110, label: '右中' },
        { x: 115, y: 20, label: '上中' },
        { x: 115, y: 200, label: '下中' }
      ];

      const chosenSlots = shuffle(slots).slice(0, count);

      items.forEach((item, i) => {
        const el = document.createElement('span');
        el.className = 'scene-item';
        el.textContent = item;
        el.style.left = chosenSlots[i].x + 'px';
        el.style.top = chosenSlots[i].y + 'px';
        box.appendChild(el);
        positions.push({ emoji: item, slot: chosenSlots[i] });
      });

      // Generate question about relative position
      const questionTypes = ['updown', 'leftright', 'which_side'];
      const qType = pick(questionTypes);

      let question, options, answer;

      if (qType === 'updown' && positions.length >= 2) {
        const topItem = positions.reduce((a, b) => a.slot.y < b.slot.y ? a : b);
        const bottomItem = positions.reduce((a, b) => a.slot.y > b.slot.y ? a : b);
        if (topItem.emoji !== bottomItem.emoji) {
          question = `${topItem.emoji} 在 ${bottomItem.emoji} 的哪边？`;
          options = shuffle(['上面', '下面', '左面', '右面']);
          answer = '上面';
        } else {
          return generateScene();
        }
      } else if (qType === 'leftright' && positions.length >= 2) {
        const leftItem = positions.reduce((a, b) => a.slot.x < b.slot.x ? a : b);
        const rightItem = positions.reduce((a, b) => a.slot.x > b.slot.x ? a : b);
        if (leftItem.emoji !== rightItem.emoji) {
          question = `${leftItem.emoji} 在 ${rightItem.emoji} 的哪边？`;
          options = shuffle(['上面', '下面', '左面', '右面']);
          answer = '左面';
        } else {
          return generateScene();
        }
      } else {
        // "X的X边是什么？"
        const ref = pick(positions);
        const others = positions.filter(p => p.emoji !== ref.emoji);
        if (others.length === 0) return generateScene();
        const target = pick(others);
        let direction;
        if (target.slot.y < ref.slot.y) direction = '上面';
        else if (target.slot.y > ref.slot.y) direction = '下面';
        else if (target.slot.x < ref.slot.x) direction = '左面';
        else direction = '右面';

        question = `${ref.emoji} 的 ${direction.replace('面', '')} 是哪个？`;
        const wrongOptions = shuffle(others.filter(p => p.emoji !== target.emoji)).slice(0, 3).map(p => p.emoji);
        options = shuffle([target.emoji, ...wrongOptions]);
        answer = target.emoji;
      }

      document.getElementById('scene-question').textContent = question;
      const optionsDiv = document.getElementById('scene-options');
      optionsDiv.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'scene-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleSceneAnswer(btn, opt, answer));
        optionsDiv.appendChild(btn);
      });
    }

    function handleSceneAnswer(btn, selected, answer) {
      const isCorrect = selected === answer;
      document.querySelectorAll('.scene-opt').forEach(b => {
        b.disabled = true;
        if (b.textContent === answer) b.classList.add('correct');
      });
      if (!isCorrect) btn.classList.add('wrong');

      if (isCorrect) {
        sceneScore++;
        document.getElementById('scene-result').textContent = '✅ 正确！太棒了！';
        document.getElementById('scene-result').style.color = '#34C759';
      } else {
        document.getElementById('scene-result').textContent = `❌ 正确答案是：${answer}`;
        document.getElementById('scene-result').style.color = '#FF3B30';
      }
      document.getElementById('scene-score').textContent = sceneScore;
      sceneNum++;
      setTimeout(generateScene, 1500);
    }

    // ===== 模式2: 排队问题 =====
    let queueScore = 0, queueNum = 1;

    function generateQueue() {
      const box = document.getElementById('queue-box');
      box.innerHTML = '';
      document.getElementById('queue-result').textContent = '';
      document.getElementById('queue-num').textContent = queueNum;

      const count = randInt(4, 6);
      const people = shuffle(PEOPLE).slice(0, count);
      const names = [];
      for (let i = 0; i < count; i++) {
        names.push('第' + (i + 1) + '个');
      }

      people.forEach((p, i) => {
        if (i > 0) {
          const arrow = document.createElement('span');
          arrow.className = 'queue-arrow';
          arrow.textContent = '→';
          box.appendChild(arrow);
        }
        const div = document.createElement('div');
        div.className = 'queue-person';
        div.innerHTML = `<span class="emoji">${p}</span><span class="label">${names[i]}</span>`;
        div.dataset.index = i;
        box.appendChild(div);
      });

      // Generate question
      const questionTypes = ['which_pos', 'who_is_at', 'how_many_between', 'before_after'];
      const qType = pick(questionTypes);

      let question, options, answer;

      if (qType === 'which_pos') {
        // "X排在第几个？"
        const idx = randInt(0, count - 1);
        question = `${people[idx]} 排在第几个？`;
        const correctAnswer = idx + 1;
        const opts = new Set([correctAnswer]);
        while (opts.size < Math.min(4, count)) {
          opts.add(randInt(1, count));
        }
        options = shuffle([...opts]).map(String);
        answer = String(correctAnswer);
      } else if (qType === 'who_is_at') {
        // "第N个是谁？"
        const idx = randInt(0, count - 1);
        question = `排在第 ${idx + 1} 个的是谁？`;
        const wrongPeople = shuffle(PEOPLE.filter(p => !people.includes(p))).slice(0, 3);
        options = shuffle([people[idx], ...wrongPeople]);
        answer = people[idx];
      } else if (qType === 'how_many_between') {
        // "X和Y之间有几个？"
        if (count < 3) return generateQueue();
        const i1 = randInt(0, count - 3);
        const i2 = i1 + randInt(2, count - 1 - i1);
        const between = i2 - i1 - 1;
        question = `${people[i1]} 和 ${people[i2]} 之间有几个？`;
        const opts = new Set([between]);
        while (opts.size < 4) {
          opts.add(randInt(0, count - 2));
        }
        options = shuffle([...opts]).map(String);
        answer = String(between);
      } else {
        // "X的前面/后面有几个人？"
        const idx = randInt(1, count - 2);
        const dir = pick(['前面', '后面']);
        const numBefore = idx;
        const numAfter = count - 1 - idx;
        const correctNum = dir === '前面' ? numBefore : numAfter;
        question = `${people[idx]} 的 ${dir} 有几个人？`;
        const opts = new Set([correctNum]);
        while (opts.size < 4) {
          opts.add(randInt(0, count - 1));
        }
        options = shuffle([...opts]).map(String);
        answer = String(correctNum);
      }

      document.getElementById('queue-question').textContent = question;
      const optionsDiv = document.getElementById('queue-options');
      optionsDiv.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'queue-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleQueueAnswer(btn, opt, answer));
        optionsDiv.appendChild(btn);
      });
    }

    function handleQueueAnswer(btn, selected, answer) {
      const isCorrect = String(selected) === String(answer);
      document.querySelectorAll('.queue-opt').forEach(b => {
        b.disabled = true;
        if (String(b.textContent) === String(answer)) b.classList.add('correct');
      });
      if (!isCorrect) btn.classList.add('wrong');

      if (isCorrect) {
        queueScore++;
        document.getElementById('queue-result').textContent = '✅ 正确！真聪明！';
        document.getElementById('queue-result').style.color = '#34C759';
      } else {
        document.getElementById('queue-result').textContent = `❌ 正确答案是：${answer}`;
        document.getElementById('queue-result').style.color = '#FF3B30';
      }
      document.getElementById('queue-score').textContent = queueScore;
      queueNum++;
      setTimeout(generateQueue, 1500);
    }

    // ===== 模式3: 摆一摆 =====
    let placeScore = 0, placeNum = 1;

    function generatePlace() {
      const grid = document.getElementById('place-grid');
      const palette = document.getElementById('place-palette');
      grid.innerHTML = '';
      palette.innerHTML = '';
      document.getElementById('place-result').textContent = '';
      document.getElementById('place-num').textContent = placeNum;

      const rows = 3, cols = 3;
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      // Create grid cells
      const cells = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'place-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => handlePlaceClick(cell, r, c));
          grid.appendChild(cell);
          cells.push({ el: cell, row: r, col: c });
        }
      }

      // Generate instruction
      const item = pick(FRUITS);
      const rowNames = ['最上面', '中间', '最下面'];
      const colNames = ['最左边', '中间', '最右边'];

      const targetRow = randInt(0, 2);
      const targetCol = randInt(0, 2);

      const instructions = [];
      if (targetRow === 0) instructions.push('最上面一行');
      else if (targetRow === 1) instructions.push('中间一行');
      else instructions.push('最下面一行');

      if (targetCol === 0) instructions.push('最左边');
      else if (targetCol === 1) instructions.push('中间');
      else instructions.push('最右边');

      const instruction = `把 ${item} 放到 ${instructions.join('、')} 的格子里`;
      document.getElementById('place-instruction').textContent = instruction;

      // Store answer
      grid.dataset.answerRow = targetRow;
      grid.dataset.answerCol = targetCol;
      grid.dataset.answerItem = item;
      grid.dataset.placed = 'false';

      // Create palette
      const paletteItems = shuffle([item, ...shuffle(FRUITS.filter(f => f !== item)).slice(0, 3)]);
      let selectedItem = null;

      paletteItems.forEach(pi => {
        const btn = document.createElement('div');
        btn.className = 'palette-item';
        btn.textContent = pi;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.palette-item').forEach(p => p.classList.remove('selected'));
          btn.classList.add('selected');
          selectedItem = pi;
          grid.dataset.currentItem = pi;
        });
        palette.appendChild(btn);
      });

      // Auto-select first
      palette.querySelector('.palette-item').click();
    }

    function handlePlaceClick(cell, row, col) {
      const grid = document.getElementById('place-grid');
      if (grid.dataset.placed === 'true') return;

      const currentItem = grid.dataset.currentItem || grid.dataset.answerItem;
      const answerRow = parseInt(grid.dataset.answerRow);
      const answerCol = parseInt(grid.dataset.answerCol);
      const answerItem = grid.dataset.answerItem;

      if (currentItem !== answerItem) {
        document.getElementById('place-result').textContent = `❌ 请先选择 ${answerItem}`;
        document.getElementById('place-result').style.color = '#FF3B30';
        return;
      }

      grid.dataset.placed = 'true';
      cell.textContent = currentItem;

      if (row === answerRow && col === answerCol) {
        cell.classList.add('correct-place');
        placeScore++;
        document.getElementById('place-result').textContent = '✅ 放对了！真棒！';
        document.getElementById('place-result').style.color = '#34C759';
      } else {
        cell.classList.add('wrong-place');
        // Show correct position
        const correctCell = grid.querySelector(`[data-row="${answerRow}"][data-col="${answerCol}"]`);
        correctCell.classList.add('target');
        correctCell.textContent = answerItem;
        document.getElementById('place-result').textContent = '❌ 位置不对，看看正确位置！';
        document.getElementById('place-result').style.color = '#FF3B30';
      }
      document.getElementById('place-score').textContent = placeScore;
      placeNum++;
      setTimeout(generatePlace, 1500);
    }

    // ===== 模式4: 挑战模式 =====
    let chTimer = null, chTimeLeft = 60, chCorrect = 0, chWrong = 0, chStarted = false;
    let chCurrentAnswer = null;

    document.getElementById('ch-start-btn').addEventListener('click', startChallenge);

    function startChallenge() {
      chTimeLeft = 60;
      chCorrect = 0;
      chWrong = 0;
      chStarted = true;
      document.getElementById('ch-correct').textContent = chCorrect;
      document.getElementById('ch-wrong').textContent = chWrong;
      document.getElementById('ch-timer').textContent = chTimeLeft;
      document.getElementById('ch-timer-fill').style.width = '100%';
      document.getElementById('ch-timer-fill').classList.remove('warning');
      generateChallenge();

      chTimer = setInterval(() => {
        chTimeLeft--;
        document.getElementById('ch-timer').textContent = chTimeLeft;
        document.getElementById('ch-timer-fill').style.width = (chTimeLeft / 60 * 100) + '%';
        if (chTimeLeft <= 15) document.getElementById('ch-timer-fill').classList.add('warning');
        if (chTimeLeft <= 0) {
          clearInterval(chTimer);
          chStarted = false;
          document.getElementById('ch-question').textContent = `⏱️ 时间到！答对 ${chCorrect} 题，答错 ${chWrong} 题`;
          document.getElementById('ch-options').innerHTML = '<button class="ch-opt" id="ch-restart-btn" style="padding:14px 32px;font-size:20px;">🔄 再来一次</button>';
          document.getElementById('ch-restart-btn').addEventListener('click', startChallenge);
          document.getElementById('ch-scene').innerHTML = '';
        }
      }, 1000);
    }

    function generateChallenge() {
      if (!chStarted) return;
      const scene = document.getElementById('ch-scene');
      scene.innerHTML = '';
      document.getElementById('ch-question').textContent = '';

      const count = randInt(2, 3);
      const items = shuffle(ANIMALS).slice(0, count);
      const slots = [
        { x: 20, y: 15 }, { x: 170, y: 15 },
        { x: 20, y: 130 }, { x: 170, y: 130 },
        { x: 95, y: 70 }
      ];
      const chosenSlots = shuffle(slots).slice(0, count);

      items.forEach((item, i) => {
        const el = document.createElement('span');
        el.className = 'ch-item';
        el.textContent = item;
        el.style.left = chosenSlots[i].x + 'px';
        el.style.top = chosenSlots[i].y + 'px';
        scene.appendChild(el);
      });

      // Simple position question
      const a = { emoji: items[0], slot: chosenSlots[0] };
      const b = { emoji: items[1], slot: chosenSlots[1] };

      let question, answer;
      if (Math.random() < 0.5) {
        // Who is above/below
        if (a.slot.y < b.slot.y) {
          question = `${b.emoji} 在 ${a.emoji} 的哪边？`;
          answer = '下面';
        } else {
          question = `${a.emoji} 在 ${b.emoji} 的哪边？`;
          answer = '下面';
        }
        const options = shuffle(['上面', '下面', '左面', '右面']);
        renderChallengeOptions(options, answer);
      } else {
        if (a.slot.x < b.slot.x) {
          question = `${a.emoji} 在 ${b.emoji} 的哪边？`;
          answer = '左面';
        } else {
          question = `${b.emoji} 在 ${a.emoji} 的哪边？`;
          answer = '左面';
        }
        const options = shuffle(['上面', '下面', '左面', '右面']);
        renderChallengeOptions(options, answer);
      }

      document.getElementById('ch-question').textContent = question;
    }

    function renderChallengeOptions(options, answer) {
      const div = document.getElementById('ch-options');
      div.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ch-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleChallengeAnswer(btn, opt, answer));
        div.appendChild(btn);
      });
    }

    function handleChallengeAnswer(btn, selected, answer) {
      if (!chStarted) return;
      const isCorrect = selected === answer;
      document.querySelectorAll('.ch-opt').forEach(b => {
        b.disabled = true;
        if (b.textContent === answer) b.classList.add('correct');
      });
      if (!isCorrect) {
        btn.classList.add('wrong');
        chWrong++;
      } else {
        chCorrect++;
      }
      document.getElementById('ch-correct').textContent = chCorrect;
      document.getElementById('ch-wrong').textContent = chWrong;
      setTimeout(generateChallenge, 800);
    }

    // ===== 初始化 =====
    generateScene();
    generateQueue();
    generatePlace();
  </script>
</body>
</html>
