<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小数加减法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E91E63; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    .diff-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; background: rgba(233,30,99,0.15); color: #E91E63; }

    /* === 模式1: 竖式对齐 === */
    .vertical-area { text-align: center; padding: 24px 16px; }
    .vertical-card {
      display: inline-block; background: #FFF8E1; border-radius: 16px;
      padding: 20px 28px; margin: 16px auto; border: 2px solid #FFB300;
      font-family: 'Courier New', monospace;
    }
    .v-row {
      font-size: 36px; font-weight: 700; text-align: right;
      letter-spacing: 2px; line-height: 1.6; min-width: 180px;
    }
    .v-row.v-line { border-top: 3px solid #1D1D1F; margin-top: 4px; padding-top: 4px; }
    .v-op { color: #E91E63; }
    .v-dot { color: #FF9500; font-size: 40px; }
    .v-result { color: #34C759; }
    .v-hidden { visibility: hidden; }
    .vertical-tip {
      font-size: 16px; color: #6E6E73; margin: 12px 0; padding: 12px 16px;
      background: #FFF8E1; border-radius: 12px; line-height: 1.6;
    }
    .vertical-tip strong { color: #E91E63; }
    .step-hint {
      font-size: 15px; color: #E91E63; margin: 8px 0;
      padding: 8px 16px; background: rgba(233,30,99,0.08); border-radius: 10px;
      display: none;
    }
    .step-hint.show { display: block; animation: fadeInUp 0.3s ease; }

    /* === 模式2: 购物计算 === */
    .shop-area { text-align: center; padding: 24px 16px; }
    .shop-scene {
      background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
      border-radius: 20px; padding: 20px; margin: 16px 0;
    }
    .shop-items {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 12px 0;
    }
    .shop-item {
      background: white; border-radius: 16px; padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; min-width: 100px;
    }
    .shop-item .item-icon { font-size: 40px; }
    .shop-item .item-name { font-size: 14px; font-weight: 600; color: #6E6E73; margin-top: 4px; }
    .shop-item .item-price { font-size: 20px; font-weight: 800; color: #E91E63; margin-top: 4px; }
    .shop-question { font-size: 22px; font-weight: 700; color: #1D1D1F; margin: 16px 0; }
    .shop-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .shop-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 22px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 100px;
    }
    .shop-opt:active { transform: scale(0.92); }
    .shop-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .shop-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .shop-work {
      margin: 12px auto; max-width: 300px; background: white;
      border-radius: 12px; padding: 12px; font-family: 'Courier New', monospace;
    }
    .shop-work .v-row { font-size: 24px; }

    /* === 模式3: 快速练习 === */
    .practice-area { text-align: center; padding: 24px 16px; }
    .practice-problem {
      font-size: 36px; font-weight: 800; color: #1D1D1F; margin: 20px 0;
      padding: 16px; background: #F8F9FE; border-radius: 16px;
    }
    .practice-problem .dot { color: #FF9500; }
    .practice-input-row { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 16px 0; }
    .practice-input {
      width: 160px; height: 64px; border: 3px solid #E5E5EA; border-radius: 16px;
      font-size: 32px; font-weight: 700; text-align: center; color: #E91E63;
      outline: none; transition: border-color 0.2s ease;
    }
    .practice-input:focus { border-color: #E91E63; }
    .practice-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .practice-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 300px; margin: 16px auto; }
    .num-btn {
      height: 56px; border: 2px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700;
      cursor: pointer; transition: all 0.15s ease;
    }
    .num-btn:active { transform: scale(0.9); }
    .num-btn.accent { background: #E91E63; color: white; border-color: #E91E63; }
    .num-btn.del { border-color: #FF3B30; color: #FF3B30; }
    .practice-visual {
      margin: 12px auto; max-width: 320px;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .bar-label { font-size: 16px; font-weight: 700; color: #E91E63; width: 60px; text-align: right; }
    .bar-track { flex: 1; height: 20px; background: #E5E5EA; border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }

    /* === 模式4: 限时挑战 === */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-start {
      padding: 20px 40px; border: none; background: #E91E63; color: white;
      border-radius: 20px; font-size: 22px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(233,30,99,0.3); margin: 20px auto; display: block;
    }
    .challenge-start:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start { display: none; }
    .challenge-active .challenge-running { display: block; }
    .timer-bar { height: 10px; background: #E5E5EA; border-radius: 5px; overflow: hidden; margin: 12px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30); border-radius: 5px; transition: width 0.1s linear; }
    .challenge-info { display: flex; justify-content: center; gap: 24px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .challenge-problem {
      font-size: 32px; font-weight: 800; color: #1D1D1F; margin: 16px 0;
      padding: 12px; background: #F8F9FE; border-radius: 16px;
    }
    .challenge-problem .dot { color: #FF9500; }
    .challenge-opts { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .ch-opt {
      padding: 16px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 100px;
    }
    .ch-opt:active { transform: scale(0.92); }
    .ch-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .ch-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-result {
      display: none; padding: 24px; margin: 16px 0;
      background: linear-gradient(135deg, #FCE4EC 0%, #F8BBD0 100%);
      border-radius: 20px;
    }
    .challenge-result.show { display: block; animation: fadeInUp 0.3s ease; }
    .result-score { font-size: 48px; font-weight: 800; color: #E91E63; }
    .result-msg { font-size: 18px; color: #6E6E73; margin-top: 8px; }
    .result-detail { display: flex; justify-content: center; gap: 32px; margin-top: 16px; }
    .result-item { text-align: center; }
    .result-item .ri-num { font-size: 28px; font-weight: 700; }
    .result-item .ri-label { font-size: 13px; color: #6E6E73; }

    @media (max-width: 480px) {
      .v-row { font-size: 28px; }
      .practice-problem { font-size: 28px; }
      .challenge-problem { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">➕ 小数加减法</span>
    </nav>

    <div class="score-display">
      <span class="diff-badge" id="diff-badge">四年级</span>
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="vertical">📝 竖式</button>
      <button class="mode-tab" data-mode="shop">🛒 购物</button>
      <button class="mode-tab" data-mode="practice">✏️ 练习</button>
      <button class="mode-tab" data-mode="challenge">⏱️ 挑战</button>
    </div>

    <!-- 模式1: 竖式计算 -->
    <div class="mode-content active" id="mode-vertical">
      <div class="card">
        <p class="page-subtitle">小数点对齐，逐位计算</p>
        <div class="vertical-area">
          <div class="vertical-tip">
            💡 <strong>关键口诀：</strong>小数加减并不难，<strong>小数点对齐</strong>是关键！<br>
            从末位算起，满十进一，退一当十。
          </div>
          <div class="vertical-card" id="v-card">
            <div class="v-row" id="v-num1"></div>
            <div class="v-row" id="v-num2"></div>
            <div class="v-row v-line" id="v-result"></div>
          </div>
          <div class="step-hint" id="v-hint"></div>
          <div class="action-bar">
            <button class="btn btn-primary" id="btn-v-step">👉 下一步</button>
            <button class="btn btn-warning" id="btn-v-new">🎲 换一题</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 购物计算 -->
    <div class="mode-content" id="mode-shop">
      <div class="card">
        <p class="page-subtitle">买东西算一算，小数就在身边</p>
        <div class="shop-area">
          <div class="shop-scene" id="shop-scene">
            <div class="shop-items" id="shop-items"></div>
          </div>
          <div class="shop-question" id="shop-question"></div>
          <div class="shop-work" id="shop-work" style="display:none"></div>
          <div class="shop-options" id="shop-options"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 快速练习 -->
    <div class="mode-content" id="mode-practice">
      <div class="card">
        <p class="page-subtitle">输入答案，看数条图验证</p>
        <div class="practice-area">
          <div class="practice-problem" id="p-problem"></div>
          <div class="practice-visual" id="p-visual"></div>
          <div class="practice-input-row">
            <input type="text" class="practice-input" id="p-input" placeholder="?" readonly>
          </div>
          <div class="numpad" id="p-numpad"></div>
          <div class="action-bar">
            <button class="btn btn-primary" id="btn-p-check">✅ 检查</button>
            <button class="btn btn-warning" id="btn-p-new">🎲 换一题</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <p class="page-subtitle">60秒限时挑战，看你能答对几题</p>
        <div class="challenge-area" id="challenge-area">
          <button class="challenge-start" id="btn-ch-start">🚀 开始挑战</button>
          <div class="challenge-running">
            <div class="timer-bar"><div class="timer-fill" id="ch-timer" style="width:100%"></div></div>
            <div class="challenge-info">
              <span>⏱️ <span id="ch-time">60</span>秒</span>
              <span>✅ <span id="ch-correct">0</span>对</span>
              <span>❌ <span id="ch-wrong">0</span>错</span>
            </div>
            <div class="challenge-problem" id="ch-problem"></div>
            <div class="challenge-opts" id="ch-opts"></div>
          </div>
          <div class="challenge-result" id="ch-result">
            <div class="result-score" id="ch-final-score"></div>
            <div class="result-msg" id="ch-final-msg"></div>
            <div class="result-detail">
              <div class="result-item"><div class="ri-num" id="ch-r-correct" style="color:#34C759">0</div><div class="ri-label">答对</div></div>
              <div class="result-item"><div class="ri-num" id="ch-r-wrong" style="color:#FF3B30">0</div><div class="ri-label">答错</div></div>
              <div class="result-item"><div class="ri-num" id="ch-r-rate" style="color:#E91E63">0%</div><div class="ri-label">正确率</div></div>
            </div>
            <button class="challenge-start" id="btn-ch-restart" style="margin-top:16px">🔄 再来一次</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 工具函数 ===
    const $ = id => document.getElementById(id);
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function roundTo(n, d) { return Math.round(n * Math.pow(10, d)) / Math.pow(10, d); }
    function fmtDecimal(n) {
      // 保留合理小数位
      if (Number.isInteger(n)) return n.toString();
      let s = n.toFixed(2);
      // 去掉末尾多余的0
      s = s.replace(/0+$/, '').replace(/\.$/, '');
      return s;
    }

    // 连续答对
    let streak = 0;
    function updateStreak() {
      $('streak').textContent = streak;
      let stars = '';
      for (let i = 0; i < Math.min(streak, 10); i++) stars += '⭐';
      $('stars-display').textContent = stars;
    }

    // Toast
    function showToast(msg, dur) {
      dur = dur || 1200;
      let t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:16px 32px;border-radius:16px;font-size:20px;font-weight:700;z-index:9999;animation:fadeInUp 0.2s ease;';
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, dur - 300);
      setTimeout(() => t.remove(), dur);
    }

    // 音效
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.value = 0.15;
        if (type === 'correct') { osc.frequency.value = 880; osc.type = 'sine'; }
        else if (type === 'wrong') { osc.frequency.value = 220; osc.type = 'square'; gain.gain.value = 0.1; }
        else { osc.frequency.value = 660; osc.type = 'sine'; }
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    // 生成小数加减题目
    function genProblem(decimals) {
      decimals = decimals || randPick([1, 2]);
      const isAdd = Math.random() < 0.5;
      let a, b, answer;
      if (decimals === 1) {
        if (isAdd) {
          a = roundTo(randInt(1, 99) / 10, 1);
          b = roundTo(randInt(1, 99) / 10, 1);
          answer = roundTo(a + b, 1);
        } else {
          a = roundTo(randInt(10, 99) / 10, 1);
          b = roundTo(randInt(1, Math.floor(a * 10)) / 10, 1);
          answer = roundTo(a - b, 1);
        }
      } else {
        if (isAdd) {
          a = roundTo(randInt(1, 999) / 100, 2);
          b = roundTo(randInt(1, 999) / 100, 2);
          answer = roundTo(a + b, 2);
        } else {
          a = roundTo(randInt(100, 999) / 100, 2);
          b = roundTo(randInt(1, Math.floor(a * 100)) / 100, 2);
          answer = roundTo(a - b, 2);
        }
      }
      return { a, b, op: isAdd ? '+' : '-', answer, decimals };
    }

    // 生成选择题选项
    function genOptions(answer, decimals) {
      let opts = new Set();
      opts.add(fmtDecimal(answer));
      while (opts.size < 4) {
        let offset = randInt(1, 5) / Math.pow(10, decimals);
        if (Math.random() < 0.5) offset = -offset;
        let wrong = roundTo(answer + offset, decimals);
        if (wrong >= 0 && wrong !== answer) opts.add(fmtDecimal(wrong));
      }
      let arr = Array.from(opts);
      // 随机打乱
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        $('mode-' + tab.dataset.mode).classList.add('active');
        playSound('click');
      });
    });

    // ========== 模式1: 竖式计算 ==========
    let vProblem, vStep = 0, vSteps = [];
    function newVertical() {
      vProblem = genProblem();
      vStep = 0;
      const { a, b, op, answer } = vProblem;
      const aStr = fmtDecimal(a);
      const bStr = fmtDecimal(b);
      const maxLen = Math.max(aStr.length, bStr.length);
      const aPad = aStr.padStart(maxLen, ' ');
      const bPad = bStr.padStart(maxLen, ' ');

      // 渲染竖式
      let html1 = `<span class="v-op"></span>`;
      let html2 = `<span class="v-op">${op}</span>`;
      for (let i = 0; i < aPad.length; i++) {
        if (aPad[i] === '.') html1 += '<span class="v-dot">.</span>';
        else html1 += aPad[i];
      }
      for (let i = 0; i < bPad.length; i++) {
        if (bPad[i] === '.') html2 += '<span class="v-dot">.</span>';
        else html2 += bPad[i];
      }
      $('v-num1').innerHTML = html1;
      $('v-num2').innerHTML = html2;
      $('v-result').innerHTML = '<span class="v-hidden">?</span>';
      $('v-hint').className = 'step-hint';
      $('v-hint').textContent = '';
      $('btn-v-step').disabled = false;
      $('btn-v-step').textContent = '👉 下一步';

      // 生成步骤提示
      const decPlaces = vProblem.decimals;
      vSteps = [
        `第一步：对齐小数点（已对齐 ✅），从末位开始计算`,
        `第二步：逐位${op === '+' ? '相加' : '相减'}，${op === '+' ? '满十向前一位进一' : '不够减向前一位借一'}`,
        `第三步：在结果中，小数点要和上面两个数的小点对齐`,
        `✅ 答案：${fmtDecimal(a)} ${op} ${fmtDecimal(b)} = ${fmtDecimal(answer)}`
      ];
    }

    $('btn-v-step').addEventListener('click', () => {
      if (vStep >= vSteps.length) return;
      $('v-hint').textContent = vSteps[vStep];
      $('v-hint').className = 'step-hint show';
      vStep++;
      if (vStep === vSteps.length) {
        // 显示结果
        const resStr = fmtDecimal(vProblem.answer);
        const maxLen = Math.max(fmtDecimal(vProblem.a).length, fmtDecimal(vProblem.b).length, resStr.length);
        const resPad = resStr.padStart(maxLen, ' ');
        let html = '';
        for (let i = 0; i < resPad.length; i++) {
          if (resPad[i] === '.') html += '<span class="v-dot">.</span>';
          else html += `<span class="v-result">${resPad[i]}</span>`;
        }
        $('v-result').innerHTML = html;
        $('btn-v-step').textContent = '✅ 完成';
        $('btn-v-step').disabled = true;
        playSound('correct');
        showToast('🎉 学会啦！');
      }
      playSound('click');
    });

    $('btn-v-new').addEventListener('click', () => { newVertical(); playSound('click'); });
    newVertical();

    // ========== 模式2: 购物计算 ==========
    const shopItems = [
      { icon: '🍎', name: '苹果', minPrice: 2, maxPrice: 15 },
      { icon: '🍌', name: '香蕉', minPrice: 3, maxPrice: 12 },
      { icon: '🥛', name: '牛奶', minPrice: 4, maxPrice: 18 },
      { icon: '🍞', name: '面包', minPrice: 3, maxPrice: 15 },
      { icon: '🧃', name: '果汁', minPrice: 2, maxPrice: 10 },
      { icon: '🍪', name: '饼干', minPrice: 5, maxPrice: 20 },
      { icon: '🍬', name: '糖果', minPrice: 1, maxPrice: 8 },
      { icon: '📓', name: '笔记本', minPrice: 3, maxPrice: 15 },
      { icon: '✏️', name: '铅笔', minPrice: 1, maxPrice: 5 },
      { icon: '📏', name: '尺子', minPrice: 2, maxPrice: 8 },
    ];

    let shopProblem, shopAnswer;
    function newShop() {
      // 随机选2个商品
      const items = [];
      const used = new Set();
      while (items.length < 2) {
        const idx = randInt(0, shopItems.length - 1);
        if (!used.has(idx)) {
          used.add(idx);
          const item = { ...shopItems[idx] };
          item.price = roundTo(randInt(item.minPrice * 10, item.maxPrice * 10) / 10, 1);
          items.push(item);
        }
      }

      const isAdd = Math.random() < 0.6;
      if (isAdd) {
        shopAnswer = roundTo(items[0].price + items[1].price, 1);
        const question = `买这两样东西一共要花多少钱？`;
        renderShop(items, question, shopAnswer, '+');
      } else {
        // 确保大减小
        if (items[0].price < items[1].price) [items[0], items[1]] = [items[1], items[0]];
        shopAnswer = roundTo(items[0].price - items[1].price, 1);
        const question = `${items[0].name}比${items[1].name}贵多少钱？`;
        renderShop(items, question, shopAnswer, '-');
      }
    }

    function renderShop(items, question, answer, op) {
      // 渲染商品
      let itemsHtml = '';
      items.forEach(it => {
        itemsHtml += `<div class="shop-item">
          <div class="item-icon">${it.icon}</div>
          <div class="item-name">${it.name}</div>
          <div class="item-price">¥${fmtDecimal(it.price)}</div>
        </div>`;
      });
      $('shop-items').innerHTML = itemsHtml;
      $('shop-question').textContent = question;

      // 竖式草稿
      const aStr = fmtDecimal(items[0].price);
      const bStr = fmtDecimal(items[1].price);
      const maxLen = Math.max(aStr.length, bStr.length);
      $('shop-work').style.display = 'block';
      $('shop-work').innerHTML = `
        <div class="v-row" style="font-size:20px">${aStr.padStart(maxLen)}</div>
        <div class="v-row" style="font-size:20px"><span class="v-op">${op}</span>${bStr.padStart(maxLen)}</div>
        <div class="v-row v-line" style="font-size:20px">?</div>
      `;

      // 选项
      const options = genOptions(answer, 1);
      let optsHtml = '';
      options.forEach(opt => {
        optsHtml += `<button class="shop-opt" data-val="${opt}">¥${opt}</button>`;
      });
      $('shop-options').innerHTML = optsHtml;

      // 绑定事件
      document.querySelectorAll('.shop-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = parseFloat(btn.dataset.val);
          if (Math.abs(val - answer) < 0.001) {
            btn.classList.add('correct');
            playSound('correct');
            streak++;
            updateStreak();
            showToast('🎉 答对了！');
            document.querySelectorAll('.shop-opt').forEach(b => b.disabled = true);
            setTimeout(newShop, 1500);
          } else {
            btn.classList.add('wrong');
            playSound('wrong');
            streak = 0;
            updateStreak();
            showToast('再算算看~');
            setTimeout(() => { btn.classList.remove('wrong'); }, 600);
          }
        });
      });
    }

    newShop();

    // ========== 模式3: 快速练习 ==========
    let pProblem, pAnswer;
    function newPractice() {
      pProblem = genProblem();
      pAnswer = pProblem.answer;
      const { a, b, op } = pProblem;
      $('p-problem').innerHTML = `${fmtDecimal(a)} <span class="dot">.</span> ${op} ${fmtDecimal(b).replace('.', '<span class="dot">.</span>')} = ?`;
      // 修正显示
      $('p-problem').innerHTML = `${fmtDecimal(a)} ${op} ${fmtDecimal(b)} = ?`;
      $('p-input').value = '';
      $('p-input').className = 'practice-input';

      // 数条图
      renderPracticeVisual();

      playSound('click');
    }

    function renderPracticeVisual() {
      const { a, b, op, answer } = pProblem;
      const maxVal = Math.max(a, b, answer) * 1.2;
      let html = '';
      html += `<div class="bar-row"><div class="bar-label">${fmtDecimal(a)}</div><div class="bar-track"><div class="bar-fill" style="width:${(a/maxVal*100).toFixed(1)}%;background:#E91E63"></div></div></div>`;
      html += `<div class="bar-row"><div class="bar-label">${op} ${fmtDecimal(b)}</div><div class="bar-track"><div class="bar-fill" style="width:${(b/maxVal*100).toFixed(1)}%;background:#FF9500"></div></div></div>`;
      if (op === '+') {
        html += `<div class="bar-row"><div class="bar-label">= ?</div><div class="bar-track"><div class="bar-fill" id="p-result-bar" style="width:0%;background:#34C759;transition:width 0.5s ease"></div></div></div>`;
      } else {
        html += `<div class="bar-row"><div class="bar-label">= ?</div><div class="bar-track"><div class="bar-fill" id="p-result-bar" style="width:0%;background:#34C759;transition:width 0.5s ease"></div></div></div>`;
      }
      $('p-visual').innerHTML = html;
    }

    // 数字键盘
    function buildNumpad() {
      const keys = ['1','2','3','.',  '4','5','6','0', '7','8','9','⌫'];
      let html = '';
      keys.forEach(k => {
        let cls = 'num-btn';
        if (k === '.') cls += ' accent';
        if (k === '⌫') cls += ' del';
        html += `<button class="${cls}" data-key="${k}">${k}</button>`;
      });
      $('p-numpad').innerHTML = html;
      document.querySelectorAll('.num-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const inp = $('p-input');
          const key = btn.dataset.key;
          if (key === '⌫') {
            inp.value = inp.value.slice(0, -1);
          } else if (key === '.' && inp.value.includes('.')) {
            // 已有小数点
          } else {
            inp.value += key;
          }
          playSound('click');
        });
      });
    }
    buildNumpad();

    function checkPractice() {
      const val = parseFloat($('p-input').value);
      if (isNaN(val)) { showToast('请输入答案'); return; }
      if (Math.abs(val - pAnswer) < 0.001) {
        $('p-input').className = 'practice-input correct';
        playSound('correct');
        streak++;
        updateStreak();
        showToast('🎉 答对了！');
        // 动画显示结果条
        const maxVal = Math.max(pProblem.a, pProblem.b, pProblem.answer) * 1.2;
        const bar = $('p-result-bar');
        if (bar) bar.style.width = (pProblem.answer / maxVal * 100).toFixed(1) + '%';
        setTimeout(newPractice, 1500);
      } else {
        $('p-input').className = 'practice-input wrong';
        playSound('wrong');
        streak = 0;
        updateStreak();
        showToast('不对哦，再算算~');
        setTimeout(() => {
          $('p-input').value = '';
          $('p-input').className = 'practice-input';
        }, 800);
      }
    }

    $('btn-p-check').addEventListener('click', checkPractice);
    $('btn-p-new').addEventListener('click', () => { newPractice(); });
    newPractice();

    // ========== 模式4: 限时挑战 ==========
    let chTimer, chTime, chCorrect, chWrong, chCurrent, chRunning = false;

    function startChallenge() {
      chTime = 60; chCorrect = 0; chWrong = 0; chRunning = true;
      $('challenge-area').classList.add('challenge-active');
      $('ch-result').classList.remove('show');
      $('ch-time').textContent = chTime;
      $('ch-correct').textContent = chCorrect;
      $('ch-wrong').textContent = chWrong;
      $('ch-timer').style.width = '100%';
      nextChallenge();
      chTimer = setInterval(() => {
        chTime--;
        $('ch-time').textContent = chTime;
        $('ch-timer').style.width = (chTime / 60 * 100) + '%';
        if (chTime <= 0) endChallenge();
      }, 1000);
    }

    function endChallenge() {
      clearInterval(chTimer);
      chRunning = false;
      $('challenge-area').classList.remove('challenge-active');
      $('ch-result').classList.add('show');
      const total = chCorrect + chWrong;
      const rate = total > 0 ? Math.round(chCorrect / total * 100) : 0;
      $('ch-final-score').textContent = chCorrect + ' 分';
      $('ch-r-correct').textContent = chCorrect;
      $('ch-r-wrong').textContent = chWrong;
      $('ch-r-rate').textContent = rate + '%';
      if (chCorrect >= 15) $('ch-final-msg').textContent = '🏆 太厉害了！小数计算大师！';
      else if (chCorrect >= 10) $('ch-final-msg').textContent = '🌟 非常棒！继续加油！';
      else if (chCorrect >= 5) $('ch-final-msg').textContent = '👍 不错哦，再练练更好！';
      else $('ch-final-msg').textContent = '💪 多练习就能进步！';
    }

    function nextChallenge() {
      if (!chRunning) return;
      chCurrent = genProblem();
      const { a, b, op, answer } = chCurrent;
      $('ch-problem').innerHTML = `${fmtDecimal(a)} ${op} ${fmtDecimal(b)} = ?`;
      const options = genOptions(answer, chCurrent.decimals);
      let html = '';
      options.forEach(opt => {
        html += `<button class="ch-opt" data-val="${opt}">${opt}</button>`;
      });
      $('ch-opts').innerHTML = html;
      document.querySelectorAll('.ch-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!chRunning) return;
          const val = parseFloat(btn.dataset.val);
          if (Math.abs(val - answer) < 0.001) {
            btn.classList.add('correct');
            playSound('correct');
            chCorrect++;
            $('ch-correct').textContent = chCorrect;
            setTimeout(nextChallenge, 400);
          } else {
            btn.classList.add('wrong');
            playSound('wrong');
            chWrong++;
            $('ch-wrong').textContent = chWrong;
            // 高亮正确答案
            document.querySelectorAll('.ch-opt').forEach(b => {
              if (Math.abs(parseFloat(b.dataset.val) - answer) < 0.001) b.classList.add('correct');
            });
            setTimeout(nextChallenge, 800);
          }
        });
      });
    }

    $('btn-ch-start').addEventListener('click', startChallenge);
    $('btn-ch-restart').addEventListener('click', startChallenge);

  </script>
</body>
</html>
