<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小数加减法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #1565C0; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    .diff-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .diff-easy { background: rgba(52,199,89,0.15); color: #34C759; }
    .diff-medium { background: rgba(255,149,0,0.15); color: #FF9500; }
    .diff-hard { background: rgba(255,59,48,0.15); color: #FF3B30; }

    /* === 模式1: 对齐演示 === */
    .align-area { text-align: center; padding: 20px 16px; }
    .align-problem {
      font-size: 32px; font-weight: 700; color: #1565C0; margin: 24px 0;
      font-family: 'Courier New', monospace; letter-spacing: 2px;
    }
    .align-visual {
      display: inline-block; text-align: center; margin: 16px auto;
      background: white; border-radius: 16px; padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .align-row {
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace;
      margin: 8px 0; letter-spacing: 4px;
    }
    .align-row .digit { width: 28px; text-align: center; }
    .align-row .digit.dot { color: #FF3B30; font-size: 32px; }
    .align-row .digit.op { color: #6E6E73; margin-right: 8px; }
    .align-line { height: 3px; background: #1565C0; margin: 8px 0; border-radius: 2px; }
    .align-hint {
      background: rgba(21,101,192,0.08); border-radius: 12px; padding: 12px 16px;
      margin: 16px 0; font-size: 15px; color: #6E6E73; text-align: left;
    }
    .align-hint strong { color: #1565C0; }
    .align-step {
      font-size: 18px; font-weight: 600; color: #1565C0; margin: 12px 0;
      min-height: 28px;
    }

    /* === 模式2: 快速计算 === */
    .calc-area { text-align: center; padding: 20px 16px; }
    .calc-problem {
      font-size: 36px; font-weight: 700; color: #1565C0; margin: 24px 0;
      font-family: 'Courier New', monospace;
    }
    .calc-input-wrap {
      display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0;
    }
    .calc-input {
      width: 140px; padding: 14px; border: 3px solid #E5E5EA; border-radius: 14px;
      font-size: 28px; font-weight: 700; text-align: center; font-family: 'Courier New', monospace;
      color: #1565C0;
    }
    .calc-input:focus { outline: none; border-color: #1565C0; }
    .calc-feedback { font-size: 20px; font-weight: 700; min-height: 32px; margin: 12px 0; }

    /* === 模式3: 应用题 === */
    .app-area { text-align: center; padding: 20px 16px; }
    .app-scene { font-size: 48px; margin: 16px 0; }
    .app-problem {
      font-size: 18px; color: #1D1D1F; line-height: 1.8; margin: 16px 0;
      background: white; border-radius: 16px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: left;
    }
    .app-problem .highlight { color: #1565C0; font-weight: 700; }
    .app-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 8px;
    }
    .app-opt {
      padding: 18px 12px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .app-opt:active { transform: scale(0.92); }
    .app-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .app-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* === 模式4: 竖式填空 === */
    .fill-area { text-align: center; padding: 20px 16px; }
    .fill-visual {
      display: inline-block; background: white; border-radius: 16px;
      padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto;
    }
    .fill-row {
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace;
      margin: 8px 0; letter-spacing: 4px;
    }
    .fill-row .digit { width: 28px; text-align: center; }
    .fill-row .digit.dot { color: #FF3B30; font-size: 32px; }
    .fill-row .digit.op { color: #6E6E73; margin-right: 8px; }
    .fill-line { height: 3px; background: #1565C0; margin: 8px 0; border-radius: 2px; }
    .fill-blank {
      width: 28px; height: 34px; border-bottom: 3px solid #FF9500;
      display: inline-block; vertical-align: bottom; margin: 0 1px;
    }
    .fill-input {
      width: 36px; padding: 4px; border: 2px solid #FF9500; border-radius: 8px;
      font-size: 24px; font-weight: 700; text-align: center;
      font-family: 'Courier New', monospace; color: #FF9500;
      display: inline-block; vertical-align: bottom;
    }
    .fill-input:focus { outline: none; border-color: #1565C0; color: #1565C0; }
    .fill-input.correct { border-color: #34C759; color: #34C759; background: rgba(52,199,89,0.1); }
    .fill-input.wrong { border-color: #FF3B30; color: #FF3B30; background: rgba(255,59,48,0.1); }
    .fill-hint { font-size: 16px; color: #6E6E73; margin: 12px 0; }

    /* === 模式5: 挑战 === */
    .challenge-area { text-align: center; padding: 20px 16px; }
    .challenge-problem {
      font-size: 24px; font-weight: 700; color: #1565C0; margin: 20px 0; line-height: 1.6;
    }
    .challenge-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 8px;
    }
    .challenge-opt {
      padding: 18px 12px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .challenge-opt:active { transform: scale(0.92); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">➕ 小数加减法</span>
    </nav>

    <div class="score-display">
      <span class="diff-badge diff-easy" id="diff-badge">对齐演示</span>
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="align">📏 对齐演示</button>
      <button class="mode-tab" data-mode="calc">⚡ 快速计算</button>
      <button class="mode-tab" data-mode="app">🛒 应用题</button>
      <button class="mode-tab" data-mode="fill">✏️ 竖式填空</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 对齐演示 -->
    <div class="mode-content active" id="mode-align">
      <div class="card">
        <p class="page-subtitle">小数点对齐，从末位算起</p>
        <div class="align-area">
          <div class="align-visual" id="align-visual"></div>
          <div class="align-step" id="align-step"></div>
          <div class="align-hint" id="align-hint"></div>
          <div class="action-bar"><button class="btn btn-primary btn-large" id="btn-new-align">🎲 换一题</button></div>
        </div>
      </div>
    </div>

    <!-- 模式2: 快速计算 -->
    <div class="mode-content" id="mode-calc">
      <div class="card">
        <p class="page-subtitle">算出正确答案，输入后点确认</p>
        <div class="calc-area">
          <div class="calc-problem" id="calc-problem"></div>
          <div class="calc-input-wrap">
            <span style="font-size:22px;color:#6E6E73">=</span>
            <input type="text" class="calc-input" id="calc-input" placeholder="?" inputmode="decimal" autocomplete="off">
            <button class="btn btn-primary" id="btn-check-calc" style="padding:14px 20px;font-size:20px">✅</button>
          </div>
          <div class="calc-feedback" id="calc-feedback"></div>
          <div class="action-bar"><button class="btn btn-primary btn-large" id="btn-new-calc">🎲 换一题</button></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 应用题 -->
    <div class="mode-content" id="mode-app">
      <div class="card">
        <p class="page-subtitle">生活中的小数计算</p>
        <div class="app-area">
          <div class="app-scene" id="app-scene"></div>
          <div class="app-problem" id="app-problem"></div>
          <div class="app-options" id="app-options"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 竖式填空 -->
    <div class="mode-content" id="mode-fill">
      <div class="card">
        <p class="page-subtitle">填入竖式中缺少的数字</p>
        <div class="fill-area">
          <div class="fill-visual" id="fill-visual"></div>
          <div class="fill-hint" id="fill-hint"></div>
          <div style="display:flex;justify-content:center;gap:12px;margin:16px 0">
            <button class="btn btn-primary" id="btn-check-fill" style="padding:12px 24px;font-size:18px">✅ 检查</button>
            <button class="btn btn-secondary" id="btn-new-fill" style="padding:12px 24px;font-size:18px">🎲 换一题</button>
          </div>
          <div class="calc-feedback" id="fill-feedback"></div>
        </div>
      </div>
    </div>

    <!-- 模式5: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-problem" id="challenge-problem"></div>
          <div class="challenge-options" id="challenge-options"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast('🔥 连续 ' + streak + ' 次！小数计算达人！');
    }

    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.mode-content').forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        var mode = tab.getAttribute('data-mode');
        document.getElementById('mode-' + mode).classList.add('active');
        var labels = { align: '对齐演示', calc: '快速计算', app: '应用题', fill: '竖式填空', challenge: '挑战' };
        document.getElementById('diff-badge').textContent = labels[mode] || mode;
        initMode(mode);
      });
    });

    function initMode(mode) {
      if (mode === 'align') newAlignProblem();
      else if (mode === 'calc') newCalcProblem();
      else if (mode === 'app') newAppProblem();
      else if (mode === 'fill') newFillProblem();
      else if (mode === 'challenge') newChallenge();
    }

    // ========== 工具函数 ==========
    function randDecimal(minInt, maxInt, places) {
      var intPart = Random.int(minInt, maxInt);
      var decPart = Random.int(1, Math.pow(10, places) - 1);
      var decStr = decPart.toString().padStart(places, '0');
      // Remove trailing zeros for cleaner display
      decStr = decStr.replace(/0+$/, '');
      if (decStr === '') return intPart.toString();
      return intPart + '.' + decStr;
    }

    function getDecimalPlaces(str) {
      if (str.indexOf('.') === -1) return 0;
      return str.split('.')[1].length;
    }

    function formatAnswer(num) {
      // Round to avoid floating point issues
      return parseFloat(num.toFixed(4)).toString();
    }

    // ========== 模式1: 对齐演示 ==========
    var alignAnswer = '';
    function newAlignProblem() {
      var isAdd = Math.random() > 0.4;
      var op = isAdd ? '+' : '−';
      var maxPlaces = Random.int(1, 2);
      var a = randDecimal(1, 50, maxPlaces);
      var b = randDecimal(1, 30, maxPlaces);
      var numA = parseFloat(a);
      var numB = parseFloat(b);
      var answer = isAdd ? numA + numB : numA - numB;
      // Ensure positive for subtraction
      if (!isAdd && answer < 0) {
        var tmp = a; a = b; b = tmp;
        numA = parseFloat(a); numB = parseFloat(b);
        answer = numA - numB;
      }
      alignAnswer = formatAnswer(answer);

      var maxDec = Math.max(getDecimalPlaces(a), getDecimalPlaces(b));
      // Pad decimals for alignment display
      var aDec = getDecimalPlaces(a);
      var bDec = getDecimalPlaces(b);
      var aPad = a + (aDec < maxDec ? '0'.repeat(maxDec - aDec) : '');
      var bPad = b + (bDec < maxDec ? '0'.repeat(maxDec - bDec) : '');
      var ansPad = alignAnswer;
      var ansDec = getDecimalPlaces(alignAnswer);
      if (ansDec < maxDec) ansPad = alignAnswer + '0'.repeat(maxDec - ansDec);

      // Build visual
      var html = '';
      html += '<div class="align-row">' + buildDigitRow(aPad, '', '') + '</div>';
      html += '<div class="align-row">' + buildDigitRow(bPad, op, '') + '</div>';
      html += '<div class="align-line"></div>';
      html += '<div class="align-row">' + buildDigitRow(ansPad, '', '') + '</div>';

      document.getElementById('align-visual').innerHTML = html;

      var steps = [
        '① 小数点对齐（' + (maxDec > 1 ? '位数不够的补0' : '对齐到相同位数') + '）',
        '② 从末位开始' + (isAdd ? '相加' : '相减') + (maxDec > 0 ? '，注意进位/退位' : ''),
        '③ 得数的小数点与被加数对齐'
      ];
      document.getElementById('align-step').textContent = steps.join('  →  ');

      var hints = [
        '<strong>💡 关键：</strong>小数加减法的第一要务是<strong>小数点对齐</strong>！',
        '<strong>📝 计算：</strong>' + a + ' ' + op + ' ' + b + ' = <strong>' + alignAnswer + '</strong>',
        maxDec > 0 ? '<strong>🔍 注意：</strong>位数不同时，短的数末尾可以补0再算' : '<strong>🔍 注意：</strong>整数部分直接按整数加减法计算'
      ];
      document.getElementById('align-hint').innerHTML = hints.join('<br>');
    }

    function buildDigitRow(numStr, op, extra) {
      var html = '';
      if (op) html += '<span class="digit op">' + op + '</span>';
      var parts = numStr.split('.');
      for (var i = 0; i < parts[0].length; i++) {
        html += '<span class="digit">' + parts[0][i] + '</span>';
      }
      if (parts.length > 1) {
        html += '<span class="digit dot">.</span>';
        for (var j = 0; j < parts[1].length; j++) {
          html += '<span class="digit">' + parts[1][j] + '</span>';
        }
      }
      if (extra) html += extra;
      return html;
    }

    document.getElementById('btn-new-align').addEventListener('click', function() {
      newAlignProblem();
    });

    // ========== 模式2: 快速计算 ==========
    var calcAnswer = '';
    function newCalcProblem() {
      var isAdd = Math.random() > 0.4;
      var op = isAdd ? '+' : '−';
      var places = Random.int(1, 2);
      var a, b, answer;
      if (isAdd) {
        a = randDecimal(1, 99, places);
        b = randDecimal(1, 99, places);
        answer = parseFloat(a) + parseFloat(b);
      } else {
        a = randDecimal(10, 99, places);
        b = randDecimal(1, parseFloat(a) - 1, places);
        if (parseFloat(b) >= parseFloat(a)) b = randDecimal(1, Math.max(1, Math.floor(parseFloat(a)) - 1), places);
        answer = parseFloat(a) - parseFloat(b);
      }
      calcAnswer = formatAnswer(answer);
      document.getElementById('calc-problem').textContent = a + ' ' + op + ' ' + b + ' = ?';
      document.getElementById('calc-input').value = '';
      document.getElementById('calc-feedback').textContent = '';
      document.getElementById('calc-input').focus();
    }

    function checkCalc() {
      var val = document.getElementById('calc-input').value.trim();
      if (!val) return;
      var fb = document.getElementById('calc-feedback');
      // Accept equivalent forms (e.g., 3.50 == 3.5)
      if (parseFloat(val) === parseFloat(calcAnswer)) {
        fb.textContent = '✅ 正确！太棒了！';
        fb.style.color = '#34C759';
        streak++;
        updateStreak();
        showToast('🎉 答对了！');
        setTimeout(newCalcProblem, 1500);
      } else {
        fb.textContent = '❌ 再想想，注意小数点对齐哦';
        fb.style.color = '#FF3B30';
        streak = 0;
        updateStreak();
      }
    }

    document.getElementById('btn-check-calc').addEventListener('click', checkCalc);
    document.getElementById('calc-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkCalc();
    });
    document.getElementById('btn-new-calc').addEventListener('click', newCalcProblem);

    // ========== 模式3: 应用题 ==========
    var appScenes = [
      { icon: '🛒', items: ['铅笔', '橡皮', '笔记本', '尺子', '文具盒', '彩笔'] },
      { icon: '🍎', items: ['苹果', '香蕉', '橘子', '葡萄', '西瓜', '草莓'] },
      { icon: '📏', items: ['绳子', '布条', '木棍', '丝带', '铁丝'] },
      { icon: '⚖️', items: ['苹果', '大米', '面粉', '糖', '盐'] },
      { icon: '💧', items: ['水杯', '饮料', '牛奶', '果汁'] },
      { icon: '🏃', items: ['跑步', '跳远', '游泳'] }
    ];
    var appUnits = { '🛒': '元', '🍎': '千克', '📏': '米', '⚖️': '千克', '💧': '升', '🏃': '米' };

    function newAppProblem() {
      var scene = Random.pick(appScenes);
      var unit = appUnits[scene.icon];
      var isAdd = Math.random() > 0.35;
      var item1 = Random.pick(scene.items);
      var item2;
      do { item2 = Random.pick(scene.items); } while (item2 === item1);

      var places = Random.int(1, 2);
      var v1, v2, answer, question, options;

      if (isAdd) {
        v1 = randDecimal(1, 30, places);
        v2 = randDecimal(1, 30, places);
        answer = parseFloat(v1) + parseFloat(v2);
        question = '小明买了 <span class="highlight">' + v1 + unit + '</span> 的' + item1 + '，又买了 <span class="highlight">' + v2 + unit + '</span> 的' + item2 + '。一共买了多少' + unit + '？';
      } else {
        v1 = randDecimal(10, 50, places);
        v2 = randDecimal(1, parseFloat(v1) - 0.1, places);
        if (parseFloat(v2) >= parseFloat(v1)) v2 = randDecimal(1, Math.max(1, Math.floor(parseFloat(v1)) - 1), places);
        answer = parseFloat(v1) - parseFloat(v2);
        question = '一根' + item1 + '长 <span class="highlight">' + v1 + unit + '</span>，用掉了 <span class="highlight">' + v2 + unit + '</span>，还剩多少' + unit + '？';
      }
      answer = parseFloat(answer.toFixed(4));

      document.getElementById('app-scene').textContent = scene.icon;
      document.getElementById('app-problem').innerHTML = question;

      // Generate options
      var correctStr = formatAnswer(answer);
      var opts = [correctStr];
      // Wrong answers: common mistakes
      var wrong1 = formatAnswer(parseFloat(v1) + parseFloat(v2) + Random.int(1, 5)); // off by a bit
      var wrong2 = formatAnswer(Math.abs(parseFloat(v1) - parseFloat(v2)) + Random.int(1, 3) * 0.1);
      var wrong3 = formatAnswer(answer + Random.pick([-0.1, 0.1, -1, 1, -0.01, 0.01]));

      // Avoid duplicates
      var allOpts = [correctStr];
      var candidates = [wrong1, wrong2, wrong3, formatAnswer(answer + 1), formatAnswer(answer - 0.1)];
      for (var i = 0; i < candidates.length && allOpts.length < 4; i++) {
        var c = candidates[i];
        if (c !== correctStr && allOpts.indexOf(c) === -1 && parseFloat(c) > 0) {
          allOpts.push(c);
        }
      }
      while (allOpts.length < 4) {
        var r = formatAnswer(answer + Random.int(-5, 5) * 0.1);
        if (r !== correctStr && allOpts.indexOf(r) === -1 && parseFloat(r) >= 0) allOpts.push(r);
      }

      var shuffled = Random.shuffle(allOpts);
      var optHtml = '';
      for (var j = 0; j < shuffled.length; j++) {
        optHtml += '<button class="app-opt" data-val="' + shuffled[j] + '" data-correct="' + correctStr + '">' + shuffled[j] + ' ' + unit + '</button>';
      }
      document.getElementById('app-options').innerHTML = optHtml;

      // Bind events
      document.querySelectorAll('.app-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var val = btn.getAttribute('data-val');
          var correct = btn.getAttribute('data-correct');
          var allBtns = document.querySelectorAll('.app-opt');
          allBtns.forEach(function(b) { b.style.pointerEvents = 'none'; });
          if (val === correct) {
            btn.classList.add('correct');
            streak++;
            updateStreak();
            showToast('🎉 答对了！');
            setTimeout(newAppProblem, 1500);
          } else {
            btn.classList.add('wrong');
            allBtns.forEach(function(b) {
              if (b.getAttribute('data-val') === correct) b.classList.add('correct');
            });
            streak = 0;
            updateStreak();
            setTimeout(newAppProblem, 2000);
          }
        });
      });
    }

    // ========== 模式4: 竖式填空 ==========
    var fillData = null;
    function newFillProblem() {
      var isAdd = Math.random() > 0.4;
      var op = isAdd ? '+' : '−';
      var places = Random.int(1, 2);
      var a, b, answer;

      if (isAdd) {
        a = randDecimal(1, 50, places);
        b = randDecimal(1, 50, places);
        answer = parseFloat(a) + parseFloat(b);
      } else {
        a = randDecimal(10, 80, places);
        b = randDecimal(1, parseFloat(a) - 0.1, places);
        if (parseFloat(b) >= parseFloat(a)) b = randDecimal(1, Math.max(1, Math.floor(parseFloat(a)) - 1), places);
        answer = parseFloat(a) - parseFloat(b);
      }
      answer = parseFloat(answer.toFixed(4));
      var ansStr = formatAnswer(answer);

      // Pick which digit to blank out in the answer
      var ansDigits = ansStr.replace('.', '');
      var blankIdx = Random.int(0, ansDigits.length - 1);
      var blankChar = ansDigits[blankIdx];

      // Build the answer with blank
      var answerParts = [];
      var digitCount = 0;
      for (var i = 0; i < ansStr.length; i++) {
        if (ansStr[i] === '.') {
          answerParts.push({ type: 'dot', val: '.' });
        } else {
          if (digitCount === blankIdx) {
            answerParts.push({ type: 'blank', val: blankChar });
          } else {
            answerParts.push({ type: 'digit', val: ansStr[i] });
          }
          digitCount++;
        }
      }

      fillData = { answer: blankChar, parts: answerParts };

      // Build visual
      var maxDec = Math.max(getDecimalPlaces(a), getDecimalPlaces(b), getDecimalPlaces(ansStr));
      var aPad = padDecimal(a, maxDec);
      var bPad = padDecimal(b, maxDec);

      var html = '';
      html += '<div class="fill-row">' + buildFillDigitRow(aPad, '', '') + '</div>';
      html += '<div class="fill-row">' + buildFillDigitRow(bPad, op, '') + '</div>';
      html += '<div class="fill-line"></div>';
      html += '<div class="fill-row">' + buildFillAnswerRow(answerParts) + '</div>';

      document.getElementById('fill-visual').innerHTML = html;
      document.getElementById('fill-hint').textContent = a + ' ' + op + ' ' + b + ' = ?  填入缺少的数字';
      document.getElementById('fill-feedback').textContent = '';

      // Focus the input
      var inp = document.querySelector('.fill-input');
      if (inp) inp.focus();
    }

    function padDecimal(str, places) {
      if (places === 0) return str;
      var parts = str.split('.');
      if (parts.length === 1) return str + '.' + '0'.repeat(places);
      return str + '0'.repeat(places - parts[1].length);
    }

    function buildFillDigitRow(numStr, op) {
      var html = '';
      if (op) html += '<span class="digit op">' + op + '</span>';
      var parts = numStr.split('.');
      for (var i = 0; i < parts[0].length; i++) {
        html += '<span class="digit">' + parts[0][i] + '</span>';
      }
      if (parts.length > 1) {
        html += '<span class="digit dot">.</span>';
        for (var j = 0; j < parts[1].length; j++) {
          html += '<span class="digit">' + parts[1][j] + '</span>';
        }
      }
      return html;
    }

    function buildFillAnswerRow(parts) {
      var html = '';
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.type === 'dot') {
          html += '<span class="digit dot">.</span>';
        } else if (p.type === 'blank') {
          html += '<input type="text" class="fill-input" maxlength="1" data-answer="' + p.val + '" inputmode="numeric" autocomplete="off">';
        } else {
          html += '<span class="digit">' + p.val + '</span>';
        }
      }
      return html;
    }

    function checkFill() {
      if (!fillData) return;
      var inputs = document.querySelectorAll('.fill-input');
      var allCorrect = true;
      inputs.forEach(function(inp) {
        var val = inp.value.trim();
        var ans = inp.getAttribute('data-answer');
        inp.classList.remove('correct', 'wrong');
        if (val === ans) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('wrong');
          allCorrect = false;
        }
      });
      var fb = document.getElementById('fill-feedback');
      if (allCorrect) {
        fb.textContent = '✅ 完全正确！';
        fb.style.color = '#34C759';
        streak++;
        updateStreak();
        showToast('🎉 竖式填空全对！');
        setTimeout(newFillProblem, 1500);
      } else {
        fb.textContent = '❌ 有些数字不对，再检查一下';
        fb.style.color = '#FF3B30';
        streak = 0;
        updateStreak();
      }
    }

    document.getElementById('btn-check-fill').addEventListener('click', checkFill);
    document.getElementById('btn-new-fill').addEventListener('click', newFillProblem);
    // Enter key in fill inputs
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.target.classList.contains('fill-input')) {
        checkFill();
      }
    });

    // ========== 模式5: 挑战 ==========
    function newChallenge() {
      var type = Random.int(1, 4);
      var question, answer, options;

      if (type === 1) {
        // 比较大小
        var a = randDecimal(1, 50, 2);
        var b = randDecimal(1, 50, 2);
        var op = Random.pick(['+', '−']);
        var c = randDecimal(1, 30, 2);
        var left, right;
        if (op === '+') {
          left = parseFloat(a) + parseFloat(b);
        } else {
          left = parseFloat(a) - parseFloat(b);
          if (left < 0) { var tmp = a; a = b; b = tmp; left = parseFloat(a) - parseFloat(b); }
        }
        right = parseFloat(c);
        var cmp = left > right ? '>' : (left < right ? '<' : '=');
        question = a + ' ' + op + ' ' + b + '  ○  ' + c + '\n○里应该填什么？';
        answer = cmp;
        options = ['>', '<', '=', '≥'];
      } else if (type === 2) {
        // 补全等式
        var a = randDecimal(1, 30, 1);
        var b = randDecimal(1, 30, 1);
        var sum = parseFloat(a) + parseFloat(b);
        question = a + ' + ? = ' + formatAnswer(sum) + '\n? 是多少？';
        answer = formatAnswer(parseFloat(b));
        options = [answer];
        while (options.length < 4) {
          var w = formatAnswer(parseFloat(b) + Random.pick([-1, 1, -0.1, 0.1, 2, -2]));
          if (options.indexOf(w) === -1 && parseFloat(w) > 0) options.push(w);
        }
      } else if (type === 3) {
        // 估算
        var a = randDecimal(10, 99, 1);
        var b = randDecimal(10, 99, 1);
        var sum = parseFloat(a) + parseFloat(b);
        var nearTen = Math.round(sum / 10) * 10;
        question = a + ' + ' + b + ' 最接近哪个数？';
        answer = nearTen.toString();
        options = [answer];
        var candidates = [(nearTen - 10).toString(), (nearTen + 10).toString(), (nearTen + 5).toString(), (nearTen - 5).toString()];
        for (var i = 0; i < candidates.length && options.length < 4; i++) {
          if (options.indexOf(candidates[i]) === -1) options.push(candidates[i]);
        }
      } else {
        // 逆运算
        var a = randDecimal(5, 50, 1);
        var b = randDecimal(1, parseFloat(a), 1);
        var diff = parseFloat(a) - parseFloat(b);
        question = '? − ' + formatAnswer(parseFloat(b)) + ' = ' + formatAnswer(diff) + '\n? 是多少？';
        answer = formatAnswer(parseFloat(a));
        options = [answer];
        while (options.length < 4) {
          var w = formatAnswer(parseFloat(a) + Random.pick([-1, 1, -0.1, 0.1, 5, -5]));
          if (options.indexOf(w) === -1 && parseFloat(w) > 0) options.push(w);
        }
      }

      options = Random.shuffle(options.slice(0, 4));
      document.getElementById('challenge-problem').textContent = question;

      var optHtml = '';
      for (var j = 0; j < options.length; j++) {
        var isCorrect = options[j] === answer ? '1' : '0';
        optHtml += '<button class="challenge-opt" data-correct="' + isCorrect + '">' + options[j] + '</button>';
      }
      document.getElementById('challenge-options').innerHTML = optHtml;

      document.querySelectorAll('.challenge-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var allBtns = document.querySelectorAll('.challenge-opt');
          allBtns.forEach(function(b) { b.style.pointerEvents = 'none'; });
          if (btn.getAttribute('data-correct') === '1') {
            btn.classList.add('correct');
            streak++;
            updateStreak();
            showToast('🎉 挑战成功！');
            setTimeout(newChallenge, 1500);
          } else {
            btn.classList.add('wrong');
            allBtns.forEach(function(b) {
              if (b.getAttribute('data-correct') === '1') b.classList.add('correct');
            });
            streak = 0;
            updateStreak();
            setTimeout(newChallenge, 2000);
          }
        });
      });
    }

    // ========== 初始化 ==========
    newAlignProblem();
    newCalcProblem();
    newAppProblem();
    newFillProblem();
    newChallenge();
  </script>
</body>
