<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识乘法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E65100; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 通用 */
    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }
    .next-btn {
      display: block; margin: 16px auto; padding: 14px 32px; border: none;
      background: #E65100; color: white; border-radius: 12px; font-size: 18px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }

    /* 模式1: 认识概念 - 分组可视化 */
    .explore-area { text-align: center; padding: 20px 16px; }
    .explore-prompt {
      font-size: 17px; color: #1D1D1F; font-weight: 600; margin-bottom: 16px;
      background: white; padding: 14px 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); line-height: 1.8;
    }
    .groups-display {
      display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
      margin: 20px 0; min-height: 80px;
    }
    .group-box {
      background: white; border: 3px solid #FF9800; border-radius: 16px;
      padding: 12px; min-width: 70px; display: flex; flex-wrap: wrap;
      gap: 4px; justify-content: center; align-items: center;
      box-shadow: 0 2px 8px rgba(255,152,0,0.15);
      transition: all 0.3s ease;
    }
    .group-box.pop { animation: popIn 0.3s ease both; }
    .group-obj { font-size: 28px; }
    .explore-equation {
      font-size: 28px; font-weight: 700; color: #E65100; margin: 16px 0;
      background: #FFF3E0; padding: 12px 20px; border-radius: 12px;
      display: inline-block;
    }
    .explore-mul {
      font-size: 24px; font-weight: 700; color: #2E7D32; margin: 8px 0;
      background: #E8F5E9; padding: 10px 18px; border-radius: 12px;
      display: inline-block;
    }
    .explore-arrow { font-size: 28px; color: #E65100; margin: 8px 0; }
    .explore-nav { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .explore-btn {
      padding: 12px 24px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .explore-btn:active { transform: scale(0.92); }
    .explore-btn.prev { background: #E5E5EA; color: #1D1D1F; }
    .explore-btn.next { background: #E65100; color: white; }
    .explore-counter { font-size: 14px; color: #6E6E73; margin-top: 12px; }

    /* 模式2: 转换练习 - 加法转乘法 */
    .convert-area { text-align: center; padding: 20px 16px; }
    .convert-problem {
      font-size: 32px; font-weight: 700; color: #E65100; margin: 16px 0;
      background: white; display: inline-block; padding: 16px 28px;
      border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .convert-visual {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin: 16px 0;
    }
    .convert-group {
      background: #FFF3E0; border-radius: 12px; padding: 8px 12px;
      display: flex; gap: 4px;
    }
    .convert-group span { font-size: 24px; }
    .convert-input-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin: 20px 0; font-size: 32px; font-weight: 700; color: #E65100;
    }
    .convert-blank {
      width: 56px; height: 48px; border: 3px dashed #FFB74D;
      border-radius: 10px; display: inline-flex; align-items: center;
      justify-content: center; font-size: 28px; font-weight: 700;
      background: #FFF3E0; color: #E65100; transition: all 0.3s ease;
    }
    .convert-blank.filled { border-style: solid; border-color: #E65100; }
    .convert-blank.correct { border-color: #34C759; background: rgba(52,199,89,0.1); color: #34C759; }
    .convert-blank.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .convert-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0;
    }
    .convert-opt {
      width: 56px; height: 56px; border: 3px solid #E0E0E0; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .convert-opt:active { transform: scale(0.9); }
    .convert-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .convert-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式3: 速算练习 */
    .quiz-area { text-align: center; padding: 20px 16px; }
    .quiz-problem {
      font-size: 48px; font-weight: 800; color: #E65100; margin: 20px 0;
      background: white; display: inline-block; padding: 16px 32px;
      border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .quiz-hint {
      font-size: 15px; color: #6E6E73; margin-bottom: 12px;
    }
    .quiz-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 320px; margin: 16px auto;
    }
    .quiz-opt {
      padding: 16px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .quiz-opt:active { transform: scale(0.92); }
    .quiz-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .quiz-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式4: 判断对错 */
    .judge-area { text-align: center; padding: 20px 16px; }
    .judge-statement {
      font-size: 22px; font-weight: 600; color: #1D1D1F; margin: 20px 0;
      background: white; padding: 20px 24px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); line-height: 1.8;
    }
    .judge-visual {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0;
    }
    .judge-group {
      background: #FFF3E0; border-radius: 10px; padding: 6px 10px;
      display: flex; gap: 3px;
    }
    .judge-group span { font-size: 22px; }
    .judge-btns { display: flex; gap: 16px; justify-content: center; margin: 20px 0; }
    .judge-btn {
      padding: 16px 40px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .judge-btn:active { transform: scale(0.9); }
    .judge-btn.true-btn { color: #2E7D32; }
    .judge-btn.false-btn { color: #C62828; }
    .judge-btn.correct { border-color: #34C759; background: rgba(52,199,89,0.15); }
    .judge-btn.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }

    /* 动画 */
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .bounce { animation: bounce 0.4s ease; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a>
      <span class="breadcrumb-sep">›</span>
      <a href="../index.html" class="breadcrumb-item">📐 数学</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">认识乘法</span>
    </nav>

    <div style="text-align:center;padding:20px 0 8px;">
      <div style="font-size:48px;">✖️</div>
      <h1 style="font-size:24px;font-weight:700;color:#1D1D1F;margin:8px 0;">认识乘法</h1>
      <p style="font-size:14px;color:#6E6E73;">二年级 · 乘法的含义与基础</p>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="explore">🎯 认识概念</button>
      <button class="mode-tab" data-mode="convert">🔄 加法转乘法</button>
      <button class="mode-tab" data-mode="quiz">⚡ 乘法速算</button>
      <button class="mode-tab" data-mode="judge">✅ 判断对错</button>
    </div>

    <!-- 模式1: 认识概念 -->
    <div id="mode-explore" class="mode-content active">
      <div class="explore-area">
        <div class="section-title">🎯 看看几组一样的</div>
        <div class="section-desc">每组数量相同，就可以用乘法！</div>
        <div id="explore-display"></div>
        <div class="explore-nav">
          <button class="explore-btn prev" id="explore-prev">◀ 上一题</button>
          <button class="explore-btn next" id="explore-next">下一题 ▶</button>
        </div>
        <div class="explore-counter" id="explore-counter"></div>
      </div>
    </div>

    <!-- 模式2: 加法转乘法 -->
    <div id="mode-convert" class="mode-content">
      <div class="convert-area">
        <div class="section-title">🔄 把加法变成乘法</div>
        <div class="section-desc">相同的数相加，可以写成乘法</div>
        <div class="score-bar">
          <span>✅ <span id="convert-correct">0</span></span>
          <span>❌ <span id="convert-wrong">0</span></span>
        </div>
        <div id="convert-display"></div>
        <div class="result-text" id="convert-result"></div>
        <button class="next-btn" id="convert-next" style="display:none;">下一题 ▶</button>
      </div>
    </div>

    <!-- 模式3: 乘法速算 -->
    <div id="mode-quiz" class="mode-content">
      <div class="quiz-area">
        <div class="section-title">⚡ 乘法速算</div>
        <div class="section-desc">算出乘法的结果</div>
        <div class="score-bar">
          <span>✅ <span id="quiz-correct">0</span></span>
          <span>❌ <span id="quiz-wrong">0</span></span>
        </div>
        <div id="quiz-display"></div>
        <div class="result-text" id="quiz-result"></div>
        <button class="next-btn" id="quiz-next" style="display:none;">下一题 ▶</button>
      </div>
    </div>

    <!-- 模式4: 判断对错 -->
    <div id="mode-judge" class="mode-content">
      <div class="judge-area">
        <div class="section-title">✅ 判断对错</div>
        <div class="section-desc">看看说得对不对</div>
        <div class="score-bar">
          <span>✅ <span id="judge-correct">0</span></span>
          <span>❌ <span id="judge-wrong">0</span></span>
        </div>
        <div id="judge-display"></div>
        <div class="result-text" id="judge-result"></div>
        <button class="next-btn" id="judge-next" style="display:none;">下一题 ▶</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    // ====== Tab切换 ======
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
      });
    });

    // ====== 工具函数 ======
    var emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '⭐', '🌸', '🐟', '🎈', '🍪'];
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // ====== 模式1: 认识概念 ======
    var exploreExamples = [
      { groups: 2, each: 3, emoji: '🍎' },
      { groups: 3, each: 2, emoji: '🍊' },
      { groups: 4, each: 2, emoji: '⭐' },
      { groups: 2, each: 4, emoji: '🍇' },
      { groups: 3, each: 3, emoji: '🌸' },
      { groups: 5, each: 2, emoji: '🐟' },
      { groups: 2, each: 5, emoji: '🎈' },
      { groups: 4, each: 3, emoji: '🍪' },
      { groups: 3, each: 4, emoji: '🍓' },
      { groups: 5, each: 3, emoji: '🍋' },
      { groups: 6, each: 2, emoji: '⭐' },
      { groups: 2, each: 6, emoji: '🍎' },
      { groups: 4, each: 4, emoji: '🍊' },
      { groups: 3, each: 5, emoji: '🌸' },
      { groups: 5, each: 4, emoji: '🐟' }
    ];
    var exploreIdx = 0;

    function renderExplore() {
      var ex = exploreExamples[exploreIdx];
      var container = document.getElementById('explore-display');
      var html = '<div class="explore-prompt">有 <strong>' + ex.groups + '</strong> 组，每组 <strong>' + ex.each + '</strong> 个</div>';
      html += '<div class="groups-display">';
      for (var g = 0; g < ex.groups; g++) {
        html += '<div class="group-box pop" style="animation-delay:' + (g * 0.1) + 's">';
        for (var o = 0; o < ex.each; o++) {
          html += '<span class="group-obj">' + ex.emoji + '</span>';
        }
        html += '</div>';
      }
      html += '</div>';

      // 加法算式
      var addParts = [];
      for (var i = 0; i < ex.groups; i++) addParts.push(ex.each);
      html += '<div class="explore-equation">' + addParts.join(' + ') + ' = ' + (ex.groups * ex.each) + '</div>';
      html += '<div class="explore-arrow">↓</div>';
      html += '<div class="explore-mul">' + ex.groups + ' × ' + ex.each + ' = ' + (ex.groups * ex.each) + '</div>';
      html += '<div style="font-size:14px;color:#6E6E73;margin-top:8px;">读作：' + ex.groups + ' 乘 ' + ex.each + ' 等于 ' + (ex.groups * ex.each) + '</div>';

      container.innerHTML = html;
      document.getElementById('explore-counter').textContent = (exploreIdx + 1) + ' / ' + exploreExamples.length;
    }

    document.getElementById('explore-prev').addEventListener('click', function() {
      exploreIdx = (exploreIdx - 1 + exploreExamples.length) % exploreExamples.length;
      renderExplore();
    });
    document.getElementById('explore-next').addEventListener('click', function() {
      exploreIdx = (exploreIdx + 1) % exploreExamples.length;
      renderExplore();
    });
    renderExplore();

    // ====== 模式2: 加法转乘法 ======
    var convertState = { correct: 0, wrong: 0, current: null, answered: false, blankIdx: 0 };

    function genConvert() {
      var a = randInt(2, 6);
      var n = randInt(2, 5);
      var sum = a * n;
      convertState.current = { addend: a, count: n, sum: sum };
      convertState.answered = false;
      convertState.blankIdx = 0;
      renderConvert();
    }

    function renderConvert() {
      var c = convertState.current;
      var container = document.getElementById('convert-display');
      var html = '';

      // 可视化分组
      html += '<div class="convert-visual">';
      var emoji = emojis[randInt(0, emojis.length - 1)];
      for (var g = 0; g < c.count; g++) {
        html += '<div class="convert-group">';
        for (var o = 0; o < c.addend; o++) {
          html += '<span>' + emoji + '</span>';
        }
        html += '</div>';
      }
      html += '</div>';

      // 加法算式
      var addParts = [];
      for (var i = 0; i < c.count; i++) addParts.push(c.addend);
      html += '<div class="convert-problem">' + addParts.join(' + ') + ' = ' + c.sum + '</div>';

      // 乘法填空: _ × _ = sum
      html += '<div class="convert-input-row">';
      html += '<span class="convert-blank" id="blank-0">?</span>';
      html += '<span>×</span>';
      html += '<span class="convert-blank" id="blank-1">?</span>';
      html += '<span>=</span>';
      html += '<span>' + c.sum + '</span>';
      html += '</div>';

      // 选项（包含正确答案和干扰项）
      var opts = new Set([c.count, c.addend]);
      while (opts.size < 6) {
        var v = randInt(2, 9);
        opts.add(v);
      }
      var shuffled = shuffle(Array.from(opts));
      html += '<div class="convert-options" id="convert-options">';
      shuffled.forEach(function(v) {
        html += '<button class="convert-opt" data-val="' + v + '">' + v + '</button>';
      });
      html += '</div>';
      html += '<div style="font-size:14px;color:#6E6E73;margin-top:8px;">依次选出两个乘数（先选第几个，再选每几个）</div>';

      container.innerHTML = html;
      document.getElementById('convert-result').textContent = '';
      document.getElementById('convert-next').style.display = 'none';

      // 绑定选项点击
      document.querySelectorAll('.convert-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (convertState.answered && convertState.blankIdx >= 2) return;
          handleConvertAnswer(parseInt(btn.dataset.val), btn);
        });
      });
    }

    function handleConvertAnswer(val, btn) {
      var c = convertState.current;
      var blank = document.getElementById('blank-' + convertState.blankIdx);
      var expected = convertState.blankIdx === 0 ? c.count : c.addend;

      if (val === expected) {
        blank.textContent = val;
        blank.classList.add('filled', 'correct');
        btn.classList.add('correct');
        btn.disabled = true;
        convertState.blankIdx++;

        if (convertState.blankIdx >= 2) {
          convertState.answered = true;
          convertState.correct++;
          document.getElementById('convert-correct').textContent = convertState.correct;
          document.getElementById('convert-result').textContent = '🎉 太棒了！' + c.count + ' × ' + c.addend + ' = ' + c.sum;
          document.getElementById('convert-result').style.color = '#34C759';
          document.getElementById('convert-next').style.display = 'block';
          // 禁用所有按钮
          document.querySelectorAll('.convert-opt').forEach(function(b) { b.disabled = true; });
          setTimeout(genConvert, 1500);
        }
      } else {
        blank.classList.add('wrong');
        btn.classList.add('wrong');
        btn.disabled = true;
        setTimeout(function() {
          blank.classList.remove('wrong');
        }, 600);
        convertState.wrong++;
        document.getElementById('convert-wrong').textContent = convertState.wrong;
      }
    }

    document.getElementById('convert-next').addEventListener('click', function() { genConvert(); });
    genConvert();

    // ====== 模式3: 乘法速算 ======
    var quizState = { correct: 0, wrong: 0, current: null, answered: false };

    function genQuiz() {
      var a = randInt(1, 9);
      var b = randInt(1, 9);
      quizState.current = { a: a, b: b, answer: a * b };
      quizState.answered = false;
      renderQuiz();
    }

    function renderQuiz() {
      var c = quizState.current;
      var container = document.getElementById('quiz-display');
      var html = '';
      html += '<div class="quiz-problem">' + c.a + ' × ' + c.b + ' = ?</div>';
      html += '<div class="quiz-hint">' + c.a + ' 个 ' + c.b + ' 相加是多少？</div>';

      // 生成选项
      var opts = new Set([c.answer]);
      while (opts.size < 4) {
        var offset = randInt(-5, 5);
        var v = c.answer + offset;
        if (v > 0 && v !== c.answer) opts.add(v);
      }
      var shuffled = shuffle(Array.from(opts));
      html += '<div class="quiz-options">';
      shuffled.forEach(function(v) {
        html += '<button class="quiz-opt" data-val="' + v + '">' + v + '</button>';
      });
      html += '</div>';

      container.innerHTML = html;
      document.getElementById('quiz-result').textContent = '';
      document.getElementById('quiz-next').style.display = 'none';

      document.querySelectorAll('.quiz-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (quizState.answered) return;
          handleQuizAnswer(parseInt(btn.dataset.val), btn);
        });
      });
    }

    function handleQuizAnswer(val, btn) {
      var c = quizState.current;
      quizState.answered = true;

      if (val === c.answer) {
        btn.classList.add('correct');
        quizState.correct++;
        document.getElementById('quiz-correct').textContent = quizState.correct;
        document.getElementById('quiz-result').textContent = '🎉 正确！' + c.a + ' × ' + c.b + ' = ' + c.answer;
        document.getElementById('quiz-result').style.color = '#34C759';
      } else {
        btn.classList.add('wrong');
        quizState.wrong++;
        document.getElementById('quiz-wrong').textContent = quizState.wrong;
        document.getElementById('quiz-result').textContent = '😅 正确答案是 ' + c.answer;
        document.getElementById('quiz-result').style.color = '#FF3B30';
        // 高亮正确答案
        document.querySelectorAll('.quiz-opt').forEach(function(b) {
          if (parseInt(b.dataset.val) === c.answer) b.classList.add('correct');
        });
      }

      document.querySelectorAll('.quiz-opt').forEach(function(b) { b.disabled = true; });
      document.getElementById('quiz-next').style.display = 'block';
      setTimeout(genQuiz, 1500);
    }

    document.getElementById('quiz-next').addEventListener('click', function() { genQuiz(); });
    genQuiz();

    // ====== 模式4: 判断对错 ======
    var judgeState = { correct: 0, wrong: 0, current: null, answered: false };

    function genJudge() {
      var type = randInt(1, 4);
      var isCorrect = Math.random() > 0.5;
      var stmt, visual, answer;

      if (type === 1) {
        // 加法等式 vs 乘法等式是否匹配
        var a = randInt(2, 5), n = randInt(2, 5);
        var sum = a * n;
        var addParts = [];
        for (var i = 0; i < n; i++) addParts.push(a);
        var addStr = addParts.join(' + ') + ' = ' + sum;
        var wrongMul = isCorrect ? (n + ' × ' + a + ' = ' + sum) : (n + ' × ' + a + ' = ' + (sum + randInt(1, 3)));
        stmt = addStr + ' 可以写成 ' + wrongMul;
        visual = { groups: n, each: a };
        answer = isCorrect;
      } else if (type === 2) {
        // "几个几相加" 描述是否正确
        var a = randInt(2, 6), n = randInt(2, 5);
        var sum = a * n;
        if (isCorrect) {
          stmt = n + ' 个 ' + a + ' 相加，结果是 ' + sum;
        } else {
          var wrongResult = sum + randInt(1, 4) * (Math.random() > 0.5 ? 1 : -1);
          if (wrongResult <= 0) wrongResult = sum + 2;
          stmt = n + ' 个 ' + a + ' 相加，结果是 ' + wrongResult;
        }
        visual = { groups: n, each: a };
        answer = isCorrect;
      } else if (type === 3) {
        // 乘法算式含义
        var a = randInt(2, 5), b = randInt(2, 5);
        var prod = a * b;
        if (isCorrect) {
          stmt = a + ' × ' + b + ' 表示 ' + a + ' 个 ' + b + ' 相加';
        } else {
          var wrongB = b + randInt(1, 2);
          stmt = a + ' × ' + b + ' 表示 ' + a + ' 个 ' + wrongB + ' 相加';
        }
        visual = { groups: a, each: b };
        answer = isCorrect;
      } else {
        // 交换律
        var a = randInt(2, 6), b = randInt(2, 6);
        if (isCorrect) {
          stmt = a + ' × ' + b + ' 和 ' + b + ' × ' + a + ' 结果一样';
        } else {
          stmt = a + ' × ' + b + ' 和 ' + b + ' × ' + a + ' 结果不一样';
        }
        visual = { groups: a, each: b };
        answer = isCorrect;
      }

      judgeState.current = { stmt: stmt, visual: visual, answer: answer };
      judgeState.answered = false;
      renderJudge();
    }

    function renderJudge() {
      var c = judgeState.current;
      var container = document.getElementById('judge-display');
      var html = '';

      html += '<div class="judge-statement">' + c.stmt + '</div>';

      // 可视化辅助
      if (c.visual) {
        var emoji = emojis[randInt(0, emojis.length - 1)];
        html += '<div class="judge-visual">';
        for (var g = 0; g < Math.min(c.visual.groups, 6); g++) {
          html += '<div class="judge-group">';
          for (var o = 0; o < Math.min(c.visual.each, 6); o++) {
            html += '<span>' + emoji + '</span>';
          }
          html += '</div>';
        }
        html += '</div>';
      }

      html += '<div class="judge-btns">';
      html += '<button class="judge-btn true-btn" data-val="true">✅ 对</button>';
      html += '<button class="judge-btn false-btn" data-val="false">❌ 错</button>';
      html += '</div>';

      container.innerHTML = html;
      document.getElementById('judge-result').textContent = '';
      document.getElementById('judge-next').style.display = 'none';

      document.querySelectorAll('.judge-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (judgeState.answered) return;
          handleJudgeAnswer(btn.dataset.val === 'true', btn);
        });
      });
    }

    function handleJudgeAnswer(val, btn) {
      var c = judgeState.current;
      judgeState.answered = true;
      var isRight = (val === c.answer);

      if (isRight) {
        btn.classList.add('correct');
        judgeState.correct++;
        document.getElementById('judge-correct').textContent = judgeState.correct;
        document.getElementById('judge-result').textContent = '🎉 判断正确！';
        document.getElementById('judge-result').style.color = '#34C759';
      } else {
        btn.classList.add('wrong');
        judgeState.wrong++;
        document.getElementById('judge-wrong').textContent = judgeState.wrong;
        var correctText = c.answer ? '这句话是对的' : '这句话是错的';
        document.getElementById('judge-result').textContent = '😅 其实' + correctText;
        document.getElementById('judge-result').style.color = '#FF3B30';
        // 高亮正确按钮
        document.querySelectorAll('.judge-btn').forEach(function(b) {
          if ((b.dataset.val === 'true') === c.answer) b.classList.add('correct');
        });
      }

      document.querySelectorAll('.judge-btn').forEach(function(b) { b.disabled = true; });
      document.getElementById('judge-next').style.display = 'block';
      setTimeout(genJudge, 1500);
    }

    document.getElementById('judge-next').addEventListener('click', function() { genJudge(); });
    genJudge();

  })();
  </script>
</body>
