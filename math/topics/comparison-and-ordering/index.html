<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>比大小与排序</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #2E7D32; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 数轴模式 */
    .numberline-wrap { text-align: center; padding: 24px 16px; }
    .numberline-svg { width: 100%; max-width: 500px; height: 120px; margin: 16px auto; }
    .nl-compare { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0; }
    .nl-num { font-size: 40px; font-weight: 800; color: #2E7D32; min-width: 80px; text-align: center; }
    .nl-circle { width: 64px; height: 64px; border: 3px solid #9CA3AF; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .nl-circle:active { transform: scale(0.9); }
    .nl-circle.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .nl-circle.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 排序模式 */
    .sort-wrap { text-align: center; padding: 16px; }
    .sort-instruction { font-size: 20px; font-weight: 600; color: #1D1D1F; margin: 12px 0; }
    .sort-direction { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
    .sort-dir-btn { padding: 10px 20px; border: 2px solid #9CA3AF; background: white; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .sort-dir-btn.active { border-color: #2E7D32; background: #2E7D32; color: white; }
    .sort-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; min-height: 80px; padding: 16px; background: #F8F9FE; border-radius: 16px; }
    .sort-item { padding: 16px 24px; background: white; border: 3px solid #2E7D32; border-radius: 16px; font-size: 24px; font-weight: 700; color: #2E7D32; cursor: grab; user-select: none; transition: all 0.2s ease; touch-action: none; }
    .sort-item:active { cursor: grabbing; transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .sort-item.dragging { opacity: 0.5; }
    .sort-item.placed { background: #2E7D32; color: white; }
    .sort-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; min-height: 80px; padding: 16px; border: 3px dashed #9CA3AF; border-radius: 16px; }
    .sort-slot { width: 80px; height: 64px; border: 2px dashed #9CA3AF; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #9CA3AF; transition: all 0.2s ease; }
    .sort-slot.filled { border-style: solid; border-color: #2E7D32; background: rgba(46,125,50,0.05); }
    .sort-slot.highlight { border-color: #2E7D32; background: rgba(46,125,50,0.1); }
    .sort-check-btn { display: block; margin: 16px auto; padding: 14px 32px; border: none; background: #2E7D32; color: white; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .sort-check-btn:active { transform: scale(0.95); }

    /* 找位置模式 */
    .position-wrap { text-align: center; padding: 16px; }
    .position-question { font-size: 20px; font-weight: 600; margin: 16px 0; }
    .position-target { font-size: 48px; font-weight: 800; color: #2E7D32; margin: 12px 0; }
    .position-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 400px; margin: 20px auto; }
    .pos-opt { padding: 20px; border: 3px solid #9CA3AF; background: white; border-radius: 16px; font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .pos-opt:active { transform: scale(0.95); }
    .pos-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .pos-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 挑战模式 */
    .challenge-wrap { text-align: center; padding: 16px; }
    .ch-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; font-weight: 600; }
    .ch-problem { font-size: 24px; font-weight: 700; color: #1D1D1F; margin: 20px 0; min-height: 40px; }
    .ch-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .ch-opt { padding: 16px 24px; border: 3px solid #9CA3AF; background: white; border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; min-width: 100px; }
    .ch-opt:active { transform: scale(0.9); }
    .ch-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .ch-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .ch-start-btn { display: block; margin: 20px auto; padding: 16px 32px; border: none; background: #2E7D32; color: white; border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(46,125,50,0.3); }
    .ch-start-btn:active { transform: scale(0.95); }

    .next-btn { display: block; margin: 16px auto; padding: 14px 32px; border: none; background: #2E7D32; color: white; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .next-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">⚖️ 比大小与排序</span>
    </nav>

    <div class="score-bar"><span>⭐ 得分：</span><span id="score">0</span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="numberline">📏 数轴比大小</button>
      <button class="mode-tab" data-mode="sort">🔢 排序</button>
      <button class="mode-tab" data-mode="position">📍 找位置</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 数轴比大小 -->
    <div class="mode-content active" id="mode-numberline">
      <div class="numberline-wrap">
        <div class="section-title">📏 数轴比大小</div>
        <div class="section-desc">在数轴上找到两个数，右边的数更大</div>
        <svg class="numberline-svg" id="nlSvg" viewBox="0 0 500 120"></svg>
        <div class="nl-compare">
          <div class="nl-num" id="nlNum1">?</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="nl-circle" data-ans="gt" id="nlGt">&gt;</div>
            <div class="nl-circle" data-ans="eq" id="nlEq">=</div>
            <div class="nl-circle" data-ans="lt" id="nlLt">&lt;</div>
          </div>
          <div class="nl-num" id="nlNum2">?</div>
        </div>
        <div class="result-text" id="nlResult"></div>
      </div>
    </div>

    <!-- 模式2: 排序 -->
    <div class="mode-content" id="mode-sort">
      <div class="sort-wrap">
        <div class="section-title">🔢 排序</div>
        <div class="sort-instruction" id="sortInstruction">把数字从小到大排列</div>
        <div class="sort-direction">
          <button class="sort-dir-btn active" data-dir="asc" id="dirAsc">从小到大 ↑</button>
          <button class="sort-dir-btn" data-dir="desc" id="dirDesc">从大到小 ↓</button>
        </div>
        <div class="sort-items" id="sortItems"></div>
        <div class="sort-slots" id="sortSlots"></div>
        <button class="sort-check-btn" id="sortCheck">✓ 检查答案</button>
        <button class="next-btn" id="sortNext" style="display:none;">下一题 →</button>
        <div class="result-text" id="sortResult"></div>
      </div>
    </div>

    <!-- 模式3: 找位置 -->
    <div class="mode-content" id="mode-position">
      <div class="position-wrap">
        <div class="section-title">📍 找位置</div>
        <div class="section-desc">找出这个数在序列中应该排在第几</div>
        <div class="position-question">数字 <span class="position-target" id="posTarget">?</span> 应该排在哪里？</div>
        <div style="font-size:16px;color:#6E6E73;margin:12px 0;" id="posSequence"></div>
        <div class="position-options" id="posOptions"></div>
        <div class="result-text" id="posResult"></div>
      </div>
    </div>

    <!-- 模式4: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-wrap">
        <div class="section-title">🏆 限时挑战</div>
        <div class="ch-score">
          <span>✅ <span id="chCorrect">0</span></span>
          <span>❌ <span id="chWrong">0</span></span>
          <span>⏱️ <span id="chTime">60</span>s</span>
        </div>
        <div class="ch-problem" id="chProblem">点击开始按钮</div>
        <div class="ch-options" id="chOptions"></div>
        <button class="ch-start-btn" id="chStart">开始挑战！</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    (function() {
      'use strict';
      var score = 0;
      function updateScore(n) { score += n; document.getElementById('score').textContent = score; }

      // ===== 模式切换 =====
      document.querySelectorAll('.mode-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.mode-tab').forEach(function(b) { b.classList.remove('active'); });
          document.querySelectorAll('.mode-content').forEach(function(c) { c.classList.remove('active'); });
          btn.classList.add('active');
          document.getElementById('mode-' + btn.dataset.mode).classList.add('active');
          if (typeof Sound !== 'undefined') Sound.play('click');
        });
      });

      // ===== 工具函数 =====
      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function shuffle(arr) { for (var i = arr.length - 1; i > 0; i--) { var j = randInt(0, i); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

      // ===== 模式1: 数轴比大小 =====
      var nlA, nlB, nlMin, nlMax;
      function newNumberline() {
        var range = randInt(1, 3);
        if (range === 1) { nlMin = randInt(0, 20); nlMax = nlMin + randInt(5, 15); }
        else if (range === 2) { nlMin = randInt(0, 100); nlMax = nlMin + randInt(20, 80); }
        else { nlMin = randInt(0, 1000); nlMax = nlMin + randInt(100, 500); }
        nlA = randInt(nlMin, nlMax);
        nlB = randInt(nlMin, nlMax);
        document.getElementById('nlNum1').textContent = nlA;
        document.getElementById('nlNum2').textContent = nlB;
        document.getElementById('nlResult').textContent = '';
        document.querySelectorAll('.nl-circle').forEach(function(c) { c.classList.remove('correct', 'wrong'); });
        drawNumberline();
      }
      function drawNumberline() {
        var svg = document.getElementById('nlSvg');
        var w = 500, h = 120, pad = 40;
        var span = nlMax - nlMin || 1;
        var xA = pad + (nlA - nlMin) / span * (w - 2 * pad);
        var xB = pad + (nlB - nlMin) / span * (w - 2 * pad);
        var html = '<line x1="' + pad + '" y1="60" x2="' + (w - pad) + '" y2="60" stroke="#9CA3AF" stroke-width="3"/>';
        for (var i = 0; i <= 5; i++) {
          var x = pad + i / 5 * (w - 2 * pad);
          var val = Math.round(nlMin + i / 5 * span);
          html += '<line x1="' + x + '" y1="55" x2="' + x + '" y2="65" stroke="#9CA3AF" stroke-width="2"/>';
          html += '<text x="' + x + '" y="85" text-anchor="middle" font-size="12" fill="#6E6E73">' + val + '</text>';
        }
        html += '<circle cx="' + xA + '" cy="40" r="10" fill="#2E7D32"/>';
        html += '<text x="' + xA + '" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">' + nlA + '</text>';
        html += '<circle cx="' + xB + '" cy="40" r="10" fill="#FF9500"/>';
        html += '<text x="' + xB + '" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FF9500">' + nlB + '</text>';
        svg.innerHTML = html;
      }
      document.querySelectorAll('.nl-circle').forEach(function(c) {
        c.addEventListener('click', function() {
          var ans = c.dataset.ans;
          var correct = nlA > nlB ? 'gt' : (nlA < nlB ? 'lt' : 'eq');
          if (ans === correct) {
            c.classList.add('correct');
            document.getElementById('nlResult').textContent = '✅ 正确！';
            document.getElementById('nlResult').style.color = '#34C759';
            updateScore(1);
            if (typeof Sound !== 'undefined') Sound.play('correct');
            setTimeout(newNumberline, 1500);
          } else {
            c.classList.add('wrong');
            document.getElementById('nlResult').textContent = '❌ 再想想';
            document.getElementById('nlResult').style.color = '#FF3B30';
            if (typeof Sound !== 'undefined') Sound.play('wrong');
            setTimeout(function() { c.classList.remove('wrong'); }, 800);
          }
        });
      });
      newNumberline();

      // ===== 模式2: 排序 =====
      var sortNums = [], sortDir = 'asc', sortPlaced = [];
      function newSort() {
        var count = randInt(4, 6);
        var max = count <= 4 ? 50 : 100;
        sortNums = [];
        while (sortNums.length < count) {
          var n = randInt(1, max);
          if (sortNums.indexOf(n) === -1) sortNums.push(n);
        }
        sortPlaced = [];
        document.getElementById('sortResult').textContent = '';
        document.getElementById('sortNext').style.display = 'none';
        renderSort();
      }
      function renderSort() {
        var itemsEl = document.getElementById('sortItems');
        var slotsEl = document.getElementById('sortSlots');
        itemsEl.innerHTML = '';
        slotsEl.innerHTML = '';
        var shuffled = shuffle(sortNums.slice());
        shuffled.forEach(function(n) {
          if (sortPlaced.indexOf(n) === -1) {
            var el = document.createElement('div');
            el.className = 'sort-item';
            el.textContent = n;
            el.dataset.num = n;
            el.addEventListener('click', function() { pickSortItem(n, el); });
            itemsEl.appendChild(el);
          }
        });
        for (var i = 0; i < sortNums.length; i++) {
          var slot = document.createElement('div');
          slot.className = 'sort-slot';
          if (sortPlaced[i] !== undefined) {
            slot.classList.add('filled');
            slot.textContent = sortPlaced[i];
          } else {
            slot.textContent = (i + 1);
          }
          slotsEl.appendChild(slot);
        }
      }
      function pickSortItem(n, el) {
        sortPlaced.push(n);
        if (typeof Sound !== 'undefined') Sound.play('click');
        renderSort();
        if (sortPlaced.length === sortNums.length) {
          checkSort();
        }
      }
      function checkSort() {
        var sorted = sortNums.slice().sort(function(a, b) { return sortDir === 'asc' ? a - b : b - a; });
        var ok = true;
        for (var i = 0; i < sorted.length; i++) {
          if (sortPlaced[i] !== sorted[i]) { ok = false; break; }
        }
        var res = document.getElementById('sortResult');
        if (ok) {
          res.textContent = '✅ 完全正确！';
          res.style.color = '#34C759';
          updateScore(2);
          if (typeof Sound !== 'undefined') Sound.play('correct');
          document.getElementById('sortNext').style.display = 'block';
        } else {
          res.textContent = '❌ 顺序不对，再试试！';
          res.style.color = '#FF3B30';
          if (typeof Sound !== 'undefined') Sound.play('wrong');
          setTimeout(function() { sortPlaced = []; renderSort(); res.textContent = ''; }, 1200);
        }
      }
      document.getElementById('sortCheck').addEventListener('click', function() {
        if (sortPlaced.length === sortNums.length) checkSort();
        else { document.getElementById('sortResult').textContent = '请先放完所有数字'; document.getElementById('sortResult').style.color = '#FF9500'; }
      });
      document.getElementById('sortNext').addEventListener('click', newSort);
      document.querySelectorAll('.sort-dir-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.sort-dir-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          sortDir = btn.dataset.dir;
          document.getElementById('sortInstruction').textContent = sortDir === 'asc' ? '把数字从小到大排列' : '把数字从大到小排列';
          sortPlaced = [];
          renderSort();
          document.getElementById('sortResult').textContent = '';
          document.getElementById('sortNext').style.display = 'none';
        });
      });
      newSort();

      // ===== 模式3: 找位置 =====
      var posSeq, posNum, posAnswer;
      function newPosition() {
        var count = randInt(4, 6);
        var max = 50;
        posSeq = [];
        while (posSeq.length < count) {
          var n = randInt(1, max);
          if (posSeq.indexOf(n) === -1) posSeq.push(n);
        }
        posSeq.sort(function(a, b) { return a - b; });
        posNum = randInt(1, max);
        while (posSeq.indexOf(posNum) !== -1) posNum = randInt(1, max);
        var sorted = posSeq.concat([posNum]).sort(function(a, b) { return a - b; });
        posAnswer = sorted.indexOf(posNum) + 1;
        document.getElementById('posTarget').textContent = posNum;
        document.getElementById('posSequence').textContent = '已排序的数：' + posSeq.join(', ');
        document.getElementById('posResult').textContent = '';
        var optsEl = document.getElementById('posOptions');
        optsEl.innerHTML = '';
        var options = [];
        for (var i = 1; i <= count + 1; i++) options.push(i);
        shuffle(options);
        options.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.className = 'pos-opt';
          btn.textContent = '第' + opt + '个';
          btn.dataset.pos = opt;
          btn.addEventListener('click', function() { checkPosition(opt, btn); });
          optsEl.appendChild(btn);
        });
      }
      function checkPosition(pos, btn) {
        if (pos === posAnswer) {
          btn.classList.add('correct');
          document.getElementById('posResult').textContent = '✅ 正确！' + posNum + '排在第' + posAnswer + '个';
          document.getElementById('posResult').style.color = '#34C759';
          updateScore(1);
          if (typeof Sound !== 'undefined') Sound.play('correct');
          setTimeout(newPosition, 1500);
        } else {
          btn.classList.add('wrong');
          document.getElementById('posResult').textContent = '❌ 再想想';
          document.getElementById('posResult').style.color = '#FF3B30';
          if (typeof Sound !== 'undefined') Sound.play('wrong');
          setTimeout(function() { btn.classList.remove('wrong'); document.getElementById('posResult').textContent = ''; }, 800);
        }
      }
      newPosition();

      // ===== 模式4: 挑战 =====
      var chTimer = null, chTime = 60, chCorrect = 0, chWrong = 0, chRunning = false;
      var chCurAns;
      function newChallenge() {
        var type = randInt(1, 3);
        var optsEl = document.getElementById('chOptions');
        optsEl.innerHTML = '';
        if (type === 1) {
          var a = randInt(1, 100), b = randInt(1, 100);
          while (a === b) b = randInt(1, 100);
          document.getElementById('chProblem').textContent = a + ' ○ ' + b + '，○里填什么？';
          chCurAns = a > b ? '>' : '<';
          ['>', '<', '='].forEach(function(sym) {
            var btn = document.createElement('button');
            btn.className = 'ch-opt';
            btn.textContent = sym;
            btn.addEventListener('click', function() { checkChallenge(sym, btn); });
            optsEl.appendChild(btn);
          });
        } else if (type === 2) {
          var nums = [];
          while (nums.length < 4) { var n = randInt(1, 50); if (nums.indexOf(n) === -1) nums.push(n); }
          var sorted = nums.slice().sort(function(a, b) { return a - b; });
          document.getElementById('chProblem').textContent = '从小到大排列：' + nums.join(', ');
          chCurAns = sorted.join(' < ');
          var wrongOpts = [sorted.slice().reverse().join(' < '), sorted.slice().sort(function() { return Math.random() - 0.5; }).join(' < ')];
          var allOpts = [chCurAns].concat(wrongOpts);
          shuffle(allOpts);
          allOpts.forEach(function(opt) {
            var btn = document.createElement('button');
            btn.className = 'ch-opt';
            btn.style.fontSize = '14px';
            btn.textContent = opt;
            btn.addEventListener('click', function() { checkChallenge(opt, btn); });
            optsEl.appendChild(btn);
          });
        } else {
          var seq = [];
          var start = randInt(1, 20), step = randInt(2, 5);
          for (var i = 0; i < 5; i++) seq.push(start + i * step);
          var missing = randInt(1, 4);
          var ans = seq[missing];
          seq[missing] = '?';
          document.getElementById('chProblem').textContent = '找规律填数：' + seq.join(', ');
          chCurAns = ans;
          var wrongs = [ans - step, ans + step, ans + randInt(1, 3)];
          wrongs = wrongs.filter(function(w) { return w !== ans && w > 0; });
          while (wrongs.length < 3) wrongs.push(ans + wrongs.length + 1);
          wrongs = wrongs.slice(0, 3);
          var allOpts2 = [ans].concat(wrongs);
          shuffle(allOpts2);
          allOpts2.forEach(function(opt) {
            var btn = document.createElement('button');
            btn.className = 'ch-opt';
            btn.textContent = opt;
            btn.addEventListener('click', function() { checkChallenge(opt, btn); });
            optsEl.appendChild(btn);
          });
        }
      }
      function checkChallenge(ans, btn) {
        if (!chRunning) return;
        if (ans === chCurAns || ans == chCurAns) {
          btn.classList.add('correct');
          chCorrect++;
          document.getElementById('chCorrect').textContent = chCorrect;
          if (typeof Sound !== 'undefined') Sound.play('correct');
          setTimeout(newChallenge, 800);
        } else {
          btn.classList.add('wrong');
          chWrong++;
          document.getElementById('chWrong').textContent = chWrong;
          if (typeof Sound !== 'undefined') Sound.play('wrong');
          setTimeout(function() { btn.classList.remove('wrong'); }, 600);
        }
      }
      function startChallenge() {
        chTime = 60; chCorrect = 0; chWrong = 0; chRunning = true;
        document.getElementById('chCorrect').textContent = 0;
        document.getElementById('chWrong').textContent = 0;
        document.getElementById('chTime').textContent = 60;
        document.getElementById('chStart').style.display = 'none';
        newChallenge();
        if (chTimer) clearInterval(chTimer);
        chTimer = setInterval(function() {
          chTime--;
          document.getElementById('chTime').textContent = chTime;
          if (chTime <= 0) {
            clearInterval(chTimer);
            chRunning = false;
            document.getElementById('chProblem').textContent = '⏰ 时间到！答对 ' + chCorrect + ' 题';
            document.getElementById('chOptions').innerHTML = '';
            document.getElementById('chStart').style.display = 'block';
            document.getElementById('chStart').textContent = '再来一次！';
            updateScore(chCorrect);
          }
        }, 1000);
      }
      document.getElementById('chStart').addEventListener('click', function() {
        if (typeof Sound !== 'undefined') Sound.play('click');
        startChallenge();
      });
    })();
  </script>
</body>
</html>
