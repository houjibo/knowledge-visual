<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识平面图形</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 认识图形 */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .learn-svg { width: 100%; max-width: 320px; margin: 16px auto; display: block; }
    .learn-title { font-size: 22px; font-weight: 700; color: #4A90D9; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.6; }
    .learn-feature {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
    }
    .feature-tag {
      padding: 8px 16px; border-radius: 12px; font-size: 15px; font-weight: 600;
      background: rgba(74,144,217,0.1); color: #4A90D9;
    }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #4A90D9; color: white; box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* 模式2: 找图形 */
    .find-area { text-align: center; padding: 24px 16px; }
    .find-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .find-svg-wrap {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .find-svg-wrap svg { width: 100%; display: block; }
    .find-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .find-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9; min-width: 80px;
    }
    .find-opt:active { transform: scale(0.95); }
    .find-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .find-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .find-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .find-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式3: 数图形 */
    .count-area { text-align: center; padding: 24px 16px; }
    .count-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .count-svg-wrap {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .count-svg-wrap svg { width: 100%; display: block; }
    .count-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .count-opt {
      width: 60px; height: 60px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9;
      display: flex; align-items: center; justify-content: center;
    }
    .count-opt:active { transform: scale(0.95); }
    .count-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .count-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .count-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .count-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式4: 猜图形 */
    .guess-area { text-align: center; padding: 24px 16px; }
    .guess-clue {
      background: white; border-radius: 20px; padding: 24px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 18px; color: #1D1D1F; line-height: 1.8;
    }
    .guess-clue .clue-icon { font-size: 40px; margin-bottom: 12px; }
    .guess-options { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
    .guess-opt {
      width: 100px; height: 100px; border: 3px solid #E5E5EA; background: white;
      border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
    }
    .guess-opt:active { transform: scale(0.95); }
    .guess-opt svg { width: 50px; height: 50px; }
    .guess-opt .opt-label { font-size: 13px; font-weight: 600; color: #6E6E73; }
    .guess-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); }
    .guess-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .guess-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .guess-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 通用 */
    .streak-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 700; background: #FFF3E0; color: #FF9500;
    }
    .next-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .next-btn:active { transform: scale(0.95); }
    .next-btn.flat { background: #E5E5EA; color: #1D1D1F; box-shadow: none; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">认识平面图形</span>
    </nav>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="learn">📖 认识</button>
      <button class="mode-tab" data-mode="find">🔍 找图形</button>
      <button class="mode-tab" data-mode="count">🔢 数图形</button>
      <button class="mode-tab" data-mode="guess">🤔 猜图形</button>
    </div>

    <!-- 模式1: 认识图形 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card" id="learnCard">
          <svg class="learn-svg" id="learnSvg" viewBox="0 0 320 160"></svg>
          <div class="learn-title" id="learnTitle"></div>
          <div class="learn-desc" id="learnDesc"></div>
          <div class="learn-feature" id="learnFeatures"></div>
        </div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="btnLearnPrev">← 上一个</button>
          <button class="learn-btn primary" id="btnLearnNext">下一个 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 找图形 -->
    <div class="mode-content" id="mode-find">
      <div class="find-area">
        <div class="find-problem" id="findProblem"></div>
        <div class="find-svg-wrap" id="findSvgWrap"></div>
        <div class="find-options" id="findOptions"></div>
        <div class="find-feedback" id="findFeedback"></div>
        <div class="find-score">
          <span>✅ <span id="findCorrect">0</span></span>
          <span>❌ <span id="findWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="findStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnFindNext">下一题 →</button>
      </div>
    </div>

    <!-- 模式3: 数图形 -->
    <div class="mode-content" id="mode-count">
      <div class="count-area">
        <div class="count-problem" id="countProblem"></div>
        <div class="count-svg-wrap" id="countSvgWrap"></div>
        <div class="count-options" id="countOptions"></div>
        <div class="count-feedback" id="countFeedback"></div>
        <div class="count-score">
          <span>✅ <span id="countCorrect">0</span></span>
          <span>❌ <span id="countWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="countStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnCountNext">下一题 →</button>
      </div>
    </div>

    <!-- 模式4: 猜图形 -->
    <div class="mode-content" id="mode-guess">
      <div class="guess-area">
        <div class="guess-clue" id="guessClue"></div>
        <div class="guess-options" id="guessOptions"></div>
        <div class="guess-feedback" id="guessFeedback"></div>
        <div class="guess-score">
          <span>✅ <span id="guessCorrect">0</span></span>
          <span>❌ <span id="guessWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="guessStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnGuessNext">下一题 →</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 工具函数：画基本图形 ===
    function drawShape(svg, shape, cx, cy, size, color, fill) {
      const s = size;
      const fillColor = fill || 'none';
      switch (shape) {
        case 'rect':
          svg += `<rect x="${cx - s}" y="${cy - s * 0.65}" width="${s * 2}" height="${s * 1.3}" rx="2" fill="${fillColor}" stroke="${color}" stroke-width="3"/>`;
          break;
        case 'square':
          svg += `<rect x="${cx - s * 0.7}" y="${cy - s * 0.7}" width="${s * 1.4}" height="${s * 1.4}" rx="2" fill="${fillColor}" stroke="${color}" stroke-width="3"/>`;
          break;
        case 'triangle':
          svg += `<polygon points="${cx},${cy - s} ${cx - s},${cy + s * 0.7} ${cx + s},${cy + s * 0.7}" fill="${fillColor}" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
          break;
        case 'circle':
          svg += `<circle cx="${cx}" cy="${cy}" r="${s * 0.8}" fill="${fillColor}" stroke="${color}" stroke-width="3"/>`;
          break;
        case 'parallelogram':
          const offset = s * 0.4;
          svg += `<polygon points="${cx - s + offset},${cy - s * 0.5} ${cx + s + offset},${cy - s * 0.5} ${cx + s - offset},${cy + s * 0.5} ${cx - s - offset},${cy + s * 0.5}" fill="${fillColor}" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
          break;
        case 'trapezoid':
          svg += `<polygon points="${cx - s * 0.5},${cy - s * 0.5} ${cx + s * 0.5},${cy - s * 0.5} ${cx + s},${cy + s * 0.5} ${cx - s},${cy + s * 0.5}" fill="${fillColor}" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
          break;
      }
      return svg;
    }

    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 认识图形 ===
    (() => {
      const shapes = [
        {
          name: '长方形',
          desc: '长方形有4条边，对边一样长，4个角都是直角。就像书本、门、黑板的形状。',
          features: ['4条边', '对边相等', '4个直角'],
          draw: (svg) => {
            let s = '';
            s = drawShape(s, 'rect', 160, 70, 80, '#4A90D9', 'rgba(74,144,217,0.1)');
            // 标注直角
            s += `<rect x="232" y="70" width="8" height="8" fill="none" stroke="#FF9500" stroke-width="1.5"/>`;
            s += `<text x="160" y="140" text-anchor="middle" font-size="13" fill="#6E6E73">对边一样长</text>`;
            // 双向箭头
            s += `<line x1="88" y1="130" x2="232" y2="130" stroke="#FF9500" stroke-width="1.5" stroke-dasharray="4,3"/>`;
            return s;
          }
        },
        {
          name: '正方形',
          desc: '正方形有4条边，4条边都一样长，4个角都是直角。就像魔方的每一面。',
          features: ['4条边', '四边相等', '4个直角'],
          draw: (svg) => {
            let s = '';
            s = drawShape(s, 'square', 160, 70, 60, '#7B1FA2', 'rgba(123,31,162,0.1)');
            // 标注等边
            s += `<text x="160" y="8" text-anchor="middle" font-size="12" fill="#FF9500" font-weight="600">边</text>`;
            s += `<text x="160" y="148" text-anchor="middle" font-size="12" fill="#FF9500" font-weight="600">边</text>`;
            s += `<text x="92" y="75" text-anchor="middle" font-size="12" fill="#FF9500" font-weight="600">边</text>`;
            s += `<text x="228" y="75" text-anchor="middle" font-size="12" fill="#FF9500" font-weight="600">边</text>`;
            s += `<rect x="212" y="10" width="8" height="8" fill="none" stroke="#FF9500" stroke-width="1.5"/>`;
            return s;
          }
        },
        {
          name: '三角形',
          desc: '三角形有3条边、3个角。就像三明治切开的形状、屋顶的形状。',
          features: ['3条边', '3个角', '尖尖的'],
          draw: (svg) => {
            let s = '';
            s = drawShape(s, 'triangle', 160, 80, 70, '#FF9500', 'rgba(255,149,0,0.1)');
            s += `<text x="160" y="10" text-anchor="middle" font-size="13" fill="#6E6E73">角</text>`;
            s += `<text x="80" y="148" text-anchor="middle" font-size="13" fill="#6E6E73">角</text>`;
            s += `<text x="240" y="148" text-anchor="middle" font-size="13" fill="#6E6E73">角</text>`;
            return s;
          }
        },
        {
          name: '圆',
          desc: '圆没有角，也没有直的边。它是一个光滑的曲线，就像硬币、钟表、太阳的形状。',
          features: ['没有角', '光滑曲线', '处处一样圆'],
          draw: (svg) => {
            let s = '';
            s = drawShape(s, 'circle', 160, 75, 60, '#34C759', 'rgba(52,199,89,0.1)');
            // 圆心
            s += `<circle cx="160" cy="75" r="3" fill="#FF9500"/>`;
            s += `<text x="160" y="75" text-anchor="start" dx="10" font-size="12" fill="#FF9500" font-weight="600">圆心</text>`;
            s += `<text x="160" y="150" text-anchor="middle" font-size="13" fill="#6E6E73">光滑的曲线</text>`;
            return s;
          }
        },
        {
          name: '平行四边形',
          desc: '平行四边形有4条边，对边平行且一样长。就像被推歪的长方形。',
          features: ['4条边', '对边平行', '对边相等'],
          draw: (svg) => {
            let s = '';
            s = drawShape(s, 'parallelogram', 160, 75, 70, '#E91E63', 'rgba(233,30,99,0.1)');
            s += `<text x="160" y="148" text-anchor="middle" font-size="13" fill="#6E6E73">对边平行且相等</text>`;
            // 箭头表示平行
            s += `<line x1="100" y1="48" x2="180" y2="48" stroke="#FF9500" stroke-width="1.5" stroke-dasharray="4,3"/>`;
            s += `<line x1="140" y1="102" x2="220" y2="102" stroke="#FF9500" stroke-width="1.5" stroke-dasharray="4,3"/>`;
            return s;
          }
        },
        {
          name: '生活中的平面图形',
          desc: '窗户是长方形，地砖是正方形，钟面是圆形，三明治是三角形……图形就在我们身边！',
          features: ['窗户', '地砖', '钟面', '三明治'],
          draw: (svg) => {
            let s = '';
            // 窗户 - 长方形
            s += `<rect x="20" y="10" width="60" height="45" rx="3" fill="#E3F2FD" stroke="#4A90D9" stroke-width="2"/>`;
            s += `<line x1="50" y1="10" x2="50" y2="55" stroke="#4A90D9" stroke-width="1.5"/>`;
            s += `<line x1="20" y1="32" x2="80" y2="32" stroke="#4A90D9" stroke-width="1.5"/>`;
            s += `<text x="50" y="75" text-anchor="middle" font-size="11" fill="#6E6E73">🪟 窗户</text>`;
            // 地砖 - 正方形
            s += `<rect x="105" y="15" width="35" height="35" rx="2" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>`;
            s += `<text x="122" y="75" text-anchor="middle" font-size="11" fill="#6E6E73">🟪 地砖</text>`;
            // 钟面 - 圆
            s += `<circle cx="200" cy="32" r="22" fill="#E8F5E9" stroke="#34C759" stroke-width="2"/>`;
            s += `<line x1="200" y1="32" x2="200" y2="18" stroke="#34C759" stroke-width="2"/>`;
            s += `<line x1="200" y1="32" x2="212" y2="32" stroke="#34C759" stroke-width="1.5"/>`;
            s += `<text x="200" y="75" text-anchor="middle" font-size="11" fill="#6E6E73">🕐 钟面</text>`;
            // 三明治 - 三角形
            s += `<polygon points="275,12 255,55 295,55" fill="#FFF3E0" stroke="#FF9500" stroke-width="2" stroke-linejoin="round"/>`;
            s += `<text x="275" y="75" text-anchor="middle" font-size="11" fill="#6E6E73">🥪 三明治</text>`;
            // 底部总结
            s += `<text x="160" y="110" text-anchor="middle" font-size="14" fill="#4A90D9" font-weight="600">平面图形就在我们身边！</text>`;
            return s;
          }
        }
      ];
      let idx = 0;
      function showLesson() {
        const l = shapes[idx];
        const svg = document.getElementById('learnSvg');
        svg.innerHTML = l.draw();
        document.getElementById('learnTitle').textContent = l.name;
        document.getElementById('learnDesc').textContent = l.desc;
        const fc = document.getElementById('learnFeatures');
        fc.innerHTML = '';
        l.features.forEach(f => {
          const tag = document.createElement('span');
          tag.className = 'feature-tag';
          tag.textContent = f;
          fc.appendChild(tag);
        });
        document.getElementById('btnLearnPrev').disabled = idx === 0;
        document.getElementById('btnLearnNext').textContent = idx === shapes.length - 1 ? '🎉 学完了' : '下一个 →';
      }
      document.getElementById('btnLearnPrev').addEventListener('click', () => {
        if (idx > 0) { idx--; Sound.play('click'); showLesson(); }
      });
      document.getElementById('btnLearnNext').addEventListener('click', () => {
        if (idx < shapes.length - 1) { idx++; Sound.play('click'); showLesson(); }
        else { celebrate(); showToast('🎉 你认识了平面图形！去试试其他模式吧'); }
      });
      showLesson();
    })();

    // === 模式2: 找图形 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0;
      const shapeNames = { rect: '长方形', square: '正方形', triangle: '三角形', circle: '圆', parallelogram: '平行四边形', trapezoid: '梯形' };
      const shapeList = ['rect', 'square', 'triangle', 'circle', 'parallelogram', 'trapezoid'];
      const colors = ['#4A90D9', '#7B1FA2', '#FF9500', '#34C759', '#E91E63', '#00BCD4'];

      function newFind() {
        // 随机选一个目标图形
        const targetShape = shapeList[Random.int(0, shapeList.length - 1)];
        const targetName = shapeNames[targetShape];

        // 生成混合图形
        const count = Random.int(4, 6);
        const items = [];
        // 确保至少有1个目标
        items.push(targetShape);
        for (let i = 1; i < count; i++) {
          let s;
          do { s = shapeList[Random.int(0, shapeList.length - 1)]; } while (s === targetShape && i < count - 1);
          items.push(s);
        }
        // 确保至少有1个非目标
        if (items.every(s => s === targetShape)) {
          let other;
          do { other = shapeList[Random.int(0, shapeList.length - 1)]; } while (other === targetShape);
          items[items.length - 1] = other;
        }
        // 打乱
        for (let i = items.length - 1; i > 0; i--) {
          const j = Random.int(0, i);
          [items[i], items[j]] = [items[j], items[i]];
        }

        const targetCount = items.filter(s => s === targetShape).length;

        // 画图形
        const cols = Math.min(count, 3);
        const rows = Math.ceil(count / cols);
        const cellW = 90, cellH = 80;
        const svgW = cols * cellW + 20;
        const svgH = rows * cellH + 10;
        let svg = `<svg viewBox="0 0 ${svgW} ${svgH}">`;
        items.forEach((shape, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cx = col * cellW + cellW / 2 + 10;
          const cy = row * cellH + cellH / 2 + 5;
          const c = colors[shapeList.indexOf(shape) % colors.length];
          svg = drawShape(svg, shape, cx, cy, 25, c, c.replace(')', ',0.15)').replace('rgb', 'rgba'));
          svg += `<text x="${cx}" y="${cy + 38}" text-anchor="middle" font-size="11" fill="#6E6E73">${i + 1}</text>`;
        });
        svg += '</svg>';
        document.getElementById('findSvgWrap').innerHTML = svg;

        document.getElementById('findProblem').textContent = `找出所有的${targetName}（点击编号）`;

        // 选项
        const opts = document.getElementById('findOptions');
        opts.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const btn = document.createElement('button');
          btn.className = 'find-opt';
          btn.textContent = i + 1;
          btn.dataset.idx = i;
          btn.dataset.selected = 'false';
          btn.addEventListener('click', () => {
            const sel = btn.dataset.selected === 'true';
            btn.dataset.selected = sel ? 'false' : 'true';
            btn.style.background = sel ? 'white' : 'rgba(74,144,217,0.15)';
            Sound.play('click');
          });
          opts.appendChild(btn);
        }

        // 确认按钮
        const oldCheck = document.getElementById('btnFindCheck');
        if (oldCheck) oldCheck.remove();
        const checkBtn = document.createElement('button');
        checkBtn.className = 'next-btn';
        checkBtn.textContent = '✅ 确认';
        checkBtn.id = 'btnFindCheck';
        checkBtn.addEventListener('click', () => {
          const selected = [];
          opts.querySelectorAll('.find-opt').forEach(b => {
            if (b.dataset.selected === 'true') selected.push(parseInt(b.dataset.idx));
          });
          const correctIdxs = items.map((s, i) => s === targetShape ? i : -1).filter(i => i >= 0);
          const isCorrect = selected.length === correctIdxs.length && selected.every(s => correctIdxs.includes(s));

          if (isCorrect) {
            correct++; streak++;
            document.getElementById('findCorrect').textContent = correct;
            document.getElementById('findStreak').textContent = streak;
            document.getElementById('findFeedback').textContent = `🎉 答对了！一共有 ${targetCount} 个${targetName}`;
            document.getElementById('findFeedback').style.color = '#34C759';
            Sound.play('correct');
            celebrate();
            opts.querySelectorAll('.find-opt').forEach(b => {
              if (correctIdxs.includes(parseInt(b.dataset.idx))) b.classList.add('correct');
            });
            setTimeout(newFind, 1500);
          } else {
            wrong++; streak = 0;
            document.getElementById('findWrong').textContent = wrong;
            document.getElementById('findStreak').textContent = streak;
            document.getElementById('findFeedback').textContent = `❌ 不对哦，${targetName}应该是第 ${correctIdxs.map(i => i + 1).join('、')} 个`;
            document.getElementById('findFeedback').style.color = '#FF3B30';
            Sound.play('wrong');
            opts.querySelectorAll('.find-opt').forEach(b => {
              const idx = parseInt(b.dataset.idx);
              if (correctIdxs.includes(idx)) b.classList.add('correct');
              else if (b.dataset.selected === 'true') b.classList.add('wrong');
            });
          }
        });
        document.getElementById('btnFindNext').parentNode.insertBefore(checkBtn, document.getElementById('btnFindNext'));
        document.getElementById('findFeedback').textContent = '';
        document.getElementById('findFeedback').style.color = '';
      }

      document.getElementById('btnFindNext').addEventListener('click', () => { Sound.play('click'); newFind(); });
      newFind();
    })();

    // === 模式3: 数图形 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0;
      const shapeNames = { rect: '长方形', square: '正方形', triangle: '三角形', circle: '圆' };

      function newCount() {
        // 随机选一种图形来数
        const targetShape = ['rect', 'square', 'triangle', 'circle'][Random.int(0, 3)];
        const targetName = shapeNames[targetShape];
        const answer = Random.int(2, 6);
        const totalOthers = Random.int(2, 4);

        // 生成混合场景
        const items = [];
        for (let i = 0; i < answer; i++) items.push(targetShape);
        const otherShapes = ['rect', 'square', 'triangle', 'circle'].filter(s => s !== targetShape);
        for (let i = 0; i < totalOthers; i++) items.push(otherShapes[Random.int(0, otherShapes.length - 1)]);
        // 打乱
        for (let i = items.length - 1; i > 0; i--) {
          const j = Random.int(0, i);
          [items[i], items[j]] = [items[j], items[i]];
        }

        // 画场景 - 像一幅画
        const cols = Math.min(items.length, 4);
        const rows = Math.ceil(items.length / cols);
        const cellW = 75, cellH = 70;
        const svgW = cols * cellW + 20;
        const svgH = rows * cellH + 10;
        const colors = { rect: '#4A90D9', square: '#7B1FA2', triangle: '#FF9500', circle: '#34C759' };
        let svg = `<svg viewBox="0 0 ${svgW} ${svgH}">`;
        items.forEach((shape, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cx = col * cellW + cellW / 2 + 10;
          const cy = row * cellH + cellH / 2 + 5;
          const c = colors[shape];
          svg = drawShape(svg, shape, cx, cy, 22, c, c.replace(')', ',0.12)').replace('rgb', 'rgba').replace('#', 'rgba(').replace(/./, (m) => {
            // Just use simple fill
            return m;
          }));
          // Simpler fill
          const fillColor = shape === 'rect' ? 'rgba(74,144,217,0.12)' : shape === 'square' ? 'rgba(123,31,162,0.12)' : shape === 'triangle' ? 'rgba(255,149,0,0.12)' : 'rgba(52,199,89,0.12)';
          // Redraw with proper fill
          svg = ''; // restart
        });
        // Redo properly
        svg = `<svg viewBox="0 0 ${svgW} ${svgH}">`;
        items.forEach((shape, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cx = col * cellW + cellW / 2 + 10;
          const cy = row * cellH + cellH / 2 + 5;
          const c = colors[shape];
          const fc = shape === 'rect' ? 'rgba(74,144,217,0.12)' : shape === 'square' ? 'rgba(123,31,162,0.12)' : shape === 'triangle' ? 'rgba(255,149,0,0.12)' : 'rgba(52,199,89,0.12)';
          svg = drawShape(svg, shape, cx, cy, 22, c, fc);
        });
        svg += '</svg>';
        document.getElementById('countSvgWrap').innerHTML = svg;

        document.getElementById('countProblem').textContent = `数一数，图中有几个${targetName}？`;

        // 选项 0~answer+2
        const opts = document.getElementById('countOptions');
        opts.innerHTML = '';
        const minOpt = Math.max(0, answer - 2);
        const maxOpt = answer + 2;
        for (let i = minOpt; i <= maxOpt; i++) {
          const btn = document.createElement('button');
          btn.className = 'count-opt';
          btn.textContent = i;
          btn.addEventListener('click', () => {
            if (i === answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('countCorrect').textContent = correct;
              document.getElementById('countStreak').textContent = streak;
              document.getElementById('countFeedback').textContent = `🎉 答对了！一共有 ${answer} 个${targetName}`;
              document.getElementById('countFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              setTimeout(newCount, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('countWrong').textContent = wrong;
              document.getElementById('countStreak').textContent = streak;
              document.getElementById('countFeedback').textContent = '❌ 再数数看，一个一个仔细数';
              document.getElementById('countFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          opts.appendChild(btn);
        }
        document.getElementById('countFeedback').textContent = '';
        document.getElementById('countFeedback').style.color = '';
      }

      document.getElementById('btnCountNext').addEventListener('click', () => { Sound.play('click'); newCount(); });
      newCount();
    })();

    // === 模式4: 猜图形 ===
    (() => {
      let correct = 0, wrong = 0, streak = 0;
      const shapeNames = { rect: '长方形', square: '正方形', triangle: '三角形', circle: '圆', parallelogram: '平行四边形', trapezoid: '梯形' };
      const shapeColors = { rect: '#4A90D9', square: '#7B1FA2', triangle: '#FF9500', circle: '#34C759', parallelogram: '#E91E63', trapezoid: '#00BCD4' };

      const clues = {
        rect: [
          '我有4条边，对边一样长，4个角都是直角。',
          '我的形状像一扇门，也像一本书。',
          '我有2条长边、2条短边，4个角一样大。'
        ],
        square: [
          '我有4条边，4条边都一样长，4个角都是直角。',
          '我的形状像魔方的每一面，也像一块手帕。',
          '我是特殊的长方形，我的长和宽一样长。'
        ],
        triangle: [
          '我有3条边、3个角，像一座小山。',
          '我的形状像切开的三明治，也像屋顶。',
          '我是边最少的多边形，我有3个尖尖的角。'
        ],
        circle: [
          '我没有角，也没有直的边，全身光滑。',
          '我的形状像硬币，也像太阳。',
          '我从圆心到边上处处一样远，像一个大圆圈。'
        ],
        parallelogram: [
          '我有4条边，对边平行且一样长，但我没有直角。',
          '我像被推歪了的长方形。',
          '我的对面一模一样，但我站不直。'
        ],
        trapezoid: [
          '我有4条边，只有2条边是平行的。',
          '我像一座水坝的截面，上面短下面长。',
          '我有一对平行边，另一对边不平行。'
        ]
      };

      function newGuess() {
        const allShapes = ['rect', 'square', 'triangle', 'circle', 'parallelogram', 'trapezoid'];
        const answer = allShapes[Random.int(0, allShapes.length - 1)];
        const clue = clues[answer][Random.int(0, clues[answer].length - 1)];

        document.getElementById('guessClue').innerHTML = `<div class="clue-icon">🤔</div><div>${clue}</div>`;

        // 生成选项（4个）
        const options = [answer];
        while (options.length < 4) {
          const s = allShapes[Random.int(0, allShapes.length - 1)];
          if (!options.includes(s)) options.push(s);
        }
        // 打乱
        for (let i = options.length - 1; i > 0; i--) {
          const j = Random.int(0, i);
          [options[i], options[j]] = [options[j], options[i]];
        }

        const opts = document.getElementById('guessOptions');
        opts.innerHTML = '';
        options.forEach(shape => {
          const btn = document.createElement('button');
          btn.className = 'guess-opt';
          const c = shapeColors[shape];
          const fc = c + '22';
          let innerSvg = `<svg viewBox="0 0 60 60">`;
          innerSvg = drawShape(innerSvg, shape, 30, 28, 20, c, fc);
          innerSvg += `</svg>`;
          btn.innerHTML = innerSvg + `<span class="opt-label">?</span>`;
          btn.addEventListener('click', () => {
            if (shape === answer) {
              btn.classList.add('correct');
              btn.querySelector('.opt-label').textContent = shapeNames[shape];
              correct++; streak++;
              document.getElementById('guessCorrect').textContent = correct;
              document.getElementById('guessStreak').textContent = streak;
              document.getElementById('guessFeedback').textContent = `🎉 答对了！就是${shapeNames[shape]}`;
              document.getElementById('guessFeedback').style.color = '#34C759';
              Sound.play('correct');
              celebrate();
              // 显示其他选项名称
              opts.querySelectorAll('.guess-opt').forEach(o => {
                const s = o.dataset.shape;
                o.querySelector('.opt-label').textContent = shapeNames[s] || '';
              });
              setTimeout(newGuess, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('guessWrong').textContent = wrong;
              document.getElementById('guessStreak').textContent = streak;
              document.getElementById('guessFeedback').textContent = '❌ 再想想，看看线索说的是哪个特征';
              document.getElementById('guessFeedback').style.color = '#FF3B30';
              Sound.play('wrong');
              Animator.shake(btn);
            }
          });
          btn.dataset.shape = shape;
          opts.appendChild(btn);
        });
        document.getElementById('guessFeedback').textContent = '';
        document.getElementById('guessFeedback').style.color = '';
      }

      document.getElementById('btnGuessNext').addEventListener('click', () => { Sound.play('click'); newGuess(); });
      newGuess();
    })();
  </script>
</body>
</html>
