<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识人民币</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E53935; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 认识钱币模式 */
    .coin-display { text-align: center; padding: 24px 16px; }
    .coin-visual {
      width: 180px; height: 180px; margin: 16px auto;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .coin-visual:active { transform: scale(0.95); }
    .coin-visual.yuan { background: linear-gradient(135deg, #E53935, #FF7043); }
    .coin-visual.jiao { background: linear-gradient(135deg, #43A047, #66BB6A); }
    .coin-visual.fen { background: linear-gradient(135deg, #FB8C00, #FFB74D); }
    .coin-visual.small { width: 140px; height: 140px; font-size: 22px; }
    .coin-info { font-size: 24px; font-weight: 700; margin: 16px 0; color: #1D1D1F; }
    .coin-info .unit { color: #E53935; }
    .coin-desc { font-size: 16px; color: #6E6E73; margin: 8px 0; }
    .coin-nav { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
    .coin-nav-btn {
      min-width: 56px; min-height: 56px; border: 2px solid #9CA3AF; background: white;
      border-radius: 14px; font-size: 22px; cursor: pointer; transition: all 0.2s ease;
    }
    .coin-nav-btn:active { transform: scale(0.9); }

    /* 换算模式 */
    .convert-area { text-align: center; padding: 24px 16px; }
    .convert-visual {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 24px 0; flex-wrap: wrap;
    }
    .convert-box {
      background: white; border-radius: 16px; padding: 16px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; min-width: 100px;
    }
    .convert-box .big { font-size: 36px; font-weight: 800; }
    .convert-box .label { font-size: 14px; color: #6E6E73; margin-top: 4px; }
    .convert-arrow { font-size: 32px; color: #E53935; }
    .convert-rule {
      background: #FFF3E0; border-radius: 12px; padding: 16px;
      font-size: 18px; font-weight: 600; color: #E65100; margin: 16px 0;
      border-left: 4px solid #FF9800;
    }
    .convert-practice { margin: 20px 0; }
    .convert-question { font-size: 22px; font-weight: 700; margin: 16px 0; }
    .convert-input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 12px 0; }
    .convert-input {
      width: 100px; height: 56px; border: 3px solid #9CA3AF; border-radius: 14px;
      font-size: 28px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s;
    }
    .convert-input:focus { border-color: #E53935; }
    .convert-unit-label { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .convert-check-btn {
      padding: 14px 28px; border: none; background: #E53935; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 12px 8px; transition: all 0.2s ease;
    }
    .convert-check-btn:active { transform: scale(0.95); }
    .convert-feedback { font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px; }

    /* 购物模式 */
    .shop-area { text-align: center; padding: 16px; }
    .shop-wallet {
      background: linear-gradient(135deg, #FFF8E1, #FFECB3); border-radius: 16px;
      padding: 16px; margin: 12px 0; font-size: 20px; font-weight: 700; color: #F57F17;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .shop-item {
      background: white; border-radius: 20px; padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin: 16px 0;
    }
    .shop-item-emoji { font-size: 64px; margin: 8px 0; }
    .shop-item-name { font-size: 22px; font-weight: 700; margin: 8px 0; }
    .shop-item-price { font-size: 28px; font-weight: 800; color: #E53935; margin: 8px 0; }
    .shop-pay-area { margin: 16px 0; }
    .shop-pay-label { font-size: 18px; font-weight: 600; color: #6E6E73; margin: 8px 0; }
    .shop-coins-row {
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0;
    }
    .shop-coin {
      width: 56px; height: 56px; border-radius: 50%; border: 3px solid transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .shop-coin:active { transform: scale(0.9); }
    .shop-coin.selected { border-color: #1D1D1F; transform: scale(1.1); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
    .shop-coin.c1 { background: linear-gradient(135deg, #E53935, #FF7043); }
    .shop-coin.c5 { background: linear-gradient(135deg, #7B1FA2, #AB47BC); }
    .shop-coin.c10 { background: linear-gradient(135deg, #1565C0, #42A5F5); }
    .shop-coin.c20 { background: linear-gradient(135deg, #2E7D32, #66BB6A); }
    .shop-coin.c50 { background: linear-gradient(135deg, #E65100, #FB8C00); }
    .shop-coin.c100 { background: linear-gradient(135deg, #C62828, #EF5350); }
    .shop-total { font-size: 20px; font-weight: 700; margin: 8px 0; }
    .shop-total .paid { color: #E53935; }
    .shop-next-btn, .shop-check-btn {
      padding: 14px 28px; border: none; border-radius: 14px;
      font-size: 18px; font-weight: 700; cursor: pointer; margin: 8px;
      transition: all 0.2s ease;
    }
    .shop-check-btn { background: #E53935; color: white; }
    .shop-next-btn { background: #43A047; color: white; display: none; }
    .shop-check-btn:active, .shop-next-btn:active { transform: scale(0.95); }
    .shop-feedback { font-size: 20px; font-weight: 700; min-height: 32px; margin: 8px 0; }
    .shop-score { display: flex; justify-content: center; gap: 16px; font-size: 16px; font-weight: 600; margin: 8px 0; }

    /* 挑战模式 */
    .challenge-area { text-align: center; padding: 16px; }
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .timer-bar { height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #43A047, #FF9800, #E53935); border-radius: 4px; transition: width 0.1s linear; }
    .challenge-question { font-size: 22px; font-weight: 700; margin: 20px 0; line-height: 1.5; }
    .challenge-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .challenge-opt {
      padding: 18px 12px; border: 3px solid #9CA3AF; background: #F8F8FA;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; text-align: center;
    }
    .challenge-opt:active { transform: scale(0.95); }
    .challenge-opt.correct { border-color: #43A047; background: rgba(67,160,71,0.15); color: #43A047; }
    .challenge-opt.wrong { border-color: #E53935; background: rgba(229,57,53,0.1); color: #E53935; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #E53935; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block; box-shadow: 0 4px 12px rgba(229,57,53,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .bounce { animation: bounce 0.4s ease; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">💰 认识人民币</span>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="recognize">🪙 认识钱币</button>
      <button class="mode-tab" data-mode="convert">🔄 单位换算</button>
      <button class="mode-tab" data-mode="shop">🛒 模拟购物</button>
      <button class="mode-tab" data-mode="challenge">🏆 限时挑战</button>
    </div>

    <!-- 模式1: 认识钱币 -->
    <div class="mode-content active" id="mode-recognize">
      <div class="card">
        <p class="page-subtitle">滑动认识不同的人民币面额</p>
        <div class="coin-display">
          <div class="coin-visual" id="coin-visual">
            <span id="coin-symbol">1元</span>
          </div>
          <div class="coin-info" id="coin-info"></div>
          <div class="coin-desc" id="coin-desc"></div>
          <div class="coin-nav">
            <button class="coin-nav-btn" id="coin-prev">⬅️</button>
            <span id="coin-counter" style="font-size:18px;font-weight:600;line-height:56px;color:#6E6E73"></span>
            <button class="coin-nav-btn" id="coin-next">➡️</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 单位换算 -->
    <div class="mode-content" id="mode-convert">
      <div class="card">
        <p class="page-subtitle">元、角、分之间的换算</p>
        <div class="convert-area">
          <div class="convert-rule" id="convert-rule">
            💡 1元 = 10角 &nbsp;&nbsp; 1角 = 10分
          </div>
          <div class="convert-visual" id="convert-visual"></div>
          <div class="convert-practice">
            <div class="convert-question" id="convert-question"></div>
            <div class="convert-input-row" id="convert-input-row"></div>
            <div style="display:flex;justify-content:center;gap:8px">
              <button class="convert-check-btn" id="convert-check">✅ 检查答案</button>
              <button class="convert-check-btn" id="convert-next" style="background:#43A047;display:none">➡️ 下一题</button>
            </div>
            <div class="convert-feedback" id="convert-feedback"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式3: 模拟购物 -->
    <div class="mode-content" id="mode-shop">
      <div class="card">
        <div class="shop-area">
          <div class="shop-score">
            <span>🛍️ 已购 <b id="shop-bought" style="color:#43A047">0</b> 件</span>
            <span>💰 余额 <b id="shop-balance" style="color:#E53935">0</b> 元</span>
          </div>
          <div class="shop-item" id="shop-item"></div>
          <div class="shop-pay-area" id="shop-pay-area">
            <div class="shop-pay-label">💵 点击钱币付款（可多选凑出金额）</div>
            <div class="shop-coins-row" id="shop-coins"></div>
            <div class="shop-total" id="shop-total">已选: <span class="paid">0元</span></div>
          </div>
          <div class="shop-feedback" id="shop-feedback"></div>
          <div style="display:flex;justify-content:center;gap:8px">
            <button class="shop-check-btn" id="shop-check">💳 确认付款</button>
            <button class="shop-next-btn" id="shop-next">🛍️ 买下一件</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-score">
            <span>答对 <b id="ch-correct" style="color:#43A047">0</b></span>
            <span>答错 <b id="ch-wrong" style="color:#E53935">0</b></span>
          </div>
          <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
          <button class="challenge-start-btn" id="btn-start-challenge">🏆 开始挑战！</button>
          <div class="challenge-running">
            <div class="challenge-question" id="ch-question"></div>
            <div class="challenge-options" id="ch-options"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    /* ===== 全局状态 ===== */
    var streak = 0;
    function updateStreak(correct) {
      if (correct) { streak++; } else { streak = 0; }
      var el = document.getElementById('streak');
      if (el) el.textContent = streak;
      var stars = document.getElementById('stars-display');
      if (stars) {
        var s = '';
        for (var i = 0; i < Math.min(streak, 10); i++) s += '⭐';
        stars.textContent = s;
      }
    }

    /* ===== Tab 切换 ===== */
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var mode = this.getAttribute('data-mode');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
        var target = document.getElementById('mode-' + mode);
        if (target) target.classList.add('active');
      });
    });

    /* ===== 模式1: 认识钱币 ===== */
    var coins = [
      { val: '1分', symbol: '1分', cls: 'fen small', desc: '最小面额的硬币，金色', info: '1<span class="unit">分</span>' },
      { val: '5分', symbol: '5分', cls: 'fen small', desc: '金色硬币，比1分大一点', info: '5<span class="unit">分</span>' },
      { val: '1角', symbol: '1角', cls: 'jiao small', desc: '1元=10角，这是1角', info: '1<span class="unit">角</span>' },
      { val: '5角', symbol: '5角', cls: 'jiao small', desc: '金色硬币，等于5个1角', info: '5<span class="unit">角</span>' },
      { val: '1元', symbol: '1元', cls: 'yuan', desc: '最常见的硬币！1元=10角', info: '1<span class="unit">元</span>' },
      { val: '5元', symbol: '5元', cls: 'yuan', desc: '紫色纸币，可以买不少东西', info: '5<span class="unit">元</span>' },
      { val: '10元', symbol: '10元', cls: 'yuan', desc: '蓝色纸币，10个1元', info: '10<span class="unit">元</span>' },
      { val: '20元', symbol: '20元', cls: 'yuan', desc: '绿色纸币，2个10元', info: '20<span class="unit">元</span>' },
      { val: '50元', symbol: '50元', cls: 'yuan', desc: '橙色纸币，5个10元', info: '50<span class="unit">元</span>' },
      { val: '100元', symbol: '100元', cls: 'yuan', desc: '最大面额！红色纸币', info: '100<span class="unit">元</span>' }
    ];
    var coinIdx = 0;
    function showCoin() {
      var c = coins[coinIdx];
      var vis = document.getElementById('coin-visual');
      vis.className = 'coin-visual ' + c.cls;
      document.getElementById('coin-symbol').textContent = c.symbol;
      document.getElementById('coin-info').innerHTML = c.info;
      document.getElementById('coin-desc').textContent = c.desc;
      document.getElementById('coin-counter').textContent = (coinIdx + 1) + ' / ' + coins.length;
      vis.classList.add('bounce');
      setTimeout(function() { vis.classList.remove('bounce'); }, 400);
    }
    document.getElementById('coin-prev').addEventListener('click', function() {
      coinIdx = (coinIdx - 1 + coins.length) % coins.length;
      showCoin();
    });
    document.getElementById('coin-next').addEventListener('click', function() {
      coinIdx = (coinIdx + 1) % coins.length;
      showCoin();
    });
    showCoin();

    /* ===== 模式2: 单位换算 ===== */
    var convertTypes = [
      { q: function() { var y = randInt(1,9); return { text: y + '元 = ?角', ans: y * 10, unit: '角' }; },
        visual: function(y) { return '<div class="convert-box"><div class="big" style="color:#E53935">' + y + '</div><div class="label">元</div></div><div class="convert-arrow">→</div><div class="convert-box"><div class="big" style="color:#43A047">?</div><div class="label">角</div></div>'; },
        gen: function() { return randInt(1,9); } },
      { q: function() { var j = randInt(1,9) * 10; return { text: j + '角 = ?元', ans: j / 10, unit: '元' }; },
        visual: function(j) { return '<div class="convert-box"><div class="big" style="color:#43A047">' + j + '</div><div class="label">角</div></div><div class="convert-arrow">→</div><div class="convert-box"><div class="big" style="color:#E53935">?</div><div class="label">元</div></div>'; },
        gen: function() { return randInt(1,9) * 10; } },
      { q: function() { var j = randInt(1,9); return { text: j + '角 = ?分', ans: j * 10, unit: '分' }; },
        visual: function(j) { return '<div class="convert-box"><div class="big" style="color:#43A047">' + j + '</div><div class="label">角</div></div><div class="convert-arrow">→</div><div class="convert-box"><div class="big" style="color:#FB8C00">?</div><div class="label">分</div></div>'; },
        gen: function() { return randInt(1,9); } },
      { q: function() { var f = randInt(1,9) * 10; return { text: f + '分 = ?角', ans: f / 10, unit: '角' }; },
        visual: function(f) { return '<div class="convert-box"><div class="big" style="color:#FB8C00">' + f + '</div><div class="label">分</div></div><div class="convert-arrow">→</div><div class="convert-box"><div class="big" style="color:#43A047">?</div><div class="label">角</div></div>'; },
        gen: function() { return randInt(1,9) * 10; } },
      { q: function() { var y = randInt(1,5); return { text: y + '元 = ?分', ans: y * 100, unit: '分' }; },
        visual: function(y) { return '<div class="convert-box"><div class="big" style="color:#E53935">' + y + '</div><div class="label">元</div></div><div class="convert-arrow">→</div><div class="convert-box"><div class="big" style="color:#FB8C00">?</div><div class="label">分</div></div>'; },
        gen: function() { return randInt(1,5); } }
    ];
    var curConvert = null;
    var convertAnswered = false;

    function newConvert() {
      convertAnswered = false;
      var type = convertTypes[randInt(0, convertTypes.length - 1)];
      var param = type.gen();
      var q = type.q();
      curConvert = q;
      document.getElementById('convert-visual').innerHTML = type.visual(param);
      document.getElementById('convert-question').textContent = q.text;
      document.getElementById('convert-input-row').innerHTML =
        '<input type="number" class="convert-input" id="convert-answer" placeholder="?" inputmode="numeric">' +
        '<span class="convert-unit-label">' + q.unit + '</span>';
      document.getElementById('convert-feedback').textContent = '';
      document.getElementById('convert-check').style.display = '';
      document.getElementById('convert-next').style.display = 'none';
      var inp = document.getElementById('convert-answer');
      if (inp) { inp.value = ''; inp.focus(); }
    }

    document.getElementById('convert-check').addEventListener('click', function() {
      if (convertAnswered || !curConvert) return;
      convertAnswered = true;
      var inp = document.getElementById('convert-answer');
      var val = parseInt(inp.value);
      var fb = document.getElementById('convert-feedback');
      if (val === curConvert.ans) {
        fb.textContent = '✅ 正确！太棒了！';
        fb.style.color = '#43A047';
        updateStreak(true);
      } else {
        fb.textContent = '❌ 不对哦，正确答案是 ' + curConvert.ans + curConvert.unit;
        fb.style.color = '#E53935';
        updateStreak(false);
      }
      document.getElementById('convert-check').style.display = 'none';
      document.getElementById('convert-next').style.display = '';
    });

    document.getElementById('convert-next').addEventListener('click', function() {
      newConvert();
    });

    newConvert();

    /* ===== 模式3: 模拟购物 ===== */
    var shopItems = [
      { emoji: '🍎', name: '苹果', price: 3 },
      { emoji: '🍌', name: '香蕉', price: 5 },
      { emoji: '🍞', name: '面包', price: 8 },
      { emoji: '🥛', name: '牛奶', price: 6 },
      { emoji: '🍬', name: '糖果', price: 2 },
      { emoji: '📚', name: '笔记本', price: 4 },
      { emoji: '✏️', name: '铅笔', price: 1 },
      { emoji: '🧸', name: '小熊玩具', price: 15 },
      { emoji: '🎈', name: '气球', price: 3 },
      { emoji: '🍦', name: '冰淇淋', price: 7 },
      { emoji: '🚗', name: '小汽车', price: 12 },
      { emoji: '📏', name: '尺子', price: 2 },
      { emoji: '🎨', name: '蜡笔', price: 10 },
      { emoji: '🍪', name: '饼干', price: 6 },
      { emoji: '⚽', name: '足球', price: 20 }
    ];
    var coinValues = [1, 5, 10, 20, 50, 100];
    var shopIdx = 0;
    var shopSelected = [];
    var shopBought = 0;
    var shopBalance = 50;
    var shopAnswered = false;

    function renderShopItem() {
      shopAnswered = false;
      shopSelected = [];
      var item = shopItems[shopIdx];
      document.getElementById('shop-item').innerHTML =
        '<div class="shop-item-emoji">' + item.emoji + '</div>' +
        '<div class="shop-item-name">' + item.name + '</div>' +
        '<div class="shop-item-price">¥ ' + item.price + '元</div>';
      renderShopCoins();
      document.getElementById('shop-total').innerHTML = '已选: <span class="paid">0元</span>';
      document.getElementById('shop-feedback').textContent = '';
      document.getElementById('shop-check').style.display = '';
      document.getElementById('shop-next').style.display = 'none';
      document.getElementById('shop-bought').textContent = shopBought;
      document.getElementById('shop-balance').textContent = shopBalance;
    }

    function renderShopCoins() {
      var row = document.getElementById('shop-coins');
      row.innerHTML = '';
      coinValues.forEach(function(v) {
        var btn = document.createElement('button');
        btn.className = 'shop-coin c' + v;
        btn.textContent = v + '元';
        btn.setAttribute('data-val', v);
        btn.addEventListener('click', function() {
          if (shopAnswered) return;
          var idx = shopSelected.indexOf(v);
          if (idx >= 0) {
            shopSelected.splice(idx, 1);
            btn.classList.remove('selected');
          } else {
            shopSelected.push(v);
            btn.classList.add('selected');
          }
          var total = shopSelected.reduce(function(a, b) { return a + b; }, 0);
          document.getElementById('shop-total').innerHTML = '已选: <span class="paid">' + total + '元</span>';
        });
        row.appendChild(btn);
      });
    }

    document.getElementById('shop-check').addEventListener('click', function() {
      if (shopAnswered) return;
      shopAnswered = true;
      var item = shopItems[shopIdx];
      var total = shopSelected.reduce(function(a, b) { return a + b; }, 0);
      var fb = document.getElementById('shop-feedback');
      if (total === item.price) {
        fb.textContent = '✅ 正好！付得刚刚好！';
        fb.style.color = '#43A047';
        shopBought++;
        shopBalance -= item.price;
        updateStreak(true);
      } else if (total > item.price) {
        fb.textContent = '💰 付多了！应找 ' + (total - item.price) + ' 元';
        fb.style.color = '#FB8C00';
        shopBought++;
        shopBalance -= item.price;
        updateStreak(true);
      } else {
        fb.textContent = '❌ 钱不够哦！还差 ' + (item.price - total) + ' 元';
        fb.style.color = '#E53935';
        updateStreak(false);
      }
      document.getElementById('shop-check').style.display = 'none';
      document.getElementById('shop-next').style.display = '';
      document.getElementById('shop-bought').textContent = shopBought;
      document.getElementById('shop-balance').textContent = shopBalance;
    });

    document.getElementById('shop-next').addEventListener('click', function() {
      shopIdx = randInt(0, shopItems.length - 1);
      if (shopBalance <= 0) shopBalance = 50;
      renderShopItem();
    });

    renderShopItem();

    /* ===== 模式4: 限时挑战 ===== */
    var chTimer = null;
    var chTimeLeft = 0;
    var chCorrect = 0;
    var chWrong = 0;
    var chRunning = false;
    var CH_TIME = 60;

    function genChallenge() {
      var type = randInt(0, 5);
      var q, ans, opts;
      switch (type) {
        case 0: // 元转角
          var y = randInt(1, 9);
          q = y + '元 = ?角';
          ans = y * 10;
          opts = genOpts(ans, 1, 90);
          break;
        case 1: // 角转元
          var j = randInt(1, 9);
          q = j * 10 + '角 = ?元';
          ans = j;
          opts = genOpts(ans, 1, 20);
          break;
        case 2: // 角转分
          var j2 = randInt(1, 9);
          q = j2 + '角 = ?分';
          ans = j2 * 10;
          opts = genOpts(ans, 1, 90);
          break;
        case 3: // 比大小
          var a = randInt(1, 20), b = randInt(1, 20);
          q = a + '元 ○ ' + b + '元，○里填？';
          ans = a > b ? '>' : (a < b ? '<' : '=');
          opts = ['>', '<', '=', '≥'];
          break;
        case 4: // 购物找零
          var price = randInt(1, 15);
          var pay = (Math.floor(price / 10) + 1) * 10;
          q = '买' + price + '元的东西，付' + pay + '元，找?元';
          ans = pay - price;
          opts = genOpts(ans, 0, 20);
          break;
        default: // 凑钱
          var t = randInt(3, 15);
          q = '下面哪种组合能凑出' + t + '元？';
          var correct_combo = genCoinCombo(t);
          ans = correct_combo;
          opts = [correct_combo];
          while (opts.length < 4) {
            var fake = genCoinCombo(randInt(3, 15));
            if (opts.indexOf(fake) < 0) opts.push(fake);
          }
          opts = shuffle(opts);
          break;
      }
      return { question: q, answer: ans, options: opts };
    }

    function genCoinCombo(target) {
      var parts = [];
      var remain = target;
      var denoms = [10, 5, 2, 1];
      for (var i = 0; i < denoms.length && remain > 0; i++) {
        while (remain >= denoms[i]) {
          parts.push(denoms[i] + '元');
          remain -= denoms[i];
        }
      }
      return parts.join('+');
    }

    function genOpts(ans, min, max) {
      var opts = [ans];
      while (opts.length < 4) {
        var v = randInt(min, max);
        if (opts.indexOf(v) < 0) opts.push(v);
      }
      return shuffle(opts);
    }

    function startChallenge() {
      chCorrect = 0;
      chWrong = 0;
      chRunning = true;
      chTimeLeft = CH_TIME;
      document.getElementById('ch-correct').textContent = 0;
      document.getElementById('ch-wrong').textContent = 0;
      document.getElementById('mode-challenge').querySelector('.challenge-area').classList.add('challenge-active');
      nextChallenge();
      if (chTimer) clearInterval(chTimer);
      chTimer = setInterval(function() {
        chTimeLeft--;
        var pct = (chTimeLeft / CH_TIME) * 100;
        document.getElementById('timer-fill').style.width = pct + '%';
        if (chTimeLeft <= 0) {
          clearInterval(chTimer);
          chRunning = false;
          document.getElementById('ch-question').textContent = '⏰ 时间到！答对 ' + chCorrect + ' 题';
          document.getElementById('ch-options').innerHTML =
            '<button class="challenge-opt" id="ch-restart" style="grid-column:span 2">🔄 再来一次</button>';
          document.getElementById('ch-restart').addEventListener('click', function() {
            document.getElementById('mode-challenge').querySelector('.challenge-area').classList.remove('challenge-active');
            document.getElementById('timer-fill').style.width = '100%';
          });
        }
      }, 1000);
    }

    var curCh = null;
    function nextChallenge() {
      curCh = genChallenge();
      document.getElementById('ch-question').textContent = curCh.question;
      var optsEl = document.getElementById('ch-options');
      optsEl.innerHTML = '';
      curCh.options.forEach(function(opt) {
        var btn = document.createElement('button');
        btn.className = 'challenge-opt';
        btn.textContent = opt;
        btn.addEventListener('click', function() {
          if (!chRunning) return;
          var isCorrect = String(opt) === String(curCh.answer);
          if (isCorrect) {
            btn.classList.add('correct');
            chCorrect++;
            document.getElementById('ch-correct').textContent = chCorrect;
            updateStreak(true);
          } else {
            btn.classList.add('wrong');
            chWrong++;
            document.getElementById('ch-wrong').textContent = chWrong;
            updateStreak(false);
            // 高亮正确答案
            var btns = optsEl.querySelectorAll('.challenge-opt');
            btns.forEach(function(b) {
              if (String(b.textContent) === String(curCh.answer)) b.classList.add('correct');
            });
          }
          // 禁用所有按钮
          var btns = optsEl.querySelectorAll('.challenge-opt');
          btns.forEach(function(b) { b.style.pointerEvents = 'none'; });
          setTimeout(function() { if (chRunning) nextChallenge(); }, 1500);
        });
        optsEl.appendChild(btn);
      });
    }

    document.getElementById('btn-start-challenge').addEventListener('click', startChallenge);

    /* ===== 工具函数 ===== */
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
  })();
  </script>
</body>
