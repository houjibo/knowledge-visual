<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识人民币</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 认一认 */
    .money-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 16px; }
    .money-card {
      border-radius: 16px; padding: 16px; text-align: center; cursor: pointer;
      transition: all 0.2s ease; border: 3px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .money-card:active { transform: scale(0.95); }
    .money-card.selected { border-color: #4A90D9; box-shadow: 0 4px 16px rgba(74,144,217,0.3); }
    .money-card .money-emoji { font-size: 48px; margin-bottom: 8px; }
    .money-card .money-name { font-size: 16px; font-weight: 700; }
    .money-card .money-value { font-size: 13px; color: #6E6E73; margin-top: 4px; }
    .money-bill { background: linear-gradient(135deg, #f5f5f5, #e8e8e8); }
    .money-coin { background: linear-gradient(135deg, #fff8e1, #ffecb3); }
    .money-detail {
      background: #F8F8FA; border-radius: 16px; padding: 20px; margin: 16px;
      min-height: 120px; text-align: center;
    }
    .money-detail .detail-emoji { font-size: 72px; margin-bottom: 12px; }
    .money-detail .detail-name { font-size: 24px; font-weight: 700; color: #1D1D1F; }
    .money-detail .detail-desc { font-size: 15px; color: #6E6E73; margin-top: 8px; line-height: 1.6; }
    .money-detail .detail-equation { font-size: 20px; font-weight: 600; color: #4A90D9; margin-top: 12px; }

    /* 模式2: 换一换 */
    .exchange-area { padding: 24px 16px; text-align: center; }
    .exchange-problem { font-size: 28px; font-weight: 700; margin: 16px 0; color: #1D1D1F; }
    .exchange-problem .highlight { color: #FF9500; }
    .exchange-visual { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
    .exchange-coin { font-size: 40px; transition: all 0.3s ease; }
    .exchange-arrow { font-size: 32px; color: #4A90D9; }
    .exchange-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
    .exchange-opt {
      padding: 16px; border: 3px solid #9CA3AF; background: #F8F8FA;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .exchange-opt:active { transform: scale(0.95); }
    .exchange-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .exchange-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .exchange-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }

    /* 模式3: 算一算 */
    .calc-area { padding: 24px 16px; text-align: center; }
    .calc-problem { font-size: 26px; font-weight: 700; margin: 16px 0; color: #1D1D1F; }
    .calc-items { display: flex; justify-content: center; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
    .calc-item { text-align: center; }
    .calc-item .item-emoji { font-size: 40px; }
    .calc-item .item-price { font-size: 16px; font-weight: 600; color: #FF9500; margin-top: 4px; }
    .calc-input-area { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 20px 0; }
    .calc-input {
      width: 100px; padding: 12px; border: 3px solid #9CA3AF; border-radius: 12px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s ease;
    }
    .calc-input:focus { border-color: #4A90D9; }
    .calc-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .calc-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .calc-unit { font-size: 22px; font-weight: 600; color: #6E6E73; }
    .calc-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .calc-btn:active { transform: scale(0.95); }
    .calc-btn.secondary { background: #E5E5EA; color: #1D1D1F; box-shadow: none; }
    .calc-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }

    /* 模式4: 购物游戏 */
    .shop-area { padding: 16px; }
    .shop-header { text-align: center; margin-bottom: 16px; }
    .shop-balance { font-size: 24px; font-weight: 700; color: #34C759; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .shop-item {
      background: white; border-radius: 16px; padding: 16px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s ease;
      border: 3px solid transparent;
    }
    .shop-item:active { transform: scale(0.95); }
    .shop-item .item-emoji { font-size: 36px; }
    .shop-item .item-name { font-size: 14px; font-weight: 600; margin-top: 4px; }
    .shop-item .item-price { font-size: 16px; font-weight: 700; color: #FF9500; margin-top: 4px; }
    .shop-item.in-cart { border-color: #4A90D9; background: rgba(74,144,217,0.08); }
    .shop-item.disabled { opacity: 0.4; pointer-events: none; }
    .cart-bar {
      background: white; border-radius: 16px; padding: 16px; margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .cart-items { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .cart-tag {
      display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
      background: #E8F5E9; border-radius: 12px; font-size: 14px; font-weight: 600;
    }
    .cart-tag .remove { cursor: pointer; color: #FF3B30; margin-left: 4px; }
    .cart-total { font-size: 18px; font-weight: 700; color: #1D1D1F; margin: 8px 0; }
    .shop-actions { display: flex; gap: 12px; justify-content: center; }
    .shop-result { text-align: center; padding: 20px; margin: 12px 0; border-radius: 16px; font-size: 20px; font-weight: 700; }
    .shop-result.success { background: rgba(52,199,89,0.15); color: #34C759; }
    .shop-result.fail { background: rgba(255,59,48,0.1); color: #FF3B30; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">💰 认识人民币</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="recognize">💵 认一认</button>
      <button class="mode-tab" data-mode="exchange">🔄 换一换</button>
      <button class="mode-tab" data-mode="calculate">🧮 算一算</button>
      <button class="mode-tab" data-mode="shopping">🛒 购物游戏</button>
    </div>

    <!-- 模式1: 认一认 -->
    <div class="mode-content active" id="mode-recognize">
      <div class="card">
        <p class="page-subtitle">点一点，认识各种人民币</p>
        <div class="money-grid" id="money-grid"></div>
        <div class="money-detail" id="money-detail">
          <div class="detail-emoji" id="detail-emoji">💰</div>
          <div class="detail-name" id="detail-name">点上面的钱币，了解更多！</div>
          <div class="detail-desc" id="detail-desc">人民币的单位有：元、角、分</div>
          <div class="detail-equation" id="detail-equation">1元 = 10角，1角 = 10分</div>
        </div>
      </div>
    </div>

    <!-- 模式2: 换一换 -->
    <div class="mode-content" id="mode-exchange">
      <div class="card">
        <div class="exchange-area">
          <p class="page-subtitle">算算看，怎么换？</p>
          <div class="exchange-score">
            <span>答对 <b id="ex-correct" style="color:#34C759">0</b></span>
            <span>答错 <b id="ex-wrong" style="color:#FF3B30">0</b></span>
          </div>
          <div class="exchange-problem" id="ex-problem"></div>
          <div class="exchange-visual" id="ex-visual"></div>
          <div class="exchange-options" id="ex-options"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 算一算 -->
    <div class="mode-content" id="mode-calculate">
      <div class="card">
        <div class="calc-area">
          <p class="page-subtitle">算算一共多少钱？</p>
          <div class="calc-score">
            <span>答对 <b id="ca-correct" style="color:#34C759">0</b></span>
            <span>答错 <b id="ca-wrong" style="color:#FF3B30">0</b></span>
          </div>
          <div class="calc-items" id="calc-items"></div>
          <div class="calc-problem" id="calc-problem"></div>
          <div class="calc-input-area">
            <input class="calc-input" id="calc-answer" type="number" inputmode="numeric" placeholder="?">
            <span class="calc-unit" id="calc-unit">元</span>
          </div>
          <div>
            <button class="calc-btn" id="btn-calc-check">✅ 检查</button>
            <button class="calc-btn secondary" id="btn-calc-next">🔄 下一题</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 购物游戏 -->
    <div class="mode-content" id="mode-shopping">
      <div class="card">
        <div class="shop-area">
          <div class="shop-header">
            <p class="page-subtitle">你有 <span class="shop-balance" id="shop-balance">20</span> 元，来买东西吧！</p>
          </div>
          <div class="shop-grid" id="shop-grid"></div>
          <div class="cart-bar" id="cart-bar">
            <div style="font-size:16px;font-weight:700;color:#6E6E73;">🛒 购物车</div>
            <div class="cart-items" id="cart-items"></div>
            <div class="cart-total" id="cart-total">合计：0 元</div>
            <div class="shop-actions">
              <button class="calc-btn" id="btn-checkout">💳 结账</button>
              <button class="calc-btn secondary" id="btn-clear-cart">🗑️ 清空</button>
            </div>
          </div>
          <div id="shop-result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！理财小达人！`);
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // ====== 模式1: 认一认 ======
    (() => {
      const moneyData = [
        { emoji: '🪙', name: '1分', value: 0.01, type: 'coin', color: '#E8E8E8',
          desc: '最小的人民币单位', equation: '1角 = 10分' },
        { emoji: '🪙', name: '2分', value: 0.02, type: 'coin', color: '#E8E8E8',
          desc: '现在很少见到了', equation: '2分 = 1分 + 1分' },
        { emoji: '🪙', name: '5分', value: 0.05, type: 'coin', color: '#E8E8E8',
          desc: '半分就是2.5分', equation: '5分 + 5分 = 1角' },
        { emoji: '🪙', name: '1角', value: 0.1, type: 'coin', color: '#FFF8E1',
          desc: '1角硬币，铝制的', equation: '1角 = 10分' },
        { emoji: '🪙', name: '5角', value: 0.5, type: 'coin', color: '#FFF8E1',
          desc: '也叫"5毛钱"', equation: '5角 = 50分' },
        { emoji: '💴', name: '1元（纸币）', value: 1, type: 'bill', color: '#E8F5E9',
          desc: '橄榄绿色，上面有毛泽东头像', equation: '1元 = 10角' },
        { emoji: '💴', name: '5元（纸币）', value: 5, type: 'bill', color: '#E3F2FD',
          desc: '紫色，上面有毛泽东头像', equation: '5元 = 5张1元' },
        { emoji: '💴', name: '10元（纸币）', value: 10, type: 'bill', color: '#E3F2FD',
          desc: '蓝黑色', equation: '10元 = 2张5元' },
        { emoji: '💴', name: '20元（纸币）', value: 20, type: 'bill', color: '#FFF3E0',
          desc: '棕色', equation: '20元 = 2张10元' },
        { emoji: '💴', name: '50元（纸币）', value: 50, type: 'bill', color: '#E8F5E9',
          desc: '绿色', equation: '50元 = 5张10元' },
        { emoji: '💴', name: '100元（纸币）', value: 100, type: 'bill', color: '#FFEBEE',
          desc: '红色，最大的纸币', equation: '100元 = 2张50元' },
      ];

      const grid = document.getElementById('money-grid');
      moneyData.forEach((m, idx) => {
        const card = document.createElement('div');
        card.className = 'money-card ' + (m.type === 'bill' ? 'money-bill' : 'money-coin');
        card.style.background = m.color;
        card.innerHTML = `
          <div class="money-emoji">${m.emoji}</div>
          <div class="money-name">${m.name}</div>
          <div class="money-value">${m.value < 1 ? (m.value * 100) + '分' : m.value + '元'}</div>
        `;
        card.addEventListener('click', () => {
          document.querySelectorAll('.money-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          document.getElementById('detail-emoji').textContent = m.emoji;
          document.getElementById('detail-name').textContent = m.name;
          document.getElementById('detail-desc').textContent = m.desc;
          document.getElementById('detail-equation').textContent = m.equation;
          Sound.play('click');
          Animator.popIn(document.getElementById('money-detail'), 100);
        });
        grid.appendChild(card);
        Animator.popIn(card, idx * 50);
      });
    })();

    // ====== 模式2: 换一换 ======
    (() => {
      let correctCount = 0, wrongCount = 0, currentAnswer = 0;

      const questions = [
        { q: '1元 = ?角', visual: '💴 → 🪙🪙🪙🪙🪙🪙🪙🪙🪙🪙', options: [5, 10, 20, 100], answer: 10 },
        { q: '1角 = ?分', visual: '🪙 → 10个小分币', options: [5, 10, 20, 100], answer: 10 },
        { q: '2元 = ?角', visual: '💴💴 → ?', options: [10, 15, 20, 25], answer: 20 },
        { q: '5元 = ?张1元', visual: '💴(5元) → 💴💴💴💴💴', options: [3, 4, 5, 6], answer: 5 },
        { q: '10元 = ?张5元', visual: '💴(10元) → 💴(5元)💴(5元)', options: [1, 2, 3, 5], answer: 2 },
        { q: '3角 = ?分', visual: '🪙🪙🪙 → ?', options: [20, 30, 40, 50], answer: 30 },
        { q: '50分 = ?角', visual: '50个小分币 → ?', options: [3, 5, 8, 10], answer: 5 },
        { q: '1元 = ?分', visual: '💴 → ???分', options: [10, 50, 100, 1000], answer: 100 },
        { q: '20元 = ?张10元', visual: '💴(20元) → ?', options: [1, 2, 3, 4], answer: 2 },
        { q: '50元 = ?张10元', visual: '💴(50元) → ?', options: [3, 4, 5, 6], answer: 5 },
        { q: '3元 = ?角', visual: '💴💴💴 → ?', options: [13, 20, 30, 40], answer: 30 },
        { q: '100元 = ?张20元', visual: '💴(100元) → ?', options: [3, 4, 5, 10], answer: 5 },
      ];

      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      let qList = shuffleArray(questions);
      let qIdx = 0;

      function newQuestion() {
        if (qIdx >= qList.length) { qList = shuffleArray(questions); qIdx = 0; }
        const q = qList[qIdx];
        currentAnswer = q.answer;
        document.getElementById('ex-problem').innerHTML = q.q.replace('?', '<span class="highlight">?</span>');
        document.getElementById('ex-visual').textContent = q.visual;

        const opts = document.getElementById('ex-options');
        opts.innerHTML = '';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'exchange-opt';
          btn.textContent = opt + (q.q.includes('角') && !q.q.includes('张') ? '角' : q.q.includes('分') && !q.q.includes('张') ? '分' : q.q.includes('张') ? '张' : '');
          btn.addEventListener('click', () => {
            document.querySelectorAll('.exchange-opt').forEach(b => b.style.pointerEvents = 'none');
            if (opt === q.answer) {
              btn.classList.add('correct'); correctCount++; streak++;
              Sound.play('correct'); showToast('✅ 答对了！');
              updateStreak();
            } else {
              btn.classList.add('wrong'); wrongCount++; streak = 0;
              Sound.play('wrong');
              document.querySelectorAll('.exchange-opt').forEach(b => {
                if (b.textContent.startsWith(q.answer) || parseInt(b.textContent) === q.answer) b.classList.add('correct');
              });
              updateStreak();
            }
            document.getElementById('ex-correct').textContent = correctCount;
            document.getElementById('ex-wrong').textContent = wrongCount;
            setTimeout(() => { qIdx++; newQuestion(); }, 1500);
          });
          opts.appendChild(btn);
        });
      }

      newQuestion();
    })();

    // ====== 模式3: 算一算 ======
    (() => {
      let correctCount = 0, wrongCount = 0, currentTotal = 0, currentUnit = '元';

      const itemPool = [
        { emoji: '✏️', name: '铅笔', price: 0.5 },
        { emoji: '📏', name: '尺子', price: 1 },
        { emoji: '📒', name: '练习本', price: 2 },
        { emoji: '🧃', name: '果汁', price: 3 },
        { emoji: '🍞', name: '面包', price: 4 },
        { emoji: '🎨', name: '蜡笔', price: 5 },
        { emoji: '📚', name: '故事书', price: 8 },
        { emoji: '🧸', name: '小玩具', price: 6 },
        { emoji: '🍎', name: '苹果', price: 2 },
        { emoji: '🥛', name: '牛奶', price: 3 },
        { emoji: '🍬', name: '糖果', price: 0.5 },
        { emoji: '✏️', name: '橡皮', price: 1 },
      ];

      function newCalc() {
        const count = Random.int(2, 4);
        const items = [];
        const used = new Set();
        while (items.length < count) {
          const idx = Random.int(0, itemPool.length - 1);
          if (!used.has(idx)) {
            used.add(idx);
            items.push(itemPool[idx]);
          }
        }

        const container = document.getElementById('calc-items');
        container.innerHTML = '';
        currentTotal = 0;
        items.forEach((item, idx) => {
          currentTotal += item.price;
          const el = document.createElement('div');
          el.className = 'calc-item';
          el.innerHTML = `<div class="item-emoji">${item.emoji}</div><div class="item-name">${item.name}</div><div class="item-price">${item.price}元</div>`;
          container.appendChild(el);
          Animator.popIn(el, idx * 100);
        });

        document.getElementById('calc-problem').textContent = `一共多少钱？`;
        const isYuan = currentTotal === Math.floor(currentTotal);
        currentUnit = isYuan ? '元' : '元';
        document.getElementById('calc-unit').textContent = '元';
        const input = document.getElementById('calc-answer');
        input.value = '';
        input.className = 'calc-input';
        input.disabled = false;
      }

      document.getElementById('btn-calc-check').addEventListener('click', () => {
        const input = document.getElementById('calc-answer');
        const val = parseFloat(input.value);
        if (isNaN(val)) { showToast('请输入数字！'); return; }
        input.disabled = true;
        if (Math.abs(val - currentTotal) < 0.01) {
          input.classList.add('correct'); correctCount++; streak++;
          Sound.play('correct'); showToast(`✅ 答对了！一共 ${currentTotal} 元`);
          updateStreak();
        } else {
          input.classList.add('wrong'); wrongCount++; streak = 0;
          Sound.play('wrong'); showToast(`❌ 不对哦，一共是 ${currentTotal} 元`);
          updateStreak();
        }
        document.getElementById('ca-correct').textContent = correctCount;
        document.getElementById('ca-wrong').textContent = wrongCount;
      });

      document.getElementById('btn-calc-next').addEventListener('click', () => {
        newCalc();
        Sound.play('click');
      });

      document.getElementById('calc-answer').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-calc-check').click();
      });

      newCalc();
    })();

    // ====== 模式4: 购物游戏 ======
    (() => {
      const balance = 20;
      let cart = [];

      const shopItems = [
        { emoji: '✏️', name: '铅笔', price: 1 },
        { emoji: '📏', name: '尺子', price: 2 },
        { emoji: '📒', name: '练习本', price: 3 },
        { emoji: '🧃', name: '果汁', price: 4 },
        { emoji: '🍞', name: '面包', price: 5 },
        { emoji: '🎨', name: '蜡笔', price: 6 },
        { emoji: '📚', name: '故事书', price: 8 },
        { emoji: '🧸', name: '小玩具', price: 7 },
        { emoji: '🍎', name: '苹果', price: 2 },
        { emoji: '🥛', name: '牛奶', price: 3 },
        { emoji: '🍬', name: '糖果', price: 1 },
        { emoji: '✏️', name: '橡皮', price: 1 },
      ];

      document.getElementById('shop-balance').textContent = balance;

      const grid = document.getElementById('shop-grid');
      shopItems.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.dataset.idx = idx;
        el.innerHTML = `
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-price">${item.price}元</div>
        `;
        el.addEventListener('click', () => {
          if (el.classList.contains('in-cart')) {
            // 移除
            cart = cart.filter(c => c.idx !== idx);
            el.classList.remove('in-cart');
          } else {
            // 加入
            cart.push({ ...item, idx });
            el.classList.add('in-cart');
          }
          updateCart();
          Sound.play('click');
        });
        grid.appendChild(el);
        Animator.popIn(el, idx * 40);
      });

      function updateCart() {
        const total = cart.reduce((s, c) => s + c.price, 0);
        const container = document.getElementById('cart-items');
        container.innerHTML = '';
        cart.forEach(c => {
          const tag = document.createElement('span');
          tag.className = 'cart-tag';
          tag.innerHTML = `${c.emoji} ${c.name} (${c.price}元)<span class="remove" data-idx="${c.idx}">✕</span>`;
          container.appendChild(tag);
        });
        document.getElementById('cart-total').textContent = `合计：${total} 元`;

        // 更新禁用状态
        document.querySelectorAll('.shop-item').forEach(el => {
          const idx = parseInt(el.dataset.idx);
          const item = shopItems[idx];
          const remaining = balance - total;
          if (!el.classList.contains('in-cart') && remaining < item.price) {
            el.classList.add('disabled');
          } else {
            el.classList.remove('disabled');
          }
        });

        document.getElementById('shop-result').innerHTML = '';
      }

      document.getElementById('cart-items').addEventListener('click', (e) => {
        if (e.target.classList.contains('remove')) {
          const idx = parseInt(e.target.dataset.idx);
          cart = cart.filter(c => c.idx !== idx);
          document.querySelector(`.shop-item[data-idx="${idx}"]`).classList.remove('in-cart');
          updateCart();
          Sound.play('click');
        }
      });

      document.getElementById('btn-clear-cart').addEventListener('click', () => {
        cart = [];
        document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('in-cart'));
        updateCart();
        Sound.play('click');
      });

      document.getElementById('btn-checkout').addEventListener('click', () => {
        if (cart.length === 0) { showToast('购物车是空的，先选一些东西吧！'); return; }
        const total = cart.reduce((s, c) => s + c.price, 0);
        const result = document.getElementById('shop-result');
        if (total <= balance) {
          const change = balance - total;
          result.innerHTML = `<div class="shop-result success">✅ 购买成功！花费 ${total} 元，还剩 ${change} 元</div>`;
          Sound.play('correct'); celebrate();
          streak++;
          updateStreak();
        } else {
          result.innerHTML = `<div class="shop-result fail">❌ 钱不够！你有 ${balance} 元，需要 ${total} 元</div>`;
          Sound.play('wrong'); streak = 0;
          updateStreak();
        }
      });
    })();
  </script>
</body>
</html>
