<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>用字母表示数</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 认识 */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 420px;
    }
    .learn-emoji { font-size: 56px; margin-bottom: 12px; }
    .learn-title { font-size: 20px; font-weight: 700; color: #4A90D9; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.6; text-align: left; }
    .learn-formula {
      font-size: 28px; font-weight: 800; color: #F44336; margin: 16px 0;
      background: #FFF8E1; padding: 12px 20px; border-radius: 14px; display: inline-block;
    }
    .learn-feature {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
    }
    .feature-tag {
      padding: 8px 16px; border-radius: 12px; font-size: 15px; font-weight: 600;
      background: rgba(74,144,217,0.1); color: #4A90D9;
    }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #4A90D9; color: white; box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }
    .learn-page { font-size: 14px; color: #9CA3AF; margin-top: 8px; }

    /* 模式2: 代入求值 */
    .eval-area { text-align: center; padding: 24px 16px; }
    .eval-problem {
      font-size: 22px; font-weight: 700; color: #1D1D1F; margin: 16px 0;
      background: white; padding: 16px 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 420px; margin-left: auto; margin-right: auto;
    }
    .eval-expr { font-size: 30px; font-weight: 800; color: #4A90D9; }
    .eval-hint { font-size: 16px; color: #FF9500; margin: 8px 0; font-weight: 600; }
    .eval-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .eval-opt {
      padding: 14px 28px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 22px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9; min-width: 70px;
    }
    .eval-opt:active { transform: scale(0.95); }
    .eval-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .eval-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .eval-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .eval-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式3: 找规律 */
    .pattern-area { text-align: center; padding: 24px 16px; }
    .pattern-problem {
      font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0;
      background: white; padding: 16px 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 420px; margin-left: auto; margin-right: auto;
      line-height: 1.8;
    }
    .pattern-seq {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0;
    }
    .seq-item {
      width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; font-size: 20px; font-weight: 700;
    }
    .seq-num { background: #E3F2FD; color: #1565C0; }
    .seq-letter { background: #FFF3E0; color: #E65100; border: 2px dashed #FF9500; }
    .pattern-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .pattern-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9;
    }
    .pattern-opt:active { transform: scale(0.95); }
    .pattern-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .pattern-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .pattern-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .pattern-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式4: 挑战 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-problem {
      font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0;
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 420px; margin-left: auto; margin-right: auto;
      line-height: 1.8; text-align: left;
    }
    .challenge-expr { font-size: 26px; font-weight: 800; color: #F44336; text-align: center; margin: 8px 0; }
    .challenge-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .challenge-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9; min-width: 70px;
    }
    .challenge-opt:active { transform: scale(0.95); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }
    .challenge-timer {
      font-size: 32px; font-weight: 800; color: #FF9500; margin: 8px 0;
    }

    .streak-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 700; background: #FFF3E0; color: #FF9500;
    }
    .next-btn {
      padding: 14px 28px; border: none; background: #4A90D9; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      margin: 8px; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .next-btn:active { transform: scale(0.95); }
    .next-btn.secondary { background: #E5E5EA; color: #1D1D1F; box-shadow: none; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">用字母表示数</span>
    </nav>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="learn">📖 认识</button>
      <button class="mode-tab" data-mode="eval">🔢 代入求值</button>
      <button class="mode-tab" data-mode="pattern">🔍 找规律</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 认识 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card" id="learnCard">
          <div class="learn-emoji" id="learnEmoji"></div>
          <div class="learn-title" id="learnTitle"></div>
          <div class="learn-formula" id="learnFormula"></div>
          <div class="learn-desc" id="learnDesc"></div>
          <div class="learn-feature" id="learnFeatures"></div>
        </div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="btnLearnPrev">← 上一个</button>
          <button class="learn-btn primary" id="btnLearnNext">下一个 →</button>
        </div>
        <div class="learn-page" id="learnPage"></div>
      </div>
    </div>

    <!-- 模式2: 代入求值 -->
    <div class="mode-content" id="mode-eval">
      <div class="eval-area">
        <div class="eval-problem">
          <div class="eval-hint" id="evalHint"></div>
          <div class="eval-expr" id="evalExpr"></div>
        </div>
        <div class="eval-options" id="evalOptions"></div>
        <div class="eval-feedback" id="evalFeedback"></div>
        <div class="eval-score">
          <span>✅ <span id="evalCorrect">0</span></span>
          <span>❌ <span id="evalWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="evalStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnEvalNext">下一题 →</button>
      </div>
    </div>

    <!-- 模式3: 找规律 -->
    <div class="mode-content" id="mode-pattern">
      <div class="pattern-area">
        <div class="pattern-problem" id="patternProblem"></div>
        <div class="pattern-seq" id="patternSeq"></div>
        <div class="pattern-options" id="patternOptions"></div>
        <div class="pattern-feedback" id="patternFeedback"></div>
        <div class="pattern-score">
          <span>✅ <span id="patternCorrect">0</span></span>
          <span>❌ <span id="patternWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="patternStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnPatternNext">下一题 →</button>
      </div>
    </div>

    <!-- 模式4: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <div class="challenge-timer" id="challengeTimer">⏱️ 30</div>
        <div class="challenge-problem" id="challengeProblem"></div>
        <div class="challenge-options" id="challengeOptions"></div>
        <div class="challenge-feedback" id="challengeFeedback"></div>
        <div class="challenge-score">
          <span>✅ <span id="challengeCorrect">0</span></span>
          <span>❌ <span id="challengeWrong">0</span></span>
          <span class="streak-badge">🔥 <span id="challengeStreak">0</span></span>
        </div>
        <button class="next-btn" id="btnChallengeStart">🚀 开始挑战</button>
        <button class="next-btn secondary" id="btnChallengeNext" style="display:none;">下一题 →</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        if (typeof Sound !== 'undefined') Sound.play('click');
      });
    });

    // === 工具函数 ===
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function uniqueOptions(correct, count, min, max) {
      var opts = [correct];
      var attempts = 0;
      while (opts.length < count && attempts < 100) {
        var v = randInt(min, max);
        if (opts.indexOf(v) === -1) opts.push(v);
        attempts++;
      }
      return shuffle(opts);
    }

    // === 模式1: 认识 ===
    (function() {
      var lessons = [
        {
          emoji: '🤔',
          title: '为什么用字母？',
          formula: '□ + 3 = 7',
          desc: '以前我们用方框"□"表示不知道的数。现在我们用字母来表示，比如 a + 3 = 7，这里的 a 就代表一个数。字母就像一个"小盒子"，里面装着一个数字！',
          features: ['字母 = 未知数', '更简洁', '更通用']
        },
        {
          emoji: '📏',
          title: '正方形的周长',
          formula: 'C = 4 × a',
          desc: '正方形有4条相等的边。如果边长用 a 表示，那么周长就是 4 乘以 a。比如 a = 3厘米，周长 = 4 × 3 = 12厘米。用字母写一次，所有正方形都能用！',
          features: ['a = 边长', 'C = 周长', '通用公式']
        },
        {
          emoji: '📐',
          title: '长方形的面积',
          formula: 'S = a × b',
          desc: '长方形面积 = 长 × 宽。用 a 表示长，b 表示宽，面积公式就是 S = a × b。比如 a = 5, b = 3，面积 = 5 × 3 = 15 平方厘米。',
          features: ['a = 长', 'b = 宽', 'S = 面积']
        },
        {
          emoji: '🚗',
          title: '路程公式',
          formula: 's = v × t',
          desc: '路程 = 速度 × 时间。如果汽车速度是 v（千米/小时），开了 t 小时，那么走过的路程 s = v × t。比如 v = 60, t = 2, s = 120千米。',
          features: ['v = 速度', 't = 时间', 's = 路程']
        },
        {
          emoji: '💰',
          title: '总价公式',
          formula: '总价 = 单价 × 数量',
          desc: '买苹果，每个 a 元，买了 n 个，总价就是 a × n 元。用字母表示，不管买多少个、单价多少，都能算！这就是字母的魔力。',
          features: ['a = 单价', 'n = 数量', '通用！']
        },
        {
          emoji: '📝',
          title: '书写规则',
          formula: 'a × b → ab',
          desc: '字母和字母相乘，乘号可以省略！a × b 写成 ab。数字和字母相乘，数字写在前面：3 × a 写成 3a。但 a + b 不能写成 ab 哦，加号不能省！',
          features: ['乘号可省略', '数字在前', '加号不可省']
        }
      ];
      var idx = 0;
      function render() {
        var l = lessons[idx];
        document.getElementById('learnEmoji').textContent = l.emoji;
        document.getElementById('learnTitle').textContent = l.title;
        document.getElementById('learnFormula').textContent = l.formula;
        document.getElementById('learnDesc').textContent = l.desc;
        var featHtml = '';
        for (var i = 0; i < l.features.length; i++) {
          featHtml += '<span class="feature-tag">' + l.features[i] + '</span>';
        }
        document.getElementById('learnFeatures').innerHTML = featHtml;
        document.getElementById('learnPage').textContent = (idx + 1) + ' / ' + lessons.length;
        document.getElementById('btnLearnPrev').style.visibility = idx === 0 ? 'hidden' : 'visible';
        document.getElementById('btnLearnNext').textContent = idx === lessons.length - 1 ? '重新开始 🔄' : '下一个 →';
      }
      document.getElementById('btnLearnPrev').addEventListener('click', function() {
        if (idx > 0) { idx--; render(); if (typeof Sound !== 'undefined') Sound.play('click'); }
      });
      document.getElementById('btnLearnNext').addEventListener('click', function() {
        if (idx < lessons.length - 1) { idx++; } else { idx = 0; }
        render();
        if (typeof Sound !== 'undefined') Sound.play('click');
      });
      render();
    })();

    // === 模式2: 代入求值 ===
    (function() {
      var correct = 0, wrong = 0, streak = 0, locked = false;

      var templates = [
        function() {
          var a = randInt(2, 15);
          var b = randInt(1, 20);
          var answer = a + b;
          return { hint: '当 a = ' + a + ' 时', expr: 'a + ' + b + ' = ?', answer: answer, min: Math.max(1, answer - 5), max: answer + 5 };
        },
        function() {
          var a = randInt(5, 25);
          var b = randInt(1, a);
          var answer = a - b;
          return { hint: '当 a = ' + a + ' 时', expr: 'a − ' + b + ' = ?', answer: answer, min: Math.max(0, answer - 5), max: answer + 5 };
        },
        function() {
          var a = randInt(2, 9);
          var b = randInt(2, 9);
          var answer = a * b;
          return { hint: '当 a = ' + a + ' 时', expr: 'a × ' + b + ' = ?', answer: answer, min: Math.max(1, answer - 8), max: answer + 8 };
        },
        function() {
          var a = randInt(2, 8);
          var b = randInt(2, 5);
          var c = randInt(1, 10);
          var answer = a * b + c;
          return { hint: '当 a = ' + a + ' 时', expr: b + 'a + ' + c + ' = ?', answer: answer, min: Math.max(1, answer - 8), max: answer + 8 };
        },
        function() {
          var a = randInt(2, 6);
          var answer = a * a;
          return { hint: '当 a = ' + a + ' 时', expr: 'a² = a × a = ?', answer: answer, min: Math.max(1, answer - 6), max: answer + 6 };
        },
        function() {
          var a = randInt(10, 50);
          var answer = 4 * a;
          return { hint: '正方形边长 a = ' + a + 'cm', expr: '周长 = 4a = ?', answer: answer, min: Math.max(1, answer - 20), max: answer + 20 };
        },
        function() {
          var a = randInt(2, 12);
          var b = randInt(2, 10);
          var answer = a * b;
          return { hint: '长方形长 a = ' + a + '，宽 b = ' + b, expr: '面积 = ab = ?', answer: answer, min: Math.max(1, answer - 10), max: answer + 10 };
        },
        function() {
          var v = randInt(10, 80);
          var t = randInt(2, 5);
          var answer = v * t;
          return { hint: '速度 v = ' + v + 'km/h，时间 t = ' + t + 'h', expr: '路程 s = vt = ?', answer: answer, min: Math.max(1, answer - 40), max: answer + 40 };
        }
      ];

      function genProblem() {
        var tpl = templates[randInt(0, templates.length - 1)];
        return tpl();
      }

      function renderProblem() {
        locked = false;
        var p = genProblem();
        document.getElementById('evalHint').textContent = p.hint;
        document.getElementById('evalExpr').textContent = p.expr;
        document.getElementById('evalFeedback').textContent = '';
        document.getElementById('evalFeedback').style.color = '#1D1D1F';
        var opts = uniqueOptions(p.answer, 4, p.min, p.max);
        var html = '';
        for (var i = 0; i < opts.length; i++) {
          html += '<button class="eval-opt" data-val="' + opts[i] + '">' + opts[i] + '</button>';
        }
        document.getElementById('evalOptions').innerHTML = html;
        document.querySelectorAll('.eval-opt').forEach(function(btn) {
          btn.addEventListener('click', function() {
            if (locked) return;
            locked = true;
            var val = parseInt(btn.getAttribute('data-val'));
            if (val === p.answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('evalFeedback').textContent = '✅ 答对啦！太棒了！';
              document.getElementById('evalFeedback').style.color = '#34C759';
              if (typeof Sound !== 'undefined') Sound.play('correct');
              setTimeout(function() { renderProblem(); }, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('evalFeedback').textContent = '❌ 再想想，答案是 ' + p.answer;
              document.getElementById('evalFeedback').style.color = '#FF3B30';
              if (typeof Sound !== 'undefined') Sound.play('wrong');
              // highlight correct
              document.querySelectorAll('.eval-opt').forEach(function(b) {
                if (parseInt(b.getAttribute('data-val')) === p.answer) b.classList.add('correct');
              });
            }
            document.getElementById('evalCorrect').textContent = correct;
            document.getElementById('evalWrong').textContent = wrong;
            document.getElementById('evalStreak').textContent = streak;
          });
        });
      }

      document.getElementById('btnEvalNext').addEventListener('click', function() {
        renderProblem();
        if (typeof Sound !== 'undefined') Sound.play('click');
      });
      renderProblem();
    })();

    // === 模式3: 找规律 ===
    (function() {
      var correct = 0, wrong = 0, streak = 0, locked = false;

      var generators = [
        // 等差数列，用字母表示第n项
        function() {
          var start = randInt(1, 10);
          var diff = randInt(2, 6);
          var seq = [];
          for (var i = 0; i < 5; i++) seq.push(start + diff * i);
          var answer = start + diff * 5;
          return {
            problem: '找规律，填下一个数：',
            seq: seq,
            answer: answer,
            explain: '每次 +' + diff,
            min: Math.max(1, answer - 8),
            max: answer + 8
          };
        },
        // 用字母表示规律
        function() {
          var n = randInt(3, 8);
          var answer = n * (n + 1);
          var seq = [];
          for (var i = 1; i <= 4; i++) seq.push(i * (i + 1));
          return {
            problem: '规律：1×2, 2×3, 3×4, 4×5, …\n第 ' + n + ' 个是多少？',
            seq: seq,
            answer: answer,
            explain: '第n个 = n×(n+1)',
            min: Math.max(1, answer - 10),
            max: answer + 10
          };
        },
        // 正方形数
        function() {
          var n = randInt(3, 7);
          var answer = n * n;
          var seq = [];
          for (var i = 1; i <= 4; i++) seq.push(i * i);
          return {
            problem: '规律：1, 4, 9, 16, …\n第 ' + n + ' 个是多少？',
            seq: seq,
            answer: answer,
            explain: '第n个 = n²',
            min: Math.max(1, answer - 10),
            max: answer + 10
          };
        },
        // 等差求第n项
        function() {
          var start = randInt(1, 5);
          var diff = randInt(3, 7);
          var n = randInt(5, 8);
          var answer = start + diff * (n - 1);
          var seq = [];
          for (var i = 0; i < 4; i++) seq.push(start + diff * i);
          return {
            problem: '等差数列，公差为 ' + diff + '\n第 ' + n + ' 项是多少？',
            seq: seq,
            answer: answer,
            explain: '第n项 = 首项 + 公差×(n-1)',
            min: Math.max(1, answer - 10),
            max: answer + 10
          };
        },
        // 用字母表示：青蛙问题
        function() {
          var n = randInt(3, 9);
          var answer = n * 4;
          return {
            problem: '1只青蛙4条腿，\n2只青蛙8条腿，\n3只青蛙12条腿……\n' + n + '只青蛙几条腿？',
            seq: [4, 8, 12, 16],
            answer: answer,
            explain: 'n只青蛙 = 4n 条腿',
            min: Math.max(1, answer - 8),
            max: answer + 8
          };
        },
        // 倍数规律
        function() {
          var base = randInt(2, 6);
          var n = randInt(4, 8);
          var answer = base * n;
          var seq = [];
          for (var i = 1; i <= 4; i++) seq.push(base * i);
          return {
            problem: '规律：' + base + ', ' + (base*2) + ', ' + (base*3) + ', ' + (base*4) + ', …\n第 ' + n + ' 个数是多少？',
            seq: seq,
            answer: answer,
            explain: '第n个 = ' + base + 'n',
            min: Math.max(1, answer - 8),
            max: answer + 8
          };
        }
      ];

      function gen() {
        return generators[randInt(0, generators.length - 1)]();
      }

      function render() {
        locked = false;
        var p = gen();
        document.getElementById('patternProblem').textContent = p.problem;
        var seqHtml = '';
        for (var i = 0; i < p.seq.length; i++) {
          seqHtml += '<span class="seq-item seq-num">' + p.seq[i] + '</span>';
        }
        seqHtml += '<span class="seq-item seq-letter">?</span>';
        document.getElementById('patternSeq').innerHTML = seqHtml;
        document.getElementById('patternFeedback').textContent = '';
        document.getElementById('patternFeedback').style.color = '#1D1D1F';
        var opts = uniqueOptions(p.answer, 4, p.min, p.max);
        var html = '';
        for (var i = 0; i < opts.length; i++) {
          html += '<button class="pattern-opt" data-val="' + opts[i] + '">' + opts[i] + '</button>';
        }
        document.getElementById('patternOptions').innerHTML = html;
        document.querySelectorAll('.pattern-opt').forEach(function(btn) {
          btn.addEventListener('click', function() {
            if (locked) return;
            locked = true;
            var val = parseInt(btn.getAttribute('data-val'));
            if (val === p.answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('patternFeedback').textContent = '✅ 找到规律了！' + p.explain;
              document.getElementById('patternFeedback').style.color = '#34C759';
              if (typeof Sound !== 'undefined') Sound.play('correct');
              setTimeout(function() { render(); }, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('patternFeedback').textContent = '❌ 提示：' + p.explain;
              document.getElementById('patternFeedback').style.color = '#FF3B30';
              if (typeof Sound !== 'undefined') Sound.play('wrong');
              document.querySelectorAll('.pattern-opt').forEach(function(b) {
                if (parseInt(b.getAttribute('data-val')) === p.answer) b.classList.add('correct');
              });
            }
            document.getElementById('patternCorrect').textContent = correct;
            document.getElementById('patternWrong').textContent = wrong;
            document.getElementById('patternStreak').textContent = streak;
          });
        });
      }

      document.getElementById('btnPatternNext').addEventListener('click', function() {
        render();
        if (typeof Sound !== 'undefined') Sound.play('click');
      });
      render();
    })();

    // === 模式4: 挑战 ===
    (function() {
      var correct = 0, wrong = 0, streak = 0, locked = false;
      var timer = 30, timerInterval = null, running = false;

      var challenges = [
        function() {
          var a = randInt(3, 12); var b = randInt(2, 8);
          var answer = a * b;
          return {
            problem: '🧮 代入计算',
            expr: '当 a = ' + a + ' 时，' + b + 'a = ?',
            answer: answer, min: Math.max(1, answer - 10), max: answer + 10
          };
        },
        function() {
          var a = randInt(2, 10); var b = randInt(1, 15);
          var answer = a * a + b;
          return {
            problem: '🧮 代入计算',
            expr: '当 a = ' + a + ' 时，a² + ' + b + ' = ?',
            answer: answer, min: Math.max(1, answer - 10), max: answer + 10
          };
        },
        function() {
          var n = randInt(3, 8);
          var answer = n * 2 + 1;
          return {
            problem: '🔍 用字母表示规律',
            expr: '第n个奇数 = 2n+1\n第' + n + '个奇数 = ?',
            answer: answer, min: Math.max(1, answer - 5), max: answer + 5
          };
        },
        function() {
          var a = randInt(5, 20); var b = randInt(2, 10);
          var answer = a - b * 2;
          return {
            problem: '🧮 代入计算',
            expr: '当 a = ' + a + ', b = ' + b + ' 时\na − 2b = ?',
            answer: answer, min: Math.max(0, answer - 6), max: answer + 6
          };
        },
        function() {
          var a = randInt(2, 6); var b = randInt(2, 6);
          var answer = (a + b) * (a + b);
          return {
            problem: '🧮 代入计算',
            expr: '当 a = ' + a + ', b = ' + b + ' 时\n(a + b)² = ?',
            answer: answer, min: Math.max(1, answer - 15), max: answer + 15
          };
        },
        function() {
          var price = randInt(3, 15); var qty = randInt(4, 12);
          var answer = price * qty;
          return {
            problem: '💰 应用题',
            expr: '单价 ' + price + ' 元，买 ' + qty + ' 个\n总价 = ?',
            answer: answer, min: Math.max(1, answer - 15), max: answer + 15
          };
        },
        function() {
          var a = randInt(2, 9);
          var answer = 2 * a + 3 * a;
          return {
            problem: '📝 化简求值',
            expr: '2a + 3a = ?a\n当 a = ' + a + ' 时，结果 = ?',
            answer: 5 * a, min: Math.max(1, 5*a - 10), max: 5*a + 10
          };
        },
        function() {
          var n = randInt(4, 10);
          var answer = n * (n - 1);
          return {
            problem: '🔍 找规律',
            expr: '2×1, 3×2, 4×3, …\n第' + (n-1) + '项 = ?',
            answer: answer, min: Math.max(1, answer - 10), max: answer + 10
          };
        }
      ];

      function genChallenge() {
        return challenges[randInt(0, challenges.length - 1)]();
      }

      function renderChallenge() {
        locked = false;
        var p = genChallenge();
        var probHtml = '<div style="text-align:center;font-weight:700;color:#4A90D9;margin-bottom:8px;">' + p.problem + '</div>';
        probHtml += '<div class="challenge-expr">' + p.expr.replace(/\n/g, '<br>') + '</div>';
        document.getElementById('challengeProblem').innerHTML = probHtml;
        document.getElementById('challengeFeedback').textContent = '';
        document.getElementById('challengeFeedback').style.color = '#1D1D1F';
        var opts = uniqueOptions(p.answer, 4, p.min, p.max);
        var html = '';
        for (var i = 0; i < opts.length; i++) {
          html += '<button class="challenge-opt" data-val="' + opts[i] + '">' + opts[i] + '</button>';
        }
        document.getElementById('challengeOptions').innerHTML = html;
        document.querySelectorAll('.challenge-opt').forEach(function(btn) {
          btn.addEventListener('click', function() {
            if (locked) return;
            locked = true;
            var val = parseInt(btn.getAttribute('data-val'));
            if (val === p.answer) {
              btn.classList.add('correct');
              correct++; streak++;
              document.getElementById('challengeFeedback').textContent = '✅ 正确！';
              document.getElementById('challengeFeedback').style.color = '#34C759';
              if (typeof Sound !== 'undefined') Sound.play('correct');
              setTimeout(function() { if (running) renderChallenge(); }, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++; streak = 0;
              document.getElementById('challengeFeedback').textContent = '❌ 答案是 ' + p.answer;
              document.getElementById('challengeFeedback').style.color = '#FF3B30';
              if (typeof Sound !== 'undefined') Sound.play('wrong');
              document.querySelectorAll('.challenge-opt').forEach(function(b) {
                if (parseInt(b.getAttribute('data-val')) === p.answer) b.classList.add('correct');
              });
            }
            document.getElementById('challengeCorrect').textContent = correct;
            document.getElementById('challengeWrong').textContent = wrong;
            document.getElementById('challengeStreak').textContent = streak;
          });
        });
      }

      function startTimer() {
        timer = 30;
        document.getElementById('challengeTimer').textContent = '⏱️ ' + timer;
        document.getElementById('challengeTimer').style.color = '#FF9500';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function() {
          timer--;
          document.getElementById('challengeTimer').textContent = '⏱️ ' + timer;
          if (timer <= 5) document.getElementById('challengeTimer').style.color = '#FF3B30';
          if (timer <= 0) {
            clearInterval(timerInterval);
            running = false;
            document.getElementById('challengeFeedback').textContent = '⏰ 时间到！答对 ' + correct + ' 题！';
            document.getElementById('challengeFeedback').style.color = '#FF9500';
            document.getElementById('challengeOptions').innerHTML = '';
            document.getElementById('btnChallengeStart').style.display = '';
            document.getElementById('btnChallengeStart').textContent = '🔄 再来一次';
            document.getElementById('btnChallengeNext').style.display = 'none';
          }
        }, 1000);
      }

      document.getElementById('btnChallengeStart').addEventListener('click', function() {
        correct = 0; wrong = 0; streak = 0;
        document.getElementById('challengeCorrect').textContent = 0;
        document.getElementById('challengeWrong').textContent = 0;
        document.getElementById('challengeStreak').textContent = 0;
        running = true;
        this.style.display = 'none';
        document.getElementById('btnChallengeNext').style.display = '';
        startTimer();
        renderChallenge();
        if (typeof Sound !== 'undefined') Sound.play('click');
      });

      document.getElementById('btnChallengeNext').addEventListener('click', function() {
        if (running) renderChallenge();
        if (typeof Sound !== 'undefined') Sound.play('click');
      });
    })();
  </script>
</body>
