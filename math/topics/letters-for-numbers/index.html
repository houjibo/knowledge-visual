<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>用字母表示数</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #F44336; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 学一学 - 概念引入 */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px 20px; margin: 16px auto;
      max-width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .learn-emoji { font-size: 64px; margin-bottom: 12px; }
    .learn-title { font-size: 20px; font-weight: 700; color: #1D1D1F; margin-bottom: 8px; }
    .learn-desc { font-size: 15px; color: #6E6E73; line-height: 1.7; text-align: left; }
    .learn-formula {
      display: inline-block; padding: 12px 24px; background: #FFEBEE;
      border-radius: 12px; font-size: 24px; font-weight: 700; color: #F44336;
      margin: 12px 4px; border: 2px solid #EF9A9A;
    }
    .learn-arrow { font-size: 28px; color: #F44336; margin: 12px 0; }
    .learn-nav { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .learn-nav-btn {
      padding: 12px 28px; border: none; border-radius: 16px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .learn-nav-btn.prev { background: #E5E5EA; color: #1D1D1F; }
    .learn-nav-btn.next { background: #F44336; color: white; }
    .learn-nav-btn:active { transform: scale(0.95); }
    .learn-nav-btn:disabled { opacity: 0.4; cursor: default; }
    .learn-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .learn-dot { width: 10px; height: 10px; border-radius: 50%; background: #E5E5EA; transition: all 0.2s; }
    .learn-dot.active { background: #F44336; width: 24px; border-radius: 5px; }

    /* 模式2: 认一认 - 识别含义 */
    .recognize-area { text-align: center; padding: 24px 16px; }
    .rec-question {
      font-size: 20px; font-weight: 600; color: #1D1D1F; margin: 12px 0;
      background: white; display: inline-block; padding: 16px 24px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .rec-expr {
      font-size: 36px; font-weight: 800; color: #F44336; margin: 16px 0;
      background: #FFEBEE; display: inline-block; padding: 12px 28px; border-radius: 16px;
    }
    .rec-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0;
      max-width: 380px; margin-left: auto; margin-right: auto;
    }
    .rec-opt {
      padding: 16px 12px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F; text-align: center;
    }
    .rec-opt:active { transform: scale(0.95); }
    .rec-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .rec-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式3: 算一算 - 代入求值 */
    .calc-area { text-align: center; padding: 24px 16px; }
    .calc-given {
      display: inline-block; padding: 10px 20px; background: #E8F5E9;
      border-radius: 12px; font-size: 18px; font-weight: 600; color: #2E7D32;
      margin: 8px 0;
    }
    .calc-problem {
      font-size: 40px; font-weight: 800; color: #F44336; margin: 16px 0;
      background: white; display: inline-block; padding: 16px 32px; border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .calc-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 24px 0;
    }
    .calc-opt {
      width: 72px; height: 72px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .calc-opt:active { transform: scale(0.9); }
    .calc-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .calc-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式4: 限时挑战 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .timer-bar {
      height: 12px; background: #E5E5EA; border-radius: 6px; margin: 12px 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%; background: linear-gradient(90deg, #34C759, #F44336);
      border-radius: 6px; transition: width 1s linear;
    }
    .timer-fill.warning { background: linear-gradient(90deg, #FF9500, #FF3B30); }
    .timer-text { font-size: 18px; font-weight: 700; color: #F44336; }
    .challenge-problem {
      font-size: 32px; font-weight: 800; color: #F44336; margin: 12px 0;
      background: white; display: inline-block; padding: 14px 28px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .challenge-given {
      display: inline-block; padding: 8px 16px; background: #E8F5E9;
      border-radius: 10px; font-size: 16px; font-weight: 600; color: #2E7D32;
      margin: 8px 0;
    }
    .challenge-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0;
      max-width: 340px; margin-left: auto; margin-right: auto;
    }
    .challenge-opt {
      padding: 14px 10px; border: 3px solid #E0E0E0; background: white;
      border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .challenge-opt:active { transform: scale(0.95); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-start {
      padding: 16px 40px; border: none; background: #F44336; color: white;
      border-radius: 20px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s;
    }
    .challenge-start:active { transform: scale(0.95); }
    .challenge-result {
      font-size: 48px; font-weight: 800; color: #F44336; margin: 20px 0;
    }
    .challenge-score-label { font-size: 18px; color: #6E6E73; font-weight: 600; }

    /* 通用 */
    .feedback { font-size: 20px; font-weight: 700; min-height: 32px; margin: 8px 0; }
    .feedback.correct { color: #34C759; }
    .feedback.wrong { color: #FF3B30; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a>
      <span class="breadcrumb-sep">›</span>
      <a href="../../math/index.html" class="breadcrumb-item">📐 数学</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">用字母表示数</span>
    </nav>

    <div class="section-title">🔤 用字母表示数</div>
    <div class="section-desc">四年级 · 代数思维启蒙</div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 学一学</button>
      <button class="mode-tab" data-mode="recognize">🔍 认一认</button>
      <button class="mode-tab" data-mode="calc">🧮 算一算</button>
      <button class="mode-tab" data-mode="challenge">⚡ 挑战</button>
    </div>

    <!-- 模式1: 学一学 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card" id="learn-card">
          <!-- 动态填充 -->
        </div>
        <div class="learn-nav">
          <button class="learn-nav-btn prev" id="learn-prev" onclick="learnPrev()">← 上一页</button>
          <button class="learn-nav-btn next" id="learn-next" onclick="learnNext()">下一页 →</button>
        </div>
        <div class="learn-dots" id="learn-dots"></div>
      </div>
    </div>

    <!-- 模式2: 认一认 -->
    <div class="mode-content" id="mode-recognize">
      <div class="recognize-area">
        <div class="score-bar">
          <span>✅ <span id="rec-correct">0</span></span>
          <span>❌ <span id="rec-wrong">0</span></span>
        </div>
        <p style="font-size:16px;color:#6E6E73;margin:8px 0;">这个式子表示什么意思？</p>
        <div class="rec-expr" id="rec-expr"></div>
        <div class="rec-options" id="rec-options"></div>
        <div class="feedback" id="rec-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 算一算 -->
    <div class="mode-content" id="mode-calc">
      <div class="calc-area">
        <div class="score-bar">
          <span>✅ <span id="calc-correct">0</span></span>
          <span>❌ <span id="calc-wrong">0</span></span>
        </div>
        <div class="calc-given" id="calc-given"></div>
        <div class="calc-problem" id="calc-problem"></div>
        <div class="calc-options" id="calc-options"></div>
        <div class="feedback" id="calc-feedback"></div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area" id="challenge-area">
        <div id="challenge-start-screen">
          <div style="font-size:64px;margin:20px 0;">⚡</div>
          <p style="font-size:18px;font-weight:600;margin:12px 0;">60秒限时挑战</p>
          <p style="font-size:15px;color:#6E6E73;margin-bottom:20px;">看你能答对多少题！</p>
          <button class="challenge-start" onclick="startChallenge()">开始挑战</button>
        </div>
        <div id="challenge-game" style="display:none;">
          <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
          <div class="timer-text">⏱️ <span id="timer-text">60</span>秒</div>
          <div class="score-bar">
            <span>✅ <span id="ch-correct">0</span></span>
            <span>❌ <span id="ch-wrong">0</span></span>
          </div>
          <div class="challenge-given" id="ch-given"></div>
          <div class="challenge-problem" id="ch-problem"></div>
          <div class="challenge-options" id="ch-options"></div>
          <div class="feedback" id="ch-feedback"></div>
        </div>
        <div id="challenge-end" style="display:none;">
          <div class="challenge-result" id="ch-final-score">0</div>
          <div class="challenge-score-label">题答对了！</div>
          <p style="font-size:18px;color:#6E6E73;margin:16px 0;" id="ch-comment"></p>
          <button class="challenge-start" onclick="startChallenge()">再来一次</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // ========== 模式切换 ==========
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('mode-' + this.dataset.mode).classList.add('active');
      });
    });

    // ========== 模式1: 学一学 ==========
    const learnPages = [
      {
        emoji: '🤔',
        title: '为什么用字母？',
        desc: '小明有 <b>3</b> 颗糖，小红比小明多 <b>2</b> 颗。小红有几颗？<br><br>3 + 2 = 5 颗！<br><br>可是，如果我们<b>不知道</b>小明有几颗糖呢？<br>我们就用一个<b>字母</b>来代替！',
        formula: ''
      },
      {
        emoji: '🔤',
        title: '用 a 表示未知数',
        desc: '小明有 <b>a</b> 颗糖，小红比小明多 <b>2</b> 颗。<br><br>小红有：<b>a + 2</b> 颗<br><br>这里的 <b>a</b> 就是一个字母，它可以代表任何数！<br>如果 a = 3，那 a + 2 = 5<br>如果 a = 10，那 a + 2 = 12',
        formula: 'a + 2'
      },
      {
        emoji: '✏️',
        title: '常见的写法',
        desc: '在数学中，字母和数字相乘时，可以省略乘号：<br><br>• <b>a × 3</b> 写成 <b>3a</b>（数字写在字母前面）<br>• <b>a × b</b> 写成 <b>ab</b><br><br>⚠️ 注意：加法不能省略加号哦！<br>a + 5 还是写 a + 5',
        formula: 'a × 3 = 3a'
      },
      {
        emoji: '📐',
        title: '用字母表示公式',
        desc: '我们以前学过的公式，都可以用字母来表示：<br><br>• 正方形周长 = 边长 × 4 → <b>C = 4a</b><br>• 长方形面积 = 长 × 宽 → <b>S = ab</b><br><br>用字母表示公式，又简洁又好记！',
        formula: 'C = 4a, S = ab'
      },
      {
        emoji: '🎯',
        title: '代入求值',
        desc: '知道了字母表示的式子，我们可以把具体的数<b>代入</b>进去算：<br><br>例：a = 5 时，3a + 2 = ?<br><br>把 5 代入 a：<br>3 × 5 + 2 = 15 + 2 = <b>17</b><br><br>这就是"代入求值"！',
        formula: '3a + 2 = 17'
      }
    ];

    let learnIdx = 0;

    function renderLearn() {
      const page = learnPages[learnIdx];
      const card = document.getElementById('learn-card');
      card.innerHTML = `
        <div class="learn-emoji">${page.emoji}</div>
        <div class="learn-title">${page.title}</div>
        <div class="learn-desc">${page.desc}</div>
        ${page.formula ? `<div class="learn-formula">${page.formula}</div>` : ''}
      `;
      document.getElementById('learn-prev').disabled = learnIdx === 0;
      document.getElementById('learn-next').textContent = learnIdx === learnPages.length - 1 ? '去做题 →' : '下一页 →';
      // dots
      const dots = document.getElementById('learn-dots');
      dots.innerHTML = learnPages.map((_, i) => `<div class="learn-dot ${i === learnIdx ? 'active' : ''}"></div>`).join('');
    }

    function learnNext() {
      if (learnIdx < learnPages.length - 1) {
        learnIdx++;
        renderLearn();
      } else {
        // 切换到认一认模式
        document.querySelectorAll('.mode-tab')[1].click();
      }
    }

    function learnPrev() {
      if (learnIdx > 0) {
        learnIdx--;
        renderLearn();
      }
    }

    renderLearn();

    // ========== 模式2: 认一认 ==========
    let recCorrect = 0, recWrong = 0;

    const recTemplates = [
      () => {
        const a = randInt(1, 20);
        const b = randInt(1, 20);
        return {
          expr: `a + ${b}`,
          context: `a = ${a}`,
          answer: `表示 ${a} 加上 ${b}`,
          options: shuffle([
            `表示 ${a} 加上 ${b}`,
            `表示 ${a} 减去 ${b}`,
            `表示 ${a} 乘以 ${b}`,
            `表示 ${b} 除以 ${a}`
          ])
        };
      },
      () => {
        const n = randInt(2, 9);
        return {
          expr: `${n}a`,
          context: '',
          answer: `表示 ${n} 乘以 a`,
          options: shuffle([
            `表示 ${n} 乘以 a`,
            `表示 ${n} 加上 a`,
            `表示一个两位数 ${n}a`,
            `表示 a 除以 ${n}`
          ])
        };
      },
      () => {
        const a = randInt(2, 15);
        const k = randInt(2, 5);
        return {
          expr: `${k}a + 3`,
          context: `a = ${a}`,
          answer: `先算 ${k}×${a}，再加 3`,
          options: shuffle([
            `先算 ${k}×${a}，再加 3`,
            `先算 ${k}+${a}，再加 3`,
            `先算 ${a}+3，再乘 ${k}`,
            `直接等于 ${k}×${a}×3`
          ])
        };
      },
      () => {
        const side = randInt(2, 10);
        return {
          expr: 'C = 4a',
          context: `正方形边长 a = ${side}`,
          answer: `周长 = 4 × ${side} = ${4*side}`,
          options: shuffle([
            `周长 = 4 × ${side} = ${4*side}`,
            `周长 = ${side} + 4 = ${side+4}`,
            `周长 = ${side} × ${side} = ${side*side}`,
            `周长 = 4 + ${side} × 2 = ${4+side*2}`
          ])
        };
      },
      () => {
        const x = randInt(1, 10);
        return {
          expr: 'a - b',
          context: `a = ${x+randInt(1,10)}, b = ${x}`,
          answer: '表示两个数的差',
          options: shuffle([
            '表示两个数的差',
            '表示两个数合起来',
            '表示 a 是 b 的几倍',
            '表示把 a 平均分成 b 份'
          ])
        };
      }
    ];

    function newRecQuestion() {
      const tpl = recTemplates[randInt(0, recTemplates.length - 1)];
      const q = tpl();
      document.getElementById('rec-expr').textContent = q.expr;
      if (q.context) {
        document.getElementById('rec-expr').textContent = q.expr + '  (' + q.context + ')';
      }
      const container = document.getElementById('rec-options');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'rec-opt';
        btn.textContent = opt;
        btn.addEventListener('click', function() {
          handleRecAnswer(btn, opt === q.answer, q.answer);
        });
        container.appendChild(btn);
      });
      document.getElementById('rec-feedback').textContent = '';
    }

    function handleRecAnswer(btn, isCorrect, correctAnswer) {
      const allBtns = document.querySelectorAll('#rec-options .rec-opt');
      allBtns.forEach(b => {
        b.style.pointerEvents = 'none';
        if (b.textContent === correctAnswer) b.classList.add('correct');
      });
      const fb = document.getElementById('rec-feedback');
      if (isCorrect) {
        recCorrect++;
        document.getElementById('rec-correct').textContent = recCorrect;
        fb.textContent = '✅ 答对了！';
        fb.className = 'feedback correct';
      } else {
        btn.classList.add('wrong');
        recWrong++;
        document.getElementById('rec-wrong').textContent = recWrong;
        fb.textContent = '❌ 正确答案已标出';
        fb.className = 'feedback wrong';
      }
      setTimeout(newRecQuestion, 1500);
    }

    newRecQuestion();

    // ========== 模式3: 算一算 ==========
    let calcCorrect = 0, calcWrong = 0;

    const calcTemplates = [
      () => {
        const a = randInt(1, 15);
        const k = randInt(2, 6);
        const answer = k * a;
        return {
          given: `a = ${a}`,
          problem: `${k}a = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 20)
        };
      },
      () => {
        const a = randInt(1, 12);
        const k = randInt(2, 5);
        const add = randInt(1, 10);
        const answer = k * a + add;
        return {
          given: `a = ${a}`,
          problem: `${k}a + ${add} = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 15)
        };
      },
      () => {
        const a = randInt(2, 10);
        const b = randInt(1, 10);
        const answer = a + b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `a + b = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 10)
        };
      },
      () => {
        const a = randInt(3, 15);
        const b = randInt(1, a - 1);
        const answer = a - b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `a - b = ?`,
          answer: answer,
          options: genOptions(answer, 0, answer + 10)
        };
      },
      () => {
        const a = randInt(2, 8);
        const b = randInt(2, 8);
        const answer = a * b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `ab = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 20)
        };
      },
      () => {
        const a = randInt(2, 10);
        const answer = 4 * a;
        return {
          given: `正方形边长 a = ${a}`,
          problem: `C = 4a = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 15)
        };
      },
      () => {
        const a = randInt(2, 9);
        const b = randInt(2, 9);
        const answer = a * b;
        return {
          given: `长方形长 a = ${a}，宽 b = ${b}`,
          problem: `S = ab = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 20)
        };
      }
    ];

    function genOptions(correct, min, max) {
      const opts = new Set([correct]);
      let attempts = 0;
      while (opts.size < 4 && attempts < 50) {
        let v = correct + randInt(-5, 5);
        if (v < min) v = min + randInt(0, 3);
        if (v !== correct) opts.add(v);
        attempts++;
      }
      while (opts.size < 4) opts.add(correct + opts.size * 2);
      return shuffle([...opts]);
    }

    function newCalcQuestion() {
      const tpl = calcTemplates[randInt(0, calcTemplates.length - 1)];
      const q = tpl();
      document.getElementById('calc-given').textContent = q.given;
      document.getElementById('calc-problem').textContent = q.problem;
      const container = document.getElementById('calc-options');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'calc-opt';
        btn.textContent = opt;
        btn.addEventListener('click', function() {
          handleCalcAnswer(btn, opt === q.answer, q.answer);
        });
        container.appendChild(btn);
      });
      document.getElementById('calc-feedback').textContent = '';
    }

    function handleCalcAnswer(btn, isCorrect, correctAnswer) {
      const allBtns = document.querySelectorAll('#calc-options .calc-opt');
      allBtns.forEach(b => {
        b.style.pointerEvents = 'none';
        if (parseInt(b.textContent) === correctAnswer) b.classList.add('correct');
      });
      const fb = document.getElementById('calc-feedback');
      if (isCorrect) {
        calcCorrect++;
        document.getElementById('calc-correct').textContent = calcCorrect;
        fb.textContent = '✅ 正确！';
        fb.className = 'feedback correct';
      } else {
        btn.classList.add('wrong');
        calcWrong++;
        document.getElementById('calc-wrong').textContent = calcWrong;
        fb.textContent = `❌ 答案是 ${correctAnswer}`;
        fb.className = 'feedback wrong';
      }
      setTimeout(newCalcQuestion, 1500);
    }

    newCalcQuestion();

    // ========== 模式4: 限时挑战 ==========
    let chTimer = null, chTimeLeft = 60, chCorrectCount = 0, chWrongCount = 0;
    let chLocked = false;

    const chTemplates = [
      () => {
        const a = randInt(1, 12);
        const k = randInt(2, 6);
        const answer = k * a;
        return {
          given: `a = ${a}`,
          problem: `${k}a = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 20)
        };
      },
      () => {
        const a = randInt(1, 10);
        const k = randInt(2, 5);
        const add = randInt(1, 8);
        const answer = k * a + add;
        return {
          given: `a = ${a}`,
          problem: `${k}a + ${add} = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 15)
        };
      },
      () => {
        const a = randInt(2, 10);
        const b = randInt(1, 10);
        const answer = a + b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `a + b = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 10)
        };
      },
      () => {
        const a = randInt(2, 9);
        const b = randInt(2, 9);
        const answer = a * b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `ab = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 20)
        };
      },
      () => {
        const a = randInt(2, 10);
        const answer = 4 * a;
        return {
          given: `边长 a = ${a}`,
          problem: `C = 4a = ?`,
          answer: answer,
          options: genOptions(answer, 1, answer + 15)
        };
      },
      () => {
        const a = randInt(5, 15);
        const b = randInt(1, a - 1);
        const answer = a - b;
        return {
          given: `a = ${a}, b = ${b}`,
          problem: `a - b = ?`,
          answer: answer,
          options: genOptions(answer, 0, answer + 10)
        };
      }
    ];

    function startChallenge() {
      document.getElementById('challenge-start-screen').style.display = 'none';
      document.getElementById('challenge-end').style.display = 'none';
      document.getElementById('challenge-game').style.display = 'block';
      chTimeLeft = 60;
      chCorrectCount = 0;
      chWrongCount = 0;
      chLocked = false;
      document.getElementById('ch-correct').textContent = '0';
      document.getElementById('ch-wrong').textContent = '0';
      document.getElementById('timer-text').textContent = '60';
      document.getElementById('timer-fill').style.width = '100%';
      document.getElementById('timer-fill').classList.remove('warning');
      document.getElementById('ch-feedback').textContent = '';
      newChallengeQuestion();
      if (chTimer) clearInterval(chTimer);
      chTimer = setInterval(() => {
        chTimeLeft--;
        document.getElementById('timer-text').textContent = chTimeLeft;
        document.getElementById('timer-fill').style.width = (chTimeLeft / 60 * 100) + '%';
        if (chTimeLeft <= 10) document.getElementById('timer-fill').classList.add('warning');
        if (chTimeLeft <= 0) {
          clearInterval(chTimer);
          chTimer = null;
          endChallenge();
        }
      }, 1000);
    }

    function newChallengeQuestion() {
      chLocked = false;
      const tpl = chTemplates[randInt(0, chTemplates.length - 1)];
      const q = tpl();
      document.getElementById('ch-given').textContent = q.given;
      document.getElementById('ch-problem').textContent = q.problem;
      const container = document.getElementById('ch-options');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'challenge-opt';
        btn.textContent = opt;
        btn.addEventListener('click', function() {
          if (chLocked) return;
          handleChAnswer(btn, opt === q.answer, q.answer);
        });
        container.appendChild(btn);
      });
      document.getElementById('ch-feedback').textContent = '';
    }

    function handleChAnswer(btn, isCorrect, correctAnswer) {
      chLocked = true;
      const allBtns = document.querySelectorAll('#ch-options .challenge-opt');
      allBtns.forEach(b => {
        b.style.pointerEvents = 'none';
        if (parseInt(b.textContent) === correctAnswer) b.classList.add('correct');
      });
      const fb = document.getElementById('ch-feedback');
      if (isCorrect) {
        chCorrectCount++;
        document.getElementById('ch-correct').textContent = chCorrectCount;
        fb.textContent = '✅';
        fb.className = 'feedback correct';
      } else {
        btn.classList.add('wrong');
        chWrongCount++;
        document.getElementById('ch-wrong').textContent = chWrongCount;
        fb.textContent = `❌ ${correctAnswer}`;
        fb.className = 'feedback wrong';
      }
      setTimeout(newChallengeQuestion, 1500);
    }

    function endChallenge() {
      document.getElementById('challenge-game').style.display = 'none';
      document.getElementById('challenge-end').style.display = 'block';
      document.getElementById('ch-final-score').textContent = chCorrectCount;
      let comment = '';
      if (chCorrectCount >= 20) comment = '🏆 太厉害了！代数小天才！';
      else if (chCorrectCount >= 15) comment = '🌟 非常棒！继续加油！';
      else if (chCorrectCount >= 10) comment = '👍 不错哦！再练练更好！';
      else if (chCorrectCount >= 5) comment = '💪 有进步空间，加油！';
      else comment = '📖 回去看看概念再来挑战吧！';
      document.getElementById('ch-comment').textContent = comment;
    }

    // ========== 工具函数 ==========
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  </script>
</body>
