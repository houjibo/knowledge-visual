<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>统计与数据整理</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 分类收集 */
    .collect-area { text-align: center; padding: 16px; }
    .item-pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 16px 0; min-height: 80px; }
    .pool-item {
      font-size: 36px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
      background: #F0F4FF; border-radius: 16px; cursor: pointer; transition: all 0.2s ease;
      border: 3px solid transparent; user-select: none;
    }
    .pool-item:active { transform: scale(0.9); }
    .pool-item.sorted { opacity: 0.3; pointer-events: none; border-color: #34C759; }
    .category-bins { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
    .category-bin {
      width: 90px; min-height: 100px; border: 3px dashed #9CA3AF; border-radius: 16px;
      padding: 8px; cursor: pointer; transition: all 0.2s ease; background: #FAFAFA;
    }
    .category-bin:active { transform: scale(0.95); background: #E8F4FD; border-color: #4A90D9; }
    .category-bin .bin-icon { font-size: 32px; }
    .category-bin .bin-count { font-size: 24px; font-weight: 700; color: #4A90D9; margin-top: 4px; }
    .category-bin .bin-label { font-size: 12px; color: #6E6E73; }
    .collect-instruction { font-size: 20px; font-weight: 600; margin: 12px 0; }
    .collect-progress { font-size: 16px; color: #6E6E73; margin: 8px 0; }

    /* 模式2: 画统计图 */
    .chart-area { padding: 16px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 16px; justify-content: center; height: 220px; margin: 16px 0; padding: 0 8px; }
    .chart-bar-group { display: flex; flex-direction: column; align-items: center; }
    .chart-bar {
      width: 48px; border-radius: 8px 8px 0 0; transition: height 0.5s ease;
      display: flex; align-items: flex-start; justify-content: center;
      font-size: 14px; font-weight: 700; color: white; padding-top: 4px; min-height: 4px;
    }
    .chart-label { font-size: 13px; color: #6E6E73; margin-top: 6px; text-align: center; }
    .chart-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
    .chart-control-btn {
      padding: 10px 16px; border: 2px solid #9CA3AF; background: white; border-radius: 12px;
      font-size: 16px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 4px;
    }
    .chart-control-btn:active { transform: scale(0.95); }
    .chart-question { font-size: 18px; font-weight: 600; text-align: center; margin: 16px 0; }

    /* 模式3: 读统计表 */
    .table-area { padding: 16px; }
    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 16px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .data-table th { background: #4A90D9; color: white; padding: 12px 16px; font-size: 16px; font-weight: 600; }
    .data-table td { background: white; padding: 12px 16px; font-size: 16px; text-align: center; border-bottom: 1px solid #F0F0F0; }
    .data-table tr:last-child td { border-bottom: none; }
    .table-question { font-size: 20px; font-weight: 600; text-align: center; margin: 16px 0; }
    .table-options { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 12px auto; }
    .table-opt {
      padding: 16px; border: 3px solid #9CA3AF; background: white; border-radius: 16px;
      font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-align: center;
    }
    .table-opt:active { transform: scale(0.97); }
    .table-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .table-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .table-feedback { text-align: center; font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 36px; }

    /* 模式4: 挑战 */
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #4A90D9; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .challenge-problem { font-size: 20px; font-weight: 600; text-align: center; margin: 16px 0; line-height: 1.6; }
    .challenge-opts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 360px; margin: 12px auto; }
    .ch-opt {
      padding: 14px 20px; border: 3px solid #9CA3AF; background: white; border-radius: 14px;
      font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; min-width: 80px; text-align: center;
    }
    .ch-opt:active { transform: scale(0.95); }
    .ch-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .ch-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-chart-mini { display: flex; align-items: flex-end; gap: 10px; justify-content: center; height: 120px; margin: 12px 0; }
    .mini-bar { width: 36px; border-radius: 6px 6px 0 0; transition: height 0.4s ease; display: flex; align-items: flex-start; justify-content: center; font-size: 12px; font-weight: 700; color: white; padding-top: 2px; min-height: 4px; }
    .mini-label { font-size: 11px; color: #6E6E73; text-align: center; margin-top: 4px; }
    .mini-bar-group { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">📊 统计与数据整理</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="sort">🗂️ 分类整理</button>
      <button class="mode-tab" data-mode="chart">📊 画统计图</button>
      <button class="mode-tab" data-mode="readtable">📋 读统计表</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 分类收集 -->
    <div class="mode-content active" id="mode-sort">
      <div class="card">
        <p class="page-subtitle">把下面的东西分分类，放到正确的类别里吧！</p>
        <div class="collect-area">
          <div class="collect-instruction" id="sort-instruction"></div>
          <div class="collect-progress" id="sort-progress"></div>
          <div class="item-pool" id="item-pool"></div>
          <div class="category-bins" id="category-bins"></div>
          <div class="action-bar">
            <button class="btn btn-primary" id="btn-new-sort">🔄 换一组</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 画统计图 -->
    <div class="mode-content" id="mode-chart">
      <div class="card">
        <p class="page-subtitle">数一数每种各有多少，画出条形统计图</p>
        <div class="chart-area">
          <div id="chart-items" style="text-align:center;font-size:28px;margin:12px 0;min-height:60px;"></div>
          <div class="chart-controls" id="chart-controls"></div>
          <div class="bar-chart" id="bar-chart"></div>
          <div class="chart-question" id="chart-question"></div>
          <div class="action-bar" style="justify-content:center;">
            <button class="btn btn-warning" id="btn-new-chart">🔄 换一组</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式3: 读统计表 -->
    <div class="mode-content" id="mode-readtable">
      <div class="card">
        <p class="page-subtitle">看看表格，回答下面的问题</p>
        <div class="table-area">
          <div id="table-container"></div>
          <div class="table-question" id="table-question"></div>
          <div class="table-options" id="table-options"></div>
          <div class="table-feedback" id="table-feedback"></div>
          <div class="action-bar" style="justify-content:center;">
            <button class="btn btn-warning" id="btn-new-table">🔄 换一组</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-score">
          <span>答对 <b id="ch-correct" style="color:#34C759">0</b></span>
          <span>答错 <b id="ch-wrong" style="color:#FF3B30">0</b></span>
        </div>
        <button class="challenge-start-btn" id="btn-start-challenge">🏆 开始挑战！</button>
        <div class="challenge-running">
          <div id="challenge-chart"></div>
          <div class="challenge-problem" id="challenge-problem"></div>
          <div class="challenge-opts" id="challenge-opts"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！统计小达人！`);
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // 工具函数
    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // === 模式1: 分类整理 ===
    (() => {
      const themes = [
        { name: '水果', categories: [
          { name: '水果', icon: '🍎', color: '#FF6B6B', items: ['🍎','🍌','🍊','🍇','🍓','🍑','🍉','🍒','🥝','🍋'] },
        ]},
        { name: '动物', categories: [
          { name: '天上飞', icon: '🐦', color: '#4A90D9', items: ['🐦','🦅','🕊️','🦉','🦜'] },
          { name: '水里游', icon: '🐟', color: '#34C759', items: ['🐟','🐠','🦈','🐙','🦑'] },
          { name: '地上跑', icon: '🐕', color: '#FF9500', items: ['🐕','🐈','🐎','🐘','🐇'] },
        ]},
        { name: '形状', categories: [
          { name: '圆形', icon: '⭕', color: '#FF2D55', items: ['⭕','🟡','🔴','🟠'] },
          { name: '方形', icon: '🟦', color: '#4A90D9', items: ['🟦','🟪','⬜','🔲'] },
          { name: '三角形', icon: '🔺', color: '#FF9500', items: ['🔺','🔻','📐'] },
        ]},
      ];

      function startSort() {
        const theme = themes[randInt(0, themes.length - 1)];
        const cats = theme.categories;
        const instruction = document.getElementById('sort-instruction');
        const progress = document.getElementById('sort-progress');
        const pool = document.getElementById('item-pool');
        const bins = document.getElementById('category-bins');

        instruction.textContent = `把下面的${theme.name}分到正确的类别里！`;

        // 随机选取物品（每种3-5个）
        let items = [];
        cats.forEach(cat => {
          const count = randInt(2, 4);
          const shuffled = shuffle(cat.items).slice(0, count);
          shuffled.forEach(item => items.push({ emoji: item, category: cat.name, icon: cat.icon, color: cat.color }));
        });
        items = shuffle(items);

        let sorted = 0;
        pool.innerHTML = '';
        items.forEach((item, idx) => {
          const el = document.createElement('div');
          el.className = 'pool-item';
          el.textContent = item.emoji;
          el.dataset.idx = idx;
          el.addEventListener('click', () => selectItemForSort(idx, item));
          pool.appendChild(el);
        });

        bins.innerHTML = '';
        const binCounts = {};
        cats.forEach(cat => binCounts[cat.name] = 0);

        cats.forEach(cat => {
          const bin = document.createElement('div');
          bin.className = 'category-bin';
          bin.innerHTML = `<div class="bin-icon">${cat.icon}</div><div class="bin-count" data-cat="${cat.name}">0</div><div class="bin-label">${cat.name}</div>`;
          bin.addEventListener('click', () => sortIntoBin(cat, binCounts));
          bins.appendChild(bin);
        });

        progress.textContent = `0 / ${items.length} 已分类`;

        window._sortSelected = null;
        function selectItemForSort(idx, item) {
          if (window._sortSelected !== null) {
            pool.children[window._sortSelected].style.borderColor = 'transparent';
          }
          window._sortSelected = idx;
          pool.children[idx].style.borderColor = item.color;
          window._sortItem = item;
          Sound.play('click');
        }
        window._sortItem = null;
        function sortIntoBin(cat, binCounts) {
          if (window._sortItem === null) { showToast('先点一个物品，再点类别！'); return; }
          const correct = window._sortItem.category === cat.name;
          if (correct) {
            binCounts[cat.name]++;
            bin.querySelector(`[data-cat="${cat.name}"]`).textContent = binCounts[cat.name];
            pool.children[window._sortSelected].classList.add('sorted');
            pool.children[window._sortSelected].style.borderColor = 'transparent';
            sorted++;
            progress.textContent = `${sorted} / ${items.length} 已分类`;
            Sound.play('correct');
            if (sorted === items.length) {
              showToast('🎉 全部归类正确！太棒了！');
              streak++;
              updateStreak();
            }
          } else {
            Sound.play('wrong');
            showToast(`"${window._sortItem.emoji}" 不是${cat.name}哦！再想想`);
            streak = 0;
            updateStreak();
          }
          window._sortSelected = null;
          window._sortItem = null;
        }
      }
      document.getElementById('btn-new-sort').addEventListener('click', startSort);
      startSort();
    })();

    // === 模式2: 画统计图 ===
    (() => {
      const themes = [
        { name: '班级最爱水果', items: ['🍎苹果','🍌香蕉','🍊橘子','🍇葡萄'], colors: ['#FF6B6B','#FFD93D','#FF9500','#AF52DE'] },
        { name: '动物园里的动物', items: ['🐒猴子','🐘大象','🦁狮子','🐧企鹅'], colors: ['#4A90D9','#9CA3AF','#FF9500','#2C2C2E'] },
        { name: '图书角各类书', items: ['📖故事书','📚科普书','🎨美术书','📕漫画书'], colors: ['#34C759','#4A90D9','#FF2D55','#FF9500'] },
        { name: '操场上的运动', items: ['⚽足球','🏀篮球','🏐排球','🏸羽毛球'], colors: ['#34C759','#FF6B6B','#4A90D9','#FF9500'] },
      ];

      function startChart() {
        const theme = themes[randInt(0, themes.length - 1)];
        const container = document.getElementById('chart-items');
        const controls = document.getElementById('chart-controls');
        const chart = document.getElementById('bar-chart');
        const question = document.getElementById('chart-question');

        // 生成随机计数
        const counts = theme.items.map(() => randInt(2, 8));
        const maxCount = Math.max(...counts);
        const maxVal = Math.ceil(maxCount / 2) * 2; // 确保 y 轴最大值 >= 实际最大值

        // 展示原始数据
        container.innerHTML = counts.map((c, i) => `${theme.items[i].charAt(0).repeat(c)}`).join(' ') 
          + '<br><span style="font-size:14px;color:#6E6E73">' + theme.name + '</span>';

        // 计数按钮
        controls.innerHTML = '';
        let userCounts = new Array(counts.length).fill(0);
        theme.items.forEach((item, i) => {
          const btn = document.createElement('button');
          btn.className = 'chart-control-btn';
          btn.innerHTML = `${item} <b id="cc-${i}">0</b>`;
          btn.style.borderLeftColor = theme.colors[i];
          btn.addEventListener('click', () => {
            if (userCounts[i] < 10) {
              userCounts[i]++;
              document.getElementById(`cc-${i}`).textContent = userCounts[i];
              Sound.play('click');
              updateChart();
            }
          });
          btn.addEventListener('contextmenu', (e) => { e.preventDefault(); });
          // 长按减少
          let timer;
          btn.addEventListener('touchstart', (e) => {
            // double-tap to decrease
          });
          controls.appendChild(btn);
        });

        function updateChart() {
          chart.innerHTML = '';
          theme.items.forEach((item, i) => {
            const group = document.createElement('div');
            group.className = 'chart-bar-group';
            const bar = document.createElement('div');
            bar.className = 'chart-bar';
            const h = Math.max(4, (userCounts[i] / maxVal) * 180);
            bar.style.height = h + 'px';
            bar.style.background = theme.colors[i];
            if (userCounts[i] > 0) bar.textContent = userCounts[i];
            const label = document.createElement('div');
            label.className = 'chart-label';
            label.textContent = item.replace(/[🍎🍌🍊🍇🐒🐘🦁🐧📖📚🎨📕⚽🏀🏐🏸]/g, '').slice(0, 2);
            group.appendChild(bar);
            group.appendChild(label);
            chart.appendChild(group);
          });
        }
        updateChart();

        // 随机问题
        const questions = [
          { text: `哪种最多？`, answer: theme.items[counts.indexOf(Math.max(...counts))].slice(1) },
          { text: `哪种最少？`, answer: theme.items[counts.indexOf(Math.min(...counts))].slice(1) },
          { text: `一共多少个？`, answer: String(counts.reduce((a, b) => a + b, 0)) },
        ];
        const q = questions[randInt(0, questions.length - 1)];
        question.textContent = `❓ ${q.text}`;
      }
      document.getElementById('btn-new-chart').addEventListener('click', startChart);
      startChart();
    })();

    // === 模式3: 读统计表 ===
    (() => {
      const themes = [
        { title: '二（1）班同学最爱水果', headers: ['水果', '人数'], rows: [['🍎苹果','12'],['🍌香蕉','8'],['🍊橘子','15'],['🍇葡萄','6']] },
        { title: '本周天气情况', headers: ['天气', '天数'], rows: [['☀️晴天','3'],['🌧️雨天','2'],['⛅多云','2']] },
        { title: '图书角借阅统计', headers: ['类别', '本数'], rows: [['📖故事书','24'],['🔬科普书','18'],['🎨美术书','10'],['📕漫画书','15']] },
        { title: '一年级各班人数', headers: ['班级', '人数'], rows: [['一（1）班','36'],['一（2）班','34'],['一（3）班','38'],['一（4）班','35']] },
      ];

      let tableIdx = 0;
      function startTable() {
        const theme = themes[tableIdx % themes.length];
        tableIdx++;
        const container = document.getElementById('table-container');
        const questionEl = document.getElementById('table-question');
        const optionsEl = document.getElementById('table-options');
        const feedback = document.getElementById('table-feedback');
        feedback.textContent = '';

        // 建表
        let html = `<div style="text-align:center;font-size:16px;font-weight:600;color:#4A90D9;margin-bottom:8px">${theme.title}</div>`;
        html += '<table class="data-table"><tr>';
        theme.headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr>';
        theme.rows.forEach(row => {
          html += '<tr>';
          row.forEach(cell => html += `<td>${cell}</td>`);
          html += '</tr>';
        });
        // 合计行
        const total = theme.rows.reduce((s, r) => s + parseInt(r[1]), 0);
        html += `<tr style="font-weight:700"><td>合计</td><td>${total}</td></tr>`;
        html += '</table>';
        container.innerHTML = html;

        // 生成问题
        const numData = theme.rows.map(r => parseInt(r[1]));
        const maxIdx = numData.indexOf(Math.max(...numData));
        const minIdx = numData.indexOf(Math.min(...numData));

        const qTypes = [
          { text: `哪项最多？`, correct: theme.rows[maxIdx][0] },
          { text: `哪项最少？`, correct: theme.rows[minIdx][0] },
          { text: `合计是多少？`, correct: String(total) },
          { text: `${theme.rows[maxIdx][0]}比${theme.rows[minIdx][0]}多多少？`, correct: String(numData[maxIdx] - numData[minIdx]) },
        ];
        const q = qTypes[randInt(0, qTypes.length - 1)];
        questionEl.textContent = `❓ ${q.text}`;

        // 生成选项（1正确+3干扰）
        let opts = [q.correct];
        const allValues = [...numData.map(String), String(total), String(numData[maxIdx] - numData[minIdx])];
        const uniqueValues = [...new Set(allValues)].filter(v => v !== q.correct);
        const shuffled = shuffle(uniqueValues).slice(0, 3);
        opts = shuffle([...opts, ...shuffled]);

        optionsEl.innerHTML = '';
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'table-opt';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.table-opt').forEach(b => {
              b.style.pointerEvents = 'none';
              if (b.textContent === q.correct) b.classList.add('correct');
            });
            if (opt === q.correct) {
              Sound.play('correct');
              feedback.innerHTML = `<span style="color:#34C759">✅ 答对了！</span>`;
              streak++;
            } else {
              btn.classList.add('wrong');
              Sound.play('wrong');
              feedback.innerHTML = `<span style="color:#FF3B30">❌ 正确答案是 ${q.correct}</span>`;
              streak = 0;
            }
            updateStreak();
          });
          optionsEl.appendChild(btn);
        });
      }
      document.getElementById('btn-new-table').addEventListener('click', startTable);
      startTable();
    })();

    // === 模式4: 挑战 ===
    (() => {
      let correct = 0, wrong = 0;
      const barColors = ['#4A90D9','#34C759','#FF9500','#AF52DE','#FF2D55','#FFD93D'];

      function startChallenge() {
        document.body.classList.add('challenge-active');
        nextChallengeQuestion();
      }

      function nextChallengeQuestion() {
        // 随机生成一个条形图
        const labels = ['苹果','香蕉','橘子','葡萄','西瓜','草莓'];
        const count = randInt(3, 5);
        const chosen = shuffle(labels).slice(0, count);
        const values = chosen.map(() => randInt(2, 9));
        const maxVal = Math.max(...values);

        const chart = document.getElementById('challenge-chart');
        chart.innerHTML = '';
        const barWrap = document.createElement('div');
        barWrap.className = 'challenge-chart-mini';
        chosen.forEach((label, i) => {
          const group = document.createElement('div');
          group.className = 'mini-bar-group';
          const bar = document.createElement('div');
          bar.className = 'mini-bar';
          bar.style.height = Math.max(8, (values[i] / maxVal) * 90) + 'px';
          bar.style.background = barColors[i];
          bar.textContent = values[i];
          const lbl = document.createElement('div');
          lbl.className = 'mini-label';
          lbl.textContent = label;
          group.appendChild(bar);
          group.appendChild(lbl);
          barWrap.appendChild(group);
        });
        chart.appendChild(barWrap);

        const problemEl = document.getElementById('challenge-problem');
        const optsEl = document.getElementById('challenge-opts');

        // 问题类型
        const qType = randInt(0, 4);
        let question, correctAnswer, options;

        if (qType === 0) {
          // 哪个最多
          const maxI = values.indexOf(maxVal);
          question = `哪个最多？`;
          correctAnswer = chosen[maxI];
          options = shuffle([...new Set(chosen)]).slice(0, Math.min(4, chosen.length));
          if (!options.includes(correctAnswer)) options[0] = correctAnswer;
        } else if (qType === 1) {
          // 哪个最少
          const minI = values.indexOf(Math.min(...values));
          question = `哪个最少？`;
          correctAnswer = chosen[minI];
          options = shuffle([...new Set(chosen)]).slice(0, Math.min(4, chosen.length));
          if (!options.includes(correctAnswer)) options[0] = correctAnswer;
        } else if (qType === 2) {
          // 总共多少
          question = `一共多少个？`;
          correctAnswer = String(values.reduce((a, b) => a + b, 0));
          const total = values.reduce((a, b) => a + b, 0);
          options = shuffle([...new Set([String(total), String(total + 1), String(total - 1), String(total + randInt(2, 5)), String(total - randInt(2, 5))])]).slice(0, 4);
          if (!options.includes(correctAnswer)) options[0] = correctAnswer;
        } else if (qType === 3) {
          // A比B多几个
          const aI = randInt(0, count - 1);
          let bI = randInt(0, count - 2);
          if (bI >= aI) bI++;
          const diff = Math.abs(values[aI] - values[bI]);
          question = `${chosen[aI]}比${chosen[bI]}多几个？`;
          correctAnswer = String(diff);
          options = shuffle([...new Set([String(diff), String(diff + 1), String(Math.max(0, diff - 1)), String(diff + randInt(2, 4))])]).slice(0, 4);
          if (!options.includes(correctAnswer)) options[0] = correctAnswer;
        } else {
          // 读某个值
          const idx = randInt(0, count - 1);
          question = `${chosen[idx]}有几个？`;
          correctAnswer = String(values[idx]);
          const v = values[idx];
          options = shuffle([...new Set([String(v), String(v + 1), String(Math.max(0, v - 1)), String(v + randInt(2, 3))])]).slice(0, 4);
          if (!options.includes(correctAnswer)) options[0] = correctAnswer;
        }

        problemEl.textContent = `❓ ${question}`;
        options = shuffle(options);

        optsEl.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'ch-opt';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.ch-opt').forEach(b => b.style.pointerEvents = 'none');
            if (opt === correctAnswer) {
              btn.classList.add('correct');
              Sound.play('correct');
              correct++;
              streak++;
            } else {
              btn.classList.add('wrong');
              document.querySelectorAll('.ch-opt').forEach(b => { if (b.textContent === correctAnswer) b.classList.add('correct'); });
              Sound.play('wrong');
              wrong++;
              streak = 0;
            }
            document.getElementById('ch-correct').textContent = correct;
            document.getElementById('ch-wrong').textContent = wrong;
            updateStreak();
            setTimeout(nextChallengeQuestion, 1000);
          });
          optsEl.appendChild(btn);
        });
      }

      document.getElementById('btn-start-challenge').addEventListener('click', startChallenge);
    })();
  </script>
</body>
</html>
