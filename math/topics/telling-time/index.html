<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识钟表</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E65100; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 时钟 SVG */
    .clock-svg { display: block; margin: 0 auto; }
    .clock-face { fill: #FFFDE7; stroke: #E65100; stroke-width: 3; }
    .clock-center { fill: #E65100; }
    .clock-number { font-size: 18px; font-weight: 700; fill: #1D1D1F; text-anchor: middle; dominant-baseline: central; }
    .clock-tick { stroke: #BDBDBD; stroke-width: 1.5; }
    .clock-tick-major { stroke: #E65100; stroke-width: 2.5; }
    .hand-hour { stroke: #1D1D1F; stroke-width: 5; stroke-linecap: round; }
    .hand-minute { stroke: #E65100; stroke-width: 3; stroke-linecap: round; }
    .hand-label { font-size: 11px; fill: #6E6E73; text-anchor: middle; }

    /* 模式1: 认识时钟 */
    .learn-area { text-align: center; padding: 16px; }
    .learn-info {
      background: white; border-radius: 16px; padding: 16px; margin: 16px auto;
      max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .learn-info h3 { font-size: 20px; color: #E65100; margin-bottom: 8px; }
    .learn-info p { font-size: 15px; color: #6E6E73; line-height: 1.6; }
    .learn-time-display {
      font-size: 48px; font-weight: 800; color: #E65100; margin: 12px 0;
    }
    .learn-nav { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
    .learn-nav button {
      padding: 12px 24px; border: none; background: #E65100; color: white;
      border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .learn-nav button:active { transform: scale(0.92); }
    .learn-nav button:disabled { background: #BDBDBD; }

    /* 互动滑块 */
    .slider-area { margin: 16px auto; max-width: 320px; }
    .slider-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
    .slider-row label { font-size: 16px; font-weight: 600; color: #1D1D1F; min-width: 60px; }
    .slider-row input[type=range] { flex: 1; accent-color: #E65100; height: 32px; }
    .slider-row .slider-val { font-size: 20px; font-weight: 700; color: #E65100; min-width: 36px; text-align: center; }

    /* 模式2: 看钟写时间 */
    .quiz-area { text-align: center; padding: 16px; }
    .quiz-input-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; }
    .quiz-input {
      width: 64px; height: 64px; border: 3px solid #E0E0E0; border-radius: 16px;
      font-size: 32px; font-weight: 700; text-align: center; color: #E65100;
      outline: none; transition: border-color 0.2s; background: white;
    }
    .quiz-input:focus { border-color: #E65100; }
    .quiz-colon { font-size: 36px; font-weight: 800; color: #E65100; }
    .quiz-submit {
      display: block; margin: 16px auto; padding: 14px 40px; border: none;
      background: #E65100; color: white; border-radius: 14px; font-size: 18px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .quiz-submit:active { transform: scale(0.92); }

    /* 模式3: 看时间拨钟 */
    .dial-area { text-align: center; padding: 16px; }
    .dial-target {
      font-size: 40px; font-weight: 800; color: #E65100; margin: 12px 0;
      background: white; display: inline-block; padding: 8px 24px; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .dial-check {
      display: block; margin: 16px auto; padding: 14px 40px; border: none;
      background: #E65100; color: white; border-radius: 14px; font-size: 18px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .dial-check:active { transform: scale(0.92); }

    /* 模式4: 选择题 */
    .choice-area { text-align: center; padding: 16px; }
    .choice-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0;
    }
    .choice-opt {
      width: 140px; padding: 12px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .choice-opt:active { transform: scale(0.92); }
    .choice-opt .choice-time { font-size: 24px; font-weight: 700; color: #1D1D1F; }
    .choice-opt .choice-label { font-size: 13px; color: #6E6E73; }
    .choice-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.12); }
    .choice-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.08); }

    .next-btn {
      display: block; margin: 12px auto; padding: 12px 32px; border: none;
      background: #E65100; color: white; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }

    .score-display { text-align: center; margin: 8px 0; }
    .score-display span { margin: 0 12px; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回" onclick="location.href='../../index.html'">←</button>
      <span class="nav-title">🕐 认识钟表</span>
      <div style="width:56px"></div>
    </nav>

    <div class="score-display">
      <span>⭐ 连续答对: <strong id="streak">0</strong></span>
      <span>🏆 最高: <strong id="best">0</strong></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 认识时钟</button>
      <button class="mode-tab" data-mode="read">✏️ 看钟写时间</button>
      <button class="mode-tab" data-mode="dial">🔧 看时间拨钟</button>
      <button class="mode-tab" data-mode="choice">🎯 选一选</button>
    </div>

    <!-- 模式1: 认识时钟 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="section-title">📖 认识时钟</div>
        <div class="section-desc">拖动滑块，观察时针和分针的变化</div>
        <svg class="clock-svg" viewBox="0 0 300 300" width="260" height="260" id="learn-clock">
          <circle cx="150" cy="150" r="140" class="clock-face"/>
          <g id="learn-ticks"></g>
          <g id="learn-numbers"></g>
          <line id="learn-hour-hand" class="hand-hour" x1="150" y1="150" x2="150" y2="70"/>
          <line id="learn-minute-hand" class="hand-minute" x1="150" y1="150" x2="150" y2="40"/>
          <circle cx="150" cy="150" r="6" class="clock-center"/>
          <text x="150" y="120" class="hand-label">短粗=时针</text>
          <text x="150" y="185" class="hand-label">长细=分针</text>
        </svg>
        <div class="learn-time-display" id="learn-time-display">12:00</div>
        <div class="slider-area">
          <div class="slider-row">
            <label>⏰ 时</label>
            <input type="range" id="learn-hour-slider" min="1" max="12" value="12" step="1">
            <span class="slider-val" id="learn-hour-val">12</span>
          </div>
          <div class="slider-row">
            <label>⏰ 分</label>
            <input type="range" id="learn-minute-slider" min="0" max="55" value="0" step="5">
            <span class="slider-val" id="learn-minute-val">0</span>
          </div>
        </div>
        <div class="learn-info">
          <h3>💡 小知识</h3>
          <p id="learn-tip">钟面上有12个数字，代表12个小时。短粗的针叫<strong>时针</strong>，走得慢；长细的针叫<strong>分针</strong>，走得快。分针指12，时针指几就是几点整！</p>
        </div>
        <div class="learn-nav">
          <button id="btn-prev-example">⬅ 上一个</button>
          <button id="btn-next-example">下一个 ➡</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 看钟写时间 -->
    <div class="mode-content" id="mode-read">
      <div class="quiz-area">
        <div class="section-title">✏️ 看钟写时间</div>
        <div class="section-desc">观察时钟，写出正确的时间</div>
        <svg class="clock-svg" viewBox="0 0 300 300" width="240" height="240" id="read-clock">
          <circle cx="150" cy="150" r="140" class="clock-face"/>
          <g id="read-ticks"></g>
          <g id="read-numbers"></g>
          <line id="read-hour-hand" class="hand-hour" x1="150" y1="150" x2="150" y2="70"/>
          <line id="read-minute-hand" class="hand-minute" x1="150" y1="150" x2="150" y2="40"/>
          <circle cx="150" cy="150" r="6" class="clock-center"/>
        </svg>
        <div class="quiz-input-row">
          <input type="number" class="quiz-input" id="read-hour-input" min="1" max="12" placeholder="时" inputmode="numeric">
          <span class="quiz-colon">:</span>
          <input type="number" class="quiz-input" id="read-minute-input" min="0" max="59" placeholder="分" inputmode="numeric">
        </div>
        <button class="quiz-submit" id="btn-read-submit">✅ 确认</button>
        <div class="result-text" id="read-result"></div>
      </div>
    </div>

    <!-- 模式3: 看时间拨钟 -->
    <div class="mode-content" id="mode-dial">
      <div class="dial-area">
        <div class="section-title">🔧 看时间拨钟</div>
        <div class="section-desc">拖动滑块，把时钟拨到指定时间</div>
        <div class="dial-target" id="dial-target">3:00</div>
        <svg class="clock-svg" viewBox="0 0 300 300" width="240" height="240" id="dial-clock">
          <circle cx="150" cy="150" r="140" class="clock-face"/>
          <g id="dial-ticks"></g>
          <g id="dial-numbers"></g>
          <line id="dial-hour-hand" class="hand-hour" x1="150" y1="150" x2="150" y2="70"/>
          <line id="dial-minute-hand" class="hand-minute" x1="150" y1="150" x2="150" y2="40"/>
          <circle cx="150" cy="150" r="6" class="clock-center"/>
        </svg>
        <div class="slider-area">
          <div class="slider-row">
            <label>⏰ 时</label>
            <input type="range" id="dial-hour-slider" min="1" max="12" value="12" step="1">
            <span class="slider-val" id="dial-hour-val">12</span>
          </div>
          <div class="slider-row">
            <label>⏰ 分</label>
            <input type="range" id="dial-minute-slider" min="0" max="55" value="0" step="5">
            <span class="slider-val" id="dial-minute-val">0</span>
          </div>
        </div>
        <button class="dial-check" id="btn-dial-check">✅ 确认</button>
        <div class="result-text" id="dial-result"></div>
      </div>
    </div>

    <!-- 模式4: 选一选 -->
    <div class="mode-content" id="mode-choice">
      <div class="choice-area">
        <div class="section-title">🎯 选一选</div>
        <div class="section-desc" id="choice-question">这个时钟显示的是几点？</div>
        <svg class="clock-svg" viewBox="0 0 300 300" width="220" height="220" id="choice-clock">
          <circle cx="150" cy="150" r="140" class="clock-face"/>
          <g id="choice-ticks"></g>
          <g id="choice-numbers"></g>
          <line id="choice-hour-hand" class="hand-hour" x1="150" y1="150" x2="150" y2="70"/>
          <line id="choice-minute-hand" class="hand-minute" x1="150" y1="150" x2="150" y2="40"/>
          <circle cx="150" cy="150" r="6" class="clock-center"/>
        </svg>
        <div class="choice-options" id="choice-options"></div>
        <div class="result-text" id="choice-result"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script>
    // === 工具函数 ===
    const CX = 150, CY = 150, R = 140;

    function drawClockFace(ticksId, numbersId) {
      const ticksG = document.getElementById(ticksId);
      const numsG = document.getElementById(numbersId);
      // 60个小刻度
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6 - 90) * Math.PI / 180;
        const isMajor = i % 5 === 0;
        const r1 = R - (isMajor ? 16 : 10);
        const r2 = R - 4;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', CX + r1 * Math.cos(angle));
        line.setAttribute('y1', CY + r1 * Math.sin(angle));
        line.setAttribute('x2', CX + r2 * Math.cos(angle));
        line.setAttribute('y2', CY + r2 * Math.sin(angle));
        line.setAttribute('class', isMajor ? 'clock-tick-major' : 'clock-tick');
        ticksG.appendChild(line);
      }
      // 12个数字
      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const nr = R - 30;
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', CX + nr * Math.cos(angle));
        text.setAttribute('y', CY + nr * Math.sin(angle));
        text.setAttribute('class', 'clock-number');
        text.textContent = i;
        numsG.appendChild(text);
      }
    }

    function setHands(prefix, hour, minute) {
      // 时针角度：每小时30度 + 每分钟0.5度
      const hourAngle = ((hour % 12) * 30 + minute * 0.5 - 90) * Math.PI / 180;
      // 分针角度：每分钟6度
      const minAngle = (minute * 6 - 90) * Math.PI / 180;
      // 时针长度约60%半径，分针约80%
      const hLen = 70, mLen = 100;
      const hHand = document.getElementById(prefix + '-hour-hand');
      const mHand = document.getElementById(prefix + '-minute-hand');
      hHand.setAttribute('x2', CX + hLen * Math.cos(hourAngle));
      hHand.setAttribute('y2', CY + hLen * Math.sin(hourAngle));
      mHand.setAttribute('x2', CX + mLen * Math.cos(minAngle));
      mHand.setAttribute('y2', CY + mLen * Math.sin(minAngle));
    }

    function formatTime(h, m) {
      return h + ':' + String(m).padStart(2, '0');
    }

    function randHour() { return Random.int(1, 12); }
    function randMinute() { return Random.int(0, 11) * 5; } // 0,5,10,...,55

    // === 初始化所有钟面 ===
    ['learn', 'read', 'dial', 'choice'].forEach(p => {
      drawClockFace(p + '-ticks', p + '-numbers');
    });

    // === 分数与连击 ===
    let streak = 0, best = parseInt(localStorage.getItem('tt-best') || '0');
    document.getElementById('best').textContent = best;

    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      if (streak > best) {
        best = streak;
        localStorage.setItem('tt-best', best);
        document.getElementById('best').textContent = best;
      }
    }

    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 认识时钟 ===
    (() => {
      const hSlider = document.getElementById('learn-hour-slider');
      const mSlider = document.getElementById('learn-minute-slider');
      const hVal = document.getElementById('learn-hour-val');
      const mVal = document.getElementById('learn-minute-val');
      const display = document.getElementById('learn-time-display');
      const tip = document.getElementById('learn-tip');

      const tips = [
        '钟面上有<strong>12个数字</strong>，代表12个小时。短粗的针叫<strong>时针</strong>，走得慢；长细的针叫<strong>分针</strong>，走得快。',
        '当分针指向<strong>12</strong>，时针指向几就是<strong>几点整</strong>。比如时针指3，就是3:00。',
        '当分针指向<strong>6</strong>，就是<strong>几点半</strong>。时针在两个数中间，刚过的那个数就是小时。',
        '分针每走一小格是<strong>1分钟</strong>，走一大格（两个数字之间）是<strong>5分钟</strong>。',
        '时针走一大格是<strong>1小时</strong>，1小时 = <strong>60分钟</strong>。',
        '一天有<strong>24小时</strong>，时针要走<strong>两圈</strong>。上午一圈，下午一圈。'
      ];
      let tipIdx = 0;

      function updateLearnClock() {
        const h = parseInt(hSlider.value);
        const m = parseInt(mSlider.value);
        hVal.textContent = h;
        mVal.textContent = String(m).padStart(2, '0');
        display.textContent = formatTime(h, m);
        setHands('learn', h, m);
      }

      hSlider.addEventListener('input', updateLearnClock);
      mSlider.addEventListener('input', updateLearnClock);

      // 示例导航
      const examples = [
        { h: 3, m: 0, tip: 0 }, { h: 7, m: 0, tip: 1 },
        { h: 9, m: 30, tip: 2 }, { h: 2, m: 15, tip: 3 },
        { h: 12, m: 0, tip: 4 }, { h: 6, m: 30, tip: 5 }
      ];
      let exIdx = 0;

      function showExample(idx) {
        const ex = examples[idx];
        hSlider.value = ex.h;
        mSlider.value = ex.m;
        updateLearnClock();
        tip.innerHTML = '💡 ' + tips[ex.tip];
      }

      document.getElementById('btn-prev-example').addEventListener('click', () => {
        exIdx = (exIdx - 1 + examples.length) % examples.length;
        showExample(exIdx);
        Sound.play('click');
      });
      document.getElementById('btn-next-example').addEventListener('click', () => {
        exIdx = (exIdx + 1) % examples.length;
        showExample(exIdx);
        Sound.play('click');
      });

      updateLearnClock();
    })();

    // === 模式2: 看钟写时间 ===
    (() => {
      let ansH, ansM;

      function newReadQuiz() {
        ansH = randHour();
        ansM = randMinute();
        setHands('read', ansH, ansM);
        document.getElementById('read-hour-input').value = '';
        document.getElementById('read-minute-input').value = '';
        document.getElementById('read-result').textContent = '';
        document.getElementById('read-hour-input').focus();
      }

      document.getElementById('btn-read-submit').addEventListener('click', () => {
        const h = parseInt(document.getElementById('read-hour-input').value);
        const m = parseInt(document.getElementById('read-minute-input').value);
        if (isNaN(h) || isNaN(m)) {
          document.getElementById('read-result').textContent = '⚠️ 请填写完整时间';
          document.getElementById('read-result').style.color = '#FF9500';
          return;
        }
        if (h === ansH && m === ansM) {
          streak++; Sound.play('correct'); celebrate(); updateStreak();
          document.getElementById('read-result').textContent = '🎉 答对了！';
          document.getElementById('read-result').style.color = '#34C759';
          setTimeout(newReadQuiz, 1500);
        } else {
          Sound.play('wrong'); streak = 0; updateStreak();
          document.getElementById('read-result').textContent = '❌ 正确答案是 ' + formatTime(ansH, ansM);
          document.getElementById('read-result').style.color = '#FF3B30';
          setTimeout(newReadQuiz, 2500);
        }
      });

      // 回车提交
      document.getElementById('read-minute-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-read-submit').click();
      });

      newReadQuiz();
    })();

    // === 模式3: 看时间拨钟 ===
    (() => {
      let targetH, targetM;
      const hSlider = document.getElementById('dial-hour-slider');
      const mSlider = document.getElementById('dial-minute-slider');
      const hVal = document.getElementById('dial-hour-val');
      const mVal = document.getElementById('dial-minute-val');

      function updateDialClock() {
        const h = parseInt(hSlider.value);
        const m = parseInt(mSlider.value);
        hVal.textContent = h;
        mVal.textContent = String(m).padStart(2, '0');
        setHands('dial', h, m);
      }

      hSlider.addEventListener('input', updateDialClock);
      mSlider.addEventListener('input', updateDialClock);

      function newDialQuiz() {
        targetH = randHour();
        targetM = randMinute();
        document.getElementById('dial-target').textContent = formatTime(targetH, targetM);
        document.getElementById('dial-result').textContent = '';
        hSlider.value = 12; mSlider.value = 0;
        updateDialClock();
      }

      document.getElementById('btn-dial-check').addEventListener('click', () => {
        const h = parseInt(hSlider.value);
        const m = parseInt(mSlider.value);
        if (h === targetH && m === targetM) {
          streak++; Sound.play('correct'); celebrate(); updateStreak();
          document.getElementById('dial-result').textContent = '🎉 拨对了！';
          document.getElementById('dial-result').style.color = '#34C759';
          setTimeout(newDialQuiz, 1500);
        } else {
          Sound.play('wrong'); streak = 0; updateStreak();
          document.getElementById('dial-result').textContent = '❌ 不对哦，再试试！';
          document.getElementById('dial-result').style.color = '#FF3B30';
        }
      });

      updateDialClock();
      newDialQuiz();
    })();

    // === 模式4: 选一选 ===
    (() => {
      let correctTime;

      function newChoiceQuiz() {
        const h = randHour();
        const m = randMinute();
        correctTime = formatTime(h, m);
        setHands('choice', h, m);
        document.getElementById('choice-result').textContent = '';

        // 生成4个选项
        let opts = new Set([correctTime]);
        while (opts.size < 4) {
          const fh = randHour();
          const fm = randMinute();
          const ft = formatTime(fh, fm);
          if (ft !== correctTime) opts.add(ft);
        }
        let optArr = Random.shuffle([...opts]);

        const optsEl = document.getElementById('choice-options');
        optsEl.innerHTML = '';
        optArr.forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'choice-opt';
          btn.innerHTML = '<span class="choice-time">' + t + '</span>';
          btn.addEventListener('click', () => {
            if (t === correctTime) {
              btn.classList.add('correct');
              document.querySelectorAll('.choice-opt').forEach(b => b.style.pointerEvents = 'none');
              streak++; Sound.play('correct'); celebrate(); updateStreak();
              document.getElementById('choice-result').textContent = '🎉 答对了！';
              document.getElementById('choice-result').style.color = '#34C759';
              setTimeout(newChoiceQuiz, 1500);
            } else {
              btn.classList.add('wrong');
              Animator.shake(btn);
              Sound.play('wrong'); streak = 0; updateStreak();
              document.getElementById('choice-result').textContent = '❌ 不对哦！';
              document.getElementById('choice-result').style.color = '#FF3B30';
              btn.style.pointerEvents = 'none';
            }
          });
          optsEl.appendChild(btn);
        });
      }

      newChoiceQuiz();
    })();
  </script>
</body>
</html>
