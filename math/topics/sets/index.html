<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>集合与韦恩图</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E65100; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 概念 */
    .concept-area { text-align: center; padding: 24px 16px; }
    .concept-explain { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0; line-height: 1.8; }
    .venn-intro { display: flex; justify-content: center; margin: 20px 0; }
    .venn-intro svg { max-width: 320px; width: 100%; }
    .concept-example { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
    .example-card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-width: 120px; text-align: center; }
    .example-card .icon { font-size: 36px; margin-bottom: 6px; }
    .example-card .label { font-size: 14px; color: #6E6E73; }
    .example-card .items { font-size: 16px; font-weight: 600; color: #1D1D1F; margin-top: 6px; }

    /* 模式2: 拖拽分类 */
    .drag-area { text-align: center; padding: 16px; }
    .drag-instruction { font-size: 16px; color: #6E6E73; margin-bottom: 12px; }
    .venn-container { position: relative; width: 320px; height: 220px; margin: 0 auto 16px; }
    .venn-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .drag-item {
      position: absolute; padding: 8px 14px; background: white; border-radius: 12px;
      font-size: 15px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: grab; user-select: none; touch-action: none; z-index: 10;
      transition: box-shadow 0.2s ease;
    }
    .drag-item:active { cursor: grabbing; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .drag-item.placed { opacity: 0.85; }
    .drag-item.correct-place { background: #E8F5E9; border: 2px solid #43A047; }
    .drag-item.wrong-place { background: #FFEBEE; border: 2px solid #E53935; animation: shake 0.4s ease; }
    .drag-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; min-height: 48px; }
    .drag-feedback { font-size: 18px; font-weight: 700; margin: 12px 0; min-height: 28px; }
    .drag-btn {
      padding: 12px 24px; border: none; background: #E65100; color: white;
      border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 10px rgba(230,81,0,0.3); margin: 6px;
    }
    .drag-btn:active { transform: scale(0.95); }

    /* 模式3: 交集探索 */
    .intersect-area { text-align: center; padding: 16px; }
    .intersect-svg { max-width: 360px; width: 100%; margin: 12px auto; display: block; }
    .intersect-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .intersect-btn {
      padding: 10px 18px; border: 2px solid #E65100; background: white;
      border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .intersect-btn.active { background: #E65100; color: white; }
    .intersect-btn:active { transform: scale(0.95); }
    .intersect-result {
      background: white; border-radius: 16px; padding: 16px; margin: 12px auto;
      max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .intersect-result .r-title { font-size: 16px; font-weight: 700; color: #E65100; margin-bottom: 8px; }
    .intersect-result .r-items { font-size: 18px; font-weight: 600; color: #1D1D1F; }
    .intersect-result .r-count { font-size: 14px; color: #6E6E73; margin-top: 6px; }

    /* 模式4: 挑战 */
    .challenge-area { text-align: center; padding: 16px; }
    .challenge-score { display: flex; justify-content: center; gap: 20px; margin: 8px 0; font-size: 16px; }
    .challenge-q { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0; line-height: 1.6; padding: 0 8px; }
    .challenge-venn { max-width: 300px; width: 100%; margin: 8px auto; display: block; }
    .challenge-options { display: flex; flex-direction: column; gap: 10px; margin: 16px auto; max-width: 340px; }
    .challenge-opt {
      padding: 14px 20px; border: 3px solid #E5E5EA; background: #F8F8FA;
      border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; text-align: left;
    }
    .challenge-opt:active { transform: scale(0.98); }
    .challenge-opt.correct { border-color: #43A047; background: rgba(67,160,71,0.15); color: #2E7D32; }
    .challenge-opt.wrong { border-color: #E53935; background: rgba(229,57,53,0.1); color: #C62828; }
    .challenge-explain { font-size: 15px; color: #6E6E73; margin: 12px 0; line-height: 1.6; min-height: 40px; padding: 0 8px; }
    .challenge-next {
      padding: 12px 24px; border: none; background: #E65100; color: white;
      border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      display: none; margin: 8px auto;
      box-shadow: 0 3px 10px rgba(230,81,0,0.3);
    }
    .challenge-next:active { transform: scale(0.95); }

    /* 通用 */
    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .pop-in { animation: popIn 0.3s ease; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">🔗 集合与韦恩图</span>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span id="stars-display" style="font-size:24px;margin-left:8px"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="concept">📖 概念</button>
      <button class="mode-tab" data-mode="drag">🎯 分类游戏</button>
      <button class="mode-tab" data-mode="intersect">🔍 交集探索</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 概念 -->
    <div class="mode-content active" id="mode-concept">
      <div class="concept-area">
        <div class="card">
          <p class="page-subtitle">把有相同特点的东西放在一起，就组成了"集合"</p>
          <div class="concept-explain">
            <strong style="color:#E65100">集合</strong>就是把某些事物按特征分组。<br>
            用<strong style="color:#1565C0">圆圈</strong>来表示集合，叫做<strong style="color:#1565C0">韦恩图</strong>。<br>
            两个集合<strong style="color:#7B1FA2">交叉</strong>的部分，是同时属于两个集合的！
          </div>
          <div class="venn-intro">
            <svg viewBox="0 0 320 200">
              <ellipse cx="120" cy="100" rx="90" ry="70" fill="rgba(21,101,192,0.15)" stroke="#1565C0" stroke-width="2.5"/>
              <ellipse cx="200" cy="100" rx="90" ry="70" fill="rgba(123,31,162,0.15)" stroke="#7B1FA2" stroke-width="2.5"/>
              <text x="80" y="90" font-size="14" font-weight="700" fill="#1565C0">水果</text>
              <text x="70" y="112" font-size="13" fill="#1565C0">🍎🍌🍊</text>
              <text x="140" y="90" font-size="14" font-weight="700" fill="#7B1FA2">既是水果</text>
              <text x="145" y="112" font-size="14" font-weight="700" fill="#7B1FA2">又是蔬菜</text>
              <text x="148" y="132" font-size="16" fill="#7B1FA2">🍅</text>
              <text x="220" y="90" font-size="14" font-weight="700" fill="#7B1FA2">蔬菜</text>
              <text x="210" y="112" font-size="13" fill="#7B1FA2">🥬🥕🥦</text>
            </svg>
          </div>
          <div class="concept-example">
            <div class="example-card">
              <div class="icon">🔵</div>
              <div class="label">左圈</div>
              <div class="items">只属于A</div>
            </div>
            <div class="example-card">
              <div class="icon">🟣</div>
              <div class="label">交叉部分</div>
              <div class="items">同时属于A和B</div>
            </div>
            <div class="example-card">
              <div class="icon">🔴</div>
              <div class="label">右圈</div>
              <div class="items">只属于B</div>
            </div>
          </div>
          <div class="action-bar" style="margin-top:16px">
            <button class="btn btn-primary" id="btn-start-drag">🎮 开始分类游戏！</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 拖拽分类 -->
    <div class="mode-content" id="mode-drag">
      <div class="card">
        <div class="drag-area">
          <p class="page-subtitle">把下面的物品拖到正确的集合圈里</p>
          <div class="venn-container" id="venn-container">
            <svg viewBox="0 0 320 220">
              <ellipse cx="110" cy="110" rx="90" ry="80" fill="rgba(21,101,192,0.08)" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,3"/>
              <ellipse cx="210" cy="110" rx="90" ry="80" fill="rgba(123,31,162,0.08)" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6,3"/>
              <text x="55" y="55" font-size="15" font-weight="700" fill="#1565C0" id="labelA">动物</text>
              <text x="225" y="55" font-size="15" font-weight="700" fill="#7B1FA2" id="labelB">会飞</text>
            </svg>
          </div>
          <div class="drag-feedback" id="drag-feedback"></div>
          <div class="drag-pool" id="drag-pool"></div>
          <div>
            <button class="drag-btn" id="btn-check-drag">✅ 检查答案</button>
            <button class="drag-btn" id="btn-new-drag" style="background:#6E6E73">🔄 换一题</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式3: 交集探索 -->
    <div class="mode-content" id="mode-intersect">
      <div class="card">
        <div class="intersect-area">
          <p class="page-subtitle">看看两个集合的交集是什么</p>
          <div class="intersect-controls" id="intersect-controls"></div>
          <svg class="intersect-svg" id="intersect-svg" viewBox="0 0 360 220"></svg>
          <div class="intersect-result" id="intersect-result">
            <div class="r-title">选择一个场景来探索</div>
            <div class="r-items">👆 点击上方按钮</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-score">
            <span>答对 <b id="ch-correct" style="color:#43A047">0</b></span>
            <span>答错 <b id="ch-wrong" style="color:#E53935">0</b></span>
          </div>
          <div class="challenge-q" id="ch-question"></div>
          <svg class="challenge-venn" id="ch-venn" viewBox="0 0 300 180"></svg>
          <div class="challenge-options" id="ch-options"></div>
          <div class="challenge-explain" id="ch-explain"></div>
          <button class="challenge-next" id="btn-next-ch">下一题 →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast('🔥 连续 ' + streak + ' 次！集合小达人！');
    }

    // Tab switching
    document.querySelectorAll('.mode-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.mode-content').forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    document.getElementById('btn-start-drag').addEventListener('click', function() {
      document.querySelectorAll('.mode-tab')[1].click();
    });

    // ========== 模式2: 拖拽分类 ==========
    (function() {
      var dragScenarios = [
        {
          labelA: '动物', labelB: '会飞',
          items: [
            { text: '🐶 狗', answer: 'A' },
            { text: '🐱 猫', answer: 'A' },
            { text: '✈️ 飞机', answer: 'B' },
            { text: '🦅 老鹰', answer: 'AB' },
            { text: '🐟 鱼', answer: 'A' },
            { text: '🦋 蝴蝶', answer: 'AB' },
            { text: '🎈 气球', answer: 'B' },
            { text: '🐘 大象', answer: 'A' }
          ]
        },
        {
          labelA: '水果', labelB: '红色的',
          items: [
            { text: '🍎 苹果', answer: 'AB' },
            { text: '🍌 香蕉', answer: 'A' },
            { text: '🍓 草莓', answer: 'AB' },
            { text: '🍊 橘子', answer: 'A' },
            { text: '🚗 红车', answer: 'B' },
            { text: '🍒 樱桃', answer: 'AB' },
            { text: '🥒 黄瓜', answer: 'none' },
            { text: '🌹 红玫瑰', answer: 'B' }
          ]
        },
        {
          labelA: '圆形', labelB: '蓝色',
          items: [
            { text: '🔵 蓝圆', answer: 'AB' },
            { text: '🔴 红圆', answer: 'A' },
            { text: '🟦 蓝方', answer: 'B' },
            { text: '🟢 绿圆', answer: 'A' },
            { text: '🔷 蓝菱', answer: 'B' },
            { text: '🟡 黄圆', answer: 'A' },
            { text: '📘 蓝书', answer: 'B' },
            { text: '⚽ 足球', answer: 'A' }
          ]
        },
        {
          labelA: '食物', labelB: '甜的',
          items: [
            { text: '🍰 蛋糕', answer: 'AB' },
            { text: '🍕 披萨', answer: 'A' },
            { text: '🍬 糖果', answer: 'AB' },
            { text: '🥦 西兰花', answer: 'A' },
            { text: '🍫 巧克力', answer: 'AB' },
            { text: '🧂 盐', answer: 'none' },
            { text: '🍭 棒棒糖', answer: 'AB' },
            { text: '🍋 柠檬', answer: 'A' }
          ]
        }
      ];

      var currentScenario = 0;
      var placedItems = {};

      function loadDragScenario(idx) {
        currentScenario = idx !== undefined ? idx : Random.int(0, dragScenarios.length - 1);
        var sc = dragScenarios[currentScenario];
        placedItems = {};

        document.getElementById('labelA').textContent = sc.labelA;
        document.getElementById('labelB').textContent = sc.labelB;
        document.getElementById('drag-feedback').textContent = '';

        // Shuffle items
        var shuffled = sc.items.slice();
        for (var i = shuffled.length - 1; i > 0; i--) {
          var j = Random.int(0, i);
          var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
        }

        var pool = document.getElementById('drag-pool');
        pool.innerHTML = '';
        shuffled.forEach(function(item, i) {
          var el = document.createElement('div');
          el.className = 'drag-item';
          el.textContent = item.text;
          el.dataset.answer = item.answer;
          el.dataset.index = i;
          el.style.position = 'relative';
          el.style.left = 'auto';
          el.style.top = 'auto';
          pool.appendChild(el);
          makeDraggable(el);
        });
      }

      function makeDraggable(el) {
        var startX, startY, origLeft, origTop, dragging = false;

        function onStart(e) {
          e.preventDefault();
          dragging = true;
          var rect = el.getBoundingClientRect();
          var clientX = e.touches ? e.touches[0].clientX : e.clientX;
          var clientY = e.touches ? e.touches[0].clientY : e.clientY;
          startX = clientX;
          startY = clientY;
          origLeft = rect.left;
          origTop = rect.top;
          el.style.position = 'fixed';
          el.style.left = origLeft + 'px';
          el.style.top = origTop + 'px';
          el.style.zIndex = '100';
          el.style.transition = 'none';
          Sound.play('click');
        }

        function onMove(e) {
          if (!dragging) return;
          e.preventDefault();
          var clientX = e.touches ? e.touches[0].clientX : e.clientX;
          var clientY = e.touches ? e.touches[0].clientY : e.clientY;
          var dx = clientX - startX;
          var dy = clientY - startY;
          el.style.left = (origLeft + dx) + 'px';
          el.style.top = (origTop + dy) + 'px';
        }

        function onEnd(e) {
          if (!dragging) return;
          dragging = false;
          // Check which zone it's in
          var rect = el.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var container = document.getElementById('venn-container');
          var cRect = container.getBoundingClientRect();

          // Normalize to container coordinates
          var relX = (cx - cRect.left) / cRect.width * 320;
          var relY = (cy - cRect.top) / cRect.height * 220;

          // Check if in left ellipse (center 110,110, rx90, ry80)
          var inA = Math.pow((relX - 110) / 90, 2) + Math.pow((relY - 110) / 80, 2) <= 1;
          // Check if in right ellipse (center 210,110, rx90, ry80)
          var inB = Math.pow((relX - 210) / 90, 2) + Math.pow((relY - 110) / 80, 2) <= 1;

          var zone = '';
          if (inA && inB) zone = 'AB';
          else if (inA) zone = 'A';
          else if (inB) zone = 'B';

          el.classList.remove('correct-place', 'wrong-place');

          if (zone) {
            placedItems[el.dataset.index] = zone;
            el.dataset.zone = zone;
            el.classList.add('placed');
            // Snap to zone
            var snapX, snapY;
            if (zone === 'A') { snapX = cRect.left + 40; snapY = cRect.top + 80 + Object.keys(placedItems).length * 10 % 60; }
            else if (zone === 'B') { snapX = cRect.left + cRect.width - 100; snapY = cRect.top + 80 + Object.keys(placedItems).length * 10 % 60; }
            else { snapX = cRect.left + cRect.width / 2 - 30; snapY = cRect.top + 80 + Object.keys(placedItems).length * 10 % 60; }
            el.style.position = 'fixed';
            el.style.left = snapX + 'px';
            el.style.top = snapY + 'px';
          } else {
            // Return to pool
            el.style.position = 'relative';
            el.style.left = 'auto';
            el.style.top = 'auto';
            el.style.zIndex = '10';
            delete placedItems[el.dataset.index];
            el.dataset.zone = '';
            el.classList.remove('placed');
          }
        }

        el.addEventListener('touchstart', onStart, { passive: false });
        el.addEventListener('touchmove', onMove, { passive: false });
        el.addEventListener('touchend', onEnd);
        el.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
      }

      document.getElementById('btn-check-drag').addEventListener('click', function() {
        var sc = dragScenarios[currentScenario];
        var poolItems = document.querySelectorAll('#drag-pool .drag-item');
        var allCorrect = true;
        var totalPlaced = 0;

        poolItems.forEach(function(el) {
          var answer = el.dataset.answer;
          var zone = el.dataset.zone || '';
          el.classList.remove('correct-place', 'wrong-place');

          if (zone) {
            totalPlaced++;
            if (zone === answer) {
              el.classList.add('correct-place');
            } else {
              el.classList.add('wrong-place');
              allCorrect = false;
            }
          } else {
            // Not placed - check if it should be 'none'
            if (answer !== 'none') {
              allCorrect = false;
            }
          }
        });

        var feedback = document.getElementById('drag-feedback');
        if (totalPlaced === 0) {
          feedback.innerHTML = '👆 先把物品拖到圈里再检查哦！';
          return;
        }

        if (allCorrect && totalPlaced === sc.items.filter(function(it) { return it.answer !== 'none'; }).length) {
          feedback.innerHTML = '🎉 全部正确！太棒了！';
          Sound.play('correct');
          streak++;
          updateStreak();
          celebrate();
          setTimeout(function() { loadDragScenario(); }, 1500);
        } else {
          feedback.innerHTML = '❌ 有些放错了，红色的再想想看！';
          Sound.play('wrong');
          streak = 0;
          updateStreak();
        }
      });

      document.getElementById('btn-new-drag').addEventListener('click', function() {
        loadDragScenario();
        Sound.play('click');
      });

      loadDragScenario();
    })();

    // ========== 模式3: 交集探索 ==========
    (function() {
      var scenarios = [
        {
          title: '班级兴趣小组',
          a: { name: '美术组', items: ['小明', '小红', '小刚', '小丽'] },
          b: { name: '音乐组', items: ['小红', '小华', '小丽', '小强'] },
          colorA: '#1565C0', colorB: '#7B1FA2'
        },
        {
          title: '运动爱好',
          a: { name: '会游泳', items: ['小杰', '小美', '小龙', '小芳'] },
          b: { name: '会骑车', items: ['小杰', '小伟', '小芳', '小玲'] },
          colorA: '#00897B', colorB: '#E65100'
        },
        {
          title: '水果喜好',
          a: { name: '喜欢苹果', items: ['A组1号', 'A组2号', 'A组3号', 'A组4号', 'A组5号'] },
          b: { name: '喜欢香蕉', items: ['A组2号', 'A组4号', 'B组1号', 'B组2号', 'B组3号'] },
          colorA: '#E53935', colorB: '#FFB300'
        }
      ];

      var currentSc = -1;

      function drawIntersect(idx) {
        currentSc = idx;
        var sc = scenarios[idx];
        var svg = document.getElementById('intersect-svg');

        var setA = new Set(sc.a.items);
        var setB = new Set(sc.b.items);
        var both = [];
        var onlyA = [];
        var onlyB = [];

        sc.a.items.forEach(function(item) {
          if (setB.has(item)) both.push(item);
          else onlyA.push(item);
        });
        sc.b.items.forEach(function(item) {
          if (!setA.has(item)) onlyB.push(item);
        });

        svg.innerHTML =
          '<ellipse cx="130" cy="110" rx="100" ry="80" fill="rgba(' + hexToRgb(sc.colorA) + ',0.12)" stroke="' + sc.colorA + '" stroke-width="2.5"/>' +
          '<ellipse cx="230" cy="110" rx="100" ry="80" fill="rgba(' + hexToRgb(sc.colorB) + ',0.12)" stroke="' + sc.colorB + '" stroke-width="2.5"/>' +
          '<text x="60" y="45" font-size="14" font-weight="700" fill="' + sc.colorA + '">' + sc.a.name + ' (' + sc.a.items.length + '人)</text>' +
          '<text x="220" y="45" font-size="14" font-weight="700" fill="' + sc.colorB + '">' + sc.b.name + ' (' + sc.b.items.length + '人)</text>';

        // Place items in SVG
        var positions = {
          onlyA: [{ x: 65, y: 95 }, { x: 65, y: 120 }, { x: 90, y: 80 }, { x: 90, y: 140 }, { x: 55, y: 110 }],
          both: [{ x: 170, y: 90 }, { x: 190, y: 110 }, { x: 170, y: 130 }, { x: 190, y: 90 }],
          onlyB: [{ x: 270, y: 95 }, { x: 270, y: 120 }, { x: 250, y: 80 }, { x: 250, y: 140 }, { x: 280, y: 110 }]
        };

        onlyA.forEach(function(item, i) {
          if (positions.onlyA[i]) {
            svg.innerHTML += '<text x="' + positions.onlyA[i].x + '" y="' + positions.onlyA[i].y + '" font-size="12" font-weight="600" fill="' + sc.colorA + '" text-anchor="middle">' + item + '</text>';
          }
        });
        both.forEach(function(item, i) {
          if (positions.both[i]) {
            svg.innerHTML += '<text x="' + positions.both[i].x + '" y="' + positions.both[i].y + '" font-size="12" font-weight="700" fill="#333" text-anchor="middle">' + item + '</text>';
          }
        });
        onlyB.forEach(function(item, i) {
          if (positions.onlyB[i]) {
            svg.innerHTML += '<text x="' + positions.onlyB[i].x + '" y="' + positions.onlyB[i].y + '" font-size="12" font-weight="600" fill="' + sc.colorB + '" text-anchor="middle">' + item + '</text>';
          }
        });

        // Update result
        var resultEl = document.getElementById('intersect-result');
        resultEl.innerHTML =
          '<div class="r-title">📊 ' + sc.title + '</div>' +
          '<div class="r-items">只参加' + sc.a.name + '：' + onlyA.length + '人</div>' +
          '<div class="r-items" style="color:#7B1FA2">两个都参加：<b>' + both.length + '人</b> (' + both.join('、') + ')</div>' +
          '<div class="r-items">只参加' + sc.b.name + '：' + onlyB.length + '人</div>' +
          '<div class="r-count">一共 ' + (onlyA.length + both.length + onlyB.length) + ' 个不同的同学</div>';

        Sound.play('click');
      }

      function hexToRgb(hex) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return r + ',' + g + ',' + b;
      }

      var controlsEl = document.getElementById('intersect-controls');
      scenarios.forEach(function(sc, i) {
        var btn = document.createElement('button');
        btn.className = 'intersect-btn' + (i === 0 ? ' active' : '');
        btn.textContent = sc.title;
        btn.addEventListener('click', function() {
          document.querySelectorAll('.intersect-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          drawIntersect(i);
        });
        controlsEl.appendChild(btn);
      });

      drawIntersect(0);
    })();

    // ========== 模式4: 挑战 ==========
    (function() {
      var correct = 0, wrong = 0;

      function generateQuestion() {
        var templates = [
          function() {
            var aOnly = Random.int(2, 5);
            var both = Random.int(1, 3);
            var bOnly = Random.int(2, 5);
            var total = aOnly + both + bOnly;
            return {
              q: '集合A有' + (aOnly + both) + '个元素，集合B有' + (bOnly + both) + '个元素，它们的交集有' + both + '个元素。两个集合一共有多少个不同的元素？',
              opts: [total + '', (aOnly + both + bOnly + both) + '', (aOnly + bOnly) + '', (total + 1) + ''],
              answer: 0,
              explain: 'A独有的' + aOnly + '个 + 交集' + both + '个 + B独有的' + bOnly + '个 = ' + total + '个',
              venn: { aOnly: aOnly, both: both, bOnly: bOnly }
            };
          },
          function() {
            var aTotal = Random.int(4, 8);
            var bTotal = Random.int(4, 8);
            var overlap = Random.int(1, Math.min(aTotal, bTotal) - 1);
            var total = aTotal + bTotal - overlap;
            return {
              q: '三(1)班有' + aTotal + '个同学喜欢画画，' + bTotal + '个同学喜欢唱歌，其中有' + overlap + '个同学两个都喜欢。喜欢画画或唱歌的一共有多少人？',
              opts: [total + '', (aTotal + bTotal) + '', (total - 1) + '', (total + 1) + ''],
              answer: 0,
              explain: aTotal + ' + ' + bTotal + ' - ' + overlap + ' = ' + total + '（要减去重复计算的' + overlap + '人）',
              venn: { aOnly: aTotal - overlap, both: overlap, bOnly: bTotal - overlap }
            };
          },
          function() {
            var both = Random.int(2, 4);
            var aOnly = Random.int(1, 4);
            var bOnly = Random.int(1, 4);
            return {
              q: '韦恩图中，集合A有' + (aOnly + both) + '个元素，集合B有' + (bOnly + both) + '个元素，交集有' + both + '个元素。只属于集合A的有几个元素？',
              opts: [aOnly + '', both + '', (aOnly + both) + '', bOnly + ''],
              answer: 0,
              explain: '只属于A = A的总数 - 交集 = ' + (aOnly + both) + ' - ' + both + ' = ' + aOnly,
              venn: { aOnly: aOnly, both: both, bOnly: bOnly }
            };
          },
          function() {
            var a = Random.int(3, 6);
            var b = Random.int(3, 6);
            var overlap = Random.int(1, Math.min(a, b) - 1);
            return {
              q: '小明数了数，参加语文兴趣班的有' + a + '人，参加数学兴趣班的有' + b + '人，两个班都参加的有' + overlap + '人。只参加数学兴趣班的有几人？',
              opts: [(b - overlap) + '', b + '', (b + overlap) + '', (a - overlap) + ''],
              answer: 0,
              explain: '只参加数学 = 数学总数 - 两个都参加 = ' + b + ' - ' + overlap + ' = ' + (b - overlap),
              venn: { aOnly: a - overlap, both: overlap, bOnly: b - overlap }
            };
          },
          function() {
            var a = Random.int(5, 10);
            var b = Random.int(5, 10);
            var overlap = Random.int(2, Math.min(a, b) - 1);
            var total = a + b - overlap;
            return {
              q: '一班有' + a + '人参加了运动会，二班有' + b + '人参加，其中' + overlap + '人两个项目都参加了。一班和二班参加运动会的一共有多少人？',
              opts: [total + '', (a + b) + '', (a + b + overlap) + '', (total - overlap) + ''],
              answer: 0,
              explain: '用公式：' + a + ' + ' + b + ' - ' + overlap + ' = ' + total + '人（减去重复的）',
              venn: { aOnly: a - overlap, both: overlap, bOnly: b - overlap }
            };
          }
        ];

        var idx = Random.int(0, templates.length - 1);
        return templates[idx]();
      }

      function drawVennDiagram(aOnly, both, bOnly) {
        var svg = document.getElementById('ch-venn');
        svg.innerHTML =
          '<ellipse cx="105" cy="90" rx="80" ry="65" fill="rgba(21,101,192,0.1)" stroke="#1565C0" stroke-width="2"/>' +
          '<ellipse cx="195" cy="90" rx="80" ry="65" fill="rgba(123,31,162,0.1)" stroke="#7B1FA2" stroke-width="2"/>' +
          '<text x="60" y="85" font-size="22" font-weight="800" fill="#1565C0" text-anchor="middle">' + aOnly + '</text>' +
          '<text x="60" y="105" font-size="11" fill="#6E6E73" text-anchor="middle">只属A</text>' +
          '<text x="150" y="85" font-size="22" font-weight="800" fill="#333" text-anchor="middle">' + both + '</text>' +
          '<text x="150" y="105" font-size="11" fill="#6E6E73" text-anchor="middle">交集</text>' +
          '<text x="240" y="85" font-size="22" font-weight="800" fill="#7B1FA2" text-anchor="middle">' + bOnly + '</text>' +
          '<text x="240" y="105" font-size="11" fill="#6E6E73" text-anchor="middle">只属B</text>' +
          '<text x="105" y="30" font-size="13" font-weight="700" fill="#1565C0" text-anchor="middle">集合A</text>' +
          '<text x="195" y="30" font-size="13" font-weight="700" fill="#7B1FA2" text-anchor="middle">集合B</text>';
      }

      function showQuestion() {
        var q = generateQuestion();
        document.getElementById('ch-question').textContent = q.q;
        document.getElementById('ch-explain').textContent = '';
        document.getElementById('btn-next-ch').style.display = 'none';

        drawVennDiagram(q.venn.aOnly, q.venn.both, q.venn.bOnly);

        // Shuffle options
        var indices = [0, 1, 2, 3];
        for (var i = indices.length - 1; i > 0; i--) {
          var j = Random.int(0, i);
          var tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
        }
        var correctIdx = indices.indexOf(q.answer);

        var optsEl = document.getElementById('ch-options');
        optsEl.innerHTML = '';
        indices.forEach(function(optIdx, displayIdx) {
          var btn = document.createElement('button');
          btn.className = 'challenge-opt';
          btn.textContent = (displayIdx + 1) + '. ' + q.opts[optIdx];
          btn.dataset.correct = (optIdx === q.answer) ? 'true' : 'false';
          btn.addEventListener('click', function() {
            var isCorrect = btn.dataset.correct === 'true';
            // Disable all buttons
            document.querySelectorAll('.challenge-opt').forEach(function(b) { b.style.pointerEvents = 'none'; });

            if (isCorrect) {
              btn.classList.add('correct');
              correct++;
              streak++;
              Sound.play('correct');
              celebrate();
              document.getElementById('ch-explain').innerHTML = '✅ 正确！' + q.explain;
            } else {
              btn.classList.add('wrong');
              wrong++;
              streak = 0;
              Sound.play('wrong');
              Animator.shake(btn);
              // Show correct answer
              document.querySelectorAll('.challenge-opt').forEach(function(b) {
                if (b.dataset.correct === 'true') b.classList.add('correct');
              });
              document.getElementById('ch-explain').innerHTML = '❌ 答案是 ' + q.opts[q.answer] + '。' + q.explain;
            }
            updateStreak();
            document.getElementById('ch-correct').textContent = correct;
            document.getElementById('ch-wrong').textContent = wrong;
            document.getElementById('btn-next-ch').style.display = 'block';

            // Auto next after 1.5s if correct
            if (isCorrect) {
              setTimeout(function() { showQuestion(); }, 1500);
            }
          });
          optsEl.appendChild(btn);
        });
      }

      document.getElementById('btn-next-ch').addEventListener('click', function() {
        showQuestion();
        Sound.play('click');
      });

      showQuestion();
    })();
  </script>
