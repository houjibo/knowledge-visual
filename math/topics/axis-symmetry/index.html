<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>轴对称图形</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #7B1FA2; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }
    .concept-area { text-align: center; padding: 24px 16px; }
    .concept-explain { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0; line-height: 1.8; }
    .concept-example { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .example-card { display: flex; flex-direction: column; align-items: center; padding: 16px; background: white; border-radius: 16px; width: 140px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .example-card .label { font-size: 14px; font-weight: 600; color: #6E6E73; }
    .symmetry-line { stroke: #FF3B30; stroke-width: 2; stroke-dasharray: 6 4; }
    .fold-area { text-align: center; padding: 24px 16px; }
    .fold-svg { margin: 16px auto; display: block; }
    .fold-controls { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .fold-btn { padding: 10px 20px; border: 2px solid #7B1FA2; background: white; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .fold-btn.active { background: #7B1FA2; color: white; }
    .fold-btn:active { transform: scale(0.95); }
    .fold-result { font-size: 18px; font-weight: 600; margin: 16px 0; padding: 12px; background: #F3E5F5; border-radius: 12px; color: #7B1FA2; }
    .find-area { text-align: center; padding: 24px 16px; }
    .find-score { display: flex; justify-content: center; gap: 16px; margin: 12px 0; font-size: 18px; font-weight: 600; }
    .find-feedback { font-size: 20px; font-weight: 700; margin: 16px 0; min-height: 28px; }
    .find-hint { font-size: 15px; color: #6E6E73; margin: 8px 0; }
    .find-btn { padding: 10px 24px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 4px; transition: all 0.2s ease; }
    .find-btn-primary { background: #7B1FA2; color: white; }
    .streak-display { font-size: 16px; font-weight: 600; color: #FF9500; }
    .draw-area { text-align: center; padding: 24px 16px; }
    .draw-canvas { margin: 16px auto; display: inline-block; border-radius: 16px; overflow: hidden; }
    .draw-canvas svg { display: block; cursor: crosshair; }
    .draw-controls { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .draw-score-bar { display: flex; justify-content: center; gap: 12px; margin: 12px 0; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="breadcrumb">
    <a href="../index.html" class="nav-back">← 返回</a>
    <span class="breadcrumb-current">🪷 轴对称图形</span>
    <span class="nav-badge">二年级</span>
  </nav>

  <div class="page-container">
    <div class="mode-tabs" role="tablist">
      <button class="mode-tab active" data-mode="concept">📖 概念</button>
      <button class="mode-tab" data-mode="fold">🦋 折纸</button>
      <button class="mode-tab" data-mode="find">🔍 找对称轴</button>
      <button class="mode-tab" data-mode="draw">✏️ 画对称</button>
    </div>

    <!-- 模式1: 概念 -->
    <div class="mode-content active" id="mode-concept">
      <div class="concept-area">
        <div class="concept-explain">
          如果一个图形沿着一条线对折，<br>
          两边<b>完全重合</b>，它就是<b>轴对称图形</b>。<br>
          那条折痕叫做<b style="color:#FF3B30">对称轴</b>。
        </div>
        <svg width="320" height="120" viewBox="0 0 320 120" style="margin:16px auto;">
          <rect x="10" y="10" width="140" height="100" rx="8" fill="rgba(123,31,162,0.08)" stroke="#7B1FA2" stroke-width="2"/>
          <line x1="80" y1="10" x2="80" y2="110" class="symmetry-line"/>
          <text x="80" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#FF3B30">对称轴</text>
          <text x="45" y="65" text-anchor="middle" font-size="14" fill="#6E6E73">←</text>
          <text x="115" y="65" text-anchor="middle" font-size="14" fill="#6E6E73">→</text>
          <text x="165" y="65" text-anchor="middle" font-size="14" fill="#1D1D1F" font-weight="600">完全重合</text>
          <path d="M160 50 L180 65 L160 80" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h3 style="font-size:17px;color:#6E6E73;margin:24px 0 16px;">生活中的轴对称图形</h3>
        <div class="concept-example">
          <div class="example-card">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="32" fill="rgba(74,144,217,0.15)" stroke="#4A90D9" stroke-width="2"/>
              <line x1="40" y1="5" x2="40" y2="75" class="symmetry-line"/>
            </svg>
            <div class="label">圆形</div>
          </div>
          <div class="example-card">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <rect x="10" y="15" width="60" height="50" rx="4" fill="rgba(255,149,0,0.12)" stroke="#FF9500" stroke-width="2"/>
              <line x1="40" y1="15" x2="40" y2="65" class="symmetry-line"/>
            </svg>
            <div class="label">长方形</div>
          </div>
          <div class="example-card">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <polygon points="40,8 72,72 8,72" fill="rgba(52,199,89,0.12)" stroke="#34C759" stroke-width="2" stroke-linejoin="round"/>
              <line x1="40" y1="8" x2="40" y2="72" class="symmetry-line"/>
            </svg>
            <div class="label">等腰三角形</div>
          </div>
          <div class="example-card">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <path d="M40 10 C55 25, 70 35, 70 50 C70 65, 55 75, 40 75 C25 75, 10 65, 10 50 C10 35, 25 25, 40 10Z" fill="rgba(255,59,48,0.12)" stroke="#FF3B30" stroke-width="2"/>
              <line x1="40" y1="10" x2="40" y2="75" class="symmetry-line"/>
            </svg>
            <div class="label">爱心</div>
          </div>
          <div class="example-card">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <ellipse cx="30" cy="30" rx="16" ry="12" fill="rgba(156,39,176,0.15)" stroke="#9C27B0" stroke-width="1.5" transform="rotate(-20,30,30)"/>
              <ellipse cx="50" cy="30" rx="16" ry="12" fill="rgba(156,39,176,0.15)" stroke="#9C27B0" stroke-width="1.5" transform="rotate(20,50,30)"/>
              <ellipse cx="30" cy="55" rx="12" ry="8" fill="rgba(156,39,176,0.12)" stroke="#9C27B0" stroke-width="1.5" transform="rotate(-15,30,55)"/>
              <ellipse cx="50" cy="55" rx="12" ry="8" fill="rgba(156,39,176,0.12)" stroke="#9C27B0" stroke-width="1.5" transform="rotate(15,50,55)"/>
              <ellipse cx="40" cy="40" rx="3" ry="18" fill="#4A90D9" opacity="0.6"/>
              <line x1="40" y1="10" x2="40" y2="72" class="symmetry-line"/>
            </svg>
            <div class="label">蝴蝶</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 折纸互动 -->
    <div class="mode-content" id="mode-fold">
      <div class="fold-area">
        <h3 style="font-size:20px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">🦋 折纸验证</h3>
        <p style="font-size:15px;color:#6E6E73;">选择一个图形，拖动滑块模拟对折过程</p>
        <div class="fold-controls" id="shape-selector">
          <button class="fold-btn active" data-shape="butterfly">🦋 蝴蝶</button>
          <button class="fold-btn" data-shape="tree">🌲 松树</button>
          <button class="fold-btn" data-shape="star">⭐ 五角星</button>
          <button class="fold-btn" data-shape="heart">❤️ 心形</button>
        </div>
        <svg id="fold-svg" width="320" height="280" viewBox="0 0 320 280" class="fold-svg">
          <defs>
            <clipPath id="fold-left-clip"><rect x="0" y="0" width="160" height="280"/></clipPath>
            <clipPath id="fold-right-clip"><rect x="160" y="0" width="160" height="280"/></clipPath>
          </defs>
        </svg>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0;">
          <span style="font-size:14px;font-weight:600;color:#6E6E73;">展开</span>
          <input type="range" id="fold-slider" min="0" max="100" value="0" style="width:200px;accent-color:#7B1FA2;">
          <span style="font-size:14px;font-weight:600;color:#6E6E73;">对折</span>
        </div>
        <div id="fold-result" class="fold-result">← 拖动滑块试试，看看两边能不能完全重合</div>
      </div>
    </div>

    <!-- 模式3: 找对称轴 -->
    <div class="mode-content" id="mode-find">
      <div class="find-area">
        <h3 style="font-size:20px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">🔍 找轴对称图形</h3>
        <p style="font-size:15px;color:#6E6E73;">判断哪个图形是轴对称图形</p>
        <div class="find-score">
          <span id="find-correct">✅ 0</span>
          <span id="find-wrong">❌ 0</span>
          <span id="find-streak" class="streak-display">🔥 0</span>
        </div>
        <div id="find-question" style="font-size:17px;font-weight:600;margin:12px 0;"></div>
        <div id="find-shapes" style="display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:20px 0;"></div>
        <div id="find-feedback" class="find-feedback"></div>
        <div id="find-hint" class="find-hint"></div>
        <div style="margin-top:16px;">
          <button class="find-btn find-btn-primary" id="find-next-btn">下一题 →</button>
        </div>
      </div>
    </div>

    <!-- 模式4: 画对称 -->
    <div class="mode-content" id="mode-draw">
      <div class="draw-area">
        <h3 style="font-size:20px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">✏️ 画出对称另一半</h3>
        <p style="font-size:15px;color:#6E6E73;">在右侧画出与左侧对称的图形</p>
        <div class="draw-score-bar">
          <span>得分: <b id="draw-score">0</b></span>
          <span>连对: <b id="draw-streak" class="streak-display">🔥 0</b></span>
        </div>
        <div class="draw-canvas">
          <svg id="draw-svg" width="320" height="320" viewBox="0 0 320 320" style="background:white;border-radius:16px;border:2px solid #E5E5EA;">
            <line x1="160" y1="0" x2="160" y2="320" stroke="#FF3B30" stroke-width="2" stroke-dasharray="8 4"/>
            <text x="160" y="-6" text-anchor="middle" font-size="11" font-weight="600" fill="#FF3B30">对称轴</text>
            <g id="draw-left"></g>
            <rect id="draw-zone" x="162" y="2" width="156" height="316" fill="rgba(123,31,162,0.03)" rx="4"/>
            <g id="draw-user"></g>
          </svg>
        </div>
        <div class="draw-controls">
          <button class="fold-btn" id="draw-clear">🗑️ 清除</button>
          <button class="fold-btn active" id="draw-check">✅ 检查</button>
          <button class="fold-btn" id="draw-next">下一题 →</button>
        </div>
        <div id="draw-feedback" class="find-feedback"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mode-' + btn.dataset.mode).classList.add('active');
        if (Sound) Sound.play('click');
      });
    });

    let streak = 0;
    function updateStreak() {
      document.querySelectorAll('.streak-display').forEach(el => { el.textContent = '🔥 ' + streak; });
    }

    // 模式2: 折纸
    (function() {
      var shapes = {
        butterfly: { left: '<g clip-path="url(#fold-left-clip)"><ellipse cx="130" cy="100" rx="70" ry="50" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="2" transform="rotate(-15,130,100)"/><ellipse cx="130" cy="190" rx="55" ry="35" fill="rgba(156,39,176,0.15)" stroke="#9C27B0" stroke-width="2" transform="rotate(-10,130,190)"/></g>', right: '<g clip-path="url(#fold-right-clip)"><ellipse cx="190" cy="100" rx="70" ry="50" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="2" transform="rotate(15,190,100)"/><ellipse cx="190" cy="190" rx="55" ry="35" fill="rgba(156,39,176,0.15)" stroke="#9C27B0" stroke-width="2" transform="rotate(10,190,190)"/></g>' },
        tree: { left: '<g clip-path="url(#fold-left-clip)"><polygon points="160,20 60,120 110,120" fill="rgba(52,199,89,0.2)" stroke="#34C759" stroke-width="2"/><polygon points="160,60 40,180 110,180" fill="rgba(52,199,89,0.18)" stroke="#34C759" stroke-width="2"/><polygon points="160,100 30,250 110,250" fill="rgba(52,199,89,0.15)" stroke="#34C759" stroke-width="2"/><rect x="145" y="250" width="15" height="30" fill="#8B5E3C"/></g>', right: '<g clip-path="url(#fold-right-clip)"><polygon points="160,20 260,120 210,120" fill="rgba(52,199,89,0.2)" stroke="#34C759" stroke-width="2"/><polygon points="160,60 280,180 210,180" fill="rgba(52,199,89,0.18)" stroke="#34C759" stroke-width="2"/><polygon points="160,100 290,250 210,250" fill="rgba(52,199,89,0.15)" stroke="#34C759" stroke-width="2"/><rect x="160" y="250" width="15" height="30" fill="#8B5E3C"/></g>' },
        star: { left: '<g clip-path="url(#fold-left-clip)"><polygon points="160,20 135,110 50,110 120,160 95,250 160,195" fill="rgba(255,193,7,0.25)" stroke="#FFC107" stroke-width="2" stroke-linejoin="round"/></g>', right: '<g clip-path="url(#fold-right-clip)"><polygon points="160,20 185,110 270,110 200,160 225,250 160,195" fill="rgba(255,193,7,0.25)" stroke="#FFC107" stroke-width="2" stroke-linejoin="round"/></g>' },
        heart: { left: '<g clip-path="url(#fold-left-clip)"><path d="M160 260 C80 180, 20 140, 40 80 C55 35, 110 20, 160 100" fill="rgba(255,59,48,0.15)" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round"/></g>', right: '<g clip-path="url(#fold-right-clip)"><path d="M160 260 C240 180, 300 140, 280 80 C265 35, 210 20, 160 100" fill="rgba(255,59,48,0.15)" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round"/></g>' }
      };
      var currentShape = 'butterfly';
      document.querySelectorAll('#shape-selector .fold-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('#shape-selector .fold-btn').forEach(function(b){b.classList.remove('active');});
          btn.classList.add('active');
          currentShape = btn.dataset.shape;
          updateFold();
          if (Sound) Sound.play('click');
        });
      });
      document.getElementById('fold-slider').addEventListener('input', updateFold);
      function updateFold() {
        var pct = parseInt(document.getElementById('fold-slider').value);
        var svg = document.getElementById('fold-svg');
        var s = shapes[currentShape];
        svg.innerHTML = '<defs><clipPath id="fold-left-clip"><rect x="0" y="0" width="160" height="280"/></clipPath>' +
          '<clipPath id="fold-right-clip"><rect x="' + (160 - 160 * pct / 100) + '" y="0" width="' + (160 * pct / 100) + '" height="280"/></clipPath></defs>' +
          s.left + s.right + '<line x1="160" y1="0" x2="160" y2="280" stroke="#FF3B30" stroke-width="2" stroke-dasharray="6 4" opacity="' + (0.5 + pct/200) + '"/>';
        var result = document.getElementById('fold-result');
        if (pct >= 90) { result.innerHTML = '✅ 两边<b>完全重合</b>！这是<b>轴对称图形</b>，红色虚线就是对称轴！'; result.style.background = 'rgba(52,199,89,0.1)'; result.style.color = '#34C759'; }
        else if (pct >= 50) { result.textContent = '🔄 继续拖动，快要对折了…'; result.style.background = '#FFF3E0'; result.style.color = '#E65100'; }
        else { result.textContent = '← 拖动滑块试试，看看两边能不能完全重合'; result.style.background = '#F3E5F5'; result.style.color = '#7B1FA2'; }
      }
      updateFold();
    })();

    // 模式3: 找对称轴
    (function() {
      var correctCount = 0, wrongCount = 0, qIndex = 0;
      var questions = [
        { q: '下面哪个图形是<b>轴对称图形</b>？点击选择。', options: [
          { label: 'A', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><rect x="15" y="20" width="70" height="60" rx="4" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2"/></svg>', answer: true, name: '长方形' },
          { label: 'B', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><polygon points="50,10 85,80 20,75" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2"/></svg>', answer: false, name: '不规则三角形' },
          { label: 'C', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><path d="M30 80 L70 50 L50 20 L80 10" fill="none" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/></svg>', answer: false, name: '不规则线' },
          { label: 'D', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2"/></svg>', answer: true, name: '圆形' }
        ]},
        { q: '正方形有<b>几条</b>对称轴？', options: [
          { label: 'A', text: '1条', answer: false }, { label: 'B', text: '2条', answer: false },
          { label: 'C', text: '4条', answer: true }, { label: 'D', text: '无数条', answer: false }
        ]},
        { q: '下面哪个图形是<b>轴对称图形</b>？', options: [
          { label: 'A', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2"/></svg>', answer: true, name: '等腰三角形' },
          { label: 'B', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><polygon points="20,15 90,30 60,85" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2"/></svg>', answer: false, name: '不规则三角形' },
          { label: 'C', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><path d="M20 80 Q50 10, 80 80" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/></svg>', answer: true, name: '拱形' },
          { label: 'D', svg: '<svg width="100" height="100" viewBox="0 0 100 100"><path d="M20 70 L40 20 L60 50 L80 10 L90 40" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/></svg>', answer: false, name: '折线' }
        ]},
        { q: '平行四边形<b>是</b>轴对称图形吗？', options: [
          { label: 'A', text: '是', answer: false }, { label: 'B', text: '不是', answer: true },
          { label: 'C', text: '有时候是', answer: false }, { label: 'D', text: '不确定', answer: false }
        ]},
        { q: '等边三角形有几条对称轴？', options: [
          { label: 'A', text: '1条', answer: false }, { label: 'B', text: '2条', answer: false },
          { label: 'C', text: '3条', answer: true }, { label: 'D', text: '4条', answer: false }
        ]}
      ];
      function showQuestion() {
        var q = questions[qIndex % questions.length];
        document.getElementById('find-question').innerHTML = q.q;
        document.getElementById('find-feedback').textContent = '';
        document.getElementById('find-hint').textContent = '';
        var container = document.getElementById('find-shapes');
        container.innerHTML = '';
        q.options.forEach(function(opt, i) {
          var card = document.createElement('div');
          card.className = 'example-card';
          card.style.cursor = 'pointer';
          card.style.width = '100px';
          card.style.padding = '12px';
          if (opt.svg) { card.innerHTML = opt.svg + '<div class="label">' + opt.label + ': ' + opt.name + '</div>'; }
          else { card.innerHTML = '<div style="font-size:32px;font-weight:700;color:#7B1FA2;margin:12px 0;">' + opt.text + '</div><div class="label">' + opt.label + '</div>'; }
          card.addEventListener('click', function() {
            var feedback = document.getElementById('find-feedback');
            var hint = document.getElementById('find-hint');
            container.querySelectorAll('.example-card').forEach(function(c){c.style.pointerEvents = 'none';});
            if (opt.answer) {
              card.style.background = 'rgba(52,199,89,0.15)'; card.style.borderColor = '#34C759';
              correctCount++; streak++;
              feedback.innerHTML = '🎉 正确！'; feedback.style.color = '#34C759'; hint.textContent = '';
              if (Sound) Sound.play('correct');
              if (typeof celebrate === 'function') celebrate();
            } else {
              card.style.background = 'rgba(255,59,48,0.1)'; card.style.borderColor = '#FF3B30';
              wrongCount++; streak = 0;
              feedback.innerHTML = '❌ 不对哦'; feedback.style.color = '#FF3B30';
              q.options.forEach(function(o2, j){ if (o2.answer) { var cards = container.querySelectorAll('.example-card'); cards[j].style.background = 'rgba(52,199,89,0.15)'; cards[j].style.borderColor = '#34C759'; } });
              if (Sound) Sound.play('wrong');
            }
            updateStreak();
            document.getElementById('find-correct').textContent = '✅ ' + correctCount;
            document.getElementById('find-wrong').textContent = '❌ ' + wrongCount;
          });
          container.appendChild(card);
        });
      }
      document.getElementById('find-next-btn').addEventListener('click', function() { qIndex++; showQuestion(); if (Sound) Sound.play('click'); });
      showQuestion();
    })();

    // 模式4: 画对称
    (function() {
      var drawScore = 0, drawStreakCount = 0, currentPattern = [], userPoints = [], drawing = false;
      var patterns = [
        [{x:100,y:80},{x:100,y:160},{x:100,y:240},{x:60,y:80},{x:60,y:160},{x:60,y:240}],
        [{x:120,y:60},{x:120,y:160},{x:120,y:260},{x:80,y:100},{x:80,y:220}],
        [{x:100,y:60},{x:100,y:130},{x:100,y:200},{x:100,y:270},{x:50,y:60},{x:50,y:270}],
        [{x:110,y:100},{x:110,y:200},{x:70,y:150},{x:110,y:150}]
      ];
      function loadPattern(idx) {
        currentPattern = patterns[idx % patterns.length];
        userPoints = [];
        var leftGroup = document.getElementById('draw-left');
        leftGroup.innerHTML = '';
        currentPattern.forEach(function(p) {
          var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', '10');
          circle.setAttribute('fill', '#7B1FA2'); circle.setAttribute('opacity', '0.7');
          leftGroup.appendChild(circle);
        });
        if (currentPattern.length > 1) {
          var line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          line.setAttribute('points', currentPattern.map(function(p){return p.x+','+p.y;}).join(' '));
          line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#7B1FA2');
          line.setAttribute('stroke-width', '3'); line.setAttribute('stroke-linecap', 'round');
          line.setAttribute('stroke-linejoin', 'round'); leftGroup.appendChild(line);
        }
        document.getElementById('draw-user').innerHTML = '';
        document.getElementById('draw-feedback').textContent = '';
      }
      var svg = document.getElementById('draw-svg');
      function getSVGPoint(e) {
        var rect = svg.getBoundingClientRect();
        var cx = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        var cy = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        return { x: cx * (320 / rect.width) - rect.left * (320 / rect.width), y: cy * (320 / rect.height) - rect.top * (320 / rect.height) };
      }
      svg.addEventListener('pointerdown', function(e) { var p = getSVGPoint(e); if (p.x > 162 && p.x < 318 && p.y > 2 && p.y < 318) { drawing = true; addUserPoint(p); } });
      svg.addEventListener('pointermove', function(e) { if (!drawing) return; var p = getSVGPoint(e); if (p.x > 162 && p.x < 318 && p.y > 2 && p.y < 318) addUserPoint(p); });
      svg.addEventListener('pointerup', function() { drawing = false; });
      svg.addEventListener('pointerleave', function() { drawing = false; });
      function addUserPoint(p) {
        if (userPoints.length > 0) { var last = userPoints[userPoints.length-1]; if (Math.abs(p.x-last.x) < 4 && Math.abs(p.y-last.y) < 4) return; }
        userPoints.push(p);
        var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', '4');
        circle.setAttribute('fill', '#FF9500'); document.getElementById('draw-user').appendChild(circle);
        if (userPoints.length > 1) {
          var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', userPoints[userPoints.length-2].x); line.setAttribute('y1', userPoints[userPoints.length-2].y);
          line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
          line.setAttribute('stroke', '#FF9500'); line.setAttribute('stroke-width', '2.5');
          line.setAttribute('stroke-linecap', 'round'); document.getElementById('draw-user').appendChild(line);
        }
      }
      function checkDrawing() {
        if (userPoints.length < 3) { document.getElementById('draw-feedback').textContent = '🤔 画太少了，多点几下试试'; document.getElementById('draw-feedback').style.color = '#FF9500'; return; }
        var userSymmetric = userPoints.map(function(p) { return { x: 160 - (p.x - 160), y: p.y }; });
        var matchCount = 0;
        currentPattern.forEach(function(cp) { for (var si = 0; si < userSymmetric.length; si++) { var sp = userSymmetric[si]; if (Math.abs(sp.x - cp.x) < 30 && Math.abs(sp.y - cp.y) < 30) { matchCount++; break; } } });
        var coverage = matchCount / currentPattern.length;
        var feedback = document.getElementById('draw-feedback');
        if (coverage >= 0.7) { drawScore += 10; drawStreakCount++; feedback.innerHTML = '🎉 太棒了！画得很对称！+10分'; feedback.style.color = '#34C759'; if (Sound) Sound.play('correct'); if (typeof celebrate === 'function') celebrate(); }
        else if (coverage >= 0.4) { drawStreakCount = 0; feedback.innerHTML = '👍 差不多，再看看有没有遗漏的点'; feedback.style.color = '#FF9500'; }
        else { drawStreakCount = 0; feedback.innerHTML = '💪 再试试，注意观察左边的点和形状'; feedback.style.color = '#FF3B30'; }
        document.getElementById('draw-score').textContent = drawScore;
        document.getElementById('draw-streak').textContent = '🔥 ' + drawStreakCount;
        updateStreak();
      }
      document.getElementById('draw-clear').addEventListener('click', function() { userPoints = []; document.getElementById('draw-user').innerHTML = ''; document.getElementById('draw-feedback').textContent = ''; if (Sound) Sound.play('click'); });
      document.getElementById('draw-check').addEventListener('click', function() { checkDrawing(); if (Sound) Sound.play('click'); });
      document.getElementById('draw-next').addEventListener('click', function() { drawStreakCount++; loadPattern(drawStreakCount); drawScore = Math.max(0, drawScore - 5); document.getElementById('draw-score').textContent = drawScore; if (Sound) Sound.play('click'); });
      loadPattern(0);
    })();
  </script>
</body>
</html>
