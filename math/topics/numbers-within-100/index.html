<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>100以内数的认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #2E7D32; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 数一数 */
    .count-area { text-align: center; padding: 16px; }
    .count-display {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .count-objects {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 16px 0;
      min-height: 80px;
    }
    .count-obj {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; background: #F5F5F5; border-radius: 10px;
      animation: popIn 0.3s ease backwards;
    }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .count-input-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; }
    .count-input {
      width: 80px; height: 56px; border: 3px solid #E5E5EA; border-radius: 14px;
      font-size: 28px; font-weight: 700; text-align: center; color: #1D1D1F;
      outline: none; transition: border-color 0.2s;
    }
    .count-input:focus { border-color: #2E7D32; }
    .count-btn {
      padding: 14px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .count-btn:active { transform: scale(0.95); }
    .count-btn.primary { background: #2E7D32; color: white; box-shadow: 0 4px 12px rgba(46,125,50,0.3); }
    .count-btn.secondary { background: #E5E5EA; color: #1D1D1F; }
    .count-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .count-hint { font-size: 14px; color: #6E6E73; margin: 8px 0; }

    /* 模式2: 数的组成 */
    .compose-area { text-align: center; padding: 16px; }
    .compose-card {
      background: white; border-radius: 20px; padding: 24px; margin: 16px auto;
      max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .compose-number {
      font-size: 56px; font-weight: 800; color: #2E7D32; margin: 16px 0;
    }
    .compose-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .compose-label { font-size: 18px; font-weight: 600; color: #6E6E73; }
    .compose-input {
      width: 60px; height: 50px; border: 3px solid #E5E5EA; border-radius: 12px;
      font-size: 24px; font-weight: 700; text-align: center; color: #1D1D1F;
      outline: none; transition: border-color 0.2s;
    }
    .compose-input:focus { border-color: #2E7D32; }
    .compose-unit { font-size: 18px; font-weight: 600; color: #1D1D1F; }

    /* 模式3: 比大小 */
    .compare-area { text-align: center; padding: 16px; }
    .compare-card {
      background: white; border-radius: 20px; padding: 24px; margin: 16px auto;
      max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .compare-numbers {
      display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0;
    }
    .compare-num {
      font-size: 40px; font-weight: 800; color: #1D1D1F;
      background: #F5F5F5; padding: 12px 20px; border-radius: 16px; min-width: 80px;
    }
    .compare-blank {
      width: 60px; height: 60px; border: 3px dashed #BDBDBD; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #BDBDBD; background: white;
    }
    .compare-options { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
    .compare-opt {
      width: 64px; height: 64px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
    }
    .compare-opt:active { transform: scale(0.9); }
    .compare-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .compare-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式4: 数序填空 */
    .sequence-area { text-align: center; padding: 16px; }
    .sequence-card {
      background: white; border-radius: 20px; padding: 24px; margin: 16px auto;
      max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .sequence-row {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin: 20px 0;
      flex-wrap: wrap;
    }
    .seq-num {
      font-size: 24px; font-weight: 700; color: #1D1D1F;
      background: #F5F5F5; padding: 10px 14px; border-radius: 12px; min-width: 44px;
      text-align: center;
    }
    .seq-blank {
      font-size: 24px; font-weight: 700; color: #2E7D32;
      background: rgba(46,125,50,0.1); padding: 10px 14px; border-radius: 12px;
      min-width: 44px; text-align: center; border: 2px dashed #2E7D32;
    }
    .seq-options { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .seq-opt {
      padding: 12px 20px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .seq-opt:active { transform: scale(0.9); }
    .seq-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .seq-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 通用 */
    .next-btn {
      display: block; margin: 16px auto; padding: 12px 32px; border: none;
      border-radius: 14px; background: #2E7D32; color: white; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div style="max-width:480px;margin:0 auto;padding:16px;">
    <!-- 导航栏 -->
    <nav class="nav-bar" style="display:flex;align-items:center;padding:12px 0;margin-bottom:12px;">
      <a href="../../index.html" style="display:flex;align-items:center;gap:6px;color:#2E7D32;font-size:16px;font-weight:600;text-decoration:none;">
        ← 返回
      </a>
      <span style="flex:1;text-align:center;font-size:18px;font-weight:700;color:#1D1D1F;">100以内数的认识</span>
      <span style="width:60px;"></span>
    </nav>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="count">🔢 数一数</button>
      <button class="mode-tab" data-mode="compose">🧩 数的组成</button>
      <button class="mode-tab" data-mode="compare">⚖️ 比大小</button>
      <button class="mode-tab" data-mode="sequence">📊 数序填空</button>
    </div>

    <!-- 模式1: 数一数 -->
    <div class="mode-content active" id="mode-count">
      <div class="section-title">🔢 数一数</div>
      <div class="section-desc">数一数下面有多少个物体，输入答案吧！</div>
      <div class="score-bar">
        <span>✅ 正确: <span id="count-correct">0</span></span>
        <span>❌ 错误: <span id="count-wrong">0</span></span>
      </div>
      <div class="count-area">
        <div class="count-display">
          <div class="count-hint" id="count-hint">数一数有多少个苹果 🍎</div>
          <div class="count-objects" id="count-objects"></div>
          <div class="count-input-row">
            <span style="font-size:18px;font-weight:600;color:#6E6E73;">有</span>
            <input type="number" class="count-input" id="count-answer" min="1" max="100" placeholder="?">
            <span style="font-size:18px;font-weight:600;color:#6E6E73;">个</span>
          </div>
          <div class="count-feedback" id="count-feedback"></div>
          <button class="count-btn primary" id="count-check">✅ 检查答案</button>
          <button class="count-btn secondary" id="count-next" style="display:none;margin-top:12px;">👉 下一题</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 数的组成 -->
    <div class="mode-content" id="mode-compose">
      <div class="section-title">🧩 数的组成</div>
      <div class="section-desc">填一填，这个数由几个十和几个一组成？</div>
      <div class="score-bar">
        <span>✅ 正确: <span id="compose-correct">0</span></span>
        <span>❌ 错误: <span id="compose-wrong">0</span></span>
      </div>
      <div class="compose-area">
        <div class="compose-card">
          <div class="compose-number" id="compose-number">35</div>
          <div class="compose-row">
            <input type="number" class="compose-input" id="compose-tens" min="0" max="10" placeholder="?">
            <span class="compose-unit">个十</span>
          </div>
          <div class="compose-row">
            <input type="number" class="compose-input" id="compose-ones" min="0" max="9" placeholder="?">
            <span class="compose-unit">个一</span>
          </div>
          <div class="result-text" id="compose-feedback"></div>
          <button class="count-btn primary" id="compose-check">✅ 检查答案</button>
          <button class="count-btn secondary" id="compose-next" style="display:none;margin-top:12px;">👉 下一题</button>
        </div>
      </div>
    </div>

    <!-- 模式3: 比大小 -->
    <div class="mode-content" id="mode-compare">
      <div class="section-title">⚖️ 比大小</div>
      <div class="section-desc">在圆圈里填上 &gt;、&lt; 或 =</div>
      <div class="score-bar">
        <span>✅ 正确: <span id="compare-correct">0</span></span>
        <span>❌ 错误: <span id="compare-wrong">0</span></span>
      </div>
      <div class="compare-area">
        <div class="compare-card">
          <div class="compare-numbers">
            <div class="compare-num" id="compare-left">25</div>
            <div class="compare-blank" id="compare-symbol">?</div>
            <div class="compare-num" id="compare-right">31</div>
          </div>
          <div class="compare-options">
            <button class="compare-opt" data-symbol="&gt;">&gt;</button>
            <button class="compare-opt" data-symbol="&lt;">&lt;</button>
            <button class="compare-opt" data-symbol="=">=</button>
          </div>
          <div class="result-text" id="compare-feedback"></div>
          <button class="count-btn secondary" id="compare-next" style="display:none;margin-top:12px;">👉 下一题</button>
        </div>
      </div>
    </div>

    <!-- 模式4: 数序填空 -->
    <div class="mode-content" id="mode-sequence">
      <div class="section-title">📊 数序填空</div>
      <div class="section-desc">找出规律，填上空缺的数</div>
      <div class="score-bar">
        <span>✅ 正确: <span id="seq-correct">0</span></span>
        <span>❌ 错误: <span id="seq-wrong">0</span></span>
      </div>
      <div class="sequence-area">
        <div class="sequence-card">
          <div class="sequence-row" id="sequence-row"></div>
          <div class="seq-options" id="seq-options"></div>
          <div class="result-text" id="seq-feedback"></div>
          <button class="count-btn secondary" id="seq-next" style="display:none;margin-top:12px;">👉 下一题</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    // ========== 模式切换 ==========
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
      });
    });

    // ========== 工具函数 ==========
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    var emojis = ['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🌟','⭐','🌸','🌺','🎈','🐱','🐶','🐰','🦊','🐸','🐝','🦋'];

    // ========== 模式1: 数一数 ==========
    var countState = { answer: 0, correct: 0, wrong: 0 };

    function newCountProblem() {
      var n = randInt(5, 50);
      countState.answer = n;
      var emoji = emojis[randInt(0, emojis.length - 1)];
      document.getElementById('count-hint').textContent = '数一数有多少个' + emoji;
      var container = document.getElementById('count-objects');
      container.innerHTML = '';
      for (var i = 0; i < n; i++) {
        var div = document.createElement('div');
        div.className = 'count-obj';
        div.textContent = emoji;
        div.style.animationDelay = (i * 0.03) + 's';
        container.appendChild(div);
      }
      document.getElementById('count-answer').value = '';
      document.getElementById('count-feedback').textContent = '';
      document.getElementById('count-feedback').style.color = '';
      document.getElementById('count-check').style.display = '';
      document.getElementById('count-next').style.display = 'none';
      document.getElementById('count-answer').focus();
    }

    document.getElementById('count-check').addEventListener('click', function() {
      var val = parseInt(document.getElementById('count-answer').value);
      if (isNaN(val)) {
        document.getElementById('count-feedback').textContent = '请输入一个数字哦！';
        document.getElementById('count-feedback').style.color = '#FF9500';
        return;
      }
      var fb = document.getElementById('count-feedback');
      if (val === countState.answer) {
        fb.textContent = '🎉 答对啦！真棒！';
        fb.style.color = '#34C759';
        countState.correct++;
        document.getElementById('count-correct').textContent = countState.correct;
        document.getElementById('count-check').style.display = 'none';
        document.getElementById('count-next').style.display = '';
        setTimeout(function() { newCountProblem(); }, 1500);
      } else {
        fb.textContent = '❌ 再数一数吧～';
        fb.style.color = '#FF3B30';
        countState.wrong++;
        document.getElementById('count-wrong').textContent = countState.wrong;
      }
    });

    document.getElementById('count-answer').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('count-check').click();
    });

    document.getElementById('count-next').addEventListener('click', function() { newCountProblem(); });

    // ========== 模式2: 数的组成 ==========
    var composeState = { tens: 0, ones: 0, correct: 0, wrong: 0 };

    function newComposeProblem() {
      var tens = randInt(1, 9);
      var ones = randInt(0, 9);
      if (tens === 0 && ones === 0) ones = randInt(1, 9);
      composeState.tens = tens;
      composeState.ones = ones;
      document.getElementById('compose-number').textContent = tens * 10 + ones;
      document.getElementById('compose-tens').value = '';
      document.getElementById('compose-ones').value = '';
      document.getElementById('compose-feedback').textContent = '';
      document.getElementById('compose-feedback').style.color = '';
      document.getElementById('compose-check').style.display = '';
      document.getElementById('compose-next').style.display = 'none';
      document.getElementById('compose-tens').focus();
    }

    document.getElementById('compose-check').addEventListener('click', function() {
      var t = parseInt(document.getElementById('compose-tens').value);
      var o = parseInt(document.getElementById('compose-ones').value);
      if (isNaN(t) || isNaN(o)) {
        document.getElementById('compose-feedback').textContent = '两个空都要填哦！';
        document.getElementById('compose-feedback').style.color = '#FF9500';
        return;
      }
      var fb = document.getElementById('compose-feedback');
      if (t === composeState.tens && o === composeState.ones) {
        fb.textContent = '🎉 完全正确！';
        fb.style.color = '#34C759';
        composeState.correct++;
        document.getElementById('compose-correct').textContent = composeState.correct;
        document.getElementById('compose-check').style.display = 'none';
        document.getElementById('compose-next').style.display = '';
        setTimeout(function() { newComposeProblem(); }, 1500);
      } else {
        fb.textContent = '❌ 再想想～';
        fb.style.color = '#FF3B30';
        composeState.wrong++;
        document.getElementById('compose-wrong').textContent = composeState.wrong;
      }
    });

    document.getElementById('compose-tens').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('compose-ones').focus();
    });
    document.getElementById('compose-ones').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('compose-check').click();
    });
    document.getElementById('compose-next').addEventListener('click', function() { newComposeProblem(); });

    // ========== 模式3: 比大小 ==========
    var compareState = { answer: '', correct: 0, wrong: 0 };

    function newCompareProblem() {
      var a = randInt(1, 100);
      var b = randInt(1, 100);
      // 偶尔让两个数相等
      if (Math.random() < 0.15) b = a;
      document.getElementById('compare-left').textContent = a;
      document.getElementById('compare-right').textContent = b;
      document.getElementById('compare-symbol').textContent = '?';
      document.getElementById('compare-symbol').style.color = '#BDBDBD';
      if (a > b) compareState.answer = '>';
      else if (a < b) compareState.answer = '<';
      else compareState.answer = '=';
      document.getElementById('compare-feedback').textContent = '';
      document.getElementById('compare-feedback').style.color = '';
      document.getElementById('compare-next').style.display = 'none';
      document.querySelectorAll('.compare-opt').forEach(function(btn) {
        btn.classList.remove('correct', 'wrong');
        btn.disabled = false;
      });
    }

    document.querySelectorAll('.compare-opt').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var sym = btn.getAttribute('data-symbol');
        var fb = document.getElementById('compare-feedback');
        document.getElementById('compare-symbol').textContent = sym;
        document.getElementById('compare-symbol').style.color = '#1D1D1F';
        if (sym === compareState.answer) {
          btn.classList.add('correct');
          fb.textContent = '🎉 答对啦！';
          fb.style.color = '#34C759';
          compareState.correct++;
          document.getElementById('compare-correct').textContent = compareState.correct;
          document.querySelectorAll('.compare-opt').forEach(function(b) { b.disabled = true; });
          document.getElementById('compare-next').style.display = '';
          setTimeout(function() { newCompareProblem(); }, 1500);
        } else {
          btn.classList.add('wrong');
          fb.textContent = '❌ 再想想～';
          fb.style.color = '#FF3B30';
          compareState.wrong++;
          document.getElementById('compare-wrong').textContent = compareState.wrong;
          setTimeout(function() {
            btn.classList.remove('wrong');
            fb.textContent = '';
          }, 800);
        }
      });
    });

    document.getElementById('compare-next').addEventListener('click', function() { newCompareProblem(); });

    // ========== 模式4: 数序填空 ==========
    var seqState = { answer: 0, correct: 0, wrong: 0 };

    function newSequenceProblem() {
      // 生成数列类型
      var types = ['add1', 'add2', 'add5', 'add10', 'sub1', 'sub2', 'sub5'];
      var type = types[randInt(0, types.length - 1)];
      var start, step, seq = [], blankIdx;

      switch(type) {
        case 'add1': step = 1; start = randInt(1, 80); break;
        case 'add2': step = 2; start = randInt(1, 70); break;
        case 'add5': step = 5; start = randInt(1, 60); break;
        case 'add10': step = 10; start = randInt(1, 50); break;
        case 'sub1': step = -1; start = randInt(20, 100); break;
        case 'sub2': step = -2; start = randInt(20, 100); break;
        case 'sub5': step = -5; start = randInt(30, 100); break;
      }

      for (var i = 0; i < 5; i++) {
        seq.push(start + step * i);
      }
      blankIdx = randInt(1, 3); // 空在中间位置
      seqState.answer = seq[blankIdx];

      var row = document.getElementById('sequence-row');
      row.innerHTML = '';
      for (var i = 0; i < seq.length; i++) {
        var div = document.createElement('div');
        if (i === blankIdx) {
          div.className = 'seq-blank';
          div.textContent = '?';
          div.id = 'seq-blank-el';
        } else {
          div.className = 'seq-num';
          div.textContent = seq[i];
        }
        row.appendChild(div);
      }

      // 生成选项（1个正确 + 3个干扰）
      var options = [seqState.answer];
      var distractors = new Set();
      distractors.add(seqState.answer);
      while (options.length < 4) {
        var d = seqState.answer + randInt(-3, 3) * Math.abs(step || 1);
        if (d !== seqState.answer && d > 0 && d <= 100 && !distractors.has(d)) {
          options.push(d);
          distractors.add(d);
        }
      }
      shuffle(options);

      var optContainer = document.getElementById('seq-options');
      optContainer.innerHTML = '';
      options.forEach(function(opt) {
        var btn = document.createElement('button');
        btn.className = 'seq-opt';
        btn.textContent = opt;
        btn.setAttribute('data-val', opt);
        btn.addEventListener('click', function() { handleSeqClick(btn, opt); });
        optContainer.appendChild(btn);
      });

      document.getElementById('seq-feedback').textContent = '';
      document.getElementById('seq-feedback').style.color = '';
      document.getElementById('seq-next').style.display = 'none';
    }

    function handleSeqClick(btn, val) {
      var fb = document.getElementById('seq-feedback');
      if (val === seqState.answer) {
        btn.classList.add('correct');
        fb.textContent = '🎉 答对啦！';
        fb.style.color = '#34C759';
        document.getElementById('seq-blank-el').textContent = val;
        seqState.correct++;
        document.getElementById('seq-correct').textContent = seqState.correct;
        document.querySelectorAll('.seq-opt').forEach(function(b) { b.disabled = true; });
        document.getElementById('seq-next').style.display = '';
        setTimeout(function() { newSequenceProblem(); }, 1500);
      } else {
        btn.classList.add('wrong');
        fb.textContent = '❌ 再看看规律～';
        fb.style.color = '#FF3B30';
        seqState.wrong++;
        document.getElementById('seq-wrong').textContent = seqState.wrong;
        setTimeout(function() {
          btn.classList.remove('wrong');
          fb.textContent = '';
        }, 800);
      }
    }

    document.getElementById('seq-next').addEventListener('click', function() { newSequenceProblem(); });

    // ========== 初始化 ==========
    newCountProblem();
    newComposeProblem();
    newCompareProblem();
    newSequenceProblem();
  })();
  </script>
</body>
</html>
