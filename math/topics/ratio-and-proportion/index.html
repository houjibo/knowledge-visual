<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>比和比例</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    .diff-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .diff-easy { background: rgba(52,199,89,0.15); color: #34C759; }
    .diff-medium { background: rgba(255,149,0,0.15); color: #FF9500; }
    .diff-hard { background: rgba(255,59,48,0.15); color: #FF3B30; }

    /* === 模式1: 认识比 === */
    .ratio-area { text-align: center; padding: 24px 16px; }
    .ratio-visual { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 24px 0; flex-wrap: wrap; }
    .ratio-group { padding: 16px; background: rgba(74,144,217,0.08); border-radius: 16px; min-width: 120px; }
    .ratio-group .label { font-size: 14px; color: #6E6E73; margin-bottom: 8px; }
    .ratio-blocks { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .ratio-block { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
    .ratio-block.a { background: #4A90D9; color: white; }
    .ratio-block.b { background: #FF9500; color: white; }
    .ratio-sign { font-size: 48px; font-weight: 800; color: #34C759; }
    .ratio-formula { font-size: 24px; font-weight: 700; margin: 16px 0; color: #4A90D9; }
    .ratio-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; }
    .ratio-frac .num { border-bottom: 2px solid #4A90D9; padding: 0 8px 2px; }
    .ratio-frac .den { padding: 2px 8px 0; }

    /* === 模式2: 正比例 === */
    .prop-area { text-align: center; padding: 24px 16px; }
    .prop-table { margin: 16px auto; max-width: 360px; }
    .prop-row { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #E5E5EA; }
    .prop-row:last-child { border-bottom: none; }
    .prop-row.header { font-weight: 700; color: #4A90D9; background: rgba(74,144,217,0.08); border-radius: 12px 12px 0 0; }
    .prop-cell { flex: 1; text-align: center; font-size: 18px; font-weight: 600; }
    .prop-canvas { margin: 16px auto; background: white; border-radius: 16px; }
    .prop-slider-wrap { display: flex; align-items: center; gap: 16px; justify-content: center; margin: 24px 0; }
    .prop-slider { width: 200px; accent-color: #4A90D9; }
    .prop-result { font-size: 20px; font-weight: 700; color: #34C759; margin: 16px 0; }
    .prop-formula { font-size: 18px; color: #6E6E73; margin: 8px 0; }

    /* === 模式3: 反比例 === */
    .inv-area { text-align: center; padding: 24px 16px; }
    .inv-rect { margin: 16px auto; position: relative; }
    .inv-rect canvas { border-radius: 16px; background: white; }
    .inv-rect-label { font-size: 16px; color: #6E6E73; margin: 8px 0; }
    .inv-result { font-size: 20px; font-weight: 700; color: #FF9500; margin: 16px 0; }

    /* === 模式4: 比例尺 === */
    .scale-area { text-align: center; padding: 24px 16px; }
    .scale-map { margin: 16px auto; position: relative; background: #F0F4FF; border-radius: 16px; overflow: hidden; }
    .scale-map canvas { display: block; }
    .scale-bar { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
    .scale-line { height: 4px; background: #FF3B30; border-radius: 2px; }
    .scale-label { font-size: 16px; font-weight: 600; color: #333; }
    .scale-quiz { font-size: 22px; font-weight: 700; color: #4A90D9; margin: 24px 0; }
    .scale-input { width: 80px; padding: 12px; border: 3px solid #E5E5EA; border-radius: 12px; font-size: 20px; text-align: center; font-weight: 600; }
    .scale-input:focus { outline: none; border-color: #4A90D9; }

    /* === 模式5: 挑战 === */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-problem { font-size: 26px; font-weight: 700; color: #4A90D9; margin: 24px 0; line-height: 1.5; }
    .challenge-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 400px; margin: 24px auto; padding: 0 16px; }
    .challenge-opt { padding: 20px; border: 3px solid #E5E5EA; background: white; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .hint-box { background: rgba(74,144,217,0.08); border-radius: 12px; padding: 12px 16px; margin: 12px 16px; font-size: 15px; color: #6E6E73; text-align: left; }
    .hint-box strong { color: #4A90D9; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">📊 比和比例</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display">
      <span class="diff-badge diff-easy" id="diff-badge">认识比</span>
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="ratio">📏 认识比</button>
      <button class="mode-tab" data-mode="direct">📈 正比例</button>
      <button class="mode-tab" data-mode="inverse">📉 反比例</button>
      <button class="mode-tab" data-mode="scale">🗺️ 比例尺</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 认识比 -->
    <div class="mode-content active" id="mode-ratio">
      <div class="card">
        <p class="page-subtitle">两个数相除，又叫做两个数的比</p>
        <div class="ratio-area">
          <div class="ratio-visual" id="ratio-visual"></div>
          <div class="ratio-formula" id="ratio-formula"></div>
          <div class="hint-box" id="ratio-hint"></div>
          <div class="action-bar"><button class="btn btn-primary btn-large" id="btn-new-ratio">🎲 换一个</button></div>
        </div>
      </div>
    </div>

    <!-- 模式2: 正比例 -->
    <div class="mode-content" id="mode-direct">
      <div class="card">
        <p class="page-subtitle">两种相关联的量，比值一定时成正比例</p>
        <div class="prop-area">
          <div class="prop-slider-wrap">
            <span>数量：</span>
            <input type="range" class="prop-slider" id="prop-slider" min="1" max="10" value="1" step="1">
            <span id="prop-slider-val" style="font-size:24px;font-weight:700;color:#4A90D9;min-width:32px">1</span>
          </div>
          <div class="prop-result" id="prop-result"></div>
          <canvas class="prop-canvas" id="prop-canvas" width="320" height="260"></canvas>
          <div class="prop-table" id="prop-table"></div>
          <div class="prop-formula" id="prop-formula"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 反比例 -->
    <div class="mode-content" id="mode-inverse">
      <div class="card">
        <p class="page-subtitle">两种相关联的量，乘积一定时成反比例</p>
        <div class="inv-area">
          <div class="prop-slider-wrap">
            <span>长：</span>
            <input type="range" class="prop-slider" id="inv-slider" min="2" max="12" value="4" step="1">
            <span id="inv-slider-val" style="font-size:24px;font-weight:700;color:#FF9500;min-width:32px">4</span>
          </div>
          <div class="inv-result" id="inv-result"></div>
          <div class="inv-rect">
            <canvas id="inv-canvas" width="320" height="240"></canvas>
          </div>
          <div class="prop-table" id="inv-table"></div>
          <div class="prop-formula" id="inv-formula"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 比例尺 -->
    <div class="mode-content" id="mode-scale">
      <div class="card">
        <p class="page-subtitle">图上距离与实际距离的比</p>
        <div class="scale-area">
          <div class="scale-map">
            <canvas id="scale-canvas" width="320" height="200"></canvas>
          </div>
          <div class="scale-bar">
            <div class="scale-line" style="width:60px"></div>
            <span class="scale-label" id="scale-label">1cm = 100m</span>
          </div>
          <div class="scale-quiz" id="scale-quiz"></div>
          <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0">
            <span style="font-size:18px;color:#6E6E73">答案：</span>
            <input type="number" class="scale-input" id="scale-input" placeholder="?">
            <span style="font-size:18px;color:#6E6E73" id="scale-unit">m</span>
            <button class="btn btn-primary" id="btn-check-scale" style="margin-left:8px">✅</button>
          </div>
          <div id="scale-feedback" style="font-size:18px;font-weight:700;min-height:28px"></div>
          <div class="action-bar"><button class="btn btn-primary btn-large" id="btn-new-scale">🎲 换一题</button></div>
        </div>
      </div>
    </div>

    <!-- 模式5: 挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-problem" id="challenge-problem"></div>
          <div class="challenge-options" id="challenge-options"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！比例小天才！`);
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const mode = tab.dataset.mode;
        document.getElementById('mode-' + mode).classList.add('active');
        Sound.play('click');
        const badges = { ratio: '认识比', direct: '正比例', inverse: '反比例', scale: '比例尺', challenge: '挑战' };
        document.getElementById('diff-badge').textContent = badges[mode] || mode;
      });
    });

    const fruits = ['🍎','🍊','🍋','🍇','🍓','🌟','🎈','🐱','🐶','🦋'];
    const colors = ['#4A90D9','#FF9500','#34C759','#FF3B30','#AF52DE'];

    // === GCD 工具 ===
    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function simplifyRatio(a, b) {
      const g = gcd(a, b);
      return { a: a / g, b: b / g };
    }

    // === 模式1: 认识比 ===
    (() => {
      const scenarios = [
        { label: '苹果和橙子', iconA: '🍎', iconB: '🍊', min: 1, max: 9 },
        { label: '红球和蓝球', iconA: '🔴', iconB: '🔵', min: 1, max: 9 },
        { label: '星星和月亮', iconA: '⭐', iconB: '🌙', min: 1, max: 8 },
        { label: '小猫和小狗', iconA: '🐱', iconB: '🐶', min: 1, max: 7 },
      ];
      function newRatio() {
        const sc = Random.pick(scenarios);
        let a, b;
        do { a = Random.int(sc.min, sc.max); b = Random.int(sc.min, sc.max); } while (a === b);
        const s = simplifyRatio(a, b);
        const ratioStr = `${s.a}:${s.b}`;
        const fracStr = `${s.a}/${s.b}`;

        // 方块可视化（简化后最多显示 8 个）
        let blocksA = '', blocksB = '';
        for (let i = 0; i < s.a; i++) blocksA += `<div class="ratio-block a">${sc.iconA}</div>`;
        for (let i = 0; i < s.b; i++) blocksB += `<div class="ratio-block b">${sc.iconB}</div>`;

        document.getElementById('ratio-visual').innerHTML = `
          <div class="ratio-group">
            <div class="label">${sc.label} A</div>
            <div class="ratio-blocks">${blocksA}</div>
            <div style="margin-top:8px;font-size:20px;font-weight:700;color:#4A90D9">${a} 个</div>
          </div>
          <span class="ratio-sign">:</span>
          <div class="ratio-group">
            <div class="label">${sc.label} B</div>
            <div class="ratio-blocks">${blocksB}</div>
            <div style="margin-top:8px;font-size:20px;font-weight:700;color:#FF9500">${b} 个</div>
          </div>
        `;

        document.getElementById('ratio-formula').innerHTML = `
          ${a} : ${b} = ${s.a} : ${s.b}<br>
          <span style="font-size:18px;color:#6E6E73">写成分数形式：<span class="ratio-frac"><span class="num">${s.a}</span><span class="den">${s.b}</span></span></span>
        `;

        const div = a / b;
        document.getElementById('ratio-hint').innerHTML = `
          <strong>💡 理解：</strong> ${sc.label} A 是 B 的 <span style="color:#4A90D9;font-weight:700">${div.toFixed(2)}</span> 倍<br>
          <strong>📌 化简：</strong> ${a} 和 ${b} 同时除以 ${gcd(a,b)}，得到最简比 <span style="color:#4A90D9;font-weight:700">${s.a}:${s.b}</span>
        `;

        document.querySelectorAll('.ratio-block').forEach((b, i) => Animator.popIn(b, i * 60));
        Sound.play('click');
      }
      document.getElementById('btn-new-ratio').addEventListener('click', newRatio);
      newRatio();
    })();

    // === 模式2: 正比例 ===
    (() => {
      const unitPrices = [
        { item: '🍎 苹果', price: 5 },
        { item: '📓 笔记本', price: 3 },
        { item: '🖊️ 钢笔', price: 8 },
        { item: '🧃 果汁', price: 4 },
      ];
      let sc = Random.pick(unitPrices);
      const slider = document.getElementById('prop-slider');
      const canvas = document.getElementById('prop-canvas');
      const ctx = canvas.getContext('2d');

      function drawChart() {
        const w = canvas.width, h = canvas.height;
        const pad = { t: 20, r: 20, b: 40, l: 50 };
        const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
        ctx.clearRect(0, 0, w, h);

        // 坐标轴
        ctx.strokeStyle = '#E5E5EA'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h - pad.b); ctx.lineTo(w - pad.r, h - pad.b); ctx.stroke();

        // 标签
        ctx.fillStyle = '#6E6E73'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('数量', w / 2, h - 5);
        ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('总价', 0, 0); ctx.restore();

        const maxQ = 10, maxP = sc.price * 10;

        // 比例线
        ctx.strokeStyle = '#4A90D9'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let q = 0; q <= maxQ; q++) {
          const x = pad.l + (q / maxQ) * cw;
          const y = h - pad.b - (q * sc.price / maxP) * ch;
          q === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 数据点
        for (let q = 1; q <= maxQ; q++) {
          const x = pad.l + (q / maxQ) * cw;
          const y = h - pad.b - (q * sc.price / maxP) * ch;
          ctx.fillStyle = q <= parseInt(slider.value) ? '#4A90D9' : '#E5E5EA';
          ctx.beginPath(); ctx.arc(x, y, q <= parseInt(slider.value) ? 6 : 4, 0, Math.PI * 2); ctx.fill();
        }

        // X轴刻度
        ctx.fillStyle = '#6E6E73'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        for (let q = 0; q <= maxQ; q += 2) {
          const x = pad.l + (q / maxQ) * cw;
          ctx.fillText(q, x, h - pad.b + 16);
        }
      }

      function updateProp() {
        const q = parseInt(slider.value);
        document.getElementById('prop-slider-val').textContent = q;
        const total = q * sc.price;
        document.getElementById('prop-result').textContent = `${sc.item} × ${q} = ${total} 元`;

        // 表格
        let rows = `<div class="prop-row header"><span class="prop-cell">数量</span><span class="prop-cell">总价（元）</span><span class="prop-cell">比值</span></div>`;
        for (let i = 1; i <= Math.min(q, 6); i++) {
          const r = i === q ? 'style="background:rgba(74,144,217,0.12)"' : '';
          rows += `<div class="prop-row" ${r}><span class="prop-cell">${i}</span><span class="prop-cell">${i * sc.price}</span><span class="prop-cell">${sc.price}</span></div>`;
        }
        if (q > 6) rows += `<div class="prop-row"><span class="prop-cell">...</span><span class="prop-cell">...</span><span class="prop-cell">...</span></div>`;
        document.getElementById('prop-table').innerHTML = rows;

        document.getElementById('prop-formula').innerHTML = `
          <strong>正比例关系：</strong>总价 ÷ 数量 = 单价 = <span style="color:#4A90D9;font-weight:700">${sc.price} 元</span>（一定）<br>
          <span style="font-size:15px">比值相同 → 成正比例</span>
        `;

        drawChart();
      }

      slider.addEventListener('input', updateProp);
      updateProp();
    })();

    // === 模式3: 反比例 ===
    (() => {
      const area = 24; // 固定面积
      const slider = document.getElementById('inv-slider');
      const canvas = document.getElementById('inv-canvas');
      const ctx = canvas.getContext('2d');

      function drawRect(w, h) {
        const cw = canvas.width, ch = canvas.height;
        const pad = 30;
        const maxDim = 12;
        const px = Math.min((cw - pad * 2) / maxDim, (ch - pad * 2) / maxDim);

        ctx.clearRect(0, 0, cw, ch);

        // 矩形
        const rx = pad + (maxDim - w) * px / 2;
        const ry = pad + (maxDim - h) * px / 2;
        const rw = w * px, rh = h * px;

        ctx.fillStyle = 'rgba(255,149,0,0.15)';
        ctx.fillRect(rx, ry, rw, rh);
        ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 3;
        ctx.strokeRect(rx, ry, rw, rh);

        // 网格线
        ctx.strokeStyle = 'rgba(255,149,0,0.2)'; ctx.lineWidth = 1;
        for (let i = 1; i < w; i++) {
          ctx.beginPath(); ctx.moveTo(rx + i * px, ry); ctx.lineTo(rx + i * px, ry + rh); ctx.stroke();
        }
        for (let i = 1; i < h; i++) {
          ctx.beginPath(); ctx.moveTo(rx, ry + i * px); ctx.lineTo(rx + rw, ry + i * px); ctx.stroke();
        }

        // 标注
        ctx.fillStyle = '#FF9500'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`${w}`, rx + rw / 2, ry - 8);
        ctx.save(); ctx.translate(rx - 14, ry + rh / 2); ctx.rotate(-Math.PI / 2);
        ctx.fillText(`${h}`, 0, 0); ctx.restore();

        // 面积标注
        ctx.fillStyle = '#6E6E73'; ctx.font = '14px sans-serif';
        ctx.fillText(`面积 = ${w} × ${h} = ${w * h}`, cw / 2, ch - 10);
      }

      function updateInv() {
        const w = parseInt(slider.value);
        const h = Math.round(area / w * 10) / 10;
        const hInt = Math.round(area / w);

        document.getElementById('inv-slider-val').textContent = w;
        document.getElementById('inv-result').textContent = `长 ${w} × 宽 ${hInt} = 面积 ${area}`;

        drawRect(w, hInt);

        // 表格
        const pairs = [[1,24],[2,12],[3,8],[4,6],[6,4],[8,3],[12,2],[24,1]];
        let rows = `<div class="prop-row header"><span class="prop-cell">长</span><span class="prop-cell">宽</span><span class="prop-cell">乘积</span></div>`;
        pairs.forEach(([l, ww]) => {
          const active = l === w ? 'style="background:rgba(255,149,0,0.12)"' : '';
          rows += `<div class="prop-row" ${active}><span class="prop-cell">${l}</span><span class="prop-cell">${ww}</span><span class="prop-cell">${area}</span></div>`;
        });
        document.getElementById('inv-table').innerHTML = rows;

        document.getElementById('inv-formula').innerHTML = `
          <strong>反比例关系：</strong>长 × 宽 = 面积 = <span style="color:#FF9500;font-weight:700">${area}</span>（一定）<br>
          <span style="font-size:15px">乘积相同 → 成反比例</span>
        `;
      }

      slider.addEventListener('input', updateInv);
      updateInv();
    })();

    // === 模式4: 比例尺 ===
    (() => {
      const scales = [
        { ratio: 100, label: '1cm = 100m', unit: 'm' },
        { ratio: 200, label: '1cm = 200m', unit: 'm' },
        { ratio: 500, label: '1cm = 500m', unit: 'm' },
        { ratio: 1000, label: '1cm = 1km', unit: 'km' },
        { ratio: 50000, label: '1:50000', unit: 'km' },
      ];
      let sc, mapCm, answer;
      const canvas = document.getElementById('scale-canvas');
      const ctx = canvas.getContext('2d');

      function drawMap() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        // 简单地图
        ctx.fillStyle = '#E8F5E9'; ctx.fillRect(0, 0, w, h);
        // 道路
        ctx.strokeStyle = '#9E9E9E'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(40, 100); ctx.lineTo(280, 100); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(160, 20); ctx.lineTo(160, 180); ctx.stroke();
        // 建筑
        ctx.fillStyle = '#FFCC80';
        ctx.fillRect(60, 30, 40, 30);
        ctx.fillRect(200, 130, 50, 30);
        ctx.fillStyle = '#CE93D8';
        ctx.fillRect(220, 30, 30, 40);
        ctx.fillStyle = '#81D4FA';
        ctx.fillRect(60, 140, 50, 30);
        // 标注
        ctx.fillStyle = '#333'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🏫 学校', 80, 70);
        ctx.fillText('🏪 超市', 225, 170);
        ctx.fillText('🏥 医院', 235, 80);
        ctx.fillText('🏠 公园', 85, 185);

        // 比例尺标注
        ctx.fillStyle = '#FF3B30'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('比例尺：' + sc.label, 10, h - 10);
      }

      function newScale() {
        sc = Random.pick(scales);
        if (sc.ratio <= 1000) {
          mapCm = Random.pick([2, 3, 4, 5, 6]);
          answer = mapCm * sc.ratio;
        } else {
          mapCm = Random.pick([2, 3, 4]);
          answer = mapCm * sc.ratio / 100000; // km
        }

        document.getElementById('scale-label').textContent = sc.label;
        document.getElementById('scale-unit').textContent = sc.unit;
        document.getElementById('scale-input').value = '';
        document.getElementById('scale-feedback').textContent = '';

        document.getElementById('scale-quiz').textContent =
          `图上距离 ${mapCm} cm，实际距离是多少 ${sc.unit}？`;

        drawMap();
      }

      function checkScale() {
        const val = parseFloat(document.getElementById('scale-input').value);
        const fb = document.getElementById('scale-feedback');
        if (isNaN(val)) { fb.textContent = '请输入数字'; fb.style.color = '#FF9500'; return; }
        if (val === answer) {
          fb.textContent = '✅ 正确！太棒了！'; fb.style.color = '#34C759';
          streak++; updateStreak(); Sound.play('correct'); celebrate();
          setTimeout(newScale, 1200);
        } else {
          fb.textContent = `❌ 不对哦，再想想`; fb.style.color = '#FF3B30';
          streak = 0; updateStreak(); Sound.play('wrong');
          Animator.shake(document.getElementById('scale-input'));
        }
      }

      document.getElementById('btn-check-scale').addEventListener('click', checkScale);
      document.getElementById('scale-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkScale(); });
      document.getElementById('btn-new-scale').addEventListener('click', newScale);
      newScale();
    })();

    // === 模式5: 挑战 ===
    (() => {
      function newChallenge() {
        const type = Random.int(1, 5);
        let question, answer, options, hint = '';
        const diff = ['diff-easy','diff-easy','diff-medium','diff-medium','diff-hard'];

        if (type === 1) {
          // 化简比
          const a = Random.int(2, 6) * Random.int(2, 4);
          const b = Random.int(2, 6) * Random.int(2, 4);
          const s = simplifyRatio(a, b);
          question = `化简比：${a} : ${b} = ?`;
          answer = `${s.a}:${s.b}`;
          options = [`${s.a}:${s.b}`, `${s.b}:${s.a}`, `${a}:${b}`, `${s.a * 2}:${s.b * 2}`];
          hint = `💡 找 ${a} 和 ${b} 的最大公约数 ${gcd(a, b)}，同时除即可`;
        } else if (type === 2) {
          // 正比例填空
          const unit = Random.int(2, 8);
          const q = Random.int(2, 6);
          question = `买 ${q} 个物品共花 ${unit * q} 元，买 ${q + 2} 个需要多少元？`;
          answer = unit * (q + 2);
          options = [unit * (q + 2), unit * (q + 1), unit * q + 2, unit * (q + 3)];
          hint = `💡 单价 = ${unit * q} ÷ ${q} = ${unit} 元，再乘以 ${q + 2}`;
        } else if (type === 3) {
          // 反比例填空
          const area = Random.pick([12, 16, 20, 24, 36]);
          const w = area / Random.pick(area === 12 ? [2,3] : area === 16 ? [2,4] : area === 20 ? [4,5] : area === 24 ? [3,4,6] : [4,6]);
          const l = area / w;
          question = `长方形面积 ${area} cm²，长 ${l} cm，宽是多少 cm？`;
          answer = w;
          options = [w, l, area / 2, area - l];
          hint = `💡 面积 = 长 × 宽，宽 = ${area} ÷ ${l}`;
        } else if (type === 4) {
          // 比例尺
          const ratio = Random.pick([100, 200, 500]);
          const mapCm = Random.pick([3, 4, 5]);
          const real = mapCm * ratio;
          question = `比例尺 1:${ratio}，图上 ${mapCm} cm，实际多少 m？`;
          answer = real;
          options = [real, real / 2, real * 2, real + ratio];
          hint = `💡 实际距离 = 图上距离 × 比例尺分母`;
        } else {
          // 解比例方程
          const a = Random.int(2, 5), b = Random.int(2, 5), c = Random.int(2, 5);
          const x = a * b;
          question = `解比例：${a} : ${c} = ${b} : x，x = ?`;
          answer = (c * b) / a;
          // 确保整数答案
          if (Number.isInteger(answer)) {
            options = [answer, answer + 1, answer - 1, answer + 2];
            hint = `💡 交叉相乘：${a} × x = ${c} × ${b}，x = ${c * b} ÷ ${a}`;
          } else {
            // 重新生成
            const a2 = Random.pick([1, 2, 3, 4, 5]);
            const x2 = Random.int(2, 10);
            const c2 = a2 * Random.int(1, 5);
            const b2 = x2 * a2 / c2 * c2 / a2; // trick to get integer
            const num = c2 * Random.int(1, 5);
            if (num % a2 === 0) {
              question = `解比例：${a2} : ${c2} = ${num / a2} : x，x = ?`;
              answer = (c2 * (num / a2)) / a2;
              options = [answer, answer + 2, answer - 1, answer + 3];
              hint = `💡 交叉相乘求解`;
            } else {
              question = `3 : 6 = 4 : x，x = ?`;
              answer = 8;
              options = [8, 6, 12, 4];
              hint = `💡 3 × x = 6 × 4 = 24，x = 24 ÷ 3 = 8`;
            }
          }
        }

        options = [...new Set(options.map(x => typeof x === 'number' && !Number.isInteger(x) ? parseFloat(x.toFixed(2)) : x))];
        while (options.length < 4) {
          const fake = typeof answer === 'number' ? answer + Random.int(-5, 5) : `${Random.int(1, 9)}:${Random.int(1, 9)}`;
          if (!options.includes(fake)) options.push(fake);
        }
        options = Random.shuffle(options).slice(0, 4);
        if (!options.includes(answer)) options[0] = answer;

        document.getElementById('challenge-problem').innerHTML = `
          <div style="font-size:14px;color:#6E6E73;margin-bottom:8px">${hint}</div>
          ${question}
        `;
        const container = document.getElementById('challenge-options');
        container.innerHTML = '';
        Random.shuffle(options).forEach(val => {
          const btn = document.createElement('div');
          btn.className = 'challenge-opt'; btn.textContent = val;
          btn.addEventListener('click', () => {
            if (val === answer) {
              btn.classList.add('correct'); streak++;
              Sound.play('correct'); celebrate(); updateStreak();
              setTimeout(newChallenge, 800);
            } else {
              btn.classList.add('wrong'); Animator.shake(btn);
              streak = 0; Sound.play('wrong'); updateStreak();
              showToast(`答案是 ${answer}`);
              setTimeout(newChallenge, 1500);
            }
          });
          container.appendChild(btn);
        });
      }
      newChallenge();
    })();
  </script>
