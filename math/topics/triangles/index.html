<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>三角形的认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .nav-bar {
      display: flex; align-items: center; padding: 12px 16px; gap: 12px;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #4A90D9; text-decoration: none; font-weight: 600; font-size: 15px;
    }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #7B1FA2; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .section-title { font-size: 22px; font-weight: 700; color: #1D1D1F; text-align: center; margin: 12px 0 8px; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }
    .result-text.correct-fb { color: #34C759; }
    .result-text.wrong-fb { color: #FF3B30; }

    /* === 模式1: 认识三角形 === */
    .learn-area { text-align: center; padding: 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 12px auto; max-width: 400px;
      border-left: 5px solid #7B1FA2;
    }
    .learn-card .card-icon { font-size: 48px; margin-bottom: 12px; }
    .learn-card .card-title { font-size: 20px; font-weight: 700; color: #7B1FA2; margin-bottom: 8px; }
    .learn-card .card-body { font-size: 16px; color: #1D1D1F; line-height: 1.8; text-align: left; }
    .learn-card .card-body strong { color: #7B1FA2; }
    .tri-svg { display: block; margin: 16px auto; }
    .learn-nav { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.prev { background: #E5E5EA; color: #6E6E73; }
    .learn-btn.next { background: #7B1FA2; color: white; }
    .learn-dots { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
    .learn-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #E5E5EA;
      transition: all 0.2s ease;
    }
    .learn-dot.active { background: #7B1FA2; transform: scale(1.3); }

    /* === 模式2: 分类大师 === */
    .classify-area { text-align: center; padding: 16px; }
    .classify-question { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 12px 0; line-height: 1.6; }
    .classify-tri { display: flex; justify-content: center; margin: 16px 0; }
    .classify-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0; }
    .classify-btn {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 120px;
    }
    .classify-btn:active { transform: scale(0.95); }
    .classify-btn.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .classify-btn.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; animation: shake 0.4s ease; }

    /* === 模式3: 角度计算 === */
    .calc-area { text-align: center; padding: 16px; }
    .calc-problem {
      background: white; border-radius: 20px; padding: 20px; margin: 12px auto; max-width: 380px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .calc-tri-svg { display: block; margin: 8px auto; }
    .calc-text { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 12px 0; line-height: 1.6; }
    .calc-text .blank { color: #7B1FA2; font-size: 22px; font-weight: 800; }
    .calc-input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 16px 0; }
    .calc-input {
      width: 100px; height: 56px; border: 3px solid #9CA3AF; border-radius: 14px;
      font-size: 28px; font-weight: 700; text-align: center; color: #7B1FA2;
      outline: none; transition: border-color 0.2s ease;
    }
    .calc-input:focus { border-color: #7B1FA2; }
    .calc-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .calc-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .calc-unit { font-size: 22px; font-weight: 700; color: #6E6E73; }
    .calc-submit {
      padding: 14px 36px; border: none; background: #7B1FA2; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(123,31,162,0.3); margin: 8px;
    }
    .calc-submit:active { transform: scale(0.95); }

    /* === 模式4: 三边关系 === */
    .sides-area { text-align: center; padding: 16px; }
    .sides-question { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 12px 0; line-height: 1.6; }
    .sides-visual { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .sides-bar {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .sides-bar-rect {
      border-radius: 8px; transition: all 0.3s ease;
    }
    .sides-bar-label { font-size: 16px; font-weight: 700; color: #7B1FA2; }
    .sides-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0; }
    .sides-btn {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 80px;
    }
    .sides-btn:active { transform: scale(0.95); }
    .sides-btn.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .sides-btn.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; animation: shake 0.4s ease; }

    /* === 通用 === */
    .highlight-num { color: #7B1FA2; font-weight: 800; }
    .feedback { font-size: 18px; font-weight: 700; text-align: center; margin: 12px 0; min-height: 28px; }
    .feedback.correct-fb { color: #34C759; }
    .feedback.wrong-fb { color: #FF3B30; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回知识地图</a>
    </div>

    <div class="section-title">🔺 三角形的认识</div>
    <div class="section-desc">四年级 · 认识三角形特征、分类、角度计算、三边关系</div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 认识</button>
      <button class="mode-tab" data-mode="classify">🏷️ 分类大师</button>
      <button class="mode-tab" data-mode="calc">🔢 角度计算</button>
      <button class="mode-tab" data-mode="sides">📏 三边关系</button>
    </div>

    <!-- ===== 模式1: 认识三角形 ===== -->
    <div id="mode-learn" class="mode-content active">
      <div class="learn-area">
        <div id="learn-content"></div>
        <div class="learn-dots" id="learn-dots"></div>
        <div class="learn-nav">
          <button class="learn-btn prev" id="learn-prev">← 上一页</button>
          <button class="learn-btn next" id="learn-next">下一页 →</button>
        </div>
      </div>
    </div>

    <!-- ===== 模式2: 分类大师 ===== -->
    <div id="mode-classify" class="mode-content">
      <div class="classify-area">
        <div class="score-bar">
          <span>✅ <span id="cls-correct">0</span></span>
          <span>❌ <span id="cls-wrong">0</span></span>
        </div>
        <div class="classify-question" id="cls-question"></div>
        <div class="classify-tri" id="cls-tri"></div>
        <div class="classify-options" id="cls-options"></div>
        <div class="feedback" id="cls-feedback"></div>
      </div>
    </div>

    <!-- ===== 模式3: 角度计算 ===== -->
    <div id="mode-calc" class="mode-content">
      <div class="calc-area">
        <div class="score-bar">
          <span>✅ <span id="calc-correct">0</span></span>
          <span>❌ <span id="calc-wrong">0</span></span>
        </div>
        <div class="calc-problem" id="calc-problem"></div>
        <div class="calc-input-row">
          <input type="number" class="calc-input" id="calc-answer" placeholder="?" inputmode="numeric">
          <span class="calc-unit">°</span>
        </div>
        <button class="calc-submit" id="calc-submit">确定</button>
        <div class="feedback" id="calc-feedback"></div>
      </div>
    </div>

    <!-- ===== 模式4: 三边关系 ===== -->
    <div id="mode-sides" class="mode-content">
      <div class="sides-area">
        <div class="score-bar">
          <span>✅ <span id="sides-correct">0</span></span>
          <span>❌ <span id="sides-wrong">0</span></span>
        </div>
        <div class="sides-question" id="sides-question"></div>
        <div class="sides-visual" id="sides-visual"></div>
        <div class="sides-options" id="sides-options"></div>
        <div class="feedback" id="sides-feedback"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // ========== 工具函数 ==========
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

    // ========== Tab 切换 ==========
    const tabs = document.querySelectorAll('.mode-tab');
    const modeMap = { learn: 'mode-learn', classify: 'mode-classify', calc: 'mode-calc', sides: 'mode-sides' };
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(modeMap).forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById(modeMap[tab.dataset.mode]).classList.add('active');
      });
    });

    // ========== 绘制三角形 SVG ==========
    function drawTriangle(svgEl, type, labelAngles, labelSides) {
      const w = 200, h = 160;
      svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svgEl.setAttribute('width', w);
      svgEl.setAttribute('height', h);
      svgEl.innerHTML = '';

      let pts;
      if (type === 'acute') {
        pts = [[100, 15], [30, 140], [170, 140]];
      } else if (type === 'right') {
        pts = [[30, 15], [30, 140], [170, 140]];
      } else if (type === 'obtuse') {
        pts = [[160, 15], [30, 140], [170, 140]];
      } else if (type === 'equilateral') {
        pts = [[100, 15], [30, 137], [170, 137]];
      } else if (type === 'isosceles') {
        pts = [[100, 15], [45, 140], [155, 140]];
      } else if (type === 'scalene') {
        pts = [[60, 20], [25, 140], [175, 140]];
      } else {
        pts = [[100, 15], [30, 140], [170, 140]];
      }

      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
      poly.setAttribute('fill', 'rgba(123,31,162,0.1)');
      poly.setAttribute('stroke', '#7B1FA2');
      poly.setAttribute('stroke-width', '3');
      poly.setAttribute('stroke-linejoin', 'round');
      svgEl.appendChild(poly);

      // 顶点标记
      const labels = ['A', 'B', 'C'];
      const offsets = [[0, -8], [-12, 14], [12, 14]];
      pts.forEach((p, i) => {
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', p[0] + offsets[i][0]);
        txt.setAttribute('y', p[1] + offsets[i][1]);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '14');
        txt.setAttribute('font-weight', '700');
        txt.setAttribute('fill', '#7B1FA2');
        txt.textContent = labels[i];
        svgEl.appendChild(txt);
      });

      // 角度标注
      if (labelAngles) {
        const angleData = labelAngles;
        const angleOffsets = [[0, 28], [-24, -4], [24, -4]];
        pts.forEach((p, i) => {
          if (angleData[i] !== undefined) {
            const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            txt.setAttribute('x', p[0] + angleOffsets[i][0]);
            txt.setAttribute('y', p[1] + angleOffsets[i][1]);
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('font-size', '13');
            txt.setAttribute('font-weight', '700');
            txt.setAttribute('fill', '#FF9500');
            txt.textContent = angleData[i] + '°';
            svgEl.appendChild(txt);
          }
        });
      }

      // 直角标记
      if (type === 'right') {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        rect.setAttribute('points', `${pts[1][0]+15},${pts[1][1]} ${pts[1][0]+15},${pts[1][1]-15} ${pts[1][0]},${pts[1][1]-15}`);
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', '#FF9500');
        rect.setAttribute('stroke-width', '2');
        svgEl.appendChild(rect);
      }

      // 边长标注
      if (labelSides) {
        const midpoints = [
          [(pts[0][0]+pts[1][0])/2, (pts[0][1]+pts[1][1])/2],
          [(pts[1][0]+pts[2][0])/2, (pts[1][1]+pts[2][1])/2],
          [(pts[0][0]+pts[2][0])/2, (pts[0][1]+pts[2][1])/2]
        ];
        const sideOffsets = [[-16, 0], [0, 16], [16, 0]];
        labelSides.forEach((val, i) => {
          if (val !== undefined) {
            const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            txt.setAttribute('x', midpoints[i][0] + sideOffsets[i][0]);
            txt.setAttribute('y', midpoints[i][1] + sideOffsets[i][1]);
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('font-size', '14');
            txt.setAttribute('font-weight', '700');
            txt.setAttribute('fill', '#4A90D9');
            txt.textContent = val;
            svgEl.appendChild(txt);
          }
        });
      }
    }

    // ========== 模式1: 认识三角形 ==========
    const learnSlides = [
      {
        icon: '🔺',
        title: '什么是三角形？',
        body: `三角形是由 <strong>3条线段</strong> 围成的图形。<br><br>它有 <strong>3个顶点</strong>、<strong>3条边</strong> 和 <strong>3个角</strong>。<br><br>三角形是最简单的多边形，也是最稳定的结构！`,
        drawType: 'acute'
      },
      {
        icon: '📐',
        title: '按角分类：锐角三角形',
        body: `三个角都是 <strong>锐角</strong>（小于90°）的三角形。<br><br>就像一个小尖尖，每个角都尖尖的，没有"张开"的角。`,
        drawType: 'acute'
      },
      {
        icon: '📏',
        title: '按角分类：直角三角形',
        body: `有一个角是 <strong>直角</strong>（恰好90°）的三角形。<br><br>直角用一个小方块标记。直角三角形在日常生活中很常见，比如三角板！`,
        drawType: 'right'
      },
      {
        icon: '📐',
        title: '按角分类：钝角三角形',
        body: `有一个角是 <strong>钝角</strong>（大于90°）的三角形。<br><br>看起来像被"撑开"了，有一个角张得很大。`,
        drawType: 'obtuse'
      },
      {
        icon: '🔷',
        title: '按边分类：等边三角形',
        body: `<strong>3条边都相等</strong> 的三角形叫等边三角形。<br><br>等边三角形的 <strong>3个角也都相等</strong>，每个角都是 <strong>60°</strong>。它是最对称的三角形！`,
        drawType: 'equilateral'
      },
      {
        icon: '🔶',
        title: '按边分类：等腰三角形',
        body: `有 <strong>2条边相等</strong> 的三角形叫等腰三角形。<br><br>等腰三角形有 <strong>2个角也相等</strong>（底角相等），它有一条对称轴。`,
        drawType: 'isosceles'
      },
      {
        icon: '🔻',
        title: '按边分类：不等边三角形',
        body: `<strong>3条边都不相等</strong> 的三角形叫不等边三角形。<br><br>它的3个角也都不相等，看起来"歪歪的"。`,
        drawType: 'scalene'
      },
      {
        icon: '🧮',
        title: '重要性质：内角和 = 180°',
        body: `三角形 <strong>3个内角的和总是 180°</strong>！<br><br>不管三角形长什么样，只要把3个角加起来，一定是 180°。<br><br>这个性质在计算题中非常有用！`,
        drawType: 'acute'
      },
      {
        icon: '📏',
        title: '重要性质：三边关系',
        body: `三角形 <strong>任意两边之和大于第三边</strong>。<br><br>比如边长 3、4、5 可以组成三角形（3+4>5, 3+5>4, 4+5>3）。<br><br>但 1、2、4 不能（1+2<4）！`,
        drawType: 'acute'
      }
    ];

    let learnIdx = 0;
    function renderLearnSlide() {
      const slide = learnSlides[learnIdx];
      const container = document.getElementById('learn-content');
      container.innerHTML = `
        <div class="learn-card">
          <div class="card-icon">${slide.icon}</div>
          <div class="card-title">${slide.title}</div>
          <svg class="tri-svg" id="learn-svg" width="200" height="160"></svg>
          <div class="card-body">${slide.body}</div>
        </div>
      `;
      drawTriangle(document.getElementById('learn-svg'), slide.drawType);

      // 更新dots
      const dotsEl = document.getElementById('learn-dots');
      dotsEl.innerHTML = '';
      learnSlides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'learn-dot' + (i === learnIdx ? ' active' : '');
        dot.addEventListener('click', () => { learnIdx = i; renderLearnSlide(); });
        dotsEl.appendChild(dot);
      });

      document.getElementById('learn-prev').style.visibility = learnIdx === 0 ? 'hidden' : 'visible';
      document.getElementById('learn-next').textContent = learnIdx === learnSlides.length - 1 ? '重新开始' : '下一页 →';
    }

    document.getElementById('learn-prev').addEventListener('click', () => {
      if (learnIdx > 0) { learnIdx--; renderLearnSlide(); }
    });
    document.getElementById('learn-next').addEventListener('click', () => {
      learnIdx = (learnIdx + 1) % learnSlides.length;
      renderLearnSlide();
    });
    renderLearnSlide();

    // ========== 模式2: 分类大师 ==========
    const clsState = { correct: 0, wrong: 0, locked: false };

    function newClassifyQuestion() {
      clsState.locked = false;
      document.getElementById('cls-feedback').textContent = '';
      document.getElementById('cls-feedback').className = 'feedback';

      // 随机选一种三角形类型
      const types = [
        { type: 'acute', name: '锐角三角形', byAngle: true },
        { type: 'right', name: '直角三角形', byAngle: true },
        { type: 'obtuse', name: '钝角三角形', byAngle: true },
        { type: 'equilateral', name: '等边三角形', bySide: true },
        { type: 'isosceles', name: '等腰三角形', bySide: true },
        { type: 'scalene', name: '不等边三角形', bySide: true }
      ];

      const correct = types[randInt(0, types.length - 1)];
      const isByAngle = correct.byAngle;

      // 生成选项
      let optionNames;
      if (isByAngle) {
        optionNames = ['锐角三角形', '直角三角形', '钝角三角形'];
      } else {
        optionNames = ['等边三角形', '等腰三角形', '不等边三角形'];
      }

      const questionText = isByAngle
        ? '这个三角形按角分类，属于哪一种？'
        : '这个三角形按边分类，属于哪一种？';

      document.getElementById('cls-question').textContent = questionText;

      // 绘制三角形
      const triContainer = document.getElementById('cls-tri');
      triContainer.innerHTML = '<svg id="cls-svg" width="200" height="160"></svg>';
      drawTriangle(document.getElementById('cls-svg'), correct.type);

      // 生成按钮
      const optContainer = document.getElementById('cls-options');
      optContainer.innerHTML = '';
      shuffle(optionNames).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'classify-btn';
        btn.textContent = name;
        btn.addEventListener('click', () => handleClassifyAnswer(btn, name, correct.name, optContainer));
        optContainer.appendChild(btn);
      });
    }

    function handleClassifyAnswer(btn, selected, answer, container) {
      if (clsState.locked) return;
      clsState.locked = true;

      const fb = document.getElementById('cls-feedback');
      if (selected === answer) {
        btn.classList.add('correct');
        fb.textContent = '✅ 正确！';
        fb.className = 'feedback correct-fb';
        clsState.correct++;
        document.getElementById('cls-correct').textContent = clsState.correct;
        setTimeout(newClassifyQuestion, 1500);
      } else {
        btn.classList.add('wrong');
        fb.textContent = `❌ 这是${answer}`;
        fb.className = 'feedback wrong-fb';
        clsState.wrong++;
        document.getElementById('cls-wrong').textContent = clsState.wrong;
        container.querySelectorAll('.classify-btn').forEach(b => {
          if (b.textContent === answer) b.classList.add('correct');
        });
        setTimeout(newClassifyQuestion, 2500);
      }
    }

    // ========== 模式3: 角度计算 ==========
    const calcState = { correct: 0, wrong: 0, answer: 0, locked: false };

    function newCalcQuestion() {
      calcState.locked = false;
      document.getElementById('calc-feedback').textContent = '';
      document.getElementById('calc-feedback').className = 'feedback';
      document.getElementById('calc-answer').value = '';
      document.getElementById('calc-answer').className = 'calc-input';

      // 生成三个角，和为180
      const a1 = randInt(20, 80);
      const a2 = randInt(20, 180 - a1 - 10);
      const a3 = 180 - a1 - a2;

      // 随机隐藏一个角
      const hideIdx = randInt(0, 2);
      const angles = [a1, a2, a3];
      const labels = angles.map((a, i) => i === hideIdx ? '?' : a + '°');

      const angleNames = ['∠A', '∠B', '∠C'];
      const typeMap = (a) => a === 90 ? 'right' : a > 90 ? 'obtuse' : 'acute';

      const problemEl = document.getElementById('calc-problem');
      problemEl.innerHTML = `
        <svg class="calc-tri-svg" id="calc-svg" width="200" height="160"></svg>
        <div class="calc-text">
          已知：${angleNames[0]} = <span class="highlight-num">${labels[0]}</span>，
          ${angleNames[1]} = <span class="highlight-num">${labels[1]}</span>，
          ${angleNames[2]} = <span class="highlight-num">${labels[2]}</span>
        </div>
        <div class="calc-text">求 <span class="highlight-num">${angleNames[hideIdx]}</span> = ?</div>
      `;

      drawTriangle(document.getElementById('calc-svg'), typeMap(angles[hideIdx] === '?' ? angles[(hideIdx+1)%3] : angles[hideIdx]), angles.map((a, i) => i === hideIdx ? '?' : a));

      calcState.answer = angles[hideIdx];
    }

    document.getElementById('calc-submit').addEventListener('click', () => {
      if (calcState.locked) return;
      calcState.locked = true;

      const input = document.getElementById('calc-answer');
      const val = parseInt(input.value);
      const fb = document.getElementById('calc-feedback');

      if (isNaN(val)) {
        fb.textContent = '请输入数字！';
        fb.className = 'feedback wrong-fb';
        calcState.locked = false;
        return;
      }

      if (val === calcState.answer) {
        input.classList.add('correct');
        fb.textContent = '✅ 正确！三角形内角和 = 180°';
        fb.className = 'feedback correct-fb';
        calcState.correct++;
        document.getElementById('calc-correct').textContent = calcState.correct;
        setTimeout(newCalcQuestion, 1500);
      } else {
        input.classList.add('wrong');
        fb.textContent = `❌ 正确答案是 ${calcState.answer}°（180° - 已知角之和）`;
        fb.className = 'feedback wrong-fb';
        calcState.wrong++;
        document.getElementById('calc-wrong').textContent = calcState.wrong;
        setTimeout(newCalcQuestion, 2500);
      }
    });

    // 回车提交
    document.getElementById('calc-answer').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('calc-submit').click();
    });

    // ========== 模式4: 三边关系 ==========
    const sidesState = { correct: 0, wrong: 0, locked: false };

    function newSidesQuestion() {
      sidesState.locked = false;
      document.getElementById('sides-feedback').textContent = '';
      document.getElementById('sides-feedback').className = 'feedback';

      // 随机出题类型：判断能否组成三角形 或 求第三边范围
      const questionType = randInt(0, 1);

      if (questionType === 0) {
        // 判断三条边能否组成三角形
        const a = randInt(2, 10);
        const b = randInt(2, 10);
        const canForm = Math.random() < 0.5;
        let c;
        if (canForm) {
          // c < a+b 且 c > |a-b|
          const lo = Math.abs(a - b) + 1;
          const hi = a + b - 1;
          c = randInt(Math.max(1, lo), Math.max(lo, hi));
        } else {
          // c >= a+b 或 c <= |a-b|
          if (Math.random() < 0.5) {
            c = a + b + randInt(0, 5);
          } else {
            c = Math.abs(a - b) - randInt(0, Math.max(0, Math.abs(a-b)-1));
            if (c <= 0) c = a + b + randInt(1, 3);
          }
        }

        const correctAnswer = (a + b > c && a + c > b && b + c > a) ? '能' : '不能';

        document.getElementById('sides-question').innerHTML =
          `三条边分别是 <span class="highlight-num">${a}cm</span>、<span class="highlight-num">${b}cm</span>、<span class="highlight-num">${c}cm</span>，<br>能组成三角形吗？`;

        // 绘制三条线段
        const visual = document.getElementById('sides-visual');
        visual.innerHTML = '';
        [a, b, c].forEach((len, i) => {
          const bar = document.createElement('div');
          bar.className = 'sides-bar';
          const rect = document.createElement('div');
          rect.className = 'sides-bar-rect';
          const maxW = 120;
          const w = Math.max(20, Math.min(maxW, len * 8));
          rect.style.width = w + 'px';
          rect.style.height = '20px';
          rect.style.background = ['#7B1FA2', '#4A90D9', '#FF9500'][i];
          rect.style.borderRadius = '6px';
          const label = document.createElement('div');
          label.className = 'sides-bar-label';
          label.textContent = len + 'cm';
          bar.appendChild(rect);
          bar.appendChild(label);
          visual.appendChild(bar);
        });

        const optContainer = document.getElementById('sides-options');
        optContainer.innerHTML = '';
        ['能', '不能'].forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'sides-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleSidesAnswer(btn, opt, correctAnswer, optContainer));
          optContainer.appendChild(btn);
        });
      } else {
        // 已知两边，求第三边的范围
        const a = randInt(3, 10);
        const b = randInt(3, 10);
        const lo = Math.abs(a - b) + 1;
        const hi = a + b - 1;

        document.getElementById('sides-question').innerHTML =
          `三角形两条边分别是 <span class="highlight-num">${a}cm</span> 和 <span class="highlight-num">${b}cm</span>，<br>第三边可能是多少？`;

        const visual = document.getElementById('sides-visual');
        visual.innerHTML = '';
        [a, b].forEach((len, i) => {
          const bar = document.createElement('div');
          bar.className = 'sides-bar';
          const rect = document.createElement('div');
          rect.className = 'sides-bar-rect';
          const maxW = 120;
          const w = Math.max(20, Math.min(maxW, len * 8));
          rect.style.width = w + 'px';
          rect.style.height = '20px';
          rect.style.background = ['#7B1FA2', '#4A90D9'][i];
          rect.style.borderRadius = '6px';
          const label = document.createElement('div');
          label.className = 'sides-bar-label';
          label.textContent = len + 'cm';
          bar.appendChild(rect);
          bar.appendChild(label);
          visual.appendChild(bar);
        });
        // 问号
        const qMark = document.createElement('div');
        qMark.className = 'sides-bar';
        qMark.innerHTML = `<div style="font-size:32px;">❓</div><div class="sides-bar-label">?cm</div>`;
        visual.appendChild(qMark);

        // 生成选项：一个正确答案 + 三个错误答案
        const correctAnswer = `${lo}~${hi}cm`;
        let options = [correctAnswer];

        // 错误选项
        const wrongOptions = [
          `${Math.max(1, lo - randInt(1, 3))}~${hi + randInt(1, 3)}cm`,
          `${lo + randInt(1, 3)}~${hi + randInt(2, 5)}cm`,
          `${Math.max(1, lo - randInt(2, 4))}~${hi - randInt(1, 2)}cm`
        ];
        wrongOptions.forEach(w => { if (w !== correctAnswer) options.push(w); });
        while (options.length < 4) {
          options.push(`${randInt(1, 5)}~${randInt(8, 15)}cm`);
        }
        options = shuffle(options.slice(0, 4));

        const optContainer = document.getElementById('sides-options');
        optContainer.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'sides-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleSidesAnswer(btn, opt, correctAnswer, optContainer));
          optContainer.appendChild(btn);
        });
      }
    }

    function handleSidesAnswer(btn, selected, answer, container) {
      if (sidesState.locked) return;
      sidesState.locked = true;

      const fb = document.getElementById('sides-feedback');
      if (selected === answer) {
        btn.classList.add('correct');
        fb.textContent = '✅ 正确！';
        fb.className = 'feedback correct-fb';
        sidesState.correct++;
        document.getElementById('sides-correct').textContent = sidesState.correct;
        setTimeout(newSidesQuestion, 1500);
      } else {
        btn.classList.add('wrong');
        fb.textContent = `❌ 正确答案：${answer}`;
        fb.className = 'feedback wrong-fb';
        sidesState.wrong++;
        document.getElementById('sides-wrong').textContent = sidesState.wrong;
        container.querySelectorAll('.sides-btn').forEach(b => {
          if (b.textContent === answer) b.classList.add('correct');
        });
        setTimeout(newSidesQuestion, 2500);
      }
    }

    // ========== 初始化 ==========
    newClassifyQuestion();
    newCalcQuestion();
    newSidesQuestion();
  </script>
</body>
</html>
