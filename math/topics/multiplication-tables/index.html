<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>乘法口诀表</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #7B1FA2; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 口诀表浏览 */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px; }
    .kouque-table {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px;
      min-width: 340px; margin: 0 auto 16px; max-width: 500px;
    }
    .kq-cell {
      aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; border: 1px solid #E0E0E0; background: white;
      min-width: 32px; min-height: 32px; line-height: 1.1; text-align: center;
    }
    .kq-cell:active { transform: scale(0.88); }
    .kq-header { background: #EDE7F6; color: #7B1FA2; font-weight: 800; font-size: 14px; border-color: #D1C4E9; }
    .kq-result { background: #F3E5F5; color: #7B1FA2; font-weight: 700; }
    .kq-cell.highlight { background: #7B1FA2 !important; color: white !important; border-color: #7B1FA2; transform: scale(1.12); z-index: 2; box-shadow: 0 2px 8px rgba(123,31,162,0.3); }
    .kq-cell.row-hl { background: #F3E5F5; }
    .kq-cell.col-hl { background: #F3E5F5; }
    .kq-detail {
      text-align: center; padding: 16px; background: white; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
    }
    .kq-detail-formula { font-size: 36px; font-weight: 800; color: #7B1FA2; }
    .kq-detail-words { font-size: 20px; color: #FF9500; font-weight: 600; margin-top: 8px; }
    .kq-detail-visual { font-size: 28px; margin-top: 12px; letter-spacing: 2px; }

    /* 模式2: 填空练习 */
    .fill-area { text-align: center; padding: 24px 16px; }
    .fill-problem {
      font-size: 48px; font-weight: 800; color: #7B1FA2; margin: 20px 0;
      background: white; display: inline-block; padding: 16px 32px; border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .fill-blank {
      display: inline-block; width: 64px; height: 56px; border: 3px dashed #CE93D8;
      border-radius: 12px; vertical-align: middle; margin: 0 4px;
      background: #F3E5F5; line-height: 56px;
    }
    .fill-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 24px 0;
    }
    .fill-opt {
      width: 64px; height: 64px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .fill-opt:active { transform: scale(0.9); }
    .fill-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .fill-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式3: 看积找口诀 */
    .product-area { text-align: center; padding: 24px 16px; }
    .product-display {
      font-size: 72px; font-weight: 800; color: #7B1FA2; margin: 16px 0;
    }
    .product-hint { font-size: 16px; color: #6E6E73; margin-bottom: 16px; }
    .product-options {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0;
    }
    .product-opt {
      padding: 14px 20px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .product-opt:active { transform: scale(0.9); }
    .product-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .product-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式4: 限时挑战 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .timer-bar {
      height: 12px; background: #E5E5EA; border-radius: 6px; margin: 12px 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%; background: linear-gradient(90deg, #34C759, #7B1FA2);
      border-radius: 6px; transition: width 1s linear;
    }
    .timer-fill.warning { background: linear-gradient(90deg, #FF9500, #FF3B30); }
    .timer-text { font-size: 18px; font-weight: 700; color: #7B1FA2; }
    .challenge-problem {
      font-size: 52px; font-weight: 800; color: #7B1FA2; margin: 16px 0;
    }
    .challenge-input {
      width: 120px; height: 72px; border: 3px solid #E0E0E0; border-radius: 16px;
      font-size: 40px; font-weight: 700; text-align: center; color: #7B1FA2;
      outline: none; transition: border-color 0.2s ease;
    }
    .challenge-input:focus { border-color: #7B1FA2; }
    .challenge-input.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .challenge-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .challenge-score {
      font-size: 20px; font-weight: 700; color: #1D1D1F; margin: 16px 0;
    }
    .challenge-result {
      background: white; border-radius: 20px; padding: 24px; margin: 16px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .challenge-result h3 { font-size: 24px; color: #7B1FA2; margin-bottom: 12px; }
    .challenge-result .big-score { font-size: 56px; font-weight: 800; color: #7B1FA2; }
    .challenge-result .detail { font-size: 16px; color: #6E6E73; margin-top: 8px; }

    .start-btn {
      display: inline-block; padding: 16px 40px; border: none;
      background: #7B1FA2; color: white; border-radius: 16px; font-size: 20px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease; margin: 16px 0;
    }
    .start-btn:active { transform: scale(0.92); }

    .next-btn {
      display: block; margin: 16px auto; padding: 14px 32px; border: none;
      background: #7B1FA2; color: white; border-radius: 12px; font-size: 18px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回" onclick="location.href='../../index.html'">←</button>
      <span class="nav-title">🧮 乘法口诀表</span>
      <div style="width:56px"></div>
    </nav>

    <div class="score-display">
      <span>⭐ 连续答对: <strong id="streak">0</strong></span>
      <span>🏆 最高: <strong id="best">0</strong></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="browse">📖 口诀表</button>
      <button class="mode-tab" data-mode="fill">✏️ 填空</button>
      <button class="mode-tab" data-mode="product">🔍 找口诀</button>
      <button class="mode-tab" data-mode="challenge">⏱️ 限时挑战</button>
    </div>

    <!-- 模式1: 口诀表浏览 -->
    <div class="mode-content active" id="mode-browse">
      <div class="section-title">📖 九九乘法口诀表</div>
      <div class="section-desc">点击任意格子查看口诀</div>
      <div class="table-wrap">
        <div class="kouque-table" id="kouque-table"></div>
      </div>
      <div class="kq-detail" id="kq-detail" style="display:none;">
        <div class="kq-detail-formula" id="kq-formula"></div>
        <div class="kq-detail-words" id="kq-words"></div>
        <div class="kq-detail-visual" id="kq-visual"></div>
      </div>
    </div>

    <!-- 模式2: 填空练习 -->
    <div class="mode-content" id="mode-fill">
      <div class="fill-area">
        <div class="section-title">✏️ 填一填</div>
        <div class="section-desc">选出正确的数字</div>
        <div class="fill-problem" id="fill-problem"></div>
        <div class="fill-options" id="fill-options"></div>
        <div class="result-text" id="fill-result"></div>
      </div>
    </div>

    <!-- 模式3: 看积找口诀 -->
    <div class="mode-content" id="mode-product">
      <div class="product-area">
        <div class="section-title">🔍 看积找口诀</div>
        <div class="section-desc">哪个乘法口诀能得到这个数？</div>
        <div class="product-display" id="product-display"></div>
        <div class="product-hint" id="product-hint"></div>
        <div class="product-options" id="product-options"></div>
        <div class="result-text" id="product-result"></div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <div class="section-title">⏱️ 限时挑战</div>
        <div id="challenge-start-screen">
          <div class="section-desc">60秒内尽可能多答对！</div>
          <button class="start-btn" id="btn-start-challenge">🚀 开始挑战</button>
        </div>
        <div id="challenge-game-screen" style="display:none;">
          <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
          <div class="timer-text">⏱️ <span id="timer-text">60</span>秒</div>
          <div class="challenge-score">✅ <span id="ch-correct">0</span> 题</div>
          <div class="challenge-problem" id="ch-problem"></div>
          <input type="number" class="challenge-input" id="ch-input" autocomplete="off" inputmode="numeric">
        </div>
        <div id="challenge-result-screen" style="display:none;">
          <div class="challenge-result">
            <h3>🎯 挑战结束！</h3>
            <div class="big-score" id="ch-final-score"></div>
            <div class="detail" id="ch-final-detail"></div>
          </div>
          <button class="start-btn" id="btn-restart-challenge">🔄 再来一次</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 中文口诀映射 ===
    const CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    function kouque(a, b) {
      // 小数在前
      if (a > b) [a, b] = [b, a];
      return `${CN[a]}${CN[b]}${b <= 4 ? '得' : ''}${a * b}`;
    }

    // === 模式切换 ===
    let streak = 0, best = parseInt(localStorage.getItem('kq-best') || '0');
    document.getElementById('best').textContent = best;

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      if (streak > best) {
        best = streak;
        localStorage.setItem('kq-best', best);
        document.getElementById('best').textContent = best;
      }
    }

    // === 模式1: 口诀表浏览 ===
    (() => {
      const table = document.getElementById('kouque-table');
      // 构建 10x10 网格
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const cell = document.createElement('div');
          cell.className = 'kq-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          if (r === 0 && c === 0) {
            cell.textContent = '×';
            cell.className = 'kq-cell kq-header';
          } else if (r === 0) {
            cell.textContent = c;
            cell.className = 'kq-cell kq-header';
          } else if (c === 0) {
            cell.textContent = r;
            cell.className = 'kq-cell kq-header';
          } else {
            cell.textContent = r * c;
            cell.className = 'kq-cell kq-result';
            cell.addEventListener('click', () => showKQDetail(r, c));
          }
          table.appendChild(cell);
        }
      }

      function showKQDetail(r, c) {
        const a = Math.min(r, c), b = Math.max(r, c);
        document.getElementById('kq-detail').style.display = 'block';
        document.getElementById('kq-formula').textContent = `${a} × ${b} = ${a * b}`;
        document.getElementById('kq-words').textContent = kouque(a, b);
        // emoji visual
        const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🫐', '🍑', '🍒', '🥝'];
        const em = emojis[(a - 1) % emojis.length];
        let vis = '';
        for (let i = 0; i < a; i++) {
          if (i > 0) vis += ' ';
          for (let j = 0; j < b; j++) vis += em;
          vis += '<br>';
        }
        document.getElementById('kq-visual').innerHTML = vis;
        // highlight
        document.querySelectorAll('.kq-cell').forEach(cell => {
          cell.classList.remove('highlight', 'row-hl', 'col-hl');
        });
        document.querySelectorAll(`.kq-cell[data-row="${r}"][data-col="${c}"]`).forEach(el => {
          el.classList.add('highlight');
        });
        document.querySelectorAll(`.kq-cell[data-row="${r}"]`).forEach(el => {
          if (!el.classList.contains('highlight')) el.classList.add('row-hl');
        });
        document.querySelectorAll(`.kq-cell[data-col="${c}"]`).forEach(el => {
          if (!el.classList.contains('highlight')) el.classList.add('col-hl');
        });
        Sound.play('click');
      }
    })();

    // === 模式2: 填空练习 ===
    (() => {
      let answer, blankType; // 0=缺积, 1=缺因数a, 2=缺因数b

      function newFill() {
        const a = Random.int(1, 9), b = Random.int(a, 9);
        blankType = Random.int(0, 2);
        const probEl = document.getElementById('fill-problem');
        const optsEl = document.getElementById('fill-options');
        document.getElementById('fill-result').textContent = '';
        optsEl.innerHTML = '';

        if (blankType === 0) {
          // a × b = ?
          answer = a * b;
          probEl.innerHTML = `${a} × ${b} = <span class="fill-blank">?</span>`;
        } else if (blankType === 1) {
          // ? × b = a*b
          answer = a;
          probEl.innerHTML = `<span class="fill-blank">?</span> × ${b} = ${a * b}`;
        } else {
          // a × ? = a*b
          answer = b;
          probEl.innerHTML = `${a} × <span class="fill-blank">?</span> = ${a * b}`;
        }

        // 生成4个选项
        let opts = new Set([answer]);
        while (opts.size < 4) {
          let fake = answer + Random.int(-5, 5);
          if (fake >= 1 && fake <= 81 && fake !== answer) opts.add(fake);
          else opts.add(Random.int(1, 9));
        }
        let optArr = Random.shuffle([...opts]);
        optArr.forEach(v => {
          const btn = document.createElement('button');
          btn.className = 'fill-opt';
          btn.textContent = v;
          btn.addEventListener('click', () => checkFill(v, btn));
          optsEl.appendChild(btn);
        });
      }

      function checkFill(val, btn) {
        const allBtns = document.querySelectorAll('.fill-opt');
        if (val === answer) {
          btn.classList.add('correct');
          allBtns.forEach(b => b.style.pointerEvents = 'none');
          streak++; Sound.play('correct'); celebrate(); updateStreak();
          document.getElementById('fill-result').textContent = '🎉 答对了！';
          document.getElementById('fill-result').style.color = '#34C759';
          setTimeout(newFill, 1500);
        } else {
          btn.classList.add('wrong');
          Animator.shake(btn);
          Sound.play('wrong'); streak = 0; updateStreak();
          document.getElementById('fill-result').textContent = '❌ 再想想！';
          document.getElementById('fill-result').style.color = '#FF3B30';
          btn.style.pointerEvents = 'none';
        }
      }

      newFill();
    })();

    // === 模式3: 看积找口诀 ===
    (() => {
      let correctPair;

      function newProduct() {
        const a = Random.int(1, 9), b = Random.int(a, 9);
        const product = a * b;
        correctPair = [a, b];
        document.getElementById('product-display').textContent = product;
        document.getElementById('product-result').textContent = '';

        // 找所有能得出该积的口诀（包括交换律）
        let allPairs = [];
        for (let i = 1; i <= 9; i++) {
          for (let j = i; j <= 9; j++) {
            if (i * j === product) allPairs.push([i, j]);
          }
        }

        // 生成选项：正确答案 + 干扰项
        let options = [];
        allPairs.forEach(p => options.push(p));
        while (options.length < 4) {
          const fa = Random.int(1, 9), fb = Random.int(fa, 9);
          if (fa * fb !== product) {
            // 避免重复
            const exists = options.some(o => o[0] === fa && o[1] === fb);
            if (!exists) options.push([fa, fb]);
          }
        }
        options = Random.shuffle(options.slice(0, 4));

        const optsEl = document.getElementById('product-options');
        optsEl.innerHTML = '';
        document.getElementById('product-hint').textContent =
          allPairs.length > 1 ? `（有${allPairs.length}个正确答案）` : '';

        options.forEach(pair => {
          const btn = document.createElement('button');
          btn.className = 'product-opt';
          btn.textContent = `${pair[0]}×${pair[1]}`;
          btn.addEventListener('click', () => {
            const isCorrect = pair[0] * pair[1] === product;
            if (isCorrect) {
              btn.classList.add('correct');
              document.querySelectorAll('.product-opt').forEach(b => b.style.pointerEvents = 'none');
              streak++; Sound.play('correct'); celebrate(); updateStreak();
              document.getElementById('product-result').textContent = `🎉 ${kouque(pair[0], pair[1])}`;
              document.getElementById('product-result').style.color = '#34C759';
              setTimeout(newProduct, 1500);
            } else {
              btn.classList.add('wrong');
              Animator.shake(btn);
              Sound.play('wrong'); streak = 0; updateStreak();
              document.getElementById('product-result').textContent = '❌ 不对哦！';
              document.getElementById('product-result').style.color = '#FF3B30';
              btn.style.pointerEvents = 'none';
            }
          });
          optsEl.appendChild(btn);
        });
      }

      newProduct();
    })();

    // === 模式4: 限时挑战 ===
    (() => {
      let chTimer, chTimeLeft, chCorrect, chTotal, chA, chB, chAnswer;

      function startChallenge() {
        document.getElementById('challenge-start-screen').style.display = 'none';
        document.getElementById('challenge-result-screen').style.display = 'none';
        document.getElementById('challenge-game-screen').style.display = 'block';
        chCorrect = 0; chTotal = 0; chTimeLeft = 60;
        document.getElementById('ch-correct').textContent = '0';
        document.getElementById('timer-text').textContent = '60';
        const fill = document.getElementById('timer-fill');
        fill.style.width = '100%';
        fill.classList.remove('warning');
        newChProblem();
        document.getElementById('ch-input').focus();

        chTimer = setInterval(() => {
          chTimeLeft--;
          document.getElementById('timer-text').textContent = chTimeLeft;
          fill.style.width = (chTimeLeft / 60 * 100) + '%';
          if (chTimeLeft <= 10) fill.classList.add('warning');
          if (chTimeLeft <= 0) endChallenge();
        }, 1000);
      }

      function newChProblem() {
        chA = Random.int(1, 9);
        chB = Random.int(1, 9);
        chAnswer = chA * chB;
        document.getElementById('ch-problem').textContent = `${chA} × ${chB} = ?`;
        const inp = document.getElementById('ch-input');
        inp.value = '';
        inp.className = 'challenge-input';
      }

      function endChallenge() {
        clearInterval(chTimer);
        document.getElementById('challenge-game-screen').style.display = 'none';
        document.getElementById('challenge-result-screen').style.display = 'block';
        document.getElementById('ch-final-score').textContent = chCorrect + ' 题';
        const accuracy = chTotal > 0 ? Math.round(chCorrect / chTotal * 100) : 0;
        document.getElementById('ch-final-detail').textContent =
          `共答 ${chTotal} 题，正确率 ${accuracy}%`;
        if (chCorrect > best) {
          best = chCorrect;
          localStorage.setItem('kq-best', best);
          document.getElementById('best').textContent = best;
        }
        celebrate();
      }

      document.getElementById('ch-input').addEventListener('input', function() {
        const val = parseInt(this.value);
        if (isNaN(val)) return;
        chTotal++;
        if (val === chAnswer) {
          chCorrect++;
          this.className = 'challenge-input correct';
          Sound.play('correct');
          document.getElementById('ch-correct').textContent = chCorrect;
          setTimeout(newChProblem, 300);
        } else if (String(val).length >= String(chAnswer).length + 1 || val > 81) {
          this.className = 'challenge-input wrong';
          Animator.shake(this);
          Sound.play('wrong');
          setTimeout(() => { this.value = ''; this.className = 'challenge-input'; }, 500);
        }
      });

      document.getElementById('ch-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          const val = parseInt(this.value);
          if (isNaN(val)) return;
          chTotal++;
          if (val === chAnswer) {
            chCorrect++;
            Sound.play('correct');
            document.getElementById('ch-correct').textContent = chCorrect;
            newChProblem();
          }
        }
      });

      document.getElementById('btn-start-challenge').addEventListener('click', startChallenge);
      document.getElementById('btn-restart-challenge').addEventListener('click', startChallenge);
    })();
  </script>
</body>
</html>
