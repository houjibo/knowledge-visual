<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>除法初步认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E65100; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 12px 0; min-height: 36px; }

    /* 学一学 */
    .learn-card { background: white; border-radius: 20px; padding: 24px 16px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
    .learn-card h4 { font-size: 18px; color: #E65100; margin-bottom: 12px; }
    .learn-emoji { font-size: 48px; margin: 12px 0; letter-spacing: 4px; }
    .learn-text { font-size: 17px; color: #1D1D1F; line-height: 1.8; margin: 12px 0; }
    .learn-text b { color: #E65100; }
    .learn-formula { font-size: 26px; font-weight: 800; color: #E65100; margin: 16px 0; letter-spacing: 2px; }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn { padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #E65100; color: white; }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }
    .learn-page { font-size: 14px; color: #6E6E73; text-align: center; margin-top: 8px; }

    /* 分一分 */
    .share-area { text-align: center; padding: 16px; }
    .share-problem { font-size: 18px; font-weight: 600; margin: 12px 0; color: #1D1D1F; line-height: 1.6; }
    .share-items { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 16px 0; font-size: 32px; min-height: 50px; }
    .share-groups { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
    .share-group { min-width: 80px; min-height: 80px; background: white; border-radius: 16px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 2px dashed #E5E5EA; text-align: center; }
    .share-group .group-label { font-size: 13px; color: #6E6E73; margin-bottom: 6px; }
    .share-group .group-items { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: 24px; }
    .share-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .share-opt { padding: 12px 24px; border: 3px solid #E5E5EA; background: white; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .share-opt:active { transform: scale(0.95); }
    .share-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .share-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .share-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .share-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 写算式 */
    .write-area { text-align: center; padding: 16px; }
    .write-problem { font-size: 17px; font-weight: 600; margin: 12px 0; color: #1D1D1F; line-height: 1.6; text-align: left; padding: 0 8px; }
    .write-visual { font-size: 36px; letter-spacing: 4px; margin: 16px 0; }
    .write-formula { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .write-input { width: 56px; height: 56px; border: 3px solid #E5E5EA; border-radius: 12px; font-size: 24px; font-weight: 700; text-align: center; outline: none; color: #E65100; }
    .write-input:focus { border-color: #E65100; }
    .write-symbol { font-size: 24px; font-weight: 700; color: #6E6E73; }
    .write-check { display: block; margin: 16px auto; padding: 14px 32px; border: none; background: #E65100; color: white; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .write-check:active { transform: scale(0.95); }
    .write-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .write-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 选择题 */
    .quiz-area { text-align: center; padding: 16px; }
    .quiz-question { font-size: 18px; font-weight: 600; margin: 16px 0; color: #1D1D1F; line-height: 1.6; }
    .quiz-options { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
    .quiz-opt { padding: 16px 20px; border: 3px solid #E5E5EA; background: white; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-align: left; }
    .quiz-opt:active { transform: scale(0.98); }
    .quiz-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .quiz-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .quiz-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .quiz-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">除法初步认识</span>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 学一学</button>
      <button class="mode-tab" data-mode="share">🍎 分一分</button>
      <button class="mode-tab" data-mode="write">✏️ 写算式</button>
      <button class="mode-tab" data-mode="quiz">🎯 选一选</button>
    </div>

    <!-- 模式1: 学一学 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-card">
        <div class="learn-emoji" id="learn-emoji">🍎🍎🍎🍎🍎🍎</div>
        <h4 id="learn-title">什么是除法？</h4>
        <div class="learn-text" id="learn-text">
          把 <b>6个苹果</b> 平均分给 <b>2个小朋友</b>，<br>
          每人分到 <b>3个</b>。<br><br>
          这种<b>平均分</b>的操作，就用<b>除法</b>来表示！
        </div>
        <div class="learn-formula" id="learn-formula">6 ÷ 2 = 3</div>
        <div class="learn-nav">
          <button class="learn-btn secondary" id="learn-prev">← 上一页</button>
          <button class="learn-btn primary" id="learn-next">下一页 →</button>
        </div>
        <div class="learn-page" id="learn-page">第 1 页 / 共 4 页</div>
      </div>
    </div>

    <!-- 模式2: 分一分 -->
    <div class="mode-content" id="mode-share">
      <div class="share-area">
        <div class="section-title">🍎 分一分</div>
        <div class="section-desc">看图列除法算式，选出正确答案</div>
        <div class="share-score">
          <span>✅ 正确: <b id="share-correct">0</b></span>
          <span>❌ 错误: <b id="share-wrong">0</b></span>
        </div>
        <div class="share-problem" id="share-problem"></div>
        <div class="share-items" id="share-items"></div>
        <div class="share-groups" id="share-groups"></div>
        <div class="share-options" id="share-options"></div>
        <div class="share-feedback" id="share-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 写算式 -->
    <div class="mode-content" id="mode-write">
      <div class="write-area">
        <div class="section-title">✏️ 写算式</div>
        <div class="section-desc">根据题意，填入正确的数字</div>
        <div class="write-score">
          <span>✅ 正确: <b id="write-correct">0</b></span>
          <span>❌ 错误: <b id="write-wrong">0</b></span>
        </div>
        <div class="write-problem" id="write-problem"></div>
        <div class="write-visual" id="write-visual"></div>
        <div class="write-formula" id="write-formula">
          <input type="number" class="write-input" id="write-num1" placeholder="?">
          <span class="write-symbol">÷</span>
          <input type="number" class="write-input" id="write-num2" placeholder="?">
          <span class="write-symbol">=</span>
          <input type="number" class="write-input" id="write-num3" placeholder="?">
        </div>
        <button class="write-check" id="write-check">检查答案</button>
        <div class="write-feedback" id="write-feedback"></div>
      </div>
    </div>

    <!-- 模式4: 选一选 -->
    <div class="mode-content" id="mode-quiz">
      <div class="quiz-area">
        <div class="section-title">🎯 选一选</div>
        <div class="section-desc">选出正确的除法算式或答案</div>
        <div class="quiz-score">
          <span>✅ 正确: <b id="quiz-correct">0</b></span>
          <span>❌ 错误: <b id="quiz-wrong">0</b></span>
        </div>
        <div class="quiz-question" id="quiz-question"></div>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="quiz-feedback" id="quiz-feedback"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // ========== 模式切换 ==========
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
      });
    });

    // ========== 学一学 ==========
    const learnPages = [
      {
        emoji: '🍎🍎🍎🍎🍎🍎',
        title: '什么是除法？',
        text: '把 <b>6个苹果</b> 平均分给 <b>2个小朋友</b>，<br>每人分到 <b>3个</b>。<br><br>这种<b>平均分</b>的操作，就用<b>除法</b>来表示！',
        formula: '6 ÷ 2 = 3'
      },
      {
        emoji: '🍪🍪🍪🍪🍪🍪🍪🍪',
        title: '除法算式的读法',
        text: '<b>8 ÷ 4 = 2</b><br><br>读作：<b>"8除以4等于2"</b><br><br>• ÷ 是<b>除号</b><br>• 8 是<b>被除数</b>（要分的数）<br>• 4 是<b>除数</b>（分成的份数）<br>• 2 是<b>商</b>（每份的数量）',
        formula: '8 ÷ 4 = 2'
      },
      {
        emoji: '🍬🍬🍬🍬🍬🍬🍬🍬🍬🍬🍬🍬',
        title: '两种分法',
        text: '<b>平均分</b>有两种情况：<br><br>① 把12个糖平均分给3人<br>→ 每人几个？ <b>12 ÷ 3 = 4</b><br><br>② 12个糖，每人分4个<br>→ 能分给几人？ <b>12 ÷ 4 = 3</b>',
        formula: '12 ÷ 3 = 4  12 ÷ 4 = 3'
      },
      {
        emoji: '🧮',
        title: '除法与乘法的关系',
        text: '除法和乘法是<b>互逆运算</b>！<br><br>因为 <b>3 × 4 = 12</b><br>所以 <b>12 ÷ 3 = 4</b><br>所以 <b>12 ÷ 4 = 3</b><br><br>用<b>乘法口诀</b>就能算除法！',
        formula: '乘法口诀 → 算除法'
      }
    ];
    let learnIdx = 0;
    function renderLearn() {
      const p = learnPages[learnIdx];
      document.getElementById('learn-emoji').textContent = p.emoji;
      document.getElementById('learn-title').textContent = p.title;
      document.getElementById('learn-text').innerHTML = p.text;
      document.getElementById('learn-formula').textContent = p.formula;
      document.getElementById('learn-page').textContent = `第 ${learnIdx + 1} 页 / 共 ${learnPages.length} 页`;
      document.getElementById('learn-prev').style.visibility = learnIdx === 0 ? 'hidden' : 'visible';
      document.getElementById('learn-next').textContent = learnIdx === learnPages.length - 1 ? '重新开始' : '下一页 →';
    }
    document.getElementById('learn-next').addEventListener('click', () => {
      learnIdx = (learnIdx + 1) % learnPages.length;
      renderLearn();
    });
    document.getElementById('learn-prev').addEventListener('click', () => {
      learnIdx = (learnIdx - 1 + learnPages.length) % learnPages.length;
      renderLearn();
    });
    renderLearn();

    // ========== 工具函数 ==========
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍬', '🍪', '🧁', '⭐', '🎈'];

    // ========== 分一分 ==========
    let shareCorrect = 0, shareWrong = 0, shareLocked = false;
    function genShareProblem() {
      shareLocked = false;
      const divisor = randInt(2, 5);
      const quotient = randInt(1, 5);
      const total = divisor * quotient;
      const emoji = emojis[randInt(0, emojis.length - 1)];

      document.getElementById('share-problem').innerHTML = `把 <b>${total}</b> 个${emoji}平均分给 <b>${divisor}</b> 个盘子，每盘几个？`;
      document.getElementById('share-items').innerHTML = Array(total).fill(emoji).join(' ');

      let groupsHtml = '';
      for (let i = 0; i < divisor; i++) {
        groupsHtml += `<div class="share-group"><div class="group-label">盘子${i + 1}</div><div class="group-items">${Array(quotient).fill(emoji).join('')}</div></div>`;
      }
      document.getElementById('share-groups').innerHTML = groupsHtml;

      const options = shuffle([quotient, quotient + randInt(1, 2), Math.max(1, quotient - randInt(1, 2))]);
      // ensure unique options
      const uniqueOpts = [...new Set(options)];
      while (uniqueOpts.length < 3) uniqueOpts.push(randInt(1, 9));
      shuffle(uniqueOpts);

      let optsHtml = '';
      uniqueOpts.forEach(opt => {
        optsHtml += `<button class="share-opt" data-val="${opt}">${opt} 个</button>`;
      });
      document.getElementById('share-options').innerHTML = optsHtml;
      document.getElementById('share-feedback').textContent = '';

      document.querySelectorAll('.share-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (shareLocked) return;
          shareLocked = true;
          const val = parseInt(btn.dataset.val);
          if (val === quotient) {
            btn.classList.add('correct');
            document.getElementById('share-feedback').innerHTML = '✅ 正确！真棒！';
            document.getElementById('share-feedback').style.color = '#34C759';
            shareCorrect++;
            document.getElementById('share-correct').textContent = shareCorrect;
            setTimeout(genShareProblem, 1500);
          } else {
            btn.classList.add('wrong');
            document.getElementById('share-feedback').innerHTML = `❌ 再想想，每盘应该是 ${quotient} 个哦`;
            document.getElementById('share-feedback').style.color = '#FF3B30';
            shareWrong++;
            document.getElementById('share-wrong').textContent = shareWrong;
            setTimeout(genShareProblem, 2000);
          }
        });
      });
    }
    genShareProblem();

    // ========== 写算式 ==========
    let writeCorrect = 0, writeWrong = 0;
    let writeAnswer = [];
    function genWriteProblem() {
      const divisor = randInt(2, 5);
      const quotient = randInt(1, 5);
      const total = divisor * quotient;
      const emoji = emojis[randInt(0, emojis.length - 1)];

      writeAnswer = [total, divisor, quotient];

      const types = [
        `把 ${total} 个${emoji}平均分给 ${divisor} 人，每人分几个？`,
        `${total} 个${emoji}，每 ${quotient} 个一份，能分几份？`,
        `有 ${total} 个${emoji}，平均分成 ${divisor} 份，每份几个？`
      ];
      document.getElementById('write-problem').textContent = types[randInt(0, types.length - 1)];
      document.getElementById('write-visual').textContent = Array(total).fill(emoji).join('');

      document.getElementById('write-num1').value = '';
      document.getElementById('write-num2').value = '';
      document.getElementById('write-num3').value = '';
      document.getElementById('write-feedback').textContent = '';
      document.getElementById('write-feedback').className = 'write-feedback';
    }
    document.getElementById('write-check').addEventListener('click', () => {
      const a = parseInt(document.getElementById('write-num1').value);
      const b = parseInt(document.getElementById('write-num2').value);
      const c = parseInt(document.getElementById('write-num3').value);

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        document.getElementById('write-feedback').textContent = '⚠️ 请把三个空都填上哦！';
        document.getElementById('write-feedback').style.color = '#FF9500';
        return;
      }

      if (a === writeAnswer[0] && b === writeAnswer[1] && c === writeAnswer[2]) {
        document.getElementById('write-feedback').innerHTML = '✅ 完全正确！太厉害了！';
        document.getElementById('write-feedback').style.color = '#34C759';
        writeCorrect++;
        document.getElementById('write-correct').textContent = writeCorrect;
        setTimeout(genWriteProblem, 1500);
      } else {
        document.getElementById('write-feedback').innerHTML = `❌ 再想想～ 正确答案是 ${writeAnswer[0]} ÷ ${writeAnswer[1]} = ${writeAnswer[2]}`;
        document.getElementById('write-feedback').style.color = '#FF3B30';
        writeWrong++;
        document.getElementById('write-wrong').textContent = writeWrong;
        setTimeout(genWriteProblem, 2500);
      }
    });
    genWriteProblem();

    // ========== 选一选 ==========
    let quizCorrect = 0, quizWrong = 0, quizLocked = false;
    function genQuizProblem() {
      quizLocked = false;
      const type = randInt(0, 2);
      let question, answer, options;

      if (type === 0) {
        // 求商
        const divisor = randInt(2, 5);
        const quotient = randInt(1, 5);
        const total = divisor * quotient;
        question = `${total} ÷ ${divisor} = ？`;
        answer = quotient;
        const wrongs = new Set();
        while (wrongs.size < 2) {
          const w = quotient + randInt(-2, 3);
          if (w > 0 && w !== quotient) wrongs.add(w);
        }
        options = shuffle([quotient, ...wrongs]);
      } else if (type === 1) {
        // 选算式
        const divisor = randInt(2, 5);
        const quotient = randInt(1, 5);
        const total = divisor * quotient;
        question = `把 ${total} 个苹果平均分给 ${divisor} 个小朋友，每人几个？列式为：`;
        answer = `${total} ÷ ${divisor} = ${quotient}`;
        options = shuffle([
          `${total} ÷ ${divisor} = ${quotient}`,
          `${total} ÷ ${quotient} = ${divisor}`,
          `${divisor} × ${quotient} = ${total}`
        ]);
      } else {
        // 求除数
        const divisor = randInt(2, 5);
        const quotient = randInt(1, 5);
        const total = divisor * quotient;
        question = `${total} ÷ ？ = ${quotient}，除数是多少？`;
        answer = divisor;
        const wrongs = new Set();
        while (wrongs.size < 2) {
          const w = divisor + randInt(-2, 3);
          if (w > 0 && w !== divisor) wrongs.add(w);
        }
        options = shuffle([divisor, ...wrongs]);
      }

      document.getElementById('quiz-question').textContent = question;
      let optsHtml = '';
      options.forEach(opt => {
        optsHtml += `<button class="quiz-opt" data-val="${opt}">${opt}</button>`;
      });
      document.getElementById('quiz-options').innerHTML = optsHtml;
      document.getElementById('quiz-feedback').textContent = '';

      document.querySelectorAll('.quiz-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (quizLocked) return;
          quizLocked = true;
          const val = btn.dataset.val;
          const isCorrect = String(val) === String(answer);
          if (isCorrect) {
            btn.classList.add('correct');
            document.getElementById('quiz-feedback').innerHTML = '✅ 答对了！';
            document.getElementById('quiz-feedback').style.color = '#34C759';
            quizCorrect++;
            document.getElementById('quiz-correct').textContent = quizCorrect;
            setTimeout(genQuizProblem, 1500);
          } else {
            btn.classList.add('wrong');
            document.getElementById('quiz-feedback').innerHTML = `❌ 正确答案是 ${answer}`;
            document.getElementById('quiz-feedback').style.color = '#FF3B30';
            quizWrong++;
            document.getElementById('quiz-wrong').textContent = quizWrong;
            setTimeout(genQuizProblem, 2000);
          }
        });
      });
    }
    genQuizProblem();
  </script>
</body>
</html>
