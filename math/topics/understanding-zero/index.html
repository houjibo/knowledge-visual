<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识0和0的加减法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs {
      display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .mode-tab {
      flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA;
      border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active { background: #FF9500; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 认识0模式 */
    .zero-explore { text-align: center; padding: 24px 16px; }
    .zero-scene {
      position: relative; min-height: 200px; margin: 16px 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,149,0,0.05); border-radius: 20px; padding: 20px;
    }
    .zero-objects {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      min-height: 80px; align-items: center;
    }
    .zero-obj {
      font-size: 40px; transition: all 0.5s ease; cursor: pointer;
    }
    .zero-obj.eaten {
      opacity: 0; transform: scale(0) rotate(180deg);
    }
    .zero-big {
      font-size: 120px; font-weight: 900; color: #FF9500;
      text-shadow: 0 4px 20px rgba(255,149,0,0.3);
      animation: zeroPulse 2s ease-in-out infinite;
    }
    @keyframes zeroPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .zero-label {
      font-size: 24px; font-weight: 700; color: #1D1D1F; margin: 12px 0;
    }
    .zero-desc {
      font-size: 16px; color: #6E6E73; line-height: 1.6; max-width: 320px; margin: 0 auto;
    }
    .zero-nav {
      display: flex; justify-content: center; gap: 16px; margin-top: 20px;
    }
    .zero-nav-btn {
      padding: 12px 28px; border: none; border-radius: 16px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: white;
    }
    .zero-nav-btn:active { transform: scale(0.95); }
    .zero-nav-btn.prev { background: #8E8E93; }
    .zero-nav-btn.next { background: #FF9500; }
    .zero-nav-btn:disabled { opacity: 0.3; }
    .zero-counter {
      font-size: 18px; color: #6E6E73; margin-top: 12px;
    }
    .zero-counter b { color: #FF9500; }

    /* 数轴模式 */
    .numberline-area { text-align: center; padding: 24px 16px; }
    .numberline-container {
      position: relative; margin: 40px auto 24px; max-width: 360px;
      height: 120px;
    }
    .numberline-bar {
      position: absolute; top: 50px; left: 0; right: 0; height: 4px;
      background: #C7C7CC; border-radius: 2px;
    }
    .nl-tick {
      position: absolute; top: 30px; width: 4px; height: 44px;
      background: #C7C7CC; border-radius: 2px; transform: translateX(-50%);
      transition: all 0.3s ease;
    }
    .nl-tick.zero-tick { background: #FF9500; width: 6px; height: 52px; top: 26px; }
    .nl-label {
      position: absolute; top: 80px; font-size: 18px; font-weight: 700;
      color: #6E6E73; transform: translateX(-50%); transition: all 0.3s ease;
    }
    .nl-label.zero-label { color: #FF9500; font-size: 24px; top: 84px; }
    .nl-frog {
      position: absolute; top: -10px; font-size: 36px;
      transition: left 0.5s ease; transform: translateX(-50%);
      z-index: 10;
    }
    .nl-question {
      font-size: 28px; font-weight: 700; color: #4A90D9; margin: 16px 0;
    }
    .nl-options {
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0;
    }
    .nl-opt {
      width: 64px; height: 64px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .nl-opt:active { transform: scale(0.9); }
    .nl-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .nl-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 生活场景模式 */
    .life-area { text-align: center; padding: 24px 16px; }
    .life-scene {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px 0;
    }
    .life-emoji { font-size: 64px; margin: 16px 0; }
    .life-situation {
      font-size: 20px; font-weight: 700; color: #1D1D1F; margin: 12px 0;
      line-height: 1.6;
    }
    .life-question {
      font-size: 18px; color: #4A90D9; font-weight: 600; margin: 12px 0;
    }
    .life-input-row {
      display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0;
    }
    .life-input {
      width: 80px; height: 64px; border: 3px solid #E5E5EA; border-radius: 16px;
      font-size: 32px; font-weight: 700; text-align: center; color: #FF9500;
      outline: none; transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .life-input:focus { border-color: #FF9500; }
    .life-unit { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .life-check-btn {
      padding: 14px 32px; border: none; background: #FF9500; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; margin: 8px;
    }
    .life-check-btn:active { transform: scale(0.95); }
    .life-next-btn {
      padding: 14px 32px; border: none; background: #4A90D9; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; margin: 8px;
    }
    .life-feedback {
      font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px;
    }
    .life-feedback.ok { color: #34C759; }
    .life-feedback.no { color: #FF3B30; }
    .life-progress {
      font-size: 14px; color: #8E8E93; margin-top: 8px;
    }

    /* 挑战模式 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-problem {
      font-size: 44px; font-weight: 700; color: #FF9500; margin: 20px 0;
    }
    .challenge-hint {
      font-size: 16px; color: #6E6E73; margin-bottom: 16px;
    }
    .challenge-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 400px; margin: 20px auto; padding: 0 16px;
    }
    .challenge-opt {
      padding: 20px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-score {
      display: flex; justify-content: center; gap: 24px; margin: 16px 0;
      font-size: 18px;
    }
    .score-display {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; padding: 12px; font-size: 18px; font-weight: 600;
    }
    .score-stars { font-size: 24px; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #FF9500; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 16px auto; display: block;
      box-shadow: 0 4px 12px rgba(255,149,0,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .timer-bar {
      height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 16px 0;
    }
    .timer-fill {
      height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30);
      border-radius: 4px; transition: width 0.1s linear;
    }

    @media (max-width: 480px) {
      .zero-big { font-size: 80px; }
      .challenge-problem { font-size: 36px; }
      .nl-frog { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">🕳️ 认识0</span>
    </nav>

    <div class="score-display">
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="explore">🍪 认识0</button>
      <button class="mode-tab" data-mode="numberline">📏 数轴</button>
      <button class="mode-tab" data-mode="life">🏠 生活</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- 模式1: 认识0（吃饼干场景） -->
    <div class="mode-content active" id="mode-explore">
      <div class="card">
        <p class="page-subtitle">点一点，看看吃完后盘子里还有几个</p>
        <div class="zero-explore">
          <div class="zero-scene" id="zero-scene">
            <div>
              <div class="zero-objects" id="zero-objects"></div>
              <div class="zero-label" id="zero-label"></div>
            </div>
          </div>
          <div class="zero-desc" id="zero-desc"></div>
          <div class="zero-counter" id="zero-counter"></div>
          <div class="zero-nav">
            <button class="zero-nav-btn prev" id="zero-prev">⬅️ 上一步</button>
            <button class="zero-nav-btn next" id="zero-next">下一步 ➡️</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 数轴上的0 -->
    <div class="mode-content" id="mode-numberline">
      <div class="card">
        <p class="page-subtitle">0在数轴上的哪里？点青蛙跳到正确位置</p>
        <div class="numberline-area">
          <div class="nl-question" id="nl-question">0在哪里呢？</div>
          <div class="numberline-container" id="nl-container">
            <div class="numberline-bar"></div>
            <div class="nl-frog" id="nl-frog">🐸</div>
          </div>
          <div class="nl-options" id="nl-options"></div>
          <div id="nl-feedback" style="font-size:20px;font-weight:700;min-height:32px;margin:8px 0"></div>
          <button class="life-next-btn" id="nl-next" style="display:none">下一题 ➡️</button>
        </div>
      </div>
    </div>

    <!-- 模式3: 生活中的0 -->
    <div class="mode-content" id="mode-life">
      <div class="card">
        <p class="page-subtitle">生活中哪里用到了0？填一填吧</p>
        <div class="life-area">
          <div class="life-scene" id="life-scene">
            <div class="life-emoji" id="life-emoji"></div>
            <div class="life-situation" id="life-situation"></div>
            <div class="life-question" id="life-question"></div>
            <div class="life-input-row" id="life-input-row">
              <input type="number" class="life-input" id="life-input" min="0" max="20" placeholder="?">
            </div>
            <div class="life-feedback" id="life-feedback"></div>
            <div>
              <button class="life-check-btn" id="life-check">✅ 检查</button>
              <button class="life-next-btn" id="life-next" style="display:none">下一题 ➡️</button>
            </div>
          </div>
          <div class="life-progress" id="life-progress"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 0的加减法挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="card">
        <div class="challenge-area">
          <div class="challenge-score">
            <span>答对 <b id="ch-correct" style="color:#34C759">0</b></span>
            <span>答错 <b id="ch-wrong" style="color:#FF3B30">0</b></span>
          </div>
          <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
          <button class="challenge-start-btn" id="btn-start-challenge">🏆 开始挑战！</button>
          <div class="challenge-running">
            <div class="challenge-hint" id="challenge-hint"></div>
            <div class="challenge-problem" id="challenge-problem">5 - 5 = ?</div>
            <div class="challenge-options" id="challenge-options"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast('🔥 连续 ' + streak + ' 次！太厉害了！');
    }

    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.mode-content').forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 模式1: 认识0（逐步吃饼干） ===
    (function() {
      var scenes = [
        { count: 5, emoji: '🍪', label: '盘子里有 5 块饼干', desc: '数一数，盘子里有几块饼干？' },
        { count: 4, emoji: '🍪', label: '吃掉 1 块，还剩 4 块', desc: '小明吃了 1 块，还剩几块？' },
        { count: 3, emoji: '🍪', label: '又吃掉 1 块，还剩 3 块', desc: '再吃 1 块，越来越少了...' },
        { count: 2, emoji: '🍪', label: '继续吃，还剩 2 块', desc: '还有 2 块，接着吃！' },
        { count: 1, emoji: '🍪', label: '只剩最后 1 块了', desc: '只有 1 块了，吃掉它！' },
        { count: 0, emoji: '🍪', label: '一块也不剩了！就是 0', desc: '🎉 一块也没有了，我们就说这里有 "0" 块饼干。0 表示什么都没有！', showBigZero: true },
        { count: 0, emoji: '🎈', label: '0 个气球', desc: '气球飞走了，一个也不剩，就是 0 个。', showBigZero: false, changeEmoji: true },
        { count: 0, emoji: '⭐', label: '0 颗星星', desc: '天上没有星星，就是 0 颗。0 表示"没有"。', showBigZero: false, changeEmoji: true },
        { count: 0, emoji: '', label: '0 的样子像什么？', desc: '0 像一个圆圆的鸡蛋 🥚，也像一个大圆圈 ⭕。写的时候从右上角起笔，逆时针画一个圆。', showBigZero: true, noObjects: true }
      ];
      var idx = 0;
      var objContainer = document.getElementById('zero-objects');
      var label = document.getElementById('zero-label');
      var desc = document.getElementById('zero-desc');
      var counter = document.getElementById('zero-counter');
      var prevBtn = document.getElementById('zero-prev');
      var nextBtn = document.getElementById('zero-next');

      function render() {
        var s = scenes[idx];
        objContainer.innerHTML = '';

        if (s.noObjects) {
          // 展示大0
          var big = document.createElement('div');
          big.className = 'zero-big';
          big.textContent = '0';
          objContainer.appendChild(big);
        } else if (s.showBigZero && s.count === 0) {
          var big = document.createElement('div');
          big.className = 'zero-big';
          big.textContent = '0';
          objContainer.appendChild(big);
        } else {
          for (var i = 0; i < s.count; i++) {
            var span = document.createElement('span');
            span.className = 'zero-obj';
            span.textContent = s.emoji;
            span.style.animationDelay = (i * 0.1) + 's';
            objContainer.appendChild(span);
          }
        }

        label.textContent = s.label;
        desc.textContent = s.desc;
        counter.innerHTML = '第 <b>' + (idx + 1) + '</b> / ' + scenes.length + ' 步';
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === scenes.length - 1;
        if (idx === scenes.length - 1) {
          nextBtn.textContent = '✅ 完成';
        } else {
          nextBtn.textContent = '下一步 ➡️';
        }
      }

      prevBtn.addEventListener('click', function() {
        if (idx > 0) { idx--; render(); Sound.play('click'); }
      });
      nextBtn.addEventListener('click', function() {
        if (idx < scenes.length - 1) { idx++; render(); Sound.play('click'); }
        else { showToast('🎉 你认识了0！'); }
      });

      render();
    })();

    // === 模式2: 数轴上的0 ===
    (function() {
      var questions = [
        { type: 'find-zero', text: '🐸 青蛙要跳到0的位置，点一点0在哪里？', answer: 0 },
        { type: 'find-num', text: '🐸 青蛙要跳到3的位置，点一点3在哪里？', answer: 3 },
        { type: 'compare', text: '0和2，哪个数更小？', answer: 0 },
        { type: 'find-zero', text: '🐸 0是起点！点一点0在哪里', answer: 0 },
        { type: 'order', text: '0, 1, 2 中间缺了哪个数？', answer: -1 },
        { type: 'find-num', text: '🐸 跳到5的位置', answer: 5 },
        { type: 'compare', text: '0和5，哪个数更小？', answer: 0 }
      ];
      var qIdx = 0;
      var container = document.getElementById('nl-container');
      var frog = document.getElementById('nl-frog');
      var optionsEl = document.getElementById('nl-options');
      var feedback = document.getElementById('nl-feedback');
      var nextBtn = document.getElementById('nl-next');
      var questionEl = document.getElementById('nl-question');

      function buildNumberline() {
        // Remove old ticks and labels
        container.querySelectorAll('.nl-tick, .nl-label').forEach(function(el) { el.remove(); });
        for (var i = 0; i <= 10; i++) {
          var pct = (i / 10) * 100;
          var tick = document.createElement('div');
          tick.className = 'nl-tick' + (i === 0 ? ' zero-tick' : '');
          tick.style.left = pct + '%';
          container.appendChild(tick);

          var lbl = document.createElement('div');
          lbl.className = 'nl-label' + (i === 0 ? ' zero-label' : '');
          lbl.textContent = i;
          lbl.style.left = pct + '%';
          container.appendChild(lbl);
        }
      }

      function renderQuestion() {
        if (qIdx >= questions.length) qIdx = 0;
        var q = questions[qIdx];
        questionEl.textContent = q.text;
        feedback.textContent = '';
        feedback.style.color = '';
        nextBtn.style.display = 'none';
        frog.style.left = '50%';

        buildNumberline();

        optionsEl.innerHTML = '';
        var opts;
        if (q.type === 'find-zero') {
          opts = [0, 3, 5, 8];
        } else if (q.type === 'find-num') {
          opts = [1, q.answer, 6, 9].sort(function(a,b){return a-b;});
        } else if (q.type === 'compare') {
          opts = [q.answer, q.answer === 0 ? 2 : 0];
          opts = Random.shuffle(opts);
        } else if (q.type === 'order') {
          opts = [0, 1, 2, 3];
        } else {
          opts = Random.shuffle([0, 2, q.answer, 7].slice(0, 4));
        }

        // Ensure unique
        var seen = {};
        var uniqueOpts = [];
        for (var i = 0; i < opts.length; i++) {
          if (!seen[opts[i]]) {
            seen[opts[i]] = true;
            uniqueOpts.push(opts[i]);
          }
        }
        // Fill to 4 if needed
        while (uniqueOpts.length < 4) {
          var r = Random.int(0, 10);
          if (!seen[r]) { seen[r] = true; uniqueOpts.push(r); }
        }
        uniqueOpts = Random.shuffle(uniqueOpts);

        uniqueOpts.forEach(function(val) {
          var btn = document.createElement('div');
          btn.className = 'nl-opt';
          btn.textContent = val;
          btn.addEventListener('click', function() {
            var isCorrect = (val === q.answer);
            // Move frog
            var pct = (q.answer / 10) * 100;
            frog.style.left = pct + '%';

            if (isCorrect) {
              btn.classList.add('correct');
              feedback.textContent = '✅ 答对了！';
              feedback.style.color = '#34C759';
              streak++;
              updateStreak();
              Sound.play('correct');
              nextBtn.style.display = 'inline-block';
              // Disable all options
              optionsEl.querySelectorAll('.nl-opt').forEach(function(b) { b.style.pointerEvents = 'none'; });
              setTimeout(function() {
                qIdx++;
                renderQuestion();
              }, 1500);
            } else {
              btn.classList.add('wrong');
              Animator.shake(btn);
              feedback.textContent = '❌ 再想想哦';
              feedback.style.color = '#FF3B30';
              streak = 0;
              updateStreak();
              Sound.play('wrong');
              setTimeout(function() {
                btn.classList.remove('wrong');
                feedback.textContent = '';
              }, 1000);
            }
          });
          optionsEl.appendChild(btn);
        });
      }

      nextBtn.addEventListener('click', function() {
        qIdx++;
        renderQuestion();
        Sound.play('click');
      });

      renderQuestion();
    })();

    // === 模式3: 生活中的0 ===
    (function() {
      var lifeScenes = [
        { emoji: '🌡️', situation: '冬天的温度降到了\n冰点以下', question: '水结冰的温度是多少度？（提示：0度）', answer: 0, unit: '°C' },
        { emoji: '🏀', situation: '比赛刚开始\n还没有得分', question: '比赛开始时的比分是多少？', answer: 0, unit: '分' },
        { emoji: '📏', situation: '尺子的最左边\n是测量的起点', question: '尺子上的起点刻度是多少？', answer: 0, unit: '厘米' },
        { emoji: '🍎', situation: '树上有5个苹果\n全部摘下来了', question: '树上还剩几个苹果？', answer: 0, unit: '个' },
        { emoji: '💰', situation: '小明有3元钱\n买了3元的笔', question: '小明还剩多少钱？', answer: 0, unit: '元' },
        { emoji: '🎈', situation: '手里有4个气球\n飞走了4个', question: '手里还剩几个气球？', answer: 0, unit: '个' },
        { emoji: '📖', situation: '一本书有10页\n看完了全部', question: '还剩几页没看？', answer: 0, unit: '页' },
        { emoji: '🚗', situation: '停车场有6辆车\n全部开走了', question: '停车场现在有几辆车？', answer: 0, unit: '辆' }
      ];
      var sceneIdx = 0;
      var input = document.getElementById('life-input');
      var feedback = document.getElementById('life-feedback');
      var checkBtn = document.getElementById('life-check');
      var nextBtn = document.getElementById('life-next');
      var progress = document.getElementById('life-progress');

      function renderScene() {
        var s = lifeScenes[sceneIdx];
        document.getElementById('life-emoji').textContent = s.emoji;
        document.getElementById('life-situation').textContent = s.situation;
        document.getElementById('life-question').textContent = s.question;
        input.value = '';
        feedback.textContent = '';
        feedback.className = 'life-feedback';
        checkBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        input.disabled = false;
        progress.textContent = '第 ' + (sceneIdx + 1) + ' / ' + lifeScenes.length + ' 题';
        input.focus();
      }

      checkBtn.addEventListener('click', function() {
        var val = parseInt(input.value);
        var s = lifeScenes[sceneIdx];
        if (isNaN(val)) {
          feedback.textContent = '🤔 请输入一个数字';
          feedback.className = 'life-feedback no';
          return;
        }
        if (val === s.answer) {
          feedback.textContent = '✅ 答对了！0表示没有了';
          feedback.className = 'life-feedback ok';
          streak++;
          updateStreak();
          Sound.play('correct');
          checkBtn.style.display = 'none';
          nextBtn.style.display = 'inline-block';
          input.disabled = true;
        } else {
          feedback.textContent = '❌ 再想想，答案是0哦';
          feedback.className = 'life-feedback no';
          streak = 0;
          updateStreak();
          Sound.play('wrong');
          Animator.shake(input);
        }
      });

      nextBtn.addEventListener('click', function() {
        sceneIdx = (sceneIdx + 1) % lifeScenes.length;
        renderScene();
        Sound.play('click');
      });

      // Enter key
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          if (nextBtn.style.display !== 'none') {
            nextBtn.click();
          } else {
            checkBtn.click();
          }
        }
      });

      renderScene();
    })();

    // === 模式4: 0的加减法挑战 ===
    (function() {
      var correct = 0, wrong = 0, answer = 0, timer = null, timeLeft = 100, running = false;

      function genProblem() {
        // Types: n - n = 0, n + 0 = n, 0 + n = n, n - 0 = n
        var type = Random.int(0, 3);
        var n, a, b, ans;
        switch (type) {
          case 0: // n - n = 0
            n = Random.int(1, 10);
            a = n; b = n; ans = 0;
            return { text: a + ' - ' + b + ' = ?', answer: ans, hint: '相同的数相减等于几？' };
          case 1: // n + 0 = n
            n = Random.int(1, 10);
            a = n; b = 0; ans = n;
            return { text: a + ' + 0 = ?', answer: ans, hint: '一个数加0等于几？' };
          case 2: // 0 + n = n
            n = Random.int(1, 10);
            a = 0; b = n; ans = n;
            return { text: '0 + ' + b + ' = ?', answer: ans, hint: '0加一个数等于几？' };
          case 3: // n - 0 = n
            n = Random.int(1, 10);
            a = n; b = 0; ans = n;
            return { text: a + ' - 0 = ?', answer: ans, hint: '一个数减0等于几？' };
        }
      }

      function newChallenge() {
        var prob = genProblem();
        answer = prob.answer;
        document.getElementById('challenge-problem').textContent = prob.text;
        document.getElementById('challenge-hint').textContent = '💡 ' + prob.hint;
        Animator.numberPop(document.getElementById('challenge-problem'));

        var opts = [answer];
        while (opts.length < 4) {
          var fake;
          if (answer === 0) {
            fake = Random.int(0, 5);
          } else {
            fake = answer + Random.int(-3, 3);
          }
          if (fake >= 0 && !opts.includes(fake)) opts.push(fake);
        }
        opts = Random.shuffle(opts);

        var container = document.getElementById('challenge-options');
        container.innerHTML = '';
        opts.forEach(function(val) {
          var btn = document.createElement('div');
          btn.className = 'challenge-opt';
          btn.textContent = val;
          btn.addEventListener('click', function() {
            clearInterval(timer); timer = null;
            var isCorrect = (val === answer);
            if (isCorrect) {
              btn.classList.add('correct');
              correct++; streak++;
              Sound.play('correct');
              updateStreak();
              document.getElementById('ch-correct').textContent = correct;
              setTimeout(function() { if (running) newChallenge(); startTimer(); }, 1500);
            } else {
              btn.classList.add('wrong');
              Animator.shake(btn);
              wrong++; streak = 0;
              Sound.play('wrong');
              updateStreak();
              document.getElementById('ch-wrong').textContent = wrong;
              showToast('答案是 ' + answer + '，记住哦！');
              setTimeout(function() { if (running) newChallenge(); startTimer(); }, 1500);
            }
            // Disable all options
            container.querySelectorAll('.challenge-opt').forEach(function(b) { b.style.pointerEvents = 'none'; });
          });
          container.appendChild(btn);
        });

        timeLeft = 100;
        document.getElementById('timer-fill').style.width = '100%';
      }

      function startTimer() {
        clearInterval(timer);
        timer = setInterval(function() {
          timeLeft -= 1;
          document.getElementById('timer-fill').style.width = timeLeft + '%';
          if (timeLeft <= 0) {
            clearInterval(timer); timer = null;
            streak = 0;
            Sound.play('wrong');
            updateStreak();
            showToast('⏰ 时间到！答案是 ' + answer);
            setTimeout(function() { if (running) newChallenge(); startTimer(); }, 1500);
          }
        }, 100);
      }

      document.getElementById('btn-start-challenge').addEventListener('click', function() {
        clearInterval(timer);
        correct = 0; wrong = 0;
        document.getElementById('ch-correct').textContent = 0;
        document.getElementById('ch-wrong').textContent = 0;
        document.querySelector('.challenge-area').classList.add('challenge-active');
        running = true;
        newChallenge();
        startTimer();
        Sound.play('click');
      });
    })();
  </script>
