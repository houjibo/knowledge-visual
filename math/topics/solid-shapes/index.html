<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>立体图形的认识</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #7B1FA2; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* === 模式1: 概念 === */
    .concept-area { text-align: center; padding: 24px 16px; }
    .concept-explain { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 16px 0; line-height: 1.8; }
    .shape-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 20px 0; max-width: 400px; margin-left: auto; margin-right: auto; }
    .shape-card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s ease; }
    .shape-card:active { transform: scale(0.95); }
    .shape-card.selected { border: 3px solid #7B1FA2; background: rgba(123,31,162,0.05); }
    .shape-card svg { display: block; margin: 0 auto 8px; }
    .shape-card .shape-name { font-size: 16px; font-weight: 700; color: #1D1D1F; }
    .shape-card .shape-desc { font-size: 12px; color: #6E6E73; margin-top: 4px; line-height: 1.4; }
    .shape-detail { background: white; border-radius: 16px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: left; display: none; }
    .shape-detail.show { display: block; animation: fadeInUp 0.3s ease; }
    .shape-detail h3 { font-size: 20px; font-weight: 700; color: #7B1FA2; margin-bottom: 12px; text-align: center; }
    .detail-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F0F0F0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-icon { font-size: 24px; width: 36px; text-align: center; }
    .detail-text { font-size: 15px; color: #1D1D1F; line-height: 1.5; }
    .detail-text strong { color: #7B1FA2; }
    .real-life { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
    .real-item { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; background: #F8F8FA; border-radius: 12px; min-width: 70px; }
    .real-item .ri-icon { font-size: 32px; }
    .real-item .ri-name { font-size: 12px; color: #6E6E73; margin-top: 4px; }

    /* === 模式2: 探索 === */
    .explore-area { text-align: center; padding: 24px 16px; }
    .explore-stage { position: relative; width: 280px; height: 220px; margin: 16px auto; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
    .explore-shape { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .explore-info { margin: 16px 0; }
    .explore-name { font-size: 28px; font-weight: 800; color: #7B1FA2; }
    .explore-props { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
    .prop-chip { padding: 10px 16px; background: #F3E5F5; border-radius: 12px; font-size: 15px; font-weight: 600; color: #7B1FA2; }
    .explore-nav { display: flex; justify-content: center; gap: 16px; margin: 16px 0; }
    .explore-btn {
      padding: 12px 28px; border: none; background: #7B1FA2; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(123,31,162,0.3); transition: all 0.2s ease;
    }
    .explore-btn:active { transform: scale(0.95); }
    .explore-btn:disabled { opacity: 0.4; }
    .explore-compare { background: white; border-radius: 16px; padding: 16px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .compare-title { font-size: 16px; font-weight: 700; color: #1D1D1F; margin-bottom: 12px; }
    .compare-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .compare-item { padding: 8px; background: #F8F8FA; border-radius: 10px; font-size: 13px; color: #6E6E73; line-height: 1.5; }
    .compare-item strong { color: #7B1FA2; display: block; font-size: 14px; margin-bottom: 4px; }

    /* === 模式3: 分类游戏 === */
    .sort-area { text-align: center; padding: 24px 16px; }
    .sort-item { margin: 16px auto; padding: 16px; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 320px; }
    .sort-emoji { font-size: 64px; margin: 8px 0; }
    .sort-name { font-size: 22px; font-weight: 700; color: #1D1D1F; margin: 8px 0; }
    .sort-hint { font-size: 14px; color: #6E6E73; }
    .sort-bins { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 360px; margin: 16px auto; }
    .sort-bin {
      padding: 16px 8px; border: 3px dashed #E5E5EA; border-radius: 16px;
      background: #FAFAFA; cursor: pointer; transition: all 0.2s ease;
      min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    .sort-bin:active { transform: scale(0.95); }
    .sort-bin .bin-icon { font-size: 36px; }
    .sort-bin .bin-label { font-size: 14px; font-weight: 700; color: #6E6E73; }
    .sort-bin.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .sort-bin.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.08); }
    .sort-bin.flash-correct { animation: flashGreen 0.5s ease; }
    .sort-bin.flash-wrong { animation: flashRed 0.5s ease; }
    @keyframes flashGreen { 0%,100% { background: rgba(52,199,89,0.1); } 50% { background: rgba(52,199,89,0.3); } }
    @keyframes flashRed { 0%,100% { background: rgba(255,59,48,0.08); } 50% { background: rgba(255,59,48,0.25); } }
    .sort-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .sort-feedback { font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 32px; }

    /* === 模式4: 闯关 === */
    .quiz-area { text-align: center; padding: 24px 16px; }
    .quiz-progress { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
    .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #E5E5EA; }
    .progress-dot.done { background: #34C759; }
    .progress-dot.current { background: #7B1FA2; transform: scale(1.3); }
    .quiz-question { font-size: 20px; font-weight: 600; color: #1D1D1F; margin: 16px 0; line-height: 1.6; }
    .quiz-visual { margin: 16px auto; }
    .quiz-options { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 16px auto; }
    .quiz-opt {
      padding: 16px 20px; border: 3px solid #E5E5EA; background: white; border-radius: 16px;
      font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
      text-align: left; display: flex; align-items: center; gap: 12px;
    }
    .quiz-opt:active { transform: scale(0.98); }
    .quiz-opt .opt-letter { width: 32px; height: 32px; border-radius: 50%; background: #F0F0F0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #6E6E73; flex-shrink: 0; }
    .quiz-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .quiz-opt.correct .opt-letter { background: #34C759; color: white; }
    .quiz-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.08); }
    .quiz-opt.wrong .opt-letter { background: #FF3B30; color: white; }
    .quiz-explain { font-size: 16px; color: #6E6E73; margin: 12px 0; line-height: 1.6; min-height: 24px; }
    .quiz-score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }

    /* 通用 */
    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .bounce { animation: bounce 0.6s ease; }
    @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .pop-in { animation: popIn 0.4s ease; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" onclick="location.href='../../index.html'" aria-label="返回">←</button>
      <span class="nav-title">🧊 立体图形的认识</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="concept">📖 认识</button>
      <button class="mode-tab" data-mode="explore">🔍 探索</button>
      <button class="mode-tab" data-mode="sort">🎯 分类</button>
      <button class="mode-tab" data-mode="quiz">🏆 闯关</button>
    </div>

    <!-- 模式1: 概念 -->
    <div class="mode-content active" id="mode-concept">
      <div class="concept-area">
        <div class="card">
          <p class="page-subtitle">生活中很多东西都是立体的，它们占空间、能摸到</p>
          <div class="concept-explain">
            平面图形是<strong>扁扁的</strong>，立体图形是<strong>鼓鼓的</strong>，<br>
            它们占地方，能拿在手里！
          </div>
          <div class="shape-gallery" id="shape-gallery">
            <!-- JS fills -->
          </div>
          <div class="shape-detail" id="shape-detail">
            <!-- JS fills -->
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 探索 -->
    <div class="mode-content" id="mode-explore">
      <div class="explore-area">
        <div class="card">
          <p class="page-subtitle">转一转、看一看，了解每种立体图形的特征</p>
          <div class="explore-stage" id="explore-stage">
            <div class="explore-shape" id="explore-shape"></div>
          </div>
          <div class="explore-info">
            <div class="explore-name" id="explore-name"></div>
          </div>
          <div class="explore-props" id="explore-props"></div>
          <div class="explore-nav">
            <button class="explore-btn" id="explore-prev">⬅️ 上一个</button>
            <button class="explore-btn" id="explore-next">下一个 ➡️</button>
          </div>
          <div class="explore-compare" id="explore-compare">
            <div class="compare-title">💡 它们有什么不同？</div>
            <div class="compare-grid" id="compare-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式3: 分类游戏 -->
    <div class="mode-content" id="mode-sort">
      <div class="sort-area">
        <div class="card">
          <p class="page-subtitle">物品近似哪种立体图形？正方体单独归类；实物可能与理想图形不同。</p>
          <div class="sort-score">
            <span>✅ <span id="sort-correct">0</span></span>
            <span>❌ <span id="sort-wrong">0</span></span>
          </div>
          <div class="sort-item" id="sort-item">
            <div class="sort-emoji" id="sort-emoji"></div>
            <div class="sort-name" id="sort-name"></div>
            <div class="sort-hint" id="sort-hint"></div>
          </div>
          <div class="sort-feedback" id="sort-feedback"></div>
          <div class="sort-bins" id="sort-bins">
            <!-- JS fills -->
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 闯关 -->
    <div class="mode-content" id="mode-quiz">
      <div class="quiz-area">
        <div class="card">
          <p class="page-subtitle">来挑战立体图形知识闯关吧！</p>
          <div class="quiz-progress" id="quiz-progress"></div>
          <div class="quiz-score-bar">
            <span>✅ <span id="quiz-correct">0</span></span>
            <span>❌ <span id="quiz-wrong">0</span></span>
          </div>
          <div class="quiz-question" id="quiz-question"></div>
          <div class="quiz-visual" id="quiz-visual"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-explain" id="quiz-explain"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === 基础数据 ===
    const SHAPES = [
      {
        id: 'cube', name: '正方体', emoji: '🧊',
        color: '#7B1FA2', lightColor: 'rgba(123,31,162,0.15)',
        faces: 6, edges: 12, vertices: 8,
        faceShape: '正方形',
        desc: '6个面都是完全相同的正方形',
        features: ['6个面都相同', '12条棱等长', '8个顶点', '每个面都是正方形'],
        realLife: [{ icon: '🎲', name: '骰子' }, { icon: '🧊', name: '冰块' }, { icon: '📦', name: '魔方' }],
        svg: `<svg width="140" height="130" viewBox="0 0 140 130">
          <polygon points="30,40 90,40 90,100 30,100" fill="rgba(123,31,162,0.2)" stroke="#7B1FA2" stroke-width="2.5"/>
          <polygon points="30,40 55,18 115,18 90,40" fill="rgba(123,31,162,0.35)" stroke="#7B1FA2" stroke-width="2.5"/>
          <polygon points="90,40 115,18 115,78 90,100" fill="rgba(123,31,162,0.12)" stroke="#7B1FA2" stroke-width="2.5"/>
          <text x="60" y="75" font-size="12" fill="#7B1FA2" font-weight="700">正方体</text>
        </svg>`
      },
      {
        id: 'cuboid', name: '长方体', emoji: '📦',
        color: '#4A90D9', lightColor: 'rgba(74,144,217,0.15)',
        faces: 6, edges: 12, vertices: 8,
        faceShape: '长方形',
        desc: '6个面都是长方形（可能有2个面是正方形）',
        features: ['对面完全相同', '12条棱分3组', '8个顶点', '每个面都是长方形'],
        realLife: [{ icon: '📱', name: '手机' }, { icon: '📚', name: '书本' }, { icon: '🧱', name: '砖块' }],
        svg: `<svg width="150" height="130" viewBox="0 0 150 130">
          <polygon points="20,50 100,50 100,100 20,100" fill="rgba(74,144,217,0.2)" stroke="#4A90D9" stroke-width="2.5"/>
          <polygon points="20,50 50,25 130,25 100,50" fill="rgba(74,144,217,0.35)" stroke="#4A90D9" stroke-width="2.5"/>
          <polygon points="100,50 130,25 130,75 100,100" fill="rgba(74,144,217,0.12)" stroke="#4A90D9" stroke-width="2.5"/>
          <text x="55" y="80" font-size="12" fill="#4A90D9" font-weight="700">长方体</text>
        </svg>`
      },
      {
        id: 'cylinder', name: '圆柱', emoji: '🥫',
        color: '#FF9800', lightColor: 'rgba(255,152,0,0.15)',
        faces: 3, edges: 0, vertices: 0,
        faceShape: '圆形+曲面',
        desc: '上下两个圆面，中间是曲面，上下一样粗',
        features: ['上下2个圆面', '侧面是曲面', '上下一样粗', '没有顶点'],
        realLife: [{ icon: '🥫', name: '罐头' }, { icon: '🪵', name: '木桩' }, { icon: '🖊️', name: '笔筒' }],
        svg: `<svg width="120" height="130" viewBox="0 0 120 130">
          <ellipse cx="60" cy="30" rx="38" ry="14" fill="rgba(255,152,0,0.35)" stroke="#FF9800" stroke-width="2.5"/>
          <line x1="22" y1="30" x2="22" y2="95" stroke="#FF9800" stroke-width="2.5"/>
          <line x1="98" y1="30" x2="98" y2="95" stroke="#FF9800" stroke-width="2.5"/>
          <ellipse cx="60" cy="95" rx="38" ry="14" fill="rgba(255,152,0,0.2)" stroke="#FF9800" stroke-width="2.5"/>
          <text x="60" y="68" font-size="12" fill="#FF9800" font-weight="700" text-anchor="middle">圆柱</text>
        </svg>`
      },
      {
        id: 'sphere', name: '球', emoji: '⚽',
        color: '#E53935', lightColor: 'rgba(229,57,53,0.15)',
        faces: 1, edges: 0, vertices: 0,
        faceShape: '曲面',
        desc: '到处圆滚滚，从哪看都是圆的',
        features: ['1个曲面', '没有平面', '能向任何方向滚动', '没有顶点'],
        realLife: [{ icon: '⚽', name: '足球' }, { icon: '🌍', name: '地球' }, { icon: '🍊', name: '橘子' }],
        svg: `<svg width="120" height="130" viewBox="0 0 120 130">
          <circle cx="60" cy="65" r="42" fill="rgba(229,57,53,0.2)" stroke="#E53935" stroke-width="2.5"/>
          <ellipse cx="60" cy="65" rx="42" ry="14" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
          <ellipse cx="60" cy="65" rx="14" ry="42" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
          <text x="60" y="68" font-size="12" fill="#E53935" font-weight="700" text-anchor="middle">球</text>
        </svg>`
      }
    ];

    // 分类游戏物品库
    const SORT_ITEMS = [
      { emoji: '🎲', name: '骰子', answer: 'cube', hint: '六面都是正方形' },
      { emoji: '📱', name: '手机', answer: 'cuboid', hint: '长长的，有6个面' },
      { emoji: '⚽', name: '足球', answer: 'sphere', hint: '圆滚滚的' },
      { emoji: '🥫', name: '罐头', answer: 'cylinder', hint: '上下都是圆形' },
      { emoji: '📚', name: '字典', answer: 'cuboid', hint: '长方形的书' },
      { emoji: '🍊', name: '橙子', answer: 'sphere', hint: '圆圆的水果' },
      { emoji: '🧊', name: '冰块', answer: 'cube', hint: '方方正正' },
      { emoji: '🖊️', name: '笔筒', answer: 'cylinder', hint: '圆圆的筒' },
      { emoji: '🧱', name: '砖头', answer: 'cuboid', hint: '建筑工地用的' },
      { emoji: '🎱', name: '台球', answer: 'sphere', hint: '桌上滚动的球' },
      { emoji: '📦', name: '纸箱', answer: 'cuboid', hint: '装快递的盒子' },
      { emoji: '🏀', name: '篮球', answer: 'sphere', hint: '拍着玩的' },
      { emoji: '🎯', name: '魔方', answer: 'cube', hint: '六个面都是正方形' },
      { emoji: '🪵', name: '树桩', answer: 'cylinder', hint: '砍断的树干' },
      { emoji: '🌍', name: '地球仪', answer: 'sphere', hint: '圆圆的地球' },
      { emoji: '🔋', name: '电池', answer: 'cylinder', hint: '圆圆的柱子' },
      { emoji: '🎁', name: '礼盒', answer: 'cube', hint: '正方形的盒子' },
      { emoji: '📐', name: '文具盒', answer: 'cuboid', hint: '装铅笔的长盒子' },
      { emoji: '🧃', name: '易拉罐', answer: 'cylinder', hint: '装饮料的罐子' },
      { emoji: '🎾', name: '网球', answer: 'sphere', hint: '打球用的' }
    ];

    let streak = 0;
    let totalCorrect = 0;
    function bumpTotalCorrect() {
      totalCorrect++;
      if (totalCorrect >= 8 && typeof PageProgress !== 'undefined' && !PageProgress.isDone('solid-shapes')) {
        PageProgress.markDone('solid-shapes');
        showToast('🎉 太棒了！「立体图形」已完成，知识地图已点亮！');
      }
    }

    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      const stars = streak >= 10 ? '🌟🌟🌟' : streak >= 5 ? '🌟🌟' : streak >= 3 ? '🌟' : '';
      document.getElementById('stars-display').textContent = stars;
    }

    function showToast(msg) { if (typeof Toast !== 'undefined') Toast.show(msg); }
    function playSound(type) { if (typeof Sound !== 'undefined') Sound.play(type); }
    function shuffleArray(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    // === 模式切换 ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        playSound('click');
      });
    });

    // === 模式1: 概念 ===
    (() => {
      const gallery = document.getElementById('shape-gallery');
      const detail = document.getElementById('shape-detail');

      SHAPES.forEach((shape, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'shape-card';
        card.innerHTML = `
          ${shape.svg.replace(/width="[^"]*"/, 'width="100"').replace(/height="[^"]*"/, 'height="90"').replace(/viewBox/, 'style="display:block;margin:0 auto 8px" viewBox')}
          <div class="shape-name">${shape.emoji} ${shape.name}</div>
          <div class="shape-desc">${shape.desc}</div>
        `;
        card.addEventListener('click', () => {
          document.querySelectorAll('.shape-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          showDetail(shape);
          playSound('click');
        });
        gallery.appendChild(card);
      });

      function showDetail(shape) {
        let realHtml = shape.realLife.map(r => `<div class="real-item"><span class="ri-icon">${r.icon}</span><span class="ri-name">${r.name}</span></div>`).join('');
        detail.innerHTML = `
          <h3>${shape.emoji} ${shape.name}</h3>
          <div class="detail-row"><div class="detail-icon">📐</div><div class="detail-text"><strong>表面：</strong>${shape.id === 'cylinder' ? '2个圆形平面和1个曲面' : shape.id === 'sphere' ? '1个曲面' : shape.faces + '个平面'}</div></div>
          <div class="detail-row"><div class="detail-icon">📏</div><div class="detail-text"><strong>直棱：</strong>${shape.edges} 条${shape.id === 'cylinder' ? '；底面与侧面相交形成圆形边界' : ''}</div></div>
          <div class="detail-row"><div class="detail-icon">📍</div><div class="detail-text"><strong>顶点：</strong>${shape.vertices} 个顶点</div></div>
          <div class="detail-row"><div class="detail-icon">🔷</div><div class="detail-text"><strong>面的形状：</strong>${shape.faceShape}</div></div>
          <div class="detail-row"><div class="detail-icon">💡</div><div class="detail-text">${shape.features.map(f => '• ' + f).join('<br>')}</div></div>
          <div style="margin-top:12px;font-size:15px;font-weight:600;color:#1D1D1F">🏠 生活中的${shape.name}：</div>
          <div class="real-life">${realHtml}</div>
        `;
        detail.classList.add('show');
      }

      // 默认展开第一个
      showDetail(SHAPES[0]);
    })();

    // === 模式2: 探索 ===
    (() => {
      let currentIdx = 0;

      function renderExplore() {
        const shape = SHAPES[currentIdx];
        document.getElementById('explore-shape').innerHTML = shape.svg.replace(/width="[^"]*"/, 'width="200"').replace(/height="[^"]*"/, 'height="180"');
        document.getElementById('explore-name').textContent = shape.emoji + ' ' + shape.name;
        document.getElementById('explore-name').style.color = shape.color;

        const propsEl = document.getElementById('explore-props');
        propsEl.innerHTML = `
          <div class="prop-chip">📐 ${shape.id === 'cylinder' ? '2个平面和1个曲面' : shape.id === 'sphere' ? '1个曲面' : shape.faces + '个平面'}</div>
          <div class="prop-chip">📏 ${shape.edges}条直棱</div>
          <div class="prop-chip">📍 ${shape.vertices}个顶点</div>
        `;

        // 比较
        const otherShapes = SHAPES.filter((_, i) => i !== currentIdx);
        const compareEl = document.getElementById('compare-grid');
        const comparisons = [];
        if (shape.id === 'cube') {
          comparisons.push({ title: '正方体 vs 长方体', text: '正方体是特殊的长方体，所有棱一样长' });
          comparisons.push({ title: '正方体 vs 球', text: '正方体有平平的面，球到处是曲面' });
        } else if (shape.id === 'cuboid') {
          comparisons.push({ title: '长方体 vs 正方体', text: '长方体的面是长方形，正方体全是正方形' });
          comparisons.push({ title: '长方体 vs 圆柱', text: '长方体有尖尖的角，圆柱圆圆的没有角' });
        } else if (shape.id === 'cylinder') {
          comparisons.push({ title: '圆柱 vs 长方体', text: '圆柱有曲面，长方体的面都是平面' });
          comparisons.push({ title: '圆柱 vs 球', text: '圆柱有平平的面，球没有平面' });
        } else if (shape.id === 'sphere') {
          comparisons.push({ title: '球 vs 圆柱', text: '球没有平面，圆柱有两个圆形平面' });
          comparisons.push({ title: '球 vs 正方体', text: '球没有平面，正方体有6个平平的面' });
        }
        compareEl.innerHTML = comparisons.map(c => `<div class="compare-item"><strong>${c.title}</strong>${c.text}</div>`).join('');

        document.getElementById('explore-prev').disabled = currentIdx === 0;
        document.getElementById('explore-next').disabled = currentIdx === SHAPES.length - 1;
      }

      document.getElementById('explore-prev').addEventListener('click', () => {
        if (currentIdx > 0) { currentIdx--; renderExplore(); playSound('click'); }
      });
      document.getElementById('explore-next').addEventListener('click', () => {
        if (currentIdx < SHAPES.length - 1) { currentIdx++; renderExplore(); playSound('click'); }
      });

      renderExplore();
    })();

    // === 模式3: 分类游戏 ===
    (() => {
      let correct = 0, wrong = 0;
      let currentItem = null;
      let itemPool = [], sortLocked = false;

      const bins = [
        { id: 'cube', icon: '🧊', label: '正方体' },
        { id: 'cuboid', icon: '📦', label: '长方体' },
        { id: 'cylinder', icon: '🥫', label: '圆柱' },
        { id: 'sphere', icon: '⚽', label: '球' }
      ];

      const binsEl = document.getElementById('sort-bins');
      bins.forEach(bin => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'sort-bin';
        el.dataset.bin = bin.id;
        el.innerHTML = `<span class="bin-icon">${bin.icon}</span><span class="bin-label">${bin.label}</span>`;
        el.addEventListener('click', () => handleSort(bin.id, el));
        binsEl.appendChild(el);
      });

      function nextSortItem() {
        if (!itemPool.length) itemPool = shuffleArray(SORT_ITEMS.slice());
        currentItem = itemPool.pop();
        sortLocked = false;
        document.getElementById('sort-emoji').textContent = currentItem.emoji;
        document.getElementById('sort-name').textContent = currentItem.name;
        document.getElementById('sort-hint').textContent = '💡 ' + currentItem.hint;
        document.getElementById('sort-feedback').textContent = '';
        document.getElementById('sort-item').classList.add('pop-in');
        setTimeout(() => document.getElementById('sort-item').classList.remove('pop-in'), 400);
      }

      function handleSort(binId, binEl) {
        if (!currentItem || sortLocked) return;
        sortLocked = true;
        const isCorrect = binId === currentItem.answer;
        const feedbackEl = document.getElementById('sort-feedback');

        if (isCorrect) {
          correct++;
          streak++;
          binEl.classList.add('flash-correct');
          feedbackEl.innerHTML = `<span style="color:#34C759">✅ 对！${currentItem.name}是${SHAPES.find(s => s.id === binId).name}！</span>`;
          playSound('correct');
          bumpTotalCorrect();
        } else {
          wrong++;
          streak = 0;
          binEl.classList.add('flash-wrong');
          const correctShape = SHAPES.find(s => s.id === currentItem.answer);
          feedbackEl.innerHTML = `<span style="color:#FF3B30">❌ 不对哦，${currentItem.name}是${correctShape.name}！</span>`;
          playSound('wrong');
        }

        updateStreak();
        document.getElementById('sort-correct').textContent = correct;
        document.getElementById('sort-wrong').textContent = wrong;

        setTimeout(() => {
          binEl.classList.remove('flash-correct', 'flash-wrong');
          nextSortItem();
        }, 1500);
      }

      nextSortItem();
    })();

    // === 模式4: 闯关 ===
    (() => {
      let correct = 0, wrong = 0;
      let currentQ = null;
      let answered = false;

      function generateQuestion() {
        const type = Math.floor(Math.random() * 5);
        const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const visual = shape.svg.replace(/width="[^"]*"/, 'width="120"').replace(/height="[^"]*"/, 'height="100"');
        const makeOptions = (answer, wrongs) => shuffleOptions([
          { text: answer, correct: true }, ...wrongs.map(text => ({ text, correct: false }))
        ]);

        if (type === 0) {
          return {
            question: '图中是哪一种立体图形？', visual,
            options: shuffleOptions(SHAPES.map(s => ({ text: s.name, correct: s.id === shape.id }))),
            explain: `${shape.name}：${shape.desc}`
          };
        }
        if (type === 1) {
          // 只对多面体询问平面、直棱和顶点数；曲面与圆形边界另作说明。
          const poly = SHAPES[Math.floor(Math.random() * 2)];
          const props = [
            { label: '平面', value: poly.faces },
            { label: '直棱', value: poly.edges },
            { label: '顶点', value: poly.vertices }
          ];
          const prop = props[Math.floor(Math.random() * props.length)];
          const wrongs = [prop.value - 2, prop.value - 1, prop.value + 1];
          return {
            question: `${poly.name}有几个${prop.label}？`,
            visual: poly.svg.replace(/width="[^"]*"/, 'width="120"').replace(/height="[^"]*"/, 'height="100"'),
            options: makeOptions(`${prop.value}个`, wrongs.map(n => `${n}个`)),
            explain: `${poly.name}有${prop.value}个${prop.label}。`
          };
        }
        if (type === 2) {
          const choices = SHAPES.map(s => {
            const item = SORT_ITEMS.find(item => item.answer === s.id);
            return { text: `${item.emoji} ${item.name}`, correct: s.id === shape.id };
          });
          return {
            question: `下面哪个物品通常近似${shape.name}？（正方体单独归类）`, visual: '',
            options: shuffleOptions(choices), explain: `${choices.find(o => o.correct).text}通常近似${shape.name}。`
          };
        }
        if (type === 3) {
          const comparisons = [
            { q: '正方体和长方体有什么相同？', yes: '都有6个平面、12条直棱、8个顶点', no: ['正方体没有直棱', '长方体没有顶点', '长方体的棱一定全部等长'] },
            { q: '球和圆柱的平面有什么不同？', yes: '球没有平面，圆柱有2个圆形平面', no: ['球有2个平面', '圆柱没有平面', '两者都有6个平面'] },
            { q: '正方体和球的表面有什么不同？', yes: '正方体的面是平面，球的表面是曲面', no: ['球有6个平面', '正方体只有曲面', '两者表面完全一样'] },
            { q: '圆柱和长方体的表面有什么不同？', yes: '圆柱有曲面，长方体的面都是平面', no: ['长方体只有曲面', '圆柱没有平面', '长方体没有顶点'] }
          ];
          const item = comparisons[Math.floor(Math.random() * comparisons.length)];
          return { question: item.q, visual: '', options: makeOptions(item.yes, item.no), explain: item.yes };
        }
        const statements = {
          cube: ['6个面都是正方形', '只有曲面', '没有顶点', '只有2个平面'],
          cuboid: ['相对的面完全相同', '只有曲面', '没有直棱', '只有2个顶点'],
          cylinder: ['有2个圆形平面和1个曲面', '只有平面', '有8个顶点', '有6个正方形面'],
          sphere: ['表面是曲面，没有平面', '有2个圆形平面', '有8个顶点', '有6个正方形面']
        };
        const items = statements[shape.id];
        return { question: `关于${shape.name}，哪个说法正确？`, visual,
          options: makeOptions(items[0], items.slice(1)), explain: items[0] };
      }

      function shuffleOptions(opts) {
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return opts;
      }

      function showQuestion() {
        answered = false;
        currentQ = generateQuestion();
        document.getElementById('quiz-question').textContent = currentQ.question;
        document.getElementById('quiz-visual').innerHTML = currentQ.visual || '';
        document.getElementById('quiz-explain').textContent = '';

        const optsEl = document.getElementById('quiz-options');
        optsEl.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        currentQ.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt';
          btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt.text}</span>`;
          btn.addEventListener('click', () => {
            if (answered) return;
            answered = true;
            const isCorrect = opt.correct;
            if (isCorrect) {
              btn.classList.add('correct');
              correct++;
              streak++;
              playSound('correct');
              bumpTotalCorrect();
              document.getElementById('quiz-explain').innerHTML = `<span style="color:#34C759">✅ 答对啦！${currentQ.explain}</span>`;
            } else {
              btn.classList.add('wrong');
              wrong++;
              streak = 0;
              playSound('wrong');
              // Show correct answer
              optsEl.querySelectorAll('.quiz-opt').forEach((b, idx) => {
                if (currentQ.options[idx].correct) b.classList.add('correct');
              });
              document.getElementById('quiz-explain').innerHTML = `<span style="color:#FF3B30">❌ 答错了！${currentQ.explain}</span>`;
            }
            updateStreak();
            document.getElementById('quiz-correct').textContent = correct;
            document.getElementById('quiz-wrong').textContent = wrong;

            setTimeout(() => showQuestion(), 1500);
          });
          optsEl.appendChild(btn);
        });
      }

      showQuestion();
    })();
  </script>
</body>
</html>
