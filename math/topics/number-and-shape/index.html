<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数与形</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #F44336; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 方块拼图 - 数字用方块表示 */
    .block-area { text-align: center; padding: 24px 16px; }
    .block-display {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
      max-width: 320px; margin: 16px auto; padding: 16px;
      background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      min-height: 80px; align-items: center; align-content: center;
    }
    .block-unit {
      width: 28px; height: 28px; border-radius: 6px;
      background: linear-gradient(135deg, #F44336, #FF7043);
      animation: popIn 0.3s ease;
    }
    .block-number { font-size: 48px; font-weight: 800; color: #F44336; margin: 16px 0; }
    .block-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .block-opt {
      width: 72px; height: 72px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 32px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .block-opt:active { transform: scale(0.9); }
    .block-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .block-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式2: 图形规律 - 找规律填数 */
    .pattern-area { text-align: center; padding: 24px 16px; }
    .pattern-visual {
      display: flex; justify-content: center; align-items: flex-end; gap: 16px;
      margin: 20px auto; padding: 20px; background: white; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 360px;
    }
    .pattern-step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .pattern-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 80px; }
    .pattern-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, #F44336, #FF7043);
      animation: popIn 0.3s ease;
    }
    .pattern-num { font-size: 20px; font-weight: 700; color: #F44336; }
    .pattern-question { font-size: 18px; font-weight: 700; color: #1D1D1F; margin: 16px 0; padding: 12px; background: #FFEBEE; border-radius: 12px; }
    .pattern-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .pattern-opt {
      width: 72px; height: 72px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .pattern-opt:active { transform: scale(0.9); }
    .pattern-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .pattern-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式3: 乘法方块 - 用方块理解乘法 */
    .multiply-area { text-align: center; padding: 24px 16px; }
    .multiply-grid-wrap {
      margin: 16px auto; padding: 16px; background: white; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: inline-block;
    }
    .multiply-grid { display: inline-grid; gap: 3px; }
    .m-cell {
      width: 28px; height: 28px; border-radius: 4px;
      transition: all 0.3s ease;
    }
    .m-cell.filled { background: linear-gradient(135deg, #F44336, #FF7043); animation: popIn 0.3s ease; }
    .m-cell.empty { background: #F5F5F5; }
    .m-cell.highlight { background: linear-gradient(135deg, #FF9500, #FFB74D); transform: scale(1.1); }
    .multiply-expr { font-size: 36px; font-weight: 800; color: #F44336; margin: 16px 0; }
    .multiply-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .multiply-opt {
      width: 80px; height: 80px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .multiply-opt:active { transform: scale(0.9); }
    .multiply-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .multiply-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式4: 正方形数 - 完全平方数 */
    .square-area { text-align: center; padding: 24px 16px; }
    .square-grid-wrap {
      margin: 16px auto; padding: 16px; background: white; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: inline-block;
    }
    .square-grid { display: inline-grid; gap: 3px; }
    .s-cell {
      width: 24px; height: 24px; border-radius: 4px;
      background: linear-gradient(135deg, #F44336, #FF7043);
      animation: popIn 0.3s ease;
    }
    .square-info { font-size: 18px; font-weight: 600; color: #1D1D1F; margin: 12px 0; }
    .square-formula { font-size: 28px; font-weight: 800; color: #F44336; margin: 12px 0; }
    .square-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .square-opt {
      width: 80px; height: 80px; border: 3px solid #E0E0E0; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1D1D1F;
    }
    .square-opt:active { transform: scale(0.9); }
    .square-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .square-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* 模式5: 挑战模式 */
    .challenge-area { text-align: center; padding: 24px 16px; }
    .challenge-score { display: flex; justify-content: center; gap: 16px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .challenge-problem {
      font-size: 17px; font-weight: 700; color: #1D1D1F; margin: 16px 0;
      line-height: 1.6; padding: 16px; background: #FFEBEE; border-radius: 12px;
      white-space: pre-line; text-align: left;
    }
    .challenge-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 360px; margin: 16px auto; }
    .challenge-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white; border-radius: 16px;
      font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .challenge-opt:active { transform: scale(0.9); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-feedback { font-size: 20px; font-weight: 700; margin: 12px 0; min-height: 30px; }
    .stars { font-size: 24px; }

    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <a href="../../index.html" class="nav-back">←</a>
    <span class="nav-title">🔢 数与形</span>
    <span class="nav-sub">六年级</span>
  </nav>

  <div class="page-container">
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="blocks">🧱 方块数数</button>
      <button class="mode-tab" data-mode="pattern">🔍 图形规律</button>
      <button class="mode-tab" data-mode="multiply">✖️ 乘法方块</button>
      <button class="mode-tab" data-mode="square">⬛ 正方形数</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- ===== 模式1: 方块数数 ===== -->
    <div class="mode-content active" id="mode-blocks">
      <div class="block-area">
        <h3 class="section-title">🧱 方块数数</h3>
        <p class="section-desc">数一数有多少个方块，选出正确的数字</p>

        <div class="score-bar">
          <span>✅ <span id="blockCorrect">0</span></span>
          <span>❌ <span id="blockWrong">0</span></span>
          <span>📝 第 <span id="blockNum">1</span> 题</span>
        </div>

        <div class="block-display" id="blockDisplay"></div>
        <div class="result-text" id="blockFeedback"></div>
        <div class="block-options" id="blockOptions"></div>
      </div>
    </div>

    <!-- ===== 模式2: 图形规律 ===== -->
    <div class="mode-content" id="mode-pattern">
      <div class="pattern-area">
        <h3 class="section-title">🔍 图形规律</h3>
        <p class="section-desc">观察图形的变化规律，填出下一个数</p>

        <div class="score-bar">
          <span>✅ <span id="patternCorrect">0</span></span>
          <span>❌ <span id="patternWrong">0</span></span>
          <span>📝 第 <span id="patternNum">1</span> 题</span>
        </div>

        <div class="pattern-visual" id="patternVisual"></div>
        <div class="pattern-question" id="patternQuestion"></div>
        <div class="result-text" id="patternFeedback"></div>
        <div class="pattern-options" id="patternOptions"></div>
      </div>
    </div>

    <!-- ===== 模式3: 乘法方块 ===== -->
    <div class="mode-content" id="mode-multiply">
      <div class="multiply-area">
        <h3 class="section-title">✖️ 乘法方块</h3>
        <p class="section-desc">用方块理解乘法，算出一共有多少个</p>

        <div class="score-bar">
          <span>✅ <span id="multiplyCorrect">0</span></span>
          <span>❌ <span id="multiplyWrong">0</span></span>
          <span>📝 第 <span id="multiplyNum">1</span> 题</span>
        </div>

        <div class="multiply-grid-wrap" id="multiplyGridWrap"></div>
        <div class="multiply-expr" id="multiplyExpr"></div>
        <div class="result-text" id="multiplyFeedback"></div>
        <div class="multiply-options" id="multiplyOptions"></div>
      </div>
    </div>

    <!-- ===== 模式4: 正方形数 ===== -->
    <div class="mode-content" id="mode-square">
      <div class="square-area">
        <h3 class="section-title">⬛ 正方形数</h3>
        <p class="section-desc">完全平方数可以排成正方形，算算看！</p>

        <div class="score-bar">
          <span>✅ <span id="squareCorrect">0</span></span>
          <span>❌ <span id="squareWrong">0</span></span>
          <span>📝 第 <span id="squareNum">1</span> 题</span>
        </div>

        <div class="square-grid-wrap" id="squareGridWrap"></div>
        <div class="square-formula" id="squareFormula"></div>
        <div class="result-text" id="squareFeedback"></div>
        <div class="square-options" id="squareOptions"></div>
      </div>
    </div>

    <!-- ===== 模式5: 挑战 ===== -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <h3 class="section-title">🏆 数与形挑战</h3>
        <p class="section-desc">综合挑战，看看你能答对多少！</p>

        <div class="challenge-score">
          <span>✅ <span id="chCorrect">0</span></span>
          <span>❌ <span id="chWrong">0</span></span>
          <span class="stars" id="chStars"></span>
        </div>

        <div class="challenge-problem" id="chProblem"></div>
        <div class="challenge-feedback" id="chFeedback"></div>
        <div class="challenge-options" id="chOptions"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    // === Utility ===
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function uniqueOptions(correct, pool, count) {
      var opts = [correct];
      var seen = {};
      seen[correct] = true;
      var shuffled = shuffle(pool);
      for (var i = 0; i < shuffled.length && opts.length < count; i++) {
        if (!seen[shuffled[i]]) {
          opts.push(shuffled[i]);
          seen[shuffled[i]] = true;
        }
      }
      return shuffle(opts);
    }

    // === Mode tabs ===
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.getAttribute('data-mode')).classList.add('active');
      });
    });

    // === 模式1: 方块数数 ===
    var blockState = { correct: 0, wrong: 0, num: 1, answered: false };

    function generateBlockQuestion() {
      blockState.answered = false;
      document.getElementById('blockFeedback').textContent = '';

      var count = randInt(3, 20);
      var display = document.getElementById('blockDisplay');
      var html = '';
      for (var i = 0; i < count; i++) {
        html += '<div class="block-unit" style="animation-delay:' + (i * 0.05) + 's"></div>';
      }
      display.innerHTML = html;

      var pool = [];
      for (var n = Math.max(1, count - 5); n <= count + 5; n++) {
        if (n !== count) pool.push(n);
      }
      var options = uniqueOptions(count, pool, 4);

      var optHtml = '';
      options.forEach(function(opt) {
        optHtml += '<button class="block-opt" data-val="' + opt + '">' + opt + '</button>';
      });
      document.getElementById('blockOptions').innerHTML = optHtml;

      document.querySelectorAll('.block-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (blockState.answered) return;
          blockState.answered = true;
          var val = parseInt(btn.getAttribute('data-val'));
          if (val === count) {
            btn.classList.add('correct');
            blockState.correct++;
            document.getElementById('blockFeedback').textContent = '✅ 正确！一共有 ' + count + ' 个方块';
            document.getElementById('blockFeedback').style.color = '#34C759';
          } else {
            btn.classList.add('wrong');
            blockState.wrong++;
            document.getElementById('blockFeedback').textContent = '❌ 正确答案是 ' + count;
            document.getElementById('blockFeedback').style.color = '#FF3B30';
            document.querySelectorAll('.block-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-val')) === count) b.classList.add('correct');
            });
          }
          document.getElementById('blockCorrect').textContent = blockState.correct;
          document.getElementById('blockWrong').textContent = blockState.wrong;
          document.getElementById('blockNum').textContent = blockState.num + 1;
          setTimeout(function() { blockState.num++; generateBlockQuestion(); }, 1500);
        });
      });
    }
    generateBlockQuestion();

    // === 模式2: 图形规律 ===
    var patternState = { correct: 0, wrong: 0, num: 1, answered: false };

    function generatePatternQuestion() {
      patternState.answered = false;
      document.getElementById('patternFeedback').textContent = '';

      // Generate arithmetic sequence patterns
      var patternType = randInt(0, 2);
      var start, step, sequence, answer;

      if (patternType === 0) {
        // Simple addition: 1, 3, 5, 7, ?
        start = randInt(1, 5);
        step = randInt(2, 4);
        sequence = [];
        for (var i = 0; i < 4; i++) {
          sequence.push(start + i * step);
        }
        answer = start + 4 * step;
      } else if (patternType === 1) {
        // Doubling: 1, 2, 4, 8, ?
        start = randInt(1, 3);
        sequence = [];
        for (var i = 0; i < 4; i++) {
          sequence.push(start * Math.pow(2, i));
        }
        answer = start * Math.pow(2, 4);
      } else {
        // Square numbers: 1, 4, 9, 16, ?
        start = randInt(1, 2);
        sequence = [];
        for (var i = 0; i < 4; i++) {
          sequence.push((start + i) * (start + i));
        }
        answer = (start + 4) * (start + 4);
      }

      // Render visual
      var visual = document.getElementById('patternVisual');
      var html = '';
      for (var i = 0; i < sequence.length; i++) {
        html += '<div class="pattern-step">';
        html += '<div class="pattern-dots">';
        var dotCount = Math.min(sequence[i], 16);
        for (var d = 0; d < dotCount; d++) {
          html += '<div class="pattern-dot" style="animation-delay:' + (d * 0.03) + 's"></div>';
        }
        html += '</div>';
        html += '<div class="pattern-num">' + sequence[i] + '</div>';
        html += '</div>';
      }
      // Question mark step
      html += '<div class="pattern-step">';
      html += '<div class="pattern-dots" style="opacity:0.3">';
      for (var d = 0; d < 4; d++) {
        html += '<div class="pattern-dot" style="background:#9CA3AF"></div>';
      }
      html += '</div>';
      html += '<div class="pattern-num" style="color:#9CA3AF">?</div>';
      html += '</div>';
      visual.innerHTML = html;

      document.getElementById('patternQuestion').textContent = '找规律：下一个数是多少？';

      var pool = [];
      for (var n = Math.max(1, answer - 10); n <= answer + 10; n++) {
        if (n !== answer) pool.push(n);
      }
      var options = uniqueOptions(answer, pool, 4);

      var optHtml = '';
      options.forEach(function(opt) {
        optHtml += '<button class="pattern-opt" data-val="' + opt + '">' + opt + '</button>';
      });
      document.getElementById('patternOptions').innerHTML = optHtml;

      document.querySelectorAll('.pattern-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (patternState.answered) return;
          patternState.answered = true;
          var val = parseInt(btn.getAttribute('data-val'));
          if (val === answer) {
            btn.classList.add('correct');
            patternState.correct++;
            document.getElementById('patternFeedback').textContent = '✅ 正确！答案是 ' + answer;
            document.getElementById('patternFeedback').style.color = '#34C759';
          } else {
            btn.classList.add('wrong');
            patternState.wrong++;
            document.getElementById('patternFeedback').textContent = '❌ 正确答案是 ' + answer;
            document.getElementById('patternFeedback').style.color = '#FF3B30';
            document.querySelectorAll('.pattern-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-val')) === answer) b.classList.add('correct');
            });
          }
          document.getElementById('patternCorrect').textContent = patternState.correct;
          document.getElementById('patternWrong').textContent = patternState.wrong;
          document.getElementById('patternNum').textContent = patternState.num + 1;
          setTimeout(function() { patternState.num++; generatePatternQuestion(); }, 1500);
        });
      });
    }
    generatePatternQuestion();

    // === 模式3: 乘法方块 ===
    var multiplyState = { correct: 0, wrong: 0, num: 1, answered: false };

    function generateMultiplyQuestion() {
      multiplyState.answered = false;
      document.getElementById('multiplyFeedback').textContent = '';

      var rows = randInt(2, 6);
      var cols = randInt(2, 6);
      var answer = rows * cols;

      // Render grid
      var gridWrap = document.getElementById('multiplyGridWrap');
      var html = '<div class="multiply-grid" style="grid-template-columns:repeat(' + cols + ',28px);">';
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var delay = (r * cols + c) * 0.03;
          html += '<div class="m-cell filled" style="animation-delay:' + delay + 's"></div>';
        }
      }
      html += '</div>';
      gridWrap.innerHTML = html;

      document.getElementById('multiplyExpr').textContent = rows + ' × ' + cols + ' = ?';

      var pool = [];
      for (var n = Math.max(1, answer - 8); n <= answer + 8; n++) {
        if (n !== answer) pool.push(n);
      }
      var options = uniqueOptions(answer, pool, 4);

      var optHtml = '';
      options.forEach(function(opt) {
        optHtml += '<button class="multiply-opt" data-val="' + opt + '">' + opt + '</button>';
      });
      document.getElementById('multiplyOptions').innerHTML = optHtml;

      document.querySelectorAll('.multiply-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (multiplyState.answered) return;
          multiplyState.answered = true;
          var val = parseInt(btn.getAttribute('data-val'));
          if (val === answer) {
            btn.classList.add('correct');
            multiplyState.correct++;
            document.getElementById('multiplyFeedback').textContent = '✅ 正确！' + rows + ' × ' + cols + ' = ' + answer;
            document.getElementById('multiplyFeedback').style.color = '#34C759';
          } else {
            btn.classList.add('wrong');
            multiplyState.wrong++;
            document.getElementById('multiplyFeedback').textContent = '❌ 正确答案是 ' + answer;
            document.getElementById('multiplyFeedback').style.color = '#FF3B30';
            document.querySelectorAll('.multiply-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-val')) === answer) b.classList.add('correct');
            });
          }
          document.getElementById('multiplyCorrect').textContent = multiplyState.correct;
          document.getElementById('multiplyWrong').textContent = multiplyState.wrong;
          document.getElementById('multiplyNum').textContent = multiplyState.num + 1;
          setTimeout(function() { multiplyState.num++; generateMultiplyQuestion(); }, 1500);
        });
      });
    }
    generateMultiplyQuestion();

    // === 模式4: 正方形数 ===
    var squareState = { correct: 0, wrong: 0, num: 1, answered: false };

    function generateSquareQuestion() {
      squareState.answered = false;
      document.getElementById('squareFeedback').textContent = '';

      var n = randInt(2, 7);
      var answer = n * n;

      // Render square grid
      var gridWrap = document.getElementById('squareGridWrap');
      var html = '<div class="square-grid" style="grid-template-columns:repeat(' + n + ',24px);">';
      for (var i = 0; i < n * n; i++) {
        html += '<div class="s-cell" style="animation-delay:' + (i * 0.03) + 's"></div>';
      }
      html += '</div>';
      gridWrap.innerHTML = html;

      document.getElementById('squareFormula').textContent = n + '² = ?';

      var pool = [];
      for (var v = Math.max(1, answer - 10); v <= answer + 10; v++) {
        if (v !== answer) pool.push(v);
      }
      var options = uniqueOptions(answer, pool, 4);

      var optHtml = '';
      options.forEach(function(opt) {
        optHtml += '<button class="square-opt" data-val="' + opt + '">' + opt + '</button>';
      });
      document.getElementById('squareOptions').innerHTML = optHtml;

      document.querySelectorAll('.square-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (squareState.answered) return;
          squareState.answered = true;
          var val = parseInt(btn.getAttribute('data-val'));
          if (val === answer) {
            btn.classList.add('correct');
            squareState.correct++;
            document.getElementById('squareFeedback').textContent = '✅ 正确！' + n + '² = ' + answer;
            document.getElementById('squareFeedback').style.color = '#34C759';
          } else {
            btn.classList.add('wrong');
            squareState.wrong++;
            document.getElementById('squareFeedback').textContent = '❌ 正确答案是 ' + answer;
            document.getElementById('squareFeedback').style.color = '#FF3B30';
            document.querySelectorAll('.square-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-val')) === answer) b.classList.add('correct');
            });
          }
          document.getElementById('squareCorrect').textContent = squareState.correct;
          document.getElementById('squareWrong').textContent = squareState.wrong;
          document.getElementById('squareNum').textContent = squareState.num + 1;
          setTimeout(function() { squareState.num++; generateSquareQuestion(); }, 1500);
        });
      });
    }
    generateSquareQuestion();

    // === 模式5: 挑战 ===
    var chState = { correct: 0, wrong: 0, answered: false };

    var chQuestionTypes = [
      // 类型1: 方块总数
      function() {
        var a = randInt(3, 10);
        var b = randInt(3, 10);
        var answer = a + b;
        return {
          q: '第一排有 ' + a + ' 个方块，\n第二排有 ' + b + ' 个方块，\n两排一共有多少个？',
          opts: uniqueOptions(answer, Array.from({length: 20}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      },
      // 类型2: 乘法应用
      function() {
        var rows = randInt(2, 5);
        var cols = randInt(2, 5);
        var answer = rows * cols;
        return {
          q: '一个方阵有 ' + rows + ' 行 ' + cols + ' 列，\n一共有多少个格子？',
          opts: uniqueOptions(answer, Array.from({length: 30}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      },
      // 类型3: 完全平方数
      function() {
        var n = randInt(2, 6);
        var answer = n * n;
        return {
          q: n + ' 的平方（' + n + '²）是多少？\n提示：就是 ' + n + ' × ' + n,
          opts: uniqueOptions(answer, Array.from({length: 40}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      },
      // 类型4: 图形规律
      function() {
        var start = randInt(1, 5);
        var step = randInt(2, 5);
        var seq = [];
        for (var i = 0; i < 3; i++) {
          seq.push(start + i * step);
        }
        var answer = start + 3 * step;
        return {
          q: '找规律填数：\n' + seq.join(', ') + ', ?',
          opts: uniqueOptions(answer, Array.from({length: 30}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      },
      // 类型5: 数形结合 - 奇数求和
      function() {
        // 1+3+5+...+(2n-1) = n^2
        var n = randInt(2, 5);
        var terms = [];
        for (var i = 1; i <= n; i++) {
          terms.push(2 * i - 1);
        }
        var answer = n * n;
        return {
          q: '算一算：\n' + terms.join(' + ') + ' = ?',
          opts: uniqueOptions(answer, Array.from({length: 30}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      },
      // 类型6: 面积理解
      function() {
        var side = randInt(2, 6);
        var answer = side * side;
        return {
          q: '一个正方形的边长是 ' + side + ' 厘米，\n它的面积是多少平方厘米？',
          opts: uniqueOptions(answer, Array.from({length: 40}, function(_, i) { return i + 1; }).filter(function(n) { return n !== answer; }), 4),
          answer: answer
        };
      }
    ];

    function generateChallenge() {
      chState.answered = false;
      document.getElementById('chFeedback').textContent = '';

      var gen = chQuestionTypes[randInt(0, chQuestionTypes.length - 1)];
      var q = gen();

      document.getElementById('chProblem').textContent = q.q;

      var optHtml = '';
      q.opts.forEach(function(opt) {
        optHtml += '<button class="challenge-opt" data-val="' + opt + '">' + opt + '</button>';
      });
      document.getElementById('chOptions').innerHTML = optHtml;

      document.querySelectorAll('.challenge-opt').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (chState.answered) return;
          chState.answered = true;
          var val = parseInt(btn.getAttribute('data-val'));
          if (val === q.answer) {
            btn.classList.add('correct');
            chState.correct++;
            document.getElementById('chFeedback').textContent = '✅ 太棒了！';
            document.getElementById('chFeedback').style.color = '#34C759';
          } else {
            btn.classList.add('wrong');
            chState.wrong++;
            document.getElementById('chFeedback').textContent = '❌ 正确答案：' + q.answer;
            document.getElementById('chFeedback').style.color = '#FF3B30';
            document.querySelectorAll('.challenge-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-val')) === q.answer) b.classList.add('correct');
            });
          }
          document.getElementById('chCorrect').textContent = chState.correct;
          document.getElementById('chWrong').textContent = chState.wrong;
          var total = chState.correct + chState.wrong;
          var starCount = total >= 10 ? (chState.correct >= 9 ? 3 : chState.correct >= 7 ? 2 : 1) : '';
          document.getElementById('chStars').textContent = starCount === 3 ? '⭐⭐⭐' : starCount === 2 ? '⭐⭐' : starCount === 1 ? '⭐' : '';
          setTimeout(function() { generateChallenge(); }, 1500);
        });
      });
    }
    generateChallenge();

  })();
  </script>
</body>
</html>
