<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识平均分</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 模式1: 认识平均分 */
    .learn-area { text-align: center; padding: 24px 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .learn-title { font-size: 22px; font-weight: 700; color: #4A90D9; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.6; }
    .learn-emoji { font-size: 60px; margin: 16px 0; }
    .learn-feature {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
    }
    .feature-tag {
      padding: 8px 16px; border-radius: 12px; font-size: 15px; font-weight: 600;
      background: rgba(74,144,217,0.1); color: #4A90D9;
    }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #4A90D9; color: white; box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* 模式2: 判断平均分 */
    .judge-area { text-align: center; padding: 24px 16px; }
    .judge-problem { font-size: 18px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .judge-items {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0;
    }
    .judge-group {
      background: white; border-radius: 16px; padding: 16px; min-width: 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;
    }
    .judge-group .group-emoji { font-size: 28px; letter-spacing: 2px; }
    .judge-group .group-count { font-size: 14px; color: #6E6E73; margin-top: 4px; }
    .judge-options { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
    .judge-opt {
      padding: 14px 32px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .judge-opt:active { transform: scale(0.95); }
    .judge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .judge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .judge-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .judge-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式3: 分一分 */
    .share-area { text-align: center; padding: 24px 16px; }
    .share-problem { font-size: 18px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .share-items {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 20px 0;
      font-size: 32px;
    }
    .share-item {
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer; transition: all 0.2s ease;
    }
    .share-item:active { transform: scale(0.9); }
    .share-item.selected { background: rgba(74,144,217,0.2); border: 2px solid #4A90D9; }
    .share-groups {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0;
    }
    .share-group {
      min-width: 100px; min-height: 100px; background: white; border-radius: 16px;
      padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 2px dashed #E5E5EA;
    }
    .share-group .group-label { font-size: 14px; color: #6E6E73; margin-bottom: 8px; }
    .share-group .group-items { display: flex; gap: 4px; flex-wrap: wrap; font-size: 24px; }
    .share-options { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .share-opt {
      padding: 12px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .share-opt:active { transform: scale(0.95); }
    .share-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .share-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .share-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .share-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式4: 填一填 */
    .fill-area { text-align: center; padding: 24px 16px; }
    .fill-problem { font-size: 18px; font-weight: 600; margin: 16px 0; color: #1D1D1F; line-height: 1.6; }
    .fill-visual {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 28px; letter-spacing: 4px;
    }
    .fill-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .fill-opt {
      width: 60px; height: 60px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #4A90D9;
      display: flex; align-items: center; justify-content: center;
    }
    .fill-opt:active { transform: scale(0.95); }
    .fill-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .fill-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .fill-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .fill-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <a href="../../index.html" class="nav-back">← 返回</a>
      <span class="nav-title">认识平均分</span>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">📖 学一学</button>
      <button class="mode-tab" data-mode="judge">✅ 判一判</button>
      <button class="mode-tab" data-mode="share">🍎 分一分</button>
      <button class="mode-tab" data-mode="fill">✏️ 填一填</button>
    </div>

    <!-- 模式1: 学一学 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card">
          <div class="learn-emoji">🍎🍎🍎🍎🍎🍎</div>
          <div class="learn-title">什么是平均分？</div>
          <div class="learn-desc">
            把一些物品<b>分成几份</b>，如果<b>每份都一样多</b>，<br>
            这就叫做<b style="color:#4A90D9">平均分</b>。
          </div>
          <div class="learn-feature">
            <span class="feature-tag">每份同样多</span>
            <span class="feature-tag">公平分配</span>
          </div>
        </div>

        <div class="learn-card">
          <div class="learn-title">例子</div>
          <div class="learn-desc">
            6个苹果，平均分给2个小朋友：<br>
            <span style="font-size:32px">🍎🍎🍎</span> | <span style="font-size:32px">🍎🍎🍎</span><br>
            每人分得 <b style="color:#4A90D9">3个</b>，这就是平均分！
          </div>
        </div>

        <div class="learn-card">
          <div class="learn-title">不是平均分</div>
          <div class="learn-desc">
            6个苹果，一个分2个，一个分4个：<br>
            <span style="font-size:32px">🍎🍎</span> | <span style="font-size:32px">🍎🍎🍎🍎</span><br>
            每份不一样多，<b style="color:#FF3B30">不是平均分</b>！
          </div>
        </div>

        <div class="learn-nav">
          <button class="learn-btn primary" onclick="switchMode('judge')">开始练习 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 判一判 -->
    <div class="mode-content" id="mode-judge">
      <div class="judge-area">
        <div class="judge-score">
          <span>✅ 正确: <b id="judge-correct">0</b></span>
          <span>❌ 错误: <b id="judge-wrong">0</b></span>
        </div>
        <div class="judge-problem" id="judge-question">下面的分法是平均分吗？</div>
        <div class="judge-items" id="judge-items"></div>
        <div class="judge-options">
          <button class="judge-opt" data-answer="yes">✅ 是平均分</button>
          <button class="judge-opt" data-answer="no">❌ 不是</button>
        </div>
        <div class="judge-feedback" id="judge-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 分一分 -->
    <div class="mode-content" id="mode-share">
      <div class="share-area">
        <div class="share-score">
          <span>✅ 正确: <b id="share-correct">0</b></span>
          <span>❌ 错误: <b id="share-wrong">0</b></span>
        </div>
        <div class="share-problem" id="share-question">把8个苹果平均分成2份，每份几个？</div>
        <div class="share-items" id="share-items"></div>
        <div class="share-options" id="share-options"></div>
        <div class="share-feedback" id="share-feedback"></div>
      </div>
    </div>

    <!-- 模式4: 填一填 -->
    <div class="mode-content" id="mode-fill">
      <div class="fill-area">
        <div class="fill-score">
          <span>✅ 正确: <b id="fill-correct">0</b></span>
          <span>❌ 错误: <b id="fill-wrong">0</b></span>
        </div>
        <div class="fill-problem" id="fill-question"></div>
        <div class="fill-visual" id="fill-visual"></div>
        <div class="fill-options" id="fill-options"></div>
        <div class="fill-feedback" id="fill-feedback"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('mode-' + this.dataset.mode).classList.add('active');
        if (this.dataset.mode === 'judge') nextJudge();
        if (this.dataset.mode === 'share') nextShare();
        if (this.dataset.mode === 'fill') nextFill();
      });
    });

    function switchMode(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => {
        t.classList.remove('active');
        if (t.dataset.mode === mode) t.classList.add('active');
      });
      document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
      document.getElementById('mode-' + mode).classList.add('active');
      if (mode === 'judge') nextJudge();
      if (mode === 'share') nextShare();
      if (mode === 'fill') nextFill();
    }

    // ========== 模式2: 判一判 ==========
    let judgeCorrect = 0, judgeWrong = 0;
    let currentJudgeAnswer = null;

    function nextJudge() {
      const total = Math.floor(Math.random() * 5) + 4; // 4-8
      const groups = Math.floor(Math.random() * 3) + 2; // 2-4
      const isAverage = Math.random() < 0.5;
      
      let items = [];
      if (isAverage) {
        const perGroup = Math.floor(total / groups);
        if (perGroup * groups !== total) {
          // 调整使其可平均分
          const newTotal = perGroup * groups;
          for (let i = 0; i < groups; i++) {
            items.push(newTotal / groups);
          }
        } else {
          for (let i = 0; i < groups; i++) {
            items.push(perGroup);
          }
        }
      } else {
        // 不均匀分
        let remaining = total;
        for (let i = 0; i < groups - 1; i++) {
          const max = Math.max(1, remaining - (groups - i - 1));
          const val = Math.floor(Math.random() * max) + 1;
          items.push(val);
          remaining -= val;
        }
        items.push(remaining);
        // 确保不是平均分
        const allSame = items.every(v => v === items[0]);
        if (allSame) {
          items[0]++;
          items[items.length - 1]--;
        }
      }

      currentJudgeAnswer = isAverage;
      
      const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🍑', '🍐'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      
      const container = document.getElementById('judge-items');
      container.innerHTML = '';
      items.forEach(count => {
        const group = document.createElement('div');
        group.className = 'judge-group';
        group.innerHTML = `
          <div class="group-emoji">${emoji.repeat(Math.min(count, 5))}</div>
          <div class="group-count">${count}个</div>
        `;
        container.appendChild(group);
      });

      document.getElementById('judge-feedback').textContent = '';
      document.querySelectorAll('.judge-opt').forEach(opt => {
        opt.classList.remove('correct', 'wrong');
        opt.disabled = false;
      });
    }

    document.querySelectorAll('.judge-opt').forEach(opt => {
      opt.addEventListener('click', function() {
        const answer = this.dataset.answer === 'yes';
        const isCorrect = answer === currentJudgeAnswer;
        
        document.querySelectorAll('.judge-opt').forEach(o => o.disabled = true);
        
        if (isCorrect) {
          this.classList.add('correct');
          document.getElementById('judge-feedback').textContent = '✅ 答对了！';
          document.getElementById('judge-feedback').style.color = '#34C759';
          judgeCorrect++;
        } else {
          this.classList.add('wrong');
          document.getElementById('judge-feedback').textContent = currentJudgeAnswer ? '❌ 这是平均分哦' : '❌ 这不是平均分';
          document.getElementById('judge-feedback').style.color = '#FF3B30';
          judgeWrong++;
        }
        
        document.getElementById('judge-correct').textContent = judgeCorrect;
        document.getElementById('judge-wrong').textContent = judgeWrong;
        
        setTimeout(nextJudge, 1500);
      });
    });

    // ========== 模式3: 分一分 ==========
    let shareCorrect = 0, shareWrong = 0;
    let currentShareAnswer = 0;

    function nextShare() {
      const total = (Math.floor(Math.random() * 4) + 2) * 2; // 4,6,8,10
      const groups = Math.floor(Math.random() * 3) + 2; // 2-4
      const perGroup = total / groups;
      
      if (!Number.isInteger(perGroup)) {
        // 重新生成
        nextShare();
        return;
      }
      
      currentShareAnswer = perGroup;
      
      const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      
      document.getElementById('share-question').textContent = `把${total}个${emoji.slice(0,2)}平均分成${groups}份，每份几个？`;
      
      const itemsContainer = document.getElementById('share-items');
      itemsContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const item = document.createElement('span');
        item.className = 'share-item';
        item.textContent = emoji;
        itemsContainer.appendChild(item);
      }
      
      // 生成选项
      const options = new Set([perGroup]);
      while (options.size < 4) {
        const wrong = Math.floor(Math.random() * (total / 2)) + 1;
        if (wrong !== perGroup) options.add(wrong);
      }
      
      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('share-options');
      optionsContainer.innerHTML = '';
      shuffled.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'share-opt';
        btn.textContent = val + '个';
        btn.dataset.value = val;
        optionsContainer.appendChild(btn);
      });
      
      document.getElementById('share-feedback').textContent = '';
      document.querySelectorAll('.share-opt').forEach(opt => {
        opt.classList.remove('correct', 'wrong');
        opt.disabled = false;
      });
    }

    document.getElementById('share-options').addEventListener('click', function(e) {
      if (e.target.classList.contains('share-opt')) {
        const value = parseInt(e.target.dataset.value);
        const isCorrect = value === currentShareAnswer;
        
        document.querySelectorAll('.share-opt').forEach(o => o.disabled = true);
        
        if (isCorrect) {
          e.target.classList.add('correct');
          document.getElementById('share-feedback').textContent = '✅ 答对了！';
          document.getElementById('share-feedback').style.color = '#34C759';
          shareCorrect++;
        } else {
          e.target.classList.add('wrong');
          document.getElementById('share-feedback').textContent = `❌ 每份应该是${currentShareAnswer}个`;
          document.getElementById('share-feedback').style.color = '#FF3B30';
          shareWrong++;
        }
        
        document.getElementById('share-correct').textContent = shareCorrect;
        document.getElementById('share-wrong').textContent = shareWrong;
        
        setTimeout(nextShare, 1500);
      }
    });

    // ========== 模式4: 填一填 ==========
    let fillCorrect = 0, fillWrong = 0;
    let currentFillAnswer = 0;

    function nextFill() {
      const total = (Math.floor(Math.random() * 4) + 2) * (Math.floor(Math.random() * 3) + 2);
      const groups = Math.floor(Math.random() * 3) + 2;
      const perGroup = total / groups;
      
      if (!Number.isInteger(perGroup)) {
        nextFill();
        return;
      }
      
      currentFillAnswer = perGroup;
      
      const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      
      // 生成题目
      const questionType = Math.floor(Math.random() * 3);
      let question = '', visual = '';
      
      if (questionType === 0) {
        question = `${total}个${emoji.slice(0,2)}，平均分成${groups}份，每份是（）个`;
        visual = emoji.repeat(total);
      } else if (questionType === 1) {
        question = `${total}个${emoji.slice(0,2)}，每份${perGroup}个，可以分成（）份`;
        visual = emoji.repeat(total);
        currentFillAnswer = groups;
      } else {
        question = `每份${perGroup}个，分成${groups}份，一共有（）个${emoji.slice(0,2)}`;
        visual = Array(groups).fill(emoji.repeat(perGroup)).join(' | ');
        currentFillAnswer = total;
      }
      
      document.getElementById('fill-question').textContent = question;
      document.getElementById('fill-visual').textContent = visual;
      
      // 生成选项
      const options = new Set([currentFillAnswer]);
      while (options.size < 4) {
        const offset = Math.floor(Math.random() * 5) - 2;
        const wrong = currentFillAnswer + offset;
        if (wrong > 0 && wrong !== currentFillAnswer) options.add(wrong);
      }
      
      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('fill-options');
      optionsContainer.innerHTML = '';
      shuffled.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'fill-opt';
        btn.textContent = val;
        btn.dataset.value = val;
        optionsContainer.appendChild(btn);
      });
      
      document.getElementById('fill-feedback').textContent = '';
      document.querySelectorAll('.fill-opt').forEach(opt => {
        opt.classList.remove('correct', 'wrong');
        opt.disabled = false;
      });
    }

    document.getElementById('fill-options').addEventListener('click', function(e) {
      if (e.target.classList.contains('fill-opt')) {
        const value = parseInt(e.target.dataset.value);
        const isCorrect = value === currentFillAnswer;
        
        document.querySelectorAll('.fill-opt').forEach(o => o.disabled = true);
        
        if (isCorrect) {
          e.target.classList.add('correct');
          document.getElementById('fill-feedback').textContent = '✅ 答对了！';
          document.getElementById('fill-feedback').style.color = '#34C759';
          fillCorrect++;
        } else {
          e.target.classList.add('wrong');
          document.getElementById('fill-feedback').textContent = `❌ 正确答案是${currentFillAnswer}`;
          document.getElementById('fill-feedback').style.color = '#FF3B30';
          fillWrong++;
        }
        
        document.getElementById('fill-correct').textContent = fillCorrect;
        document.getElementById('fill-wrong').textContent = fillWrong;
        
        setTimeout(nextFill, 1500);
      }
    });

    // 初始化
    nextJudge();
    nextShare();
    nextFill();
  </script>
</body>
</html>
