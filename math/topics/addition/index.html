<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>10以内加减法</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs {
      display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .mode-tab {
      flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA;
      border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 合并模式 */
    .merge-area { text-align: center; padding: 24px 16px; }
    .merge-visual {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin: 24px 0; flex-wrap: wrap;
    }
    .merge-group {
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
      min-height: 48px; padding: 12px; background: rgba(74,144,217,0.05);
      border-radius: 16px; min-width: 80px;
    }
    .merge-obj { font-size: 36px; animation: popIn 0.3s ease both; }
    .merge-op { font-size: 48px; font-weight: 700; color: #4A90D9; }
    .merge-eq { font-size: 48px; font-weight: 700; color: #FF9500; }
    .merge-result {
      font-size: 72px; font-weight: 800; color: #34C759;
      min-width: 100px;
    }

    /* 凑十模式 */
    .make10-area { text-align: center; padding: 24px 16px; }
    .make10-problem {
      font-size: 48px; font-weight: 700; color: #4A90D9; margin: 16px 0;
    }
    .make10-visual {
      display: flex; justify-content: center; gap: 8px; margin: 24px 0;
    }
    .make10-box {
      width: 60px; height: 60px; border: 3px solid #E5E5EA;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; transition: all 0.3s ease;
    }
    .make10-box.filled { border-color: #4A90D9; background: rgba(74,144,217,0.1); }
    .make10-box.highlight { border-color: #FF9500; background: rgba(255,149,0,0.15); transform: scale(1.1); }
    .make10-ten-box {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 6px; padding: 12px; background: rgba(255,149,0,0.05);
      border: 3px dashed #FF9500; border-radius: 16px; margin: 16px auto;
      max-width: 340px;
    }
    .make10-slot {
      aspect-ratio: 1; border: 2px solid #E5E5EA; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; transition: all 0.3s ease;
    }
    .make10-slot.filled { border-color: #FF9500; background: rgba(255,149,0,0.15); }
    .make10-options { display: flex; justify-content: center; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .make10-opt {
      width: 64px; height: 64px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 28px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .make10-opt:active { transform: scale(0.9); }
    .make10-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); }
    .make10-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }

    /* 竖式模式 */
    .vertical-area { text-align: center; padding: 24px 16px; }
    .vertical-problem {
      display: inline-block; font-size: 48px; font-weight: 700;
      font-family: 'Courier New', monospace; text-align: right;
      margin: 24px auto; padding: 24px 32px; background: #FFFBEB;
      border-radius: 16px; border: 2px solid #F59E0B;
    }
    .vertical-problem .v-line { border-top: 3px solid #1D1D1F; margin: 4px 0; }
    .vertical-problem .v-op { color: #4A90D9; }
    .vertical-problem .v-result { color: #34C759; }
    .vertical-step {
      font-size: 18px; color: #6E6E73; margin: 12px 0;
      padding: 8px 16px; background: #F0F4FF; border-radius: 8px;
      display: none;
    }
    .vertical-step.show { display: block; animation: fadeInUp 0.3s ease; }

    /* 练习模式 */
    .practice-area { text-align: center; padding: 24px 16px; }
    .practice-problem {
      font-size: 56px; font-weight: 800; color: #4A90D9; margin: 24px 0;
    }
    .practice-input {
      display: flex; justify-content: center; align-items: center; gap: 16px; margin: 24px 0;
    }
    .practice-answer {
      width: 100px; height: 72px; border: 3px solid #E5E5EA; border-radius: 16px;
      font-size: 40px; font-weight: 700; text-align: center; color: #4A90D9;
      outline: none; transition: border-color 0.2s ease;
    }
    .practice-answer:focus { border-color: #4A90D9; }
    .practice-answer.correct { border-color: #34C759; background: rgba(52,199,89,0.1); }
    .practice-answer.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); }
    .practice-emoji {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 4px; margin: 16px 0;
    }
    .practice-obj { font-size: 28px; animation: popIn 0.2s ease both; }

    /* 连续答对 */
    .score-display {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; padding: 12px; font-size: 18px; font-weight: 600;
    }
    .score-stars { font-size: 24px; }
    .diff-badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 14px; font-weight: 600;
    }
    .diff-easy { background: rgba(52,199,89,0.15); color: #34C759; }
    .diff-medium { background: rgba(255,149,0,0.15); color: #FF9500; }

    @media (max-width: 480px) {
      .merge-obj { font-size: 28px; }
      .merge-op, .merge-eq { font-size: 36px; }
      .practice-problem { font-size: 40px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><a href="../index.html" class="breadcrumb-item">📐 数学</a><span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">➕ 10以内加减法</span>
      
    </nav>

    <div class="score-display">
      <span class="diff-badge diff-easy" id="diff-badge">简单</span>
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="merge">🍎 合并</button>
      <button class="mode-tab" data-mode="make10">🔟 凑十</button>
      <button class="mode-tab" data-mode="vertical">📝 竖式</button>
      <button class="mode-tab" data-mode="practice">✏️ 练习</button>
    </div>

    <!-- 模式1: 合并计数 -->
    <div class="mode-content active" id="mode-merge">
      <div class="card">
        <p class="page-subtitle">看看两部分合起来有多少</p>
        <div class="merge-area">
          <div class="merge-visual" id="merge-visual"></div>
          <div class="action-bar">
            <button class="btn btn-primary btn-large" id="btn-new-merge">🎲 换一个</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 凑十法 -->
    <div class="mode-content" id="mode-make10">
      <div class="card">
        <p class="page-subtitle">再加几个可以凑成10？</p>
        <div class="make10-area">
          <div class="make10-problem" id="make10-problem"></div>
          <div class="make10-ten-box" id="make10-box"></div>
          <p style="font-size:16px;color:#6E6E73" id="make10-hint"></p>
          <div class="make10-options" id="make10-options"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 竖式计算 -->
    <div class="mode-content" id="mode-vertical">
      <div class="card">
        <p class="page-subtitle">一步一步学竖式计算</p>
        <div class="vertical-area">
          <div class="vertical-problem" id="vertical-problem"></div>
          <div id="vertical-steps"></div>
          <div class="action-bar">
            <button class="btn btn-primary" id="btn-next-step">👉 下一步</button>
            <button class="btn btn-warning" id="btn-new-vertical">🎲 换一个</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 自由练习 -->
    <div class="mode-content" id="mode-practice">
      <div class="card">
        <p class="page-subtitle">算一算，填答案</p>
        <div class="practice-area">
          <div class="practice-problem" id="practice-problem"></div>
          <div class="practice-emoji" id="practice-emoji"></div>
          <div class="practice-input">
            <input type="tel" class="practice-answer" id="practice-answer" maxlength="2" inputmode="numeric" autocomplete="off">
          </div>
          <div class="action-bar">
            <button class="btn btn-primary btn-large" id="btn-check-answer">✅ 检查</button>
            <button class="btn btn-warning" id="btn-new-practice">🎲 换一个</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    // 面包屑导航已替代返回按钮

    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！太厉害了！`);
    }

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    const emojis = ['🍎','🍊','🍋','🍇','🍓','🌟','🎈','🐱','🐶','🦋','🌸','🎀'];

    // === 模式1: 合并 ===
    function newMerge() {
      const a = Random.int(1, 5);
      const b = Random.int(1, 10 - a);
      const em = Random.pick(emojis);
      const v = document.getElementById('merge-visual');
      v.innerHTML = '';
      // 左边
      const g1 = document.createElement('div');
      g1.className = 'merge-group';
      for (let i = 0; i < a; i++) {
        const s = document.createElement('span');
        s.className = 'merge-obj'; s.textContent = em;
        s.style.animationDelay = (i * 0.08) + 's';
        g1.appendChild(s);
      }
      v.appendChild(g1);
      // 加号
      const op = document.createElement('span');
      op.className = 'merge-op'; op.textContent = '+';
      v.appendChild(op);
      // 右边
      const g2 = document.createElement('div');
      g2.className = 'merge-group';
      for (let i = 0; i < b; i++) {
        const s = document.createElement('span');
        s.className = 'merge-obj'; s.textContent = em;
        s.style.animationDelay = ((a + i) * 0.08) + 's';
        g2.appendChild(s);
      }
      v.appendChild(g2);
      // 等号
      const eq = document.createElement('span');
      eq.className = 'merge-eq'; eq.textContent = '=';
      v.appendChild(eq);
      // 结果
      const res = document.createElement('span');
      res.className = 'merge-result';
      res.textContent = a + b;
      Animator.popIn(res, 400);
      v.appendChild(res);
      // 下面显示算式
      const formula = document.createElement('div');
      formula.style.cssText = 'font-size:24px;font-weight:700;color:#4A90D9;margin-top:16px';
      formula.textContent = `${a} + ${b} = ${a + b}`;
      Animator.popIn(formula, 600);
      v.appendChild(formula);
    }
    document.getElementById('btn-new-merge').addEventListener('click', newMerge);
    newMerge();

    // === 模式2: 凑十 ===
    (() => {
      let given, need;
      function newMake10() {
        given = Random.int(1, 9);
        need = 10 - given;
        document.getElementById('make10-problem').textContent = `${given} + ? = 10`;
        // 10格框
        const box = document.getElementById('make10-box');
        box.innerHTML = '';
        for (let i = 0; i < 10; i++) {
          const slot = document.createElement('div');
          slot.className = 'make10-slot';
          if (i < given) {
            slot.classList.add('filled');
            slot.textContent = '🔵';
          }
          box.appendChild(slot);
        }
        document.getElementById('make10-hint').textContent = `已经有 ${given} 个，再加几个变成 10 个？`;
        // 选项
        const opts = document.getElementById('make10-options');
        opts.innerHTML = '';
        const choices = [need];
        while (choices.length < 4) {
          const c = Random.int(1, 9);
          if (!choices.includes(c)) choices.push(c);
        }
        Random.shuffle(choices).forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'make10-opt'; btn.textContent = c;
          btn.addEventListener('click', () => {
            if (c === need) {
              btn.classList.add('correct');
              streak++; Sound.play('correct'); celebrate();
              updateStreak();
              // 高亮凑满的格子
              box.querySelectorAll('.make10-slot').forEach((s, i) => {
                if (i >= given) {
                  s.classList.add('filled');
                  s.textContent = '🟠';
                  s.style.animationDelay = ((i - given) * 0.1) + 's';
                }
              });
              document.getElementById('make10-hint').textContent = `🎉 ${given} + ${need} = 10！凑成了！`;
              document.getElementById('make10-hint').style.color = '#34C759';
              setTimeout(() => {
                document.getElementById('make10-hint').style.color = '';
                newMake10();
              }, 1500);
            } else {
              btn.classList.add('wrong');
              Animator.shake(btn);
              streak = 0; Sound.play('wrong'); updateStreak();
              showToast(`再想想，${given} 加多少等于 10？`);
            }
          });
          opts.appendChild(btn);
        });
      }
      newMake10();
    })();

    // === 模式3: 竖式 ===
    (() => {
      let a, b, result, steps = [], stepIdx = 0;
      function newVertical() {
        a = Random.int(1, 9); b = Random.int(1, 10 - a);
        result = a + b;
        stepIdx = 0;
        const p = document.getElementById('vertical-problem');
        p.innerHTML = `
          <div style="padding-right:8px">${a}</div>
          <div style="display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
            <span class="v-op">+</span><span>${b}</span>
          </div>
          <div class="v-line"></div>
          <div class="v-result" id="v-answer" style="padding-right:8px;opacity:0">?</div>
        `;
        steps = [
          { text: `第一步：把 ${a} 和 ${b} 写对齐`, ok: true },
          { text: `第二步：从个位开始算，${a} + ${b}`, ok: true },
          { text: `第三步：${a} + ${b} = ${result}`, ok: true },
          { text: `🎉 答案是 ${result}！`, ok: true }
        ];
        const sc = document.getElementById('vertical-steps');
        sc.innerHTML = '';
        steps.forEach(s => {
          const d = document.createElement('div');
          d.className = 'vertical-step'; d.textContent = s.text;
          sc.appendChild(d);
        });
        document.getElementById('v-answer').style.opacity = '0';
        document.getElementById('btn-next-step').disabled = false;
        document.getElementById('btn-next-step').textContent = '👉 下一步';
      }
      document.getElementById('btn-next-step').addEventListener('click', () => {
        if (stepIdx >= steps.length) return;
        const allSteps = document.querySelectorAll('.vertical-step');
        allSteps[stepIdx].classList.add('show');
        stepIdx++;
        if (stepIdx === 4) {
          const ans = document.getElementById('v-answer');
          ans.textContent = result;
          ans.style.opacity = '1';
          Animator.popIn(ans);
          celebrate();
          document.getElementById('btn-next-step').textContent = '✅ 完成';
          document.getElementById('btn-next-step').disabled = true;
        }
        Sound.play('click');
      });
      document.getElementById('btn-new-vertical').addEventListener('click', newVertical);
      newVertical();
    })();

    // === 模式4: 自由练习 ===
    (() => {
      let a, b, op, answer;
      function newPractice() {
        op = Math.random() < 0.5 ? '+' : '-';
        if (op === '+') {
          a = Random.int(1, 5); b = Random.int(1, 10 - a);
          answer = a + b;
        } else {
          a = Random.int(2, 10); b = Random.int(1, a);
          answer = a - b;
        }
        document.getElementById('practice-problem').textContent = `${a} ${op} ${b} = ?`;
        // emoji展示
        const em = Random.pick(emojis);
        const emojiEl = document.getElementById('practice-emoji');
        emojiEl.innerHTML = '';
        if (op === '+') {
          for (let i = 0; i < a; i++) {
            const s = document.createElement('span');
            s.className = 'practice-obj'; s.textContent = em;
            s.style.animationDelay = (i * 0.05) + 's';
            emojiEl.appendChild(s);
          }
          const plus = document.createElement('span');
          plus.className = 'practice-obj'; plus.textContent = ' ➕ ';
          emojiEl.appendChild(plus);
          for (let i = 0; i < b; i++) {
            const s = document.createElement('span');
            s.className = 'practice-obj'; s.textContent = em;
            s.style.animationDelay = ((a + 1 + i) * 0.05) + 's';
            emojiEl.appendChild(s);
          }
        } else {
          for (let i = 0; i < a; i++) {
            const s = document.createElement('span');
            s.className = 'practice-obj'; s.textContent = em;
            s.style.animationDelay = (i * 0.05) + 's';
            if (i >= a - b) s.style.opacity = '0.3';
            emojiEl.appendChild(s);
          }
        }
        const inp = document.getElementById('practice-answer');
        inp.value = ''; inp.className = 'practice-answer'; inp.focus();
      }
      function checkAnswer() {
        const inp = document.getElementById('practice-answer');
        const val = parseInt(inp.value);
        if (val === answer) {
          inp.className = 'practice-answer correct';
          streak++; Sound.play('correct'); celebrate();
          updateStreak();
          showToast('🎉 答对了！');
          setTimeout(newPractice, 1200);
        } else {
          inp.className = 'practice-answer wrong';
          Animator.shake(inp);
          streak = 0; Sound.play('wrong'); updateStreak();
          showToast(`不对哦，再算算看`);
          inp.value = ''; inp.focus();
        }
      }
      document.getElementById('btn-check-answer').addEventListener('click', checkAnswer);
      document.getElementById('practice-answer').addEventListener('keydown', e => {
        if (e.key === 'Enter') checkAnswer();
      });
      document.getElementById('btn-new-practice').addEventListener('click', newPractice);
      newPractice();
    })();
  </script>
</body>
</html>
