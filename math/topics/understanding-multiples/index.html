<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识倍</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #E91E63; color: white; }

    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }

    /* === 模式1: 认识概念 === */
    .concept-area { text-align: center; padding: 20px 16px; }
    .concept-intro { font-size: 18px; font-weight: 600; color: #1D1D1F; line-height: 1.8; margin: 12px 0; }
    .concept-intro strong { color: #E91E63; }

    .demo-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
    .demo-group {
      display: flex; flex-direction: column; align-items: center; padding: 16px;
      background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-width: 100px;
    }
    .demo-group .group-label { font-size: 14px; font-weight: 600; color: #6E6E73; margin-bottom: 8px; }
    .demo-group .group-items { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .demo-group .item { font-size: 28px; }
    .demo-arrow { font-size: 32px; color: #E91E63; font-weight: 700; }
    .demo-result {
      font-size: 22px; font-weight: 700; color: #E91E63; padding: 12px 20px;
      background: #FCE4EC; border-radius: 16px; margin: 12px auto; max-width: 320px;
    }
    .concept-nav { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .concept-nav-btn {
      padding: 12px 24px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .concept-nav-btn:active { transform: scale(0.95); }
    .concept-nav-btn.prev { background: #E5E5EA; color: #6E6E73; }
    .concept-nav-btn.next { background: #E91E63; color: white; }

    /* === 模式2: 摆一摆 === */
    .build-area { text-align: center; padding: 20px 16px; }
    .build-question { font-size: 20px; font-weight: 700; color: #1D1D1F; margin: 12px 0; }
    .build-hint { font-size: 15px; color: #6E6E73; margin-bottom: 16px; }
    .build-display { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .build-group {
      display: flex; flex-direction: column; align-items: center; padding: 12px;
      background: #FFF0F5; border-radius: 16px; border: 2px dashed #E91E63; min-width: 80px;
    }
    .build-group .group-items { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .build-group .item { font-size: 28px; }
    .build-group .group-label { font-size: 13px; font-weight: 600; color: #E91E63; margin-top: 6px; }
    .build-controls { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .build-btn {
      width: 56px; height: 56px; border: none; border-radius: 50%; font-size: 28px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .build-btn:active { transform: scale(0.9); }
    .build-btn.add { background: #E91E63; color: white; }
    .build-btn.remove { background: #FFCDD2; color: #C62828; }
    .build-answer-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; }
    .build-answer-input {
      width: 80px; height: 56px; border: 3px solid #E91E63; border-radius: 16px;
      font-size: 28px; font-weight: 700; text-align: center; color: #E91E63;
      background: #FFF0F5; outline: none;
    }
    .build-answer-input:focus { border-color: #AD1457; background: white; }
    .build-answer-label { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .build-submit {
      padding: 14px 32px; border: none; background: #E91E63; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(233,30,99,0.3); margin: 8px;
    }
    .build-submit:active { transform: scale(0.95); }
    .build-feedback { font-size: 18px; font-weight: 700; margin: 12px 0; min-height: 28px; }
    .build-feedback.correct { color: #34C759; }
    .build-feedback.wrong { color: #FF3B30; }

    /* === 模式3: 快速挑战 === */
    .quiz-area { text-align: center; padding: 20px 16px; }
    .quiz-progress { display: flex; justify-content: center; gap: 16px; margin: 8px 0; font-size: 16px; }
    .quiz-visual { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; min-height: 80px; }
    .quiz-group {
      display: flex; flex-direction: column; align-items: center; padding: 10px;
      background: #FFF0F5; border-radius: 12px;
    }
    .quiz-group .group-items { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .quiz-group .item { font-size: 22px; }
    .quiz-group .group-label { font-size: 12px; font-weight: 600; color: #E91E63; margin-top: 4px; }
    .quiz-question { font-size: 22px; font-weight: 700; color: #1D1D1F; margin: 12px 0; line-height: 1.5; }
    .quiz-options { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .quiz-opt {
      padding: 14px 28px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 22px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 80px;
    }
    .quiz-opt:active { transform: scale(0.9); }
    .quiz-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .quiz-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .quiz-explain { font-size: 16px; color: #6E6E73; margin: 12px 0; line-height: 1.6; min-height: 24px; }
    .quiz-timer { font-size: 14px; color: #6E6E73; margin: 8px 0; }

    /* === 模式4: 应用题 === */
    .word-area { text-align: center; padding: 20px 16px; }
    .word-scene { font-size: 64px; margin: 12px 0; }
    .word-problem {
      font-size: 18px; font-weight: 600; color: #1D1D1F; line-height: 1.8;
      padding: 16px 20px; background: #FFF8E1; border-radius: 16px; margin: 12px auto;
      max-width: 360px; text-align: left;
    }
    .word-problem .highlight { color: #E91E63; font-weight: 700; }
    .word-input-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; }
    .word-input {
      width: 100px; height: 56px; border: 3px solid #E91E63; border-radius: 16px;
      font-size: 24px; font-weight: 700; text-align: center; color: #E91E63;
      background: #FFF0F5; outline: none;
    }
    .word-input:focus { border-color: #AD1457; background: white; }
    .word-unit { font-size: 18px; font-weight: 600; color: #6E6E73; }
    .word-submit {
      padding: 14px 32px; border: none; background: #E91E63; color: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(233,30,99,0.3); margin: 8px;
    }
    .word-submit:active { transform: scale(0.95); }
    .word-feedback { font-size: 18px; font-weight: 700; margin: 12px 0; min-height: 28px; }
    .word-feedback.correct { color: #34C759; }
    .word-feedback.wrong { color: #FF3B30; }
    .word-next {
      padding: 12px 24px; border: none; background: #E5E5EA; color: #1D1D1F;
      border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
      display: none; margin: 8px;
    }
    .word-next:active { transform: scale(0.95); }
    .word-next.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">✖️ 认识倍</span>
      <div style="width:56px"></div>
    </nav>
    <div class="score-display"><span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span><span class="score-stars" id="stars-display"></span></div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="concept">📖 认识</button>
      <button class="mode-tab" data-mode="build">🧱 摆一摆</button>
      <button class="mode-tab" data-mode="quiz">⚡ 快速挑战</button>
      <button class="mode-tab" data-mode="word">📝 应用题</button>
    </div>

    <!-- 模式1: 认识概念 -->
    <div class="mode-content active" id="mode-concept">
      <div class="card">
        <div class="concept-area">
          <p class="page-subtitle">什么是"倍"？来看看下面的例子</p>
          <div id="concept-slides"></div>
          <div class="concept-nav">
            <button class="concept-nav-btn prev" id="btn-prev-slide">← 上一个</button>
            <button class="concept-nav-btn next" id="btn-next-slide">下一个 →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 摆一摆 -->
    <div class="mode-content" id="mode-build">
      <div class="card">
        <div class="build-area">
          <div class="build-question" id="build-question"></div>
          <div class="build-hint" id="build-hint"></div>
          <div class="build-display" id="build-display"></div>
          <div class="build-controls">
            <button class="build-btn remove" id="btn-build-remove">➖</button>
            <button class="build-btn add" id="btn-build-add">➕</button>
          </div>
          <div class="build-answer-row">
            <span class="build-answer-label">是</span>
            <input type="number" class="build-answer-input" id="build-input" min="1" max="9" placeholder="?">
            <span class="build-answer-label">倍</span>
          </div>
          <button class="build-submit" id="btn-build-submit">✅ 确认</button>
          <div class="build-feedback" id="build-feedback"></div>
        </div>
      </div>
    </div>

    <!-- 模式3: 快速挑战 -->
    <div class="mode-content" id="mode-quiz">
      <div class="card">
        <div class="quiz-area">
          <div class="quiz-progress">
            <span>答对 <b id="quiz-correct" style="color:#34C759">0</b></span>
            <span>答错 <b id="quiz-wrong" style="color:#FF3B30">0</b></span>
          </div>
          <div class="quiz-visual" id="quiz-visual"></div>
          <div class="quiz-question" id="quiz-question"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-explain" id="quiz-explain"></div>
        </div>
      </div>
    </div>

    <!-- 模式4: 应用题 -->
    <div class="mode-content" id="mode-word">
      <div class="card">
        <div class="word-area">
          <div class="word-scene" id="word-scene"></div>
          <div class="word-problem" id="word-problem"></div>
          <div class="word-input-row">
            <input type="number" class="word-input" id="word-input" min="1" max="99" placeholder="?">
            <span class="word-unit" id="word-unit">倍</span>
          </div>
          <button class="word-submit" id="btn-word-submit">✅ 提交答案</button>
          <div class="word-feedback" id="word-feedback"></div>
          <button class="word-next" id="btn-word-next">下一题 →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    // === 全局 ===
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../../index.html');
    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast('🔥 连续 ' + streak + ' 次！倍数学得棒！');
    }
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    const EMOJIS_POOL = ['🍎','🍊','🍋','🍇','🍓','🌸','🌺','⭐','🐱','🐶','🐰','🐸','🎈','🍬','🧁'];

    // === 模式1: 认识概念 ===
    (() => {
      const slides = [
        {
          title: '什么是"倍"？',
          html: '<div class="concept-intro"><p>"倍"表示两个数量之间的关系。</p><p>如果一个数里面<strong>包含几个</strong>另一个数，就说它是另一个数的<strong>几倍</strong>。</p></div>'
        },
        {
          title: '例子1',
          html: '<div class="demo-row"><div class="demo-group"><div class="group-label">苹果 🍎</div><div class="group-items"><span class="item">🍎</span></div></div><div class="demo-arrow">→</div><div class="demo-group"><div class="group-label">橘子 🍊🍊🍊</div><div class="group-items"><span class="item">🍊</span><span class="item">🍊</span><span class="item">🍊</span></div></div></div><div class="demo-result">1个苹果，3个橘子<br>橘子的个数是苹果的 <strong>3倍</strong>！</div>'
        },
        {
          title: '例子2',
          html: '<div class="demo-row"><div class="demo-group"><div class="group-label">红花 🌸🌸</div><div class="group-items"><span class="item">🌸</span><span class="item">🌸</span></div></div><div class="demo-arrow">→</div><div class="demo-group"><div class="group-label">黄花 🌺🌺🌺🌺🌺🌺</div><div class="group-items"><span class="item">🌺</span><span class="item">🌺</span><span class="item">🌺</span><span class="item">🌺</span><span class="item">🌺</span><span class="item">🌺</span></div></div></div><div class="demo-result">2朵红花，6朵黄花<br>黄花的朵数是红花的 <strong>3倍</strong>！</div>'
        },
        {
          title: '例子3',
          html: '<div class="demo-row"><div class="demo-group"><div class="group-label">⭐⭐⭐</div><div class="group-items"><span class="item">⭐</span><span class="item">⭐</span><span class="item">⭐</span></div></div><div class="demo-arrow">→</div><div class="demo-group"><div class="group-label">🌟🌟🌟🌟🌟🌟🌟🌟🌟🌟🌟🌟</div><div class="group-items"><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span><span class="item">🌟</span></div></div></div><div class="demo-result">3颗⭐，12颗🌟<br>🌟的颗数是⭐的 <strong>4倍</strong>！</div>'
        },
        {
          title: '怎么算？',
          html: '<div class="concept-intro"><p>求一个数是另一个数的几倍，用<strong>除法</strong>！</p><p style="font-size:24px;color:#E91E63;margin:16px 0;">大数 ÷ 小数 = 倍数</p><p>比如：12 ÷ 3 = 4</p><p>所以12是3的<strong>4倍</strong></p></div>'
        },
        {
          title: '记住！',
          html: '<div class="concept-intro"><p>🎯 "倍"不是单位，是一个<strong>关系</strong>。</p><p style="margin-top:12px;">不能说"12是3的4倍个"，<br>要说"12是3的<strong>4倍</strong>"。</p><p style="margin-top:12px;color:#E91E63;">🎮 准备好了吗？去"摆一摆"试试吧！</p></div>'
        }
      ];
      let currentSlide = 0;

      function renderSlide() {
        const s = slides[currentSlide];
        document.getElementById('concept-slides').innerHTML = '<div class="card" style="padding:20px;margin-bottom:12px;">' + s.html + '</div>';
        document.getElementById('btn-prev-slide').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        document.getElementById('btn-next-slide').textContent = currentSlide === slides.length - 1 ? '🎮 开始练习' : '下一个 →';
      }

      document.getElementById('btn-prev-slide').addEventListener('click', () => {
        if (currentSlide > 0) { currentSlide--; renderSlide(); Sound.play('click'); }
      });
      document.getElementById('btn-next-slide').addEventListener('click', () => {
        if (currentSlide < slides.length - 1) {
          currentSlide++;
          renderSlide();
          Sound.play('click');
        } else {
          document.querySelectorAll('.mode-tab')[1].click();
        }
      });

      renderSlide();
    })();

    // === 模式2: 摆一摆 ===
    (() => {
      let buildCount = 1;
      let baseCount = 0;
      let baseEmoji = '';
      let targetEmoji = '';
      let targetCount = 0;
      let buildAnswer = 0;

      function genBuildQuestion() {
        baseCount = Random.int(1, 4);
        buildAnswer = Random.int(2, 5);
        targetCount = baseCount * buildAnswer;
        baseEmoji = Random.pick(EMOJIS_POOL);
        do { targetEmoji = Random.pick(EMOJIS_POOL); } while (targetEmoji === baseEmoji);
        buildCount = baseCount;

        document.getElementById('build-question').innerHTML =
          '上面有 <span style="color:#E91E63">' + baseCount + '</span> 个 ' + baseEmoji +
          '，下面要摆 ' + targetEmoji + '，使 ' + targetEmoji + ' 的个数是 ' + baseEmoji + ' 的 <span style="color:#E91E63">' + buildAnswer + ' 倍</span>';
        document.getElementById('build-hint').textContent = '点击 ➕ 或 ➖ 摆出正确数量的 ' + targetEmoji;
        document.getElementById('build-input').value = '';
        document.getElementById('build-feedback').textContent = '';
        document.getElementById('build-feedback').className = 'build-feedback';
        renderBuild();
      }

      function renderBuild() {
        const display = document.getElementById('build-display');
        let html = '<div class="build-group"><div class="group-items">';
        for (let i = 0; i < baseCount; i++) html += '<span class="item">' + baseEmoji + '</span>';
        html += '</div><div class="group-label">' + baseCount + ' 个 ' + baseEmoji + '</div></div>';
        html += '<span style="font-size:24px;color:#E91E63">→</span>';
        html += '<div class="build-group"><div class="group-items">';
        for (let i = 0; i < buildCount; i++) html += '<span class="item">' + targetEmoji + '</span>';
        html += '</div><div class="group-label">' + buildCount + ' 个 ' + targetEmoji + '</div></div>';
        display.innerHTML = html;
      }

      document.getElementById('btn-build-add').addEventListener('click', () => {
        if (buildCount < 20) { buildCount++; renderBuild(); Sound.play('click'); }
      });
      document.getElementById('btn-build-remove').addEventListener('click', () => {
        if (buildCount > 0) { buildCount--; renderBuild(); Sound.play('click'); }
      });

      document.getElementById('build-input').addEventListener('input', () => {
        const val = parseInt(document.getElementById('build-input').value);
        if (!isNaN(val) && val >= 1 && val <= 9) {
          buildCount = baseCount * val;
          if (buildCount > 20) buildCount = 20;
          renderBuild();
        }
      });

      document.getElementById('btn-build-submit').addEventListener('click', () => {
        const correct = buildCount === targetCount;
        const fb = document.getElementById('build-feedback');
        if (correct) {
          fb.textContent = '✅ 太棒了！' + targetEmoji + ' 是 ' + baseEmoji + ' 的 ' + buildAnswer + ' 倍！';
          fb.className = 'build-feedback correct';
          streak++; updateStreak(); Sound.play('correct'); celebrate();
          setTimeout(genBuildQuestion, 1500);
        } else {
          fb.textContent = '❌ 不对哦，再数数看！' + baseEmoji + ' 有 ' + baseCount + ' 个，需要 ' + targetCount + ' 个 ' + targetEmoji;
          fb.className = 'build-feedback wrong';
          streak = 0; updateStreak(); Sound.play('wrong');
          if (document.getElementById('build-input')) {
            const el = document.getElementById('build-input');
            el.classList.add('shake');
            setTimeout(() => el.classList.remove('shake'), 500);
          }
        }
      });

      genBuildQuestion();
    })();

    // === 模式3: 快速挑战 ===
    (() => {
      let correct = 0, wrong = 0;

      function genQuiz() {
        const base = Random.int(1, 5);
        const mult = Random.int(2, 5);
        const target = base * mult;
        const emoji = Random.pick(EMOJIS_POOL);

        // 视觉展示
        const visual = document.getElementById('quiz-visual');
        let vhtml = '<div class="quiz-group"><div class="group-items">';
        for (let i = 0; i < base; i++) vhtml += '<span class="item">' + emoji + '</span>';
        vhtml += '</div><div class="group-label">' + base + ' 个</div></div>';
        vhtml += '<span style="font-size:20px;color:#E91E63">→</span>';
        vhtml += '<div class="quiz-group"><div class="group-items">';
        for (let i = 0; i < target; i++) vhtml += '<span class="item">' + emoji + '</span>';
        vhtml += '</div><div class="group-label">' + target + ' 个</div></div>';
        visual.innerHTML = vhtml;

        // 问题
        const questionTypes = [
          { q: target + ' 是 ' + base + ' 的几倍？', answer: mult, unit: '倍' },
          { q: base + ' 的 ' + mult + ' 倍是多少？', answer: target, unit: '' },
          { q: target + ' 里面有几个 ' + base + '？', answer: mult, unit: '个' }
        ];
        const qType = Random.pick(questionTypes);

        document.getElementById('quiz-question').textContent = qType.q;

        // 生成选项
        let options = [qType.answer];
        while (options.length < 4) {
          let opt = qType.answer + Random.int(-2, 2);
          if (opt < 1) opt = Random.int(1, 9);
          if (!options.includes(opt)) options.push(opt);
        }
        options = Random.shuffle(options);

        const optsEl = document.getElementById('quiz-options');
        optsEl.innerHTML = '';
        document.getElementById('quiz-explain').textContent = '';

        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt';
          btn.textContent = opt + (qType.unit || '');
          btn.addEventListener('click', () => {
            const ok = opt === qType.answer;
            if (ok) {
              btn.classList.add('correct');
              correct++;
              streak++;
              Sound.play('correct');
              celebrate();
              document.getElementById('quiz-explain').innerHTML = '✅ 对！' + target + ' ÷ ' + base + ' = ' + mult;
              updateStreak();
              setTimeout(genQuiz, 1500);
            } else {
              btn.classList.add('wrong');
              wrong++;
              streak = 0;
              Sound.play('wrong');
              document.getElementById('quiz-explain').innerHTML = '❌ 答案是 ' + qType.answer + (qType.unit || '') + '。' + target + ' ÷ ' + base + ' = ' + mult;
              updateStreak();
              // 高亮正确选项
              optsEl.querySelectorAll('.quiz-opt').forEach(b => {
                if (b.textContent === qType.answer + (qType.unit || '')) b.classList.add('correct');
              });
              setTimeout(genQuiz, 2500);
            }
            document.getElementById('quiz-correct').textContent = correct;
            document.getElementById('quiz-wrong').textContent = wrong;
            // 禁用所有按钮
            optsEl.querySelectorAll('.quiz-opt').forEach(b => b.style.pointerEvents = 'none');
          });
          optsEl.appendChild(btn);
        });
      }

      genQuiz();
    })();

    // === 模式4: 应用题 ===
    (() => {
      const scenarios = [
        { scene: '🍎🧺', gen: () => { const a = Random.int(2,6); const m = Random.int(2,4); return { p: '小明有 <span class="highlight">' + a + '</span> 个苹果，橘子的个数是苹果的 <span class="highlight">' + m + ' 倍</span>，橘子有几个？', answer: a * m, unit: '个' }; } },
        { scene: '🌸🏡', gen: () => { const a = Random.int(2,5); const m = Random.int(2,4); return { p: '花园里有 <span class="highlight">' + a + '</span> 朵红花，黄花的朵数是红花的 <span class="highlight">' + m + ' 倍</span>，黄花有几朵？', answer: a * m, unit: '朵' }; } },
        { scene: '📚🎒', gen: () => { const a = Random.int(3,8); const m = Random.int(2,3); return { p: '小红有 <span class="highlight">' + a + '</span> 本故事书，科技书的本数是故事书的 <span class="highlight">' + m + ' 倍</span>，科技书有几本？', answer: a * m, unit: '本' }; } },
        { scene: '🐱🐶', gen: () => { const a = Random.int(2,6); const t = a * Random.int(2,4); return { p: '宠物店有 <span class="highlight">' + a + '</span> 只小猫，<span class="highlight">' + t + '</span> 只小狗，小狗的只数是小猫的几倍？', answer: t / a, unit: '倍' }; } },
        { scene: '🎈🎉', gen: () => { const a = Random.int(2,5); const t = a * Random.int(2,4); return { p: '派对上有 <span class="highlight">' + a + '</span> 个红气球，<span class="highlight">' + t + '</span> 个蓝气球，蓝气球是红气球的几倍？', answer: t / a, unit: '倍' }; } },
        { scene: '🍬🧁', gen: () => { const a = Random.int(2,6); const m = Random.int(2,4); return { p: '妈妈买了 <span class="highlight">' + a + '</span> 颗糖，蛋糕的数量是糖的 <span class="highlight">' + m + ' 倍</span>，蛋糕有几个？', answer: a * m, unit: '个' }; } },
        { scene: '🐰🥕', gen: () => { const a = Random.int(2,5); const t = a * Random.int(2,4); return { p: '小兔拔了 <span class="highlight">' + a + '</span> 根胡萝卜，白菜的棵数是胡萝卜的 <span class="highlight">' + (t/a) + ' 倍</span>，白菜有几棵？', answer: t, unit: '棵' }; } },
        { scene: '⭐🌟', gen: () => { const a = Random.int(2,6); const t = a * Random.int(2,4); return { p: '小明折了 <span class="highlight">' + a + '</span> 颗星星，小红折了 <span class="highlight">' + t + '</span> 颗，小红折的是小明的几倍？', answer: t / a, unit: '倍' }; } }
      ];

      let currentScenario = null;

      function genWord() {
        const sc = Random.pick(scenarios);
        currentScenario = sc.gen();
        document.getElementById('word-scene').textContent = sc.scene;
        document.getElementById('word-problem').innerHTML = currentScenario.p;
        document.getElementById('word-input').value = '';
        document.getElementById('word-unit').textContent = currentScenario.unit;
        document.getElementById('word-feedback').textContent = '';
        document.getElementById('word-feedback').className = 'word-feedback';
        document.getElementById('btn-word-next').classList.remove('show');
        document.getElementById('word-input').focus();
      }

      document.getElementById('btn-word-submit').addEventListener('click', () => {
        const val = parseInt(document.getElementById('word-input').value);
        if (isNaN(val)) { showToast('请输入答案！'); return; }
        const fb = document.getElementById('word-feedback');
        if (val === currentScenario.answer) {
          fb.textContent = '✅ 完全正确！';
          fb.className = 'word-feedback correct';
          streak++; updateStreak(); Sound.play('correct'); celebrate();
          document.getElementById('btn-word-next').classList.add('show');
        } else {
          fb.textContent = '❌ 再想想，答案是 ' + currentScenario.answer + currentScenario.unit;
          fb.className = 'word-feedback wrong';
          streak = 0; updateStreak(); Sound.play('wrong');
          Animator.shake(document.getElementById('word-input'));
        }
      });

      document.getElementById('btn-word-next').addEventListener('click', () => {
        genWord(); Sound.play('click');
      });

      // 回车提交
      document.getElementById('word-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-word-submit').click();
      });

      genWord();
    })();
  </script>
</body>
</html>
