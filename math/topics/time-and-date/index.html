<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>认识时间与日期</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #4A90D9; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* === 模式1: 认识钟表 === */
    .clock-area { text-align: center; padding: 24px 16px; }
    .clock-svg { width: 280px; height: 280px; margin: 16px auto; }
    .clock-face { fill: #FFFFFF; stroke: #4A90D9; stroke-width: 4; }
    .clock-center { fill: #FF9500; }
    .clock-hour-hand { stroke: #1D1D1F; stroke-width: 5; stroke-linecap: round; }
    .clock-minute-hand { stroke: #4A90D9; stroke-width: 3; stroke-linecap: round; }
    .clock-number { font-size: 16px; font-weight: 700; fill: #1D1D1F; text-anchor: middle; dominant-baseline: central; }
    .clock-tick { stroke: #9CA3AF; stroke-width: 2; }
    .clock-tick.major { stroke: #4A90D9; stroke-width: 3; }
    .time-display {
      font-size: 64px; font-weight: 800; color: #4A90D9; margin: 16px 0;
      font-variant-numeric: tabular-nums; letter-spacing: 2px;
    }
    .time-text { font-size: 24px; font-weight: 600; color: #6E6E73; }
    .clock-controls { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
    .clock-btn {
      width: 80px; height: 80px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 0.2s ease; gap: 4px;
    }
    .clock-btn:active { transform: scale(0.9); }
    .clock-btn .btn-icon { font-size: 28px; }
    .clock-btn.active { border-color: #FF9500; background: rgba(255,149,0,0.1); }
    .clock-btn-label { font-size: 12px; color: #6E6E73; }

    /* === 模式2: 认时间练习 === */
    .quiz-area { text-align: center; padding: 24px 16px; }
    .quiz-question { font-size: 22px; font-weight: 600; margin: 16px 0; }
    .quiz-clock { width: 200px; height: 200px; margin: 16px auto; }
    .quiz-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px auto; max-width: 400px; }
    .quiz-opt {
      min-height: 64px; border: 3px solid #E5E5EA; background: white; border-radius: 16px;
      font-size: 24px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      color: #4A90D9;
    }
    .quiz-opt:active { transform: scale(0.95); }
    .quiz-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .quiz-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .quiz-feedback { font-size: 20px; font-weight: 600; margin: 12px 0; min-height: 32px; }

    /* === 模式3: 日期与星期 === */
    .calendar-area { text-align: center; padding: 24px 16px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 400px; margin: 16px auto; }
    .cal-header { font-size: 14px; font-weight: 600; color: #6E6E73; padding: 8px 0; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border: 2px solid transparent; border-radius: 12px; font-size: 18px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease; background: #F8F8FA;
    }
    .cal-day:active { transform: scale(0.9); }
    .cal-day.today { border-color: #4A90D9; background: rgba(74,144,217,0.15); }
    .cal-day.selected { border-color: #FF9500; background: rgba(255,149,0,0.15); }
    .cal-day.empty { background: transparent; cursor: default; pointer-events: none; }
    .cal-day.weekend { color: #FF3B30; }
    .cal-nav { display: flex; justify-content: center; gap: 16px; align-items: center; margin: 16px 0; }
    .cal-nav-btn {
      width: 56px; height: 56px; border: none; background: #E5E5EA; border-radius: 50%;
      font-size: 24px; cursor: pointer; transition: all 0.2s ease;
    }
    .cal-nav-btn:active { transform: scale(0.9); }
    .cal-month-label { font-size: 22px; font-weight: 700; min-width: 140px; }
    .date-info {
      background: rgba(74,144,217,0.08); border-radius: 16px; padding: 16px;
      margin: 12px auto; max-width: 400px; font-size: 18px; color: #4A90D9;
    }

    /* === 模式4: 时间计算 === */
    .calc-area { text-align: center; padding: 24px 16px; }
    .calc-question { font-size: 22px; font-weight: 600; margin: 16px 0; line-height: 1.6; }
    .calc-clock { width: 180px; height: 180px; margin: 16px auto; }
    .calc-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px auto; max-width: 400px; }
    .calc-opt {
      min-height: 64px; border: 3px solid #E5E5EA; background: white; border-radius: 16px;
      font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      color: #4A90D9;
    }
    .calc-opt:active { transform: scale(0.95); }
    .calc-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .calc-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .calc-explain {
      background: #FFFBEB; border-radius: 12px; padding: 12px 16px;
      font-size: 16px; color: #F59E0B; margin: 12px 0; text-align: left;
    }

    /* 通用: 计分 */
    .score-display { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; font-size: 18px; font-weight: 600; }
    .score-stars { font-size: 24px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .badge-easy { background: rgba(52,199,89,0.15); color: #34C759; }
    .badge-medium { background: rgba(255,149,0,0.15); color: #FF9500; }

    @media (max-width: 480px) {
      .clock-svg { width: 240px; height: 240px; }
      .time-display { font-size: 48px; }
      .quiz-clock, .calc-clock { width: 160px; height: 160px; }
      .quiz-opt, .calc-opt { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="nav-bar">
      <button class="nav-btn nav-back" aria-label="返回">←</button>
      <span class="nav-title">🕐 认识时间与日期</span>
      <div style="width:56px"></div>
    </nav>

    <div class="score-display">
      <span class="badge badge-easy">一年级</span>
      <span>连续答对</span><span id="streak" style="color:#FF9500">0</span><span>次</span>
      <span class="score-stars" id="stars-display"></span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="clock">🕐 认识钟表</button>
      <button class="mode-tab" data-mode="quiz">🎯 认时间</button>
      <button class="mode-tab" data-mode="calendar">📅 看日历</button>
      <button class="mode-tab" data-mode="calc">⏰ 时间计算</button>
    </div>

    <!-- 模式1: 认识钟表 -->
    <div class="mode-content active" id="mode-clock">
      <div class="card">
        <p class="page-subtitle">拖动指针，认识钟表上的时间</p>
        <div class="clock-area">
          <svg class="clock-svg" id="clock-svg" viewBox="0 0 280 280">
            <circle cx="140" cy="140" r="130" class="clock-face"/>
            <!-- 刻度和数字由JS生成 -->
            <g id="clock-ticks"></g>
            <g id="clock-numbers"></g>
            <line id="hour-hand" class="clock-hour-hand" x1="140" y1="140" x2="140" y2="70"/>
            <line id="minute-hand" class="clock-minute-hand" x1="140" y1="140" x2="140" y2="40"/>
            <circle cx="140" cy="140" r="6" class="clock-center"/>
          </svg>
          <div class="time-display" id="time-display">3:00</div>
          <div class="time-text" id="time-text">三点整</div>
          <div class="clock-controls">
            <button class="clock-btn" id="btn-hour-up"><span class="btn-icon">⏫</span><span class="clock-btn-label">时+</span></button>
            <button class="clock-btn" id="btn-hour-down"><span class="btn-icon">⏬</span><span class="clock-btn-label">时-</span></button>
            <button class="clock-btn" id="btn-min-up"><span class="btn-icon">⏩</span><span class="clock-btn-label">分+5</span></button>
            <button class="clock-btn" id="btn-min-down"><span class="btn-icon">⏪</span><span class="clock-btn-label">分-5</span></button>
            <button class="clock-btn" id="btn-now"><span class="btn-icon">🔵</span><span class="clock-btn-label">现在</span></button>
          </div>
          <div class="action-bar">
            <button class="btn btn-primary btn-large" id="btn-random-clock">🎲 随机时间</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式2: 认时间练习 -->
    <div class="mode-content" id="mode-quiz">
      <div class="card">
        <p class="page-subtitle">看看钟表显示几点几分？</p>
        <div class="quiz-area">
          <div class="quiz-question" id="quiz-question">现在是几点？</div>
          <svg class="quiz-clock" id="quiz-clock" viewBox="0 0 280 280">
            <circle cx="140" cy="140" r="130" class="clock-face"/>
            <g id="quiz-ticks"></g>
            <g id="quiz-numbers"></g>
            <line id="quiz-hour" class="clock-hour-hand" x1="140" y1="140" x2="140" y2="70"/>
            <line id="quiz-minute" class="clock-minute-hand" x1="140" y1="140" x2="140" y2="40"/>
            <circle cx="140" cy="140" r="6" class="clock-center"/>
          </svg>
          <div class="quiz-feedback" id="quiz-feedback"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="action-bar">
            <button class="btn btn-warning" id="btn-new-quiz">🎲 换一个</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式3: 日期与星期 -->
    <div class="mode-content" id="mode-calendar">
      <div class="card">
        <p class="page-subtitle">点一点，看看日历里的秘密</p>
        <div class="calendar-area">
          <div class="cal-nav">
            <button class="cal-nav-btn" id="cal-prev">◀</button>
            <span class="cal-month-label" id="cal-month-label">2026年6月</span>
            <button class="cal-nav-btn" id="cal-next">▶</button>
          </div>
          <div class="calendar-grid" id="cal-grid"></div>
          <div class="date-info" id="date-info">点击日期查看详细信息</div>
          <div class="action-bar">
            <button class="btn btn-primary" id="btn-today">📍 回到今天</button>
            <button class="btn btn-warning" id="btn-cal-quiz">🎯 今天是星期几？</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 模式4: 时间计算 -->
    <div class="mode-content" id="mode-calc">
      <div class="card">
        <p class="page-subtitle">算一算，过了多少时间？</p>
        <div class="calc-area">
          <div class="calc-question" id="calc-question"></div>
          <svg class="calc-clock" id="calc-clock" viewBox="0 0 280 280">
            <circle cx="140" cy="140" r="130" class="clock-face"/>
            <g id="calc-ticks"></g>
            <g id="calc-numbers"></g>
            <line id="calc-hour" class="clock-hour-hand" x1="140" y1="140" x2="140" y2="70"/>
            <line id="calc-minute" class="clock-minute-hand" x1="140" y1="140" x2="140" y2="40"/>
            <circle cx="140" cy="140" r="6" class="clock-center"/>
          </svg>
          <div class="calc-explain" id="calc-explain" style="display:none"></div>
          <div class="calc-options" id="calc-options"></div>
          <div class="action-bar">
            <button class="btn btn-warning" id="btn-new-calc">🎲 换一个</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/animation.js"></script>
  <script src="../../assets/js/touch.js"></script>
  <script>
    // === 初始化 ===
    document.querySelector('.nav-back').addEventListener('click', () => window.location.href = '../index.html');

    let streak = 0;
    function updateStreak() {
      document.getElementById('streak').textContent = streak;
      document.getElementById('stars-display').textContent = '⭐'.repeat(Math.min(streak, 10));
      if (streak >= 5) showToast(`🔥 连续 ${streak} 次！太厉害了！`);
    }

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
        Sound.play('click');
      });
    });

    // === 钟表绘制工具函数 ===
    function drawClockFace(ticksId, numbersId, radius = 130, cx = 140, cy = 140) {
      const ticksG = document.getElementById(ticksId);
      const numsG = document.getElementById(numbersId);
      if (!ticksG || !numsG) return;
      ticksG.innerHTML = '';
      numsG.innerHTML = '';
      // 12个大刻度 + 数字
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        // 刻度线
        const x1 = cx + (radius - 8) * Math.cos(angle);
        const y1 = cy + (radius - 8) * Math.sin(angle);
        const x2 = cx + radius * Math.cos(angle);
        const y2 = cy + radius * Math.sin(angle);
        const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tick.setAttribute('x1', x1); tick.setAttribute('y1', y1);
        tick.setAttribute('x2', x2); tick.setAttribute('y2', y2);
        tick.setAttribute('class', 'clock-tick major');
        ticksG.appendChild(tick);
        // 数字
        const nx = cx + (radius - 24) * Math.cos(angle);
        const ny = cy + (radius - 24) * Math.sin(angle);
        const num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        num.setAttribute('x', nx); num.setAttribute('y', ny);
        num.setAttribute('class', 'clock-number');
        num.textContent = i === 0 ? 12 : i;
        numsG.appendChild(num);
      }
      // 小刻度
      for (let i = 0; i < 60; i++) {
        if (i % 5 === 0) continue;
        const angle = (i * 6 - 90) * Math.PI / 180;
        const x1 = cx + (radius - 4) * Math.cos(angle);
        const y1 = cy + (radius - 4) * Math.sin(angle);
        const x2 = cx + radius * Math.cos(angle);
        const y2 = cy + radius * Math.sin(angle);
        const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tick.setAttribute('x1', x1); tick.setAttribute('y1', y1);
        tick.setAttribute('x2', x2); tick.setAttribute('y2', y2);
        tick.setAttribute('class', 'clock-tick');
        ticksG.appendChild(tick);
      }
    }

    function setHands(hourId, minuteId, hours, minutes) {
      const h = document.getElementById(hourId);
      const m = document.getElementById(minuteId);
      if (!h || !m) return;
      const cx = 140, cy = 140;
      // 分针角度
      const minAngle = (minutes * 6 - 90) * Math.PI / 180;
      const mLen = 100;
      m.setAttribute('x2', cx + mLen * Math.cos(minAngle));
      m.setAttribute('y2', cy + mLen * Math.sin(minAngle));
      // 时针角度（含分钟偏移）
      const hrAngle = ((hours % 12 + minutes / 60) * 30 - 90) * Math.PI / 180;
      const hLen = 70;
      h.setAttribute('x2', cx + hLen * Math.cos(hrAngle));
      h.setAttribute('y2', cy + hLen * Math.sin(hrAngle));
    }

    function timeToText(h, m) {
      if (m === 0) return `${h}点整`;
      if (m === 15) return `${h}点一刻`;
      if (m === 30) return `${h}点半`;
      if (m === 45) return `${h}点三刻`;
      return `${h}点${m}分`;
    }

    // === 模式1: 认识钟表 ===
    (() => {
      let hours = 3, minutes = 0;
      drawClockFace('clock-ticks', 'clock-numbers');

      function updateClock() {
        setHands('hour-hand', 'minute-hand', hours, minutes);
        const h12 = hours % 12 || 12;
        document.getElementById('time-display').textContent =
          `${String(h12).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        document.getElementById('time-text').textContent = timeToText(h12, minutes);
      }
      document.getElementById('btn-hour-up').addEventListener('click', () => {
        hours = (hours + 1) % 24; updateClock(); Sound.play('click');
      });
      document.getElementById('btn-hour-down').addEventListener('click', () => {
        hours = (hours - 1 + 24) % 24; updateClock(); Sound.play('click');
      });
      document.getElementById('btn-min-up').addEventListener('click', () => {
        minutes = (minutes + 5) % 60; if (minutes === 0) hours = (hours + 1) % 24;
        updateClock(); Sound.play('click');
      });
      document.getElementById('btn-min-down').addEventListener('click', () => {
        minutes = (minutes - 5 + 60) % 60; if (minutes === 55) hours = (hours - 1 + 24) % 24;
        updateClock(); Sound.play('click');
      });
      document.getElementById('btn-now').addEventListener('click', () => {
        const now = new Date();
        hours = now.getHours(); minutes = now.getMinutes();
        updateClock(); Sound.play('click');
      });
      document.getElementById('btn-random-clock').addEventListener('click', () => {
        hours = Random.int(1, 12);
        minutes = Random.pick([0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55]);
        updateClock(); Sound.play('click');
      });
      updateClock();
    })();

    // === 模式2: 认时间练习 ===
    (() => {
      let qHour, qMin;
      drawClockFace('quiz-ticks', 'quiz-numbers');

      function newQuiz() {
        document.getElementById('quiz-feedback').textContent = '';
        qHour = Random.int(1, 12);
        qMin = Random.pick([0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55]);
        setHands('quiz-hour', 'quiz-minute', qHour, qMin);
        document.getElementById('quiz-question').textContent =
          qMin === 0 ? '钟表显示几点整？' : '钟表显示几点几分？';

        // 生成选项
        const opts = document.getElementById('quiz-options');
        opts.innerHTML = '';
        const correct = `${String(qHour).padStart(2, '0')}:${String(qMin).padStart(2, '0')}`;
        const choices = new Set([correct]);
        while (choices.size < 4) {
          const fh = Random.int(1, 12);
          const fm = Random.pick([0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55]);
          choices.add(`${String(fh).padStart(2, '0')}:${String(fm).padStart(2, '0')}`);
        }
        const arr = [...choices];
        Random.shuffle(arr).forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt'; btn.textContent = t;
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            opts.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
            if (t === correct) {
              btn.classList.add('correct');
              document.getElementById('quiz-feedback').textContent = '🎉 答对了！';
              document.getElementById('quiz-feedback').style.color = '#34C759';
              streak++; Sound.play('correct'); celebrate();
              updateStreak();
            } else {
              btn.classList.add('wrong');
              opts.querySelectorAll('.quiz-opt').forEach(b => {
                if (b.textContent === correct) b.classList.add('correct');
              });
              document.getElementById('quiz-feedback').textContent =
                `不对哦，正确答案是 ${correct}`;
              document.getElementById('quiz-feedback').style.color = '#FF3B30';
              streak = 0; Sound.play('wrong'); updateStreak();
              Animator.shake(btn);
            }
            setTimeout(newQuiz, 2000);
          });
          opts.appendChild(btn);
        });
      }
      document.getElementById('btn-new-quiz').addEventListener('click', newQuiz);
      newQuiz();
    })();

    // === 模式3: 日历 ===
    (() => {
      let viewYear, viewMonth; // 0-indexed
      const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      const today = new Date();

      function initCalendar() {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        renderCalendar();
      }

      function renderCalendar() {
        document.getElementById('cal-month-label').textContent =
          `${viewYear}年${viewMonth + 1}月`;
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';
        // 星期标题
        dayNames.forEach(d => {
          const h = document.createElement('div');
          h.className = 'cal-header'; h.textContent = d;
          grid.appendChild(h);
        });
        // 计算该月第一天是星期几 & 天数
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        // 空白
        for (let i = 0; i < firstDay; i++) {
          const e = document.createElement('div');
          e.className = 'cal-day empty'; grid.appendChild(e);
        }
        // 日期
        for (let d = 1; d <= daysInMonth; d++) {
          const e = document.createElement('div');
          e.className = 'cal-day'; e.textContent = d;
          const dow = new Date(viewYear, viewMonth, d).getDay();
          if (dow === 0 || dow === 6) e.classList.add('weekend');
          if (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear()) {
            e.classList.add('today');
          }
          e.addEventListener('click', () => {
            grid.querySelectorAll('.cal-day').forEach(x => x.classList.remove('selected'));
            e.classList.add('selected');
            const wNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const isToday = (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear());
            document.getElementById('date-info').innerHTML =
              `${viewYear}年${viewMonth + 1}月${d}日 <b>${wNames[dow]}</b>` +
              (isToday ? ' <span style="color:#34C759">📍 今天</span>' : '');
            Sound.play('click');
          });
          grid.appendChild(e);
        }
      }

      document.getElementById('cal-prev').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        renderCalendar(); Sound.play('click');
      });
      document.getElementById('cal-next').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderCalendar(); Sound.play('click');
      });
      document.getElementById('btn-today').addEventListener('click', () => {
        viewYear = today.getFullYear(); viewMonth = today.getMonth();
        renderCalendar(); Sound.play('click');
      });
      document.getElementById('btn-cal-quiz').addEventListener('click', () => {
        const wNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const dow = today.getDay();
        document.getElementById('date-info').innerHTML =
          `今天是 <b>${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日</b><br>` +
          `<span style="font-size:24px;color:#FF9500">${wNames[dow]}</span>`;
        Sound.play('click');
      });
      initCalendar();
    })();

    // === 模式4: 时间计算 ===
    (() => {
      let qStartH, qStartM, qDelta, qAnswer, qType;
      drawClockFace('calc-ticks', 'calc-numbers');

      const calcTypes = [
        { gen() { return { h: Random.int(1, 11), m: 0, delta: Random.int(1, 3), type: 'add' }; } },
        { gen() { return { h: Random.int(2, 12), m: Random.pick([0, 30]), delta: Random.int(1, 2), type: 'add' }; } },
        { gen() { return { h: Random.int(1, 11), m: 0, delta: Random.int(1, 3), type: 'sub' }; } },
        { gen() { return { h: Random.int(1, 6), m: 0, delta: 30, type: 'addmin'; } } },
      ];

      function newCalc() {
        document.getElementById('calc-explain').style.display = 'none';
        const t = Random.pick(calcTypes);
        const g = t.gen();
        qStartH = g.h; qStartM = g.m; qDelta = g.delta; qType = g.type;

        if (qType === 'add') {
          qAnswer = (qStartH + qDelta) % 12 || 12;
          document.getElementById('calc-question').textContent =
            `现在是 ${qStartH}:00，过了 ${qDelta} 小时后是几点？`;
        } else if (qType === 'sub') {
          qAnswer = (qStartH - qDelta + 12 - 1) % 12 + 1;
          document.getElementById('calc-question').textContent =
            `现在是 ${qStartH}:00，${qDelta} 小时前是几点？`;
        } else { // addmin
          qAnswer = qStartH;
          const answerM = qStartM + qDelta;
          document.getElementById('calc-question').textContent =
            `现在是 ${qStartH}:${String(qStartM).padStart(2, '0')}，过了 ${qDelta} 分钟后是几点几分？`;
          qAnswer = `${qStartH}:${String(answerM).padStart(2, '0')}`;
        }

        setHands('calc-hour', 'calc-minute', qStartH, qStartM);

        // 选项
        const opts = document.getElementById('calc-options');
        opts.innerHTML = '';
        let choices;
        if (typeof qAnswer === 'string') {
          choices = new Set([qAnswer]);
          while (choices.size < 4) {
            const fh = Random.int(1, 12);
            const fm = Random.pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
            choices.add(`${String(fh).padStart(2, '0')}:${String(fm).padStart(2, '0')}`);
          }
        } else {
          choices = new Set([qAnswer]);
          while (choices.size < 4) {
            const c = Random.int(1, 12);
            if (c !== qAnswer) choices.add(c);
          }
        }
        Random.shuffle([...choices]).forEach(val => {
          const btn = document.createElement('button');
          btn.className = 'calc-opt';
          btn.textContent = typeof val === 'string' ? val : `${val}:00`;
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            opts.querySelectorAll('.calc-opt').forEach(b => b.disabled = true);
            const correctStr = typeof qAnswer === 'string' ? qAnswer : `${String(qAnswer).padStart(2, '0')}:00`;
            const userStr = btn.textContent;
            if (userStr === correctStr) {
              btn.classList.add('correct');
              streak++; Sound.play('correct'); celebrate();
              updateStreak();
              showExplain(true);
            } else {
              btn.classList.add('wrong');
              opts.querySelectorAll('.calc-opt').forEach(b => {
                if (b.textContent === correctStr) b.classList.add('correct');
              });
              streak = 0; Sound.play('wrong'); updateStreak();
              Animator.shake(btn);
              showExplain(false);
            }
            setTimeout(newCalc, 2500);
          });
          opts.appendChild(btn);
        });
      }

      function showExplain(ok) {
        const el = document.getElementById('calc-explain');
        let text;
        if (qType === 'add') {
          text = `${qStartH}:00 + ${qDelta}小时 = ${String(qAnswer).padStart(2, '0')}:00`;
        } else if (qType === 'sub') {
          text = `${qStartH}:00 - ${qDelta}小时 = ${String(qAnswer).padStart(2, '0')}:00`;
        } else {
          text = `${qStartH}:${String(qStartM).padStart(2, '0')} + ${qDelta}分钟 = ${qAnswer}`;
        }
        el.innerHTML = (ok ? '✅ ' : '❌ ') + text;
        el.style.display = 'block';
      }

      document.getElementById('btn-new-calc').addEventListener('click', newCalc);
      newCalc();
    })();
  </script>
</body>
</html>
