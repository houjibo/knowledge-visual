<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数轴</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #1565C0; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }

    /* 模式1: 认识数轴 */
    .learn-area { text-align: center; padding: 16px; }
    .learn-card {
      background: white; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 16px auto; max-width: 400px;
    }
    .number-line-svg { width: 100%; max-width: 360px; margin: 16px auto; display: block; }
    .nl-line { stroke: #1565C0; stroke-width: 3; }
    .nl-arrow { fill: #1565C0; }
    .nl-tick { stroke: #6E6E73; stroke-width: 2; }
    .nl-number { font-size: 16px; font-weight: 600; fill: #1D1D1F; text-anchor: middle; }
    .nl-point { fill: #FF6B35; }
    .nl-label { font-size: 14px; font-weight: 600; fill: #FF6B35; text-anchor: middle; }
    .learn-title { font-size: 20px; font-weight: 700; color: #1565C0; margin: 12px 0 8px; }
    .learn-desc { font-size: 16px; color: #6E6E73; line-height: 1.6; text-align: left; }
    .learn-nav { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .learn-btn {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .learn-btn:active { transform: scale(0.95); }
    .learn-btn.primary { background: #1565C0; color: white; box-shadow: 0 4px 12px rgba(21,101,192,0.3); }
    .learn-btn.secondary { background: #E5E5EA; color: #1D1D1F; }

    /* 模式2: 找数字 */
    .find-area { text-align: center; padding: 24px 16px; }
    .find-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .find-svg-wrap {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .find-svg-wrap svg { width: 100%; display: block; }
    .find-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .find-opt {
      width: 60px; height: 60px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1565C0;
      display: flex; align-items: center; justify-content: center;
    }
    .find-opt:active { transform: scale(0.95); }
    .find-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .find-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .find-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .find-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式3: 比大小 */
    .compare-area { text-align: center; padding: 24px 16px; }
    .compare-problem { font-size: 20px; font-weight: 600; margin: 16px 0; color: #1D1D1F; }
    .compare-svg-wrap {
      background: white; border-radius: 20px; padding: 20px; margin: 16px auto;
      max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .compare-svg-wrap svg { width: 100%; display: block; }
    .compare-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .compare-opt {
      padding: 14px 24px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1565C0; min-width: 80px;
    }
    .compare-opt:active { transform: scale(0.95); }
    .compare-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .compare-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .compare-feedback { font-size: 18px; font-weight: 600; margin: 12px 0; min-height: 28px; }
    .compare-score { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }

    /* 模式4: 限时挑战 */
    .challenge-area { text-align: center; padding: 16px; }
    .challenge-start-btn {
      padding: 16px 32px; border: none; background: #1565C0; color: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      margin: 24px auto; display: block; box-shadow: 0 4px 12px rgba(21,101,192,0.3);
    }
    .challenge-start-btn:active { transform: scale(0.95); }
    .challenge-running { display: none; }
    .challenge-active .challenge-start-btn { display: none; }
    .challenge-active .challenge-running { display: block; }
    .challenge-problem { font-size: 24px; font-weight: 700; color: #1565C0; margin: 16px 0; }
    .challenge-svg-wrap {
      background: white; border-radius: 20px; padding: 16px; margin: 16px auto;
      max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .challenge-svg-wrap svg { width: 100%; display: block; }
    .challenge-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .challenge-opt {
      width: 60px; height: 60px; border: 3px solid #E5E5EA; background: white;
      border-radius: 14px; font-size: 24px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; color: #1565C0;
      display: flex; align-items: center; justify-content: center;
    }
    .challenge-opt:active { transform: scale(0.95); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .timer-bar { height: 8px; background: #E5E5EA; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #34C759, #FF9500, #FF3B30); border-radius: 4px; transition: width 0.1s linear; }
    .challenge-score { display: flex; justify-content: center; gap: 24px; margin: 16px 0; font-size: 18px; font-weight: 600; }
    .challenge-history { max-height: 200px; overflow-y: auto; margin: 12px 0; padding: 8px; background: #F8F9FE; border-radius: 12px; }
    .history-item { padding: 8px; border-bottom: 1px solid #E5E5EA; font-size: 14px; }
    .history-item:last-child { border-bottom: none; }
    .history-correct { color: #34C759; }
    .history-wrong { color: #FF3B30; }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb">
      <a href="../../index.html" class="breadcrumb-item">🏠 首页</a>
      <span class="breadcrumb-sep">›</span>
      <a href="../index.html" class="breadcrumb-item">📐 数学</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">数轴</span>
    </nav>

    <h1 class="section-title">📏 数轴</h1>
    <p class="section-desc">认识数轴、找数字、比大小、限时挑战</p>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">认识数轴</button>
      <button class="mode-tab" data-mode="find">找数字</button>
      <button class="mode-tab" data-mode="compare">比大小</button>
      <button class="mode-tab" data-mode="challenge">限时挑战</button>
    </div>

    <!-- 模式1: 认识数轴 -->
    <div class="mode-content active" id="mode-learn">
      <div class="learn-area">
        <div class="learn-card">
          <svg class="number-line-svg" viewBox="0 0 360 100">
            <line class="nl-line" x1="20" y1="50" x2="340" y2="50"/>
            <polygon class="nl-arrow" points="340,50 330,45 330,55"/>
            <line class="nl-tick" x1="40" y1="40" x2="40" y2="60"/>
            <text class="nl-number" x="40" y="75">0</text>
            <line class="nl-tick" x1="100" y1="40" x2="100" y2="60"/>
            <text class="nl-number" x="100" y="75">1</text>
            <line class="nl-tick" x1="160" y1="40" x2="160" y2="60"/>
            <text class="nl-number" x="160" y="75">2</text>
            <line class="nl-tick" x1="220" y1="40" x2="220" y2="60"/>
            <text class="nl-number" x="220" y="75">3</text>
            <line class="nl-tick" x1="280" y1="40" x2="280" y2="60"/>
            <text class="nl-number" x="280" y="75">4</text>
            <circle class="nl-point" cx="160" cy="50" r="6"/>
            <text class="nl-label" x="160" y="30">2</text>
          </svg>
          <div class="learn-title">什么是数轴？</div>
          <div class="learn-desc">
            <p>数轴是一条有方向的直线，上面标满了数字。</p>
            <p>🔹 <strong>原点</strong>：数轴的起点是 0</p>
            <p>🔹 <strong>正方向</strong>：向右数字越来越大</p>
            <p>🔹 <strong>刻度</strong>：每个数字之间的距离相等</p>
            <p>🔹 <strong>箭头</strong>：表示数轴可以一直延伸</p>
          </div>
        </div>
        <div class="learn-nav">
          <button class="learn-btn primary" id="learn-next">下一个例子 →</button>
        </div>
      </div>
    </div>

    <!-- 模式2: 找数字 -->
    <div class="mode-content" id="mode-find">
      <div class="find-area">
        <div class="find-score">
          <span>✅ 正确: <span id="find-correct">0</span></span>
          <span>❌ 错误: <span id="find-wrong">0</span></span>
        </div>
        <div class="find-problem" id="find-question">数轴上的红点表示几？</div>
        <div class="find-svg-wrap" id="find-svg-container"></div>
        <div class="find-options" id="find-options"></div>
        <div class="find-feedback" id="find-feedback"></div>
      </div>
    </div>

    <!-- 模式3: 比大小 -->
    <div class="mode-content" id="mode-compare">
      <div class="compare-area">
        <div class="compare-score">
          <span>✅ 正确: <span id="compare-correct">0</span></span>
          <span>❌ 错误: <span id="compare-wrong">0</span></span>
        </div>
        <div class="compare-problem" id="compare-question">哪个数更大？</div>
        <div class="compare-svg-wrap" id="compare-svg-container"></div>
        <div class="compare-options" id="compare-options"></div>
        <div class="compare-feedback" id="compare-feedback"></div>
      </div>
    </div>

    <!-- 模式4: 限时挑战 -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <button class="challenge-start-btn" id="challenge-start">开始挑战 (60秒)</button>
        <div class="challenge-running">
          <div class="challenge-score">
            <span>⏱️ <span id="challenge-time">60</span>秒</span>
            <span>✅ <span id="challenge-correct">0</span></span>
            <span>❌ <span id="challenge-wrong">0</span></span>
          </div>
          <div class="timer-bar">
            <div class="timer-fill" id="timer-fill" style="width: 100%"></div>
          </div>
          <div class="challenge-problem" id="challenge-question"></div>
          <div class="challenge-svg-wrap" id="challenge-svg-container"></div>
          <div class="challenge-options" id="challenge-options"></div>
          <div class="challenge-history" id="challenge-history"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
      });
    });

    // 生成数轴SVG
    function generateNumberLineSVG(pointNum, minNum, maxNum, showLabel = true) {
      const width = 360;
      const startX = 40;
      const endX = 320;
      const range = maxNum - minNum;
      const step = (endX - startX) / range;
      
      let svg = `<svg class="number-line-svg" viewBox="0 0 ${width} 100">`;
      svg += `<line class="nl-line" x1="${startX - 20}" y1="50" x2="${endX + 20}" y2="50"/>`;
      svg += `<polygon class="nl-arrow" points="${endX + 20},50 ${endX + 10},45 ${endX + 10},55"/>`;
      
      for (let i = minNum; i <= maxNum; i++) {
        const x = startX + (i - minNum) * step;
        svg += `<line class="nl-tick" x1="${x}" y1="40" x2="${x}" y2="60"/>`;
        svg += `<text class="nl-number" x="${x}" y="75">${i}</text>`;
      }
      
      const pointX = startX + (pointNum - minNum) * step;
      svg += `<circle class="nl-point" cx="${pointX}" cy="50" r="6"/>`;
      if (showLabel) {
        svg += `<text class="nl-label" x="${pointX}" y="30">${pointNum}</text>`;
      }
      
      svg += `</svg>`;
      return svg;
    }

    // 模式1: 认识数轴
    const learnExamples = [
      { point: 2, min: 0, max: 4, title: '数轴上的2', desc: '从0开始，向右数2格，就是2的位置。' },
      { point: 5, min: 0, max: 10, title: '数轴上的5', desc: '从0开始，向右数5格，就是5的位置。5在0的右边，比0大。' },
      { point: 3, min: 0, max: 6, title: '数轴上的3', desc: '从0开始，向右数3格，就是3的位置。3比2大，比4小。' },
      { point: 7, min: 0, max: 10, title: '数轴上的7', desc: '从0开始，向右数7格，就是7的位置。7离0很远，是个比较大的数。' }
    ];
    let learnIndex = 0;

    document.getElementById('learn-next').addEventListener('click', () => {
      learnIndex = (learnIndex + 1) % learnExamples.length;
      const ex = learnExamples[learnIndex];
      const svg = generateNumberLineSVG(ex.point, ex.min, ex.max);
      document.querySelector('#mode-learn .learn-card').innerHTML = `
        ${svg}
        <div class="learn-title">${ex.title}</div>
        <div class="learn-desc">${ex.desc}</div>
      `;
    });

    // 模式2: 找数字
    let findCorrect = 0, findWrong = 0;
    let currentFindAnswer = 0;

    function generateFindQuestion() {
      const min = 0;
      const max = Math.random() > 0.5 ? 10 : 20;
      const point = Math.floor(Math.random() * (max - min + 1)) + min;
      currentFindAnswer = point;
      
      document.getElementById('find-svg-container').innerHTML = generateNumberLineSVG(point, min, max, false);
      
      const options = new Set([point]);
      while (options.size < 4) {
        const opt = Math.floor(Math.random() * (max - min + 1)) + min;
        options.add(opt);
      }
      
      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      document.getElementById('find-options').innerHTML = shuffled.map(n => 
        `<button class="find-opt" data-value="${n}">${n}</button>`
      ).join('');
      
      document.getElementById('find-feedback').textContent = '';
      
      document.querySelectorAll('.find-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = parseInt(btn.dataset.value);
          if (value === currentFindAnswer) {
            btn.classList.add('correct');
            document.getElementById('find-feedback').textContent = '✅ 正确！';
            document.getElementById('find-feedback').style.color = '#34C759';
            findCorrect++;
            document.getElementById('find-correct').textContent = findCorrect;
            setTimeout(generateFindQuestion, 1500);
          } else {
            btn.classList.add('wrong');
            document.getElementById('find-feedback').textContent = '❌ 再试试';
            document.getElementById('find-feedback').style.color = '#FF3B30';
            findWrong++;
            document.getElementById('find-wrong').textContent = findWrong;
          }
        });
      });
    }

    generateFindQuestion();

    // 模式3: 比大小
    let compareCorrect = 0, compareWrong = 0;
    let currentCompareAnswer = '';

    function generateCompareQuestion() {
      const min = 0;
      const max = Math.random() > 0.5 ? 10 : 20;
      const num1 = Math.floor(Math.random() * (max - min)) + min;
      let num2 = Math.floor(Math.random() * (max - min)) + min;
      while (num2 === num1) {
        num2 = Math.floor(Math.random() * (max - min)) + min;
      }
      
      const questionType = Math.random() > 0.5 ? 'bigger' : 'smaller';
      const questionText = questionType === 'bigger' ? '哪个数更大？' : '哪个数更小？';
      currentCompareAnswer = questionType === 'bigger' ? Math.max(num1, num2) : Math.min(num1, num2);
      
      document.getElementById('compare-question').textContent = questionText;
      
      let svg = `<svg class="number-line-svg" viewBox="0 0 360 120">`;
      const width = 360;
      const startX = 40;
      const endX = 320;
      const range = max - min;
      const step = (endX - startX) / range;
      
      svg += `<line class="nl-line" x1="${startX - 20}" y1="60" x2="${endX + 20}" y2="60"/>`;
      svg += `<polygon class="nl-arrow" points="${endX + 20},60 ${endX + 10},55 ${endX + 10},65"/>`;
      
      for (let i = min; i <= max; i++) {
        const x = startX + (i - min) * step;
        svg += `<line class="nl-tick" x1="${x}" y1="50" x2="${x}" y2="70"/>`;
        svg += `<text class="nl-number" x="${x}" y="85">${i}</text>`;
      }
      
      const x1 = startX + (num1 - min) * step;
      const x2 = startX + (num2 - min) * step;
      svg += `<circle class="nl-point" cx="${x1}" cy="60" r="6" style="fill:#4A90D9"/>`;
      svg += `<text class="nl-label" x="${x1}" y="40" style="fill:#4A90D9">${num1}</text>`;
      svg += `<circle class="nl-point" cx="${x2}" cy="60" r="6" style="fill:#FF6B35"/>`;
      svg += `<text class="nl-label" x="${x2}" y="100" style="fill:#FF6B35">${num2}</text>`;
      svg += `</svg>`;
      
      document.getElementById('compare-svg-container').innerHTML = svg;
      
      const options = [num1, num2].sort(() => Math.random() - 0.5);
      document.getElementById('compare-options').innerHTML = options.map(n => 
        `<button class="compare-opt" data-value="${n}">${n}</button>`
      ).join('');
      
      document.getElementById('compare-feedback').textContent = '';
      
      document.querySelectorAll('.compare-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = parseInt(btn.dataset.value);
          if (value === currentCompareAnswer) {
            btn.classList.add('correct');
            document.getElementById('compare-feedback').textContent = '✅ 正确！';
            document.getElementById('compare-feedback').style.color = '#34C759';
            compareCorrect++;
            document.getElementById('compare-correct').textContent = compareCorrect;
            setTimeout(generateCompareQuestion, 1500);
          } else {
            btn.classList.add('wrong');
            document.getElementById('compare-feedback').textContent = '❌ 再试试';
            document.getElementById('compare-feedback').style.color = '#FF3B30';
            compareWrong++;
            document.getElementById('compare-wrong').textContent = compareWrong;
          }
        });
      });
    }

    generateCompareQuestion();

    // 模式4: 限时挑战
    let challengeCorrect = 0, challengeWrong = 0;
    let challengeTime = 60;
    let challengeTimer = null;
    let challengeActive = false;
    let currentChallengeAnswer = 0;

    function generateChallengeQuestion() {
      const min = 0;
      const max = 10;
      const point = Math.floor(Math.random() * (max - min + 1)) + min;
      currentChallengeAnswer = point;
      
      const questionTypes = ['find', 'compare'];
      const type = questionTypes[Math.floor(Math.random() * questionTypes.length)];
      
      if (type === 'find') {
        document.getElementById('challenge-question').textContent = '红点表示几？';
        document.getElementById('challenge-svg-container').innerHTML = generateNumberLineSVG(point, min, max, false);
        
        const options = new Set([point]);
        while (options.size < 4) {
          const opt = Math.floor(Math.random() * (max - min + 1)) + min;
          options.add(opt);
        }
        
        const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
        document.getElementById('challenge-options').innerHTML = shuffled.map(n => 
          `<button class="challenge-opt" data-value="${n}">${n}</button>`
        ).join('');
      } else {
        const num1 = Math.floor(Math.random() * (max - min)) + min;
        let num2 = Math.floor(Math.random() * (max - min)) + min;
        while (num2 === num1) {
          num2 = Math.floor(Math.random() * (max - min)) + min;
        }
        
        const isBigger = Math.random() > 0.5;
        currentChallengeAnswer = isBigger ? Math.max(num1, num2) : Math.min(num1, num2);
        document.getElementById('challenge-question').textContent = isBigger ? '哪个数更大？' : '哪个数更小？';
        
        let svg = `<svg class="number-line-svg" viewBox="0 0 360 120">`;
        const width = 360;
        const startX = 40;
        const endX = 320;
        const range = max - min;
        const step = (endX - startX) / range;
        
        svg += `<line class="nl-line" x1="${startX - 20}" y1="60" x2="${endX + 20}" y2="60"/>`;
        svg += `<polygon class="nl-arrow" points="${endX + 20},60 ${endX + 10},55 ${endX + 10},65"/>`;
        
        for (let i = min; i <= max; i++) {
          const x = startX + (i - min) * step;
          svg += `<line class="nl-tick" x1="${x}" y1="50" x2="${x}" y2="70"/>`;
          svg += `<text class="nl-number" x="${x}" y="85">${i}</text>`;
        }
        
        const x1 = startX + (num1 - min) * step;
        const x2 = startX + (num2 - min) * step;
        svg += `<circle class="nl-point" cx="${x1}" cy="60" r="6" style="fill:#4A90D9"/>`;
        svg += `<text class="nl-label" x="${x1}" y="40" style="fill:#4A90D9">${num1}</text>`;
        svg += `<circle class="nl-point" cx="${x2}" cy="60" r="6" style="fill:#FF6B35"/>`;
        svg += `<text class="nl-label" x="${x2}" y="100" style="fill:#FF6B35">${num2}</text>`;
        svg += `</svg>`;
        
        document.getElementById('challenge-svg-container').innerHTML = svg;
        
        const options = [num1, num2].sort(() => Math.random() - 0.5);
        document.getElementById('challenge-options').innerHTML = options.map(n => 
          `<button class="challenge-opt" data-value="${n}">${n}</button>`
        ).join('');
      }
      
      document.querySelectorAll('.challenge-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!challengeActive) return;
          
          const value = parseInt(btn.dataset.value);
          const historyDiv = document.getElementById('challenge-history');
          
          if (value === currentChallengeAnswer) {
            btn.classList.add('correct');
            challengeCorrect++;
            document.getElementById('challenge-correct').textContent = challengeCorrect;
            historyDiv.innerHTML = `<div class="history-item history-correct">✅ ${currentChallengeAnswer}</div>` + historyDiv.innerHTML;
            setTimeout(generateChallengeQuestion, 1500);
          } else {
            btn.classList.add('wrong');
            challengeWrong++;
            document.getElementById('challenge-wrong').textContent = challengeWrong;
            historyDiv.innerHTML = `<div class="history-item history-wrong">❌ 正确答案: ${currentChallengeAnswer}</div>` + historyDiv.innerHTML;
          }
        });
      });
    }

    document.getElementById('challenge-start').addEventListener('click', () => {
      challengeActive = true;
      challengeCorrect = 0;
      challengeWrong = 0;
      challengeTime = 60;
      document.getElementById('challenge-correct').textContent = '0';
      document.getElementById('challenge-wrong').textContent = '0';
      document.getElementById('challenge-time').textContent = '60';
      document.getElementById('timer-fill').style.width = '100%';
      document.getElementById('challenge-history').innerHTML = '';
      document.querySelector('.challenge-area').classList.add('challenge-active');
      
      generateChallengeQuestion();
      
      challengeTimer = setInterval(() => {
        challengeTime--;
        document.getElementById('challenge-time').textContent = challengeTime;
        document.getElementById('timer-fill').style.width = (challengeTime / 60 * 100) + '%';
        
        if (challengeTime <= 0) {
          clearInterval(challengeTimer);
          challengeActive = false;
          document.querySelector('.challenge-area').classList.remove('challenge-active');
          document.getElementById('challenge-question').textContent = `挑战结束！正确 ${challengeCorrect} 题，错误 ${challengeWrong} 题`;
          document.getElementById('challenge-svg-container').innerHTML = '';
          document.getElementById('challenge-options').innerHTML = '';
        }
      }, 1000);
    });
  </script>
</body>
</html>
