<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>平均数</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
    .mode-tab { flex-shrink: 0; padding: 10px 18px; border: none; background: #E5E5EA; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab.active { background: #5C6BC0; color: white; }
    .mode-content { display: none; }
    .mode-content.active { display: block; animation: fadeInUp 0.3s ease; }

    /* 通用 */
    .section-title { font-size: 22px; color: #1D1D1F; font-weight: 700; text-align: center; margin: 8px 0; }
    .section-desc { font-size: 15px; color: #6E6E73; text-align: center; margin-bottom: 16px; }
    .score-bar { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; font-weight: 600; }
    .result-text { font-size: 22px; font-weight: 700; text-align: center; margin: 16px 0; min-height: 36px; }
    .next-btn {
      display: block; margin: 16px auto; padding: 14px 32px; border: none;
      background: #5C6BC0; color: white; border-radius: 12px; font-size: 18px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .next-btn:active { transform: scale(0.92); }
    .opt-btn {
      padding: 14px 20px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; min-width: 80px; text-align: center;
    }
    .opt-btn:active { transform: scale(0.92); }
    .opt-btn.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .opt-btn.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }

    /* ===== 模式1: 概念学习 ===== */
    .concept-area { text-align: center; padding: 16px; }
    .concept-story { font-size: 17px; color: #1D1D1F; line-height: 2; margin: 16px 0; text-align: left; padding: 0 8px; }
    .concept-story .emoji { font-size: 24px; }
    .concept-formula {
      background: linear-gradient(135deg, #E8EAF6, #C5CAE9); border-radius: 20px;
      padding: 24px; margin: 20px 0; text-align: center;
    }
    .concept-formula .formula { font-size: 24px; font-weight: 700; color: #283593; }
    .concept-formula .formula-desc { font-size: 14px; color: #5C6BC0; margin-top: 8px; }

    /* 柱状图演示 */
    .demo-bars { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin: 20px 0; height: 180px; }
    .demo-bar-wrap { display: flex; flex-direction: column; align-items: center; }
    .demo-bar {
      width: 48px; border-radius: 8px 8px 0 0; transition: height 0.5s ease;
      display: flex; align-items: flex-start; justify-content: center;
      font-size: 14px; font-weight: 700; color: white; padding-top: 6px;
    }
    .demo-bar-label { font-size: 13px; color: #6E6E73; margin-top: 6px; font-weight: 600; }
    .avg-line {
      position: relative; width: 100%; max-width: 320px; margin: 0 auto;
      border-top: 3px dashed #FF5722; text-align: center;
    }
    .avg-line-label {
      position: absolute; top: -22px; right: 0; font-size: 14px;
      font-weight: 700; color: #FF5722; background: white; padding: 0 6px;
    }
    .concept-tip {
      font-size: 15px; color: #5C6BC0; background: rgba(92,107,192,0.08);
      padding: 14px 16px; border-radius: 14px; margin: 16px 0; line-height: 1.8;
      text-align: left;
    }
    .concept-tip b { color: #283593; }

    /* ===== 模式2: 动手移一移 ===== */
    .move-area { text-align: center; padding: 16px; }
    .move-instruction { font-size: 18px; font-weight: 600; color: #5C6BC0; margin: 12px 0; }
    .move-bars-container { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin: 20px 0; height: 200px; }
    .move-bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .move-block {
      width: 48px; height: 28px; border-radius: 6px; cursor: pointer;
      transition: all 0.3s ease; border: 2px solid rgba(0,0,0,0.1);
    }
    .move-block:active { transform: scale(0.9); }
    .move-block.selected { box-shadow: 0 0 0 3px #FF5722, 0 0 12px rgba(255,87,34,0.4); transform: scale(1.05); z-index: 2; }
    .move-col-label { font-size: 14px; font-weight: 700; color: #6E6E73; margin-top: 4px; }
    .move-col-count { font-size: 18px; font-weight: 700; color: #5C6BC0; }
    .move-target { font-size: 16px; color: #FF5722; font-weight: 600; margin: 8px 0; }
    .move-check-btn {
      padding: 12px 28px; border: none; background: #5C6BC0; color: white;
      border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer;
      margin: 12px 8px; box-shadow: 0 4px 12px rgba(92,107,192,0.3);
    }
    .move-check-btn:active { transform: scale(0.95); }
    .move-reset-btn {
      padding: 12px 28px; border: 2px solid #5C6BC0; background: white; color: #5C6BC0;
      border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; margin: 12px 8px;
    }
    .move-reset-btn:active { transform: scale(0.95); }

    /* ===== 模式3: 计算练习 ===== */
    .calc-area { text-align: center; padding: 16px; }
    .calc-problem { font-size: 17px; color: #1D1D1F; line-height: 1.8; margin: 16px 0; text-align: left; padding: 0 8px; }
    .calc-data { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
    .calc-data-item {
      background: #E8EAF6; border-radius: 12px; padding: 10px 16px;
      font-size: 20px; font-weight: 700; color: #283593;
    }
    .calc-input-row { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 20px 0; }
    .calc-input {
      width: 120px; padding: 14px; border: 3px solid #E5E5EA; border-radius: 14px;
      font-size: 24px; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s; background: white;
    }
    .calc-input:focus { border-color: #5C6BC0; }
    .calc-input.correct { border-color: #34C759; background: rgba(52,199,89,0.08); }
    .calc-input.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.08); }
    .calc-unit-label { font-size: 20px; font-weight: 600; color: #6E6E73; }
    .calc-submit-btn {
      padding: 14px 32px; border: none; background: #5C6BC0; color: white;
      border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(92,107,192,0.3); margin: 8px;
    }
    .calc-submit-btn:active { transform: scale(0.95); }
    .calc-hint { font-size: 14px; color: #6E6E73; margin: 12px 0; }

    /* ===== 模式4: 应用挑战 ===== */
    .challenge-area { text-align: center; padding: 16px; }
    .challenge-question { font-size: 17px; color: #1D1D1F; line-height: 1.8; margin: 16px 0; text-align: left; padding: 0 8px; }
    .challenge-options { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 16px auto; }
    .challenge-opt {
      padding: 16px; border: 3px solid #E5E5EA; background: white;
      border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; text-align: center;
    }
    .challenge-opt:active { transform: scale(0.97); }
    .challenge-opt.correct { border-color: #34C759; background: rgba(52,199,89,0.15); color: #34C759; }
    .challenge-opt.wrong { border-color: #FF3B30; background: rgba(255,59,48,0.1); color: #FF3B30; }
    .challenge-explain { font-size: 15px; color: #5C6BC0; margin: 12px 0; line-height: 1.6; min-height: 24px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .pop-in { animation: popIn 0.3s ease; }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- 导航栏 -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <a href="../../index.html" style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:#F0F0F5;border-radius:12px;color:#5C6BC0;text-decoration:none;font-weight:600;font-size:15px;">
        ← 返回
      </a>
      <span style="font-size:15px;color:#6E6E73;">四年级 · 统计与概率</span>
    </div>

    <div class="section-title">📊 平均数</div>
    <div class="section-desc">把多的给少的，让每个人都"一样多"</div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="concept">📖 学一学</button>
      <button class="mode-tab" data-mode="move">🔄 移一移</button>
      <button class="mode-tab" data-mode="calc">✏️ 算一算</button>
      <button class="mode-tab" data-mode="challenge">🏆 挑战</button>
    </div>

    <!-- ===== 模式1: 概念学习 ===== -->
    <div class="mode-content active" id="mode-concept">
      <div class="concept-area">
        <div class="concept-story">
          <span class="emoji">🍎</span> 小明有 <b>3</b> 个苹果，小红有 <b>7</b> 个，小刚有 <b>5</b> 个。<br><br>
          <span class="emoji">🤔</span> 怎样才能让他们每人的苹果<b>一样多</b>呢？<br><br>
          <span class="emoji">💡</span> 把小红的 <b>2</b> 个给小刚……不对！<br>
          把小红的 <b>2</b> 个给小明，每人就都是 <b>5</b> 个啦！
        </div>

        <div class="demo-bars" id="conceptBars"></div>
        <div style="text-align:center;margin:-8px 0 16px;">
          <button id="conceptAnimBtn" style="padding:10px 24px;border:none;background:#FF5722;color:white;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;">
            ▶ 演示"移多补少"
          </button>
        </div>

        <div class="concept-formula">
          <div class="formula">平均数 = 总数 ÷ 份数</div>
          <div class="formula-desc">(3 + 7 + 5) ÷ 3 = 15 ÷ 3 = <b>5</b></div>
        </div>

        <div class="concept-tip">
          <b>💡 核心思想：</b><br>
          ① <b>移多补少</b> —— 从多的里面拿一些给少的，让大家都一样多<br>
          ② <b>先合后分</b> —— 先把所有数加起来，再平均分成几份<br>
          ③ 平均数一定在<b>最大数</b>和<b>最小数</b>之间<br>
          ④ 平均数不一定等于其中某个数
        </div>
      </div>
    </div>

    <!-- ===== 模式2: 动手移一移 ===== -->
    <div class="mode-content" id="mode-move">
      <div class="move-area">
        <div class="move-instruction" id="moveInstruction">点击方块，把它们移到正确的列，让每列一样高！</div>
        <div class="move-target" id="moveTarget"></div>
        <div class="move-bars-container" id="moveBarsContainer"></div>
        <div>
          <button class="move-check-btn" id="moveCheckBtn">✅ 检查</button>
          <button class="move-reset-btn" id="moveResetBtn">🔄 重来</button>
        </div>
        <div class="result-text" id="moveResult"></div>
        <div class="score-bar" id="moveScore"></div>
      </div>
    </div>

    <!-- ===== 模式3: 计算练习 ===== -->
    <div class="mode-content" id="mode-calc">
      <div class="calc-area">
        <div class="calc-problem" id="calcProblem"></div>
        <div class="calc-data" id="calcData"></div>
        <div class="calc-hint" id="calcHint"></div>
        <div class="calc-input-row">
          <input type="number" class="calc-input" id="calcInput" placeholder="?" inputmode="decimal">
          <span class="calc-unit-label" id="calcUnit"></span>
        </div>
        <button class="calc-submit-btn" id="calcSubmitBtn">提交答案</button>
        <div class="result-text" id="calcResult"></div>
        <div class="score-bar" id="calcScore"></div>
      </div>
    </div>

    <!-- ===== 模式4: 应用挑战 ===== -->
    <div class="mode-content" id="mode-challenge">
      <div class="challenge-area">
        <div class="challenge-question" id="challengeQuestion"></div>
        <div class="challenge-options" id="challengeOptions"></div>
        <div class="challenge-explain" id="challengeExplain"></div>
        <div class="result-text" id="challengeResult"></div>
        <div class="score-bar" id="challengeScore"></div>
      </div>
    </div>

  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
  (function() {
    'use strict';

    // ===== 模式切换 =====
    var tabs = document.querySelectorAll('.mode-tab');
    var contents = document.querySelectorAll('.mode-content');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        contents.forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('mode-' + tab.getAttribute('data-mode')).classList.add('active');
      });
    });

    // ===== 工具函数 =====
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    // ===== 模式1: 概念学习 =====
    var conceptData = [3, 7, 5];
    var conceptColors = ['#42A5F5', '#EF5350', '#66BB6A'];
    var conceptNames = ['小明', '小红', '小刚'];

    function renderConceptBars(values) {
      var container = document.getElementById('conceptBars');
      container.innerHTML = '';
      var maxVal = Math.max.apply(null, values.concat([10]));
      for (var i = 0; i < values.length; i++) {
        var wrap = document.createElement('div');
        wrap.className = 'demo-bar-wrap';
        var bar = document.createElement('div');
        bar.className = 'demo-bar';
        bar.style.height = (values[i] / maxVal * 150) + 'px';
        bar.style.background = conceptColors[i];
        bar.textContent = values[i];
        var label = document.createElement('div');
        label.className = 'demo-bar-label';
        label.textContent = conceptNames[i];
        wrap.appendChild(bar);
        wrap.appendChild(label);
        container.appendChild(wrap);
      }
    }
    renderConceptBars(conceptData);

    var conceptAnimating = false;
    document.getElementById('conceptAnimBtn').addEventListener('click', function() {
      if (conceptAnimating) return;
      conceptAnimating = true;
      var btn = this;
      btn.disabled = true;
      btn.textContent = '演示中…';

      // Step 1: Show original
      renderConceptBars([3, 7, 5]);
      setTimeout(function() {
        // Step 2: Move 2 from 小红 to 小明 → [5, 5, 5]
        renderConceptBars([5, 5, 5]);
        setTimeout(function() {
          btn.disabled = false;
          btn.textContent = '▶ 再演示一次';
          conceptAnimating = false;
        }, 1200);
      }, 1000);
    });

    // ===== 模式2: 移一移 =====
    var moveScore = { correct: 0, total: 0 };
    var moveState = { cols: [], target: 0, selectedCol: -1 };

    function generateMovePuzzle() {
      var numCols = randInt(3, 4);
      var target = randInt(3, 7);
      var cols = [];
      var totalNeeded = target * numCols;
      // Generate values that sum to totalNeeded but are not all equal
      for (var i = 0; i < numCols - 1; i++) {
        var maxForThis = totalNeeded - (numCols - i - 1) * 1;
        var minForThis = 1;
        var val = randInt(Math.max(1, target - 3), Math.min(maxForThis, target + 3));
        val = Math.max(1, Math.min(val, totalNeeded - (numCols - i - 1)));
        cols.push(val);
        totalNeeded -= val;
      }
      cols.push(totalNeeded);
      // Make sure not all equal
      var allEqual = cols.every(function(v) { return v === target; });
      if (allEqual) {
        if (cols[0] > 1) { cols[0]--; cols[1]++; }
        else { cols[0]++; cols[1]--; }
      }
      return { cols: cols, target: target };
    }

    function renderMoveBars() {
      var container = document.getElementById('moveBarsContainer');
      container.innerHTML = '';
      var maxH = 8;
      for (var i = 0; i < moveState.cols.length; i++) {
        var col = document.createElement('div');
        col.className = 'move-bar-col';
        col.setAttribute('data-col', i);

        var blocksWrap = document.createElement('div');
        blocksWrap.style.display = 'flex';
        blocksWrap.style.flexDirection = 'column-reverse';
        blocksWrap.style.gap = '4px';
        blocksWrap.style.minHeight = (maxH * 32) + 'px';
        blocksWrap.style.alignItems = 'center';

        for (var j = 0; j < moveState.cols[i]; j++) {
          var block = document.createElement('div');
          block.className = 'move-block';
          block.style.background = moveState.cols[i] > moveState.target ? '#EF5350' :
                                   moveState.cols[i] < moveState.target ? '#42A5F5' : '#66BB6A';
          block.setAttribute('data-col', i);
          block.setAttribute('data-idx', j);
          if (moveState.selectedCol === i && j === moveState.cols[i] - 1) {
            block.classList.add('selected');
          }
          (function(ci) {
            block.addEventListener('click', function() {
              onMoveBlockClick(ci);
            });
          })(i);
          blocksWrap.appendChild(block);
        }

        var countLabel = document.createElement('div');
        countLabel.className = 'move-col-count';
        countLabel.textContent = moveState.cols[i];

        var nameLabel = document.createElement('div');
        nameLabel.className = 'move-col-label';
        nameLabel.textContent = '第' + (i + 1) + '列';

        col.appendChild(blocksWrap);
        col.appendChild(countLabel);
        col.appendChild(nameLabel);
        container.appendChild(col);
      }
    }

    function onMoveBlockClick(colIdx) {
      if (moveState.selectedCol === -1) {
        // Select
        moveState.selectedCol = colIdx;
        renderMoveBars();
      } else if (moveState.selectedCol === colIdx) {
        // Deselect
        moveState.selectedCol = -1;
        renderMoveBars();
      } else {
        // Move one block from selectedCol to colIdx
        if (moveState.cols[moveState.selectedCol] > 0) {
          moveState.cols[moveState.selectedCol]--;
          moveState.cols[colIdx]++;
          moveState.selectedCol = -1;
          renderMoveBars();
        }
      }
    }

    function initMoveMode() {
      var puzzle = generateMovePuzzle();
      moveState.cols = puzzle.cols.slice();
      moveState.target = puzzle.target;
      moveState.selectedCol = -1;
      document.getElementById('moveResult').textContent = '';
      document.getElementById('moveTarget').textContent = '🎯 目标：让每列都是 ' + puzzle.target + ' 个';
      document.getElementById('moveScore').innerHTML = '✅ ' + moveScore.correct + ' / ' + moveScore.total;
      renderMoveBars();
    }

    document.getElementById('moveCheckBtn').addEventListener('click', function() {
      moveScore.total++;
      var allEqual = moveState.cols.every(function(v) { return v === moveState.target; });
      var resultEl = document.getElementById('moveResult');
      if (allEqual) {
        moveScore.correct++;
        resultEl.textContent = '🎉 太棒了！每列都是 ' + moveState.target + ' 个！';
        resultEl.style.color = '#34C759';
        setTimeout(initMoveMode, 1500);
      } else {
        resultEl.textContent = '❌ 还没完全一样多哦，再试试！';
        resultEl.style.color = '#FF3B30';
      }
      document.getElementById('moveScore').innerHTML = '✅ ' + moveScore.correct + ' / ' + moveScore.total;
    });

    document.getElementById('moveResetBtn').addEventListener('click', function() {
      initMoveMode();
    });

    initMoveMode();

    // ===== 模式3: 计算练习 =====
    var calcScore = { correct: 0, total: 0 };
    var calcAnswer = 0;

    var calcScenarios = [
      { prefix: '小明三次跳绳分别跳了', unit: '个', findWhat: '平均每次跳了多少个' },
      { prefix: '四天的气温分别是', unit: '°C', findWhat: '平均气温是多少度' },
      { prefix: '五个同学的身高分别是', unit: 'cm', findWhat: '平均身高是多少厘米' },
      { prefix: '小华四次数学测验成绩是', unit: '分', findWhat: '平均每次考了多少分' },
      { prefix: '果园三天共摘苹果，每天摘了', unit: 'kg', findWhat: '平均每天摘了多少千克' },
      { prefix: '五个小朋友分别有', unit: '颗', findWhat: '平均每人有几颗糖果' },
    ];

    function generateCalcProblem() {
      var scenario = calcScenarios[randInt(0, calcScenarios.length - 1)];
      var numCount = randInt(3, 5);
      var data = [];
      for (var i = 0; i < numCount; i++) {
        data.push(randInt(10, 99));
      }
      var sum = data.reduce(function(a, b) { return a + b; }, 0);
      // Make sure divisible
      var remainder = sum % numCount;
      if (remainder !== 0) {
        data[numCount - 1] += (numCount - remainder);
      }
      sum = data.reduce(function(a, b) { return a + b; }, 0);
      var avg = sum / numCount;

      return {
        text: scenario.prefix + '：',
        data: data,
        unit: scenario.unit,
        question: scenario.findWhat + '？',
        answer: avg
      };
    }

    function renderCalcProblem() {
      var p = generateCalcProblem();
      calcAnswer = p.answer;
      document.getElementById('calcProblem').innerHTML = '📝 ' + p.text + '<br>' + p.question;
      var dataEl = document.getElementById('calcData');
      dataEl.innerHTML = '';
      p.data.forEach(function(v) {
        var item = document.createElement('span');
        item.className = 'calc-data-item';
        item.textContent = v;
        dataEl.appendChild(item);
      });
      document.getElementById('calcUnit').textContent = p.unit;
      document.getElementById('calcInput').value = '';
      document.getElementById('calcInput').className = 'calc-input';
      document.getElementById('calcResult').textContent = '';
      document.getElementById('calcHint').textContent = '💡 提示：先求和，再除以个数';
      document.getElementById('calcScore').innerHTML = '✅ ' + calcScore.correct + ' / ' + calcScore.total;
    }

    document.getElementById('calcSubmitBtn').addEventListener('click', function() {
      var input = document.getElementById('calcInput');
      var userAns = parseFloat(input.value);
      if (isNaN(userAns)) return;
      calcScore.total++;
      var resultEl = document.getElementById('calcResult');
      if (Math.abs(userAns - calcAnswer) < 0.01) {
        calcScore.correct++;
        resultEl.textContent = '🎉 正确！平均数 = ' + calcAnswer;
        resultEl.style.color = '#34C759';
        input.className = 'calc-input correct';
        setTimeout(renderCalcProblem, 1500);
      } else {
        resultEl.textContent = '❌ 不对哦，再算算！';
        resultEl.style.color = '#FF3B30';
        input.className = 'calc-input wrong';
      }
      document.getElementById('calcScore').innerHTML = '✅ ' + calcScore.correct + ' / ' + calcScore.total;
    });

    // Enter key for calc
    document.getElementById('calcInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('calcSubmitBtn').click();
      }
    });

    renderCalcProblem();

    // ===== 模式4: 应用挑战 =====
    var challengeScore = { correct: 0, total: 0 };

    function generateChallenge() {
      var type = randInt(0, 3);
      var question, options, answer, explanation;

      if (type === 0) {
        // 求平均数
        var n = randInt(3, 5);
        var data = [];
        for (var i = 0; i < n; i++) data.push(randInt(5, 30));
        var sum = data.reduce(function(a, b) { return a + b; }, 0);
        var remainder = sum % n;
        if (remainder !== 0) data[n - 1] += (n - remainder);
        sum = data.reduce(function(a, b) { return a + b; }, 0);
        var avg = sum / n;
        question = '📊 ' + n + '个同学的分数分别是 ' + data.join('、') + '，他们的平均分是多少？';
        answer = avg;
        var wrong1 = avg + randInt(1, 3);
        var wrong2 = avg - randInt(1, 3);
        var wrong3 = Math.round(sum / (n + 1));
        if (wrong2 < 0) wrong2 = avg + randInt(4, 6);
        options = shuffle([
          { text: avg + ' 分', correct: true },
          { text: wrong1 + ' 分', correct: false },
          { text: wrong2 + ' 分', correct: false },
          { text: wrong3 + ' 分', correct: false }
        ]);
        explanation = '总数 ' + sum + ' ÷ ' + n + ' 人 = ' + avg + ' 分';

      } else if (type === 1) {
        // 已知平均数求缺失值
        var n2 = randInt(3, 4);
        var avg2 = randInt(10, 25);
        var known = [];
        for (var j = 0; j < n2 - 1; j++) known.push(randInt(avg2 - 5, avg2 + 5));
        var knownSum = known.reduce(function(a, b) { return a + b; }, 0);
        var missing = avg2 * n2 - knownSum;
        if (missing < 0) {
          // Adjust
          known[0] += (-missing + 2);
          knownSum = known.reduce(function(a, b) { return a + b; }, 0);
          missing = avg2 * n2 - knownSum;
        }
        question = '🔍 ' + n2 + '个数的平均数是 ' + avg2 + '，已知其中 ' + (n2 - 1) + ' 个数是 ' + known.join('、') + '，第 ' + n2 + ' 个数是多少？';
        answer = missing;
        var w1 = missing + randInt(1, 4);
        var w2 = missing - randInt(1, 4);
        var w3 = avg2;
        if (w2 < 0) w2 = missing + randInt(5, 8);
        options = shuffle([
          { text: '' + missing, correct: true },
          { text: '' + w1, correct: false },
          { text: '' + w2, correct: false },
          { text: '' + w3, correct: false }
        ]);
        explanation = '总数 = ' + avg2 + ' × ' + n2 + ' = ' + (avg2 * n2) + '，缺失 = ' + (avg2 * n2) + ' - ' + knownSum + ' = ' + missing;

      } else if (type === 2) {
        // 判断平均数范围
        var vals = [randInt(10, 30), randInt(40, 60), randInt(20, 50)];
        var minV = Math.min.apply(null, vals);
        var maxV = Math.max.apply(null, vals);
        var sum3 = vals.reduce(function(a, b) { return a + b; }, 0);
        var avg3 = sum3 / 3;
        question = '🤔 ' + vals.join('、') + ' 这三个数的平均数在哪个范围内？';
        var r1 = minV + '-' + Math.round((minV + maxV) / 2);
        var r2 = Math.round((minV + maxV) / 2) + '-' + maxV;
        var r3 = minV - 5 + '-' + minV;
        var r4 = maxV + '-' + (maxV + 10);
        // Determine correct range
        var avgRound = Math.round(avg3);
        var mid = Math.round((minV + maxV) / 2);
        var correctIdx;
        if (avgRound <= mid) correctIdx = 0; else correctIdx = 1;
        var ranges = [];
        if (correctIdx === 0) {
          ranges = [
            { text: r1, correct: true },
            { text: r2, correct: false },
            { text: r3, correct: false },
            { text: r4, correct: false }
          ];
        } else {
          ranges = [
            { text: r1, correct: false },
            { text: r2, correct: true },
            { text: r3, correct: false },
            { text: r4, correct: false }
          ];
        }
        options = shuffle(ranges);
        answer = avgRound;
        explanation = '平均数 = (' + vals.join('+') + ') ÷ 3 = ' + avgRound + '，一定在最小值 ' + minV + ' 和最大值 ' + maxV + ' 之间';

      } else {
        // 实际应用
        var contexts = [
          { item: '跑步', unit: '秒', vals: [45, 50, 40, 49] },
          { item: '读书', unit: '页', vals: [30, 45, 35, 50] },
          { item: '喝水', unit: 'ml', vals: [200, 350, 250, 400] }
        ];
        var ctx = contexts[randInt(0, contexts.length - 1)];
        var q = '📖 小华连续4天' + ctx.item + '，每天分别是 ' + ctx.vals.join('、') + ' ' + ctx.unit + '。平均每天' + ctx.item.replace('跑步', '跑').replace('读书', '读').replace('喝水', '喝') + '多少 ' + ctx.unit + '？';
        var s = ctx.vals.reduce(function(a, b) { return a + b; }, 0);
        var a2 = s / 4;
        question = q;
        answer = a2;
        var ww1 = a2 + 10;
        var ww2 = a2 - 10;
        var ww3 = s / 5;
        if (ww2 < 0) ww2 = a2 + 20;
        options = shuffle([
          { text: a2 + ' ' + ctx.unit, correct: true },
          { text: ww1 + ' ' + ctx.unit, correct: false },
          { text: ww2 + ' ' + ctx.unit, correct: false },
          { text: Math.round(ww3) + ' ' + ctx.unit, correct: false }
        ]);
        explanation = '总量 ' + s + ' ' + ctx.unit + ' ÷ 4 天 = ' + a2 + ' ' + ctx.unit + '/天';
      }

      return { question: question, options: options, explanation: explanation };
    }

    var currentChallenge = null;

    function renderChallenge() {
      currentChallenge = generateChallenge();
      document.getElementById('challengeQuestion').textContent = currentChallenge.question;
      var optContainer = document.getElementById('challengeOptions');
      optContainer.innerHTML = '';
      document.getElementById('challengeExplain').textContent = '';
      document.getElementById('challengeResult').textContent = '';
      currentChallenge.options.forEach(function(opt, idx) {
        var btn = document.createElement('button');
        btn.className = 'challenge-opt';
        btn.textContent = opt.text;
        btn.addEventListener('click', function() {
          onChallengeAnswer(btn, opt.correct);
        });
        optContainer.appendChild(btn);
      });
      document.getElementById('challengeScore').innerHTML = '✅ ' + challengeScore.correct + ' / ' + challengeScore.total;
    }

    function onChallengeAnswer(btn, isCorrect) {
      // Prevent double-click
      var allOpts = document.querySelectorAll('.challenge-opt');
      var alreadyAnswered = false;
      allOpts.forEach(function(o) { if (o.classList.contains('correct') || o.classList.contains('wrong')) alreadyAnswered = true; });
      if (alreadyAnswered) return;

      challengeScore.total++;
      if (isCorrect) {
        challengeScore.correct++;
        btn.classList.add('correct');
        document.getElementById('challengeResult').textContent = '🎉 答对了！';
        document.getElementById('challengeResult').style.color = '#34C759';
      } else {
        btn.classList.add('wrong');
        // Show correct answer
        allOpts.forEach(function(o) {
          var optData = currentChallenge.options[Array.from(allOpts).indexOf(o)];
          if (optData && optData.correct) o.classList.add('correct');
        });
        document.getElementById('challengeResult').textContent = '❌ 答错了！';
        document.getElementById('challengeResult').style.color = '#FF3B30';
      }
      document.getElementById('challengeExplain').textContent = '💡 ' + currentChallenge.explanation;
      document.getElementById('challengeScore').innerHTML = '✅ ' + challengeScore.correct + ' / ' + challengeScore.total;
      setTimeout(renderChallenge, 2000);
    }

    renderChallenge();

  })();
  </script>
