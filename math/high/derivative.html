<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>导数 · 概念、运算与应用互动可视化</title>
<link rel="stylesheet" href="assets/common.css" />
<style>
  :root {
    --primary: #8b5cf6;
    --curve: #3b82f6;
    --tangent: #ef4444;
    --deriv: #10b981;
    --extrema: #fbbf24;
    --dark: #1e293b;
    --light: #f1f5f9;
  }
  body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--light); font-family: -apple-system, "PingFang SC", sans-serif; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 2rem; background: linear-gradient(90deg, var(--curve), var(--tangent), var(--deriv)); -webkit-background-clip: text; color: transparent; }
  header p { color: #94a3b8; margin-top: 6px; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,0.06); cursor: pointer; transition: all .25s; border: 1px solid rgba(255,255,255,0.1); font-size: 15px; }
  .tab.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 20px rgba(139,92,246,.4); }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .canvas-wrap { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; backdrop-filter: blur(10px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
  .panel { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; backdrop-filter: blur(10px); }
  .panel h3 { margin: 0 0 10px; font-size: 1.1rem; }
  .equation { font-family: "Times New Roman", serif; font-size: 1.2rem; text-align: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 10px 0; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
  .slider-row label { flex: 0 0 90px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .slider-row .val { flex: 0 0 70px; text-align: right; font-family: monospace; color: var(--primary); font-weight: 600; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 13px; }
  .info-grid div { background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 8px; }
  .info-grid b { color: #fbbf24; }
  .mode-switch { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .mode-btn { padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 13px; color: #e2e8f0; }
  .mode-btn.active { background: var(--primary); border-color: var(--primary); }
  .func-select { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .func-btn { padding: 6px 12px; border-radius: 8px; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); cursor: pointer; font-size: 13px; color: #93c5fd; }
  .func-btn.active { background: var(--curve); border-color: var(--curve); color: white; }
  .quiz { margin-top: 14px; padding: 14px; background: rgba(139,92,246,0.08); border-radius: 12px; border: 1px solid rgba(139,92,246,0.3); }
  .quiz-q { font-size: 14px; margin-bottom: 10px; }
  .quiz-opts { display: grid; gap: 6px; }
  .quiz-opt { padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .2s; border: 1px solid transparent; }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt.correct { background: rgba(16,185,129,0.25); border-color: #10b981; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .quiz-feedback { margin-top: 8px; font-size: 13px; color: #fbbf24; min-height: 18px; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: #cbd5e1; margin-top: 8px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .legend .l-curve::before { background: var(--curve); }
  .legend .l-tangent::before { background: var(--tangent); }
  .legend .l-deriv::before { background: var(--deriv); }
  .legend .l-extrema::before { background: var(--extrema); }
  footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📈 导数 Interactive</h1>
    <p>导数概念 · 运算法则 · 单调性/极值/最值应用</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="geometric">📐 几何意义</div>
    <div class="tab" data-mode="rules">🔢 求导法则</div>
    <div class="tab" data-mode="analysis">📊 函数分析</div>
    <div class="tab" data-mode="quiz">🎯 互动练习</div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="cv" width="720" height="600"></canvas>
      <div class="legend">
        <span class="l-curve">f(x)</span>
        <span class="l-tangent">切线/斜率</span>
        <span class="l-deriv">f'(x)</span>
        <span class="l-extrema">极值点</span>
      </div>
    </div>

    <div class="panel">
      <h3 id="panelTitle">📐 导数的几何意义</h3>
      <div class="equation" id="equation">f'(x₀) = lim[Δx→0] (f(x₀+Δx)−f(x₀))/Δx</div>

      <div class="func-select" id="funcSelect"></div>

      <div id="controls"></div>

      <div class="info-grid" id="infoGrid"></div>

      <div class="quiz" id="quizBox" style="display:none;">
        <div class="quiz-q" id="quizQ"></div>
        <div class="quiz-opts" id="quizOpts"></div>
        <div class="quiz-feedback" id="quizFb"></div>
      </div>
    </div>
  </div>

  <footer>高中数学 · 导数 · 拖动滑块探索切线与导函数</footer>
</div>

<script src="assets/animation.js"></script>
<script src="assets/touch.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H/2;
  const scale = 50; // 1 unit = 50 px

  let mode = 'geometric';
  let funcIdx = 0;
  let x0 = 1; // point of tangency
  let deltaX = 1; // for secant animation
  let showDerivCurve = true;

  const funcs = [
    { name: 'x²', f: x => x*x, df: x => 2*x, label: 'f(x) = x²', dlabel: "f'(x) = 2x" },
    { name: 'x³', f: x => x*x*x, df: x => 3*x*x, label: 'f(x) = x³', dlabel: "f'(x) = 3x²" },
    { name: 'sin(x)', f: x => Math.sin(x), df: x => Math.cos(x), label: 'f(x) = sin x', dlabel: "f'(x) = cos x" },
    { name: 'eˣ', f: x => Math.exp(x), df: x => Math.exp(x), label: 'f(x) = eˣ', dlabel: "f'(x) = eˣ" },
    { name: 'ln(x)', f: x => x > 0 ? Math.log(x) : NaN, df: x => x > 0 ? 1/x : NaN, label: 'f(x) = ln x', dlabel: "f'(x) = 1/x" },
    { name: 'x³−3x', f: x => x*x*x - 3*x, df: x => 3*x*x - 3, label: 'f(x) = x³−3x', dlabel: "f'(x) = 3x²−3" },
  ];

  const colors = { curve: '#3b82f6', tangent: '#ef4444', deriv: '#10b981', extrema: '#fbbf24', secant: '#f97316', axis: '#475569', grid: '#1e293b' };

  // ---------- drawing helpers ----------
  function toScreen(x, y) { return [cx + x*scale, cy - y*scale]; }
  function drawGrid() {
    ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;
    for (let i = -10; i <= 10; i++) {
      const [x1, y1] = toScreen(i, -10), [x2, y2] = toScreen(i, 10);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const [x3, y3] = toScreen(-10, i), [x4, y4] = toScreen(10, i);
      ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    }
    ctx.strokeStyle = colors.axis; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
    ctx.fillStyle = colors.axis;
    ctx.beginPath(); ctx.moveTo(W-5, cy-4); ctx.lineTo(W, cy); ctx.lineTo(W-5, cy+4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx-4, 5); ctx.lineTo(cx, 0); ctx.lineTo(cx+4, 5); ctx.fill();
  }
  function drawFunc(f, color, xRange=[-6, 6]) {
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath();
    let started = false;
    for (let px = 0; px <= W; px += 1) {
      const x = (px - cx) / scale;
      if (x < xRange[0] || x > xRange[1]) continue;
      const y = f(x);
      if (isNaN(y) || !isFinite(y) || Math.abs(y) > 20) { started = false; continue; }
      const [sx, sy] = toScreen(x, y);
      if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
  function drawPoint(x, y, color, label, r=5) {
    const [sx, sy] = toScreen(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    if (label) {
      ctx.fillStyle = color; ctx.font = '13px sans-serif';
      ctx.fillText(label, sx + 8, sy - 8);
    }
  }
  function drawTangent(x0, f, df, color) {
    const y0 = f(x0);
    const slope = df(x0);
    if (isNaN(y0) || isNaN(slope)) return;
    // tangent line: y - y0 = slope*(x - x0)
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    const x1 = -8, x2 = 8;
    const y1 = y0 + slope*(x1 - x0);
    const y2 = y0 + slope*(x2 - x0);
    const [sx1, sy1] = toScreen(x1, y1);
    const [sx2, sy2] = toScreen(x2, y2);
    ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
  }
  function drawSecant(x0, deltaX, f, color) {
    const y0 = f(x0);
    const y1 = f(x0 + deltaX);
    if (isNaN(y0) || isNaN(y1)) return;
    const slope = (y1 - y0) / deltaX;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
    ctx.beginPath();
    const x1 = -8, x2 = 8;
    const yy1 = y0 + slope*(x1 - x0);
    const yy2 = y0 + slope*(x2 - x0);
    const [sx1, sy1] = toScreen(x1, yy1);
    const [sx2, sy2] = toScreen(x2, yy2);
    ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
    ctx.setLineDash([]);
    // points
    drawPoint(x0, y0, colors.curve, 'P', 5);
    drawPoint(x0+deltaX, y1, colors.secant, 'Q', 5);
  }

  // ---------- render ----------
  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    const fn = funcs[funcIdx];

    if (mode === 'geometric') {
      // draw function
      drawFunc(fn.f, colors.curve);
      // draw secant line approaching tangent
      drawSecant(x0, deltaX, fn.f, colors.secant);
      // draw tangent line
      drawTangent(x0, fn.f, fn.df, colors.tangent);
      // point on curve
      drawPoint(x0, fn.f(x0), colors.tangent, `(${x0.toFixed(1)}, ${fn.f(x0).toFixed(2)})`, 6);
    } else if (mode === 'rules') {
      // show function and its derivative
      drawFunc(fn.f, colors.curve);
      if (showDerivCurve) drawFunc(fn.df, colors.deriv);
      drawPoint(x0, fn.f(x0), colors.curve, '', 5);
      drawTangent(x0, fn.f, fn.df, colors.tangent);
    } else if (mode === 'analysis') {
      // show function, derivative, and extrema
      drawFunc(fn.f, colors.curve);
      if (showDerivCurve) drawFunc(fn.df, colors.deriv);
      // find extrema where df(x) = 0
      const extrema = [];
      for (let x = -5; x <= 5; x += 0.01) {
        const d1 = fn.df(x);
        const d2 = fn.df(x + 0.01);
        if (d1 * d2 < 0) {
          // sign change
          const ex = x + 0.005;
          const ey = fn.f(ex);
          if (!isNaN(ey)) extrema.push([ex, ey, d1 > 0 ? 'max' : 'min']);
        }
      }
      extrema.forEach(([ex, ey, type]) => {
        drawPoint(ex, ey, colors.extrema, type === 'max' ? '极大' : '极小', 7);
      });
      // monotone regions
      ctx.fillStyle = 'rgba(16,185,129,0.1)';
      for (let x = -6; x < 6; x += 0.1) {
        if (fn.df(x) > 0) {
          const [sx, sy] = toScreen(x, -6);
          ctx.fillRect(sx, sy, scale*0.1, scale*12);
        }
      }
      ctx.fillStyle = 'rgba(239,68,68,0.1)';
      for (let x = -6; x < 6; x += 0.1) {
        if (fn.df(x) < 0) {
          const [sx, sy] = toScreen(x, -6);
          ctx.fillRect(sx, sy, scale*0.1, scale*12);
        }
      }
    } else if (mode === 'quiz') {
      drawFunc(fn.f, colors.curve);
    }
  }

  // ---------- UI ----------
  function updatePanel() {
    const title = document.getElementById('panelTitle');
    const eq = document.getElementById('equation');
    const ctrl = document.getElementById('controls');
    const info = document.getElementById('infoGrid');
    const quiz = document.getElementById('quizBox');
    const funcSel = document.getElementById('funcSelect');
    quiz.style.display = 'none';

    // function selector
    funcSel.innerHTML = funcs.map((f, i) => `<div class="func-btn ${i===funcIdx?'active':''}" data-idx="${i}">${f.name}</div>`).join('');
    funcSel.querySelectorAll('.func-btn').forEach(b => {
      b.onclick = () => { funcIdx = parseInt(b.dataset.idx); updatePanel(); };
    });

    const fn = funcs[funcIdx];

    if (mode === 'geometric') {
      title.textContent = '📐 导数的几何意义 — 切线斜率';
      eq.innerHTML = `f'(x₀) = lim<sub>Δx→0</sub> (f(x₀+Δx)−f(x₀))/Δx = ${fn.df(x0).toFixed(3)}`;
      ctrl.innerHTML = `
        <div class="slider-row"><label>切点 x₀</label><input type="range" min="-4" max="4" step="0.1" value="${x0}"><span class="val">${x0.toFixed(1)}</span></div>
        <div class="slider-row"><label>Δx (逼近)</label><input type="range" min="0.01" max="3" step="0.01" value="${deltaX}"><span class="val">${deltaX.toFixed(2)}</span></div>`;
      const slope = fn.df(x0);
      info.innerHTML = `
        <div>f(${x0.toFixed(1)}) = <b>${fn.f(x0).toFixed(3)}</b></div>
        <div>f'(${x0.toFixed(1)}) = <b>${slope.toFixed(3)}</b></div>
        <div>切线斜率 = <b>${slope.toFixed(3)}</b></div>
        <div>割线斜率 = <b>${((fn.f(x0+deltaX)-fn.f(x0))/deltaX).toFixed(3)}</b></div>`;
    } else if (mode === 'rules') {
      title.textContent = '🔢 求导法则 — 原函数与导函数';
      eq.innerHTML = `${fn.label} → ${fn.dlabel}`;
      ctrl.innerHTML = `
        <div class="slider-row"><label>观察点 x</label><input type="range" min="-4" max="4" step="0.1" value="${x0}"><span class="val">${x0.toFixed(1)}</span></div>`;
      info.innerHTML = `
        <div>f(${x0.toFixed(1)}) = <b>${fn.f(x0).toFixed(3)}</b></div>
        <div>f'(${x0.toFixed(1)}) = <b>${fn.df(x0).toFixed(3)}</b></div>
        <div>切线斜率 = <b>${fn.df(x0).toFixed(3)}</b></div>
        <div>显示 f'(x) 曲线: <b>${showDerivCurve?'是':'否'}</b></div>`;
    } else if (mode === 'analysis') {
      title.textContent = '📊 函数分析 — 单调性与极值';
      eq.innerHTML = `${fn.label}，${fn.dlabel}`;
      ctrl.innerHTML = ``;
      // find extrema
      const extrema = [];
      for (let x = -5; x <= 5; x += 0.01) {
        const d1 = fn.df(x);
        const d2 = fn.df(x + 0.01);
        if (d1 * d2 < 0) {
          const ex = x + 0.005;
          const ey = fn.f(ex);
          if (!isNaN(ey)) extrema.push([ex, ey, d1 > 0 ? '极大' : '极小']);
        }
      }
      let extStr = extrema.map(([x, y, t]) => `${t}(${x.toFixed(2)}, ${y.toFixed(2)})`).join('；') || '无';
      info.innerHTML = `
        <div>极值点: <b>${extStr}</b></div>
        <div>递增区间: <b>f'(x)>0</b></div>
        <div>递减区间: <b>f'(x)<0</b></div>
        <div>绿色区域: <b>递增</b>，红色: <b>递减</b></div>`;
    } else if (mode === 'quiz') {
      title.textContent = '🎯 互动练习';
      eq.innerHTML = '测试你对导数的理解';
      ctrl.innerHTML = '';
      info.innerHTML = '';
      quiz.style.display = 'block';
      loadQuiz();
      return;
    }

    // bind sliders
    ctrl.querySelectorAll('input[type=range]').forEach((sl, i) => {
      sl.addEventListener('input', () => {
        const v = parseFloat(sl.value);
        sl.nextElementSibling.textContent = v.toFixed(i === 1 && mode === 'geometric' ? 2 : 1);
        if (mode === 'geometric') {
          if (i === 0) x0 = v; else deltaX = v;
        } else {
          x0 = v;
        }
        updatePanel();
      });
    });
  }

  // ---------- quiz ----------
  const quizzes = [
    { q: 'f(x) = x³ 的导数是？', opts: ['x²', '3x²', '3x', 'x³/3'], ans: 1 },
    { q: 'f(x) = sin x 的导数是？', opts: ['-cos x', 'cos x', 'sin x', '-sin x'], ans: 1 },
    { q: 'f(x) = eˣ 的导数是？', opts: ['eˣ', 'xeˣ⁻¹', 'ln x', '1/eˣ'], ans: 0 },
    { q: 'f(x) = x³−3x 在 x=1 处取？', opts: ['极大值', '极小值', '最大值', '最小值'], ans: 1 },
    { q: '导数 f\'(x₀) 的几何意义是？', opts: ['曲线在该点的切线斜率', '曲线的长度', '曲线围成的面积', '函数的平均值'], ans: 0 },
    { q: 'f(x) = ln x 的导数是？', opts: ['1/x', 'x', 'eˣ', 'ln x / x'], ans: 0 },
  ];
  let curQuiz = 0;
  let quizScore = 0;
  const totalQuiz = quizzes.length;
  function loadQuiz() {
    const q = quizzes[curQuiz % quizzes.length];
    document.getElementById('quizQ').textContent = q.q + `  (${(curQuiz % totalQuiz) + 1}/${totalQuiz})`;
    const opts = document.getElementById('quizOpts');
    opts.innerHTML = '';
    q.opts.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'quiz-opt';
      d.textContent = String.fromCharCode(65+i) + '. ' + o;
      d.onclick = () => {
        opts.querySelectorAll('.quiz-opt').forEach(x => x.classList.remove('correct','wrong'));
        if (i === q.ans) {
          d.classList.add('correct');
          quizScore++;
          document.getElementById('quizFb').textContent = '✅ 正确！';
        } else {
          d.classList.add('wrong');
          opts.children[q.ans].classList.add('correct');
          document.getElementById('quizFb').textContent = '❌ 正确答案已标出。';
        }
        if ((curQuiz + 1) % totalQuiz === 0) {
          setTimeout(() => {
            const passed = quizScore >= Math.ceil(totalQuiz * 0.6);
            const msg = `本轮得分 ${quizScore}/${totalQuiz}` + (passed ? '，已记录完成 ✓' : '，继续加油！');
            document.getElementById('quizFb').textContent = msg;
            if (passed && typeof PageProgress !== 'undefined') {
              PageProgress.markDone('derivative');
            }
            quizScore = 0;
          }, 1400);
        }
        setTimeout(() => { curQuiz++; loadQuiz(); }, 1600);
      };
      opts.appendChild(d);
    });
    document.getElementById('quizFb').textContent = '';
  }

  // ---------- events ----------
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      mode = t.dataset.mode;
      updatePanel();
    };
  });

  // loop
  function loop() {
    render();
    requestAnimationFrame(loop);
  }
  updatePanel();
  loop();
})();
</script>
  <script src="assets/nav.js" data-home="../../index.html" data-back="index.html" data-label="高中数学"></script>
</body>
</html>
