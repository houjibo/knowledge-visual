<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>组合数学 · 互动可视化</title>
<style>
  :root {
    --primary: #f59e0b;
    --perm: #a78bfa;
    --binom: #06b6d4;
    --pigeon: #10b981;
    --incl: #ec4899;
    --dark: #0f172a;
    --card: rgba(15,23,42,0.7);
    --border: rgba(255,255,255,0.08);
    --light: #f1f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(135deg, #0f172a 0%, #1f2937 50%, #0f172a 100%); color: var(--light); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .back { display:inline-block; margin-bottom: 12px; color: #fcd34d; text-decoration: none; font-size: 14px; }
  .back:hover { color: #fde68a; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 2.2rem; background: linear-gradient(90deg, var(--perm), var(--binom), var(--pigeon), var(--incl)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: #94a3b8; margin-top: 6px; font-size: 15px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); cursor: pointer; transition: all .25s; border: 1px solid var(--border); font-size: 14px; user-select: none; min-height: 40px; }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #1f2937; font-weight: 700; box-shadow: 0 4px 20px rgba(245,158,11,.4); }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .canvas-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; backdrop-filter: blur(10px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); touch-action: manipulation; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; backdrop-filter: blur(10px); max-height: 560px; overflow-y: auto; }
  .panel h3 { margin: 0 0 12px; font-size: 1.1rem; color: #e2e8f0; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:#94a3b8; }
  .legend span::before { content:''; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; background:currentColor; }
  .l-perm { color: var(--perm); }
  .l-binom { color: var(--binom); }
  .l-pigeon { color: var(--pigeon); }
  .l-incl { color: var(--incl); }
  .equation { font-family: "Times New Roman", serif; font-size: 1.05rem; text-align: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 10px 0; line-height: 1.9; }
  .equation b { color: #fbbf24; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
  .slider-row label { flex: 0 0 110px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--primary); min-height: 32px; }
  .slider-row .val { flex: 0 0 90px; text-align: right; font-family: monospace; color: var(--primary); font-weight: 600; }
  .btn-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: #e2e8f0; cursor: pointer; font-size: 13px; transition: all .2s; min-height: 36px; }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #1f2937; font-weight: 700; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 13px; }
  .info-grid div { background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 8px; }
  .concept-card { border-left: 3px solid var(--perm); background: rgba(255,255,255,0.04); padding: 10px 12px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 13px; line-height: 1.7; }
  .concept-card.binom { border-left-color: var(--binom); }
  .concept-card.pigeon { border-left-color: var(--pigeon); }
  .concept-card.incl { border-left-color: var(--incl); }
  .concept-card .title { font-weight: 700; color: #fbbf24; margin-bottom: 4px; }
  .quiz .quiz-q { font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
  .quiz-opt { padding: 10px 12px; margin: 6px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .2s; min-height: 40px; }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt.correct { background: rgba(16,185,129,0.25); border-color: var(--pigeon); }
  .quiz-opt.wrong { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .quiz-feedback { margin-top: 10px; font-size: 13px; line-height: 1.7; }
  .quiz-result { text-align: center; padding: 18px; background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 15px; line-height: 2; }
  footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="index.html">← 返回大学数学</a>
  <header>
    <h1>🎲 组合数学</h1>
    <p>排列组合 · 二项式定理 · 鸽巢原理 · 容斥原理</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="perm">🔀 排列组合</div>
    <div class="tab" data-mode="binom">△ 二项式定理</div>
    <div class="tab" data-mode="pigeon">🕊️ 鸽巢原理</div>
    <div class="tab" data-mode="incl">⊕ 容斥原理</div>
    <div class="tab" data-mode="quiz">🎯 互动练习</div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="600" height="450"></canvas>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <footer>知识可视化 · 大学数学 · 组合数学</footer>
</div>

<script src="assets/common.js"></script>
<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const legendEl = document.getElementById('legend');

let mode = 'perm';
let animId = null;
let time = 0;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    initMode();
  });
});

function initMode() {
  if (animId) cancelAnimationFrame(animId);
  if (mode === 'perm') initPerm();
  else if (mode === 'binom') initBinom();
  else if (mode === 'pigeon') initPigeon();
  else if (mode === 'incl') initIncl();
  else if (mode === 'quiz') initQuiz();
}

function startLoop(draw) {
  function frame() { time += 1; draw(); animId = requestAnimationFrame(frame); }
  frame();
}

function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
function P(n, k) { let r = 1; for (let i = 0; i < k; i++) r *= (n - i); return r; }
function C(n, k) { if (k < 0 || k > n) return 0; return P(n, k) / fact(k); }
function fmtBig(x) {
  if (x >= 1e9) return x.toExponential(2);
  return Math.round(x).toLocaleString();
}

// ═══════════════════════════════════════════════
// MODE 1: 排列组合 Permutations & Combinations
// ═══════════════════════════════════════════════
let permN = 5, permK = 2, permType = 'C';

function initPerm() {
  legendEl.innerHTML = `<span class="l-perm">已选</span><span class="l-binom">候选</span><span style="color:#64748b">未选</span>`;
  panel.innerHTML = `
    <h3>🔀 排列 vs 组合</h3>
    <div class="concept-card">
      <div class="title">排列 A(n,k)</div>
      从 n 个不同元素取 k 个<b>排成一列</b>，顺序有关：A(n,k) = n! / (n-k)!
    </div>
    <div class="concept-card binom">
      <div class="title">组合 C(n,k)</div>
      从 n 个不同元素取 k 个<b>组成一组</b>，顺序无关：C(n,k) = n! / (k!(n-k)!)
    </div>
    <div class="equation">
      A(n,k) = C(n,k) × k!
    </div>
    <div class="slider-row">
      <label>元素总数 n</label>
      <input type="range" id="permN" min="3" max="10" value="5">
      <span class="val" id="permNVal">5</span>
    </div>
    <div class="slider-row">
      <label>选取个数 k</label>
      <input type="range" id="permK" min="1" max="5" value="2">
      <span class="val" id="permKVal">2</span>
    </div>
    <div class="btn-row">
      <button class="btn ${permType === 'C' ? 'primary' : ''}" id="typeC">组合 C(n,k)</button>
      <button class="btn ${permType === 'P' ? 'primary' : ''}" id="typeP">排列 A(n,k)</button>
    </div>
    <div class="info-grid">
      <div>类型<br><b id="permTypeName">组合 C(${permN},${permK})</b></div>
      <div>结果<br><b id="permResult">${C(permN, permK)}</b></div>
      <div>对比 A<br><b id="permAlt">${P(permN, permK)}</b></div>
      <div>倍数 k!<br><b id="permKFact">${fact(permK)}</b></div>
    </div>`;
  document.getElementById('permN').addEventListener('input', e => {
    permN = +e.target.value;
    if (permK > permN) permK = permN;
    document.getElementById('permNVal').textContent = permN;
    document.getElementById('permK').max = permN;
    document.getElementById('permK').value = permK;
    document.getElementById('permKVal').textContent = permK;
    refreshPerm();
  });
  document.getElementById('permK').addEventListener('input', e => {
    permK = +e.target.value;
    document.getElementById('permKVal').textContent = permK;
    refreshPerm();
  });
  document.getElementById('typeC').addEventListener('click', () => { permType = 'C'; refreshPerm(); initPerm(); });
  document.getElementById('typeP').addEventListener('click', () => { permType = 'P'; refreshPerm(); initPerm(); });
  startLoop(drawPerm);
}

function refreshPerm() {
  const typeName = document.getElementById('permTypeName');
  if (!typeName) return;
  typeName.textContent = (permType === 'C' ? '组合 C(' : '排列 A(') + permN + ',' + permK + ')';
  document.getElementById('permResult').textContent = fmtBig(permType === 'C' ? C(permN, permK) : P(permN, permK));
  document.getElementById('permAlt').textContent = fmtBig(permType === 'C' ? P(permN, permK) : C(permN, permK));
  document.getElementById('permKFact').textContent = fmtBig(fact(permK));
}

function drawPerm() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = 130;
  // 画 n 个元素围成圈
  const cols = ['#a78bfa', '#06b6d4', '#10b981', '#ec4899', '#f59e0b', '#ef4444', '#84cc16', '#f97316', '#8b5cf6', '#14b8a6'];
  for (let i = 0; i < permN; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / permN;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    const selected = i < permK;
    ctx.beginPath();
    ctx.arc(x, y, 24, 0, 2 * Math.PI);
    ctx.fillStyle = selected ? cols[i % cols.length] : 'rgba(100,116,139,0.3)';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String.fromCharCode(65 + i), x, y);
  }
  // 中心显示计数
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText((permType === 'C' ? 'C' : 'A') + '(' + permN + ',' + permK + ')', cx, cy - 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px monospace';
  ctx.fillText(fmtBig(permType === 'C' ? C(permN, permK) : P(permN, permK)), cx, cy + 14);
  // 底部说明
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(permType === 'C' ? '顺序无关 · 选出的集合视为相同' : '顺序有关 · 选出的不同排列视为不同', cx, H - 18);
}

// ═══════════════════════════════════════════════
// MODE 2: 二项式定理 & 杨辉三角
// ═══════════════════════════════════════════════
let binomN = 8, binomHL = -1;

function initBinom() {
  legendEl.innerHTML = `<span class="l-binom">当前行</span><span class="l-perm">父节点(相加)</span><span style="color:#fbbf24">C(n,k)</span>`;
  panel.innerHTML = `
    <h3>△ 二项式定理</h3>
    <div class="equation">
      (a+b)<sup>n</sup> = <span style="color:#fbbf24">∑</span> C(n,k) a<sup>n-k</sup> b<sup>k</sup>
    </div>
    <div class="concept-card binom">
      <div class="title">杨辉三角递推</div>
      C(n,k) = C(n-1,k-1) + C(n-1,k)：每个数等于肩上两数之和。
    </div>
    <div class="concept-card">
      <div class="title">性质</div>
      · 对称：C(n,k) = C(n,n-k)<br>
      · 行和：∑ C(n,k) = 2<sup>n</sup><br>
      · 交替和：∑ (-1)<sup>k</sup> C(n,k) = 0 (n≥1)
    </div>
    <div class="slider-row">
      <label>行数 n</label>
      <input type="range" id="binomN" min="4" max="14" value="8">
      <span class="val" id="binomNVal">8</span>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="binomHL">✨ 高亮一行</button>
    </div>
    <div class="info-grid">
      <div>当前行<br><b id="binomCurN">-</b></div>
      <div>行和 2^n<br><b id="binomRowSum">-</b></div>
      <div>最大项<br><b id="binomRowMax">-</b></div>
      <div>项数<br><b id="binomRowLen">-</b></div>
    </div>`;
  document.getElementById('binomN').addEventListener('input', e => {
    binomN = +e.target.value;
    document.getElementById('binomNVal').textContent = binomN;
  });
  document.getElementById('binomHL').addEventListener('click', () => {
    binomHL = (binomHL + 1) % binomN;
    const rowSum = Math.pow(2, binomHL);
    let rowMax = 0;
    for (let k = 0; k <= binomHL; k++) rowMax = Math.max(rowMax, C(binomHL, k));
    document.getElementById('binomCurN').textContent = 'n=' + binomHL;
    document.getElementById('binomRowSum').textContent = fmtBig(rowSum);
    document.getElementById('binomRowMax').textContent = fmtBig(rowMax);
    document.getElementById('binomRowLen').textContent = binomHL + 1;
  });
  startLoop(drawBinom);
}

function drawBinom() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2;
  const dy = (H - 60) / binomN;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let n = 0; n < binomN; n++) {
    const y = 30 + n * dy;
    const cellW = Math.min(60, (W - 60) / (n + 1));
    for (let k = 0; k <= n; k++) {
      const x = cx + (k - n / 2) * cellW;
      const v = C(n, k);
      const isHL = n === binomHL;
      const isParent = (n === binomHL - 1) && binomHL >= 1;
      if (isHL) {
        ctx.fillStyle = 'rgba(6,182,212,0.4)';
        ctx.beginPath();
        ctx.arc(x, y, Math.min(20, cellW * 0.45), 0, 2 * Math.PI);
        ctx.fill();
      } else if (isParent) {
        ctx.fillStyle = 'rgba(167,139,250,0.25)';
        ctx.beginPath();
        ctx.arc(x, y, Math.min(18, cellW * 0.4), 0, 2 * Math.PI);
        ctx.fill();
      }
      ctx.fillStyle = isHL ? '#fff' : (isParent ? '#a78bfa' : '#cbd5e1');
      ctx.font = (isHL ? 'bold ' : '') + Math.max(11, Math.min(15, cellW * 0.32)) + 'px monospace';
      ctx.fillText(String(v), x, y);
    }
  }
  // 底部公式
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('C(n,k) = C(n-1,k-1) + C(n-1,k)', cx, H - 12);
}

// ═══════════════════════════════════════════════
// MODE 3: 鸽巢原理
// ═══════════════════════════════════════════════
let pigeonM = 10, pigeonN = 3, pigeonAnim = false;
let pigeons = [];

function pigeonReset() {
  pigeons = [];
  for (let i = 0; i < pigeonM; i++) {
    pigeons.push({ x: 80 + Math.random() * 440, y: 60 + Math.random() * 80, hole: -1, t: 0 });
  }
}

function initPigeon() {
  legendEl.innerHTML = `<span class="l-pigeon">鸽子</span><span class="l-binom">巢</span><span style="color:#fbbf24">必有巢 ≥ ⌈m/n⌉</span>`;
  pigeonReset();
  panel.innerHTML = `
    <h3>🕊️ 鸽巢原理（抽屉原理）</h3>
    <div class="concept-card pigeon">
      <div class="title">基本形式</div>
      m 只鸽子放进 n 个巢，若 m > n，则<b>至少一个巢</b>有 ≥ ⌈m/n⌉ 只鸽子。
    </div>
    <div class="concept-card">
      <div class="title">经典应用</div>
      · 13 个人中至少两人生日同月<br>
      · 367 人中至少两人生日同一天<br>
      · 任意 5 个整数必有 3 个之和被 3 整除
    </div>
    <div class="equation">
      m 鸽子 / n 巢 ⇒ ∃巢 ≥ ⌈m/n⌉
    </div>
    <div class="slider-row">
      <label>鸽子数 m</label>
      <input type="range" id="pigeonM" min="4" max="30" value="10">
      <span class="val" id="pigeonMVal">10</span>
    </div>
    <div class="slider-row">
      <label>巢数 n</label>
      <input type="range" id="pigeonN" min="2" max="8" value="3">
      <span class="val" id="pigeonNVal">3</span>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="pigeonDistribute">🕊️ 随机分配</button>
      <button class="btn" id="pigeonReset">↻ 重置</button>
    </div>
    <div class="info-grid">
      <div>保证巢容量<br><b id="pigeonGuarantee">⌈10/3⌉=4</b></div>
      <div>实际最大巢<br><b id="pigeonMax">-</b></div>
      <div>最满的巢<br><b id="pigeonMaxIdx">-</b></div>
      <div>最空的巢<br><b id="pigeonMin">-</b></div>
    </div>`;
  document.getElementById('pigeonM').addEventListener('input', e => {
    pigeonM = +e.target.value;
    document.getElementById('pigeonMVal').textContent = pigeonM;
    document.getElementById('pigeonGuarantee').textContent = '⌈' + pigeonM + '/' + pigeonN + '⌉=' + Math.ceil(pigeonM / pigeonN);
    pigeonReset();
  });
  document.getElementById('pigeonN').addEventListener('input', e => {
    pigeonN = +e.target.value;
    document.getElementById('pigeonNVal').textContent = pigeonN;
    document.getElementById('pigeonGuarantee').textContent = '⌈' + pigeonM + '/' + pigeonN + '⌉=' + Math.ceil(pigeonM / pigeonN);
    pigeonReset();
  });
  document.getElementById('pigeonDistribute').addEventListener('click', () => {
    pigeons.forEach(p => { p.hole = Math.floor(Math.random() * pigeonN); p.t = 0; });
    pigeonAnim = true;
  });
  document.getElementById('pigeonReset').addEventListener('click', () => {
    pigeonReset();
    document.getElementById('pigeonMax').textContent = '-';
    document.getElementById('pigeonMaxIdx').textContent = '-';
    document.getElementById('pigeonMin').textContent = '-';
  });
  startLoop(drawPigeon);
}

function drawPigeon() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  // 画巢（底部一排圆洞）
  const holeR = 32;
  const holeY = H - 80;
  const holeXs = [];
  for (let i = 0; i < pigeonN; i++) {
    const x = 60 + (i + 0.5) * (W - 120) / pigeonN;
    holeXs.push(x);
    ctx.beginPath();
    ctx.arc(x, holeY, holeR, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(6,182,212,0.25)';
    ctx.fill();
    ctx.strokeStyle = '#06b6d4';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#06b6d4';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('巢' + (i + 1), x, holeY + holeR + 16);
  }
  // 鸽子飞入动画
  if (pigeonAnim) {
    let allIn = true;
    pigeons.forEach(p => {
      if (p.hole >= 0 && p.t < 1) {
        p.t = Math.min(1, p.t + 0.04);
        allIn = false;
      }
    });
    if (allIn) {
      pigeonAnim = false;
      // 统计
      const counts = new Array(pigeonN).fill(0);
      pigeons.forEach(p => { if (p.hole >= 0) counts[p.hole]++; });
      const mx = Math.max(...counts), mn = Math.min(...counts);
      document.getElementById('pigeonMax').textContent = mx;
      document.getElementById('pigeonMaxIdx').textContent = '巢' + (counts.indexOf(mx) + 1);
      document.getElementById('pigeonMin').textContent = mn;
    }
  }
  // 画鸽子（按巢分组显示）
  const perHole = {};
  pigeons.forEach(p => {
    if (p.hole < 0) {
      // 在上方等待区
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#10b981';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.fillText('🕊', p.x, p.y);
    } else {
      const idx = perHole[p.hole] = (perHole[p.hole] || 0) + 1;
      const hx = holeXs[p.hole];
      const tx = hx + ((idx - 1) % 3 - 1) * 12;
      const ty = holeY - 8 + Math.floor((idx - 1) / 3) * 12 - 12;
      const sx = p.x + (tx - p.x) * p.t;
      const sy = p.y + (ty - p.y) * p.t;
      ctx.beginPath();
      ctx.arc(sx, sy, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#10b981';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '9px sans-serif';
      ctx.fillText('🕊', sx, sy);
    }
  });
  // 顶部说明
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${pigeonM} 只鸽子 / ${pigeonN} 个巢 ⇒ 必有巢 ≥ ⌈${pigeonM}/${pigeonN}⌉ = ${Math.ceil(pigeonM / pigeonN)} 只`, W / 2, 24);
}

// ═══════════════════════════════════════════════
// MODE 4: 容斥原理
// ═══════════════════════════════════════════════
let inclA = 30, inclB = 24, inclAB = 10;

function initIncl() {
  legendEl.innerHTML = `<span class="l-incl">A</span><span class="l-binom">B</span><span class="l-pigeon">A∩B</span>`;
  panel.innerHTML = `
    <h3>⊕ 容斥原理</h3>
    <div class="equation">
      |A ∪ B| = |A| + |B| − |A ∩ B|
    </div>
    <div class="concept-card incl">
      <div class="title">三集合版本</div>
      |A∪B∪C| = Σ|A| − Σ|A∩B| + |A∩B∩C|
    </div>
    <div class="concept-card">
      <div class="title">应用：欧拉函数 φ(n)</div>
      φ(n) = n · Π(1 − 1/p)，p 取遍 n 的素因子。由容斥原理直接推出。
    </div>
    <div class="slider-row">
      <label>|A|</label>
      <input type="range" id="inclA" min="5" max="50" value="30">
      <span class="val" id="inclAVal">30</span>
    </div>
    <div class="slider-row">
      <label>|B|</label>
      <input type="range" id="inclB" min="5" max="50" value="24">
      <span class="val" id="inclBVal">24</span>
    </div>
    <div class="slider-row">
      <label>|A∩B|</label>
      <input type="range" id="inclAB" min="0" max="30" value="10">
      <span class="val" id="inclABVal">10</span>
    </div>
    <div class="info-grid">
      <div>|A ∪ B|<br><b id="inclUnion">44</b></div>
      <div>|A \ B|<br><b id="inclAOnly">20</b></div>
      <div>|B \ A|<br><b id="inclBOnly">14</b></div>
      <div>并集占比<br><b id="inclPct">-</b></div>
    </div>`;
  const upd = () => {
    inclA = +document.getElementById('inclA').value;
    inclB = +document.getElementById('inclB').value;
    inclAB = Math.min(+document.getElementById('inclAB').value, inclA, inclB);
    document.getElementById('inclAVal').textContent = inclA;
    document.getElementById('inclBVal').textContent = inclB;
    document.getElementById('inclABVal').textContent = inclAB;
    const u = inclA + inclB - inclAB;
    document.getElementById('inclUnion').textContent = u;
    document.getElementById('inclAOnly').textContent = inclA - inclAB;
    document.getElementById('inclBOnly').textContent = inclB - inclAB;
    document.getElementById('inclPct').textContent = Math.round(100 * u / (inclA + inclB)) + '% of |A|+|B|';
  };
  document.getElementById('inclA').addEventListener('input', upd);
  document.getElementById('inclB').addEventListener('input', upd);
  document.getElementById('inclAB').addEventListener('input', upd);
  upd();
  startLoop(drawIncl);
}

function drawIncl() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 10;
  const maxV = Math.max(inclA, inclB, 30);
  const rA = 30 + 60 * Math.sqrt(inclA / maxV);
  const rB = 30 + 60 * Math.sqrt(inclB / maxV);
  // 圆心距离由交集比例决定
  const overlap = inclAB / Math.min(inclA, inclB);
  const d = (rA + rB) * (1 - 0.7 * overlap);
  const xA = cx - d / 2, xB = cx + d / 2;
  // 画 A
  ctx.beginPath();
  ctx.arc(xA, cy, rA, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(236,72,153,0.35)';
  ctx.fill();
  ctx.strokeStyle = '#ec4899';
  ctx.lineWidth = 2;
  ctx.stroke();
  // 画 B
  ctx.beginPath();
  ctx.arc(xB, cy, rB, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(6,182,212,0.35)';
  ctx.fill();
  ctx.strokeStyle = '#06b6d4';
  ctx.stroke();
  // 标签
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('A', xA - rA * 0.6, cy - rA * 0.5);
  ctx.fillText('B', xB + rB * 0.6, cy - rB * 0.5);
  // 数字
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(String(inclA - inclAB), xA - rA * 0.4, cy + 10);
  ctx.fillStyle = '#10b981';
  ctx.fillText(String(inclAB), cx, cy + 10);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(String(inclB - inclAB), xB + rB * 0.4, cy + 10);
  // 顶部公式
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`|A ∪ B| = ${inclA} + ${inclB} − ${inclAB} = ${inclA + inclB - inclAB}`, cx, 26);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText('圆面积与集合大小成比例（交集用圆心距离近似）', cx, H - 16);
}

// ═══════════════════════════════════════════════
// MODE 5: Quiz
// ═══════════════════════════════════════════════
const QUIZ = [
  { q: '从 5 个不同元素中选 2 个，顺序无关，有多少种选法？', opts: ['10', '20', '25', '5'], ans: 0, exp: 'C(5,2) = 5!/(2!3!) = 10。' },
  { q: 'A(5,2) 与 C(5,2) 的关系是？', opts: ['A = C', 'A = C × 2!', 'A = C / 2!', 'A = C + 2'], ans: 1, exp: 'A(n,k) = C(n,k) × k!，排列比组合多 k! 倍（内部排序）。' },
  { q: '杨辉三角第 n 行（从 0 开始）所有数之和等于？', opts: ['n!', '2^n', 'n^2', 'C(n, n/2)'], ans: 1, exp: '∑ C(n,k) = (1+1)^n = 2^n。' },
  { q: '把 11 只鸽子放进 3 个巢，至少有一个巢里有 ≥ ? 只鸽子。', opts: ['3', '4', '5', '11'], ans: 1, exp: '⌈11/3⌉ = 4。' },
  { q: '任意 13 个人中，至少有两人出生月份相同，依据是？', opts: ['容斥原理', '二项式定理', '鸽巢原理', '数学归纳法'], ans: 2, exp: '13 个"鸽子"放进 12 个"巢"（月份），m > n。' },
  { q: '|A|=30, |B|=24, |A∩B|=10，则 |A∪B| = ?', opts: ['54', '44', '34', '64'], ans: 1, exp: '|A∪B| = 30 + 24 − 10 = 44。' },
  { q: '(a+b)^4 展开式中 a²b² 的系数是？', opts: ['4', '6', '8', '12'], ans: 1, exp: 'C(4,2) = 6。' },
  { q: 'C(n, k) = C(n, n-k) 反映的性质是？', opts: ['递推性', '对称性', '单调性', '有界性'], ans: 1, exp: '选 k 个 = 不选 n-k 个，对称。' }
];
let quizIdx = 0, quizScore = 0, quizAnswered = false;

function initQuiz() {
  legendEl.innerHTML = '';
  quizIdx = 0; quizScore = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('完成 8 道题，检验组合数学掌握情况', canvas.width / 2, canvas.height / 2 - 20);
  ctx.fillText('答完自动出结果与解析', canvas.width / 2, canvas.height / 2 + 10);
  renderQuiz();
}

function renderQuiz() {
  if (quizIdx >= QUIZ.length) {
    const pass = quizScore >= 6;
    panel.innerHTML = `
      <h3>🎯 测验完成</h3>
      <div class="quiz-result">
        得分 <b style="color:${pass ? '#10b981' : '#ef4444'};font-size:2em;">${quizScore}</b> / ${QUIZ.length}<br>
        ${pass ? '🎉 已通过（≥6 分）' : '💪 继续加油（≥6 分通过）'}<br>
        <button class="btn primary" id="retryQuiz" style="margin-top:12px;">↻ 再测一次</button>
      </div>
      <div class="concept-card" style="margin-top:14px;">
        <div class="title">知识总结</div>
        · 排列 A(n,k) = n!/(n-k)!，组合 C(n,k) = n!/(k!(n-k)!)<br>
        · 杨辉三角：C(n,k) = C(n-1,k-1) + C(n-1,k)<br>
        · 鸽巢：m > n 时必有巢 ≥ ⌈m/n⌉<br>
        · 容斥：|A∪B| = |A| + |B| − |A∩B|
      </div>`;
    document.getElementById('retryQuiz').addEventListener('click', initQuiz);
    if (pass && typeof PageProgress !== 'undefined') {
      PageProgress.markDone('combinatorics');
    }
    return;
  }
  const q = QUIZ[quizIdx];
  quizAnswered = false;
  panel.innerHTML = `
    <h3>第 ${quizIdx + 1} / ${QUIZ.length} 题 <span style="float:right;color:#fbbf24;">得分 ${quizScore}</span></h3>
    <div class="quiz">
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o, i) => `<div class="quiz-opt" data-i="${i}">${o}</div>`).join('')}
      </div>
      <div class="quiz-feedback" id="fb"></div>
    </div>`;
  panel.querySelectorAll('.quiz-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const i = +opt.dataset.i;
      const fb = document.getElementById('fb');
      if (i === q.ans) {
        opt.classList.add('correct');
        quizScore++;
        fb.textContent = '✓ ' + q.exp;
        fb.style.color = '#10b981';
      } else {
        opt.classList.add('wrong');
        panel.querySelectorAll('.quiz-opt')[q.ans].classList.add('correct');
        fb.textContent = '✗ ' + q.exp;
        fb.style.color = '#ef4444';
      }
      setTimeout(() => { quizIdx++; renderQuiz(); }, 1800);
    });
  });
}

// Init
initMode();
</script>
