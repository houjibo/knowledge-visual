<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一元二次方程 - 初中数学九年级</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a5276 0%, #2e86c1 50%, #48c9b0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%);
            color: white;
            padding: 28px 30px;
            text-align: center;
        }

        .header h1 { font-size: 2.4em; margin-bottom: 8px; }
        .header p { font-size: 1.1em; opacity: 0.9; }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            background: transparent;
            color: #666;
        }

        .tab:hover { background: #e8e8e8; }
        .tab.active { background: white; color: #1a5276; border-bottom: 3px solid #1a5276; }

        .content { padding: 30px; min-height: 600px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== Tab 1: 配方法步骤动画 ===== */
        .equation-input-area {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .equation-input-area label {
            font-weight: 600;
            color: #333;
        }

        .coeff-input {
            width: 70px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
            transition: border-color 0.3s;
        }

        .coeff-input:focus { border-color: #2e86c1; outline: none; }

        .equation-display {
            font-size: 1.4em;
            font-weight: 600;
            color: #1a5276;
            padding: 10px 0;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary { background: #2e86c1; color: white; }
        .btn-primary:hover { background: #1a5276; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #1e8449; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }

        .steps-container {
            margin-top: 20px;
        }

        .step-card {
            background: #f8f9fa;
            border-left: 4px solid #2e86c1;
            padding: 18px 20px;
            margin-bottom: 12px;
            border-radius: 0 12px 12px 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s;
        }

        .step-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .step-card .step-num {
            display: inline-block;
            background: #2e86c1;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.85em;
            font-weight: 700;
            margin-right: 10px;
        }

        .step-card .step-title {
            font-weight: 700;
            color: #1a5276;
            display: inline;
        }

        .step-card .step-math {
            display: block;
            margin-top: 10px;
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }

        .step-card .step-desc {
            display: block;
            margin-top: 8px;
            color: #666;
            font-size: 0.92em;
        }

        .highlight { color: #e74c3c; font-weight: 700; }
        .highlight-blue { color: #2e86c1; font-weight: 700; }
        .highlight-green { color: #27ae60; font-weight: 700; }

        /* ===== Tab 2: 求根公式推导 ===== */
        .derivation-timeline {
            position: relative;
            padding-left: 40px;
        }

        .derivation-timeline::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #2e86c1, #48c9b0);
        }

        .derive-step {
            position: relative;
            margin-bottom: 25px;
            opacity: 0.3;
            transition: all 0.5s;
        }

        .derive-step.active {
            opacity: 1;
        }

        .derive-step .dot {
            position: absolute;
            left: -30px;
            top: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ddd;
            border: 3px solid white;
            transition: all 0.3s;
        }

        .derive-step.active .dot {
            background: #2e86c1;
            box-shadow: 0 0 0 4px rgba(46,134,193,0.3);
        }

        .derive-step .derive-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
        }

        .derive-step.active .derive-card {
            border-color: #2e86c1;
            box-shadow: 0 4px 15px rgba(46,134,193,0.15);
        }

        .derive-card .formula {
            font-size: 1.3em;
            font-weight: 600;
            color: #1a5276;
            text-align: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 10px 0;
        }

        .derive-card .explain {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        /* ===== Tab 3: 判别式可视化 ===== */
        .disc-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .disc-graph {
            flex: 1;
            min-width: 320px;
        }

        .disc-graph canvas {
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
        }

        .disc-controls {
            flex: 0 0 320px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .slider-group label span { color: #2e86c1; }

        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 3px;
            outline: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #2e86c1;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .disc-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .disc-value {
            font-size: 1.6em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .disc-result {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .disc-result.positive { background: #d4efdf; color: #1e8449; }
        .disc-result.zero { background: #fdebd0; color: #d68910; }
        .disc-result.negative { background: #fadbd8; color: #c0392b; }

        .roots-display {
            text-align: center;
            font-size: 1.1em;
            color: #333;
            padding: 10px;
        }

        /* ===== Tab 4: 互动练习 ===== */
        .practice-area {
            max-width: 700px;
            margin: 0 auto;
        }

        .problem-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .problem-card .problem-num {
            display: inline-block;
            background: #1a5276;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .problem-card .problem-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .answer-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .answer-inputs input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s;
        }

        .answer-inputs input:focus {
            border-color: #2e86c1;
            outline: none;
        }

        .answer-inputs input.correct {
            border-color: #27ae60;
            background: #d4efdf;
        }

        .answer-inputs input.wrong {
            border-color: #e74c3c;
            background: #fadbd8;
        }

        .feedback {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .feedback.show { display: block; }
        .feedback.correct { background: #d4efdf; color: #1e8449; }
        .feedback.wrong { background: #fadbd8; color: #c0392b; }

        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(135deg, #1a5276, #2e86c1);
            border-radius: 12px;
            color: white;
            margin-bottom: 20px;
        }

        .score-bar .score { font-size: 1.4em; font-weight: 700; }

        .method-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 8px;
        }

        .method-tag.formula { background: #d5f5e3; color: #1e8449; }
        .method-tag.factor { background: #d6eaf8; color: #1a5276; }
        .method-tag.complete { background: #fdebd0; color: #d68910; }

        .frac { display: inline-block; text-align: center; vertical-align: middle; }
        .frac .num { display: block; border-bottom: 2px solid currentColor; padding: 0 4px 2px; }
        .frac .den { display: block; padding: 2px 4px 0; }
        .sqrt-sym::before { content: '√'; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #48c9b0);
            transition: width 0.5s;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6em; }
            .tab { font-size: 0.8em; padding: 12px 6px; }
            .disc-controls { flex: 1 1 100%; }
            .content { padding: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📐 一元二次方程</h1>
        <p>九年级 · 配方法 / 公式法 / 因式分解法 / 判别式</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab(0)">🔧 配方法动画</button>
        <button class="tab" onclick="switchTab(1)">📜 公式推导</button>
        <button class="tab" onclick="switchTab(2)">📊 判别式可视化</button>
        <button class="tab" onclick="switchTab(3)">✏️ 互动练习</button>
    </div>

    <div class="content">
        <!-- Tab 1: 配方法步骤动画 -->
        <div class="tab-content active" id="tab0">
            <div class="equation-input-area">
                <label>输入方程：</label>
                <input type="number" class="coeff-input" id="coeffA" value="1" min="1" max="20">
                <span>x² +</span>
                <input type="number" class="coeff-input" id="coeffB" value="6">
                <span>x +</span>
                <input type="number" class="coeff-input" id="coeffC" value="5">
                <span>= 0</span>
                <button class="btn btn-primary" onclick="startCompletingSquare()">🚀 开始配方</button>
                <button class="btn btn-secondary" onclick="resetSteps()">重置</button>
            </div>
            <div class="equation-display" id="equationDisplay">
                当前方程：x² + 6x + 5 = 0
            </div>
            <div class="steps-container" id="stepsContainer"></div>
        </div>

        <!-- Tab 2: 求根公式推导 -->
        <div class="tab-content" id="tab1">
            <p style="text-align:center; color:#666; margin-bottom:20px;">
                从一般形式出发，通过配方法推导出求根公式 —— 点击"下一步"逐步探索
            </p>
            <div class="derivation-timeline" id="deriveTimeline"></div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="derivePrev()">← 上一步</button>
                <button class="btn btn-primary" onclick="deriveNext()">下一步 →</button>
                <button class="btn btn-warning" onclick="deriveReset()">重置</button>
            </div>
        </div>

        <!-- Tab 3: 判别式可视化 -->
        <div class="tab-content" id="tab2">
            <div class="disc-layout">
                <div class="disc-graph">
                    <canvas id="discCanvas" width="500" height="400"></canvas>
                </div>
                <div class="disc-controls">
                    <div class="slider-group">
                        <label>a = <span id="discAVal">1</span></label>
                        <input type="range" id="discA" min="-3" max="3" step="0.5" value="1" oninput="updateDisc()">
                    </div>
                    <div class="slider-group">
                        <label>b = <span id="discBVal">-2</span></label>
                        <input type="range" id="discB" min="-6" max="6" step="0.5" value="-2" oninput="updateDisc()">
                    </div>
                    <div class="slider-group">
                        <label>c = <span id="discCVal">-3</span></label>
                        <input type="range" id="discC" min="-6" max="6" step="0.5" value="-3" oninput="updateDisc()">
                    </div>
                    <div class="disc-info">
                        <div class="disc-value" id="discValueDisplay">Δ = b² - 4ac = 16</div>
                        <div class="disc-result positive" id="discResult">Δ > 0 → 两个不相等的实数根</div>
                        <div class="roots-display" id="rootsDisplay">x₁ = 3, x₂ = -1</div>
                    </div>
                    <div style="margin-top:15px;">
                        <button class="btn btn-success" onclick="presetDisc(1,-2,-3)">示例1: Δ>0</button>
                        <button class="btn btn-warning" onclick="presetDisc(1,-2,1)">示例2: Δ=0</button>
                        <button class="btn btn-primary" onclick="presetDisc(1,2,3)">示例3: Δ<0</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 4: 互动练习 -->
        <div class="tab-content" id="tab3">
            <div class="practice-area">
                <div class="score-bar">
                    <div>得分：<span class="score" id="practiceScore">0</span> / <span id="practiceTotal">0</span></div>
                    <div>
                        <button class="btn btn-warning" onclick="generateProblems()" style="padding:6px 16px; font-size:0.9em;">🔄 换题</button>
                    </div>
                </div>
                <div class="progress-bar"><div class="fill" id="practiceProgress" style="width:0%"></div></div>
                <div id="practiceContainer" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
// ===== 进度追踪 =====
const PAGE_SLUG = 'quadratic-equation';
const _progressDone = new Set();
function _trackStep(step) {
  _progressDone.add(step);
  if (_progressDone.size >= 3 && typeof PageProgress !== 'undefined' && !PageProgress.isDone(PAGE_SLUG)) {
    PageProgress.markDone(PAGE_SLUG);
  }
}

// ===== Tab Switching =====
function switchTab(idx) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
    document.querySelectorAll('.tab-content').forEach((c,i) => c.classList.toggle('active', i===idx));
    if (idx === 2) setTimeout(updateDisc, 100);
}

// ===== Tab 1: 配方法步骤动画 =====
function gcd(a, b) { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }

function fracStr(num, den) {
    if (den < 0) { num = -num; den = -den; }
    const g = gcd(num, den);
    num /= g; den /= g;
    if (den === 1) return `${num}`;
    return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}

function signStr(val, showPlus) {
    if (val >= 0) return showPlus ? ` + ${val}` : `${val}`;
    return ` - ${Math.abs(val)}`;
}

function startCompletingSquare() {
    const a = parseInt(document.getElementById('coeffA').value) || 1;
    const b = parseInt(document.getElementById('coeffB').value) || 0;
    const c = parseInt(document.getElementById('coeffC').value) || 0;

    document.getElementById('equationDisplay').innerHTML =
        `当前方程：<span class="highlight-blue">${a===1?'':a}x² ${signStr(b,true)}x ${signStr(c,true)} = 0</span>`;

    const steps = [];

    // Step 1: Write original equation
    steps.push({
        title: '写出原方程',
        math: `${a===1?'':a}x² ${signStr(b,true)}x ${signStr(c,true)} = 0`,
        desc: '这是标准形式 ax² + bx + c = 0'
    });

    // Step 2: If a≠1, divide by a
    let bCur = b, aCur = a, cCur = c;
    if (a !== 1) {
        steps.push({
            title: `两边同除以 ${a}`,
            math: `x² ${signStr(b,true)}x ${signStr(c,true)} = 0  →  x² + ${fracStr(b,a)}x + ${fracStr(c,a)} = 0`,
            desc: '配方法要求 x² 的系数为 1'
        });
        bCur = b; aCur = a; cCur = c; // keep as fractions conceptually
    }

    // Step 3: Move constant to right
    steps.push({
        title: '移项：常数项移到右边',
        math: `x² ${signStr(bCur/aCur,true)}x = ${fracStr(-cCur, aCur)}`,
        desc: '把常数项移到等号右边'
    });

    // Step 4: Find (b/2a)²
    const halfB_num = bCur;
    const halfB_den = 2 * aCur;
    const halfBSq_num = halfB_num * halfB_num;
    const halfBSq_den = halfB_den * halfB_den;
    steps.push({
        title: '计算配方项',
        math: `(${fracStr(bCur, 2*aCur)})² = ${fracStr(halfBSq_num, halfBSq_den)}`,
        desc: `取一次项系数 ${fracStr(bCur, aCur)} 的一半再平方`
    });

    // Step 5: Add to both sides
    steps.push({
        title: '两边同加配方项',
        math: `x² ${signStr(bCur/aCur,true)}x + <span class="highlight">${fracStr(halfBSq_num, halfBSq_den)}</span> = ${fracStr(-cCur, aCur)} + <span class="highlight">${fracStr(halfBSq_num, halfBSq_den)}</span>`,
        desc: '左边凑成完全平方式'
    });

    // Step 6: Write as perfect square
    const rhs_num = -cCur * halfBSq_den + halfBSq_num * aCur;
    const rhs_den = aCur * halfBSq_den;
    steps.push({
        title: '左边写成完全平方',
        math: `<span class="highlight-green">(x ${signStr(halfB_num/halfB_den,true)})²</span> = ${fracStr(rhs_num, rhs_den)}`,
        desc: '左边 = (x + b/2a)² 的形式'
    });

    // Step 7: Take square root
    const discriminant = b*b - 4*a*c;
    if (discriminant < 0) {
        steps.push({
            title: '开方求解',
            math: `Δ = b²-4ac = ${discriminant} < 0 → <span class="highlight">无实数根</span>`,
            desc: '右边为负数，无法开平方，方程无实数解'
        });
    } else if (discriminant === 0) {
        const x_val = fracStr(-b, 2*a);
        steps.push({
            title: '开方求解',
            math: `x ${signStr(halfB_num/halfB_den,true)} = 0 → <span class="highlight-green">x = ${x_val}</span>`,
            desc: 'Δ = 0，方程有两个相等的实数根（重根）'
        });
    } else {
        const sqrtD = Math.sqrt(discriminant);
        const isInteger = Number.isInteger(sqrtD);
        const x1 = (-b + sqrtD) / (2*a);
        const x2 = (-b - sqrtD) / (2*a);
        steps.push({
            title: '两边开平方',
            math: `x ${signStr(halfB_num/halfB_den,true)} = ±${isInteger ? sqrtD : '√'+discriminant} / ${2*a}`,
            desc: '别忘了取 ± 两个值！'
        });
        steps.push({
            title: '求出两个根',
            math: `<span class="highlight-green">x₁ = ${Number.isInteger(x1)?x1:x1.toFixed(4)}</span>，<span class="highlight-green">x₂ = ${Number.isInteger(x2)?x2:x2.toFixed(4)}</span>`,
            desc: `验证：x₁ + x₂ = ${fracStr(-b,a)}，x₁ · x₂ = ${fracStr(c,a)} ✓`
        });
    }

    renderSteps(steps);
    _trackStep('square');
}

function renderSteps(steps) {
    const container = document.getElementById('stepsContainer');
    container.innerHTML = '';
    steps.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'step-card';
        div.innerHTML = `
            <span class="step-num">${i+1}</span>
            <span class="step-title">${s.title}</span>
            <span class="step-math">${s.math}</span>
            <span class="step-desc">${s.desc}</span>
        `;
        container.appendChild(div);
        setTimeout(() => div.classList.add('visible'), 150 * (i+1));
    });
}

function resetSteps() {
    document.getElementById('stepsContainer').innerHTML = '';
    document.getElementById('equationDisplay').innerHTML = '输入系数后点击"开始配方"';
}

// ===== Tab 2: 求根公式推导 =====
const deriveSteps = [
    {
        title: '一般形式',
        formula: 'ax² + bx + c = 0  (a ≠ 0)',
        explain: '这是一元二次方程的一般形式。我们的目标：用 a、b、c 表示 x。'
    },
    {
        title: '两边除以 a',
        formula: 'x² + (b/a)x + c/a = 0',
        explain: '因为 a ≠ 0，可以两边同除以 a，使 x² 系数变为 1。'
    },
    {
        title: '移项',
        formula: 'x² + (b/a)x = -c/a',
        explain: '把常数项 c/a 移到右边，为配方做准备。'
    },
    {
        title: '配方：加上 (b/2a)²',
        formula: 'x² + (b/a)x + (b/2a)² = -c/a + (b/2a)²',
        explain: '两边同加 (b/2a)² = b²/4a²，使左边成为完全平方式。这是配方法的核心步骤！'
    },
    {
        title: '左边化为完全平方',
        formula: '(x + b/2a)² = (b² - 4ac) / 4a²',
        explain: '左边 = (x + b/2a)²，右边通分化简为 (b² - 4ac)/4a²。'
    },
    {
        title: '两边开方',
        formula: 'x + b/2a = ± √(b² - 4ac) / 2a',
        explain: '当 b² - 4ac ≥ 0 时，两边开平方。注意右边要取 ±。'
    },
    {
        title: '🎯 求根公式',
        formula: 'x = (-b ± √(b² - 4ac)) / 2a',
        explain: '移项得到著名的求根公式！其中 Δ = b² - 4ac 称为判别式，决定根的个数和类型。'
    }
];

let deriveIdx = 0;

function renderDerivation() {
    const timeline = document.getElementById('deriveTimeline');
    timeline.innerHTML = '';
    deriveSteps.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'derive-step' + (i <= deriveIdx ? ' active' : '');
        div.innerHTML = `
            <div class="dot"></div>
            <div class="derive-card">
                <strong>${s.title}</strong>
                <div class="formula">${s.formula}</div>
                <div class="explain">${s.explain}</div>
            </div>
        `;
        timeline.appendChild(div);
    });
}

function deriveNext() {
    if (deriveIdx < deriveSteps.length - 1) {
        deriveIdx++;
        renderDerivation();
        if (deriveIdx === deriveSteps.length - 1) _trackStep('derive');
    }
}

function derivePrev() {
    if (deriveIdx > 0) { deriveIdx--; renderDerivation(); }
}

function deriveReset() {
    deriveIdx = 0;
    renderDerivation();
}

// ===== Tab 3: 判别式可视化 =====
function updateDisc() {
    const a = parseFloat(document.getElementById('discA').value);
    const b = parseFloat(document.getElementById('discB').value);
    const c = parseFloat(document.getElementById('discC').value);

    document.getElementById('discAVal').textContent = a;
    document.getElementById('discBVal').textContent = b;
    document.getElementById('discCVal').textContent = c;

    if (a === 0) {
        document.getElementById('discValueDisplay').textContent = 'a = 0 时不是二次方程';
        document.getElementById('discResult').className = 'disc-result zero';
        document.getElementById('discResult').textContent = 'a = 0 → 退化为一次方程';
        document.getElementById('rootsDisplay').textContent = b !== 0 ? `x = ${(-c/b).toFixed(2)}` : '无解';
        drawDiscGraph(a, b, c, []);
        return;
    }

    const disc = b*b - 4*a*c;
    document.getElementById('discValueDisplay').innerHTML =
        `Δ = b² - 4ac = ${b}² - 4×${a}×${c} = <span class="highlight">${disc.toFixed(1)}</span>`;

    const roots = [];
    if (disc > 0) {
        const x1 = (-b + Math.sqrt(disc)) / (2*a);
        const x2 = (-b - Math.sqrt(disc)) / (2*a);
        roots.push(x1, x2);
        document.getElementById('discResult').className = 'disc-result positive';
        document.getElementById('discResult').textContent = 'Δ > 0 → 两个不相等的实数根';
        document.getElementById('rootsDisplay').textContent = `x₁ = ${x1.toFixed(3)}, x₂ = ${x2.toFixed(3)}`;
    } else if (disc === 0) {
        const x0 = -b / (2*a);
        roots.push(x0);
        document.getElementById('discResult').className = 'disc-result zero';
        document.getElementById('discResult').textContent = 'Δ = 0 → 两个相等的实数根（重根）';
        document.getElementById('rootsDisplay').textContent = `x₁ = x₂ = ${x0.toFixed(3)}`;
    } else {
        document.getElementById('discResult').className = 'disc-result negative';
        document.getElementById('discResult').textContent = 'Δ < 0 → 无实数根（两个共轭复数根）';
        document.getElementById('rootsDisplay').textContent = '抛物线不与 x 轴相交';
    }

    drawDiscGraph(a, b, c, roots);
}

function drawDiscGraph(a, b, c, roots) {
    const canvas = document.getElementById('discCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Determine view range
    const vx = a !== 0 ? -b / (2*a) : 0;
    const vy = a !== 0 ? (4*a*c - b*b) / (4*a) : 0;
    const rangeX = 8;
    const cx = vx, cy = vy;

    function toScreen(x, y) {
        return [W/2 + (x - cx) * (W / (2*rangeX)), H/2 - (y - cy) * (H / (2*rangeX))];
    }

    // Grid
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let i = -10; i <= 10; i++) {
        const [sx] = toScreen(i, 0);
        const [, sy] = toScreen(0, i);
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }

    // Axes
    const [ox, oy] = toScreen(0, 0);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();

    // Axis labels
    ctx.fillStyle = '#999';
    ctx.font = '12px sans-serif';
    for (let i = -8; i <= 8; i++) {
        if (i === 0) continue;
        const [sx] = toScreen(i, 0);
        ctx.fillText(i, sx - 4, oy + 16);
    }

    // Parabola
    if (a !== 0) {
        ctx.beginPath();
        ctx.strokeStyle = '#2e86c1';
        ctx.lineWidth = 3;
        let first = true;
        for (let px = 0; px < W; px++) {
            const x = cx + (px - W/2) * (2*rangeX) / W;
            const y = a*x*x + b*x + c;
            const sy = H/2 - (y - cy) * (H / (2*rangeX));
            if (sy < -100 || sy > H + 100) { first = true; continue; }
            if (first) { ctx.moveTo(px, sy); first = false; }
            else ctx.lineTo(px, sy);
        }
        ctx.stroke();

        // Vertex
        const [vsx, vsy] = toScreen(vx, vy);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(vsx, vsy, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e74c3c';
        ctx.font = '13px sans-serif';
        ctx.fillText(`顶点(${vx.toFixed(1)}, ${vy.toFixed(1)})`, vsx + 8, vsy - 8);
    }

    // Roots
    roots.forEach(r => {
        const [rx, ry] = toScreen(r, 0);
        ctx.fillStyle = '#27ae60';
        ctx.beginPath(); ctx.arc(rx, ry, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1e8449';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`x=${r.toFixed(2)}`, rx + 10, ry - 8);
    });

    // Equation label
    ctx.fillStyle = '#1a5276';
    ctx.font = 'bold 15px sans-serif';
    const eqText = a === 0 ? `${b}x + ${c} = 0` : `${a}x² ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c} = 0`;
    ctx.fillText(`y = ${eqText}`, 15, 25);
}

function presetDisc(a, b, c) {
    document.getElementById('discA').value = a;
    document.getElementById('discB').value = b;
    document.getElementById('discC').value = c;
    updateDisc();
}

// ===== Tab 4: 互动练习 =====
let practiceProblems = [];
let practiceAnswered = 0;
let practiceCorrect = 0;

function generateProblems() {
    practiceProblems = [];
    practiceAnswered = 0;
    practiceCorrect = 0;
    document.getElementById('practiceScore').textContent = '0';
    document.getElementById('practiceTotal').textContent = '0';
    document.getElementById('practiceProgress').style.width = '0%';

    const types = ['formula', 'factor', 'complete', 'discriminant'];
    const problems = [];

    // Problem type 1: Use formula to solve
    problems.push({
        type: 'formula',
        method: '公式法',
        text: '用公式法解方程：x² - 5x + 6 = 0',
        answers: [2, 3],
        answerLabels: ['x₁ =', 'x₂ ='],
        hint: 'x = (-b ± √(b²-4ac)) / 2a'
    });

    // Problem type 2: Factor
    problems.push({
        type: 'factor',
        method: '因式分解法',
        text: '因式分解解方程：x² - 3x = 0',
        answers: [0, 3],
        answerLabels: ['x₁ =', 'x₂ ='],
        hint: '提取公因式 x'
    });

    // Problem type 3: Complete the square
    problems.push({
        type: 'complete',
        method: '配方法',
        text: '用配方法解方程：x² + 4x - 5 = 0',
        answers: [1, -5],
        answerLabels: ['x₁ =', 'x₂ ='],
        hint: '(x+2)² = 9'
    });

    // Problem type 4: Discriminant
    problems.push({
        type: 'discriminant',
        method: '判别式',
        text: '方程 2x² + 3x + 1 = 0 的判别式 Δ = b² - 4ac = ？',
        answers: [1],
        answerLabels: ['Δ ='],
        hint: 'a=2, b=3, c=1'
    });

    // Problem type 5
    problems.push({
        type: 'formula',
        method: '公式法',
        text: '解方程：x² + 2x - 8 = 0',
        answers: [2, -4],
        answerLabels: ['x₁ =', 'x₂ ='],
        hint: 'x = (-2 ± √36) / 2'
    });

    // Problem type 6
    problems.push({
        type: 'factor',
        method: '因式分解法',
        text: '解方程：x² - 9 = 0',
        answers: [3, -3],
        answerLabels: ['x₁ =', 'x₂ ='],
        hint: '平方差公式'
    });

    practiceProblems = problems.sort(() => Math.random() - 0.5);
    renderProblems();
}

function renderProblems() {
    const container = document.getElementById('practiceContainer');
    container.innerHTML = '';

    practiceProblems.forEach((p, idx) => {
        const methodClass = p.type === 'formula' ? 'formula' : (p.type === 'factor' ? 'factor' : 'complete');
        const div = document.createElement('div');
        div.className = 'problem-card';
        div.id = `problem-${idx}`;

        let inputsHtml = '';
        p.answers.forEach((_, ai) => {
            inputsHtml += `
                <label>${p.answerLabels[ai]}</label>
                <input type="number" id="ans-${idx}-${ai}" step="any"
                       onkeydown="if(event.key==='Enter') checkAnswer(${idx})">
            `;
        });

        div.innerHTML = `
            <span class="problem-num">${p.method}</span>
            <span class="method-tag ${methodClass}">${p.method}</span>
            <div class="problem-text">${p.text}</div>
            <div class="answer-inputs">${inputsHtml}
                <button class="btn btn-success" onclick="checkAnswer(${idx})" style="padding:8px 18px;">检查</button>
            </div>
            <div class="feedback" id="feedback-${idx}"></div>
        `;
        container.appendChild(div);
    });

    document.getElementById('practiceTotal').textContent = practiceProblems.length;
}

function checkAnswer(idx) {
    const p = practiceProblems[idx];
    const inputs = p.answers.map((_, ai) => {
        const el = document.getElementById(`ans-${idx}-${ai}`);
        return parseFloat(el.value);
    });

    const fb = document.getElementById(`feedback-${idx}`);
    const sortedUser = [...inputs].sort((a,b) => a-b);
    const sortedAns = [...p.answers].sort((a,b) => a-b);

    const correct = sortedUser.every((v, i) => Math.abs(v - sortedAns[i]) < 0.01);

    // Mark inputs
    inputs.forEach((_, ai) => {
        const el = document.getElementById(`ans-${idx}-${ai}`);
        el.classList.remove('correct', 'wrong');
        el.classList.add(correct ? 'correct' : 'wrong');
    });

    fb.className = `feedback show ${correct ? 'correct' : 'wrong'}`;
    if (correct) {
        fb.textContent = '✅ 正确！';
        if (!p._answered) { practiceCorrect++; }
        _trackStep('practice');
    } else {
        fb.textContent = `❌ 正确答案是：${p.answers.join(' 和 ')}`;
    }

    if (!p._answered) {
        p._answered = true;
        practiceAnswered++;
    }

    document.getElementById('practiceScore').textContent = practiceCorrect;
    document.getElementById('practiceTotal').textContent = practiceProblems.length;
    document.getElementById('practiceProgress').style.width =
        `${(practiceAnswered / practiceProblems.length * 100).toFixed(0)}%`;
}

// ===== Init =====
renderDerivation();
updateDisc();
generateProblems();
</script>
