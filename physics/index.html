<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理 - Knowledge Visual</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #F0F4FF; min-height: 100vh; }
    .page-container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .breadcrumb { display: flex; align-items: center; gap: 4px; padding: 10px 16px;
      background: white; border-radius: 12px; margin-bottom: 16px; font-size: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .breadcrumb-item { padding: 6px 12px; border-radius: 10px; text-decoration: none;
      color: #1E88E5; font-weight: 600; }
    .breadcrumb-sep { color: #AEAEB2; font-size: 12px; }
    .breadcrumb-current { padding: 6px 12px; color: #6E6E73; font-weight: 600; }
    .hero { text-align: center; padding: 40px 20px 32px;
      background: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
      border-radius: 24px; margin-bottom: 24px; color: white; }
    .hero h1 { font-size: 32px; margin-bottom: 8px; }
    .hero p { font-size: 16px; opacity: 0.9; }
    .subject-grid { display: grid; gap: 24px; padding: 8px 0;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .subject-card { background: white; border-radius: 20px; padding: 32px 24px;
      text-decoration: none; color: #1D1D1F; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex; flex-direction: column; align-items: center; }
    .subject-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
    .subject-icon { font-size: 56px; margin-bottom: 14px; }
    .subject-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subject-desc { font-size: 14px; color: #6E6E73; text-align: center; }
    .subject-badge { margin-top: 14px; padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.05); color: #1E88E5; }
    .total-badge { display: inline-block; margin-top: 12px; padding: 4px 14px;
      border-radius: 14px; background: rgba(255,255,255,0.25); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <div class="page-container">
    <nav class="breadcrumb"><a href="../index.html" class="breadcrumb-item">🏠 首页</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">🔭 物理</span></nav>
    <div class="hero">
      <h1>🔭 物理</h1>
      <p>选择学习阶段</p>
      <span class="total-badge">55 个知识点</span>
    </div>
    <div class="subject-grid">
    <a href="middle/index.html" class="subject-card">
      <div class="subject-icon">🔭</div>
      <div class="subject-name">初中物理</div>
      <div class="subject-desc">七八九年级 · 核心概念互动演示</div>
      <span class="subject-badge">20 个知识点</span>
    </a>
    <a href="high/index.html" class="subject-card">
      <div class="subject-icon">🔭</div>
      <div class="subject-name">高中物理</div>
      <div class="subject-desc">高考核心知识 · 深入探究</div>
      <span class="subject-badge">16 个知识点</span>
    </a>
    <a href="uni/index.html" class="subject-card">
      <div class="subject-icon">🔭</div>
      <div class="subject-name">大学物理</div>
      <div class="subject-desc">大学课程 · 专业进阶</div>
      <span class="subject-badge">19 个知识点</span>
    </a>
    </div>
  </div>
<script>
// 学段完成度统计：从 localStorage 读取三个学段进度，给卡片加完成度徽章
(function () {
  const STAGES = [
    { key: 'kv-physics-middle-progress', total: 13 },
    { key: 'kv-physics-high-progress',   total: 13 },
    { key: 'kv-physics-uni-progress',    total: 15 }
  ];
  const cards = document.querySelectorAll('.subject-card');
  STAGES.forEach((stage, i) => {
    let done = 0;
    try { done = Object.keys(JSON.parse(localStorage.getItem(stage.key) || '{}')).length; } catch (e) {}
    const card = cards[i];
    if (!card) return;
    const chip = document.createElement('span');
    const pct = Math.round(done / stage.total * 100);
    chip.textContent = done === 0 ? '尚未开始' : `✓ ${done}/${stage.total} 已完成 · ${pct}%`;
    chip.style.cssText = [
      'margin-top:10px', 'padding:4px 12px', 'border-radius:14px',
      'font-size:12px', 'font-weight:600',
      done === 0 ? 'background:rgba(0,0,0,0.04);color:#AEAEB2'
                 : 'background:rgba(52,199,89,0.12);color:#34C759'
    ].join(';');
    chip.setAttribute('aria-label', '学习进度');
    card.appendChild(chip);
  });
})();
</script>
</body>
</html>
