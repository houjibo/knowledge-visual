<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简单机械 · 初中物理互动可视化</title>
<style>
  :root {
    --primary: #0891b2;
    --lever: #f59e0b;
    --pulley: #8b5cf6;
    --efficiency: #10b981;
    --force: #ef4444;
    --distance: #3b82f6;
    --dark: #0f172a;
    --light: #f1f5f9;
  }
  body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--light); font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 2rem; background: linear-gradient(90deg, var(--lever), var(--pulley), var(--efficiency)); -webkit-background-clip: text; color: transparent; margin: 0; }
  header p { color: #94a3b8; margin: 6px 0 0; font-size: 14px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); cursor: pointer; transition: all .25s; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; color: #cbd5e1; }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 20px rgba(8,145,178,.4); }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .canvas-wrap { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; backdrop-filter: blur(10px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
  .panel { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; backdrop-filter: blur(10px); overflow-y: auto; max-height: 640px; }
  .panel h3 { margin: 0 0 10px; font-size: 1.05rem; color: #e2e8f0; }
  .eq { font-family: "Times New Roman", serif; font-size: 1.15rem; text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 8px 0; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .slider-row label { flex: 0 0 110px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .slider-row .val { flex: 0 0 70px; text-align: right; font-family: monospace; color: var(--primary); font-weight: 600; }
  .card { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 13px; line-height: 1.7; border-left: 3px solid var(--primary); }
  .card .ct { font-weight: 600; color: #67e8f9; margin-bottom: 4px; }
  .mode-switch { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .mode-btn { padding: 5px 12px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 12px; color: #e2e8f0; transition: all .2s; }
  .mode-btn.active { background: var(--primary); border-color: var(--primary); }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; font-size: 12px; }
  .info-grid div { background: rgba(255,255,255,0.04); padding: 6px 8px; border-radius: 8px; }
  .info-grid b { color: #fbbf24; }
  .quiz { margin-top: 10px; padding: 12px; background: rgba(8,145,178,0.08); border-radius: 12px; border: 1px solid rgba(8,145,178,0.3); }
  .quiz-q { font-size: 13px; margin-bottom: 8px; }
  .quiz-opts { display: grid; gap: 5px; }
  .quiz-opt { padding: 7px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-size: 12px; transition: all .2s; border: 1px solid transparent; }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt.correct { background: rgba(16,185,129,0.25); border-color: #10b981; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .quiz-fb { margin-top: 6px; font-size: 12px; min-height: 16px; }
  .legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: #cbd5e1; margin-top: 6px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  .legend .l-f1::before { background: var(--force); }
  .legend .l-f2::before { background: var(--distance); }
  .legend .l-eff::before { background: var(--efficiency); }
  .legend .l-pulley::before { background: var(--pulley); }
  footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 16px; }
  .highlight { color: #fbbf24; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚙️ 简单机械 Interactive</h1>
    <p>杠杆原理 · 滑轮组 · 机械效率</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="lever">⚖️ 杠杆原理</div>
    <div class="tab" data-mode="pulley">🔄 定滑轮与动滑轮</div>
    <div class="tab" data-mode="pulley-group">🔗 滑轮组</div>
    <div class="tab" data-mode="efficiency">📊 机械效率</div>
    <div class="tab" data-mode="quiz">🎯 互动练习</div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas" width="700" height="500"></canvas>
      <div class="legend">
        <span class="l-f1">动力/阻力</span>
        <span class="l-f2">力臂</span>
        <span class="l-eff">机械效率</span>
        <span class="l-pulley">滑轮</span>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');

let mode = 'lever';
let animFrame = null;

// 状态
const state = {
  lever: {
    pivotX: 0.5,  // 支点位置 (0-1)
    f1: 50,       // 动力
    f2: 100,      // 阻力
    l1: 2,        // 动力臂
    l2: 1,        // 阻力臂
    angle: 0,     // 杠杆角度
    balanced: true
  },
  pulley: {
    type: 'fixed', // fixed | movable
    weight: 100,
    force: 100,
    lift: 0
  },
  pulleyGroup: {
    n: 3,         // 绳子段数
    weight: 300,
    force: 100,
    height: 0,
    efficiency: 0.8
  },
  efficiency: {
    usefulWork: 0,
    totalWork: 0,
    extraWork: 0,
    weight: 100,
    height: 2,
    force: 50,
    distance: 4
  }
};

// 绘制函数
function drawLever() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.lever;
  const cx = 350, cy = 280;
  const len = 400;
  
  // 计算支点位置
  const pivotX = cx - len/2 + len * s.pivotX;
  const pivotY = cy;
  
  // 杠杆两端坐标
  const leftX = cx - len/2;
  const rightX = cx + len/2;
  const leftY = cy + (pivotX - leftX) * Math.sin(s.angle);
  const rightY = cy - (rightX - pivotX) * Math.sin(s.angle);
  
  // 绘制支点三角形
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(pivotX - 20, pivotY + 40);
  ctx.lineTo(pivotX + 20, pivotY + 40);
  ctx.closePath();
  ctx.fillStyle = '#64748b';
  ctx.fill();
  
  // 绘制杠杆
  ctx.beginPath();
  ctx.moveTo(leftX, leftY);
  ctx.lineTo(rightX, rightY);
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();
  
  // 绘制力臂标注
  const l1Start = pivotX;
  const l1End = leftX;
  const l2End = rightX;
  
  // 动力臂
  ctx.beginPath();
  ctx.moveTo(l1Start, pivotY - 30);
  ctx.lineTo(l1End, pivotY - 30);
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#3b82f6';
  ctx.font = '14px sans-serif';
  ctx.fillText(`L₁ = ${s.l1.toFixed(1)}m`, (l1Start + l1End)/2 - 30, pivotY - 40);
  
  // 阻力臂
  ctx.beginPath();
  ctx.moveTo(l1Start, pivotY - 30);
  ctx.lineTo(l2End, pivotY - 30);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#10b981';
  ctx.fillText(`L₂ = ${s.l2.toFixed(1)}m`, (l1Start + l2End)/2 - 30, pivotY - 40);
  
  // 绘制动力 F1
  const f1Height = 60 + s.f1;
  ctx.beginPath();
  ctx.moveTo(leftX, leftY);
  ctx.lineTo(leftX, leftY - f1Height);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 箭头
  ctx.beginPath();
  ctx.moveTo(leftX, leftY - f1Height);
  ctx.lineTo(leftX - 8, leftY - f1Height + 15);
  ctx.lineTo(leftX + 8, leftY - f1Height + 15);
  ctx.closePath();
  ctx.fillStyle = '#ef4444';
  ctx.fill();
  ctx.fillText(`F₁ = ${s.f1}N`, leftX - 40, leftY - f1Height - 10);
  
  // 绘制阻力 F2
  const f2Height = 60 + s.f2;
  ctx.beginPath();
  ctx.moveTo(rightX, rightY);
  ctx.lineTo(rightX, rightY - f2Height);
  ctx.strokeStyle = '#8b5cf6';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 箭头
  ctx.beginPath();
  ctx.moveTo(rightX, rightY - f2Height);
  ctx.lineTo(rightX - 8, rightY - f2Height + 15);
  ctx.lineTo(rightX + 8, rightY - f2Height + 15);
  ctx.closePath();
  ctx.fillStyle = '#8b5cf6';
  ctx.fill();
  ctx.fillText(`F₂ = ${s.f2}N`, rightX - 10, rightY - f2Height - 10);
  
  // 绘制重物
  ctx.beginPath();
  ctx.arc(rightX, rightY + 30, 25, 0, Math.PI * 2);
  ctx.fillStyle = '#475569';
  ctx.fill();
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${s.f2}N`, rightX, rightY + 35);
  ctx.textAlign = 'left';
  
  // 平衡状态指示
  const torque1 = s.f1 * s.l1;
  const torque2 = s.f2 * s.l2;
  const status = Math.abs(torque1 - torque2) < 1 ? '✓ 平衡' : (torque1 > torque2 ? '↶ 逆时针转动' : '↷ 顺时针转动');
  const statusColor = Math.abs(torque1 - torque2) < 1 ? '#10b981' : '#f59e0b';
  
  ctx.fillStyle = statusColor;
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(status, 350, 450);
  ctx.textAlign = 'left';
}

function drawPulley() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.pulley;
  const isFixed = s.type === 'fixed';
  
  // 顶部支架
  ctx.fillStyle = '#475569';
  ctx.fillRect(250, 50, 200, 15);
  
  if (isFixed) {
    // 定滑轮
    const cx = 350, cy = 100, r = 35;
    
    // 滑轮
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 轴心
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    
    // 绳子
    const liftOffset = s.lift * 2;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy);
    ctx.lineTo(cx - r, cy + 150 - liftOffset);
    ctx.moveTo(cx + r, cy);
    ctx.lineTo(cx + r, cy + 150 + liftOffset);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 拉力 F
    ctx.beginPath();
    ctx.moveTo(cx + r, cy + 150 + liftOffset);
    ctx.lineTo(cx + r, cy + 150 + liftOffset + 60);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r, cy + 150 + liftOffset + 60);
    ctx.lineTo(cx + r - 8, cy + 150 + liftOffset + 45);
    ctx.lineTo(cx + r + 8, cy + 150 + liftOffset + 45);
    ctx.closePath();
    ctx.fillStyle = '#ef4444';
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.font = '14px sans-serif';
    ctx.fillText(`F = ${s.force}N`, cx + r + 15, cy + 150 + liftOffset + 50);
    
    // 重物
    const weightY = cy + 150 - liftOffset;
    ctx.beginPath();
    ctx.rect(cx - r - 25, weightY, 50, 50);
    ctx.fillStyle = '#475569';
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`G=${s.weight}N`, cx - r, weightY + 30);
    ctx.textAlign = 'left';
    
    // 说明
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.fillText('定滑轮：不省力，改变力的方向', 200, 450);
    ctx.fillText('F = G （忽略摩擦）', 200, 470);
    
  } else {
    // 动滑轮
    const cx = 350, r = 35;
    const liftOffset = s.lift * 2;
    const cy = 200 - liftOffset;
    
    // 绳子固定端
    ctx.beginPath();
    ctx.moveTo(250, 80);
    ctx.lineTo(250, cy);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 滑轮
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 轴心
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    
    // 绳子
    ctx.beginPath();
    ctx.moveTo(250, cy);
    ctx.arc(cx, cy, r, Math.PI, 0, false);
    ctx.lineTo(450, 80);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 拉力 F
    ctx.beginPath();
    ctx.moveTo(450, 80);
    ctx.lineTo(450, 140);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(450, 140);
    ctx.lineTo(450 - 8, 125);
    ctx.lineTo(450 + 8, 125);
    ctx.closePath();
    ctx.fillStyle = '#ef4444';
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.font = '14px sans-serif';
    ctx.fillText(`F = ${s.force}N`, 460, 130);
    
    // 重物
    ctx.beginPath();
    ctx.rect(cx - 25, cy + r, 50, 50);
    ctx.fillStyle = '#475569';
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`G=${s.weight}N`, cx, cy + r + 30);
    ctx.textAlign = 'left';
    
    // 说明
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.fillText('动滑轮：省一半力，不改变力的方向', 200, 450);
    ctx.fillText('F = G/2 （忽略滑轮重和摩擦）', 200, 470);
  }
}

function drawPulleyGroup() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.pulleyGroup;
  const n = s.n;
  
  // 顶部支架
  ctx.fillStyle = '#475569';
  ctx.fillRect(150, 50, 400, 15);
  
  // 定滑轮组
  const fixedY = 100;
  const movableY = 300 + s.height * 30;
  const spacing = 80;
  const startX = 350 - (n - 1) * spacing / 2;
  
  // 绘制定滑轮
  for (let i = 0; i < Math.ceil(n/2); i++) {
    const cx = startX + i * spacing;
    ctx.beginPath();
    ctx.arc(cx, fixedY, 25, 0, Math.PI * 2);
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, fixedY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
  }
  
  // 绘制动滑轮
  for (let i = 0; i < Math.floor(n/2) + (n % 2 === 0 ? 1 : 0); i++) {
    const cx = startX + i * spacing + (n % 2 === 0 ? spacing/2 : 0);
    ctx.beginPath();
    ctx.arc(cx, movableY, 25, 0, Math.PI * 2);
    ctx.fillStyle = '#0891b2';
    ctx.fill();
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, movableY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
  }
  
  // 绘制绳子
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 3;
  
  // 简化绳子绘制
  let ropeX = startX - 30;
  ctx.beginPath();
  ctx.moveTo(ropeX, 80);
  ctx.lineTo(ropeX, movableY);
  ctx.stroke();
  
  for (let i = 0; i < n; i++) {
    const x = startX + (i % Math.ceil(n/2)) * spacing;
    const isDown = i % 2 === 0;
    ctx.beginPath();
    if (isDown) {
      ctx.moveTo(x, fixedY + 25);
      ctx.lineTo(x, movableY - 25);
    } else {
      ctx.moveTo(x, movableY - 25);
      ctx.lineTo(x, fixedY + 25);
    }
    ctx.stroke();
  }
  
  // 拉力端
  const pullX = startX + (n - 1) * spacing / 2 + 50;
  ctx.beginPath();
  ctx.moveTo(pullX, fixedY);
  ctx.lineTo(pullX, fixedY + 80);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pullX, fixedY + 80);
  ctx.lineTo(pullX - 8, fixedY + 65);
  ctx.lineTo(pullX + 8, fixedY + 65);
  ctx.closePath();
  ctx.fillStyle = '#ef4444';
  ctx.fill();
  ctx.fillStyle = '#ef4444';
  ctx.font = '14px sans-serif';
  ctx.fillText(`F = ${s.force.toFixed(1)}N`, pullX + 15, fixedY + 70);
  
  // 重物
  const weightCX = startX + (n - 1) * spacing / 2 + (n % 2 === 0 ? spacing/2 : 0);
  ctx.beginPath();
  ctx.rect(weightCX - 40, movableY + 30, 80, 60);
  ctx.fillStyle = '#475569';
  ctx.fill();
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`G = ${s.weight}N`, weightCX, movableY + 65);
  ctx.textAlign = 'left';
  
  // 机械效率指示
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`η = ${(s.efficiency * 100).toFixed(0)}%`, 50, 450);
}

function drawEfficiency() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.efficiency;
  
  // 计算
  s.usefulWork = s.weight * s.height;
  s.totalWork = s.force * s.distance;
  s.extraWork = s.totalWork - s.usefulWork;
  const efficiency = s.usefulWork / s.totalWork;
  
  // 绘制场景
  // 斜面
  ctx.beginPath();
  ctx.moveTo(100, 400);
  ctx.lineTo(600, 400);
  ctx.lineTo(600, 200);
  ctx.closePath();
  ctx.fillStyle = 'rgba(71, 85, 105, 0.5)';
  ctx.fill();
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 物体
  const objX = 200 + s.distance * 50;
  const objY = 400 - (objX - 100) * 200 / 500;
  
  ctx.beginPath();
  ctx.rect(objX - 25, objY - 50, 50, 50);
  ctx.fillStyle = '#f59e0b';
  ctx.fill();
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${s.weight}N`, objX, objY - 20);
  ctx.textAlign = 'left';
  
  // 拉力
  ctx.beginPath();
  ctx.moveTo(objX + 25, objY - 25);
  ctx.lineTo(objX + 80, objY - 55);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(objX + 80, objY - 55);
  ctx.lineTo(objX + 65, objY - 50);
  ctx.lineTo(objX + 70, objY - 40);
  ctx.closePath();
  ctx.fillStyle = '#ef4444';
  ctx.fill();
  ctx.fillStyle = '#ef4444';
  ctx.font = '14px sans-serif';
  ctx.fillText(`F = ${s.force}N`, objX + 85, objY - 50);
  
  // 高度标注
  ctx.beginPath();
  ctx.setLineDash([5, 5]);
  ctx.moveTo(620, 400);
  ctx.lineTo(620, 200);
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#3b82f6';
  ctx.fillText(`h = ${s.height.toFixed(1)}m`, 630, 310);
  
  // 距离标注
  ctx.beginPath();
  ctx.setLineDash([5, 5]);
  ctx.moveTo(100, 420);
  ctx.lineTo(600, 420);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.fillText(`s = ${s.distance.toFixed(1)}m`, 320, 440);
  
  // 能量柱状图
  const barX = 50, barY = 100, barW = 40, maxH = 200;
  const maxWork = Math.max(s.usefulWork, s.totalWork);
  
  // 有用功
  const usefulH = (s.usefulWork / maxWork) * maxH;
  ctx.fillStyle = '#10b981';
  ctx.fillRect(barX, barY + maxH - usefulH, barW, usefulH);
  ctx.fillStyle = '#10b981';
  ctx.font = '12px sans-serif';
  ctx.fillText(`W有用`, barX, barY + maxH + 20);
  ctx.fillText(`${s.usefulWork.toFixed(0)}J`, barX, barY + maxH - usefulH - 5);
  
  // 额外功
  const extraH = (s.extraWork / maxWork) * maxH;
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(barX + 60, barY + maxH - extraH, barW, extraH);
  ctx.fillStyle = '#f59e0b';
  ctx.fillText(`W额外`, barX + 60, barY + maxH + 20);
  ctx.fillText(`${s.extraWork.toFixed(0)}J`, barX + 60, barY + maxH - extraH - 5);
  
  // 总功
  const totalH = (s.totalWork / maxWork) * maxH;
  ctx.fillStyle = '#8b5cf6';
  ctx.fillRect(barX + 120, barY + maxH - totalH, barW, totalH);
  ctx.fillStyle = '#8b5cf6';
  ctx.fillText(`W总`, barX + 120, barY + maxH + 20);
  ctx.fillText(`${s.totalWork.toFixed(0)}J`, barX + 120, barY + maxH - totalH - 5);
  
  // 效率
  ctx.fillStyle = efficiency >= 0.8 ? '#10b981' : efficiency >= 0.5 ? '#f59e0b' : '#ef4444';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`η = ${(efficiency * 100).toFixed(1)}%`, 50, 60);
}

// 面板内容
function renderPanel() {
  if (mode === 'lever') {
    const s = state.lever;
    const torque1 = s.f1 * s.l1;
    const torque2 = s.f2 * s.l2;
    
    panel.innerHTML = `
      <h3>⚖️ 杠杆原理</h3>
      <div class="eq">F₁ × L₁ = F₂ × L₂</div>
      
      <div class="card">
        <div class="ct">📐 五要素</div>
        • 支点：杠杆绕着转动的点<br>
        • 动力：使杠杆转动的力 F₁<br>
        • 阻力：阻碍杠杆转动的力 F₂<br>
        • 动力臂：支点到动力作用线的距离 L₁<br>
        • 阻力臂：支点到阻力作用线的距离 L₂
      </div>
      
      <div class="slider-row">
        <label>支点位置</label>
        <input type="range" min="0.2" max="0.8" step="0.05" value="${s.pivotX}" id="pivotX">
        <span class="val">${(s.pivotX * 100).toFixed(0)}%</span>
      </div>
      <div class="slider-row">
        <label>动力 F₁</label>
        <input type="range" min="10" max="200" step="5" value="${s.f1}" id="f1">
        <span class="val">${s.f1}N</span>
      </div>
      <div class="slider-row">
        <label>阻力 F₂</label>
        <input type="range" min="10" max="200" step="5" value="${s.f2}" id="f2">
        <span class="val">${s.f2}N</span>
      </div>
      <div class="slider-row">
        <label>动力臂 L₁</label>
        <input type="range" min="0.5" max="3" step="0.1" value="${s.l1}" id="l1">
        <span class="val">${s.l1.toFixed(1)}m</span>
      </div>
      <div class="slider-row">
        <label>阻力臂 L₂</label>
        <input type="range" min="0.5" max="3" step="0.1" value="${s.l2}" id="l2">
        <span class="val">${s.l2.toFixed(1)}m</span>
      </div>
      
      <div class="info-grid">
        <div>动力矩: <b>${torque1.toFixed(1)} N·m</b></div>
        <div>阻力矩: <b>${torque2.toFixed(1)} N·m</b></div>
        <div>状态: <b style="color:${Math.abs(torque1-torque2)<1?'#10b981':'#f59e0b'}">${Math.abs(torque1-torque2)<1?'平衡':'不平衡'}</b></div>
        <div>类型: <b>${s.l1>s.l2?'省力':s.l1<s.l2?'费力':'等臂'}</b></div>
      </div>
      
      <div class="card">
        <div class="ct">💡 杠杆分类</div>
        • <span style="color:#10b981">省力杠杆</span>：L₁ > L₂，如撬棒、瓶起子<br>
        • <span style="color:#ef4444">费力杠杆</span>：L₁ < L₂，如筷子、钓鱼竿<br>
        • <span style="color:#3b82f6">等臂杠杆</span>：L₁ = L₂，如天平
      </div>
    `;
    
    // 绑定事件
    ['pivotX','f1','f2','l1','l2'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.lever[id] = parseFloat(el.value);
          renderPanel();
          drawLever();
        };
      }
    });
    
  } else if (mode === 'pulley') {
    const s = state.pulley;
    
    panel.innerHTML = `
      <h3>🔄 定滑轮与动滑轮</h3>
      <div class="eq">定滑轮：F = G &nbsp;&nbsp; 动滑轮：F = G/2</div>
      
      <div class="mode-switch">
        <div class="mode-btn ${s.type==='fixed'?'active':''}" data-type="fixed">定滑轮</div>
        <div class="mode-btn ${s.type==='movable'?'active':''}" data-type="movable">动滑轮</div>
      </div>
      
      <div class="slider-row">
        <label>物体重力</label>
        <input type="range" min="50" max="200" step="10" value="${s.weight}" id="weight">
        <span class="val">${s.weight}N</span>
      </div>
      <div class="slider-row">
        <label>拉力</label>
        <input type="range" min="10" max="200" step="5" value="${s.force}" id="force">
        <span class="val">${s.force}N</span>
      </div>
      <div class="slider-row">
        <label>提升高度</label>
        <input type="range" min="0" max="3" step="0.1" value="${s.lift}" id="lift">
        <span class="val">${s.lift.toFixed(1)}m</span>
      </div>
      
      <div class="card">
        <div class="ct">📊 ${s.type==='fixed'?'定滑轮':'动滑轮'}特点</div>
        ${s.type==='fixed' ? `
          • 不省力：F = G = ${s.weight}N<br>
          • 改变力的方向（向下拉）<br>
          • 绳端移动距离 = 物体上升高度<br>
          • 实质：等臂杠杆
        ` : `
          • 省一半力：F = G/2 = ${s.weight/2}N<br>
          • 不改变力的方向（向上拉）<br>
          • 绳端移动距离 = 2倍物体上升高度<br>
          • 实质：动力臂是阻力臂2倍的杠杆
        `}
      </div>
      
      <div class="info-grid">
        <div>理论拉力: <b>${s.type==='fixed'?s.weight:(s.weight/2)}N</b></div>
        <div>实际拉力: <b>${s.force}N</b></div>
        <div>绳端距离: <b>${s.type==='fixed'?s.lift:(s.lift*2)}m</b></div>
        <div>物体高度: <b>${s.lift}m</b></div>
      </div>
      
      <div class="card">
        <div class="ct">💡 应用场景</div>
        • 定滑轮：旗杆顶部、窗帘拉绳<br>
        • 动滑轮：建筑工地吊装、电梯
      </div>
    `;
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        state.pulley.type = btn.dataset.type;
        state.pulley.force = state.pulley.type === 'fixed' ? state.pulley.weight : state.pulley.weight / 2;
        renderPanel();
        drawPulley();
      };
    });
    
    ['weight','force','lift'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.pulley[id] = parseFloat(el.value);
          renderPanel();
          drawPulley();
        };
      }
    });
    
  } else if (mode === 'pulley-group') {
    const s = state.pulleyGroup;
    const idealForce = s.weight / s.n;
    const actualForce = idealForce / s.efficiency;
    
    panel.innerHTML = `
      <h3>🔗 滑轮组</h3>
      <div class="eq">F = G / (n × η)</div>
      
      <div class="slider-row">
        <label>绳子段数 n</label>
        <input type="range" min="2" max="6" step="1" value="${s.n}" id="n">
        <span class="val">${s.n}</span>
      </div>
      <div class="slider-row">
        <label>物体重力</label>
        <input type="range" min="100" max="500" step="50" value="${s.weight}" id="weight">
        <span class="val">${s.weight}N</span>
      </div>
      <div class="slider-row">
        <label>机械效率</label>
        <input type="range" min="0.5" max="1" step="0.05" value="${s.efficiency}" id="efficiency">
        <span class="val">${(s.efficiency*100).toFixed(0)}%</span>
      </div>
      
      <div class="card">
        <div class="ct">📊 滑轮组计算</div>
        • 承担物重的绳子段数：n = ${s.n}<br>
        • 理想拉力：F = G/n = ${s.weight}/${s.n} = <b>${idealForce.toFixed(1)}N</b><br>
        • 实际拉力：F = G/(n×η) = <b>${actualForce.toFixed(1)}N</b><br>
        • 绳端移动距离：s = ${s.n}h<br>
        • 绳端移动速度：v = ${s.n}v物
      </div>
      
      <div class="info-grid">
        <div>理想拉力: <b>${idealForce.toFixed(1)}N</b></div>
        <div>实际拉力: <b>${actualForce.toFixed(1)}N</b></div>
        <div>省力倍数: <b>${s.n}倍</b></div>
        <div>效率: <b>${(s.efficiency*100).toFixed(0)}%</b></div>
      </div>
      
      <div class="card">
        <div class="ct">💡 滑轮组特点</div>
        • 既省力又改变力的方向<br>
        • 绳子段数越多越省力<br>
        • 但绳端移动距离越长<br>
        • 实际应用需考虑机械效率
      </div>
    `;
    
    ['n','weight','efficiency'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.pulleyGroup[id] = parseFloat(el.value);
          renderPanel();
          drawPulleyGroup();
        };
      }
    });
    
  } else if (mode === 'efficiency') {
    const s = state.efficiency;
    s.usefulWork = s.weight * s.height;
    s.totalWork = s.force * s.distance;
    s.extraWork = s.totalWork - s.usefulWork;
    const efficiency = s.usefulWork / s.totalWork;
    
    panel.innerHTML = `
      <h3>📊 机械效率</h3>
      <div class="eq">η = W有用 / W总 × 100%</div>
      
      <div class="slider-row">
        <label>物体重力</label>
        <input type="range" min="50" max="200" step="10" value="${s.weight}" id="weight">
        <span class="val">${s.weight}N</span>
      </div>
      <div class="slider-row">
        <label>提升高度</label>
        <input type="range" min="0.5" max="4" step="0.1" value="${s.height}" id="height">
        <span class="val">${s.height.toFixed(1)}m</span>
      </div>
      <div class="slider-row">
        <label>拉力</label>
        <input type="range" min="20" max="150" step="5" value="${s.force}" id="force">
        <span class="val">${s.force}N</span>
      </div>
      <div class="slider-row">
        <label>绳端距离</label>
        <input type="range" min="1" max="8" step="0.5" value="${s.distance}" id="distance">
        <span class="val">${s.distance.toFixed(1)}m</span>
      </div>
      
      <div class="info-grid">
        <div>有用功: <b style="color:#10b981">${s.usefulWork.toFixed(0)}J</b></div>
        <div>总功: <b style="color:#8b5cf6">${s.totalWork.toFixed(0)}J</b></div>
        <div>额外功: <b style="color:#f59e0b">${s.extraWork.toFixed(0)}J</b></div>
        <div>效率: <b style="color:${efficiency>=0.8?'#10b981':efficiency>=0.5?'#f59e0b':'#ef4444'}">${(efficiency*100).toFixed(1)}%</b></div>
      </div>
      
      <div class="card">
        <div class="ct">📐 概念辨析</div>
        • <b>有用功</b>：对人们有用的功 W有用 = Gh<br>
        • <b>额外功</b>：人们不需要但又不得不做的功<br>
        • <b>总功</b>：有用功 + 额外功 W总 = Fs<br>
        • <b>机械效率</b>：有用功与总功的比值
      </div>
      
      <div class="card">
        <div class="ct">💡 提高效率的方法</div>
        • 减小摩擦（加润滑油）<br>
        • 减小机械自重（使用轻质材料）<br>
        • 增加有用功（提升更重的物体）
      </div>
    `;
    
    ['weight','height','force','distance'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.efficiency[id] = parseFloat(el.value);
          renderPanel();
          drawEfficiency();
        };
      }
    });
    
  } else if (mode === 'quiz') {
    panel.innerHTML = `
      <h3>🎯 互动练习</h3>
      
      <div class="quiz">
        <div class="quiz-q">1. 下列哪个是省力杠杆？</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 筷子</div>
          <div class="quiz-opt" data-correct="true">B. 瓶起子</div>
          <div class="quiz-opt" data-correct="false">C. 钓鱼竿</div>
          <div class="quiz-opt" data-correct="false">D. 镊子</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">2. 使用动滑轮可以：</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 省力且改变力的方向</div>
          <div class="quiz-opt" data-correct="true">B. 省力但不改变力的方向</div>
          <div class="quiz-opt" data-correct="false">C. 不省力但改变力的方向</div>
          <div class="quiz-opt" data-correct="false">D. 既不省力也不改变方向</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">3. 滑轮组的机械效率与下列哪个因素无关？</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 动滑轮的重力</div>
          <div class="quiz-opt" data-correct="false">B. 绳与轮之间的摩擦</div>
          <div class="quiz-opt" data-correct="true">C. 提升物体的速度</div>
          <div class="quiz-opt" data-correct="false">D. 提升物体的重力</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">4. 用滑轮组提升重物，绳子段数n=4，物体重200N，不计摩擦和滑轮重，拉力为：</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 200N</div>
          <div class="quiz-opt" data-correct="true">B. 50N</div>
          <div class="quiz-opt" data-correct="false">C. 100N</div>
          <div class="quiz-opt" data-correct="false">D. 800N</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
    `;
    
    // 进度追踪：答对题数累计，≥3/4 (60%) 触发 markDone
    const quizTotal = document.querySelectorAll('.quiz').length;
    let quizCorrect = 0;
    let quizDoneMarked = false;
    const answeredQuizzes = new WeakSet();

    function maybeMarkDone() {
      if (quizDoneMarked) return;
      const pass = quizCorrect >= Math.ceil(quizTotal * 0.6);
      if (pass && typeof PageProgress !== 'undefined' && !PageProgress.isDone('simple-machines')) {
        PageProgress.markDone('simple-machines');
        quizDoneMarked = true;
      }
    }

    document.querySelectorAll('.quiz-opt').forEach(opt => {
      opt.onclick = () => {
        const quiz = opt.closest('.quiz');
        const isCorrect = opt.dataset.correct === 'true';
        const fb = quiz.querySelector('.quiz-fb');
        const firstAnswer = !answeredQuizzes.has(quiz);
        answeredQuizzes.add(quiz);

        quiz.querySelectorAll('.quiz-opt').forEach(o => {
          o.classList.remove('correct', 'wrong');
        });

        if (isCorrect) {
          opt.classList.add('correct');
          if (firstAnswer) {
            quizCorrect++;
            maybeMarkDone();
          }
          fb.textContent = '✓ 正确！' + (quizDoneMarked ? ' · 已记录完成 ✓' : '');
          fb.style.color = '#10b981';
        } else {
          opt.classList.add('wrong');
          quiz.querySelector('[data-correct="true"]').classList.add('correct');
          fb.textContent = '✗ 再想想，看看正确答案的解析。';
          fb.style.color = '#ef4444';
        }
      };
    });
  }
}

// 切换模式
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    renderPanel();
    draw();
  };
});

function draw() {
  if (mode === 'lever') drawLever();
  else if (mode === 'pulley') drawPulley();
  else if (mode === 'pulley-group') drawPulleyGroup();
  else if (mode === 'efficiency') drawEfficiency();
  else if (mode === 'quiz') {
    ctx.clearRect(0, 0, 700, 500);
    ctx.fillStyle = '#64748b';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎯 右侧面板有练习题', 350, 250);
    ctx.fillText('点击选项查看答案', 350, 280);
    ctx.textAlign = 'left';
  }
}

// 初始化
renderPanel();
draw();
</script>
