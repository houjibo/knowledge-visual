<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>功和机械能 · 初中物理互动可视化</title>
<style>
  :root {
    --primary: #0891b2;
    --work: #f59e0b;
    --power: #ef4444;
    --kinetic: #3b82f6;
    --potential: #10b981;
    --mechanical: #8b5cf6;
    --dark: #0f172a;
    --light: #f1f5f9;
  }
  body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--light); font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 2rem; background: linear-gradient(90deg, var(--work), var(--power), var(--kinetic)); -webkit-background-clip: text; color: transparent; margin: 0; }
  header p { color: #94a3b8; margin: 6px 0 0; font-size: 14px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); cursor: pointer; transition: all .25s; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; color: #cbd5e1; }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 20px rgba(8,145,178,.4); }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .canvas-wrap { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; backdrop-filter: blur(10px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
  .panel { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; backdrop-filter: blur(10px); overflow-y: auto; max-height: 640px; }
  .panel h3 { margin: 0 0 10px; font-size: 1.05rem; color: #e2e8f0; }
  .eq { font-family: "Times New Roman", serif; font-size: 1.15rem; text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 8px 0; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .slider-row label { flex: 0 0 110px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .slider-row .val { flex: 0 0 70px; text-align: right; font-family: monospace; color: var(--primary); font-weight: 600; }
  .card { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 13px; line-height: 1.7; border-left: 3px solid var(--primary); }
  .card .ct { font-weight: 600; color: #67e8f9; margin-bottom: 4px; }
  .mode-switch { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .mode-btn { padding: 5px 12px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 12px; color: #e2e8f0; transition: all .2s; }
  .mode-btn.active { background: var(--primary); border-color: var(--primary); }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; font-size: 12px; }
  .info-grid div { background: rgba(255,255,255,0.04); padding: 6px 8px; border-radius: 8px; }
  .info-grid b { color: #fbbf24; }
  .quiz { margin-top: 10px; padding: 12px; background: rgba(8,145,178,0.08); border-radius: 12px; border: 1px solid rgba(8,145,178,0.3); }
  .quiz-q { font-size: 13px; margin-bottom: 8px; }
  .quiz-opts { display: grid; gap: 5px; }
  .quiz-opt { padding: 7px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-size: 12px; transition: all .2s; border: 1px solid transparent; }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt.correct { background: rgba(16,185,129,0.25); border-color: #10b981; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .quiz-fb { margin-top: 6px; font-size: 12px; min-height: 16px; }
  .legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: #cbd5e1; margin-top: 6px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  .legend .l-work::before { background: var(--work); }
  .legend .l-power::before { background: var(--power); }
  .legend .l-kinetic::before { background: var(--kinetic); }
  .legend .l-potential::before { background: var(--potential); }
  footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 16px; }
  .highlight { color: #fbbf24; font-weight: 600; }
  .energy-bar { height: 20px; border-radius: 4px; margin: 4px 0; transition: width 0.3s; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚡ 功和机械能 Interactive</h1>
    <p>功 · 功率 · 动能 · 势能 · 机械能转化</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="work">💪 功的概念</div>
    <div class="tab" data-mode="power">⚡ 功率</div>
    <div class="tab" data-mode="kinetic">🏃 动能</div>
    <div class="tab" data-mode="potential">⛰️ 势能</div>
    <div class="tab" data-mode="transform">🔄 机械能转化</div>
    <div class="tab" data-mode="quiz">🎯 互动练习</div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas" width="700" height="500"></canvas>
      <div class="legend">
        <span class="l-work">功 W</span>
        <span class="l-power">功率 P</span>
        <span class="l-kinetic">动能 Ek</span>
        <span class="l-potential">势能 Ep</span>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script src="assets/touch.js"></script>
<script src="assets/common.js"></script>
<script>
// r112: 进度追踪接入
let totalCorrect = 0;
const quizSolved = new Set();
function bumpTotalCorrect() {
  totalCorrect++;
  if (totalCorrect >= 3 && typeof PageProgress !== 'undefined' && !PageProgress.isDone('work-energy')) {
    PageProgress.markDone('work-energy');
    if (typeof showToast === 'function') showToast('🎉 本页知识点已点亮！');
  }
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');

let mode = 'work';
let animTime = 0;
let animFrame = null;

// 状态
const state = {
  work: {
    force: 50,
    distance: 4,
    angle: 0,
    objX: 0,
    moving: false
  },
  power: {
    work: 200,
    time: 5,
    type: 'human' // human | machine | engine
  },
  kinetic: {
    mass: 2,
    velocity: 3,
    ballX: 50
  },
  potential: {
    mass: 5,
    height: 10,
    type: 'gravitational' // gravitational | elastic
  },
  transform: {
    height: 10,
    gravity: 9.8,
    ballY: 0,
    velocity: 0,
    phase: 'falling' // falling | rising
  }
};

// 绘制函数
function drawWork() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.work;
  const groundY = 400;
  
  // 地面
  ctx.fillStyle = '#475569';
  ctx.fillRect(0, groundY, 700, 100);
  
  // 物体
  const objX = 100 + s.objX;
  const objW = 80, objH = 60;
  
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(objX, groundY - objH, objW, objH);
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.strokeRect(objX, groundY - objH, objW, objH);
  
  // 力的箭头
  const arrowLen = 50 + s.force;
  const angleRad = s.angle * Math.PI / 180;
  const arrowEndX = objX + objW/2 + arrowLen * Math.cos(angleRad);
  const arrowEndY = groundY - objH/2 - arrowLen * Math.sin(angleRad);
  
  ctx.beginPath();
  ctx.moveTo(objX + objW/2, groundY - objH/2);
  ctx.lineTo(arrowEndX, arrowEndY);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.stroke();
  
  // 箭头头部
  const headLen = 15;
  const headAngle = Math.PI / 6;
  ctx.beginPath();
  ctx.moveTo(arrowEndX, arrowEndY);
  ctx.lineTo(
    arrowEndX - headLen * Math.cos(angleRad - headAngle),
    arrowEndY + headLen * Math.sin(angleRad - headAngle)
  );
  ctx.lineTo(
    arrowEndX - headLen * Math.cos(angleRad + headAngle),
    arrowEndY + headLen * Math.sin(angleRad + headAngle)
  );
  ctx.closePath();
  ctx.fillStyle = '#ef4444';
  ctx.fill();
  
  // 力标签
  ctx.fillStyle = '#ef4444';
  ctx.font = '14px sans-serif';
  ctx.fillText(`F = ${s.force}N`, arrowEndX + 10, arrowEndY - 10);
  
  // 距离标注
  if (s.objX > 0) {
    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.moveTo(100, groundY + 20);
    ctx.lineTo(100 + s.objX, groundY + 20);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = '#3b82f6';
    ctx.fillText(`s = ${s.distance.toFixed(1)}m`, 100 + s.objX/2 - 20, groundY + 40);
  }
  
  // 功的计算
  const work = s.force * s.distance * Math.cos(angleRad);
  
  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`W = F·s·cosθ = ${work.toFixed(1)} J`, 350, 50);
  ctx.textAlign = 'left';
  
  // 角度标注
  ctx.beginPath();
  ctx.arc(objX + objW/2, groundY - objH/2, 30, 0, -angleRad, true);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(`θ = ${s.angle}°`, objX + objW/2 + 35, groundY - objH/2 - 10);
}

function drawPower() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.power;
  const power = s.work / s.time;
  
  // 场景
  const types = {
    human: { name: '人', color: '#f59e0b', emoji: '👷' },
    machine: { name: '机器', color: '#3b82f6', emoji: '🏭' },
    engine: { name: '发动机', color: '#ef4444', emoji: '🚗' }
  };
  
  const t = types[s.type];
  
  // 绘制场景
  ctx.fillStyle = t.color;
  ctx.font = '60px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(t.emoji, 350, 200);
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`${t.name}做功`, 350, 260);
  
  // 功率条
  const maxPower = 200;
  const barW = 300, barH = 30;
  const barX = 200, barY = 300;
  
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(barX, barY, barW, barH);
  
  const fillW = Math.min(power / maxPower, 1) * barW;
  const gradient = ctx.createLinearGradient(barX, barY, barX + barW, barY);
  gradient.addColorStop(0, '#10b981');
  gradient.addColorStop(0.5, '#f59e0b');
  gradient.addColorStop(1, '#ef4444');
  ctx.fillStyle = gradient;
  ctx.fillRect(barX, barY, fillW, barH);
  
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.strokeRect(barX, barY, barW, barH);
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`P = ${power.toFixed(1)} W`, 350, barY + 60);
  
  // 比较
  const comparisons = [
    { name: '人骑自行车', power: 70 },
    { name: '家用轿车', power: 60000 },
    { name: '高铁', power: 10000000 }
  ];
  
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('功率对比：', 100, 420);
  
  comparisons.forEach((c, i) => {
    const y = 440 + i * 20;
    ctx.fillStyle = '#64748b';
    ctx.fillText(c.name, 100, y);
    
    const cBarW = Math.min(Math.log10(c.power + 1) / 7 * 400, 400);
    ctx.fillStyle = 'rgba(148, 163, 184, 0.3)';
    ctx.fillRect(200, y - 10, cBarW, 12);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(`${c.power}W`, 200 + cBarW + 5, y);
  });
  
  ctx.textAlign = 'left';
}

function drawKinetic() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.kinetic;
  const Ek = 0.5 * s.mass * s.velocity * s.velocity;
  
  // 地面
  ctx.fillStyle = '#475569';
  ctx.fillRect(0, 400, 700, 100);
  
  // 球
  const ballR = 20 + s.mass * 3;
  const ballX = 100 + s.ballX;
  const ballY = 400 - ballR;
  
  // 运动模糊效果
  const blurLen = Math.abs(s.velocity) * 10;
  const gradient = ctx.createLinearGradient(ballX - blurLen, ballY, ballX, ballY);
  gradient.addColorStop(0, 'rgba(59, 130, 246, 0)');
  gradient.addColorStop(1, 'rgba(59, 130, 246, 0.5)');
  ctx.fillStyle = gradient;
  ctx.fillRect(ballX - blurLen, ballY - ballR, blurLen, ballR * 2);
  
  // 球本体
  ctx.beginPath();
  ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
  ctx.fillStyle = '#3b82f6';
  ctx.fill();
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  // 速度箭头
  const arrowLen = s.velocity * 20;
  ctx.beginPath();
  ctx.moveTo(ballX + ballR, ballY);
  ctx.lineTo(ballX + ballR + arrowLen, ballY);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.stroke();
  
  // 箭头
  ctx.beginPath();
  ctx.moveTo(ballX + ballR + arrowLen, ballY);
  ctx.lineTo(ballX + ballR + arrowLen - 10, ballY - 8);
  ctx.lineTo(ballX + ballR + arrowLen - 10, ballY + 8);
  ctx.closePath();
  ctx.fillStyle = '#ef4444';
  ctx.fill();
  
  ctx.fillStyle = '#ef4444';
  ctx.font = '14px sans-serif';
  ctx.fillText(`v = ${s.velocity.toFixed(1)} m/s`, ballX + ballR + arrowLen + 10, ballY + 5);
  
  // 动能公式
  ctx.fillStyle = '#3b82f6';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Ek = ½mv² = ${Ek.toFixed(1)} J`, 350, 50);
  
  // 能量条
  const maxEk = 100;
  const barX = 50, barY = 100, barW = 40, maxH = 250;
  const barH = Math.min(Ek / maxEk, 1) * maxH;
  
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(barX, barY + maxH - barH, barW, barH);
  ctx.fillStyle = '#3b82f6';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Ek', barX + barW/2, barY + maxH + 20);
  ctx.fillText(`${Ek.toFixed(0)}J`, barX + barW/2, barY + maxH - barH - 5);
  ctx.textAlign = 'left';
}

function drawPotential() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.potential;
  
  if (s.type === 'gravitational') {
    const Ep = s.mass * 9.8 * s.height;
    
    // 地面
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, 450, 700, 50);
    
    // 高度标尺
    ctx.beginPath();
    ctx.moveTo(100, 450);
    ctx.lineTo(100, 100);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 刻度
    for (let i = 0; i <= 10; i++) {
      const y = 450 - i * 35;
      ctx.beginPath();
      ctx.moveTo(95, y);
      ctx.lineTo(105, y);
      ctx.stroke();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px sans-serif';
      ctx.fillText(`${i}m`, 75, y + 4);
    }
    
    // 物体
    const objY = 450 - s.height * 35;
    const objSize = 30 + s.mass * 3;
    
    ctx.fillStyle = '#10b981';
    ctx.fillRect(150 - objSize/2, objY - objSize, objSize, objSize);
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 2;
    ctx.strokeRect(150 - objSize/2, objY - objSize, objSize, objSize);
    
    // 高度线
    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.moveTo(150, objY);
    ctx.lineTo(150, 450);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = '#3b82f6';
    ctx.font = '14px sans-serif';
    ctx.fillText(`h = ${s.height}m`, 160, (objY + 450) / 2);
    
    // 公式
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Ep = mgh = ${Ep.toFixed(1)} J`, 350, 50);
    
    // 能量条
    const maxEp = 500;
    const barX = 500, barY = 100, barW = 40, maxH = 300;
    const barH = Math.min(Ep / maxEp, 1) * maxH;
    
    ctx.fillStyle = '#10b981';
    ctx.fillRect(barX, barY + maxH - barH, barW, barH);
    ctx.fillStyle = '#10b981';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Ep', barX + barW/2, barY + maxH + 20);
    ctx.fillText(`${Ep.toFixed(0)}J`, barX + barW/2, barY + maxH - barH - 5);
    ctx.textAlign = 'left';
    
  } else {
    // 弹性势能
    const k = 100; // 劲度系数
    const x = s.height / 10; // 形变量
    const Ep = 0.5 * k * x * x;
    
    // 固定墙
    ctx.fillStyle = '#475569';
    ctx.fillRect(50, 150, 20, 200);
    
    // 弹簧
    const springLen = 200 + s.height * 10;
    const coils = 10;
    const coilW = 30;
    
    ctx.beginPath();
    ctx.moveTo(70, 250);
    for (let i = 0; i < coils; i++) {
      const x1 = 70 + (i + 0.25) * springLen / coils;
      const x2 = 70 + (i + 0.75) * springLen / coils;
      const y1 = 250 - coilW;
      const y2 = 250 + coilW;
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.lineTo(70 + springLen, 250);
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 物体
    const objX = 70 + springLen;
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(objX, 220, 60, 60);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(objX, 220, 60, 60);
    
    // 形变量标注
    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.moveTo(70, 350);
    ctx.lineTo(objX, 350);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = '#3b82f6';
    ctx.font = '14px sans-serif';
    ctx.fillText(`Δx = ${x.toFixed(2)}m`, (70 + objX) / 2 - 30, 370);
    
    // 公式
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Ep = ½kΔx² = ${Ep.toFixed(1)} J`, 350, 50);
    ctx.textAlign = 'left';
  }
}

function drawTransform() {
  ctx.clearRect(0, 0, 700, 500);
  
  const s = state.transform;
  const groundY = 450;
  const topY = 100;
  const range = groundY - topY;
  
  // 轨道
  ctx.beginPath();
  ctx.moveTo(350, topY);
  ctx.lineTo(350, groundY);
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 4;
  ctx.stroke();
  
  // 刻度
  for (let i = 0; i <= 10; i++) {
    const y = groundY - i * range / 10;
    ctx.beginPath();
    ctx.moveTo(340, y);
    ctx.lineTo(360, y);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px sans-serif';
    ctx.fillText(`${i}m`, 315, y + 4);
  }
  
  // 球位置
  const ballY = groundY - s.ballY * range / s.height;
  const ballR = 25;
  
  // 计算能量
  const Ep = s.mass * s.gravity * s.ballY;
  const Ek = 0.5 * s.mass * s.velocity * s.velocity;
  const E = Ep + Ek;
  
  // 球
  ctx.beginPath();
  ctx.arc(350, ballY, ballR, 0, Math.PI * 2);
  const gradient = ctx.createRadialGradient(345, ballY - 5, 5, 350, ballY, ballR);
  gradient.addColorStop(0, '#fbbf24');
  gradient.addColorStop(1, '#f59e0b');
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 能量条
  const barX = 500, barW = 40, barH = 300;
  const barY = 100;
  
  // 势能
  const EpH = (Ep / E) * barH;
  ctx.fillStyle = '#10b981';
  ctx.fillRect(barX, barY + barH - EpH, barW, EpH);
  
  // 动能
  const EkH = (Ek / E) * barH;
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(barX + 50, barY + barH - EkH, barW, EkH);
  
  // 总能量
  ctx.fillStyle = '#8b5cf6';
  ctx.fillRect(barX + 100, barY, barW, barH);
  
  // 标签
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#10b981';
  ctx.fillText('Ep', barX + barW/2, barY + barH + 20);
  ctx.fillText(`${Ep.toFixed(0)}J`, barX + barW/2, barY + barH - EpH - 5);
  
  ctx.fillStyle = '#3b82f6';
  ctx.fillText('Ek', barX + 50 + barW/2, barY + barH + 20);
  ctx.fillText(`${Ek.toFixed(0)}J`, barX + 50 + barW/2, barY + barH - EkH - 5);
  
  ctx.fillStyle = '#8b5cf6';
  ctx.fillText('E总', barX + 100 + barW/2, barY + barH + 20);
  ctx.fillText(`${E.toFixed(0)}J`, barX + 100 + barW/2, barY - 5);
  
  // 说明
  ctx.fillStyle = '#94a3b8';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`高度: ${s.ballY.toFixed(1)}m`, 50, 50);
  ctx.fillText(`速度: ${s.velocity.toFixed(1)}m/s`, 50, 75);
  ctx.fillText(`机械能守恒: E = Ek + Ep = ${E.toFixed(0)}J`, 50, 100);
  
  ctx.textAlign = 'left';
}

// 面板内容
function renderPanel() {
  if (mode === 'work') {
    const s = state.work;
    const work = s.force * s.distance * Math.cos(s.angle * Math.PI / 180);
    
    panel.innerHTML = `
      <h3>💪 功的概念</h3>
      <div class="eq">W = F · s · cosθ</div>
      
      <div class="slider-row">
        <label>力 F</label>
        <input type="range" min="10" max="100" step="5" value="${s.force}" id="force">
        <span class="val">${s.force}N</span>
      </div>
      <div class="slider-row">
        <label>位移 s</label>
        <input type="range" min="0" max="8" step="0.5" value="${s.distance}" id="distance">
        <span class="val">${s.distance.toFixed(1)}m</span>
      </div>
      <div class="slider-row">
        <label>角度 θ</label>
        <input type="range" min="0" max="90" step="5" value="${s.angle}" id="angle">
        <span class="val">${s.angle}°</span>
      </div>
      
      <button id="moveBtn" style="width:100%;padding:10px;background:#f59e0b;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;margin:10px 0;">
        ${s.moving ? '⏸ 暂停' : '▶ 开始移动'}
      </button>
      
      <div class="info-grid">
        <div>功 W: <b style="color:#f59e0b">${work.toFixed(1)} J</b></div>
        <div>cosθ: <b>${Math.cos(s.angle * Math.PI / 180).toFixed(2)}</b></div>
      </div>
      
      <div class="card">
        <div class="ct">📐 做功的两个必要因素</div>
        • 作用在物体上的<b>力</b><br>
        • 物体在力的方向上移动的<b>距离</b><br>
        • 两者缺一不可！
      </div>
      
      <div class="card">
        <div class="ct">💡 不做功的三种情况</div>
        • 有力无距离（推而不动）<br>
        • 有距离无力（惯性运动）<br>
        • 力与距离垂直（提水桶水平走）
      </div>
    `;
    
    ['force','distance','angle'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.work[id] = parseFloat(el.value);
          renderPanel();
          drawWork();
        };
      }
    });
    
    document.getElementById('moveBtn').onclick = () => {
      state.work.moving = !state.work.moving;
      renderPanel();
    };
    
  } else if (mode === 'power') {
    const s = state.power;
    const power = s.work / s.time;
    
    panel.innerHTML = `
      <h3>⚡ 功率</h3>
      <div class="eq">P = W / t</div>
      
      <div class="slider-row">
        <label>做功 W</label>
        <input type="range" min="100" max="1000" step="50" value="${s.work}" id="work">
        <span class="val">${s.work}J</span>
      </div>
      <div class="slider-row">
        <label>时间 t</label>
        <input type="range" min="1" max="20" step="0.5" value="${s.time}" id="time">
        <span class="val">${s.time}s</span>
      </div>
      
      <div class="mode-switch">
        <div class="mode-btn ${s.type==='human'?'active':''}" data-type="human">👷 人</div>
        <div class="mode-btn ${s.type==='machine'?'active':''}" data-type="machine">🏭 机器</div>
        <div class="mode-btn ${s.type==='engine'?'active':''}" data-type="engine">🚗 发动机</div>
      </div>
      
      <div class="info-grid">
        <div>功率: <b style="color:#ef4444">${power.toFixed(1)} W</b></div>
        <div>换算: <b>${(power/1000).toFixed(3)} kW</b></div>
      </div>
      
      <div class="card">
        <div class="ct">📐 功率的物理意义</div>
        • 表示做功的<b>快慢</b><br>
        • 功率越大，做功越快<br>
        • 单位：瓦特（W）= 焦耳/秒（J/s）
      </div>
      
      <div class="card">
        <div class="ct">💡 常见功率值</div>
        • 人骑自行车：约 70W<br>
        • 家用轿车：约 60kW<br>
        • 高铁：约 10MW
      </div>
    `;
    
    ['work','time'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.power[id] = parseFloat(el.value);
          renderPanel();
          drawPower();
        };
      }
    });
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        state.power.type = btn.dataset.type;
        renderPanel();
        drawPower();
      };
    });
    
  } else if (mode === 'kinetic') {
    const s = state.kinetic;
    const Ek = 0.5 * s.mass * s.velocity * s.velocity;
    
    panel.innerHTML = `
      <h3>🏃 动能</h3>
      <div class="eq">Ek = ½mv²</div>
      
      <div class="slider-row">
        <label>质量 m</label>
        <input type="range" min="0.5" max="10" step="0.5" value="${s.mass}" id="mass">
        <span class="val">${s.mass}kg</span>
      </div>
      <div class="slider-row">
        <label>速度 v</label>
        <input type="range" min="0" max="10" step="0.5" value="${s.velocity}" id="velocity">
        <span class="val">${s.velocity.toFixed(1)}m/s</span>
      </div>
      
      <button id="moveBtn" style="width:100%;padding:10px;background:#3b82f6;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;margin:10px 0;">
        ▶ 让球动起来
      </button>
      
      <div class="info-grid">
        <div>动能: <b style="color:#3b82f6">${Ek.toFixed(1)} J</b></div>
        <div>v²: <b>${(s.velocity*s.velocity).toFixed(1)}</b></div>
      </div>
      
      <div class="card">
        <div class="ct">📐 动能特点</div>
        • 动能是<b>标量</b>，只有大小没有方向<br>
        • 动能与速度的<b>平方</b>成正比<br>
        • 速度加倍，动能变为4倍！
      </div>
      
      <div class="card">
        <div class="ct">💡 生活实例</div>
        • 高速行驶的汽车刹车距离更长<br>
        • 子弹质量小但速度大，动能很大<br>
        • 台风具有巨大的动能
      </div>
    `;
    
    ['mass','velocity'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = () => {
          state.kinetic[id] = parseFloat(el.value);
          renderPanel();
          drawKinetic();
        };
      }
    });
    
    document.getElementById('moveBtn').onclick = () => {
      state.kinetic.ballX = 0;
      const move = () => {
        if (state.kinetic.ballX < 500 && state.kinetic.velocity > 0) {
          state.kinetic.ballX += state.kinetic.velocity * 2;
          drawKinetic();
          requestAnimationFrame(move);
        }
      };
      move();
    };
    
  } else if (mode === 'potential') {
    const s = state.potential;
    
    if (s.type === 'gravitational') {
      const Ep = s.mass * 9.8 * s.height;
      
      panel.innerHTML = `
        <h3>⛰️ 重力势能</h3>
        <div class="eq">Ep = mgh</div>
        
        <div class="slider-row">
          <label>质量 m</label>
          <input type="range" min="1" max="20" step="1" value="${s.mass}" id="mass">
          <span class="val">${s.mass}kg</span>
        </div>
        <div class="slider-row">
          <label>高度 h</label>
          <input type="range" min="0" max="10" step="0.5" value="${s.height}" id="height">
          <span class="val">${s.height.toFixed(1)}m</span>
        </div>
        
        <div class="info-grid">
          <div>重力势能: <b style="color:#10b981">${Ep.toFixed(1)} J</b></div>
          <div>g: <b>9.8 N/kg</b></div>
        </div>
        
        <div class="card">
          <div class="ct">📐 重力势能特点</div>
          • 与物体的<b>质量</b>和<b>高度</b>有关<br>
          • 高度越高，质量越大，势能越大<br>
          • 是<b>相对量</b>，需要选择参考面
        </div>
      `;
      
      ['mass','height'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.oninput = () => {
            state.potential[id] = parseFloat(el.value);
            renderPanel();
            drawPotential();
          };
        }
      });
      
    } else {
      const k = 100;
      const x = s.height / 10;
      const Ep = 0.5 * k * x * x;
      
      panel.innerHTML = `
        <h3>🏹 弹性势能</h3>
        <div class="eq">Ep = ½kΔx²</div>
        
        <div class="slider-row">
          <label>形变量 Δx</label>
          <input type="range" min="0" max="2" step="0.1" value="${s.height/10}" id="deform">
          <span class="val">${(s.height/10).toFixed(1)}m</span>
        </div>
        
        <div class="info-grid">
          <div>弹性势能: <b style="color:#10b981">${Ep.toFixed(1)} J</b></div>
          <div>劲度系数 k: <b>100 N/m</b></div>
        </div>
        
        <div class="card">
          <div class="ct">📐 弹性势能特点</div>
          • 与<b>形变量</b>的平方成正比<br>
          • 与弹簧的<b>劲度系数</b>有关<br>
          • 形变越大，势能越大
        </div>
      `;
      
      const el = document.getElementById('deform');
      if (el) {
        el.oninput = () => {
          state.potential.height = parseFloat(el.value) * 10;
          renderPanel();
          drawPotential();
        };
      }
    }
    
    panel.innerHTML += `
      <div class="mode-switch">
        <div class="mode-btn ${s.type==='gravitational'?'active':''}" data-type="gravitational">⛰️ 重力势能</div>
        <div class="mode-btn ${s.type==='elastic'?'active':''}" data-type="elastic">🏹 弹性势能</div>
      </div>
      
      <div class="card">
        <div class="ct">💡 势能应用</div>
        • 水力发电：利用水的重力势能<br>
        • 弓箭：利用弹性势能<br>
        • 过山车：势能与动能的转化
      </div>
    `;
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        state.potential.type = btn.dataset.type;
        renderPanel();
        drawPotential();
      };
    });
    
  } else if (mode === 'transform') {
    const s = state.transform;
    s.mass = 1;
    const Ep = s.mass * s.gravity * s.ballY;
    const Ek = 0.5 * s.mass * s.velocity * s.velocity;
    const E = Ep + Ek;
    
    panel.innerHTML = `
      <h3>🔄 机械能转化</h3>
      <div class="eq">E = Ek + Ep = 恒量（守恒）</div>
      
      <div class="slider-row">
        <label>初始高度</label>
        <input type="range" min="2" max="10" step="0.5" value="${s.height}" id="height">
        <span class="val">${s.height.toFixed(1)}m</span>
      </div>
      
      <button id="dropBtn" style="width:100%;padding:10px;background:#8b5cf6;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;margin:10px 0;">
        🎾 释放小球
      </button>
      
      <div class="info-grid">
        <div>高度: <b>${s.ballY.toFixed(1)}m</b></div>
        <div>速度: <b>${s.velocity.toFixed(1)}m/s</b></div>
        <div>势能 Ep: <b style="color:#10b981">${Ep.toFixed(1)}J</b></div>
        <div>动能 Ek: <b style="color:#3b82f6">${Ek.toFixed(1)}J</b></div>
        <div>总机械能: <b style="color:#8b5cf6">${E.toFixed(1)}J</b></div>
        <div>状态: <b>${s.phase === 'falling' ? '下落中' : '上升中'}</b></div>
      </div>
      
      <div class="card">
        <div class="ct">📐 机械能守恒条件</div>
        • 只有<b>重力</b>或<b>弹力</b>做功<br>
        • 没有其他力做功或其他力做功之和为零<br>
        • 动能和势能相互转化，总量不变
      </div>
      
      <div class="card">
        <div class="ct">💡 能量转化过程</div>
        • 下落：势能 → 动能<br>
        • 上升：动能 → 势能<br>
        • 最高点：势能最大，动能为零<br>
        • 最低点：动能最大，势能最小
      </div>
    `;
    
    document.getElementById('height').oninput = (e) => {
      state.transform.height = parseFloat(e.target.value);
      state.transform.ballY = state.transform.height;
      state.transform.velocity = 0;
      renderPanel();
      drawTransform();
    };
    
    document.getElementById('dropBtn').onclick = () => {
      state.transform.ballY = state.transform.height;
      state.transform.velocity = 0;
      state.transform.phase = 'falling';
      
      const animate = () => {
        const s = state.transform;
        const dt = 0.05;
        
        if (s.phase === 'falling') {
          s.velocity += s.gravity * dt;
          s.ballY -= s.velocity * dt;
          
          if (s.ballY <= 0) {
            s.ballY = 0;
            s.phase = 'rising';
          }
        } else {
          s.velocity -= s.gravity * dt;
          s.ballY += s.velocity * dt;
          
          if (s.ballY >= s.height || s.velocity <= 0) {
            s.ballY = s.height;
            s.velocity = 0;
            s.phase = 'falling';
          }
        }
        
        drawTransform();
        renderPanel();
        
        if (Math.abs(s.ballY) > 0.01 || Math.abs(s.velocity) > 0.01) {
          requestAnimationFrame(animate);
        }
      };
      animate();
    };
    
  } else if (mode === 'quiz') {
    panel.innerHTML = `
      <h3>🎯 互动练习</h3>
      
      <div class="quiz">
        <div class="quiz-q">1. 下列哪种情况人对物体做了功？</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 用力推墙，墙没动</div>
          <div class="quiz-opt" data-correct="true">B. 把水桶从地面提起</div>
          <div class="quiz-opt" data-correct="false">C. 提着水桶水平行走</div>
          <div class="quiz-opt" data-correct="false">D. 足球在光滑水平面滑动</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">2. 甲乙两人做功之比为2:3，时间之比为4:3，则功率之比为：</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="true">A. 1:2</div>
          <div class="quiz-opt" data-correct="false">B. 2:1</div>
          <div class="quiz-opt" data-correct="false">C. 8:9</div>
          <div class="quiz-opt" data-correct="false">D. 9:8</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">3. 跳伞运动员匀速下落时，他的：</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 动能减小，势能减小</div>
          <div class="quiz-opt" data-correct="true">B. 动能不变，势能减小</div>
          <div class="quiz-opt" data-correct="false">C. 动能增大，势能减小</div>
          <div class="quiz-opt" data-correct="false">D. 机械能不变</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-q">4. 从高处自由落下的物体，不计空气阻力，下列说法正确的是：</div>
        <div class="quiz-opts">
          <div class="quiz-opt" data-correct="false">A. 动能增大，势能增大</div>
          <div class="quiz-opt" data-correct="false">B. 动能减小，势能增大</div>
          <div class="quiz-opt" data-correct="true">C. 动能增大，势能减小，机械能不变</div>
          <div class="quiz-opt" data-correct="false">D. 动能增大，势能减小，机械能增大</div>
        </div>
        <div class="quiz-fb"></div>
      </div>
    `;
    
    document.querySelectorAll('.quiz-opt').forEach(opt => {
      opt.onclick = () => {
        const quiz = opt.closest('.quiz');
        const isCorrect = opt.dataset.correct === 'true';
        const fb = quiz.querySelector('.quiz-fb');
        
        quiz.querySelectorAll('.quiz-opt').forEach(o => {
          o.classList.remove('correct', 'wrong');
        });
        
        if (isCorrect) {
          opt.classList.add('correct');
          fb.textContent = '✓ 正确！';
          fb.style.color = '#10b981';
          if (!quizSolved.has(quiz)) {
            quizSolved.add(quiz);
            bumpTotalCorrect();
          }
        } else {
          opt.classList.add('wrong');
          quiz.querySelector('[data-correct="true"]').classList.add('correct');
          fb.textContent = '✗ 再想想，看看正确答案的解析。';
          fb.style.color = '#ef4444';
        }
      };
    });
  }
}

// 切换模式
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    renderPanel();
    draw();
  };
});

function draw() {
  if (mode === 'work') drawWork();
  else if (mode === 'power') drawPower();
  else if (mode === 'kinetic') drawKinetic();
  else if (mode === 'potential') drawPotential();
  else if (mode === 'transform') drawTransform();
  else if (mode === 'quiz') {
    ctx.clearRect(0, 0, 700, 500);
    ctx.fillStyle = '#64748b';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎯 右侧面板有练习题', 350, 250);
    ctx.textAlign = 'left';
  }
}

// 功的动画
function animateWork() {
  if (state.work.moving) {
    if (state.work.objX < 400) {
      state.work.objX += 2;
      state.work.distance = state.work.objX / 100;
      drawWork();
      requestAnimationFrame(animateWork);
    } else {
      state.work.moving = false;
      renderPanel();
    }
  }
}

// 初始化
state.transform.ballY = state.transform.height;
renderPanel();
draw();

// 监听功动画
setInterval(() => {
  if (state.work.moving) animateWork();
}, 50);
</script>
