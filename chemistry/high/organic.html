<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>有机化学基础 · 互动可视化</title>
<style>
  :root {
    --primary: #10b981;
    --carbon: #374151;
    --hydrogen: #93c5fd;
    --double: #f59e0b;
    --triple: #ef4444;
    --iso: #8b5cf6;
    --accent: #06b6d4;
    --dark: #0f172a;
    --card: rgba(15,23,42,0.75);
    --border: rgba(255,255,255,0.08);
    --light: #f1f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(135deg, #0f172a 0%, #064e3b 40%, #0f172a 100%); color: var(--light); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 2.2rem; background: linear-gradient(90deg, #10b981, #06b6d4, #8b5cf6); -webkit-background-clip: text; color: transparent; }
  header p { color: #94a3b8; margin-top: 6px; font-size: 15px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); color: var(--light); font-family: inherit; cursor: pointer; transition: all .25s; border: 1px solid var(--border); font-size: 14px; user-select: none; }
  .tab.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 20px rgba(16,185,129,.4); }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .tab:focus-visible, .mode-btn:focus-visible, .iso-card:focus-visible, .quiz-opt:focus-visible, .quiz-nav button:focus-visible, #retry-organic-save:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .stage { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .canvas-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; backdrop-filter: blur(10px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; backdrop-filter: blur(10px); overflow-y: auto; max-height: 520px; }
  .panel h3 { margin: 0 0 12px; font-size: 1.1rem; color: #e2e8f0; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
  .slider-row label { flex: 0 0 100px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--primary); }
  .slider-row .val { flex: 0 0 50px; text-align: right; font-family: monospace; color: var(--primary); font-weight: 600; }
  .formula-display { font-family: "Times New Roman", serif; font-size: 1.3rem; text-align: center; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 10px 0; line-height: 1.8; }
  .formula-display .c { color: var(--carbon); font-weight: 700; }
  .formula-display .h { color: var(--hydrogen); }
  .formula-display .db { color: var(--double); font-weight: 600; }
  .formula-display .tr { color: var(--triple); font-weight: 600; }
  .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; font-size: 13px; }
  .info-grid div { background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
  .info-grid b { color: #fbbf24; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: #cbd5e1; margin-top: 8px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .legend .l-c::before { background: var(--carbon); }
  .legend .l-h::before { background: var(--hydrogen); }
  .legend .l-db::before { background: var(--double); }
  .legend .l-tr::before { background: var(--triple); }
  .mode-switch { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .mode-btn { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); cursor: pointer; font: inherit; font-size: 13px; color: #e2e8f0; transition: all .2s; }
  .mode-btn.active { background: var(--primary); border-color: var(--primary); }
  .concept-card { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 14px; margin: 10px 0; border-left: 3px solid var(--primary); line-height: 1.7; font-size: 14px; }
  .concept-card .title { font-weight: 600; margin-bottom: 4px; color: var(--primary); }
  .iso-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 10px 0; }
  .iso-card { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.3); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all .2s; color: var(--light); font-family: inherit; }
  .iso-card:hover { transform: scale(1.05); border-color: var(--iso); }
  .iso-card.selected { background: rgba(139,92,246,0.25); border-color: var(--iso); box-shadow: 0 0 12px rgba(139,92,246,.3); }
  .iso-card .name { font-size: 13px; font-weight: 600; color: var(--iso); margin-bottom: 4px; }
  .iso-card .struct { font-size: 11px; color: #94a3b8; font-family: monospace; }
  .quiz { margin-top: 14px; padding: 14px; background: rgba(16,185,129,0.08); border-radius: 12px; border: 1px solid rgba(16,185,129,0.3); }
  .quiz-q { font-size: 14px; margin-bottom: 10px; line-height: 1.6; }
  .quiz-opts { display: grid; gap: 6px; }
  .quiz-opt { padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--light); text-align: left; transition: all .2s; border: 1px solid transparent; }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt.correct { background: rgba(16,185,129,0.25); border-color: #10b981; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .quiz-feedback { margin-top: 8px; font-size: 13px; color: #fbbf24; min-height: 18px; }
  .quiz-nav { display: flex; gap: 8px; margin-top: 10px; }
  .quiz-nav button { padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; background: var(--primary); color: white; }
  .quiz-nav button:disabled { opacity: 0.4; cursor: default; }
  .name-input-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  .name-input-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.08); color: white; font-size: 14px; }
  .name-input-row input:focus { outline: none; border-color: var(--primary); }
  .check-btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; background: var(--primary); color: white; transition: all .2s; }
  .check-btn:hover { filter: brightness(1.1); }
  .result-msg { margin-top: 8px; font-size: 14px; min-height: 20px; }
  .result-msg.ok { color: #10b981; }
  .result-msg.err { color: #ef4444; }
  .progress-note { margin: 8px auto 0; max-width: 760px; min-height: 20px; color: #fbbf24; font-size: 14px; }
  #retry-organic-save { margin-top: 8px; padding: 7px 14px; border: 1px solid #fbbf24; border-radius: 8px; background: #334155; color: #fff; cursor: pointer; }
  .hidden { display: none; }
  .series-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .series-table th, .series-table td { padding: 8px; border: 1px solid var(--border); text-align: center; }
  .series-table th { background: rgba(16,185,129,0.15); color: var(--primary); }
  .series-table td { background: rgba(255,255,255,0.03); }
  .reaction-eq { font-family: "Times New Roman", serif; font-size: 1.1rem; text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin: 8px 0; line-height: 1.8; }
  .reaction-eq .arrow { color: var(--primary); margin: 0 6px; }
  .reaction-eq .cond { font-size: 0.8rem; color: #94a3b8; }
  @media (prefers-reduced-motion: reduce) { .tab, .mode-btn, .iso-card, .quiz-opt { transition: none; } .iso-card:hover { transform: none; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🧪 有机化学基础 <span id="done-mark" style="font-size:14px;color:#34C759;font-weight:700;vertical-align:middle;"></span></h1>
    <p>烷烃·烯烃·炔烃 | 同分异构体 | 系统命名法</p>
    <p class="progress-note" id="organic-progress" role="status" aria-live="polite"></p>
    <button type="button" id="retry-organic-save" hidden>重试保存命名进度</button>
  </header>

  <div class="tabs" role="tablist" aria-label="有机化学学习主题">
    <button class="tab active" id="tab-structure" type="button" role="tab" aria-controls="organic-panel-structure" aria-selected="true" tabindex="0" data-tab="structure">🔬 结构构建</button>
    <button class="tab" id="tab-isomer" type="button" role="tab" aria-controls="organic-panel-isomer" aria-selected="false" tabindex="-1" data-tab="isomer">🧩 同分异构</button>
    <button class="tab" id="tab-naming" type="button" role="tab" aria-controls="organic-panel-naming" aria-selected="false" tabindex="-1" data-tab="naming">📝 命名练习</button>
    <button class="tab" id="tab-reaction" type="button" role="tab" aria-controls="organic-panel-reaction" aria-selected="false" tabindex="-1" data-tab="reaction">⚗️ 特征反应</button>
  </div>

  <div id="organic-panel-structure" role="tabpanel" tabindex="0" aria-labelledby="tab-structure">
    <div class="stage" id="organic-stage">
      <div class="canvas-wrap">
        <canvas id="mainCanvas" width="600" height="480" role="img" aria-label="烃类结构示意；请结合右侧分子式和说明阅读"></canvas>
        <p id="canvas-fallback" hidden>图示不可用；仍可用右侧文字和控件探索。</p>
        <div class="legend" id="legendArea">
          <span class="l-c">碳 (C)</span>
          <span class="l-h">氢 (H)</span>
          <span class="l-db">双键</span>
          <span class="l-tr">三键</span>
        </div>
      </div>
      <div class="panel" id="panelArea"></div>
    </div>
  </div>
  <div id="organic-panel-isomer" role="tabpanel" tabindex="0" aria-labelledby="tab-isomer" hidden></div>
  <div id="organic-panel-naming" role="tabpanel" tabindex="0" aria-labelledby="tab-naming" hidden></div>
  <div id="organic-panel-reaction" role="tabpanel" tabindex="0" aria-labelledby="tab-reaction" hidden></div>
</div>

<script src="assets/common.js"></script>
<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panelArea');
const stage = document.getElementById('organic-stage');
const legend = document.getElementById('legendArea');
const topicTabs = [...document.querySelectorAll('.tabs [role="tab"]')];
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let currentTab = 'structure';
let animFrame = 0;
if (!ctx) document.getElementById('canvas-fallback').hidden = false;

function setCanvasDescription(description) {
  canvas.setAttribute('aria-label', description);
}

function drawNextFrame(draw) {
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = 0;
  if (ctx && !document.hidden && !reducedMotion.matches) animFrame = requestAnimationFrame(draw);
}

function restartDrawing(draw) {
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = 0;
  if (ctx) draw();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && animFrame) cancelAnimationFrame(animFrame);
  if (document.hidden) animFrame = 0;
});
reducedMotion.addEventListener?.('change', () => {
  if (reducedMotion.matches && animFrame) cancelAnimationFrame(animFrame);
  if (reducedMotion.matches) animFrame = 0;
});

// ===== TAB SWITCHING =====
function activateTab(tab, moveFocus = false) {
  const next = tab.dataset.tab;
  if (next !== currentTab) {
    topicTabs.forEach(item => {
      const selected = item === tab;
      item.classList.toggle('active', selected);
      item.setAttribute('aria-selected', String(selected));
      item.tabIndex = selected ? 0 : -1;
      document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
    });
    document.getElementById(tab.getAttribute('aria-controls')).appendChild(stage);
    currentTab = next;
    legend.hidden = next !== 'structure';
    initTab();
  }
  if (moveFocus) tab.focus();
}
topicTabs.forEach(tab => {
  tab.addEventListener('click', () => activateTab(tab));
  tab.addEventListener('keydown', event => {
    const current = topicTabs.indexOf(tab);
    const target = event.key === 'ArrowRight' ? (current + 1) % topicTabs.length
      : event.key === 'ArrowLeft' ? (current - 1 + topicTabs.length) % topicTabs.length
      : event.key === 'Home' ? 0 : event.key === 'End' ? topicTabs.length - 1 : -1;
    if (target >= 0) {
      event.preventDefault();
      activateTab(topicTabs[target], true);
    }
  });
});

// ===== STRUCTURE TAB =====
let structCarbons = 3;
let structType = 'alkane'; // alkane, alkene, alkyne
let structAnim = 0;

function initStructure() {
  panel.innerHTML = `
    <h3>🔬 有机分子结构构建</h3>
    <div class="mode-switch" role="group" aria-label="烃类选择">
      <button type="button" class="mode-btn ${structType === 'alkane' ? 'active' : ''}" aria-pressed="${structType === 'alkane'}" data-type="alkane">烷烃 (单键)</button>
      <button type="button" class="mode-btn ${structType === 'alkene' ? 'active' : ''}" aria-pressed="${structType === 'alkene'}" data-type="alkene">烯烃 (双键)</button>
      <button type="button" class="mode-btn ${structType === 'alkyne' ? 'active' : ''}" aria-pressed="${structType === 'alkyne'}" data-type="alkyne">炔烃 (三键)</button>
    </div>
    <div class="slider-row">
      <label for="carbonSlider">碳原子数</label>
      <input type="range" id="carbonSlider" min="1" max="8" value="${structCarbons}" />
      <span class="val" id="carbonVal">${structCarbons}</span>
    </div>
    <div class="formula-display" id="formulaDisp"></div>
    <div class="info-grid" id="structInfo"></div>
    <div class="concept-card" id="structConcept"></div>
  `;
  panel.querySelectorAll('.mode-btn').forEach(b => {
    b.addEventListener('click', () => {
      structType = b.dataset.type;
      panel.querySelectorAll('.mode-btn').forEach(x => {
        const selected = x === b;
        x.classList.toggle('active', selected);
        x.setAttribute('aria-pressed', String(selected));
      });
      updateStructure();
    });
  });
  document.getElementById('carbonSlider').addEventListener('input', e => {
    structCarbons = parseInt(e.target.value);
    document.getElementById('carbonVal').textContent = structCarbons;
    updateStructure();
  });
  updateStructure();
}

function updateStructure() {
  let formula, name, bondAngle, hybrid;
  const n = structCarbons;
  if (structType === 'alkane') {
    formula = n === 1 ? 'CH<sub class="h">4</sub>' : `C<sub class="c">${n}</sub>H<sub class="h">${2*n+2}</sub>`;
    name = ['甲烷','乙烷','丙烷','丁烷','戊烷','己烷','庚烷','辛烷'][n-1];
    bondAngle = '局部约109.5°'; hybrid = '各碳 sp³';
  } else if (structType === 'alkene') {
    if (n < 2) { formula = '不存在'; name = '—'; bondAngle = '—'; hybrid = '—'; }
    else { formula = `C<sub class="c">${n}</sub>H<sub class="h">${2*n}</sub>`; name = ['—','乙烯','丙烯','丁烯','戊烯','己烯','庚烯','辛烯'][n-1]; bondAngle = '双键碳约120°'; hybrid = '双键碳 sp²'; }
  } else {
    if (n < 2) { formula = '不存在'; name = '—'; bondAngle = '—'; hybrid = '—'; }
    else { formula = `C<sub class="c">${n}</sub>H<sub class="h">${2*n-2}</sub>`; name = ['—','乙炔','丙炔','丁炔','戊炔','己炔','庚炔','辛炔'][n-1]; bondAngle = '三键碳180°'; hybrid = '三键碳 sp'; }
  }
  document.getElementById('formulaDisp').innerHTML = formula;
  document.getElementById('structInfo').innerHTML = `
    <div><b>名称</b>：${name}</div>
    <div><b>键角</b>：${bondAngle}</div>
    <div><b>杂化</b>：${hybrid}</div>
    <div><b>通式</b>：${structType==='alkane'?'CₙH₂ₙ₊₂':structType==='alkene'?'CₙH₂ₙ':'CₙH₂ₙ₋₂'}</div>
  `;
  const concepts = {
    alkane: `<div class="title">烷烃特征</div>仅含C-C单键，饱和烃。每个碳sp³杂化，四面体构型。化学性质稳定，主要反应为取代反应（与卤素光照条件下）。`,
    alkene: `<div class="title">烯烃特征</div>含C=C双键，不饱和烃。双键碳sp²杂化，平面构型。可发生加成反应（加H₂、X₂、HX、H₂O）、氧化反应（使KMnO₄褪色）、加聚反应。`,
    alkyne: `<div class="title">炔烃特征</div>含C≡C三键，不饱和烃。三键碳sp杂化，直线构型。可发生加成反应（分步加成）、氧化反应。乙炔燃烧温度极高，用于氧炔焰焊接。`
  };
  const valid = structType === 'alkane' || n >= 2;
  document.getElementById('structConcept').innerHTML = `${valid ? concepts[structType] : '<div class="title">结构不成立</div>烯烃和炔烃至少需要两个碳原子。'}<p>二维图只示意连接，屏幕上的夹角不是分子空间键角。</p>`;
  setCanvasDescription(valid
    ? `${name}结构连接示意：${n}个碳、${structType === 'alkane' ? 2*n+2 : structType === 'alkene' ? 2*n : 2*n-2}个氢；空间键角请读文字。`
    : '该烃至少需要两个碳原子；当前没有有效分子图。');
  restartDrawing(drawStructure);
}

function drawStructure() {
  if (!ctx) return;
  structAnim += 0.02;
  ctx.clearRect(0, 0, 600, 480);
  const n = structCarbons;
  const w = 600, h = 480;

  if (structType === 'alkane' && n >= 2) {
    // Draw zigzag chain
    const spacing = Math.min(80, (w - 80) / Math.max(n - 1, 1));
    const startX = (w - spacing * (n - 1)) / 2;
    const cy = h / 2;
    const amp = 35;
    const positions = [];
    for (let i = 0; i < n; i++) {
      const x = startX + i * spacing;
      const y = cy + (i % 2 === 0 ? -amp : amp);
      positions.push({ x, y });
    }
    // Draw bonds
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 3;
    for (let i = 0; i < n - 1; i++) {
      ctx.beginPath();
      ctx.moveTo(positions[i].x, positions[i].y);
      ctx.lineTo(positions[i + 1].x, positions[i + 1].y);
      ctx.stroke();
    }
    // Draw H atoms
    const pulse = Math.sin(structAnim * 2) * 3;
    for (let i = 0; i < n; i++) {
      const numH = (i === 0 || i === n - 1) ? 3 : 2;
      const angles = getAlkaneHAngles(i, n, positions, i > 0 ? positions[i-1] : null, i < n-1 ? positions[i+1] : null);
      for (let j = 0; j < numH; j++) {
        const a = angles[j];
        const hx = positions[i].x + Math.cos(a) * (50 + pulse);
        const hy = positions[i].y + Math.sin(a) * (50 + pulse);
        ctx.strokeStyle = '#4b5563';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath();
        ctx.arc(hx, hy, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e3a5f';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('H', hx, hy);
      }
    }
    // Draw C atoms
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = '#374151';
      ctx.beginPath();
      ctx.arc(positions[i].x, positions[i].y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', positions[i].x, positions[i].y);
    }
  } else if (structType === 'alkene' && n >= 2) {
    const spacing = Math.min(80, (w - 80) / Math.max(n - 1, 1));
    const startX = (w - spacing * (n - 1)) / 2;
    const cy = h / 2;
    const positions = [];
    for (let i = 0; i < n; i++) {
      positions.push({ x: startX + i * spacing, y: cy });
    }
    // Draw bonds
    for (let i = 0; i < n - 1; i++) {
      if (i === 0) {
        // Double bond
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y - 5);
        ctx.lineTo(positions[i + 1].x, positions[i + 1].y - 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y + 5);
        ctx.lineTo(positions[i + 1].x, positions[i + 1].y + 5);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(positions[i + 1].x, positions[i + 1].y);
        ctx.stroke();
      }
    }
    // H atoms for alkene
    const pulse = Math.sin(structAnim * 2) * 3;
    for (let i = 0; i < n; i++) {
      let numH;
      if (n === 2) numH = 2;
      else if (i === 0) numH = 2;
      else if (i === 1) numH = (n === 2) ? 2 : 1;
      else if (i === n - 1) numH = 3;
      else numH = 2;
      const baseAngle = -Math.PI / 2;
      const spread = Math.PI / (numH + 1);
      for (let j = 0; j < numH; j++) {
        const a = -Math.PI / 2 + (j - (numH - 1) / 2) * 0.8;
        const dir = (i % 2 === 0) ? -1 : 1;
        const hx = positions[i].x + Math.cos(a) * (45 + pulse) * (j % 2 === 0 ? 1 : -1) * 0.3 + (j - (numH-1)/2) * 25;
        const hy = positions[i].y + (j < numH/2 ? -40 : 40) + pulse * (j < numH/2 ? -1 : 1);
        ctx.strokeStyle = '#4b5563';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath();
        ctx.arc(hx, hy, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e3a5f';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('H', hx, hy);
      }
    }
    // C atoms
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i < 2 ? '#92400e' : '#374151';
      ctx.beginPath();
      ctx.arc(positions[i].x, positions[i].y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = i < 2 ? '#f59e0b' : '#6b7280';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', positions[i].x, positions[i].y);
    }
  } else if (structType === 'alkyne' && n >= 2) {
    const spacing = Math.min(90, (w - 80) / Math.max(n - 1, 1));
    const startX = (w - spacing * (n - 1)) / 2;
    const cy = h / 2;
    const positions = [];
    for (let i = 0; i < n; i++) {
      positions.push({ x: startX + i * spacing, y: cy });
    }
    for (let i = 0; i < n - 1; i++) {
      if (i === 0) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.moveTo(positions[i].x, positions[i].y + k * 5);
          ctx.lineTo(positions[i + 1].x, positions[i + 1].y + k * 5);
          ctx.stroke();
        }
      } else {
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(positions[i + 1].x, positions[i + 1].y);
        ctx.stroke();
      }
    }
    const pulse = Math.sin(structAnim * 2) * 3;
    for (let i = 0; i < n; i++) {
      let numH;
      if (n === 2) numH = 1;
      else if (i === 0) numH = 1;
      else if (i === 1) numH = 0;
      else if (i === n - 1) numH = 3;
      else numH = 2;
      for (let j = 0; j < numH; j++) {
        const angle = (i === 0) ? Math.PI : (j === 0 ? -Math.PI/2.5 : Math.PI/2.5);
        const hx = positions[i].x + Math.cos(angle) * (50 + pulse);
        const hy = positions[i].y + Math.sin(angle) * (50 + pulse);
        ctx.strokeStyle = '#4b5563';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath();
        ctx.arc(hx, hy, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e3a5f';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('H', hx, hy);
      }
    }
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i < 2 ? '#7f1d1d' : '#374151';
      ctx.beginPath();
      ctx.arc(positions[i].x, positions[i].y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = i < 2 ? '#ef4444' : '#6b7280';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', positions[i].x, positions[i].y);
    }
  } else if (structType === 'alkane') {
    // Single carbon (methane)
    const cx = w / 2, cy2 = h / 2;
    const pulse = Math.sin(structAnim * 2) * 3;
    for (let i = 0; i < 4; i++) {
      const a = (Math.PI * 2 / 4) * i - Math.PI / 4;
      const hx = cx + Math.cos(a) * (60 + pulse);
      const hy = cy2 + Math.sin(a) * (60 + pulse);
      ctx.strokeStyle = '#4b5563';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy2);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      ctx.fillStyle = '#93c5fd';
      ctx.beginPath();
      ctx.arc(hx, hy, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e3a5f';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('H', hx, hy);
    }
    ctx.fillStyle = '#374151';
    ctx.beginPath();
    ctx.arc(cx, cy2, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#f1f5f9';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('C', cx, cy2);
  } else {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('至少需要两个碳原子', w / 2, h / 2);
  }
  drawNextFrame(drawStructure);
}

function getAlkaneHAngles(i, n, positions, prev, next) {
  const angles = [];
  if (n === 1) {
    for (let j = 0; j < 4; j++) angles.push((Math.PI * 2 / 4) * j - Math.PI / 4);
    return angles;
  }
  // Simple placement: above and below
  if (i === 0 || i === n - 1) {
    // terminal: 3 H
    const dir = i === 0 ? Math.PI : 0;
    angles.push(dir - 0.7);
    angles.push(dir);
    angles.push(dir + 0.7);
  } else {
    // middle: 2 H
    angles.push(-Math.PI / 2);
    angles.push(Math.PI / 2);
  }
  return angles;
}

function drawIsomers() {
  if (!ctx) return;
  isoAnim += 0.015;

  const n = isomers.length;
  const cols = Math.min(n, 3);
  const rows = Math.ceil(n / cols);
  const cellW = 600 / cols;
  const cellH = 480 / rows;

  isomers.forEach((iso, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = col * cellW + cellW / 2;
    const cy = row * cellH + cellH / 2;
    const isSelected = selectedIsomer === idx;
    const scale = isSelected ? 1.1 + Math.sin(isoAnim * 3) * 0.05 : 1;

    // Draw mini structure
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    drawCarbonSkeleton(ctx, iso);

    ctx.restore();

    // Label
    ctx.fillStyle = isSelected ? '#8b5cf6' : '#94a3b8';
    ctx.font = `${isSelected ? 'bold ' : ''}13px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(iso.name, cx, cy + 80 * scale);
  });

  drawNextFrame(drawIsomers);
}

function carbonSkeleton(iso) {
  const spacing = 32;
  const nodes = Array.from({length: iso.chain}, (_, index) => ({
    x: (index - (iso.chain - 1) / 2) * spacing,
    y: index % 2 ? 12 : -12,
  }));
  const edges = Array.from({length: iso.chain - 1}, (_, index) => [index, index + 1]);
  const countAt = new Map();
  iso.branches.forEach(mainIndex => {
    const count = countAt.get(mainIndex) || 0;
    countAt.set(mainIndex, count + 1);
    const main = nodes[mainIndex];
    nodes.push({x: main.x, y: main.y + (count % 2 === 0 ? -42 : 42)});
    edges.push([mainIndex, nodes.length - 1]);
  });
  return {nodes, edges};
}

function drawCarbonSkeleton(c, iso) {
  const {nodes, edges} = carbonSkeleton(iso);
  c.strokeStyle = '#94a3b8';
  c.lineWidth = 2;
  edges.forEach(([from, to]) => {
    c.beginPath();
    c.moveTo(nodes[from].x, nodes[from].y);
    c.lineTo(nodes[to].x, nodes[to].y);
    c.stroke();
  });
  nodes.forEach(({x, y}) => {
    c.fillStyle = '#374151';
    c.beginPath();
    c.arc(x, y, 11, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#94a3b8';
    c.stroke();
    c.fillStyle = '#f1f5f9';
    c.font = 'bold 11px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('C', x, y);
  });
}

  ctx.fillText(q.struct, 300, 240);
  ctx.font = '15px sans-serif';
  ctx.fillText('这里只呈现题目文字，不绘制空间分子模型。', 300, 320);
}

// ===== REACTION TAB =====
const reactions = [
  { name: '取代反应', eq: 'CH₄ + Cl₂ <span class="arrow">→</span><sup class="cond">光照</sup> CH₃Cl + HCl', desc: '本例显示甲烷与氯气的一个取代产物；实际反应还可能继续取代，不由此图预测产物比例。', scope: '甲烷（本例）', color: '#374151' },
  { name: '加成反应', eq: 'CH₂=CH₂ + Br₂ <span class="arrow">→</span> CH₂Br-CH₂Br', desc: '本例中乙烯双键发生加成，两端分别连接溴原子；其他不饱和烃需按各自结构判断。', scope: '乙烯（本例）', color: '#f59e0b' },
  { name: '加聚反应', eq: 'nCH₂=CH₂ <span class="arrow">→</span><sup class="cond">催化剂</sup> [-CH₂-CH₂-]ₙ', desc: '本例中乙烯通过加成聚合形成聚乙烯；示意图不表示真实反应速率或分子量。', scope: '乙烯（本例）', color: '#8b5cf6' },
  { name: '氧化反应', eq: '乙烯 + 酸性 KMnO₄ 溶液 <span class="arrow">→</span> 紫色褪去', desc: '这是现象示意，不是配平方程；褪色可提供不饱和键线索，不能单凭这一现象判断全部烃类。', scope: '乙烯（本例）', color: '#ef4444' },
  { name: '燃烧反应', eq: 'CₓHᵧ + (x+y/4)O₂ <span class="arrow">→</span> xCO₂ + (y/2)H₂O', desc: '这是供氧充分时烃完全燃烧的通式；实际火焰和烟量受供氧与具体物质等条件影响。', scope: '烃（完全燃烧）', color: '#10b981' },
];
let reactionIdx = 0;
let rxnAnim = 0;

function initReaction() {
  reactionIdx = 0;
  renderReaction();
  restartDrawing(drawReaction);
}

function renderReaction() {
  const r = reactions[reactionIdx];
  if (!document.getElementById('reactionEq')) {
    panel.innerHTML = `
      <h3>⚗️ 有机特征反应</h3>
      <p>动画只表示阶段变化，不呈现真实反应机理、产率或用时。</p>
      <div class="mode-switch" role="group" aria-label="反应示例选择">
        ${reactions.map((rx, i) => `<button type="button" class="mode-btn" aria-pressed="false" data-idx="${i}">${rx.name}</button>`).join('')}
      </div>
      <div class="reaction-eq" id="reactionEq"></div>
      <div class="concept-card" id="reactionConcept"></div>
      <div class="info-grid">
        <div id="reactionType"></div>
        <div id="reactionScope"></div>
      </div>
    `;
    panel.querySelectorAll('.mode-btn').forEach(b => {
      b.addEventListener('click', () => {
        reactionIdx = parseInt(b.dataset.idx);
        renderReaction();
        restartDrawing(drawReaction);
      });
    });
  }
  panel.querySelectorAll('.mode-btn').forEach(b => {
    const selected = Number(b.dataset.idx) === reactionIdx;
    b.classList.toggle('active', selected);
    b.setAttribute('aria-pressed', String(selected));
  });
  document.getElementById('reactionEq').innerHTML = r.eq;
  const concept = document.getElementById('reactionConcept');
  concept.style.borderColor = r.color;
  concept.innerHTML = `<div class="title" style="color:${r.color}">${r.name}</div>${r.desc}`;
  document.getElementById('reactionType').innerHTML = `<b>反应类型</b>：${r.name}`;
  document.getElementById('reactionScope').innerHTML = `<b>本例范围</b>：${r.scope}`;
  setCanvasDescription(`${r.name}阶段示意；${document.getElementById('reactionEq').textContent}。动画不表示实际机理或时间。`);
}

function drawReaction() {
  if (!ctx) return;
  rxnAnim += 0.02;
  ctx.clearRect(0, 0, 600, 480);
  const r = reactions[reactionIdx];

  // Animated reaction visualization
  const cx = 300, cy = 240;

  if (reactionIdx === 0) {
    // Substitution: CH4 + Cl2 -> CH3Cl + HCl
    const t = rxnAnim % 6;
    if (t < 2) {
      // Show CH4 and Cl2 approaching
      const offset = (2 - t) * 50;
      drawMolecule(ctx, cx - 80 - offset, cy, ['C', 'H', 'H', 'H', 'H'], 'CH₄');
      drawMolecule(ctx, cx + 80 + offset, cy, ['Cl', 'Cl'], 'Cl₂');
    } else if (t < 3) {
      // Flash
      ctx.fillStyle = `rgba(251,191,36,${(3 - t) * 0.5})`;
      ctx.beginPath();
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.fill();
      drawMolecule(ctx, cx, cy, ['C', 'H', 'H', 'H', 'Cl'], '过渡态');
    } else {
      // Products
      const offset = (t - 3) * 50;
      drawMolecule(ctx, cx - 80 - offset, cy, ['C', 'H', 'H', 'H', 'Cl'], 'CH₃Cl');
      drawMolecule(ctx, cx + 80 + offset, cy, ['H', 'Cl'], 'HCl');
    }
  } else if (reactionIdx === 1) {
    // Addition: C2H4 + Br2
    const t = rxnAnim % 6;
    if (t < 2) {
      const offset = (2 - t) * 60;
      drawDoubleBond(ctx, cx - 60 - offset, cy);
      drawMolecule(ctx, cx + 100 + offset, cy, ['Br', 'Br'], 'Br₂');
    } else if (t < 3) {
      ctx.fillStyle = `rgba(245,158,11,${(3 - t) * 0.5})`;
      ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('双键打开', cx, cy - 60);
    } else {
      drawAdditionProduct(ctx, cx, cy, (t - 3) * 30);
    }
  } else if (reactionIdx === 2) {
    // Polymerization
    const t = rxnAnim;
    for (let i = 0; i < 5; i++) {
      const x = 80 + i * 100;
      const phase = (t + i * 0.5) % 4;
      if (phase < 2) {
        drawDoubleBond(ctx, x, 240 + Math.sin(t + i) * 20);
      } else {
        // Connecting
        const progress = (phase - 2) / 2;
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 3;
        if (i > 0) {
          ctx.beginPath();
          ctx.moveTo(x - 100 + 20, 240);
          ctx.lineTo(x - 100 + 20 + progress * 80, 240);
          ctx.stroke();
        }
        ctx.fillStyle = '#374151';
        ctx.beginPath(); ctx.arc(x, 240, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f1f5f9'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('C', x, 240);
      }
    }
    ctx.fillStyle = '#8b5cf6';
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('加聚反应 → 高分子链', 300, 380);
  } else if (reactionIdx === 3) {
    // Oxidation - KMnO4
    const t = rxnAnim % 4;
    const purple = `rgba(139,92,246,${1 - t / 4})`;
    ctx.fillStyle = purple;
    ctx.beginPath();
    ctx.arc(300, 240, 60 + t * 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('KMnO₄', 300, 220);
    ctx.fillText(t < 2 ? '紫色' : '褪色', 300, 260);
    // Bubbles
    for (let i = 0; i < 8; i++) {
      const bx = 300 + Math.cos(t * 2 + i) * (40 + i * 8);
      const by = 240 + Math.sin(t * 3 + i) * (30 + i * 5) - t * 10;
      ctx.fillStyle = `rgba(139,92,246,${0.3 - t * 0.05})`;
      ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // Combustion
    const t = rxnAnim;
    // Fire effect
    for (let i = 0; i < 15; i++) {
      const fx = 300 + Math.sin(t * 3 + i * 0.7) * (20 + i * 3);
      const fy = 280 - i * 12 - Math.sin(t * 5 + i) * 8;
      const size = 15 - i * 0.7;
      const alpha = 1 - i / 15;
      const hue = i < 5 ? '#fef08a' : i < 10 ? '#f59e0b' : '#ef4444';
      ctx.fillStyle = hue;
      ctx.globalAlpha = alpha * 0.7;
      ctx.beginPath(); ctx.arc(fx, fy, size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#374151';
    ctx.beginPath(); ctx.arc(300, 320, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f1f5f9'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CₓHᵧ', 300, 320);
    ctx.fillStyle = '#e2e8f0'; ctx.font = '16px sans-serif';
    ctx.fillText('燃烧', 300, 380);
  }

  drawNextFrame(drawReaction);
}

function drawMolecule(c, x, y, atoms, label) {
  const n = atoms.length;
  if (n <= 2) {
    for (let i = 0; i < n; i++) {
      const ax = x + (i - (n-1)/2) * 30;
      c.fillStyle = atoms[i] === 'H' || atoms[i] === 'Cl' ? '#93c5fd' : '#374151';
      c.beginPath(); c.arc(ax, y, 14, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#f1f5f9'; c.font = '11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(atoms[i], ax, y);
    }
  } else {
    // Central atom with surrounding
    c.fillStyle = '#374151';
    c.beginPath(); c.arc(x, y, 16, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f1f5f9'; c.font = 'bold 12px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(atoms[0], x, y);
    for (let i = 1; i < n; i++) {
      const a = (Math.PI * 2 / (n - 1)) * (i - 1) - Math.PI / 2;
      const ax = x + Math.cos(a) * 35;
      const ay = y + Math.sin(a) * 35;
      c.strokeStyle = '#4b5563'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(ax, ay); c.stroke();
      c.fillStyle = atoms[i] === 'Cl' ? '#86efac' : '#93c5fd';
      c.beginPath(); c.arc(ax, ay, 12, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#1e3a5f'; c.font = '10px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(atoms[i], ax, ay);
    }
  }
  c.fillStyle = '#94a3b8'; c.font = '13px sans-serif'; c.textAlign = 'center';
  c.fillText(label, x, y + 60);
}

function drawDoubleBond(c, x, y) {
  c.strokeStyle = '#f59e0b'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x - 15, y - 4); c.lineTo(x + 15, y - 4); c.stroke();
  c.beginPath(); c.moveTo(x - 15, y + 4); c.lineTo(x + 15, y + 4); c.stroke();
  c.fillStyle = '#374151';
  c.beginPath(); c.arc(x - 15, y, 12, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + 15, y, 12, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#f1f5f9'; c.font = '10px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('C', x - 15, y);
  c.fillText('C', x + 15, y);
}

function drawAdditionProduct(c, x, y, offset) {
  c.strokeStyle = '#6b7280'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x - 30, y); c.lineTo(x + 30, y); c.stroke();
  const atoms = [
    { x: x - 30, y: y, label: 'C', color: '#374151' },
    { x: x + 30, y: y, label: 'C', color: '#374151' },
    { x: x - 30, y: y - 35 - offset * 0.3, label: 'Br', color: '#86efac' },
    { x: x + 30, y: y + 35 + offset * 0.3, label: 'Br', color: '#86efac' },
  ];
  atoms.forEach(a => {
    if (a.label === 'Br') {
      c.strokeStyle = '#4b5563'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(a.x, y); c.lineTo(a.x, a.y); c.stroke();
    }
    c.fillStyle = a.color;
    c.beginPath(); c.arc(a.x, a.y, 14, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f1f5f9'; c.font = '11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(a.label, a.x, a.y);
  });
}

// ===== INIT TAB =====
function initTab() {
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = 0;
  if (currentTab === 'structure') initStructure();
  else if (currentTab === 'isomer') initIsomer();
  else if (currentTab === 'naming') initNaming();
  else if (currentTab === 'reaction') initReaction();
}

initTab();
