<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>声音的奥秘 · 小学科学互动可视化</title>
<style>
  :root {
    --primary: #8b5cf6;
    --primary-light: #c4b5fd;
    --wave: #06b6d4;
    --vibrate: #f59e0b;
    --pitch: #ec4899;
    --volume: #10b981;
    --dark: #0f172a;
    --panel: rgba(15,23,42,0.85);
    --light: #f1f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
    color: var(--light);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 2.4rem;
    background: linear-gradient(90deg, var(--primary), var(--wave), var(--vibrate));
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  header p { color: #94a3b8; font-size: 1rem; }

  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .tab {
    padding: 12px 24px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    cursor: pointer; transition: all .25s;
    border: 2px solid rgba(255,255,255,0.1);
    font-size: 15px; user-select: none; font-weight: 500; color: var(--light); font-family: inherit;
  }
  .tab.active {
    background: var(--primary); border-color: var(--primary);
    box-shadow: 0 4px 24px rgba(139,92,246,0.4); color: white;
  }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.15); }

  .stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 960px) { .stage { grid-template-columns: 1fr; } }

  .canvas-wrap {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 16px; backdrop-filter: blur(12px);
  }
  canvas {
    width: 100%; height: auto; display: block;
    border-radius: 10px;
    background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
  }
  .controls { display: flex; gap: 12px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .ctrl-btn {
    padding: 8px 18px; border-radius: 10px;
    background: rgba(139,92,246,0.15); border: 2px solid rgba(139,92,246,0.3);
    cursor: pointer; font-size: 14px; color: var(--primary-light);
    transition: all .2s; user-select: none; font-weight: 500;
  }
  .ctrl-btn:hover { background: rgba(139,92,246,0.25); }
  .ctrl-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .panel {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px; backdrop-filter: blur(12px);
    overflow-y: auto; max-height: 680px;
  }
  .panel h3 { font-size: 1.15rem; margin-bottom: 12px; color: #e2e8f0; }

  .concept-box {
    font-size: 1.05rem; text-align: left; padding: 16px;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    margin: 12px 0; line-height: 1.9;
    border-left: 4px solid var(--primary);
  }
  .concept-box .hl { color: var(--vibrate); font-weight: 600; }
  .concept-box .hl2 { color: var(--wave); font-weight: 600; }
  .concept-box .hl3 { color: var(--pitch); font-weight: 600; }
  .concept-box .hl4 { color: var(--volume); font-weight: 600; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 14px; }
  .slider-row label { flex: 0 0 100px; color: #cbd5e1; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .slider-row .val { flex: 0 0 80px; text-align: right; font-family: monospace; color: var(--primary-light); font-weight: 600; font-size: 13px; }

  .mode-switch { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .mode-btn {
    padding: 8px 16px; border-radius: 10px;
    background: rgba(6,182,212,0.1); border: 2px solid rgba(6,182,212,0.3);
    cursor: pointer; font-size: 14px; color: #67e8f9;
    transition: all .2s; user-select: none; font-weight: 500;
  }
  .mode-btn.active { background: var(--wave); border-color: var(--wave); color: white; }
  .mode-btn:hover:not(.active) { background: rgba(255,255,255,0.12); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; font-size: 13px; }
  .info-grid div { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; line-height: 1.6; }
  .info-grid b { color: #fbbf24; }

  .steps { margin: 14px 0; }
  .step {
    padding: 12px 14px; margin: 8px 0;
    background: rgba(255,255,255,0.04); border-radius: 10px;
    font-size: 14px; line-height: 1.8;
    border-left: 4px solid var(--primary); transition: all .3s;
  }
  .step.active { background: rgba(139,92,246,0.15); border-left-color: var(--wave); }
  .step .sn {
    display: inline-block; width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary); color: white; text-align: center;
    line-height: 24px; font-size: 12px; margin-right: 8px; font-weight: 700;
  }
  .step.active .sn { background: var(--wave); }

  .quiz { margin-top: 16px; padding: 18px; background: rgba(139,92,246,0.1); border-radius: 14px; border: 2px solid rgba(139,92,246,0.3); }
  .quiz-q { font-size: 15px; margin-bottom: 14px; line-height: 1.7; font-weight: 500; }
  .quiz-opts { display: grid; gap: 10px; }
  .quiz-opt {
    padding: 12px 16px; background: rgba(255,255,255,0.06);
    border-radius: 10px; cursor: pointer; font-size: 14px;
    transition: all .2s; border: 2px solid transparent; color: var(--light); font-family: inherit; text-align: left;
  }
  .quiz-opt:hover { background: rgba(255,255,255,0.12); }
  .quiz-opt.correct { background: rgba(16,185,129,0.3); border-color: #10b981; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.3); border-color: #ef4444; }
  .quiz-feedback { margin-top: 12px; font-size: 14px; color: #c4b5fd; min-height: 22px; line-height: 1.6; }
  .quiz-nav { display: flex; gap: 10px; margin-top: 14px; }
  .quiz-nav button {
    padding: 8px 18px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 14px; background: var(--primary); color: white;
    transition: all .2s; font-weight: 500;
  }
  .quiz-nav button:hover { background: #7c3aed; }
  .quiz-nav button:disabled { opacity: 0.4; cursor: not-allowed; }

  .section { display: none; }
  .section.active { display: block; }

  .instrument-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .inst-btn {
    padding: 14px; border-radius: 12px; text-align: center;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: all .25s; font-size: 14px; line-height: 1.5; color: var(--light); font-family: inherit;
  }
  .inst-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .inst-btn.active { background: rgba(139,92,246,0.2); border-color: var(--primary); }
  .inst-btn .emoji { font-size: 28px; display: block; margin-bottom: 6px; }

  .meter-wrap { margin: 14px 0; }
  .meter-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  .meter-bar {
    height: 24px; border-radius: 12px; background: rgba(255,255,255,0.08);
    overflow: hidden; position: relative;
  }
  .meter-fill {
    height: 100%; border-radius: 12px; transition: width .15s;
    background: linear-gradient(90deg, var(--volume), var(--vibrate));
  }
  .meter-fill.pitch-fill {
    background: linear-gradient(90deg, var(--wave), var(--pitch));
  }

  .fun-fact {
    margin: 14px 0; padding: 14px; border-radius: 12px;
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
    font-size: 13px; line-height: 1.7; color: #fcd34d;
  }
  .fun-fact::before { content: "💡 "; font-size: 16px; }

  .drag-hint { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 8px; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔊 声音的奥秘</h1>
    <p>小学科学 · 声学启蒙互动可视化 <span id="done-mark" style="display:none;margin-left:6px;color:#34C759;font-weight:700;">✓ 已完成</span></p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="vibrate">🎵 声音的产生</button>
    <button class="tab" data-tab="propagate">🌊 声音的传播</button>
    <button class="tab" data-tab="pitch-volume">🎹 音调与响度</button>
    <button class="tab" data-tab="quiz">📝 小测验</button>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="720" height="500" role="img" aria-label="声音振动示意图"></canvas>
      <div class="controls" id="controls"></div>
      <div class="controls"><button class="ctrl-btn" id="pauseAnimation" aria-pressed="false">暂停动画</button></div>
      <div class="drag-hint" id="dragHint"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const controls = document.getElementById('controls');
const dragHint = document.getElementById('dragHint');
let W = 720, H = 500;
let currentTab = 'vibrate';
let animId = null;
let t = 0;
let animationPaused = false;
document.getElementById('pauseAnimation').addEventListener('click', function() {
  animationPaused = !animationPaused;
  this.textContent = animationPaused ? '继续动画' : '暂停动画';
  this.setAttribute('aria-pressed', String(animationPaused));
  if (animationPaused) cancelAnimationFrame(animId);
  else loop();
});

// ─── PageProgress 接线（r135）───
const SLUG = 'sound';
const ALL_TABS = ['vibrate', 'propagate', 'pitch-volume', 'quiz'];
const visitedTabs = new Set(['vibrate']);
const quizAttempted = new Set();
const quizFirstTryCorrect = new Set();

function maybeMarkDone() {
  if (typeof PageProgress === 'undefined') return;
  if (PageProgress.isDone(SLUG)) return;
  const allVisited = ALL_TABS.every(t => visitedTabs.has(t));
  const allCorrect = quizFirstTryCorrect.size === quizzes.length;
  if (allVisited && allCorrect) {
    PageProgress.markDone(SLUG);
    showSoundToast('🎉 「声音的奥秘」知识地图已点亮！');
    updateDoneMark();
  }
}
function showSoundToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(52,199,89,.95);color:#fff;padding:12px 24px;border-radius:12px;font-size:15px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:opacity .3s';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 2600);
}
function updateDoneMark() {
  if (typeof PageProgress === 'undefined') return;
  if (PageProgress.isDone(SLUG)) {
    const m = document.getElementById('done-mark');
    if (m) m.style.display = 'inline';
  }
}

// ─── Tab switching ───
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    visitedTabs.add(currentTab);
    maybeMarkDone();
    initTab();
  });
});

// ─── State ───
const state = {
  freq: 2,        // vibration frequency
  amp: 40,        // vibration amplitude
  waveSpeed: 2,
  waveFreq: 3,
  waveAmp: 30,
  medium: 'air',  // air / water / solid
  showParticles: true,
  instrument: 'guitar',
  pitchFreq: 3,
  volumeAmp: 35,
  quizIdx: 0,
  quizScore: 0,
  quizAnswered: false,
};

// ─── Quiz data ───
const quizzes = [
  { q: "声音是由什么产生的？", opts: ["振动", "光照", "温度", "颜色"], ans: 0, explain: "声源振动产生声波；声源停止振动后，已经发出的声波仍会继续传播一段时间。" },
  { q: "在本页给出的条件下，声音在下列哪种介质中传播最快？", opts: ["空气", "淡水", "钢铁", "真空"], ans: 2, explain: "本页列出的钢铁中声速高于淡水和空气；声速取决于材料及条件，不应把此顺序推广到所有介质。" },
  { q: "音调的高低取决于什么？", opts: ["振幅大小", "频率高低", "传播距离", "介质种类"], ans: 1, explain: "音调由频率决定：频率越高，音调越高；频率越低，音调越低。" },
  { q: "其他条件相近时，响度（音量大小）与什么有关？", opts: ["频率", "振幅", "音色", "传播速度"], ans: 1, explain: "其他条件相近时，振幅通常越大，听到的声音越响；响度还会受到频率、距离等因素影响。" },
  { q: "月球上宇航员为什么要用无线电通话？", opts: ["距离太远", "声音太慢", "真空不能传声", "月球太安静"], ans: 2, explain: "月球表面接近真空，声音无法传播，所以必须用无线电（电磁波）来通信。" },
  { q: "敲鼓时，鼓面振动越快，声音会？", opts: ["越低沉", "越尖锐", "越响亮", "没有变化"], ans: 1, explain: "鼓面振动越快 = 频率越高 = 音调越高，声音听起来越尖锐。" },
];

// ═══════════════════════════════════════
// TAB 1: 声音的产生 (振动)
// ═══════════════════════════════════════
function initVibrate() {
  controls.innerHTML = `
    <button class="ctrl-btn ${state.instrument === 'guitar' ? 'active' : ''}" data-mode="guitar">🎸 吉他弦</button>
    <button class="ctrl-btn ${state.instrument === 'drum' ? 'active' : ''}" data-mode="drum">🥁 鼓面</button>
    <button class="ctrl-btn ${state.instrument === 'vocal' ? 'active' : ''}" data-mode="vocal">🗣️ 声带</button>
  `;
  controls.querySelectorAll('.ctrl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      controls.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.instrument = btn.dataset.mode;
    });
  });

  panel.innerHTML = `
    <h3>🎵 声音是怎样产生的？</h3>
    <div class="concept-box">
      声音是由物体<span class="hl">振动</span>产生的。<br>
      当物体来回快速运动时，就会<span class="hl2">挤压周围的空气</span>，<br>
      形成一圈一圈的<span class="hl2">声波</span>，传到我们的耳朵里。<br><br>
      🔑 声源停止振动后不再产生新的声波；已经发出的声波仍会继续传播。
    </div>
    <div class="steps">
      <div class="step active"><span class="sn">1</span>物体受到力的作用开始<span class="hl">振动</span></div>
      <div class="step"><span class="sn">2</span>振动挤压周围空气，形成<span class="hl2">疏密波</span></div>
      <div class="step"><span class="sn">3</span>声波向外传播，到达耳朵</div>
      <div class="step"><span class="sn">4</span>耳膜振动 → 大脑听到声音！</div>
    </div>
    <div class="slider-row">
      <label for="freqSlider">振动快慢（档位）</label>
      <input type="range" min="1" max="6" step="0.5" value="${state.freq}" id="freqSlider" />
      <span class="val" id="freqVal">${state.freq} 档</span>
    </div>
    <div class="slider-row">
      <label for="ampSlider">振动幅度（示意）</label>
      <input type="range" min="10" max="60" step="5" value="${state.amp}" id="ampSlider" />
      <span class="val" id="ampVal">${state.amp} px</span>
    </div>
    <div class="fun-fact">
      把手放在喉咙上说话，你能感受到声带在振动！说话时声带每秒振动100~1000次以上。
    </div>
    <div class="info-grid">
      <div><b>🎸 吉他弦</b><br>拨动琴弦，弦来回振动产生声音。弦越紧、越细，振动越快，音调越高。</div>
      <div><b>🥁 鼓面</b><br>敲击鼓面，鼓面上下振动。用力越大，振幅越大，声音越响。</div>
    </div>
  `;

  const freqSlider = document.getElementById('freqSlider');
  const ampSlider = document.getElementById('ampSlider');
  freqSlider.oninput = () => { state.freq = +freqSlider.value; document.getElementById('freqVal').textContent = state.freq + ' 档'; };
  ampSlider.oninput = () => { state.amp = +ampSlider.value; document.getElementById('ampVal').textContent = state.amp + ' px'; };

  dragHint.textContent = '观察不同物体的振动方式';
}

function drawVibrate() {
  ctx.clearRect(0, 0, W, H);
  const mode = state.instrument;

  if (mode === 'guitar') {
    drawGuitar();
  } else if (mode === 'drum') {
    drawDrum();
  } else {
    drawVocal();
  }
}

function drawGuitar() {
  // Guitar body
  ctx.fillStyle = '#92400e';
  ctx.beginPath();
  ctx.ellipse(360, 350, 140, 100, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#78350f';
  ctx.beginPath();
  ctx.ellipse(360, 350, 100, 70, 0, 0, Math.PI * 2);
  ctx.fill();
  // Sound hole
  ctx.fillStyle = '#1c1917';
  ctx.beginPath();
  ctx.ellipse(360, 340, 35, 35, 0, 0, Math.PI * 2);
  ctx.fill();
  // Neck
  ctx.fillStyle = '#92400e';
  ctx.fillRect(340, 50, 40, 200);

  // Strings
  const strings = [
    { x: 348, color: '#fbbf24', freq: state.freq, amp: state.amp * 0.6 },
    { x: 354, color: '#f59e0b', freq: state.freq * 1.2, amp: state.amp * 0.5 },
    { x: 360, color: '#d97706', freq: state.freq * 0.8, amp: state.amp * 0.7 },
    { x: 366, color: '#fbbf24', freq: state.freq * 1.5, amp: state.amp * 0.4 },
    { x: 372, color: '#f59e0b', freq: state.freq * 0.6, amp: state.amp * 0.8 },
  ];

  strings.forEach(s => {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let y = 60; y <= 380; y += 2) {
      const progress = (y - 60) / 320;
      const envelope = Math.sin(progress * Math.PI);
      const dx = Math.sin(t * s.freq * 3 + y * 0.05) * s.amp * envelope * 0.3;
      if (y === 60) ctx.moveTo(s.x + dx, y);
      else ctx.lineTo(s.x + dx, y);
    }
    ctx.stroke();
  });

  // Wave ripples from sound hole
  for (let i = 0; i < 4; i++) {
    const r = 50 + i * 30 + (t * 40) % 30;
    const alpha = Math.max(0, 0.4 - i * 0.1 - ((t * 40) % 30) / 100);
    ctx.strokeStyle = `rgba(251,191,36,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(360, 340, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Label
  ctx.fillStyle = '#c4b5fd';
  ctx.font = '16px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('拨动琴弦 → 弦振动 → 产生声波', 360, 470);

  // Frequency indicator
  drawFreqIndicator(100, 80, state.freq, state.amp);
}

function drawDrum() {
  // Drum body
  const grad = ctx.createLinearGradient(260, 200, 260, 420);
  grad.addColorStop(0, '#dc2626');
  grad.addColorStop(1, '#991b1b');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(360, 400, 120, 40, 0, 0, Math.PI);
  ctx.fillRect(240, 250, 240, 150);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(360, 250, 120, 40, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fbbf24';
  ctx.fill();

  // Drum skin vibration
  const vibrateOffset = Math.sin(t * state.freq * 4) * state.amp * 0.5;
  ctx.fillStyle = `rgba(251,191,36,${0.5 + Math.sin(t * state.freq * 4) * 0.3})`;
  ctx.beginPath();
  ctx.ellipse(360, 250 + vibrateOffset * 0.3, 110, 35 + Math.abs(vibrateOffset) * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Drumsticks
  const stickAngle = Math.sin(t * state.freq * 4) * 0.3;
  ctx.save();
  ctx.translate(360, 180);
  ctx.rotate(stickAngle);
  ctx.fillStyle = '#d4a574';
  ctx.fillRect(-4, -80, 8, 80);
  ctx.beginPath();
  ctx.arc(0, -80, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#f5f5dc';
  ctx.fill();
  ctx.restore();

  // Sound waves
  for (let i = 0; i < 5; i++) {
    const r = 130 + i * 25 + (t * 50) % 25;
    const alpha = Math.max(0, 0.35 - i * 0.07);
    ctx.strokeStyle = `rgba(251,191,36,${alpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.arc(360, 250, r, -Math.PI * 0.8, -Math.PI * 0.2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = '#c4b5fd';
  ctx.font = '16px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('敲击鼓面 → 鼓面振动 → 声音传出', 360, 470);

  drawFreqIndicator(100, 80, state.freq, state.amp);
}

function drawVocal() {
  // Head silhouette
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.ellipse(360, 180, 80, 100, 0, 0, Math.PI * 2);
  ctx.fill();
  // Neck
  ctx.fillRect(330, 270, 60, 80);
  // Body
  ctx.beginPath();
  ctx.ellipse(360, 420, 120, 80, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  // Vocal cords (inside throat)
  const vOff = Math.sin(t * state.freq * 5) * state.amp * 0.15;
  ctx.strokeStyle = '#ec4899';
  ctx.lineWidth = 4;
  // Left cord
  ctx.beginPath();
  ctx.moveTo(330, 300);
  ctx.quadraticCurveTo(350 + vOff, 310, 360, 300 + vOff * 0.5);
  ctx.stroke();
  // Right cord
  ctx.beginPath();
  ctx.moveTo(390, 300);
  ctx.quadraticCurveTo(370 - vOff, 310, 360, 300 + vOff * 0.5);
  ctx.stroke();

  // Glow at vocal cords
  const glowAlpha = 0.3 + Math.abs(Math.sin(t * state.freq * 5)) * 0.4;
  ctx.fillStyle = `rgba(236,72,153,${glowAlpha})`;
  ctx.beginPath();
  ctx.ellipse(360, 305, 20 + Math.abs(vOff), 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Sound waves coming from mouth
  const mouthY = 210;
  for (let i = 0; i < 5; i++) {
    const r = 30 + i * 22 + (t * 45) % 22;
    const alpha = Math.max(0, 0.4 - i * 0.08);
    ctx.strokeStyle = `rgba(6,182,212,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(360, mouthY, r, -Math.PI * 0.6, -Math.PI * 0.4 + Math.PI * 2);
    ctx.stroke();
  }

  // Labels
  ctx.fillStyle = '#ec4899';
  ctx.font = '13px "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('← 声带振动', 420, 310);
  ctx.fillStyle = '#06b6d4';
  ctx.fillText('← 声波传出', 420, 200);

  ctx.fillStyle = '#c4b5fd';
  ctx.font = '16px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('气流通过声带 → 声带振动 → 发出声音', 360, 470);

  drawFreqIndicator(100, 80, state.freq, state.amp);
}

function drawFreqIndicator(x, y, freq, amp) {
  // Small sine wave indicator
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 80; i++) {
    const px = x + i;
    const py = y + Math.sin(t * freq * 2 + i * 0.15) * amp * 0.4;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.fillStyle = '#fbbf24';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`频率档位=${freq}`, x, y - 30);
  ctx.fillText(`A=${amp}`, x, y - 16);
}

function initPropagate() {

function initParticles() {
  particles = [];
  const cols = 28, rows = 16;
  const spacingX = W / (cols + 1);
  const spacingY = (H - 80) / (rows + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      particles.push({
        baseX: spacingX * (c + 1),
        baseY: 60 + spacingY * (r + 1),
        x: spacingX * (c + 1),
        y: 60 + spacingY * (r + 1),
        size: state.medium === 'solid' ? 5 : state.medium === 'water' ? 4 : 3,
      });
    }
  }
}

function drawPropagate() {
  ctx.clearRect(0, 0, W, H);

  // Medium background
  if (state.medium === 'water') {
    ctx.fillStyle = 'rgba(6,182,212,0.05)';
    ctx.fillRect(0, 0, W, H);
  } else if (state.medium === 'solid') {
    ctx.fillStyle = 'rgba(148,163,184,0.06)';
    ctx.fillRect(0, 0, W, H);
    // Grid lines
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  // Sound source
  const srcX = 80, srcY = H / 2;
  const pulseR = 15 + Math.sin(t * 6) * 5;
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.arc(srcX, srcY, pulseR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(srcX, srcY, 8, 0, Math.PI * 2);
  ctx.fill();

  // Sound wave rings from source
  const speed = state.medium === 'solid' ? 4 : state.medium === 'water' ? 2.5 : 1.5;
  for (let i = 0; i < 6; i++) {
    const r = ((t * speed * 60 + i * 50) % 350);
    const alpha = Math.max(0, 0.5 - r / 400);
    ctx.strokeStyle = `rgba(6,182,212,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(srcX, srcY, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Update particles
  const dampFactor = state.medium === 'solid' ? 0.95 : state.medium === 'water' ? 0.8 : 0.6;
  particles.forEach(p => {
    const dx = p.baseX - srcX;
    const dy = p.baseY - srcY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);

    // Wave displacement
    const wavePhase = dist * 0.03 - t * speed * 3;
    const displacement = Math.sin(wavePhase) * 8 * Math.exp(-dist * 0.003) * dampFactor;

    p.x = p.baseX + Math.cos(angle) * displacement;
    p.y = p.baseY + Math.sin(angle) * displacement;

    // Color based on compression/rarefaction
    const compression = Math.cos(wavePhase);
    let color;
    if (compression > 0.3) color = `rgba(239,68,68,${0.4 + compression * 0.4})`;
    else if (compression < -0.3) color = `rgba(59,130,246,${0.4 + Math.abs(compression) * 0.3})`;
    else color = `rgba(148,163,184,0.3)`;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Labels
  ctx.fillStyle = '#f59e0b';
  ctx.font = '13px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('声源', srcX, srcY + 35);

  const speedLabel = state.medium === 'solid' ? '~5960 m/s' : state.medium === 'water' ? '~1480 m/s' : '~343 m/s';
  const mediumLabel = state.medium === 'solid' ? '钢铁（纵波）' : state.medium === 'water' ? '淡水（20°C）' : '空气（20°C）';
  ctx.fillStyle = '#06b6d4';
  ctx.font = '14px "PingFang SC", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`介质: ${mediumLabel}`, W - 30, 30);
  ctx.fillText(`声速: ${speedLabel}`, W - 30, 50);

  // Legend
  ctx.textAlign = 'left';
  ctx.font = '12px "PingFang SC", sans-serif';
  ctx.fillStyle = 'rgba(239,68,68,0.8)';
  ctx.fillText('● 密部（分子挤压）', 30, H - 30);
  ctx.fillStyle = 'rgba(59,130,246,0.7)';
  ctx.fillText('● 疏部（分子散开）', 200, H - 30);
}

    <div class="slider-row">

    </div>
    <div class="slider-row">
      <label for="volSlider">振幅（示意）</label>
      <input type="range" min="5" max="70" step="5" value="${state.volumeAmp}" id="volSlider" />

    <div class="meter-wrap">
      <div class="meter-label">🎵 音调表</div>
      <div class="meter-bar"><div class="meter-fill pitch-fill" id="pitchMeter" style="width:${state.pitchFreq / 8 * 100}%"></div></div>
    </div>
    <div class="meter-wrap">

      <button class="inst-btn" data-inst="bird"><span class="emoji">🐦</span>鸟叫<br><small>高音调 · 较轻</small></button>
      <button class="inst-btn" data-inst="bass"><span class="emoji">🎸</span>低音吉他<br><small>低音调 · 较沉</small></button>

function drawPitchVolume() {
  ctx.clearRect(0, 0, W, H);
  const mode = state.pvMode || 'pitch';

  // Draw waveform
  const midY = H / 2;
  const freq = state.pitchFreq;
  const amp = state.volumeAmp;

  // Background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let y = 50; y < H - 50; y += 40) {
    ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(W - 40, y); ctx.stroke();
  }
  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.moveTo(60, midY); ctx.lineTo(W - 40, midY); ctx.stroke();

  // Wave
  ctx.strokeStyle = mode === 'pitch' ? '#ec4899' : '#10b981';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 60; x < W - 40; x++) {
    const progress = (x - 60) / (W - 100);
    const y = midY + Math.sin(progress * freq * Math.PI * 2 - t * 4) * amp;
    if (x === 60) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Amplitude indicator
  ctx.strokeStyle = 'rgba(251,191,36,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(60, midY - amp); ctx.lineTo(W - 40, midY - amp); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60, midY + amp); ctx.lineTo(W - 40, midY + amp); ctx.stroke();
  ctx.setLineDash([]);

  // Amplitude arrow
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40, midY); ctx.lineTo(40, midY - amp); ctx.stroke();
  ctx.fillStyle = '#fbbf24';
  ctx.font = '12px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('振幅', 40, midY + 18);
  ctx.fillText(`${amp}`, 40, midY - amp - 8);

  // Wavelength indicator
  const waveLen = (W - 100) / freq;
  if (waveLen > 30 && waveLen < 400) {
    const startX = 60;
    ctx.strokeStyle = '#06b6d4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX, midY + amp + 30);
    ctx.lineTo(startX + waveLen, midY + amp + 30);
    ctx.stroke();
    // Arrows
    ctx.beginPath(); ctx.moveTo(startX, midY + amp + 25); ctx.lineTo(startX, midY + amp + 35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(startX + waveLen, midY + amp + 25); ctx.lineTo(startX + waveLen, midY + amp + 35); ctx.stroke();
    ctx.fillStyle = '#06b6d4';
    ctx.fillText('波长 λ', startX + waveLen / 2, midY + amp + 48);
  }

  // Labels
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '14px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`频率档位: ${freq} → 音调${freq > 4 ? '较高 🔺' : '较低 🔻'}`, W / 2, 30);
  ctx.fillText(`振幅: ${amp} → 响度${amp > 35 ? '大 🔊' : '小 🔈'}`, W / 2, 52);

  // Pitch scale at bottom
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(60, H - 50, W - 100, 20);
  const pitchGrad = ctx.createLinearGradient(60, 0, W - 40, 0);
  pitchGrad.addColorStop(0, '#3b82f6');
  pitchGrad.addColorStop(1, '#ec4899');
  ctx.fillStyle = pitchGrad;
  ctx.fillRect(60, H - 50, (W - 100) * (freq / 8), 20);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '11px "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('低沉', 65, H - 36);
  ctx.textAlign = 'right';
  ctx.fillText('尖锐', W - 45, H - 36);

  // Moving dots on wave
  for (let i = 0; i < 5; i++) {
    const px = 60 + ((t * 80 + i * (W - 100) / 5) % (W - 100));
    const progress = (px - 60) / (W - 100);
    const py = midY + Math.sin(progress * freq * Math.PI * 2 - t * 4) * amp;
    ctx.fillStyle = 'rgba(251,191,36,0.8)';
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initQuiz() {
  controls.innerHTML = '';
  dragHint.textContent = '';
  if (!state.quizAnswers) {
    state.quizIdx = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.quizFinished = false;
    state.quizAnswers = Array(quizzes.length).fill(null);
  }
  if (state.quizFinished) showQuizResult(); else renderQuiz();
}

function restartSoundQuiz() {
  quizAttempted.clear(); quizFirstTryCorrect.clear();
  state.quizAnswers = null;
  initQuiz();
}

function renderQuiz() {
  const q = quizzes[state.quizIdx];
  panel.innerHTML = `
    <h3>📝 知识小测验</h3>
    <div class="quiz">
      <div class="quiz-q">第 ${state.quizIdx + 1}/${quizzes.length} 题：${q.q}</div>
      <div class="quiz-opts" id="quizOpts">
        ${q.opts.map((o, i) => `<button class="quiz-opt" data-idx="${i}">${String.fromCharCode(65 + i)}. ${o}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-nav">
        <button id="quizPrev" ${state.quizIdx === 0 ? 'disabled' : ''}>← 上一题</button>
        <button id="quizNext">${state.quizIdx === quizzes.length - 1 ? '看结果' : '下一题 →'}</button>
      </div>
    </div>
    <div style="margin-top:14px;font-size:14px;color:#94a3b8;">
      得分：<span id="quizScoreLabel" style="color:#fbbf24;font-weight:700;">${state.quizScore}</span> / ${quizzes.length}
    </div>
  `;

  state.quizAnswered = state.quizAnswers[state.quizIdx] !== null;

  function showSelection(idx) {
    const options = document.querySelectorAll('.quiz-opt');
    options[q.ans].classList.add('correct');
    if (idx !== q.ans) options[idx].classList.add('wrong');
    options.forEach((opt, i) => {
      opt.disabled = true;
      opt.setAttribute('aria-pressed', String(i === idx));
    });
    document.getElementById('quizFeedback').textContent = (idx === q.ans ? '✅ 正确！' : '❌ 不对哦。') + q.explain;
  }
  if (state.quizAnswered) showSelection(state.quizAnswers[state.quizIdx]);

  document.querySelectorAll('.quiz-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      if (state.quizAnswered) return;
      state.quizAnswered = true;
      const idx = +opt.dataset.idx;
      state.quizAnswers[state.quizIdx] = idx;
      const correct = idx === q.ans;
      const qIdx = state.quizIdx;
      if (!quizAttempted.has(qIdx)) {
        quizAttempted.add(qIdx);
        if (correct) quizFirstTryCorrect.add(qIdx);
      }
      if (correct) {
        state.quizScore++;
      }
      maybeMarkDone();
      document.getElementById('quizScoreLabel').textContent = state.quizScore;
      showSelection(idx);
    });
  });

  document.getElementById('quizPrev').onclick = () => {
    if (state.quizIdx > 0) { state.quizIdx--; renderQuiz(); }
  };
  document.getElementById('quizNext').onclick = () => {
    if (state.quizIdx < quizzes.length - 1) { state.quizIdx++; renderQuiz(); }
    else { showQuizResult(); }
  };

  drawQuizCanvas();
}

function drawQuizCanvas() {
  ctx.clearRect(0, 0, W, H);

  // Decorative sound waves
  for (let i = 0; i < 8; i++) {
    const r = 50 + i * 35;
    const alpha = 0.15 - i * 0.015;
    ctx.strokeStyle = `rgba(139,92,246,${Math.max(0, alpha)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r + Math.sin(t * 2 + i) * 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Musical notes floating
  const notes = ['🎵', '🎶', '🎼', '♪', '♫'];
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < 8; i++) {
    const x = 100 + (i * 80 + t * 20) % (W - 100);
    const y = H / 2 + Math.sin(t * 1.5 + i * 1.2) * 120;
    ctx.globalAlpha = 0.3 + Math.sin(t + i) * 0.2;
    ctx.fillText(notes[i % notes.length], x, y);
  }
  ctx.globalAlpha = 1;

  // Center icon
  ctx.font = '64px serif';
  ctx.fillText('🔊', W / 2, H / 2 + 20);

  ctx.fillStyle = '#c4b5fd';
  ctx.font = '18px "PingFang SC", sans-serif';
  ctx.fillText('声音的奥秘 · 知识测验', W / 2, H - 40);
}

function showQuizResult() {
  state.quizFinished = true;
  const pct = Math.round(state.quizScore / quizzes.length * 100);
  let emoji, msg;
  if (pct >= 80) { emoji = '🏆'; msg = '太棒了！你是声音小专家！'; }
  else if (pct >= 60) { emoji = '👍'; msg = '不错！继续加油！'; }
  else { emoji = '💪'; msg = '再复习一下吧，你可以的！'; }

  panel.innerHTML = `
    <h3>🏆 测验结果</h3>
    <div style="text-align:center;padding:30px 0;">
      <div style="font-size:64px;margin-bottom:16px;">${emoji}</div>
      <div style="font-size:2rem;font-weight:700;color:#fbbf24;margin-bottom:8px;">${state.quizScore} / ${quizzes.length}</div>
      <div style="font-size:1.1rem;color:#94a3b8;margin-bottom:20px;">正确率 ${pct}%</div>
      <div style="font-size:1rem;color:#c4b5fd;line-height:1.8;">${msg}</div>
    </div>
    <div class="concept-box">
      <b>📖 知识回顾：</b><br>
      1. 声音由<span class="hl">振动</span>产生<br>
      2. 声音需要<span class="hl2">介质</span>传播；声速取决于材料和条件<br>
      3. <span class="hl3">音调</span>由频率决定<br>
      4. <span class="hl4">响度</span>与振幅等因素有关<br>
      5. 真空中<span class="hl">不能</span>传播声音
    </div>
    <div style="text-align:center;margin-top:16px;">
      <button onclick="restartSoundQuiz()" style="padding:10px 24px;border-radius:12px;border:none;cursor:pointer;font-size:15px;background:var(--primary);color:white;font-weight:500;">🔄 再来一次</button>
    </div>
  `;

  drawQuizCanvas();
}

// ═══════════════════════════════════════
// INIT & ANIMATION LOOP
// ═══════════════════════════════════════
function initTab() {
  if (animId) cancelAnimationFrame(animId);
  t = 0;
  if (currentTab === 'vibrate') initVibrate();
  else if (currentTab === 'propagate') initPropagate();
  else if (currentTab === 'pitch-volume') initPitchVolume();
  else if (currentTab === 'quiz') initQuiz();
  const labels = {vibrate:'声音产生的振动示意', propagate:'声音传播的粒子示意', 'pitch-volume':'音调和响度的波形示意', quiz:'声音知识测验示意'};
  canvas.setAttribute('aria-label', labels[currentTab]);
  if (animationPaused) drawCurrent(); else loop();
}

function drawCurrent() {
  if (currentTab === 'vibrate') drawVibrate();
  else if (currentTab === 'propagate') drawPropagate();
  else if (currentTab === 'pitch-volume') drawPitchVolume();
  else if (currentTab === 'quiz') drawQuizCanvas();
}
function loop() {
  t += 0.016;
  drawCurrent();
  animId = requestAnimationFrame(loop);
}
panel.addEventListener('input', () => { if (animationPaused) drawCurrent(); });
panel.addEventListener('click', () => { if (animationPaused && currentTab !== 'quiz') drawCurrent(); });
controls.addEventListener('click', () => { if (animationPaused) drawCurrent(); });

// Handle resize
function resize() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const w = rect.width - 32;
  const ratio = 500 / 720;
  canvas.style.width = w + 'px';
  canvas.style.height = (w * ratio) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Start
updateDoneMark();
initTab();
</script>
