name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run static checks
        run: npm run check:static
      - name: Verify browser project coverage
        run: npm run check:browser-projects
      - name: Run all-page browser smoke
        run: npm run test:browser:smoke
      - name: Run release artifact checks
        run: npm run test:release
      - name: Save browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-interactions:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser interaction checks
        run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Save browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    runs-on: ubuntu-26.04
    needs: [core-checks, browser-interactions]
    if: ${{ always() }}
    timeout-minutes: 2
    steps:
      - name: Require every quality job to succeed
        env:
          CORE_RESULT: ${{ needs.core-checks.result }}
          BROWSER_RESULT: ${{ needs.browser-interactions.result }}
        run: |
          set -eu
          printf 'core-checks=%s browser-interactions=%s\n' "$CORE_RESULT" "$BROWSER_RESULT"
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success

  build-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - name: Check whether this is still the current main commit
        id: head
        run: bash scripts/check_release_head.sh
      - name: Configure GitHub Pages
        if: steps.head.outputs.current == 'true'
        uses: actions/configure-pages@v6
      - name: Build verified site artifact
        if: steps.head.outputs.current == 'true'
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/knowledge-visual-site"
      - name: Verify release provenance
        if: steps.head.outputs.current == 'true'
        run: |
          python3 -c 'import json, os, pathlib; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "knowledge-visual-site/release-version.json"; v = json.loads(p.read_text()); assert v["revision"] == os.environ["GITHUB_SHA"] and v["site_files_modified"] is False, "release does not match this commit"'
      - name: Upload Pages artifact
        if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/knowledge-visual-site

  deploy:
    needs: build-release
    if: needs.build-release.outputs.current == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify this is still the current main commit
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify deployed revision and resources
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/verify_published_site.py --base-url "$SITE_URL" --expected-revision "$GITHUB_SHA"
      - name: Verify published gravitation learning page
        env:
          KV_PUBLISHED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test tests/browser/published-live-site.spec.js --workers=1 --retries=2
      - name: Save browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: published-browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
